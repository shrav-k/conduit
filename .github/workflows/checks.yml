# The repository's checks, as AGENTS.md lists them, run on ubuntu-latest on each pull request
# and push to main. The macOS jobs run in nightly.yml. This public repository uses standard
# GitHub-hosted runners. Ruling 64, point 3, allows nothing that costs credits.
# Nothing here uses a larger runner, a paid service or a secret.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the run still going for it. Each push to main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify pinned gitleaks
        shell: bash
        run: |
          scanner_version=8.24.2
          scanner_archive="gitleaks_${scanner_version}_linux_x64.tar.gz"
          scanner_checksums="gitleaks_${scanner_version}_checksums.txt"
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          cd "$scanner_dir"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${scanner_version}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release_url/$scanner_archive" --output "$scanner_archive"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release_url/$scanner_checksums" --output "$scanner_checksums"
          awk -v archive="$scanner_archive" '$2 == archive { print; found++ } END { if (found != 1) exit 1 }' \
            "$scanner_checksums" > archive.sha256
          sha256sum --check --strict archive.sha256
          # The release's own checksums catch a broken download; this pin also catches a replaced asset.
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  $scanner_archive" \
            | sha256sum --check --strict
          tar -xzf "$scanner_archive" gitleaks
      - name: Scan added commits
        shell: bash
        env:
          SCAN_EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$SCAN_EVENT" = pull_request ]; then
            # The first parent is the base; include every commit the merge adds.
            scan_range="HEAD^1..HEAD"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            # A newly created main has no previous tip: scan all reachable commits.
            scan_range="$PUSH_AFTER"
          else
            scan_range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          # Keep raw scanner output temporary, even when redacted; print only locations.
          # Include merge-resolution changes against each merge's first parent.
          scanner_status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --redact \
            --no-banner --log-opts="--diff-merges=first-parent $scan_range" --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks/findings.json" \
            > "$RUNNER_TEMP/gitleaks/scan.log" 2>&1 || scanner_status=$?
          SCANNER_STATUS="$scanner_status" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"]) / "gitleaks"
          report = temp / "findings.json"
          findings = json.loads(report.read_text()) if report.exists() else []
          for finding in findings:
              print(f"{finding['RuleID']} {finding['File']}:{finding['StartLine']}")
          status = int(os.environ["SCANNER_STATUS"])
          if status != 0 and not findings:
              # Without -v gitleaks writes no finding text to its log, so its last line holds no secret.
              lines = (temp / "scan.log").read_text(errors="replace").strip().splitlines()
              print(f"gitleaks exited {status} without reporting a finding: the scan did not complete.")
              if lines:
                  print(f"Its last line: {lines[-1]}")
          elif findings:
              print(f"{len(findings)} finding(s) above; values are not printed.")
          PY
          exit "$scanner_status"

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: check_docs.py reads permalinked commits with git cat-file
          persist-credentials: false
      # Some permalinks cite a commit of a pull request's branch that was squashed and deleted;
      # GitHub keeps it only under the pull request's ref.
      - name: Fetch the pull requests' commits
        run: git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The versions AGENTS.md names. The format extras give jsonschema a checker for each
      # format the schema profile names; check_schemas.py's second line says whether it has them.
      - name: Install PyYAML and jsonschema
        run: python3 -m pip install "pyyaml==6.0.1" "jsonschema[format-nongpl]==4.20.0"
      # Each check runs even if one before it failed, so that one run reports every failure.
      - name: python3 tools/check_docs.py
        run: python3 tools/check_docs.py
      - name: python3 tools/set_names.py --check
        if: ${{ !cancelled() }}
        run: python3 tools/set_names.py --check
      - name: python3 tools/check_schemas.py
        if: ${{ !cancelled() }}
        run: python3 tools/check_schemas.py
      - name: python3 tools/check_roadmap.py
        if: ${{ !cancelled() }}
        run: python3 tools/check_roadmap.py
      - name: python3 tools/check_model_account.py --history
        if: ${{ !cancelled() }}
        run: python3 tools/check_model_account.py --history
      # engine/STANDING.md is generated from the promises, the coverage index, the expected
      # failures and the engine's sources (work order 185); it must match what they give.
      - name: python3 tools/promise_standing.py --check
        if: ${{ !cancelled() }}
        run: python3 tools/promise_standing.py --check
      # A repository variable supplies optional private names without a secret or a name
      # written into the workflow. Check tracked bytes without echoing the matched values.
      - name: python3 tools/check_private_paths.py
        if: ${{ !cancelled() }}
        env:
          CONDUIT_PRIVATE_NAMES: ${{ vars.CONDUIT_PRIVATE_NAMES }}
        run: python3 tools/check_private_paths.py
      - name: python3 -m unittest discover -s tools/tests
        if: ${{ !cancelled() && hashFiles('tools/tests/**/*.py') != '' }}
        run: python3 -m unittest discover -s tools/tests
      # On a pull request the checkout is a merge commit whose first parent is the base branch.
      - name: git diff --check (whitespace errors the pull request adds)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: git diff --check HEAD^1 HEAD
      # Every vector change must match a declaration that the pull request adds or changes
      # under docs/work-orders/ (the full review's FR-493, gate 5). It runs on every pull
      # request, since some cases read fixtures under engine/ and spec/.
      - name: python3 tools/vector_delta.py HEAD^1 HEAD --declared-changed
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 tools/vector_delta.py HEAD^1 HEAD --declared-changed
      # Compare decision records and ratchets against the pull request's base.
      - name: python3 tools/check_decisions.py HEAD^1 HEAD
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 tools/check_decisions.py HEAD^1 HEAD

  # Packages and experiments with a Cargo.toml one or two directories down, excluding target/
  # and members built by a workspace above them. The engine builds in its own job.
  # An experiment is evidence, kept as it ran: its tests run, but formatting and
  # clippy, whose rules change with the toolchain, are checked only in engine/ and
  # packages/. A directory listed in macos_only is a probe of macOS itself that cannot compile on
  # Linux, and is listed without being built.
  rust-dirs:
    name: rust directories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: find
        run: |
          macos_only=" experiments/005-macos-keychain "
          entries=()
          for manifest in packages/*/Cargo.toml packages/*/*/Cargo.toml experiments/*/Cargo.toml experiments/*/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            case "$manifest" in */target/*) continue ;; esac
            # Cargo resolves membership, including workspace globs and exclusions, without
            # building or fetching dependencies. Only the workspace root gets an entry.
            workspace_manifest=$(cargo locate-project --workspace --message-format plain --manifest-path "$manifest")
            [ "$workspace_manifest" = "$PWD/$manifest" ] || continue
            dir=${manifest%/Cargo.toml}
            build=true
            case "$macos_only" in *" $dir "*) build=false ;; esac
            lint=true
            case "$dir" in experiments/*) lint=false ;; esac
            entries+=("$(jq -cn --arg dir "$dir" --argjson build "$build" --argjson lint "$lint" '{dir: $dir, build: $build, lint: $lint}')")
          done
          matrix=$(printf '%s\n' "${entries[@]}" | jq -cs .)
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  rust-dir:
    name: rust (${{ matrix.dir }})
    needs: rust-dirs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rust-dirs.outputs.matrix) }}
    # From inside each directory, so that its rust-toolchain.toml applies and its tests find the
    # repository's paths, such as ../spec, where they expect them.
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain that rust-toolchain.toml pins
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup component add rustfmt clippy
          rustup show active-toolchain
          cargo --version
      - name: Restore the cargo cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ matrix.dir }}/target/
          key: cargo-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.dir), format('{0}/rust-toolchain.toml', matrix.dir)) }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.dir }}-
      # Each step runs even if one before it failed, so that one run reports every failure.
      - name: cargo fmt --check
        if: ${{ matrix.lint }}
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        if: ${{ !cancelled() && matrix.build && matrix.lint }}
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test --release
        if: ${{ !cancelled() && matrix.build }}
        run: cargo test --release
      # Saved even when a check failed, so that the next run need not rebuild the dependencies.
      - name: Save the cargo cache
        if: ${{ !cancelled() && matrix.build && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ matrix.dir }}/target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Build the engine independently so a package or experiment cannot skip its results.
  engine-build:
    name: engine build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain that rust-toolchain.toml pins
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup component add rustfmt clippy
          rustup show active-toolchain
          cargo --version
      - name: Restore the cargo cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine/target/
          key: cargo-${{ runner.os }}-engine-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-engine-
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Install the pinned nextest runner
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # Compile engine tests once, then move their executables to the shard runners.
      - name: cargo nextest archive --release
        if: ${{ !cancelled() }}
        run: cargo nextest archive --release --archive-file nextest-archive.tar.zst
      - name: Upload the engine test archive
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-nextest
          path: engine/nextest-archive.tar.zst
          if-no-files-found: error
          compression-level: 0 # nextest already compresses the archive
          retention-days: 1
      # Saved even when a check failed, so that the next run need not rebuild the dependencies.
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine/target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Count partitions are disjoint and together run every enabled test, without retries.
  # The measured run had 9,098 summed test seconds; four partitions held 1,876 to 2,987
  # each. One indivisible test took 658 seconds, limiting the benefit of more runners.
  engine-tests:
    name: engine tests (${{ matrix.shard }}/4)
    needs: engine-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain that rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal
      - name: Install the pinned nextest runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Download the engine test archive
        uses: actions/download-artifact@v4
        with:
          name: engine-nextest
          path: engine
      # Extract into the same checkout layout as the build: tests use compiled-in paths
      # to conduit as well as source paths to spec/ and conformance/.
      - name: Run this engine shard
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst
          --extract-to "$GITHUB_WORKSPACE/engine" --workspace-remap "$GITHUB_WORKSPACE/engine"
          --partition count:${{ matrix.shard }}/4

  # nextest does not run doctests. Reuse the build cache and keep them a separate result.
  engine-doc:
    name: engine doctests
    needs: engine-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain that rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update --profile minimal
      - name: Restore the engine build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            engine/target/
          key: cargo-${{ runner.os }}-engine-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-engine-
      - name: cargo test --release --doc
        run: cargo test --release --doc

  # Repeat changed packages on Linux (the full review's FR-493, gate 7). Use cargo test as
  # rust-dir does: nextest puts tests in separate processes and cannot reproduce faults that
  # need two test threads in one process, such as a forked child's lock or tracing interest.
  changed-packages:
    name: changed packages
    needs: rust-dirs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.select.outputs.dirs }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_DIRS: ${{ needs.rust-dirs.outputs.matrix }}
          DIFF_BASE: HEAD^1
          DIFF_HEAD: HEAD
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Not a pull request ($EVENT_NAME): the repeated runs are skipped."
            echo 'dirs=[]' >> "$GITHUB_OUTPUT"
            echo 'any=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          candidates=$(printf '%s\n' "$RUST_DIRS" | jq -r '.[] | select(.build == true and (.dir | startswith("packages/"))) | .dir' | LC_ALL=C sort -u)
          # Preserve every pathname byte, including Git-quoted characters and newlines.
          # A file keeps git's failure visible; process substitution would hide its status.
          changed_paths=$(mktemp)
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --no-renames --name-only -z "$DIFF_BASE" "$DIFF_HEAD" > "$changed_paths"; then
            echo "::error title=changed packages::git diff $DIFF_BASE $DIFF_HEAD failed, so this step cannot tell which package crates changed; no crate list is set, so the rust gate fails. Repair the cause that git's message above names (the checkout must fetch both commits, with fetch-depth: 2), then rerun the job"
            exit 1
          fi
          root="$PWD/"
          listed=()
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            prefix="$dir/"
            count=0
            while IFS= read -r -d '' path; do
              if [ "${path:0:${#prefix}}" = "$prefix" ]; then
                count=$((count + 1))
              fi
            done < "$changed_paths"
            if ! metadata=$(cargo metadata --no-deps --format-version 1 --manifest-path "$dir/Cargo.toml"); then
              echo "::error title=changed packages::$dir: cargo metadata failed on $dir/Cargo.toml, so its path dependencies are unknown; no crate list is set, so the rust gate fails. Fix the manifest as cargo's message above says, then push again"
              exit 1
            fi
            dependencies=$(printf '%s\n' "$metadata" | jq -r '.packages[].dependencies[] | select(.path != null) | .path' | LC_ALL=C sort -u)
            changed_dependencies=()
            while IFS= read -r dependency; do
              [ -n "$dependency" ] || continue
              if [ "${dependency:0:${#root}}" != "$root" ]; then
                echo "::error title=changed packages::$dir: its path dependency $dependency is outside the repository ($root), so this step cannot tell whether it changed; no crate list is set, so the rust gate fails. Move the dependency into the repository, or name it by version rather than by path"
                exit 1
              fi
              dependency=${dependency#"$root"}
              if [ "$dependency" = "$dir" ] || [ "${dependency:0:${#prefix}}" = "$prefix" ]; then
                continue
              fi
              dependency_prefix="$dependency/"
              while IFS= read -r -d '' path; do
                if [ "${path:0:${#dependency_prefix}}" = "$dependency_prefix" ]; then
                  changed_dependencies+=("$dependency")
                  break
                fi
              done < "$changed_paths"
            done <<< "$dependencies"
            if [ "$count" -gt 0 ] || [ "${#changed_dependencies[@]}" -gt 0 ]; then
              listed+=("$dir")
              if [ "$count" -gt 0 ]; then
                echo "$dir: $count changed file(s) in its directory"
              fi
              for dependency in "${changed_dependencies[@]}"; do
                echo "$dir: its path dependency $dependency changed"
              done
            fi
          done <<< "$candidates"
          if [ "${#listed[@]}" -eq 0 ]; then
            echo 'No package crate changed, nor a path dependency of one: the repeated runs are skipped.'
            echo 'dirs=[]' >> "$GITHUB_OUTPUT"
            echo 'any=false' >> "$GITHUB_OUTPUT"
          else
            dirs=$(printf '%s\n' "${listed[@]}" | jq -Rsc 'split("\n")[:-1]')
            echo "Repeating the tests of ${#listed[@]} package crate(s) five times each."
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
            echo 'any=true' >> "$GITHUB_OUTPUT"
          fi

  package-repeats:
    name: package tests repeated (${{ matrix.dir }})
    needs: changed-packages
    if: ${{ needs.changed-packages.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.changed-packages.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain that rust-toolchain.toml pins
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup show active-toolchain
          cargo --version
      - name: Restore the cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ matrix.dir }}/target/
          key: cargo-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.dir), format('{0}/rust-toolchain.toml', matrix.dir)) }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.dir }}-
      - id: repeat
        name: cargo test --release, five more times
        shell: bash
        env:
          CRATE_DIR: ${{ matrix.dir }}
          CARGO_TERM_COLOR: never
        run: |
          failures=0
          failed_runs=""
          for run in 1 2 3 4 5; do
            log=$(mktemp "$RUNNER_TEMP/package-repeat.XXXXXX")
            echo "::group::run $run of 5: cargo test --release"
            if cargo test --release 2>&1 | tee "$log"; then
              status=0
            else
              status=${PIPESTATUS[0]}
            fi
            echo '::endgroup::'
            if [ "$status" -eq 0 ]; then
              echo "run $run of 5: passed"
            else
              failures=$((failures + 1))
              failed_runs="${failed_runs:+$failed_runs, }$run"
              echo "run $run of 5: failed (exit $status)"
              if ! grep -E '^test .+ \.\.\. FAILED$|^error: ' "$log"; then
                echo "run $run of 5: no failed test was named; see its output above"
              fi
            fi
            rm "$log"
          done
          if [ "$failures" -eq 0 ]; then
            echo "$CRATE_DIR: all 5 repeated runs passed"
          else
            echo "::error title=repeated package tests::$CRATE_DIR: $failures of 5 repeated runs failed (run numbers: $failed_runs)"
            exit 1
          fi

  # One result for all Rust directories, all engine shards, the doctests and the
  # repeated package tests. A skipped or cancelled dependency fails it, so its stable name stays
  # useful; the repeats alone may be skipped, and only when changed packages listed no crate.
  rust:
    name: rust
    needs: [rust-dirs, rust-dir, engine-build, engine-tests, engine-doc, changed-packages, package-repeats]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Rust check passed
        env:
          DIRS: ${{ needs.rust-dirs.result }}
          CHECKS: ${{ needs.rust-dir.result }}
          BUILD: ${{ needs.engine-build.result }}
          SHARDS: ${{ needs.engine-tests.result }}
          DOCTESTS: ${{ needs.engine-doc.result }}
          CHANGED: ${{ needs.changed-packages.result }}
          ANY_CHANGED: ${{ needs.changed-packages.outputs.any }}
          REPEATS: ${{ needs.package-repeats.result }}
        run: |
          echo "rust directories: $DIRS; rust checks: $CHECKS; engine build: $BUILD; shards: $SHARDS; doctests: $DOCTESTS; changed packages: $CHANGED (any: $ANY_CHANGED); repeated package tests: $REPEATS"
          test "$DIRS" = success && test "$CHECKS" = success && test "$BUILD" = success && test "$SHARDS" = success && test "$DOCTESTS" = success &&
            test "$CHANGED" = success &&
            { { test "$ANY_CHANGED" = true && test "$REPEATS" = success; } || { test "$ANY_CHANGED" = false && test "$REPEATS" = skipped; }; }
