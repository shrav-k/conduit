apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: workspace-pool
spec:
  type: github.com/shrav-k/conduit/core#pool.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: shared-directory
spec:
  type: example.org/s1/filesystem#local-directory.v1
  inputs:
    root:
      schema:
        type: string
        minLength: 1
      to:
      - /config/root
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: message-history
spec:
  type: example.org/s1/history#file-history.v1
  inputs:
    root:
      schema:
        type: string
        minLength: 1
      to:
      - /config/root
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-read
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-read-write
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
  - example.org/s1/filesystem#file.write.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: history-post-read
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
  - example.org/s1/filesystem#file.write.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: workspace-admin
spec:
  capability: github.com/shrav-k/conduit/core#pool-management.v1
  operations:
  - github.com/shrav-k/conduit/core#register.v1
  - github.com/shrav-k/conduit/core#register-replacement.v1
  - github.com/shrav-k/conduit/core#inspect.v1
  - github.com/shrav-k/conduit/core#set-up.v1
  - github.com/shrav-k/conduit/core#retire.v1
  - github.com/shrav-k/conduit/core#reconcile.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Agent
metadata:
  name: reader-agent
spec:
  type: example.org/s1/agents#claude-code.v1
  inputs:
    unused-peer:
      schema: {$ref: "github.com/shrav-k/conduit/core#agent-reference.v1"}
      optional: true
      to: [/config/accountServices]
  config:
    accountServices: false
    peerMessaging: false
  conduits:
    project:
      from: directory-read
      target:
        kind: Resource
        name: shared
    history:
      from: history-post-read
      target:
        kind: Resource
        name: history
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Agent
metadata:
  name: writer-agent
spec:
  type: example.org/s1/agents#codex.v1
  config:
    accountServices: false
    peerMessaging: false
  conduits:
    project:
      from: directory-read-write
      target:
        kind: Resource
        name: shared
    history:
      from: history-post-read
      target:
        kind: Resource
        name: history
