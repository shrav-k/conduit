apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: scripted-secret.v1
spec:
  family: Resource
  offers: [github.com/shrav-k/conduit/core#secret-provider.v1]
  implementation:
    github.com/shrav-k/conduit/core#get-secret.v1: '#store-exec'
  records: {inputs: true, outputs: true}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: consumer.v1
spec:
  family: Resource
  offers: ['#probe-capability.v1']
  implementation:
    '#probe.v1': '#consumer-exec'
  schema:
    type: object
    properties:
      source: {$ref: github.com/shrav-k/conduit/core#secret-reference.v1}
      unused:
        anyOf: [{$ref: github.com/shrav-k/conduit/core#secret-reference.v1}, {type: 'null'}]
      directory: {type: string}
    required: [source, unused, directory]
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: probe-capability.v1
spec:
  operations: ['#probe.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: probe.v1
spec:
  inputSchema: {type: object, additionalProperties: false}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: read-filter.v1
spec:
  inputs:
    label:
      schema: {type: string}
