apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: claude-code.v1
spec:
  family: Agent
  schema:
    type: object
    properties:
      accountServices: {type: boolean}
      peerMessaging: {type: boolean}
      model: {type: string, default: ''}
    required: [accountServices, peerMessaging, model]
    additionalProperties: false
  offers: ['#conversation.v1']
  requires: []
  implementation:
    '#turn.v1': '#wrapper'
  records:
    inputs: false
    outputs: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: conversation.v1
spec:
  operations: ['#turn.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: turn.v1
spec:
  startsModelWork: true
  inputSchema:
    type: object
    properties:
      message: {type: string}
    required: [message]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      text: {type: string}
      clientTools:
        type: object
        properties:
          status: {type: string, enum: [reported, not_reported, unavailable]}
          observations:
            type: array
            items:
              type: object
              properties:
                event: {type: integer}
                pointer: {type: string}
                freshness: {type: string, enum: [current, session_init_unverified]}
                reportedNames:
                  type: array
                  items: {type: string}
                names:
                  type: array
                  items: {type: string}
              required: [event, pointer, names, reportedNames, freshness]
              additionalProperties: false
        required: [status, observations]
        additionalProperties: false
    required: [text, clientTools]
    additionalProperties: false
