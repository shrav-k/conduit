apiVersion: github.com/shrav-k/conduit/v0
address: example.org/conduit/agent-codex
version: 0.2.3
exports:
- codex.v1
- codex.v2
- codex-login.v1
- codex.v3
- conversation.v1
- turn.v1
- new-conversation.v1
- turn
- conversation
implementations:
  wrapper:
    implements: ['#turn.v1', '#new-conversation.v1']
    command: [bin/agent-codex]
    environment:
      AGENT_ACCOUNT_SERVICES: /accountServices
      AGENT_PEER_MESSAGING: /peerMessaging
      AGENT_MODEL: /model
    plain: true
    tools:
      '#turn.v1': turn
      '#new-conversation.v1': new-conversation
  wrapper-v2:
    implements:
    - '#turn.v1'
    - '#new-conversation.v1'
    - 'github.com/shrav-k/conduit/core#retire-hook.v1'
    - 'github.com/shrav-k/conduit/core#account-hook.v1'
    - 'github.com/shrav-k/conduit/core#sign-out-hook.v1'
    - 'github.com/shrav-k/conduit/core#sign-in-hook.v1'
    command: [bin/agent-codex]
    environment:
      AGENT_DIRECTORY: /directory
      AGENT_TURN_DEADLINE_SECONDS: /turnDeadlineSeconds
      AGENT_EFFORT: /effort
      AGENT_ACCOUNT_SERVICES: /accountServices
      AGENT_MODEL: /model
    plain: true
    tools:
      '#turn.v1': turn
      '#new-conversation.v1': new-conversation
      'github.com/shrav-k/conduit/core#retire-hook.v1': retire
      'github.com/shrav-k/conduit/core#account-hook.v1': account
      'github.com/shrav-k/conduit/core#sign-out-hook.v1': sign-out
      'github.com/shrav-k/conduit/core#sign-in-hook.v1': sign-in
  wrapper-v2-path:
    implements:
    - '#turn.v1'
    - '#new-conversation.v1'
    - 'github.com/shrav-k/conduit/core#retire-hook.v1'
    - 'github.com/shrav-k/conduit/core#account-hook.v1'
    - 'github.com/shrav-k/conduit/core#sign-out-hook.v1'
    - 'github.com/shrav-k/conduit/core#sign-in-hook.v1'
    command: [agent-codex]
    environment:
      AGENT_DIRECTORY: /directory
      AGENT_TURN_DEADLINE_SECONDS: /turnDeadlineSeconds
      AGENT_EFFORT: /effort
      AGENT_ACCOUNT_SERVICES: /accountServices
      AGENT_MODEL: /model
    plain: true
    tools:
      '#turn.v1': turn
      '#new-conversation.v1': new-conversation
      'github.com/shrav-k/conduit/core#retire-hook.v1': retire
      'github.com/shrav-k/conduit/core#account-hook.v1': account
      'github.com/shrav-k/conduit/core#sign-out-hook.v1': sign-out
      'github.com/shrav-k/conduit/core#sign-in-hook.v1': sign-in
  login:
    implements:
    - 'github.com/shrav-k/conduit/core#sign-in-hook.v1'
    - 'github.com/shrav-k/conduit/core#account-hook.v1'
    - 'github.com/shrav-k/conduit/core#sign-out-hook.v1'
    - 'github.com/shrav-k/conduit/core#retire-hook.v1'
    command: [bin/agent-codex, --login-resource]
    plain: true
    tools:
      'github.com/shrav-k/conduit/core#sign-in-hook.v1': sign-in
      'github.com/shrav-k/conduit/core#account-hook.v1': account
      'github.com/shrav-k/conduit/core#sign-out-hook.v1': sign-out
      'github.com/shrav-k/conduit/core#retire-hook.v1': retire
  wrapper-v3:
    implements:
    - '#turn.v1'
    - '#new-conversation.v1'
    - 'github.com/shrav-k/conduit/core#setup-hook.v1'
    - 'github.com/shrav-k/conduit/core#retire-hook.v1'
    command: [bin/agent-codex, --shared-login]
    environment:
      AGENT_DIRECTORY: /directory
      AGENT_TURN_DEADLINE_SECONDS: /turnDeadlineSeconds
      AGENT_EFFORT: /effort
      AGENT_ACCOUNT_SERVICES: /accountServices
      AGENT_MODEL: /model
      AGENT_LOGIN_DIRECTORY: /login
    plain: true
    tools:
      '#turn.v1': turn
      '#new-conversation.v1': new-conversation
      'github.com/shrav-k/conduit/core#setup-hook.v1': setup
      'github.com/shrav-k/conduit/core#retire-hook.v1': retire
