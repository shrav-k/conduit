apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: claude-code.v1
  description: Registration-only draft for Claude Code. No implementation is selected and no model
    work starts. Increment 3 supplies the client wrapper, private working directory, isolated configuration
    and disabled-by-default own account services and messaging; these booleans alone run or confine
    nothing.
spec:
  family: Agent
  schema:
    type: object
    properties:
      accountServices:
        type: boolean
      peerMessaging:
        type: boolean
    required:
    - accountServices
    - peerMessaging
    additionalProperties: false
  offers: []
  requires: []
  records:
    inputs: false
    outputs: false
