# Draft provider contracts. Text results remain MCP content, not declared outputs.
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: file.read.v1
  description: Read a UTF-8 file through read_text_file; its text is MCP content.
spec:
  inputSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
    required:
    - path
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.list.v1
  description: List a directory through list_directory; its listing is MCP content.
spec:
  inputSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
    required:
    - path
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: file.write.v1
  description: Write the supplied UTF-8 content at path through write_file, creating or replacing
    the file.
spec:
  inputSchema:
    type: object
    properties:
      path:
        type: string
        minLength: 1
      content:
        type: string
    required:
    - path
    - content
    additionalProperties: false
  effect: Creates or replaces the file at path with content.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: directory.v1
spec:
  operations:
  - '#file.read.v1'
  - '#directory.list.v1'
  - '#file.write.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: local-directory.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      root:
        type: string
        minLength: 1
    required:
    - root
    additionalProperties: false
  offers:
  - '#directory.v1'
  implementation:
    '#file.read.v1': '#filesystem-server'
    '#directory.list.v1': '#filesystem-server'
    '#file.write.v1': '#filesystem-server'
  records:
    inputs: true
    outputs: false
