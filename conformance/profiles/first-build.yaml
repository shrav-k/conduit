{
  "id": "first-build",
  "status": "Runner convention; admin decisions 3, 4 and 7, 2026-11-09",
  "DL2": {
    "contents_digest": "SHA-256 of RFC 8785 canonical operation and default-filled arguments",
    "persistence": "state and records before dispatch"
  },
  "DL15": {
    "suffix_length": 5,
    "alphabet": "abcdefghijklmnopqrstuvwxyz0123456789",
    "collision": "retry"
  },
  "DL4": {
    "unreadable": "unavailable immediately"
  },
  "DL12": {
    "optional_inlining": false
  },
  "DL8": {
    "source": "urn:conduit:first-build",
    "sources": 1,
    "export": "explicit ordered CloudEvents",
    "event_actions": {
      "object-change": [
        "registered",
        "lifecycle-changed",
        "opened",
        "closed",
        "removed",
        "setup-ended",
        "setup-part-reported",
        "template-replaced",
        "records-purged"
      ],
      "enrollment-change": [
        "opened",
        "admitted",
        "refused",
        "expired"
      ]
    },
    "purge": "strictly before the RFC 3339 instant; permanent purge certificates; invocation state and retained outputs unchanged",
    "gaps": "export: gaps/complete; inspection: recordGaps/recordsComplete; all known source gaps shown conservatively",
    "provider_calls": "made and ended; subject is the run instance or machine provider Resource; autonomous list-machines calls have no invocation/caller and no outputs; enroll endings omit action and message; no request route or serving",
    "inspection": "required id/revision/packages/declared/status/records; exact ordered records and unreconciled IDs; requirement implementation references and mediated mode"
  },
  "DL10": {
    "nesting": 128,
    "outputs": "outputs and succeeded plain content retained for the whole vector unless explicit expiry",
    "file_size": null,
    "submission_count": null,
    "archive_size": null
  },
  "DL6": {
    "first_start": "one atomic transaction from empty state",
    "restart": "preserve identities; no repair is inferred"
  },
  "record_types": [
    "access-decision",
    "request-ended",
    "invocation-dispatched",
    "invocation-ended",
    "provider-call",
    "object-change",
    "enrollment-change"
  ],
  "implemented_here": [
    "DL6",
    "DL8",
    "DL10.nesting",
    "DL15",
    "DL7",
    "DL4",
    "DL12",
    "DL2.contents_digest",
    "DL2.persistence_boundary",
    "DL10.outputs"
  ],
  "reserved_for_later_orders": [
    "DL2.shell_persistence"
  ],
  "DL7": {
    "archive_format": "gzip-compressed POSIX USTAR; no GNU or PAX extensions",
    "members": "UTF-8 paths; regular files, directories, symbolic links and hard links to earlier regular files; at most 40 link expansions; last member at a path wins unless it replaces a nonempty directory or uses a non-directory parent",
    "storage": "pure virtual directory retained in state; shell directory URL supplied, never read",
    "cache": "no compressed archive cache",
    "directory_entry_point": "runner supplies bytes; core fetches nothing"
  },
  "D19": {
    "encoding": "compact UTF-8 serde_json of arrays",
    "records": "records array",
    "record_gap_metadata": "record_gaps array, reported separately",
    "invocation_index": "invocations array including held contexts and retained results",
    "growth": "signed byte difference from preceding step; individual invocation byte counts with keyed status and state"
  }
