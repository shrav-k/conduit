apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: message-history
spec:
  type: example.org/s1/history#file-history.v1
  inputs:
    root:
      schema: {type: string, minLength: 1}
      to: [/config/root]
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: history
from: message-history
owner: workspace
arguments:
  root: <lab>/history
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: post-read
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
  - example.org/s1/filesystem#file.write.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: history-a
from: post-read
consumer: {kind: Agent, name: agent-a}
target: {kind: Resource, name: history}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: history-b
from: post-read
consumer: {kind: Agent, name: agent-b}
target: {kind: Resource, name: history}
