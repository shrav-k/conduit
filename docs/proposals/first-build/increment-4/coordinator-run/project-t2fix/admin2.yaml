apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: pool-register
spec:
  capability: github.com/shrav-k/conduit/core#pool-management.v1
  operations:
  - github.com/shrav-k/conduit/core#register.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: root-workspace-register
from: pool-register
consumer: {kind: Interface, name: root}
target: {kind: Pool, name: workspace}
