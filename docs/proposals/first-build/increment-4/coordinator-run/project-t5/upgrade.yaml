apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: directory-2
spec:
  type: example.org/s1/filesystem#local-directory.v1
  inputs:
    root:
      schema: {type: string, minLength: 1}
      to: [/config/root]
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: shared-2
from: directory-2
owner: workspace
arguments:
  root: <lab>/shared
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: read-2
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: read-write-2
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
  - example.org/s1/filesystem#file.write.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: project-a
from: read-write-2
consumer: {kind: Agent, name: agent-a}
target: {kind: Resource, name: shared-2}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: project-b
from: read-2
consumer: {kind: Agent, name: agent-b}
target: {kind: Resource, name: shared-2}
