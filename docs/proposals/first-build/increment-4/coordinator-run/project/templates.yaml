apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: workspace-pool
spec:
  type: github.com/shrav-k/conduit/core#pool.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: directory
spec:
  type: example.org/s1/filesystem#local-directory.v1
  inputs:
    root:
      schema: {type: string, minLength: 1}
      to: [/config/root]
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: read
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
  - example.org/s1/filesystem#file.write.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: read-write
spec:
  capability: example.org/s1/filesystem#directory.v1
  operations:
  - example.org/s1/filesystem#file.read.v1
  - example.org/s1/filesystem#directory.list.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Agent
metadata:
  name: claude-reader
spec:
  type: example.org/conduit/agent-claude-code#claude-code.v1
  config: {accountServices: false, peerMessaging: false}
  conduits:
    project:
      from: read
      target: {kind: Resource, name: shared}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Agent
metadata:
  name: codex-writer
spec:
  type: example.org/conduit/agent-codex#codex.v1
  config: {accountServices: false, peerMessaging: false}
  conduits:
    project:
      from: read-write
      target: {kind: Resource, name: shared}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: claude-turn
spec:
  capability: example.org/conduit/agent-claude-code#conversation.v1
  operations: [example.org/conduit/agent-claude-code#turn.v1]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: codex-turn
spec:
  capability: example.org/conduit/agent-codex#conversation.v1
  operations: [example.org/conduit/agent-codex#turn.v1]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: pool-admin
spec:
  capability: github.com/shrav-k/conduit/core#pool-management.v1
  operations:
  - github.com/shrav-k/conduit/core#register-replacement.v1
  - github.com/shrav-k/conduit/core#inspect.v1
  - github.com/shrav-k/conduit/core#set-up.v1
  - github.com/shrav-k/conduit/core#retire.v1
