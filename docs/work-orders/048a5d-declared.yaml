- name: requests-sign-in-hook-part
  kind: added
  cases: [requests-sign-in-hook-part]
- name: requests-sign-in-plain-hook-part
  kind: added
  cases: [requests-sign-in-plain-hook-part]
- name: the sign-in hook part, four completions inserted after the account checks that count as no account, the later steps moved
  kind: input
  cases: [requests-sign-in-account-first]
  paths: ['/steps/*']
- name: the sign-in hook part, the account checks now dispatch the hook, and the moved steps' expectations
  kind: expectation
  cases: [requests-sign-in-account-first]
  paths: ['/steps/*']
- name: the sign-in hook part, the account checks' outcomes now pending, and the moved steps' reasons and outcomes
  kind: flip
  cases: [requests-sign-in-account-first]
  paths: ['/steps/*']
- name: the sign-in hook part, a completion of the plain hook inserted after each unknown account check, the later steps moved
  kind: input
  cases: [requests-keyed-hook-dispatch]
  paths: ['/steps/*']
- name: the sign-in hook part, the unknown account checks now dispatch the plain hook, and the moved steps' expectations
  kind: expectation
  cases: [requests-keyed-hook-dispatch]
  paths: ['/steps/*']
- name: the sign-in hook part, the unknown account checks' outcomes now pending, and the moved steps' reasons and outcomes
  kind: flip
  cases: [requests-keyed-hook-dispatch]
  paths: ['/steps/*']
- name: the sign-in hook part, a completion of the hook inserted after the failed account check of sign-in.v1, the later step moved
  kind: input
  cases: [requests-sign-in-setup-check-failed-hook]
  paths: ['/steps/*']
- name: the sign-in hook part, the failed account check of sign-in.v1 now dispatches the hook, and the moved step's expectation
  kind: expectation
  cases: [requests-sign-in-setup-check-failed-hook]
  paths: ['/steps/*']
- name: the sign-in hook part, the failed account check's outcome now pending, and the moved step's reasons and outcomes
  kind: flip
  cases: [requests-sign-in-setup-check-failed-hook]
  paths: ['/steps/*']
