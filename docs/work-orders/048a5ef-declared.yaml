# Order 048a-5ef's vector changes, written with the order against main at c097ec81 and the texts of orders 207, 209, 048a-5d and 048a-5d2; at its dispatch refresh the coordinator noted that vector_delta.py compares the worktree with HEAD, which holds the work of 209, 048a-5d and 048a-5d2 whether they have merged or this order starts from 048a-5d2's round-1 branch, so the shapes are this order's alone.
- name: requests-sign-in-url-relayed
  kind: added
  cases: [requests-sign-in-url-relayed]
- name: requests-sign-in-polling
  kind: added
  cases: [requests-sign-in-polling]
- name: a URL that passes is relayed, so a declining retry is inserted after its step where a later step needs that sign-in ended, the later steps moved one place
  kind: input
  cases: ['requests-sign-in-*', requests-keyed-hook-dispatch]
