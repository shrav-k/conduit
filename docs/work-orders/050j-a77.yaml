  - number: 2
    severity: must
    decision: 5. Serve the sign-in tool and browser helper
    file: packages/agent-claude-code/src/main.rs
    line: 60
    problem: The wrapper starts login and returns URL elicitation even when the
      tool request lacks the URL elicitation capability.
    evidence: spec/interface/implementation.yaml:1271–1273 says a server must “rely
      on no capability that a request does not declare” and answer with error -32021
      and `data.requiredCapabilities` when it needs one. src/main.rs:43–65 checks
      return input and arguments, then calls `session.sign_in()` without checking
      that capability. The success request in tests/wrapper.rs:3375–3377 and 3433–3437
      supplies only the tool name and arguments.
    fix: Check the request’s URL elicitation capability before launching the client.
      Answer with -32021 and the required capability when absent. Test both a capable
      request and an incapable request that leaves no login record.
    judgment:
      accepted: true
      reason: null
      severity: should
      class: null
      fault: per-request URL elicitation capability not checked before the login
        starts
  - number: 3
    severity: must
    decision: 4. Start and watch the client's redirect login
    file: packages/agent-claude-code/src/sign_in.rs
    line: 252
    problem: Starting sign-in can erase the Agent’s existing client home, including
      its stored login.
    evidence: src/lib.rs:221–230 canonicalizes the home and accepts any directory
      below the state directory. src/sign_in.rs:248–256 derives the capture path
      with `.join(CAPTURE_NAME)` and immediately calls `fs::remove_dir_all(&capture)`.
      If the accepted home already resolves to that capture path, the hook deletes
      and later removes the home itself. The order at line 632 calls for a new directory
      beside the home.
    fix: Create an exclusively owned capture directory inside the state directory.
      Preserve existing directories and refuse any overlap with the canonical client
      home. Cover an accepted in-state home that resolves to the capture path.
    judgment:
      accepted: true
      reason: null
      severity: should
      class: null
      fault: capture directory may overlap the client home
  - number: 4
    severity: must
    decision: 4. Start and watch the client's redirect login
    file: packages/agent-claude-code/src/sign_in.rs
    line: 267
    problem: The hook can accept a URL that arrives after its deadline.
    evidence: src/sign_in.rs:265–285 checks for the capture file before checking
      `Instant::now() >= until` and sleeps for a full `POLL` between iterations.
      If the file appears after the deadline while the hook is asleep, the next
      iteration can return that URL. The order at lines 636–642 says the hook waits
      “at most 30 seconds” and fails if no URL arrives in time.
    fix: Bound each poll by the remaining time and give the deadline precedence
      over a late capture. Add a delayed-handoff test alongside the silent-client
      case.
    judgment:
      accepted: true
      reason: null
      severity: nit
      class: null
      fault: a URL at most one poll late is accepted
  - number: 5
    severity: must
    decision: 4. Start and watch the client's redirect login
    file: packages/agent-claude-code/src/sign_in.rs
    line: 292
    problem: If the login leader exits before the hook returns, surviving members
      of its process group can escape the hook’s failure cleanup.
    evidence: src/sign_in.rs:267–277 detects the exit with `child.try_wait()`. Cleanup
      at lines 292–295 calls `signal_group(group, start, libc::SIGKILL, true)` and
      then kills the individual child. With `require_leader` true, src/lib.rs:911–915
      refuses the group signal after the leader has been reaped. The order at lines
      640–642 says the hook “stops the login's own group” on this failure.
    fix: Use a PID-reuse-safe cleanup path that can stop the login group after its
      leader exits, while leaving other groups running. Check it with a scripted
      login whose leader exits and leaves a group member alive.
    judgment:
      accepted: true
      reason: null
      severity: should
      class: null
      fault: group survivors after the login leader exits
