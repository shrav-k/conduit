- name: the .v2 Types hold no apiKey, so no sample's value gains a null apiKey
  kind: expectation
  cases: [agents-v2-defaults]
  paths: ['/steps/[23]/expect/reply/samples/[02356]/value/apiKey']
  operation: remove
  before: null
- name: a null account with a key is refused, since apiKey is not a member
  kind: expectation
  cases: [agents-v2-defaults]
  paths: ['/steps/[23]/expect/reply/samples/1/valid']
  operation: replace
  before: true
  after: false
- name: a null account alone is accepted, since the oneOf is gone
  kind: expectation
  cases: [agents-v2-defaults]
  paths: ['/steps/[23]/expect/reply/samples/3/valid']
  operation: replace
  before: false
  after: true
- name: the case's title names no API key
  kind: metadata
  cases: [agents-v2-defaults]
  paths: [/title]
  operation: replace
  after: Installed Agent v2 defaults, a required account of string or null, and no API key
- name: the 0.2.0 fixture's .v2 schemas hold no apiKey and no oneOf
  kind: fixture
  cases: [agents-v2-defaults]
  paths:
  - conformance/fixtures/install-archives/agents-0.2.0.tar.gz
  - conformance/language/packages/agents-v2-defaults/install.json
  - conformance/language/packages/agents-v2-defaults/claude-code.v2-values.json
  - conformance/language/packages/agents-v2-defaults/codex.v2-values.json
