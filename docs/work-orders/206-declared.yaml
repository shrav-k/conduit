# Order 206's vector changes, written with the order and run against its work in a scratch copy of main at d891543f.
- name: three load steps whose login the sign-in-login.v1 schema now refuses are added
  kind: input
  cases: [contracts-sign-in-logins]
  paths: ['/files/redirect-path-*.json', /files/page-user-information.json, '/steps/2[789]/input/*']
  operation: add
- name: each added step is rejected
  kind: flip
  cases: [contracts-sign-in-logins]
  paths: ['/steps/2[789]/expect/accepted']
  operation: add
  after: false
- name: each added step expects one SUB-005 diagnostic at a pattern of sign-in-login.v1
  kind: expectation
  cases: [contracts-sign-in-logins]
  paths: ['/steps/2[789]/expect/diagnostics/0/*', '/steps/2[789]/expect/diagnostic_facts/0/*']
  operation: add
- name: the three fixtures of the added steps
  kind: fixture
  cases: [contracts-sign-in-logins]
  paths:
  - conformance/language/contracts/sign-in-logins/redirect-path-query.json
  - conformance/language/contracts/sign-in-logins/redirect-path-fragment.json
  - conformance/language/contracts/sign-in-logins/page-user-information.json
  operation: add
