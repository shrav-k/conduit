- name: Decision 1 ends the account check unknown at step 22
  kind: expectation
  cases: [requests-keyed-hook-dispatch]
  paths:
    - '/steps/21/expect/record_facts/0/data/invocation'
    - '/steps/21/expect/record_facts/0/data/outcome'
    - '/steps/21/expect/record_facts/0/type'
  operation: add
- name: Decision 1 moves the account check's ending record out of step 23
  kind: expectation
  cases: [requests-keyed-hook-dispatch]
  paths:
    - '/steps/22/expect/record_facts/0/data/invocation'
    - '/steps/22/expect/record_facts/0/data/outcome'
    - '/steps/22/expect/record_facts/0/type'
  operation: remove
- name: Decision 1 makes the account check's discovery answer at step 23 late
  kind: expectation
  cases: [requests-keyed-hook-dispatch]
  paths: ['/steps/22/expect/reply/ignored']
  operation: add
  after: true
