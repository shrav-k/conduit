- name: the Codex package copy and pins move to 0.2.3
  kind: fixture
  cases: [registration-live-agents]
  paths:
  - conformance/language/registration/live-agents/fixture.json
  - engine/examples/s1/conduit.yaml
  - conformance/fixtures/agents/agent-codex/conduit.yaml
  - conformance/fixtures/agents/agent-codex/contracts.yaml
  - conformance/fixtures/agents/agent-codex/contracts.tar.gz
- name: the Codex archive moves to 0.2.3 in registration-agent-v2-packages
  kind: fixture
  cases: [registration-agent-v2-packages]
  paths:
  - conformance/fixtures/agents/agent-codex/contracts.tar.gz
  - conformance/language/registration/agent-v2-packages/codex-install.json
- name: the Codex archive moves to 0.2.3 in registration-agent-v2-account-binding
  kind: fixture
  cases: [registration-agent-v2-account-binding]
  paths:
  - conformance/fixtures/agents/agent-codex/contracts.tar.gz
  - conformance/language/registration/agent-v2-account-binding/codex-install.json
  - conformance/language/registration/agent-v2-account-binding/conduit.json
- name: the installed Codex package version moves to 0.2.3
  kind: expectation
  operation: replace
  cases: [registration-agent-v2-packages, registration-agent-v2-account-binding]
  paths: ['/steps/*/expect/state/installed_packages/*/package/version']
  before: '0.2.2'
  after: '0.2.3'
- name: the installed Codex package digest moves with the version
  kind: expectation
  operation: replace
  cases: [registration-agent-v2-packages, registration-agent-v2-account-binding]
  paths: ['/steps/*/expect/state/installed_packages/*/package/digest']
- name: the Codex package documents end with two Types
  kind: expectation
  operation: add
  cases: [registration-agent-v2-packages]
  paths:
  - '/steps/*/expect/reply/package/project/documents/7/kind'
  - '/steps/*/expect/reply/package/project/documents/8/kind'
  after: Type
- name: the login Resource Type's name
  kind: expectation
  operation: add
  cases: [registration-agent-v2-packages]
  paths: ['/steps/*/expect/reply/package/project/documents/7/metadata/name']
  after: codex-login.v1
- name: the shared-login Agent Type's name
  kind: expectation
  operation: add
  cases: [registration-agent-v2-packages]
  paths: ['/steps/*/expect/reply/package/project/documents/8/metadata/name']
  after: codex.v3
