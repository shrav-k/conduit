- name: the Claude Code package copy and pins move to 0.2.3
  kind: fixture
  cases: [registration-live-agents]
  paths:
  - conformance/language/registration/live-agents/fixture.json
  - engine/examples/s1/conduit.yaml
  - conformance/fixtures/agents/agent-claude-code/conduit.yaml
  - conformance/fixtures/agents/agent-claude-code/contracts.yaml
  - conformance/fixtures/agents/agent-claude-code/contracts.tar.gz
- name: the Claude Code archive moves to 0.2.3 in registration-agent-v2-packages
  kind: fixture
  cases: [registration-agent-v2-packages]
  paths:
  - conformance/fixtures/agents/agent-claude-code/contracts.tar.gz
  - conformance/language/registration/agent-v2-packages/claude-code-install.json
- name: the Claude Code archive moves to 0.2.3 in registration-agent-v2-account-binding
  kind: fixture
  cases: [registration-agent-v2-account-binding]
  paths:
  - conformance/fixtures/agents/agent-claude-code/contracts.tar.gz
  - conformance/language/registration/agent-v2-account-binding/claude-code-install.json
  - conformance/language/registration/agent-v2-account-binding/conduit.json
- name: the installed Claude Code package version moves to 0.2.3
  kind: expectation
  operation: replace
  cases: [registration-agent-v2-packages, registration-agent-v2-account-binding]
  paths: ['/steps/*/expect/state/installed_packages/*/package/version']
  before: '0.2.2'
  after: '0.2.3'
- name: the installed Claude Code package digest moves with the version
  kind: expectation
  operation: replace
  cases: [registration-agent-v2-packages, registration-agent-v2-account-binding]
  paths: ['/steps/*/expect/state/installed_packages/*/package/digest']
- name: the Claude Code package documents end with two Types
  kind: expectation
  operation: add
  cases: [registration-agent-v2-packages]
  paths:
  - '/steps/*/expect/reply/package/project/documents/7/kind'
  - '/steps/*/expect/reply/package/project/documents/8/kind'
  after: Type
- name: the login Resource Type's name
  kind: expectation
  operation: add
  cases: [registration-agent-v2-packages]
  paths: ['/steps/*/expect/reply/package/project/documents/7/metadata/name']
  after: account-home.v1
- name: the shared-login Agent Type's name
  kind: expectation
  operation: add
  cases: [registration-agent-v2-packages]
  paths: ['/steps/*/expect/reply/package/project/documents/8/metadata/name']
  after: claude-code.v3
