# The first build (ruling 46): one codebase, a pure core and a thin shell.
# Increment 2 adds the pure core and the conformance runner.
# Increment 3 adds the durable shell and its conduit command.
[workspace]
members = ["crates/loader", "crates/core", "crates/conformance", "crates/shell"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
