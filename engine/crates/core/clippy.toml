{ path = "std::time::SystemTime::now", reason = "the core reads no clock: the time arrives in Evidence.time" },
{ path = "std::time::Instant::now", reason = "the core reads no clock: the time arrives in Evidence.time" },
# chrono's now exists only when another member of the workspace, the shell, turns on chrono's
# clock feature; allow-invalid keeps a check of this crate alone free of warnings.
{ path = "chrono::Utc::now", reason = "the core reads no clock: the time arrives in Evidence.time", allow-invalid = true },
{ path = "chrono::Local::now", reason = "the core reads no clock: the time arrives in Evidence.time", allow-invalid = true },
