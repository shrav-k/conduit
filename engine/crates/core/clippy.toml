{ path = "std::io::stdin", reason = "the core neither prints nor reads a terminal: it returns its results and diagnostics to the shell" },
{ path = "std::io::stdout", reason = "the core neither prints nor reads a terminal: it returns its results and diagnostics to the shell" },
{ path = "std::io::stderr", reason = "the core neither prints nor reads a terminal: it returns its results and diagnostics to the shell" },
]

