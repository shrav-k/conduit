# Threads
{ path = "std::thread::spawn", reason = "the core starts no thread, sleeps for nothing and reads no machine fact: the shell runs the work and passes machine evidence in" },
{ path = "std::thread::scope", reason = "the core starts no thread, sleeps for nothing and reads no machine fact: the shell runs the work and passes machine evidence in" },
{ path = "std::thread::sleep", reason = "the core starts no thread, sleeps for nothing and reads no machine fact: the shell runs the work and passes machine evidence in" },
