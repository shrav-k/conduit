[package]
name = "real-client-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
ring = "0.17"
rmcp = { version = "=3.9.0", features = ["transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tempfile = "3"
