[package]
name = "native-launch-harness"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "native-launch-harness"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
real-client-harness = { path = "../008-real-client" }
rmcp = { version = "=3.9.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"

[[bin]]
name = "scripted-client"
path = "tests/fixtures/client.rs"
