[package]
name = "scr-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
rmcp = { version = "=3.9.0", features = ["client", "transport-io", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
rmcp = { version = "=3.9.0", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
