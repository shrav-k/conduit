[package]
name = "provider-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "scripted-provider"
path = "tests/fixtures/provider.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
serde_yaml = "0.9"
rmcp = { version = "=3.9.0", features = ["client", "transport-io"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
regex = "1"
jsonschema = { version = "0.46", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
