apiVersion: github.com/shrav-k/conduit/v0
address: example.org/conduit/agent-claude-code
version: 0.2.0
exports:
- claude-code.v1
- claude-code.v2
- conversation.v1
- turn.v1
implementations:
  wrapper:
    implements: ['#turn.v1']
    command: [bin/agent-claude-code]
    environment:
      AGENT_ACCOUNT_SERVICES: /accountServices
      AGENT_PEER_MESSAGING: /peerMessaging
      AGENT_MODEL: /model
    plain: true
    tools:
      '#turn.v1': turn
  wrapper-v2:
    implements: ['#turn.v1']
    command: [bin/agent-claude-code]
    environment:
      AGENT_DIRECTORY: /directory
      AGENT_TURN_DEADLINE_SECONDS: /turnDeadlineSeconds
      AGENT_EFFORT: /effort
      AGENT_ACCOUNT_SERVICES: /accountServices
      AGENT_MODEL: /model
      AGENT_PEER_MESSAGING: /peerMessaging
    plain: true
    tools:
      '#turn.v1': turn
