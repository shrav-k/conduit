apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: claude-code.v1
  description: >-
    Runs an explicit native-client conversation. The client's own account services,
    messaging and machine tools are off by default: shell, code execution, browser,
    other-Agent, hook and plugin reach is disabled. Access through Conduit is mediated,
    not OS isolation. Only the selected peer tools may be enabled by peerMessaging;
    accountServices opts into account connectors.
spec:
  family: Agent
  schema:
    type: object
    properties:
      accountServices: {type: boolean}
      peerMessaging: {type: boolean}
      model: {type: string, default: ''}
    required: [accountServices, peerMessaging, model]
    additionalProperties: false
  offers: ['#conversation.v1']
  requires: []
  implementation:
    '#turn.v1': '#wrapper'
  records:
    inputs: false
    outputs: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: conversation.v1
spec:
  operations: ['#turn.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: turn.v1
spec:
  startsModelWork: true
  inputSchema:
    type: object
    properties:
      message: {type: string}
    required: [message]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      text: {type: string}
      clientTools:
        type: object
        properties:
          status: {type: string, enum: [reported, not_reported, unavailable]}
          observations:
            type: array
            items:
              type: object
              properties:
                event: {type: integer}
                pointer: {type: string}
                freshness: {type: string, enum: [current, session_init_unverified]}
                reportedNames:
                  type: array
                  items: {type: string}
                names:
                  type: array
                  items: {type: string}
              required: [event, pointer, names, reportedNames, freshness]
              additionalProperties: false
        required: [status, observations]
        additionalProperties: false
    required: [text, clientTools]
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: claude-code.v2
  description: >-
    Runs an explicit native-client conversation in the directory that `directory` names, or in
    a private directory of the run's own when it is null. With ownTools true, the default, the
    client's own tools are on: Bash, Read, Edit, Write, Glob, Grep and WebFetch, which give
    shell, code execution, file edits and network, with permission prompts off. They run as the
    engine's operating-system user and nothing confines them. They reach every file, process,
    network address, credential and signed-in account that user can reach: the engine's store,
    root's client token, this run's token, the user's git and cloud credentials, and the user's
    own client logins with their connectors and apps. That reach does not pass through
    Conduit: no Conduit grants, limits or records it (ruling 70). The client's sub-agent,
    scheduling, hook and plugin tools stay off. claude.ai connectors follow accountServices,
    and so does WebSearch when ownTools is true; SendMessage, ListAgents and RemoteTrigger
    follow peerMessaging. The shell can still reach the same services and the user's browser
    and desktop, so accountServices false shapes only the client's tool list. With ownTools
    false the client has claude-code.v1's tools. A turn longer than turnDeadlineSeconds fails
    and ends the conversation, and the engine's call timeout
    (`conduit serve --call-timeout-seconds`) must be longer.
spec:
  family: Agent
  schema:
    type: object
    properties:
      ownTools: {type: boolean, default: true}
      directory: {type: [string, 'null'], default: null}
      turnDeadlineSeconds: {type: integer, minimum: 1, maximum: 604800, default: 180}
      effort: {type: string, default: ''}
      accountServices: {type: boolean, default: false}
      model: {type: string, default: ''}
      peerMessaging: {type: boolean, default: false}
    required: [ownTools, directory, turnDeadlineSeconds, effort, accountServices, model, peerMessaging]
    additionalProperties: false
  offers: ['#conversation.v1']
  requires: []
  implementation: {'#turn.v1': '#wrapper-v2'}
  records: {inputs: false, outputs: false}
