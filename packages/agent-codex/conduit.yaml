apiVersion: github.com/shrav-k/conduit/v0
address: example.org/conduit/agent-codex
version: 0.1.0
exports:
- codex.v1
- conversation.v1
- turn.v1
implementations:
  wrapper:
    implements: ['#turn.v1']
    command: [bin/agent-codex]
    environment:
      AGENT_ACCOUNT_SERVICES: /accountServices
      AGENT_PEER_MESSAGING: /peerMessaging
      AGENT_MODEL: /model
    plain: true
    tools:
      '#turn.v1': turn
