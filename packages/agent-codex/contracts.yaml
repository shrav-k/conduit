    '#turn.v1': '#wrapper-v5'
    '#new-conversation.v1': '#wrapper-v5'
    'github.com/shrav-k/conduit/core#setup-hook.v1': '#wrapper-v5'
    'github.com/shrav-k/conduit/core#retire-hook.v1': '#wrapper-v5'
    '#history.v1': '#wrapper-v5'
  records: {inputs: false, outputs: false}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: history-reading.v1
spec:
  operations: ['#history.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: history.v1
  description: >-
    Read this Agent's recorded turns, oldest first, without starting a client or model work.
    History keeps the caller's message and final text as written. It discards tool calls,
    tool results, file reads and their contents, and usage limits even when the client stream
    carries them.
    since excludes indices through that value and defaults to 0. count limits the page to
    1 through 50 turns and defaults to 20. latest is the highest index kept, or 0 when there
    are no turns. A turn is running while this run serves it, completed when it returns final
    text, failed for any other reply, or interrupted if its end was not kept and this run is
    no longer serving it. To read a running entry again, set since to one below its index.
spec:
  startsModelWork: false
  inputSchema:
    type: object
    properties:
      since: {type: integer, minimum: 0, default: 0}
      count: {type: integer, minimum: 1, maximum: 50, default: 20}
    required: []
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      turns:
        type: array
        maxItems: 50
        items:
          type: object
          properties:
            index: {type: integer, minimum: 1}
            invocation: {type: [string, 'null']}
            caller: {type: [string, 'null']}
            message: {type: string}
            text: {type: [string, 'null']}
            state: {type: string, enum: [running, completed, failed, interrupted]}
            startedAt: {type: string, format: date-time}
            endedAt: {type: [string, 'null'], format: date-time}
          required: [index, invocation, caller, message, text, state, startedAt, endedAt]
          additionalProperties: false
      latest: {type: integer, minimum: 0}
    required: [turns, latest]
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: history
spec:
  capability: '#history-reading.v1'
  operations: ['#history.v1']
