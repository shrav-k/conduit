apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: codex.v5
  description: >-
    Runs an explicit native-client conversation in the directory that `directory` names, or in
    a private directory of the run's own when it is null. When the configuration names a directory,
    the client's own tools are on: shell, code execution, file edits and network, with the
    client's sandbox and approval prompts off. On the engine's own runner, they run as the
    engine's operating-system user and nothing confines them in v0. They reach every file,
    process, network address, credential and
    signed-in account that user can reach: the engine's store, root's client token, this run's
    token, the user's git and cloud credentials, and the user's own client logins with their
    connectors and apps. That reach does not pass through Conduit: no Conduit grants, limits or
    records it (ruling 70). On the login Resource's node, the engine's own runner supplies
    the Agent's state directory and the login Resource's directory (PRV-029).
    The client's own browser, desktop-control, goal, image-generation,
    hook and plugin tools stay off, and so do its multi-agent features, although Codex
    still offers its collaboration tools. Apps follow accountServices, and so does hosted
    search when a directory is named. The shell can still reach the same services and the user's
    browser and desktop, so accountServices false shapes only the client's tool list. With
    directory null the client has codex.v1's tools and sandbox. A turn longer than
    turnDeadlineSeconds fails and ends the conversation, and the engine's call timeout
    (`conduit serve --call-timeout-seconds`) must be longer.
    Its login is its login Resource's, linked into the Agent's own state directory.
    The wrapper keeps each turn's message, final text, invocation, caller and times, with
    its index and state, in the state directory until the retire hook removes the history.
    Configuration refusals, including the home and login-directory checks, and turns after
    the retire hook leave no entry. History keeps the message and final text as written.
    It keeps no separate tool calls or results, file reads or their contents, reasoning, usage,
    usage limits, failure text, other client output, credentials, environment or configuration
    values, or paths.
    The retire hook stops the client, removes the history and empties the home without logging out.
    The wrapper adds instructions to the client's own as developer instructions.
    outputSchema is the JSON text of a JSON Schema whose type is object, constrains the final
    response, and the turn returns the parsed object in structured.
spec:
  family: Agent
  schema:
    type: object
    properties:
      directory: {type: [string, 'null'], default: null}
      turnDeadlineSeconds: {type: integer, minimum: 1, maximum: 604800, default: 180}
      effort: {type: string, default: ''}
      accountServices: {type: boolean, default: false}
      model: {type: string, default: ''}
      login: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      instructions: {type: [string, 'null'], minLength: 1, maxLength: 21841, default: null}
      outputSchema: {type: [string, 'null'], minLength: 1, maxLength: 32762, default: null}
    required: [directory, turnDeadlineSeconds, effort, accountServices, model, login, instructions, outputSchema]
    additionalProperties: false
  toolsDirectory: {directory: /directory}
  loginResource: {place: /login}
