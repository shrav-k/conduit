apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: codex.v1
  description: >-
    Runs an explicit native-client conversation. The client's own account services,
    messaging and machine tools are off by default: shell, code execution, browser,
    other-Agent, hook and plugin reach is disabled. Access through Conduit is mediated,
    not OS isolation. accountServices enables apps alone; machine features stay off.
    apply_patch in the read-only sandbox and requests for user input remain available.
spec:
  family: Agent
  schema:
    type: object
    properties:
      accountServices: {type: boolean}
      peerMessaging: {type: boolean}
      model: {type: string, default: ''}
    required: [accountServices, peerMessaging, model]
    additionalProperties: false
  offers: ['#conversation.v1']
  requires: []
  implementation:
    '#turn.v1': '#wrapper'
    '#new-conversation.v1': '#wrapper'
  records:
    inputs: false
    outputs: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: conversation.v1
spec:
  operations: ['#turn.v1', '#new-conversation.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: turn.v1
spec:
  startsModelWork: true
  inputSchema:
    type: object
    properties:
      message: {type: string}
    required: [message]
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      text: {type: string}
      clientTools:
        type: object
        properties:
          status: {type: string, enum: [reported, not_reported, unavailable]}
          observations:
            type: array
            items:
              type: object
              properties:
                event: {type: integer}
                pointer: {type: string}
                freshness: {type: string, enum: [current, session_init_unverified]}
                reportedNames:
                  type: array
                  items: {type: string}
                names:
                  type: array
                  items: {type: string}
              required: [event, pointer, names, reportedNames, freshness]
              additionalProperties: false
        required: [status, observations]
        additionalProperties: false
      structured: {type: object}
    required: [text, clientTools]
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: codex.v2
  description: >-
    Runs an explicit native-client conversation in the directory that `directory` names, or in
    a private directory of the run's own when it is null. When the configuration names a directory,
    the client's own tools are on: shell, code execution, file edits and network, with the
    client's sandbox and approval prompts off. On the engine's own runner, they run as the
    engine's operating-system user and nothing confines them in v0. They reach every file,
    process, network address, credential and
    signed-in account that user can reach: the engine's store, root's client token, this run's
    token, the user's git and cloud credentials, and the user's own client logins with their
    connectors and apps. That reach does not pass through Conduit: no Conduit grants, limits or
    records it (ruling 70). Under another runtime provider, these tools run on the machine of
    the instance's node, as the operating-system user and with the limits that its contract
    states. The client's own browser, desktop-control, goal, image-generation,
    hook and plugin tools stay off, and so do its multi-agent features, although Codex
    still offers its collaboration tools. Apps follow accountServices, and so does hosted
    search when a directory is named. The shell can still reach the same services and the user's
    browser and desktop, so accountServices false shapes only the client's tool list. With
    directory null the client has codex.v1's tools and sandbox. Limits on this reach, such as
    allowed hosts or a read-only directory, will come from a confining runtime provider chosen
    with `runtime:` (ruling 75, B2). A turn longer than
    turnDeadlineSeconds fails and ends the conversation, and the engine's call timeout
    (`conduit serve --call-timeout-seconds`) must be longer. When the Agent is retired, its retire
    hook signs the client out of the login it keeps for this Agent's own home, wherever the client
    keeps that login for that directory, and then empties that home.
    Without a login asked for by name, its sign-in starts the client's browser login; the Type
    also states the client's device login.
spec:
  family: Agent
  schema:
    type: object
    properties:
      directory: {type: [string, 'null'], default: null}
      turnDeadlineSeconds: {type: integer, minimum: 1, maximum: 604800, default: 180}
      effort: {type: string, default: ''}
      accountServices: {type: boolean, default: false}
      model: {type: string, default: ''}
      account: {type: [string, 'null']}
    required: [directory, turnDeadlineSeconds, effort, accountServices, model, account]
    additionalProperties: false
  toolsDirectory: {directory: /directory}
  signIn:
    account: /account
    logins:
    - name: browser
      return: redirect
      authorization: 'https://auth.openai.com/oauth/authorize'
      clientId: 'app_EMoamEEZ73f0CkXaXp7hrann'
      redirect: {host: 127.0.0.1, ports: [1455, 1457], path: '/auth/callback'}
      carried: true
      issuer: 'https://auth.openai.com'
    - name: device
      return: device
      authorization: 'https://auth.openai.com/codex/device'
      clientId: 'app_EMoamEEZ73f0CkXaXp7hrann'
  offers: ['#conversation.v1']
  requires:
  - 'github.com/shrav-k/conduit/core#sign-in-hook.v1'
  - 'github.com/shrav-k/conduit/core#account-hook.v1'
  - 'github.com/shrav-k/conduit/core#sign-out-hook.v1'
  - 'github.com/shrav-k/conduit/core#retire-hook.v1'
  implementation:
    '#turn.v1': '#wrapper-v2'
    '#new-conversation.v1': '#wrapper-v2'
    'github.com/shrav-k/conduit/core#retire-hook.v1': '#wrapper-v2'
    'github.com/shrav-k/conduit/core#account-hook.v1': '#wrapper-v2'
    'github.com/shrav-k/conduit/core#sign-out-hook.v1': '#wrapper-v2'
    'github.com/shrav-k/conduit/core#sign-in-hook.v1': '#wrapper-v2'
  records: {inputs: false, outputs: false}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: new-conversation.v1
spec:
  effect: >-
    Ends the Agent's conversation and stops its client, as a failed turn does, and starts a new
    one: the next turn.v1 starts the client with no conversation of the turns before it: it
    resumes no thread or session. Files in the Agent's directory and home stay. The Agent's run
    goes on.
  startsModelWork: false
  destructiveHint: true
  inputSchema:
    type: object
    properties: {}
    additionalProperties: false
  outputSchema:
    type: object
    properties:
      conversation: {type: integer, minimum: 2}
      ended:
        type: object
        properties:
          turns: {type: integer, minimum: 0}
          failed: {type: boolean}
          survivors:
            type: array
            items: {type: integer}
          stopConfirmed: {type: boolean}
        required: [turns, failed, survivors, stopConfirmed]
        additionalProperties: false
    required: [conversation, ended]
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: turn
spec:
  capability: '#conversation.v1'
  operations: ['#turn.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: conversation
spec:
  capability: '#conversation.v1'
  operations: ['#turn.v1', '#new-conversation.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: codex-login.v1
  description: >-
    Keeps one account's Codex login on one machine in the Resource's state directory, for
    its Agents on any plan. Only the Resource's own hooks sign it in and out.
spec:
  family: Resource
  schema:
    type: object
    properties:
      account: {type: string}
    required: [account]
    additionalProperties: false
  signIn:
    account: /account
    logins:
    - name: browser
      return: redirect
      authorization: 'https://auth.openai.com/oauth/authorize'
      clientId: 'app_EMoamEEZ73f0CkXaXp7hrann'
      redirect: {host: 127.0.0.1, ports: [1455, 1457], path: '/auth/callback'}
      carried: true
      issuer: 'https://auth.openai.com'
    - name: device
      return: device
      authorization: 'https://auth.openai.com/codex/device'
      clientId: 'app_EMoamEEZ73f0CkXaXp7hrann'
  requires:
  - 'github.com/shrav-k/conduit/core#sign-in-hook.v1'
  - 'github.com/shrav-k/conduit/core#account-hook.v1'
  - 'github.com/shrav-k/conduit/core#sign-out-hook.v1'
  - 'github.com/shrav-k/conduit/core#retire-hook.v1'
  implementation:
    'github.com/shrav-k/conduit/core#sign-in-hook.v1': '#login'
    'github.com/shrav-k/conduit/core#account-hook.v1': '#login'
    'github.com/shrav-k/conduit/core#sign-out-hook.v1': '#login'
    'github.com/shrav-k/conduit/core#retire-hook.v1': '#login'
  records: {inputs: false, outputs: false}
---
