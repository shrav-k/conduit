[package]
name = "conduit-github"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "github-mcp-stand-in"
path = "tests/fixtures/stand_in.rs"
test = false

[dependencies]
anyhow = "1"
flate2 = "1"
rmcp = { version = "=3.9.0", features = ["server", "transport-io", "client", "transport-child-process"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "process", "signal"] }

[dev-dependencies]
jsonschema = { version = "=0.61.0", default-features = false }
rustix = { version = "1", features = ["process"] }
serde = "1"
serde_yaml = "0.9"
tempfile = "3"
