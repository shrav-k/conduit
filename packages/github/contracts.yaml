apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: repository.v1
spec:
  family: Resource
  offers: ['#repository-reading.v1']
  requires: []
  records: {inputs: true, outputs: false}
  implementation:
    '#issue.read.v1': '#front'
    '#issue.list.v1': '#front'
    '#pull-request.read.v1': '#front'
    '#pull-request.list.v1': '#front'
  schema:
    type: object
    additionalProperties: false
    required: [repository, token]
    properties:
      repository:
        type: string
        pattern: '^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$'
        not: {pattern: '/[.]{1,2}$'}
      token: {$ref: github.com/shrav-k/conduit/core#secret-reference.v1}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: repository-reading.v1
spec:
  operations: ['#issue.read.v1', '#issue.list.v1', '#pull-request.read.v1', '#pull-request.list.v1']
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: issue.read.v1
  description: >-
    Read one issue in the Resource's repository alone.
    The shape of data is the server's.
spec:
  idempotentHint: true
  openWorldHint: true
  inputSchema:
    type: object
    additionalProperties: false
    required: [number]
    properties:
      number: {type: integer, minimum: 1}
  outputSchema:
    type: object
    additionalProperties: false
    required: [data]
    properties:
      data: {type: [object, array]}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: issue.list.v1
  description: >-
    Read the first page of issues in the Resource's repository alone, in the server's default state and order.
    The shape of data is the server's.
spec:
  idempotentHint: true
  openWorldHint: true
  inputSchema:
    type: object
    additionalProperties: false
    required: [limit]
    properties:
      limit: {type: integer, minimum: 1, maximum: 100}
  outputSchema:
    type: object
    additionalProperties: false
    required: [data]
    properties:
      data: {type: [object, array]}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: pull-request.read.v1
  description: >-
    Read one pull request in the Resource's repository alone.
    The shape of data is the server's.
spec:
  idempotentHint: true
  openWorldHint: true
  inputSchema:
    type: object
    additionalProperties: false
    required: [number]
    properties:
      number: {type: integer, minimum: 1}
  outputSchema:
    type: object
    additionalProperties: false
    required: [data]
    properties:
      data: {type: [object, array]}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: pull-request.list.v1
  description: >-
    Read the first page of pull requests in the Resource's repository alone, in the server's default state and order.
    The shape of data is the server's.
spec:
  idempotentHint: true
  openWorldHint: true
  inputSchema:
    type: object
    additionalProperties: false
    required: [limit]
    properties:
      limit: {type: integer, minimum: 1, maximum: 100}
  outputSchema:
    type: object
    additionalProperties: false
    required: [data]
    properties:
      data: {type: [object, array]}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: read
spec:
  capability: '#repository-reading.v1'
  operations: ['#issue.read.v1', '#issue.list.v1', '#pull-request.read.v1', '#pull-request.list.v1']
