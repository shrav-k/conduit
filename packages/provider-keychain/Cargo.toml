[package]
name = "provider-keychain"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = "=3.7.0"

[dev-dependencies]
jsonschema = { version = "=0.61.0", default-features = false }
rmcp = { version = "=3.9.0", features = ["client", "transport-child-process"] }
serde = "1"
serde_yaml = "0.9"
tempfile = "3"
