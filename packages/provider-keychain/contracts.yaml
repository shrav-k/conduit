apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: keychain-secret.v1
  description: >-
    macOS keychain secret store. The locator gives one absolute keychain path and
    the service and account of one generic password item. Each read opens that
    file with user interaction disabled and gives its UTF-8 value through the
    core secret provider capability. The store uses the owner's logged-in session.
    It keeps no persistent state and logs no value. The README gives the operator
    authorization steps and D15 test evidence.
spec:
  family: Resource
  offers: [github.com/shrav-k/conduit/core#secret-provider.v1]
  implementation:
    github.com/shrav-k/conduit/core#get-secret.v1: '#provider'
  records:
    inputs: false
    outputs: false
  schema:
    type: object
    properties:
      keychain:
        type: string
        pattern: '^/'
      service:
        type: string
        minLength: 1
      account:
        type: string
        minLength: 1
    required: [keychain, service, account]
    additionalProperties: false
