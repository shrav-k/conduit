apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: local-directory.v1
  description: >-
    Unix local-directory package source, requiring O_PATH or O_SEARCH directory
    handles (including Linux and macOS). Claims only file, without regard to case,
    for its whole life, with no controls. Owned by system and placed local (PRV-002).
    Once registered it is the engine's only fetcher of file URLs (PRV-013, PRV-017):
    every file install, resolved relative fetches included, must lie under root;
    one root per engine while it stands. Root is an absolute directory. Root and
    the fetch path are canonicalized with every symbolic link followed; the target
    must be inside root by path components and a readable regular file. Directories
    require traversal permission, not directory-listing permission. Accepts at
    most 8388608 bytes (8 MiB), holds the file in memory, and returns RFC 4648
    base64 in archive, about four thirds the byte size (11184812 encoded bytes at
    the limit); probes at most one further byte to detect growth past the bound.
    Returns bytes unchecked, corrupt bytes included; the engine checks
    digest and archive validity (PKG-026). Keeps nothing: no archive cache or
    persistent state. D15: own code in src/lib.rs maps URI, call configuration,
    containment and MCP outcomes; schema copies in src/schemas.rs and schemas.json;
    filesystem resolution, permission checks and reads delegated to Unix, URL
    parsing to url and base64 encoding to base64; persistent state absent, configured
    root and source files owned and retained by operator across stop/restart;
    operator supplies root and pinned archives with read/traverse permissions,
    no credentials or gate setup, manual recovery restores files/permissions.
    Mapping and filesystem reads are observed in direct MCP tests; provider state,
    credentials and gate setup are absent; engine registration, restart and manual
    recovery are untested here.
    README.md records the four fields, code inventory and evidence limits.
spec:
  family: Resource
  offers: [github.com/shrav-k/conduit/core#package-source.v1]
  requires: []
  implementation:
    github.com/shrav-k/conduit/core#fetch-package.v1: '#provider'
  records: {inputs: false, outputs: false}
  schema:
    type: object
    properties:
      schemes: {type: array, minItems: 1, items: {const: file}}
      root: {type: string, pattern: '^/'}
    required: [schemes, root]
    additionalProperties: false
