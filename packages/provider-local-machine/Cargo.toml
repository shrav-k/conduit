[package]
name = "provider-local-machine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
hostname = "0.4"
jsonschema = { version = "=0.61.0", default-features = false }
ring = "0.17"
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
rmcp = { version = "=3.9.0", features = ["client", "transport-child-process"] }
serde = "1"
serde_yaml = "0.9"
