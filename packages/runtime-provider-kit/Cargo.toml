[package]
name = "runtime-provider-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "runtime_provider_kit"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "=0.61.0", default-features = false }
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = "0.7"

[dev-dependencies]
hyper = { version = "1", features = ["client"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = { version = "0.18", default-features = false }
rmcp = { version = "=3.9.0", features = ["client"] }
serde_yaml = "0.9"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
