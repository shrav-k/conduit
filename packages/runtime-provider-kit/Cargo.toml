[package]
name = "runtime-provider-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "runtime_provider_kit"

[dependencies]
async-trait = "0.1"
jsonschema = { version = "=0.61.0", default-features = false }
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "=3.9.0", features = ["client"] }
serde_yaml = "0.9"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
