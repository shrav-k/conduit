[package]
name = "scenario-s2-linear"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
chrono = "0.4"
flate2 = "1"
jsonschema = { version = "=0.61.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }

[dev-dependencies]
rmcp = { version = "=3.9.0", features = ["client", "transport-child-process"] }
s2-linear-stub = { path = "../../experiments/013-s2-shared-login/linear-stub" }
serde = "1"
serde_yaml = "0.9"
tempfile = "3"
