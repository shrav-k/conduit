apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: linear-aware.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      baseUrl: {type: string, format: uri}
      apiKey: {$ref: github.com/shrav-k/conduit/core#secret-reference.v1}
      testClock: {type: string, format: date-time}
    required: [baseUrl, apiKey]
    additionalProperties: false
  offers:
  - example.org/conduit/scenario-s2-linear-restrictions#issue-reading.v1
  - example.org/conduit/scenario-s2-linear-restrictions#issue-writing.v1
  implementation:
    example.org/conduit/scenario-s2-linear-restrictions#read-issue.v1: '#linear'
    example.org/conduit/scenario-s2-linear-restrictions#list-issues.v1: '#linear'
    example.org/conduit/scenario-s2-linear-restrictions#update-issue.v1: '#linear'
