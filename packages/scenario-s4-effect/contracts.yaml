tation"],"additionalProperties":false}},"required":["requiredCapabilities"],"additionalProperties":false}},"required":["code","message","data"],"additionalProperties":false}},"required":["error"],"additionalProperties":false}]}},"required":["call","mode","operation","label","instance","caller","key","invocation","attempt","parts","deduplicated","reply","answer"],"additionalProperties":false}}
