[package]
name = "scenario-s4-hook"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }

[dev-dependencies]
jsonschema = { version = "=0.61.0", default-features = false }
rmcp = { version = "=3.9.0", features = ["client", "transport-child-process"] }
serde_yaml = "0.9"
tempfile = "3"
