# The first build (ruling 46): one codebase, a pure core, the reference model, and a thin shell.
# Increment 2 adds the pure core and the conformance runner.
[workspace]
members = ["crates/loader", "crates/core", "crates/conformance"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
