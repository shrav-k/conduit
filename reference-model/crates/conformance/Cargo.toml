[package]
name = "conduit-conformance"
version = "0.1.0"
description = "The file boundary and portable vector runner of the first build."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
conduit-core = { path = "../core" }
conduit-loader = { path = "../loader" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.61.0", default-features = false }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
