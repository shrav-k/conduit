[package]
name = "conduit-core"
version = "0.1.0"
description = "The pure first-build state machine; every decision cites its promises."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

conduit-loader = { path = "../loader" }
jsonschema = { version = "=0.61.0", default-features = false }
