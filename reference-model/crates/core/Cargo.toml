[package]
name = "conduit-core"
version = "0.1.0"
description = "The pure first-build state machine; every decision cites its promises."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

conduit-loader = { path = "../loader" }
jsonschema = { version = "=0.61.0", default-features = false }
semver = "1"
sha2 = "0.10"
serde_json_canonicalizer = "=0.3.2"
fluent-uri = "=0.4.1"
percent-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
