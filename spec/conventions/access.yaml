# Access: the shared convention that every permission is an open Conduit.
# There is no separate grant object: the access an open Conduit carries is the operations it lists.
# The right to open Conduits is itself an open Conduit, to the `access` Resource. Ownership permits
# nothing.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# Removed: ACC-004 → ACC-003 (ruling 32).
# Removed: ACC-007 → ACC-006 (ruling 32).
# Removed: ACC-010 → LIF-008 (earlier removal accepted) (ruling 39).
# Removed: ACC-013 → CON-022 (ruling 32).
# Removed: ACC-020 → REC-001 and OPS-005 (ruling 32).
# Removed: ACC-021 → REC-001 and OPS-005 (ruling 32).
# Removed: ACC-025 → ACC-033 (ruling 32).
# Removed: ACC-026 → ACC-011 (close and reopen to narrow access); no policy replacement (ruling 41).
# Removed: ACC-031 → ACC-011 (close and reopen to narrow access); no policy replacement (ruling 41).
# Removed: ACC-035 → ACC-011 (close and reopen to narrow access); no policy replacement (ruling 41).
# ACC-040: nothing replaces it (ruling 38).
# ACC-041: nothing replaces it (ruling 38).
# Removed: ACC-042 → ACC-011 (close and reopen to narrow access); no policy replacement (ruling 41).
# Removed: ACC-043 → ACC-011 (close and reopen to narrow access); no policy replacement (ruling 41).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: ACC-001
  layer: convention
  level: must
  when: >-
    A consumer requests an operation on a target, and no open Conduit from that consumer to that
    target lists the operation.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    A record of the refused request exists, and the target's implementation receives no call. A
    request for `get-secret.v1` that an actor makes on its own behalf, or that any instance
    makes as an onward request, reports refused in the same way even where an open Conduit lists
    the operation, under SEC-007: the only request for it that is dispatched is the engine's
    read of a secret, under SEC-010.
  vectors: []

- id: ACC-002
  layer: convention
  level: must
  when: >-
    A request reaches a target.
  then: >-
    The engine's own access decision is made for the target before its implementation is
    invoked.
  observable: >-
    The record of the decision precedes any record of the implementation being invoked, and a
    request that the engine's decision does not permit has no record of invocation. A
    restriction that the implementation applies under IFC-019 is applied after that decision,
    and a reason the implementation then gives under IFC-026 ends the request as IFC-027 states.
  vectors: []

- id: ACC-003
  layer: convention
  level: must
  when: >-
    A Conduit is opened.
  then: >-
    It permits exactly the operations it lists, on its target, and no others, except that a
    request for `get-secret.v1` that an actor makes on its own behalf, or that any instance
    makes as an onward request, is never dispatched through it, under SEC-007. A Conduit that
    lists no operations permits nothing.
  observable: >-
    Inspecting the open Conduit shows the operations it lists. A request for any other operation
    through it reports refused. A Conduit that lists none is ready once it is opened, and every
    request through it reports refused. Through a Conduit that lists `get-secret.v1`, that
    operation is requested only by the engine's read of a secret for the Conduit's consumer,
    under SEC-010, and the engine presents the consumer no tool for it, under IFC-012. From the
    moment its consumer is retired, an open Conduit permits less: only the requests of the
    consumer's retirement, under ACC-039.
  vectors: []

- id: ACC-005
  layer: convention
  level: must
  when: >-
    A setup opens a declared Conduit, under CON-004.
  then: >-
    The part of the setup that opens it is a request for `open.v1` that names that Conduit, sent
    by the instance that sent the request to set up. It is decided under ACC-006 like any other
    request of that instance to open a Conduit: by that instance's own Conduit to `access`.
  observable: >-
    If that instance is not the consumer of an open Conduit to `access` that lists `open.v1` and
    whose bound covers the declared Conduit's target and the operations it lists, the part
    reports refused, the Conduit is not opened and its state is still registered. Where the
    request to set up was an onward request, the Conduit to `access` is one of the instance that
    sent it, and not one of the caller it serves. The same holds where the setup is itself a
    part of a Pool's setup, under POOL-015: the parts of a setup are authorized as the request
    to set up was, by the Conduits of the instance that sent it. A declared Conduit that lists
    `get-secret.v1` is opened only where the root Interface sent the request to set up on its
    own behalf, under SEC-008: for any other instance, and for an onward request of the root
    Interface, the part reports refused.
  vectors: []

- id: ACC-006
  layer: convention
  level: must
  when: >-
    An actor asks to open a Conduit.
  then: >-
    The request is an operation of the `access` Resource. It is dispatched only if the actor is
    the consumer of an open Conduit to `access` that lists the operation and whose bound covers
    the new Conduit's target, as ACC-029 states, and names every operation the new Conduit
    lists. Being the consumer of an open Conduit to the target does not permit it. Where the new
    Conduit is itself one to `access`, ACC-030 states the condition in place of this one. Where
    the new Conduit lists `get-secret.v1`, SEC-008 states a further condition. A request to
    open a Conduit that is already open is decided like any other, changes nothing and has the
    outcome succeeded.
  observable: >-
    An actor with an open Conduit to the target but none to `access` reports refused. A request
    whose target the bound does not cover, or one of whose operations it does not name, reports
    refused, and its result names the bound in `io.github.shrav-k.conduit/restriction`, as
    ACC-029 states. The Conduit is not opened, not even with only the operations that the bound
    names. In each case the Conduit's state is still registered. Where the request is an onward
    request, the Conduit to `access` is one of the instance that sent it, under ACC-016. A
    request to open a Conduit that is already open succeeds because the effect that `open.v1`
    describes has occurred, and it does so whatever has become of the Conduit's consumer: a
    Conduit that was open when its consumer was retired is still open, under ACC-039. The part
    of a setup counts as succeeded in the same case, under CON-004. A request to open a closed
    Conduit names one that no longer exists, under LIF-035, and reports invalid under OPS-029,
    and a request to open a Conduit that is not open and whose consumer is retired reports
    conflict, under CON-031: one whose target is retired is closed already, under CON-008.
  vectors: []

- id: ACC-008
  layer: convention
  level: must
  when: >-
    A request is made through a Conduit.
  then: >-
    It is permitted only if the Conduit lists the operation and every restriction that applies
    permits it, except that a filter judges only a call: a repeat to which a filter applies and
    that is not dispatched, under OPS-009, OPS-012, OPS-032 or OPS-034, is judged by no filter,
    and gives only an outcome already recorded, or reports conflict. No restriction can permit
    what the Conduit does not.
  observable: >-
    Adding a restriction never makes a previously refused request succeed. A request that any
    one applicable restriction forbids reports refused, has no outcome, and nothing of it is
    performed. Whether the Conduit lists the operation is decided by the engine before any call
    to the implementation, under ACC-002. The implementation applies the restrictions it is sent
    under IFC-019, and where one of them forbids the request it performs nothing and answers
    with the reason refused under IFC-026. The result names the restriction that forbade the
    request in `io.github.shrav-k.conduit/restriction`, whether the engine or the implementation
    found it, as IFC-025 states. A filter judges only a call that an implementation receives,
    under IFC-019, so a repeat to which a filter applies and that is not dispatched gives no
    outputs: one of an invocation that succeeded, of an operation that declares no outputs, is
    answered from that outcome under OPS-009 even where the filter would forbid a call now, and
    any other reports conflict, under OPS-032 or OPS-034, or is answered with the state unknown,
    under OPS-012. A repeat to which a filter applies, of an invocation that succeeded, of an
    operation whose contract states no `effect`, that is not a control and whose contract is not
    marked `startsModelWork: true`, is dispatched as a new attempt, under OPS-024, so that its
    filters decide afresh.
  vectors: []

- id: ACC-009
  layer: convention
  level: must
  when: >-
    A request is made through one Conduit, and its consumer is also the consumer of another
    Conduit that carries a restriction: a filter or a bound.
  then: >-
    The restrictions on the other Conduit do not apply. The request is limited by its own
    Conduit's operations and the restrictions on that Conduit and, for an onward request, by the
    filters carried under ACC-017.
  observable: >-
    A request that the other Conduit's filter would forbid is permitted through this Conduit,
    unless one of the restrictions that do apply forbids it.
  vectors: []

- id: ACC-011
  layer: convention
  level: must
  when: >-
    A Conduit is closed.
  then: >-
    All the access it carried ends. None of it remains in force.
  observable: >-
    After the close every request through the Conduit reports refused. The closed Conduit is
    removed, under LIF-035, and its tools are no longer presented to its consumer, under
    IFC-013. A request through it is decided under ACC-001 from the Conduits that are open,
    under ACC-036, and OPS-023 puts refused before invalid, so it reports refused, as a request
    that no Conduit ever permitted does, although the engine still holds the closed Conduit's ID
    in the state of the invocations dispatched through it, under OPS-008, and in its records,
    under LIF-019. A request that names the closed Conduit itself, to open, close or inspect it,
    reports invalid under OPS-029, because it no longer exists. To narrow access, the Conduit is
    closed and a narrower one, which lists fewer operations or applies further filters, is
    opened. A Conduit whose consumer is retired is not closed by that: CON-008 closes it once
    the consumer's shutdown is confirmed, or at once where the consumer is declared lost, and
    ACC-039 says what it permits until it is closed.
  vectors: []

- id: ACC-012
  layer: convention
  level: must
  when: >-
    An actor asks to close a Conduit.
  then: >-
    The request is an operation of the `access` Resource. It is dispatched only if the actor is
    the consumer of an open Conduit to `access` that lists the operation and whose bound covers
    the target of the Conduit to be closed and every operation that Conduit lists. Where the
    Conduit to be closed is itself one to `access`, ACC-030 states the condition in place of
    this one. A Conduit whose consumer is the root Interface is never closed at an actor's
    request, as ACC-024 states: such a request is not dispatched, and reports refused, whoever
    makes it. CON-008 still closes one whose target is retired.
  observable: >-
    An actor with such a Conduit to `access` can close a Conduit it did not open. Any other
    actor reports refused, and the Conduit is as it was. A closed Conduit no longer exists,
    under LIF-035, so a request to close it reports invalid under OPS-029, and a repeat of the
    request that closed it is answered as OPS-009 and OPS-032 state: `close.v1` declares no
    outputs, so OPS-034 does not apply to it.
  vectors: []

- id: ACC-014
  layer: convention
  level: must
  when: >-
    A restriction applies to a request and cannot be evaluated for the requested operation.
  then: >-
    The request reports unavailable, has no outcome, and nothing of it is performed.
  observable: >-
    The record names the restriction and states that it could not be evaluated. Where the engine
    finds this before any call, the request is not dispatched and the target's implementation
    receives no call. Where the implementation finds that it cannot apply a restriction it was
    sent, it performs nothing and answers with the reason unavailable under IFC-026. In both
    cases the result names the restriction in `io.github.shrav-k.conduit/restriction`, as
    IFC-025 states.
  vectors: []

- id: ACC-015
  layer: convention
  level: must
  when: >-
    A request or a hook carries a filter under ACC-017 or ACC-018, and the implementation that
    it would be dispatched to does not state the filter's requirement in `supports`. That
    implementation is the one that the request's target has selected for the operation or, for a
    hook, the one that the hook's own instance has selected for the hook's operation.
  then: >-
    The request is not dispatched, and reports unavailable. A hook that carries such a filter is
    not dispatched, and its part of the setup or the retirement reports unavailable.
  observable: >-
    The result of each such request names the carried filter as the cause, in
    `io.github.shrav-k.conduit/restriction` as IFC-025 states, until the filter is no longer
    carried or the implementation supports its requirement. An implementation supports a
    requirement where it states it in `supports`, under CON-022. An implementation marked
    `plain` states none, under PKG-020. The filters of a request's own Conduit need no such
    check with each request: CON-022 made it when the Conduit was instantiated. A filter that an
    onward request carries was never checked against the onward target, so it is checked here:
    an onward request that carries a filter to a target whose selected implementation is marked
    `plain` reports unavailable, although the Conduit it is made through carries no filter. The
    reason is the one ACC-014 gives for a restriction that cannot be evaluated. A requirement is
    matched against `supports` by its address and its export name, whatever version of its
    package the implementation holds, as CON-022 states. Requests that carry no such filter are
    decided as before. The implementation `engine` of the core package, which implements the
    management verbs, states no `supports`, under MAN-012. So a request for an operation of the
    core package, made of `management`, of `access` or of a Pool, that carries a filter under
    ACC-017 is not dispatched and reports unavailable, whatever the filter would have permitted:
    a restriction is never dropped because the implementation cannot apply it.
  vectors: []

- id: ACC-016
  layer: convention
  level: must
  when: >-
    An instance, while serving an invocation, requests an operation on another target.
  then: >-
    That onward request is permitted only under the instance's own open Conduit to that target.
  observable: >-
    If the instance has no open Conduit to the onward target that lists the operation, the
    onward request reports refused, whatever Conduits the caller is the consumer of. The onward
    request names the invocation it serves in `io.github.shrav-k.conduit/serving`, and one from
    an instance that is not an actor and that names none reports refused. The request the engine
    then sends to the onward target names the instance's own Conduit in
    `io.github.shrav-k.conduit/conduit`.
  vectors: []

- id: ACC-017
  layer: convention
  level: must
  when: >-
    An instance, while serving an invocation, requests an operation on another target.
  then: >-
    The onward request carries the identity of the caller of the invocation it names in
    `io.github.shrav-k.conduit/serving`, and the filters of that invocation: the filters on
    the Conduit that invocation was dispatched through, and the filters that invocation itself
    carried from the invocation it served or, for a hook, from the invocation of `set-up.v1` or
    `retire.v1` that it belongs to. The chain of an invocation is the invocations that it
    serves, directly or through others: an onward request serves the invocation it names, and a
    hook serves the invocation it belongs to. Its effects and returned content are limited by
    those filters.
  observable: >-
    The onward target's record names the original caller. The
    `io.github.shrav-k.conduit/filters` sent to the onward target lists those filters
    beside the filters of the instance's own Conduit. An effect or content that they forbid to
    the caller is not produced or returned, even though the instance's own Conduit would permit
    it. A filter is carried as its Conduit's template states it, which no request changes. A
    hook carries the filters of the invocation it belongs to in the same way, under
    ACC-018. Where the implementation selected by the onward target does not support a filter
    that is carried, the onward request reports unavailable under ACC-015. An onward request is
    dispatched only where each Conduit of its chain is open, under ACC-034, and the consumer of
    none of them is retired, under ACC-039, which excepts the requests of that consumer's own
    retirement. The engine's read of a secret carries none of these filters: it is decided
    by the instance's own Conduit and the filters on it alone, under SEC-011.
  vectors: []

- id: ACC-018
  layer: convention
  level: must
  when: >-
    The engine dispatches a setup hook or a retire hook, under TPL-017 or TPL-018.
  then: >-
    The hook is dispatched to the implementation that its own instance has selected for the
    hook's operation, and is not a request through any Conduit. It carries the filters of
    the invocation of `set-up.v1` or `retire.v1` that it belongs to, as ACC-017 has an onward
    request that serves that invocation carry them, and that implementation applies them as
    IFC-019 states. A request that the implementation makes while serving the hook is an onward
    request, under ACC-016, which names the hook's invocation in
    `io.github.shrav-k.conduit/serving`.
  observable: >-
    The hook itself reaches no other instance, and the `io.github.shrav-k.conduit/filters` it is
    sent holds the filters of the invocation it belongs to, under IFC-018. A filter is
    carried as its Conduit's template states it. A filter on the Conduit through which the setup
    or the retirement was requested, or one that the request for it carried under ACC-017,
    therefore limits the hook and every onward request that serves it. A hook whose
    implementation does not support the requirement of one of those filters, as one marked
    `plain` supports none, is not dispatched, and its part reports unavailable, under ACC-015.
    An implementation that finds it cannot apply a filter it was sent answers unavailable,
    as ACC-014 states. An onward request that serves the hook is made through one of its
    instance's own Conduits and is decided as any other onward request, under ACC-016 and
    ACC-017; during a retirement, ACC-039 permits it through a Conduit whose consumer is
    retired. In this version no hook carries a filter: `set-up.v1`, `retire.v1` and
    `retire-with-resources.v1` are implemented by `engine`, which states no `supports`, under
    MAN-012, so no Conduit through which they are requested applies a filter, under CON-022, and
    a request for one of them that carries a filter under ACC-017 is not dispatched, and reports
    unavailable, under ACC-015. The `io.github.shrav-k.conduit/filters` that a hook is sent
    is therefore an empty list, under IFC-018.
  vectors: []

- id: ACC-019
  layer: convention
  level: must not
  when: >-
    An invocation has ended.
  then: >-
    The engine dispatches a request on its behalf: one that names it in
    `io.github.shrav-k.conduit/serving`, or one that the engine makes itself because of work
    that the invocation's operation arranged, other than the read of a secret that SEC-023 makes
    again, for the caller of the setup that made a connection, once that connection's values are
    lost, and the read of a secret for a provider's run that PRV-026 asks for again once the
    engine has restarted, or the part of it that held that run has stopped, for the caller of
    the setup that last asked for that run.
  observable: >-
    In this version no operation arranges, through the engine, work that outlasts its
    invocation. Once an invocation has ended, a request that names it in
    `io.github.shrav-k.conduit/serving` is not dispatched and reports refused, as IFC-028
    states, whatever Conduits are open then. The engine itself dispatches no request for the
    invocation or for its caller afterwards: no Operation contract carries a mark for work that
    is to start or to run later, under CTR-002, and the engine presents no tool with which an
    implementation could ask for such a start, under IFC-012. Work that is to happen later is
    asked for later, by an actor, through a Conduit that is open then. That request is decided
    when it is made, under ACC-036, like any other, and is recorded for the actor that made it,
    under REC-001. An instance that is not an actor makes a request only to serve an invocation
    that is in progress, under IFC-021 and IFC-028, so it makes no other request once the
    invocations it serves have ended. The engine's read of a secret is made within the setup or
    the retirement that asks for a run or a connection, under SEC-011, and after it only where a
    connection that lasts has lost its values, as after the engine restarts, on its machine or
    on another: SEC-023 then reads again, for the caller of the setup that made the connection,
    as the instance's own Conduit to the secret Resource and the filters on it decide when the
    read is made, so closing that Conduit stops it; or where a provider's run ended with the
    engine, or with the part of it that held the run, and the engine first needs the provider
    again: PRV-026 then asks for the run anew, with reads for the caller of the setup that last
    asked for it, decided in the same way, under SEC-011. None is made when a runtime provider
    restarts a run of its own accord, under PRV-010. An invocation that outlasts its call has
    not ended: IFC-016 says how its result is read, and until it ends its onward requests are
    decided under ACC-016 and ACC-017, like any other. A new attempt is dispatched only for a
    repeat that the caller makes, under IMP-007.
  vectors: []

- id: ACC-022
  layer: convention
  level: must
  when: >-
    The engine has been started for the first time.
  then: >-
    The root Interface's Conduit to `access` has no bound.
  observable: >-
    The root Interface can open a Conduit to any target that is not retired, for any operation
    the target offers, apart from what ACC-032, PRV-004 and SEC-009 rule out, and every bound is
    within its own. A Conduit whose consumer is retired is not opened either, under CON-031. A
    Conduit to `access` that has no bound is unlimited, under ACC-029, and ACC-030 says who may
    open or close another one.
  vectors: []

- id: ACC-023
  layer: convention
  level: must
  when: >-
    An Interface other than the root Interface is instantiated.
  then: >-
    It has no access until a Conduit of which it is the consumer is opened.
  observable: >-
    Every request from the new Interface reports refused until an actor with the right to open
    opens a Conduit for it.
  vectors: []

- id: ACC-024
  layer: convention
  level: must not
  when: >-
    An actor asks to close a Conduit whose consumer is the root Interface.
  then: >-
    The Conduit is closed.
  observable: >-
    The request reports refused under ACC-012, whoever makes it, and the root Interface's
    Conduit stays open.
  vectors: []

- id: ACC-027
  layer: convention
  level: must
  when: >-
    A Conduit is inspected.
  then: >-
    For each restriction on it, the inspection result states whether the restriction is enforced
    or only mediated. A restriction is enforced only where the runtime provider that runs the
    consumer confines it so that it reaches targets only through an enforcement point, as that
    provider's contract states. In this version every restriction is reported as mediated.
  observable: >-
    Each restriction in the inspection result carries one of those two values. A restriction
    is mediated in that it applies to the requests that pass through an enforcement point,
    which in this version is the engine alone. The gate of PRV-025 keeps other callers from a
    target's server, but a consumer that is not confined may still reach by its own means what
    the target's implementation reaches, so the restriction is not enforced. Such confinement
    is opted into through the language, by giving the consumer, as its `runtime` under PRV-006,
    a runtime provider whose contract confines it. This version reports mediated for every
    restriction, whatever the consumer's runtime provider is.
  vectors: []



- id: ACC-028
  layer: convention
  level: must not
  when: >-
    A Pool owns a Resource.
  then: >-
    That ownership permits any request.
  observable: >-
    A Pool is never a caller. An actor whose only open Conduit is to the Pool can use the Pool's
    own operations, and reports refused on every operation of the Resources the Pool owns.
  vectors: []

- id: ACC-029
  layer: convention
  level: must
  when: >-
    A Conduit to `access` carries a bound.
  then: >-
    The bound is a restriction, which the engine applies itself. It names Pools, individual
    targets and operations. Naming a Pool covers the Pool itself and every Resource that Pool
    owns, including those instantiated after the Conduit that carries the bound was opened. An
    individual target is covered when the bound names it.
  observable: >-
    The consumer of a Conduit to `access` whose bound names a Pool can open a Conduit to that
    Pool, and to a Resource instantiated in that Pool afterwards, and reports refused for a
    Resource that another Pool owns unless the bound names that Resource or its Pool. The bound
    is written as the core package's requirement `bound.v1`, applied in the `requirements` of
    the Conduit's template with the arguments `pools`, `targets` and `operations`, each a list
    that is empty where it is left out. The engine applies it itself and never sends it, as it
    does every requirement of the core package, under CON-018. A bound that names nothing covers
    nothing. A Conduit to `access` that applies no `bound.v1` has no bound and is unlimited: it
    covers every target and names every operation. `operations` names each operation by a
    qualified reference: one of an installed package, or one of a submitted project, written
    `address#name` with the address its manifest states, under SUB-008 and MAN-015. Each item is
    data under OBJ-021, compared as a name under ACC-030 and never resolved, so NAM-007 does not
    apply to it, and a project's own documents may name the project's operations there by that
    address; an item that names an operation which no package or project holds covers no
    request. An item is compared when a request is decided, so it covers an operation of a
    package installed after the bound was written whose address and export name are the item's,
    and an operation of a submitted project in every submission at that address, under SUB-008.
    A request that the bound does not cover reports refused and names it, as IFC-025 states. A
    bound does not limit the filters of the Conduits that its consumer opens: it names no
    filter, and a Conduit opened within it applies only the filters that its own template
    applies. So a consumer whose own Conduit to a target applies a filter may open, for itself
    or for another consumer, a Conduit to that target that applies none, as ACC-030 states.
    CON-028 says where a bound may be applied.
  vectors: []

- id: ACC-030
  layer: convention
  level: must
  when: >-
    An actor asks to open or to close a Conduit to `access`, whoever its consumer is, the actor
    itself included.
  then: >-
    The request is dispatched only if that Conduit's bound is within the bound of the actor's
    own Conduit to `access`. A new bound is within an old one when every Pool and every
    individual target it names is covered by the old one, as ACC-029 states, and every operation
    it names is one the old one names. A Conduit that has no bound is within another only if
    that other has none: only an actor whose own Conduit to `access` applies no bound may open
    or close a Conduit to `access` that applies none. A request to open is dispatched only if,
    in addition, every operation of `access` that the new Conduit lists is one that the actor's
    own Conduit to `access` lists. This is the whole condition: the actor's bound need not also
    cover `access` as a target. A right to open is passed on, or opened for oneself, only as it
    is or narrower.
  observable: >-
    A request to open or to close one whose bound is wider reports refused, and so does a
    request to open one that lists an operation of `access` that the actor's own Conduit to
    `access` does not list. An actor that opens a further Conduit to `access` for itself gains
    nothing its first one did not permit. A new bound may name a Resource that the old one
    covers only through its Pool, and may name a Pool only if the old one names that Pool. At
    the moment a Conduit to `access` is opened, its bound covers nothing that the bound of the
    actor that opened it does not cover, and names no operation that bound does not name.
    Closing that actor's own Conduit to `access` afterwards closes none of the Conduits it
    opened for others. A bound limits by Pools, targets and operations, and does not limit the
    filters of the Conduits that its consumer opens, so a right to open trusts its consumer with
    unfiltered access within the bound: it may open, for any consumer, a Conduit that lists any
    operation the bound names, to any target the bound covers, with no filter but those that the
    Conduit's own template applies, the operations of ACC-032 and SEC-008 apart. A Conduit to
    `management` carries no bound, under CON-028, and applies no filter, since `engine`, the
    implementation that serves it, supports none, under CON-022 and MAN-012. So access to
    `management` cannot be narrowed to one template: a Conduit to it that lists `register.v1` or
    `replace.v1` trusts its consumer to register, or to replace, any object that ACC-033
    authorizes against `management` alone, an Agent made from any template among them. A request
    for `replace.v1` hands over the project of its document, with its contracts and its
    manifest, under SUB-009, so a Conduit that lists it trusts its consumer, as one that lists
    `register.v1` does, to choose the contracts and the implementation items of the instances
    made from the template afterwards, every program, package and `remote` URL among them. A
    narrower provisioning, such as registering instances of one approved template and no other,
    goes through a broker: a Resource with a trusted operation whose own contract and
    configuration allow only that, and whose implementation, which is trusted to keep them,
    makes the request as an onward request through the broker's own Conduit to `management`,
    under ACC-016. The actor is then the consumer of a Conduit to the broker that lists that
    operation, and of none to `management`. That Conduit applies no filter, since the onward
    request would carry it, under ACC-017, and an onward request to `management` that carries
    one reports unavailable, under ACC-015. The narrowing is the broker's and not the engine's:
    the broker's own Conduit to `management` is as wide as any.
  vectors: []

- id: ACC-032
  layer: convention
  level: must
  when: >-
    An actor asks for an operation that is reserved to the root Interface, such as declaring a
    node lost, or asks to open a Conduit that lists such an operation and whose consumer is
    not the root Interface.
  then: >-
    A request for a reserved operation is dispatched only if the actor is the root Interface. No
    Conduit opened for another consumer lists such an operation: a request to open one that does
    is not dispatched. A request that is not dispatched for either cause reports refused.
  observable: >-
    Both hold whoever asks: the root Interface itself reports refused where it asks to open, for
    another consumer, a Conduit that lists a reserved operation. An operation is reserved where
    its contract is marked `reservedToRoot: true`. Under CTR-009 only an operation of the core
    package is so marked: `declare-lost.v1` and `purge.v1` are.
  vectors: []

- id: ACC-033
  layer: convention
  level: must
  when: >-
    An actor asks to register, replace, inspect, set up or retire an object, to unregister a
    template or a retired instance, to retire a Pool together with the Resources it owns, to
    install a package, for an operation reserved to the root Interface, to reconcile an
    invocation, to open or close a Conduit, or for a control.
  then: >-
    The request is authorized by an open Conduit from the actor that lists the operation, to the
    target that the first of these rows that fits it names. Each row gives the request, the
    family and state of the object, and the target.
    (1) Registering, with `register.v1`, a Resource whose owner is a Pool that already exists
    and is not retired: `management` and that Pool, each of the two Conduits listing
    `register.v1`.
    (2) Registering any other object with `register.v1`, such as a Resource whose owner is
    retired or is registered in the same submission, the Resources of a Pool's own entries among
    them, and replacing any object with `replace.v1` or unregistering one with `unregister.v1`:
    `management`.
    (3) A request under LIF-009 for a new instance for a nested instantiation,
    `register-replacement.v1`: the targets that row 1 or row 2 gives for registering the
    instance it makes, each Conduit listing `register-replacement.v1` in place of `register.v1`.
    (4) Setting up or retiring a Resource, with `set-up.v1` or `retire.v1`, which name the
    instance in the input `instance`: the Pool that owns it, and none where that Pool is
    retired.
    (5) Setting up or retiring an Agent, an Interface or a Pool, with `set-up.v1` or
    `retire.v1`: `management`.
    (6) Inspecting a Resource with `inspect.v1`: the Pool that owns it, or `management` where
    that Pool is retired.
    (7) Inspecting any other object with `inspect.v1`, an Agent, an Interface, a Pool, a
    Conduit or a template: `management`.
    (8) Retiring a Pool together with the Resources it owns, with `retire-with-resources.v1`,
    the one operation of LIF-021: that Pool.
    (9) Installing a package, and every operation reserved to the root Interface under ACC-032,
    which are operations of `management`: `management`.
    (10) Opening or closing a Conduit: `access`, under ACC-006 and ACC-012.
    (11) A control: the instance itself.
    (12) Reconciling an invocation where the instance that it was dispatched to, or, for an
    invocation of a management verb, the instance that it named, no longer exists: `management`,
    and the reconciliation records the outcome and stores nothing.
    (13) Reconciling any other invocation of a management verb: the target that authorized the
    request being reconciled, or `management` where that target is a retired Pool.
    (14) Reconciling any other invocation, of a control or of any other operation: the Pool that
    owns the instance it was dispatched to, where that instance is a Resource and the Pool is
    not retired, and `management` where it is a Resource whose Pool is retired, an Agent, an
    Interface or a Pool.
    No request is authorized against a retired Pool.
  observable: >-
    An actor with an open Conduit to that target listing the operation is permitted, and any
    other actor reports refused. Except for a control, a Conduit to the object itself, or to any
    other target, does not permit the request. An actor that registers a Resource into a Pool
    that exists and is not retired, or asks for a new Resource for one of its entries, with a
    Conduit to `management` that lists the operation and none to the Pool that lists it, reports
    refused. The Conduit to a Pool that authorizes retiring it together with its Resources need
    list only `retire-with-resources.v1`, as LIF-021 states. The setup or the retirement of a
    Resource is reconciled through a Conduit to the Pool that owns it, that of an Agent, an
    Interface or a Pool through a Conduit to `management`, and the opening or the closing of a
    Conduit through a Conduit to `access`, whose capability `access-control.v1` includes
    `reconcile.v1`. A registration is authorized against `management` and is reconciled through
    a Conduit to it, whether or not it also needed a Conduit to a Pool. A management verb is an
    operation of `object-management.v1`, `access-control.v1` or `pool-management.v1`, under
    CON-024: an invocation of `install.v1` or of `purge.v1` is reconciled through a Conduit to
    `management`, which authorized it, like that of any other verb of `object-management.v1`. An
    invocation that is not of a management verb is never reconciled through a Conduit to the
    instance it was dispatched to: an operation of a Resource, a control among them, is
    reconciled through a Conduit to the Pool that owns that Resource, and an operation of an
    Agent, an Interface or a Pool through a Conduit to `management`. A setup hook or a retire
    hook is dispatched to its own instance, under ACC-018, and is reconciled in the same way. No
    capability has to include `reconcile.v1` beside `object-management.v1`,
    `pool-management.v1`, which every Pool offers, and `access-control.v1`. Where a request
    named here is an onward request, the Conduit that authorizes it is one of the instance that
    sent it, under ACC-016, and not one of the caller it serves. Every Conduit to a retired Pool
    is closed, under CON-008, so no request is made through one. A Resource of a retired Pool is
    inspected, and an invocation that was dispatched to it, its setup or its retirement is
    reconciled, through a Conduit to `management` that lists the operation, as the Pool itself
    is inspected. An invocation of `retire-with-resources.v1`, and the Pool's own retirement
    that it dispatched, are reconciled through such a Conduit too: the Pool authorized them, and
    it is retired from the moment its retirement is dispatched. While the Pool is not retired, a
    Conduit to `management` does not permit those requests: at any moment one target authorizes
    a request. Every other request that this promise authorizes against a Pool reports refused
    once the Pool is retired, because every Conduit to it is closed and a request through a
    closed Conduit reports refused under ACC-011, and one made through a Conduit to `management`
    reports refused too: setting up or retiring a Resource that the Pool owns, and
    `retire-with-resources.v1`, which has no input that could name the Pool. A retired Pool
    whose shutdown is not confirmed is retired again with `retire.v1`, which names the Pool and
    is authorized against `management`, under LIF-026. Registering a Resource whose owner is a
    retired Pool, and asking under LIF-009 for a new Resource for an entry of one, need the
    Conduit to `management` alone, and a permitted request for either reports invalid: POOL-004
    rejects the document, and POOL-017 gives the reason for the entry. An invocation whose
    instance no longer exists is reconciled through a Conduit to `management` that lists
    `reconcile.v1`, whichever target would have authorized the reconciliation while the instance
    existed: its outcome becomes succeeded or failed under OPS-014, and nothing else changes,
    because nothing is left to change. For a control, REV-010 says what such a reconciliation
    names. An object that does not exist has no owning Pool. Authority to inspect it, or to
    act on it by a stale reference, is `management`'s alone. With that authority the request
    reports invalid under OPS-029. A caller with only a Pool's authority reports refused before
    any diagnostic, under OPS-023, and learns nothing of whether the object existed. Where the
    object exists, the applicable target is the one the rows above name.
  vectors: []



- id: ACC-034
  layer: convention
  level: must
  when: >-
    A Conduit is closed while an invocation dispatched through it has not ended.
  then: >-
    The invocation runs to its end, its outcome is recorded, and its result, with its outputs,
    is delivered in the response to the request that dispatched it, as the result of any other
    invocation is. An onward request made after the close, by that invocation or by any
    invocation that serves it directly or through others, is not dispatched and reports refused.
  observable: >-
    The record of the invocation states its outcome, and the caller receives its result, whose
    `isError` is as IFC-025 gives it for that outcome. The request was permitted when it was
    dispatched, and the delivery of its result is not decided again. A later repeat of the
    request, or a `tasks/get` for the invocation under IFC-016, is decided anew under ACC-036:
    made through the closed Conduit, it reports refused, under ACC-011. So where the tasks
    extension answered the call with a task, a result that only a later `tasks/get` would read
    is not delivered once the Conduit has closed, and the caller learns the outcome from the
    records. An invocation counts as dispatched through the Conduit of its latest attempt, under
    OPS-024: where a new attempt went through another Conduit than the first, it is the close of
    that Conduit that ends its onward requests. After the close no onward request is dispatched
    that names the invocation in `io.github.shrav-k.conduit/serving`, or that names an
    invocation which serves it through any number of onward requests or hooks. ACC-039 has an
    onward request refused in the same way from the moment the consumer of that Conduit is
    retired, before the Conduit is closed, unless the invocation that the request serves belongs
    to that consumer's own retirement.
  vectors: []



- id: ACC-036
  layer: convention
  level: must
  when: >-
    A request is decided.
  then: >-
    The access decision is made anew for that request, from the Conduits as they stand when it
    is made. No earlier decision is reused.
  observable: >-
    A request that was permitted a moment ago reports refused once its Conduit is closed, and
    the reverse holds once a Conduit that lists the operation is opened. Each request has its
    own record of an access decision under REC-001. No decision is kept to stand in for a later
    one.
  vectors: []

- id: ACC-037
  layer: convention
  level: must
  when: >-
    A request is to be decided, and the state of the Conduits that the decision needs cannot be
    established, or whether the instance that an otherwise valid credential of the request names
    still exists cannot be, under IFC-032.
  then: >-
    The request is not dispatched, and reports unavailable. Nothing else about the request is
    examined or reported.
  observable: >-
    The target's implementation receives no call, and no earlier decision is used in place of
    the one that cannot be made, even for a request between two instances on one node.
    OPS-023 puts this case where refused stands in its order: the request reports unavailable
    whatever else is wrong with it, and its result carries no diagnostic and says nothing of the
    objects it names, since the actor has not been found to be permitted. Only a request that
    cannot be read reports another reason, invalid. The same request made once the state can be
    established is decided as any other. Whether the engine reports at once or first waits, and
    for how long, is DL4 of the implementation-defined list.
  vectors: []

- id: ACC-038
  layer: convention
  level: must
  when: >-
    An open Conduit is inspected.
  then: >-
    For each requirement the Conduit applies, the result names, under that requirement, the
    implementation that applies it: for a filter, each implementation that the target has
    selected for the operations the Conduit lists; for a requirement of the core package, the
    engine, `github.com/shrav-k/conduit/core#engine`. Each is named by its qualified reference,
    which for an implementation that the manifest of a submitted project lists is
    `address#name`, with the address that manifest states.
  observable: >-
    The implementations named for a filter are those that must support its requirement under
    CON-022: they are sent the filter under IFC-018 and apply it under IFC-019. Where there is
    more than one, each is named. The engine is named for the shared-host requirement, which it
    decides when the Conduit is instantiated, under PLC-013, and for a bound, which it applies
    to each request through a Conduit to `access`, under ACC-029. The address that names an
    implementation of a submitted project is the one its manifest states under MAN-015, as
    SUB-008 names the project's contracts outside its own documents.
  vectors: []



- id: ACC-039
  layer: convention
  level: must
  when: >-
    A request is made through an open Conduit whose consumer is retired. Or an onward request is
    made, through any Conduit, that serves an invocation in whose chain such a Conduit stands:
    the invocation that it names was dispatched through one, or an invocation of that
    invocation's chain was.
  then: >-
    The request is permitted only if it belongs to the retirement of that consumer: it is an
    onward request that serves the consumer's retire hook, directly or through others, or the
    engine's read of a secret for a run that the retirement asks for, or for a connection that
    it makes, to serve that hook, under TPL-018 and SEC-011. Every other such request is not
    dispatched, and reports refused.
  observable: >-
    From the moment the consumer is retired, under LIF-005, a request that the consumer makes on
    its own behalf, and an onward request that serves any invocation other than those of its
    retirement, report refused, although the Conduit's state is still ready and its tools are
    still presented. An onward request that the consumer's retire hook makes through the Conduit
    is dispatched, and so is an onward request that names, in
    `io.github.shrav-k.conduit/serving`, the invocation of that hook or of an onward request
    that serves it, and so is the engine's read of a secret through the Conduit before the run
    that the retirement asks for, or the connection that it makes, to serve that hook. This
    holds for a further retirement under LIF-026 as for the first. It ends when the Conduit is
    closed: once the consumer's shutdown is confirmed, the consumer is declared lost or a
    request to unregister it removes it, under CON-008 and LIF-017, or by a request of an actor
    under ACC-012. Every other check of a request through the Conduit is made as for any
    request. The same holds for an onward request that is made
    through another Conduit. Where a Resource serves an invocation that a request of an Agent
    began, and the Agent is retired while the invocation is in progress, an onward request of
    the Resource that names that invocation, or that names an invocation which serves it through
    others, reports refused from that moment, although the Resource's own Conduit is open and
    its consumer is not retired. So an onward request is dispatched only where each Conduit of
    its chain is open, under ACC-034, and none of them has a retired consumer, that consumer's
    own retirement apart. The invocation itself runs to its end. A hook is not an onward
    request, and the stop of the consumer's run is a provider call, under PRV-005 and PRV-008,
    which is not a request and which no Conduit permits, under PRV-004.
  vectors: []
