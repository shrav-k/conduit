# Access: the shared convention that every permission is an open Conduit.
# Owner rulings of 2026-11-05 (plan-audit rulings 14, 17, 19, 28, 29, 32 and 33). There is no
# separate grant object: the access an open Conduit carries is the operations it lists, opening
# it is what used to be called issuing, and closing it is what used to be called revoking. The
# right to open Conduits is itself an open Conduit, to the `access` Resource. Ownership permits
# nothing. Removed by consolidation pass 1: ACC-004 was folded into ACC-003; ACC-007 into
# ACC-006; ACC-013 into CON-022; ACC-020 and ACC-021 into REC-001 and OPS-005; ACC-025 into
# ACC-033. ACC-010 was removed earlier and folded into LIF-008. The ruling on the core package
# and the schemas (ruling 37) changed ACC-029 and ACC-031 to ACC-034. The conversion of the
# older text (decision DA3 of the docs audit, docs/proposals/docs-audit/GAPS.md) changed
# ACC-008, ACC-014, ACC-015 and ACC-027, and added ACC-036 to ACC-038. The second round of the
# re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed ACC-001, ACC-005, ACC-006,
# ACC-008, ACC-014, ACC-015, ACC-018, ACC-019, ACC-022, ACC-029 to ACC-031, ACC-033, ACC-034
# and ACC-038, and its closing pass (docs/proposals/reaudit/round-2/log-closing.md) changed
# ACC-006, ACC-009, ACC-012, ACC-015, ACC-019, ACC-026, ACC-029, ACC-031, ACC-033, ACC-035 and
# ACC-038. Its last pass (docs/proposals/reaudit/round-2/log-tail.md) changed ACC-001, ACC-003,
# ACC-011, ACC-019, ACC-031, ACC-033 and ACC-034, and added ACC-039, on the Conduits of a
# retired consumer, and ACC-040, on a start of later work.
# The round removed none. Draft: no vector exists yet.

- id: ACC-001
  layer: convention
  level: must
  when: >-
    A consumer requests an operation on a target, and no open Conduit from that consumer to that
    target lists the operation.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    A record of the refused request exists, and the target's implementation receives no call. An
    instance's retrieval, under OPS-016, of the result of an invocation whose request it sent is
    not such a request: it needs no Conduit. Nor is an instance's request, under ACC-040, for a
    start of later work: the Conduit through which the work was arranged decides it.
  vectors: []

- id: ACC-002
  layer: convention
  level: must
  when: >-
    A request reaches a target.
  then: >-
    The engine's own access decision is made for the target before its implementation is
    invoked.
  observable: >-
    The record of the decision precedes any record of the implementation being invoked, and a
    request that the engine's decision does not permit has no record of invocation. A
    restriction that the implementation applies under IFC-019 is applied after that decision,
    and a reason the implementation then gives under IFC-026 ends the request as IFC-027 states.
  vectors: []

- id: ACC-003
  layer: convention
  level: must
  when: >-
    A Conduit is opened.
  then: >-
    It permits exactly the operations it lists, on its target, and no others. A Conduit that
    lists no operations permits nothing.
  observable: >-
    Inspecting the open Conduit shows the operations it lists. A request for any other operation
    through it reports refused. A Conduit that lists none is ready once it is opened, and every
    request through it reports refused. From the moment its consumer is retired, an open Conduit
    permits less: only the requests of the consumer's retirement, under ACC-039.
  vectors: []

- id: ACC-005
  layer: convention
  level: must
  when: >-
    Setup reaches the step that opens a declared Conduit.
  then: >-
    The step is a request for `open.v1` that names that Conduit, sent by the instance that sent
    the request to set up. It is decided under ACC-006 like any other request of that instance
    to open a Conduit: by that instance's own Conduit to `access`.
  observable: >-
    If that instance is not the consumer of an open Conduit to `access` that lists `open.v1` and
    whose bound covers the declared Conduit's target and the operations it lists, the step
    reports refused, the Conduit is not opened and its state is still registered. Where the
    request to set up was an onward request, the Conduit to `access` is one of the instance that
    sent it, and not one of the caller it serves. The same holds where the setup is itself a
    step of a Pool's setup, under POOL-015: the steps of a setup are authorized as the request
    to set up was, by the Conduits of the instance that sent it.
  vectors: []

- id: ACC-006
  layer: convention
  level: must
  when: >-
    An actor asks to open a Conduit.
  then: >-
    The request is an operation of the `access` Resource. It is dispatched only if the actor is
    the consumer of an open Conduit to `access` that lists the operation and whose bound covers
    the new Conduit's target, as ACC-029 states, and names every operation the new Conduit
    lists. Being the consumer of an open Conduit to the target does not permit it. Where the new
    Conduit is itself one to `access`, ACC-030 states the condition in place of this one.
  observable: >-
    An actor with an open Conduit to the target but none to `access` reports refused. A request
    whose target the bound does not cover, or one of whose operations it does not name, reports
    refused, and its result names the bound in `io.github.shrav-k.conduit/restriction`, as
    ACC-029 states. The Conduit is not opened for the part that was within the bound. In each
    case the Conduit's state is still registered. Where the request is an onward request, the
    Conduit to `access` is one of the instance that sent it, under ACC-016. A request to open a
    Conduit that is already open is decided like any other, changes nothing and has the outcome
    succeeded, because the effect that `open.v1` describes has occurred; the step of a setup is
    left as succeeded in the same case, under CON-004. A request to open a closed Conduit
    reports conflict under LIF-015.
  vectors: []

- id: ACC-008
  layer: convention
  level: must
  when: >-
    A request is made through a Conduit.
  then: >-
    It is permitted only if the Conduit lists the operation and every restriction that applies
    permits it. No restriction can permit what the Conduit does not.
  observable: >-
    Adding a restriction never makes a previously refused request succeed. A request that any
    one applicable restriction forbids reports refused, has no outcome, and nothing of it is
    performed. Whether the Conduit lists the operation is decided by the engine before any call
    to the implementation, under ACC-002. The implementation applies the restrictions it is sent
    under IFC-019, and where one of them forbids the request it performs nothing and answers
    with the reason refused under IFC-026. The result names the restriction that forbade the
    request in `io.github.shrav-k.conduit/restriction`, whether the engine or the implementation
    found it, as IFC-025 states.
  vectors: []

- id: ACC-009
  layer: convention
  level: must
  when: >-
    A request is made through one Conduit, and its consumer is also the consumer of another
    Conduit that carries a filter.
  then: >-
    The filter on the other Conduit does not apply. The request is limited by its own Conduit's
    operations and filters, by every policy that applies to it under ACC-031 and, for an onward
    request, by the restrictions carried under ACC-017.
  observable: >-
    A request that the other Conduit's filter would forbid is permitted through this Conduit,
    unless one of the restrictions that do apply forbids it. A policy applies to a request by
    the request's caller and its target, and not by its consumer: an onward request that a
    Resource makes is limited by a policy that names the caller it serves.
  vectors: []

- id: ACC-011
  layer: convention
  level: must
  when: >-
    A Conduit is closed.
  then: >-
    All the access it carried ends. No part of it remains in force.
  observable: >-
    After the close every request through the Conduit reports refused. To narrow access, the
    Conduit is closed and a new Conduit that lists fewer operations is opened. A Conduit whose
    consumer is retired is not closed by that: CON-008 closes it once the consumer's shutdown is
    confirmed, or at once where the consumer is declared lost, and ACC-039 says what it permits
    until it is closed.
  vectors: []

- id: ACC-012
  layer: convention
  level: must
  when: >-
    An actor asks to close a Conduit.
  then: >-
    The request is an operation of the `access` Resource. It is dispatched only if the actor is
    the consumer of an open Conduit to `access` that lists the operation and whose bound covers
    the target of the Conduit to be closed and every operation that Conduit lists. Where the
    Conduit to be closed is itself one to `access`, ACC-030 states the condition in place of
    this one. A Conduit whose consumer is the root Interface is never closed at an actor's
    request, as ACC-024 states; CON-008 still closes one whose target is retired.
  observable: >-
    An actor with such a Conduit to `access` can close a Conduit it did not open. Any other
    actor reports refused, and the Conduit is as it was. A request to close a Conduit that is
    already closed is decided like any other, changes nothing and has the outcome succeeded, as
    a request to open one that is already open has under ACC-006.
  vectors: []

- id: ACC-014
  layer: convention
  level: must
  when: >-
    A restriction applies to a request and cannot be evaluated for the requested operation.
  then: >-
    The request reports unavailable, has no outcome, and nothing of it is performed.
  observable: >-
    The record names the restriction and states that it could not be evaluated. Where the engine
    finds this before any call, the request is not dispatched and the target's implementation
    receives no call. Where the implementation finds that it cannot apply a restriction it was
    sent, it performs nothing and answers with the reason unavailable under IFC-026. In both
    cases the result names the restriction in `io.github.shrav-k.conduit/restriction`, as
    IFC-025 states.
  vectors: []

- id: ACC-015
  layer: convention
  level: must
  when: >-
    A policy applies to a request under ACC-031, and the implementation that the request's
    target has selected for the operation does not state the policy's requirement in `supports`.
  then: >-
    The request is not dispatched, and reports unavailable.
  observable: >-
    The result of each such request names the policy as the cause, in
    `io.github.shrav-k.conduit/restriction` as IFC-025 states, until the policy no longer
    applies or the implementation states the requirement in `supports`. An implementation marked
    `plain` states none, under PKG-020. Requests that the policy does not apply to are decided
    as before.
  vectors: []

- id: ACC-016
  layer: convention
  level: must
  when: >-
    An instance, while serving an invocation, requests an operation on another target.
  then: >-
    That onward request is permitted only under the instance's own open Conduit to that target.
  observable: >-
    If the instance has no open Conduit to the onward target that lists the operation, the
    onward request reports refused, whatever Conduits the caller is the consumer of. The onward
    request names the invocation it serves in `io.github.shrav-k.conduit/serving`, and one from
    an instance that is not an actor and that names none reports refused. The request the engine
    then sends to the onward target names the instance's own Conduit in
    `io.github.shrav-k.conduit/conduit`.
  vectors: []

- id: ACC-017
  layer: convention
  level: must
  when: >-
    An instance, while serving an invocation, requests an operation on another target.
  then: >-
    The onward request carries the identity of the caller of the invocation it names in
    `io.github.shrav-k.conduit/serving`, and every restriction that applied to that invocation:
    the filters on the Conduit the caller came in through, any policy that applied, and any that
    invocation itself carried from a call it served. Its effects and returned content are
    limited by them.
  observable: >-
    The onward target's record names the original caller. The
    `io.github.shrav-k.conduit/restrictions` sent to the onward target lists those restrictions
    beside the ones of the instance's own Conduit. An effect or content that they forbid to the
    caller is not produced or returned, even though the instance's own Conduit would permit it.
  vectors: []

- id: ACC-018
  layer: convention
  level: must
  when: >-
    A step of a graph names one of its template's declared Conduits under `conduit`.
  then: >-
    The step is an onward request of the instance that the graph belongs to, made through that
    Conduit to its target under ACC-016 and ACC-017. A step with no `conduit` invokes the
    implementation selected for its own instance, and is not a request through any Conduit. It
    carries the restrictions of the invocation that its graph is serving, and the implementation
    it invokes applies them as IFC-019 states.
  observable: >-
    The same refusals and limits are observed for a step that names a Conduit as for any other
    onward request. A step that names none makes no request to another instance, and the
    `io.github.shrav-k.conduit/restrictions` it is sent holds the restrictions of the invocation
    its graph is serving, under IFC-018. A filter on the Conduit through which an operation was
    requested, and a policy that applied to the request, therefore limit every step of a graph
    that implements the operation. A step whose implementation is marked `plain`, or cannot
    apply one of those restrictions, reports unavailable, as ACC-014 states.
  vectors: []

- id: ACC-019
  layer: convention
  level: must
  when: >-
    An operation whose contract is marked `arrangesLaterWork: true` has arranged work, for a
    caller and through a Conduit, that is to start or to run at a later time.
  then: >-
    The work is tied to the Conduit through which it was arranged. While that Conduit is open,
    the work is subject to the access that Conduit carries as it stands when the work runs. Once
    that Conduit is closed, no start of the work is dispatched, and every request that work
    already started makes reports refused.
  observable: >-
    This holds from the close on, whatever Conduits the caller is later the consumer of: a new
    Conduit to the same target does not bring the work back. Each start is an invocation that
    the engine dispatches when the implementation that holds the work asks for it with
    `start-later-work.v1`, for the caller and through the Conduit of the invocation that
    arranged the work, as ACC-040 states. A request that the work makes while it runs is an
    onward request that names the started invocation under IFC-020. An operation whose contract
    does not carry the mark arranges no later work, under CTR-002. A start of model work is
    arranged only by an operation that is also marked as starting it, under IMP-006.
  vectors: []

- id: ACC-022
  layer: convention
  level: must
  when: >-
    The engine has been started for the first time.
  then: >-
    The root Interface's Conduit to `access` has no bound.
  observable: >-
    The root Interface can open a Conduit to any target that is not retired, for any operation
    the target offers, and every bound is within its own. A Conduit to `access` that has no
    bound is unlimited, under ACC-029, and ACC-030 says who may open or close another one.
  vectors: []

- id: ACC-023
  layer: convention
  level: must
  when: >-
    An Interface other than the root Interface is instantiated.
  then: >-
    It has no access until a Conduit of which it is the consumer is opened.
  observable: >-
    Every request from the new Interface reports refused until an actor with the right to open
    opens a Conduit for it.
  vectors: []

- id: ACC-024
  layer: convention
  level: must not
  when: >-
    An actor asks to close a Conduit whose consumer is the root Interface.
  then: >-
    The Conduit is closed.
  observable: >-
    The request reports refused and the root Interface's Conduit stays open.
  vectors: []

- id: ACC-026
  layer: convention
  level: must
  when: >-
    A Conduit is opened that lists more than a policy that applies to requests through it
    permits.
  then: >-
    The Conduit is opened as requested, and the policy limits what the consumer can do through
    it.
  observable: >-
    Inspection shows the Conduit open with the operations it lists. Requests the policy forbids
    report refused, and are permitted without a new Conduit once the policy no longer applies.
  vectors: []

- id: ACC-027
  layer: convention
  level: must
  when: >-
    A Conduit is inspected.
  then: >-
    For each restriction on it, the report states whether the restriction is enforced or only
    mediated. In this version every restriction is reported as mediated.
  observable: >-
    Each restriction in the inspection result carries one of those two values. A restriction is
    enforced where an isolation plugin also keeps the consumer from going around it. This
    version specifies no isolation plugin, so the value is mediated for every restriction.
  vectors: []

# --- Added by the consolidation rulings (plan-audit rulings 28 and 29).

- id: ACC-028
  layer: convention
  level: must not
  when: >-
    A Pool owns a Resource.
  then: >-
    That ownership permits any request.
  observable: >-
    A Pool is never a caller. An actor whose only open Conduit is to the Pool can use the Pool's
    own operations, and reports refused on every operation of the Resources the Pool owns.
  vectors: []

- id: ACC-029
  layer: convention
  level: must
  when: >-
    A Conduit to `access` carries a bound.
  then: >-
    The bound is a filter. It names Pools, individual targets and operations. Naming a Pool
    covers the Pool itself and every Resource that Pool owns, including those instantiated after
    the Conduit that carries the bound was opened. An individual target is covered when the
    bound names it, and so is an actor that a policy names.
  observable: >-
    The consumer of a Conduit to `access` whose bound names a Pool can open a Conduit to that
    Pool, and to a Resource instantiated in that Pool afterwards, and reports refused for a
    Resource that another Pool owns unless the bound names that Resource or its Pool. The bound
    is written as the core package's requirement `bound.v1`, applied in the `requirements` of
    the Conduit's template with the arguments `pools`, `targets` and `operations`, each a list
    that is empty where it is left out. A bound that names nothing covers nothing. A Conduit to
    `access` that applies no `bound.v1` has no bound and is unlimited: it covers every target
    and names every operation. `operations` names each operation by a qualified reference, so a
    bound names published contracts only: a Conduit that lists an operation of an unpublished
    package is opened or closed only by an actor whose own Conduit to `access` has no bound. A
    bound that names an operation which a package re-exports, by the re-export or by the
    reference to the package that originally exports it, names both: the two references resolve
    to one operation, under PKG-013. As a filter, the bound is a restriction: a request that it
    does not cover reports refused and names it, as IFC-025 states. CON-028 says where a bound
    may be applied.
  vectors: []

- id: ACC-030
  layer: convention
  level: must
  when: >-
    An actor asks to open or to close a Conduit to `access`, whoever its consumer is, the actor
    itself included.
  then: >-
    The request is dispatched only if that Conduit's bound is within the bound of the actor's
    own Conduit to `access`. A new bound is within an old one when every Pool and every
    individual target it names is covered by the old one, as ACC-029 states, and every operation
    it names is one the old one names. A Conduit that has no bound is within another only if
    that other has none: only an actor whose own Conduit to `access` applies no bound may open
    or close a Conduit to `access` that applies none. A request to open is dispatched only if,
    in addition, every operation of `access` that the new Conduit lists is one that the actor's
    own Conduit to `access` lists. This is the whole condition: the actor's bound need not also
    cover `access` as a target. A right to open is passed on, or opened for oneself, only as it
    is or narrower.
  observable: >-
    A request to open or to close one whose bound is wider reports refused, and so does a
    request to open one that lists an operation of `access` that the actor's own Conduit to
    `access` does not list. An actor that opens a further Conduit to `access` for itself gains
    nothing its first one did not permit. A new bound may name a Resource that the old one
    covers only through its Pool, and may name a Pool only if the old one names that Pool. At
    the moment a Conduit to `access` is opened, its bound covers nothing that the bound of the
    actor that opened it does not cover, and names no operation that bound does not name.
    Closing that actor's own Conduit to `access` afterwards closes none of the Conduits it
    opened for others.
  vectors: []

- id: ACC-031
  layer: convention
  level: must
  when: >-
    An actor asks to apply or to remove a policy.
  then: >-
    The request is an operation of the `access` Resource. It is dispatched only if the actor is
    the consumer of an open Conduit to `access` that lists the operation and every actor and
    target the policy names is covered by that Conduit's bound, as ACC-029 states. A request to
    apply a policy gives `actors`, `targets` or both. The policy applies to each request whose
    caller is one of `actors`, where that list is given, and whose target is one of `targets`,
    where that list is given. The policy's requirement is named by a qualified reference, so a
    policy names a published contract only. The policy is stored by `access`, and is not part of
    its configuration.
  observable: >-
    Applying a policy returns an ID for it, and removing a policy names that ID. Neither request
    names a revision, and neither changes the configuration or the revision of `access`.
    Inspecting `access` lists, in its status, the policies in force and the actors and targets
    each names. An actor with no open Conduit to `access` listing the operation, or whose bound
    does not cover one of those actors or targets, reports refused, and the policies in force
    are as they were. The two operations are `apply-policy.v1` and `remove-policy.v1`. A policy
    that gives only `actors` applies to every request of which one of them is the caller,
    whatever its target, an onward request that serves that caller included. One that gives only
    `targets` applies to every request made of one of them, whoever its caller is, the root
    Interface excepted under ACC-035. One that gives both applies only to a request that matches
    both; an onward request that serves such a request carries the policy under ACC-017,
    whatever its own target. A list that is given and is empty matches no request. A request to
    apply a policy is not dispatched and reports invalid where it gives neither list, where its
    requirement does not list `policy` in its `appliesTo` under CTR-005, where its requirement
    does not narrow requests, and where its `arguments` do not fit the inputs the requirement
    declares, which are checked as NAM-019 checks those of an applied requirement. A policy's
    requirement narrows requests, as a filter's does: it is sent to implementations under
    IFC-018, and one that does not narrow is never sent. A requirement of an unpublished package
    has no qualified reference, and cannot be applied as a policy. A request that names an actor
    or a target that does not exist, and a request to remove a policy whose ID names no policy
    in force, report invalid under OPS-029.
  vectors: []

- id: ACC-032
  layer: convention
  level: must
  when: >-
    An actor asks for an operation that is reserved to the root Interface, such as declaring a
    location lost.
  then: >-
    The request is dispatched only if the actor is the root Interface. No Conduit opened for
    another consumer lists such an operation.
  observable: >-
    A request for a reserved operation from any other actor reports refused, and so does a
    request to open a Conduit that lists one for a consumer other than the root Interface. An
    operation is reserved where its contract is marked `reservedToRoot: true`. Under CTR-009
    only an operation of the core package is so marked: `declare-lost.v1` and `purge.v1` are.
  vectors: []

- id: ACC-033
  layer: convention
  level: must
  when: >-
    An actor asks to register, replace, rename, inspect, set up, retire or unregister an object,
    to retire a Pool together with the Resources it owns, to install a package, for an operation
    reserved to the root Interface, to reconcile an invocation, to open or close a Conduit, to
    apply or remove a policy, or for a control.
  then: >-
    The request is authorized by an open Conduit from the actor that lists the operation, to a
    target fixed as follows. Registering, replacing, renaming and unregistering any object are
    authorized against `management`. Registering a Resource whose owner is a Pool that already
    exists also needs an open Conduit from the actor to that Pool, and each of the two Conduits
    lists `register.v1`. Where the Pool is registered in the same submission, which includes the
    Resources of its own entries, nothing more is needed. A request under LIF-009 for a new
    instance for a nested instantiation is authorized as registering that instance would be, by
    the same Conduits, each listing `register-replacement.v1` in place of `register.v1`. Setting
    up and retiring an instance are requests for `set-up.v1` and for `retire.v1`, which name the
    instance in the input `instance`. They, and inspecting it, are authorized against the Pool
    that owns the instance where it is a Resource, and against `management` where it is an
    Agent, an Interface or a Pool. Inspecting a Conduit or a template is authorized against
    `management`. Retiring a Pool together with the Resources it owns, in the one operation of
    LIF-021, is authorized against that Pool. Installing a package, and every operation reserved
    to the root Interface under ACC-032, are operations of `management` and are authorized
    against it. Opening and closing a Conduit, and applying and removing a policy, are
    authorized against `access`, under ACC-006, ACC-012 and ACC-031. A control is authorized by
    an open Conduit to the instance itself that lists the control. Reconciling an invocation of
    a management verb is authorized against the target that authorized the request being
    reconciled. Reconciling any other invocation, of a control or of any other operation, is
    authorized against the target that manages the instance the invocation was dispatched to:
    the Pool that owns that instance where it is a Resource, and `management` where it is an
    Agent, an Interface or a Pool. In both cases the Conduit lists `reconcile.v1`. Where a Pool
    is retired, every request that this promise authorizes against that Pool is authorized
    against `management` in its place.
  observable: >-
    An actor with an open Conduit to that target listing the operation is permitted, and any
    other actor reports refused. Except for a control, a Conduit to the object itself, or to any
    other target, does not permit the request. An actor that registers a Resource into a Pool
    that exists, or asks for a new Resource for one of its entries, with a Conduit to
    `management` that lists the operation and none to the Pool that lists it, reports refused.
    The Conduit to a Pool that authorizes retiring it together with its Resources need list only
    `retire-with-resources.v1`, as LIF-021 states. The setup or the retirement of a Resource is
    reconciled through a Conduit to the Pool that owns it, that of an Agent, an Interface or a
    Pool through a Conduit to `management`, and the opening or the closing of a Conduit through
    a Conduit to `access`, whose capability `access-control.v1` includes `reconcile.v1`. A
    registration is authorized against `management` and is reconciled through a Conduit to it,
    whether or not it also needed a Conduit to a Pool. An invocation that is not of a management
    verb is never reconciled through a Conduit to the instance it was dispatched to: a control
    of a location, or an operation of any other Resource, is reconciled through a Conduit to the
    Pool that owns that Resource, and a control of the `system` Pool, or an operation of an
    Agent, through a Conduit to `management`. A step that invokes the implementation of its own
    instance was dispatched to that instance. No capability has to include `reconcile.v1` beside
    `object-management.v1`, `pool-management.v1`, which every Pool offers, and
    `access-control.v1`. Where a request named here is an onward request, the Conduit that
    authorizes it is one of the instance that sent it, under ACC-016, and not one of the caller
    it serves. Every Conduit to a retired Pool is closed, under CON-008, so no request is made
    through one. A Resource of a retired Pool is inspected, and an invocation that was
    dispatched to it, its setup or its retirement is reconciled, through a Conduit to
    `management` that lists the operation, as the Pool itself is inspected. An invocation of
    `retire-with-resources.v1`, and the Pool's own retirement that it dispatched, are reconciled
    through such a Conduit too: the Pool authorized them, and it is retired from the moment its
    retirement is dispatched. While the Pool is not retired, a Conduit to `management` does not
    permit those requests: at any moment one target authorizes a request. Which target that is
    can be told only for an object that exists, and a request that names one that does not exist
    reports invalid under OPS-029.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32, decisions U6 and U7).

- id: ACC-034
  layer: convention
  level: must
  when: >-
    A Conduit is closed while an invocation dispatched through it has not ended.
  then: >-
    The invocation runs to its end and its outcome is recorded. Its content is delivered only
    while that Conduit is open, and so is withheld, as OPS-017 states for a retained result. An
    onward request made after the close, by that invocation or by any invocation that serves it
    directly or through others, is not dispatched and reports refused.
  observable: >-
    The record of the invocation states its outcome. The caller receives the outcome and the
    statement that content is withheld: the result carries its outcome and no
    `structuredContent`, its `_meta` holds `io.github.shrav-k.conduit/withheld` with the value
    true, and its `isError` is true, because it holds no outputs, as IFC-025 states. The content
    is never delivered under another Conduit, even one from the same consumer to the same
    target. After the close no onward request is dispatched that names the invocation in
    `io.github.shrav-k.conduit/serving`, or that names an invocation which serves it through any
    number of onward requests.
  vectors: []

- id: ACC-035
  layer: convention
  level: must not
  when: >-
    A policy is asked for, or is in force.
  then: >-
    It applies to a request whose caller is the root Interface.
  observable: >-
    A request to apply a policy whose `actors` names the root Interface is not dispatched and
    reports refused, whoever makes it, and the policies in force are as they were. A policy that
    gives only `targets` is applied, and does not apply to a request that the root Interface
    makes of one of them, or to an onward request that serves the root Interface. The root
    Interface can therefore always remove a policy.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; rows GP2 and
# --- GP15 of docs/proposals/docs-audit/GAPS.md).

- id: ACC-036
  layer: convention
  level: must
  when: >-
    A request is decided.
  then: >-
    The access decision is made anew for that request, from the Conduits and the policies as
    they stand when it is made. No earlier decision is reused.
  observable: >-
    A request that was permitted a moment ago reports refused once its Conduit is closed or a
    policy that forbids it applies, and the reverse holds once a Conduit that lists the
    operation is opened or that policy is removed. Each request has its own record of an access
    decision under REC-001. No decision is kept to stand in for a later one.
  vectors: []

- id: ACC-037
  layer: convention
  level: must
  when: >-
    A request is to be decided, and the state of the Conduits or of the policies that the
    decision needs cannot be established.
  then: >-
    The request is not dispatched, and reports unavailable.
  observable: >-
    The target's implementation receives no call, and no earlier decision is used in place of
    the one that cannot be made, even for a request between two instances on one location. The
    same request made once the state can be established is decided as any other. Whether the
    engine reports at once or first waits, and for how long, is DL4 of the
    implementation-defined list.
  vectors: []

- id: ACC-038
  layer: convention
  level: must
  when: >-
    An open Conduit is inspected.
  then: >-
    For each requirement the Conduit applies, the result names, under that requirement, the
    implementation that applies it: by its qualified reference or, for an implementation that
    the manifest of a project that is not published lists, by `<digest>#<name>`.
  observable: >-
    For a filter they are the implementations that must state the filter's requirement in
    `supports` under CON-022. Those that the target has selected for the operations the Conduit
    lists are always among them: they are sent the filter under IFC-018 and apply it under
    IFC-019. Where `obliges` in the requirement's contract names `consumer`, under CTR-005, the
    implementations selected for the consumer are named as well. Where there is more than one,
    each is named. For a requirement that the engine itself checks, as it checks the shared-host
    requirement under PLC-013, the result names the engine,
    `github.com/shrav-k/conduit/core#engine`. In `<digest>#<name>` the digest is the one that
    identifies the unpublished package under SUB-008, written as PKG-004 writes a digest, and
    the name is the implementation's: it is the form IFC-006 gives a contract of such a package.
  vectors: []

# --- Added by the last pass of the second round of the re-audit
# --- (docs/proposals/reaudit/round-2/log-tail.md; decisions 2 and 9 of "The closing pass, and
# --- what it left" in DECISIONS.md).

- id: ACC-039
  layer: convention
  level: must
  when: >-
    A request is made through an open Conduit whose consumer is retired.
  then: >-
    The request is permitted only if it belongs to the consumer's retirement: it is a step of an
    invocation of `retire.v1` for the consumer, or an onward request that serves such a step or
    the stop of one of the consumer's runtimes. Every other request through the Conduit is not
    dispatched, and reports refused.
  observable: >-
    From the moment the consumer is retired, under LIF-005, a request that the consumer makes on
    its own behalf, and an onward request that serves any invocation other than those of its
    retirement, report refused, although the Conduit's state is still ready and its tools are
    still presented. A step of the consumer's `retire` graph that names the Conduit under
    `conduit` is dispatched, and so is an onward request that names, in
    `io.github.shrav-k.conduit/serving`, the invocation of a step of that graph or of the stop
    of a runtime under TPL-009. This holds for a further retirement under LIF-026 as for the
    first. It ends when the Conduit is closed: once the consumer's shutdown is confirmed or the
    consumer is declared lost, under CON-008, or by a request of an actor under ACC-012. Every
    other check of a request through the Conduit is made as for any request.
  vectors: []

- id: ACC-040
  layer: convention
  level: must
  when: >-
    An instance asks, with `start-later-work.v1`, for a start of later work: it names the
    engine's ID for the invocation that arranged the work, an operation and arguments.
  then: >-
    The engine dispatches an invocation of that operation to that instance, for the caller of
    the arranging invocation and through the Conduit that invocation was dispatched through,
    only if all of these hold: the arranging invocation was dispatched to the instance that
    asks; its operation is marked `arrangesLaterWork: true`; that Conduit is open and lists the
    operation to be started; and, where the operation to be started is marked
    `startsModelWork: true`, the arranging operation is so marked too. Where one of these does
    not hold, the request is not dispatched, and reports refused.
  observable: >-
    The implementation that holds the work asks, through the server the engine presents for its
    instance, under IFC-035. The request needs no Conduit of which that instance is the
    consumer, and names no invocation in `io.github.shrav-k.conduit/serving`: it is decided
    here, and not under ACC-001 or IFC-021. The started invocation is a new invocation with an
    ID of its own. Its implementation is sent the caller of the arranging invocation in
    `io.github.shrav-k.conduit/caller`, that Conduit in `io.github.shrav-k.conduit/conduit`,
    and, in `io.github.shrav-k.conduit/restrictions`, the filters of that Conduit and the
    policies that apply to a request of that caller to that instance, as they stand when the
    start is dispatched. The access decision is made anew for each start, under ACC-036, and
    every other check of a request through that Conduit is made as for any request, and gives
    its own reason: a start whose arguments do not satisfy the operation's inputs reports
    invalid, one whose instance is not ready reports unavailable under CON-024, and one through
    a Conduit whose consumer is retired reports refused under ACC-039. A request that names an
    ID which is that of no invocation, of an invocation dispatched to another instance, or of
    one that came through no Conduit, as a step that invokes its own instance's implementation
    does, reports refused, and its result says nothing of whether such an invocation exists. A
    record exists in every case, under REC-001: of the request that was not dispatched, or of
    the started invocation with its caller and its Conduit. The request may carry an operation
    identity under IFC-023, scoped under OPS-008 to the instance that asks, to that caller and
    to that instance as the target: a repeat is the same start, under OPS-009, and a request
    with no identity is a new start each time, under OPS-011. Work that is to run repeatedly
    asks for each start. IMP-006 states the condition on a start of model work, and ACC-019 what
    holds once the Conduit is closed.
  vectors: []
