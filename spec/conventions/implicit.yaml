# Nothing starts model work or repeats an effect implicitly.
# Whether an operation starts model work is declared in its contract, as the Model Context
# Protocol's tool annotations declare that a tool is read-only or destructive, so "who may cause
# whom to spend" can be read from the documents. Repeating an invocation is governed by
# conventions/operations.yaml. IMP-003 is a rule on documents and has the layer `language`.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# Removed: IMP-004 → IMP-002 and IMP-008 (the hooks) (ruling 41).
# Removed: IMP-005 → IMP-002 and IMP-008 (the hooks) (ruling 41).
# IMP-006: nothing replaces it (ruling 38).
# Removed: IMP-009 → IMP-002 and IMP-008 (the hooks) (ruling 41).
# IMP-010: nothing replaces it (ruling 38).
# IMP-011: nothing replaces it (ruling 38).
# IMP-012: nothing replaces it (ruling 38).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: IMP-001
  layer: convention
  level: must
  when: >-
    Model work starts.
  then: >-
    It is the effect of an operation whose contract declares that it starts model work,
    dispatched through an open Conduit that lists that operation.
  observable: >-
    Every record of model work starting names such an invocation, its caller and its Conduit.
  vectors: []

- id: IMP-002
  layer: convention
  level: must not
  when: >-
    An object is registered, instantiated, set up, retired, inspected or observed; a Conduit is
    opened or closed; an operation not marked as starting model work is invoked on an Agent,
    whatever it delivers to the Agent; a setup hook or a retire hook is dispatched; a runtime
    provider restarts a run; a machine is reported reachable again; or the engine restarts.
  then: >-
    Model work starts because of it.
  observable: >-
    No record of model work starting follows any of those events, unless a separate invocation
    of an operation that declares it is also recorded.
  vectors: []

- id: IMP-003
  layer: language
  level: must
  when: >-
    An operation's contract is read.
  then: >-
    It starts model work only if the contract marks it so, with `startsModelWork: true`. An
    operation without the mark does not start model work.
  observable: >-
    Reading the contracts of the operations a Conduit lists tells whether its consumer can
    start model work on its target.
  vectors: []

- id: IMP-007
  layer: convention
  level: must not
  when: >-
    An invocation has ended, whatever its outcome, or was in progress when the engine restarted.
  then: >-
    It is dispatched again without a repeat of the request from its caller.
  observable: >-
    An invocation is dispatched at most once per attempt, and a new attempt is made only for a
    repeat that OPS-012 or OPS-024 dispatches: of an invocation whose outcome is unknown or
    failed, or, where a filter applies to the repeat, of one that succeeded, whose operation's
    contract states no `effect`, that is not a control and whose contract is not marked
    `startsModelWork: true`. A call that the implementation rejected before acting on it, and
    that the engine sends once more under IFC-046, is part of the same dispatch, not a second.
    For a setup hook or a retire hook, the further setup or retirement that dispatches a new
    attempt under OPS-021 is the repeat, and its caller is the attempt's caller, under OPS-028.
    An invocation that was in progress across a restart has the outcome unknown.
  vectors: []



- id: IMP-008
  layer: convention
  level: must
  when: >-
    A request for an operation marked as starting model work names, in
    `io.github.shrav-k.conduit/serving`, an invocation of an operation that is not so marked.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    A request for a marked operation is dispatched only when the invocation it serves is itself
    of a marked operation, or when it serves none and an actor makes it on its own behalf. Code
    that implements an unmarked operation, or a setup or retire hook, whose operations carry no
    mark, cannot start model work by an onward request. Nor can it start model work later: once
    an invocation has ended the engine dispatches no request on its behalf, under ACC-019.
  vectors: []
