# Nothing starts model work or repeats an effect implicitly.
# Owner rulings of 2026-11-05 (plan-audit rulings 30, 32 and 33). Whether an operation starts
# model work is declared in its contract, as the Model Context Protocol's tool annotations
# declare that a tool is read-only or destructive, so "who may cause whom to spend" can be read
# from the documents. Repeating an invocation is governed by conventions/operations.yaml.
# IMP-003 to IMP-005 and IMP-009 are rules on documents and have the layer `language`. The
# second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed IMP-005,
# IMP-006 and IMP-009, and its closing pass named the mark `arrangesLaterWork` in IMP-006. Its
# last pass (docs/proposals/reaudit/round-2/log-tail.md) changed IMP-006 and IMP-008, and added
# IMP-010, a rule on documents of the layer `language`, and IMP-011: what IMP-004 and IMP-008
# state for model work, stated for later work. The follow-up to that pass changed IMP-006,
# IMP-010 and IMP-011, and added IMP-012, of the layer `language`: what IMP-005 and IMP-009
# state for model work. No promise of this file has been removed. Draft: no vector exists yet.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which ruling 39 accepted, changed
# IMP-004, IMP-006, IMP-010 and IMP-012: the rules on a graph that starts model work or arranges
# later work cover every graph selected for a template's instances, however it was selected. It
# added none and removed none.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 38 of the owner (docs/proposals/ruling-38/README.md, 2026-11-06) changed this file;
# what changed is in docs/proposals/ruling-38/log-spec.md. It removed IMP-006, IMP-010,
# IMP-011 and IMP-012, on later work, which is not part of this version. Those IDs are
# not reused.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, removed IMP-004, IMP-005 and IMP-009 (decision 1: no graphs; IMP-002 and
# IMP-008 cover the setup hook and the retire hook); changed IMP-002 and IMP-008; and added
# none. IMP-003 is now the one rule on documents in this file. What changed is in
# docs/proposals/ruling-41/log-G1.md. Those IDs are not reused.
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06), on the coordinator's decisions
# in docs/proposals/ruling-41/open-decisions.md, changed IMP-007: the further setup or
# retirement that dispatches a new attempt of a hook is the repeat, and its caller is the
# attempt's. It added none and removed none. What changed is in
# docs/proposals/ruling-42/log-conventions.md.
# The verification of the fixes of round 5 (docs/proposals/reaudit/round-5/log-fixes.md,
# "Verification") changed IMP-007, under which a call sent once more under IFC-046 is part of
# the same dispatch (V2). It added none and removed none.

- id: IMP-001
  layer: convention
  level: must
  when: >-
    Model work starts.
  then: >-
    It is the effect of an operation whose contract declares that it starts model work,
    dispatched through an open Conduit that lists that operation.
  observable: >-
    Every record of model work starting names such an invocation, its caller and its Conduit.
  vectors: []

- id: IMP-002
  layer: convention
  level: must not
  when: >-
    An object is registered, instantiated, set up, retired, inspected or observed; a Conduit is
    opened or closed; an operation not marked as starting model work is invoked on an Agent,
    whatever it delivers to the Agent; a setup hook or a retire hook is dispatched; a runtime
    provider restarts a run; a machine is reported reachable again; or the engine restarts.
  then: >-
    Model work starts because of it.
  observable: >-
    No record of model work starting follows any of those events, unless a separate invocation
    of an operation that declares it is also recorded.
  vectors: []

- id: IMP-003
  layer: language
  level: must
  when: >-
    An operation's contract is read.
  then: >-
    It starts model work only if the contract marks it so, with `startsModelWork: true`. An
    operation without the mark does not start model work.
  observable: >-
    Reading the contracts of the operations a Conduit lists tells whether its consumer can
    start model work on its target.
  vectors: []

- id: IMP-007
  layer: convention
  level: must not
  when: >-
    An invocation fails, has an unknown outcome or was in progress when the engine restarted.
  then: >-
    It is dispatched again without a repeat of the request from its caller.
  observable: >-
    An invocation is dispatched at most once per attempt, and a new attempt is made only for a
    repeat that OPS-012 or OPS-024 dispatches. A call that the implementation rejected before
    acting on it, and that the engine sends once more under IFC-046, is part of the same
    dispatch, not a second. For a setup hook or a retire hook, the further
    setup or retirement that dispatches a new attempt under OPS-021 is the repeat, and its
    caller is the attempt's caller, under OPS-028. An invocation that was in progress across a
    restart has the outcome unknown.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32; decision U3 of the re-audit).

- id: IMP-008
  layer: convention
  level: must
  when: >-
    A request for an operation marked as starting model work names, in
    `io.github.shrav-k.conduit/serving`, an invocation of an operation that is not so marked.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    A request for a marked operation is dispatched only when the invocation it serves is itself
    of a marked operation, or when it serves none and an actor makes it on its own behalf. Code
    that implements an unmarked operation, or a setup or retire hook, whose operations carry no
    mark, cannot start model work by an onward request. Nor can it start model work later: once
    an invocation has ended the engine dispatches no request on its behalf, under ACC-019.
  vectors: []
