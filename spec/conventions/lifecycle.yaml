# Ownership and lifecycle: the one set of states every instance has, what inspecting returns,
# and how an instance is retired and unregistered.
# Owner rulings of 2026-11-05 (plan-audit rulings 28, 29, 30, 32 and 33). The states only move
# forward, as a Kubernetes Pod's phases do; a replacement is a new object. Whether an instance
# is running, paused or idle is a matter for its type contract. Retirement takes effect at once
# and removal waits for shutdown to be confirmed, as a Kubernetes object is marked for deletion
# at once and removed when its finalizers finish. Which Conduit permits each of these operations
# is ACC-033. Consolidation pass 1 folded in CON-010, CON-015, POOL-010 and PLC-010, and split
# LIF-014 into LIF-014, LIF-024, LIF-025 and LIF-026. The ruling on the core package and the
# schemas (ruling 37) changed LIF-007, LIF-009, LIF-013 and LIF-015. The conversion of the older
# text (decision DA3 of the docs audit, docs/proposals/docs-audit/GAPS.md) added LIF-027. The
# second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed LIF-003,
# LIF-005, LIF-006, LIF-008 to LIF-010, LIF-013, LIF-018, LIF-020, LIF-022 to LIF-024 and
# LIF-026, which became a `must`, and added LIF-028 and LIF-029. Its closing pass
# (docs/proposals/reaudit/round-2/log-closing.md) changed LIF-001, LIF-015, LIF-017, LIF-018,
# LIF-021, LIF-022, LIF-024 and LIF-028. Its last pass
# (docs/proposals/reaudit/round-2/log-tail.md) changed LIF-008, LIF-012, LIF-015, LIF-016,
# LIF-020, LIF-021, LIF-024, LIF-026 and LIF-028, and added LIF-030, on retiring an instance
# whose shutdown is confirmed. The follow-up to that pass changed LIF-009. No promise of this
# file has been removed. Draft: no vector exists yet.
# The fix pass of the third round of the re-audit (docs/proposals/reaudit/round-3/log-fixes.md),
# on the coordinator's decisions in docs/proposals/reaudit/round-3/DECISIONS.md, which the owner
# has not ruled on, changed LIF-007, LIF-009, LIF-012, LIF-015, LIF-021 and LIF-028, and added
# LIF-031, on a request that holds the resolved form of a reference, and LIF-032, on a request
# to set up or to retire a template or a Conduit. It removed none.
# Its follow-up, on the decisions of the section "The fix pass, and what it left" of the same
# file, which are the coordinator's too, changed LIF-015, LIF-018, LIF-021, LIF-024, LIF-028 and
# LIF-031: while the outcome of a start of one of an instance's runtimes is unknown its shutdown
# is not confirmed, and a retired instance takes the reconciliation of that start.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which the owner has not ruled on, changed
# LIF-001, LIF-009, LIF-017 to LIF-019, LIF-021 to LIF-024, LIF-027, LIF-028 and LIF-030, and
# added LIF-033, on a request for a new instance in the place of one that no nested
# instantiation made, and LIF-034, on the reason that a request to retire, unregister or rename
# a first-start object reports. The shutdown of an instance that holds a runtime is never
# confirmed. It removed none.
# The follow-up to that pass, on the decisions of the section "The fix pass, and what it left"
# of the same file, which are the coordinator's too, changed LIF-023, LIF-027 and LIF-028: the
# exceptions for the component Conduits of a composite declared Conduit were taken out again,
# because such a Conduit is opened all together or not at all, with nothing closed.
# Standing: the owner accepted these promises as they stood at the rulings that this comment
# names by number. Every change listed above for the conversion of the older text (the docs
# audit) and for rounds 2 to 4 of the re-audit is a decision of the coordinator under ruling 37,
# logged in the records named, and the owner has not ruled on it.
# Ruling 38 (2026-11-06) accepted some of those decisions and made changes of its own;
# spec/README.md says which.
# Ruling 38 of the owner (docs/proposals/ruling-38/README.md, 2026-11-06) changed this file;
# what changed is in docs/proposals/ruling-38/log-spec.md.

- id: LIF-001
  layer: convention
  level: must
  when: >-
    An instance of any family is inspected.
  then: >-
    It reports exactly one lifecycle state: registered, ready or retired.
  observable: >-
    The status of an Interface, Agent, Resource, Pool or Conduit instance holds one of those
    three values and never any other, including unknown. No instance, a Conduit included, has a
    suspended state: to limit access for a time without ending it, a policy is applied under
    ACC-031 and later removed.
    A policy limits requests only where the implementation that the target has selected supports
    the policy's requirement: ACC-015 says what a request reports where it does not.
  vectors: []

- id: LIF-002
  layer: language
  level: must
  when: >-
    An instance is instantiated.
  then: >-
    Its state is registered.
  observable: >-
    Inspecting the new instance reports the state registered.
  vectors: []

- id: LIF-003
  layer: convention
  level: must
  when: >-
    An instance's setup succeeds: the invocation of `set-up.v1` that names it or, for a Conduit,
    of `open.v1`.
  then: >-
    Its state is ready.
  observable: >-
    Inspecting the instance after the setup reports the state ready. For a Conduit, setup is
    being opened. A setup whose outcome was unknown, and that is reconciled as having occurred,
    makes the instance ready in the same way, under LIF-028.
  vectors: []

- id: LIF-004
  layer: convention
  level: must
  when: >-
    An instance's setup fails, or has an unknown outcome, or is not dispatched.
  then: >-
    Its state is unchanged, and its status reports how that setup ended.
  observable: >-
    An instance that was registered is still registered, and one that was ready is still ready.
    The status names the setup and its outcome, or the reason it was not dispatched.
  vectors: []

- id: LIF-005
  layer: convention
  level: must
  when: >-
    A request to retire an instance is dispatched.
  then: >-
    Its state is retired from that moment, whatever the outcome of the invocation of `retire.v1`
    or, for a Conduit, of `close.v1`.
  observable: >-
    Inspecting the instance reports the state retired and what retired it, even while its
    shutdown is not confirmed. For a Conduit, retiring is being closed.
  vectors: []

- id: LIF-006
  layer: convention
  level: must not
  when: >-
    An instance is ready or retired.
  then: >-
    Any operation returns it to an earlier state.
  observable: >-
    No operation moves a ready instance to registered, or a retired instance to ready or
    registered. What a request to set up a retired instance reports is LIF-015.
  vectors: []

- id: LIF-007
  layer: language
  level: must
  when: >-
    An instance is retired.
  then: >-
    It still exists, in the state retired, until it is unregistered.
  observable: >-
    The retired instance can still be inspected, and its name cannot be given to another object
    of its kind, until an unregister operation removes it. A reference to the retired instance
    by its name still resolves until it is unregistered, so a request can still name it. That a
    request names an object by a reference is LIF-031.
  vectors: []

- id: LIF-008
  layer: convention
  level: must not
  when: >-
    An instance made by a nested instantiation, such as a declared Conduit or the Resource of a
    Pool's entry, is retired.
  then: >-
    Setup, anything else that happens to the instance it belongs to, or anything other than an
    explicit request under LIF-009, makes another instance in its place.
  observable: >-
    However often setup runs afterwards, the nested instantiation has only the retired instance
    until a replacement is registered under LIF-009. Until then the step for it reports conflict
    under LIF-015, a diagnostic names the retired instance, and the consumer of a closed
    declared Conduit has no access through it.
  vectors: []

- id: LIF-009
  layer: convention
  level: must
  when: >-
    An actor explicitly asks for a new instance for a nested instantiation whose instance is
    retired.
  then: >-
    A new instance is instantiated from the nested instantiation as the instance it belongs to
    holds it in its resolved definition, with a new ID, in the state registered. It is made from
    the template that the `from` of the nested instantiation names, as that template stands when
    the request is made. The retired instance is not changed. The request is a registration: it
    is authorized under ACC-033 as registering that instance would be, and it sets nothing up
    and opens nothing. It is the operation `register-replacement.v1`, and it names the retired
    instance. Where a rule on instantiation does not make the new instance, as where that
    template no longer exists, the request is not dispatched, and reports invalid, as the
    registration of a document that the same rule rejects does under OBJ-023.
  observable: >-
    Inspection shows two instances for the nested instantiation: the earlier one retired with
    its original ID, and a later one with a different ID. Instances that held the retired one's
    ID still hold it. The nested instantiation is a declared Conduit, a component of a composite
    that a declared Conduit names, or a Pool's entry, and the consumer or the Pool holds it. A
    component Conduit that an instance document of a composite template made belongs to no
    instance, and cannot be replaced: a request that names it reports invalid under LIF-033, as
    one that names any instance that no nested instantiation made does, and a new Conduit is
    instantiated by a new document. The new instance is named as OBJ-003 and CON-003 name a
    nested instance, with a newly generated name, because the retired instance keeps its own.
    The local name of a declared Conduit does not change, so the tool name of each operation
    that the new Conduit still lists is the one it had, under IFC-012. A replacement for the
    Resource of an entry is owned by the same Pool. A replacement for a declared Conduit is
    opened by a separate request to `access`, or by a later setup of its consumer under CON-004.
    The instance holds the nested instantiation in its own resolved definition, so replacing or
    unregistering the template from which that instance was made changes none of this, under
    INS-020. The template that the `from` of the nested instantiation names is another matter:
    the instance holds a reference to it, in the resolved form where the template is one that
    exists, and not a copy of it. So the new instance is made from that template as it now
    stands. Where `replace.v1` changed it since the retired instance was made, the new instance
    has what the template now declares, as an instance document that named it would under
    SUB-009. Where it has been unregistered, the request reports invalid, as INS-002 rejects an
    instance document whose `from` names it. A `from` that names a template of a package names
    it in the version of that package that the instance holds, under PKG-005, and where that
    version is no longer installed the request reports invalid, as PKG-007 rejects the document.
    The rules on instantiation are applied to the nested instantiation as the instance holds it,
    with its references already resolved, and as the objects stand when the request is made. So
    a request for a new declared Conduit whose target is retired, under CON-025, or has been
    unregistered, under OBJ-009, reports invalid, and so does one for a new Resource for an
    entry whose stored placement is a retired location, under PLC-018, or for which PLC-004
    chooses no placement. The result carries the diagnostic that resolving returned, as IFC-025
    states. A request made while the instance is not retired is LIF-029, and a request for a new
    Resource for an entry of a retired Pool is POOL-017.
  vectors: []

- id: LIF-010
  layer: convention
  level: must
  when: >-
    What an instance is doing cannot be observed, for example because its location cannot be
    reached.
  then: >-
    Its lifecycle state is unchanged.
  observable: >-
    Inspection shows the same lifecycle state and the same placement as before, with what could
    not be observed reported as unknown under OBS-003. Instances on other locations report as
    before. What a request to an instance on such a location reports meanwhile is DL5 of the
    implementation-defined list.
  vectors: []

- id: LIF-011
  layer: convention
  level: must
  when: >-
    A type contract defines further conditions of its instances, such as running, paused or
    idle.
  then: >-
    They are reported in the instance's status beside its lifecycle state, and never change
    that state.
  observable: >-
    An Agent whose type reports it paused, or whose process has ended, is still ready. Only
    setup and retirement change the lifecycle state.
  vectors: []

- id: LIF-012
  layer: convention
  level: must
  when: >-
    A template is registered.
  then: >-
    It exists until it is unregistered, and has no lifecycle state.
  observable: >-
    Inspecting a template returns no lifecycle state, and no operation gives it one. What a
    request to set up or to retire a template reports is LIF-032.
  vectors: []

- id: LIF-013
  layer: convention
  level: must
  when: >-
    An instance is inspected.
  then: >-
    The result has three parts: what was declared, the instance's status, and the records
    about it.
  observable: >-
    The declared part is the resolved definition and configuration, in which a reference is
    shown in the resolved form of OBJ-009. The status holds the lifecycle state and what has
    been observed. The records are those that name the instance. In the result of `inspect.v1`
    the three parts are the outputs `declared`, `status` and `records`, and they stand beside
    the object's `id`, its `revision` and `packages`, the list of the packages it holds in the
    form NAM-009 gives.
  vectors: []

# --- Retirement and unregistration (plan-audit rulings 30 and 32).

- id: LIF-014
  layer: convention
  level: must
  when: >-
    An instance is retired.
  then: >-
    Its status reports its shutdown as exactly one of confirmed, pending or unknown.
  observable: >-
    Inspecting any retired instance shows one of those three values against its shutdown, and
    never any other. Which of them it is follows LIF-024.
  vectors: []

- id: LIF-015
  layer: convention
  level: must
  when: >-
    A retired instance is addressed by a request to set it up or to change it.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    The instance is as it was. The only requests that address a retired instance and can be
    dispatched are to inspect it, to retire it again under LIF-026 or LIF-030, to reconcile its
    setup or its retirement under LIF-028, to reconcile the start or the stop of one of its
    runtimes under TPL-015, which for a start that occurred stores the handle, to reconcile any
    other invocation that was dispatched to it where the reconciliation stores nothing in it, to
    unregister it, to ask under LIF-009 for a new instance in its place where a nested
    instantiation made it, and to declare it lost under PLC-017 where it is a location. A
    reconciliation of a control that would store settings in a retired instance, under REV-010,
    is a request to change it. Requests through the Conduits of which it was the target are
    requests through closed Conduits, which ACC-011 covers. The Conduits of which it is the
    consumer are closed once its shutdown is confirmed, under CON-008, and ACC-039 says what
    they permit until then.
  vectors: []

- id: LIF-016
  layer: convention
  level: must not
  when: >-
    An instance is retired.
  then: >-
    Anything is stopped or released other than what the instance itself holds, as its type
    contract defines.
  observable: >-
    An external service, a shared Resource and every other instance are as they were, apart from
    the Conduits of which the retired instance is an end. CON-008 closes those of which it is
    the target at once, and those of which it is the consumer once its shutdown is confirmed.
  vectors: []

- id: LIF-017
  layer: convention
  level: must
  when: >-
    An actor asks to unregister an instance.
  then: >-
    The request is dispatched only if the instance is retired and either its shutdown is
    confirmed or its location was declared lost.
    Otherwise it is not dispatched, and reports conflict.
  observable: >-
    After a request to unregister a registered or ready instance, or a retired one whose
    shutdown is pending or unknown and whose location was not declared lost, the instance still
    exists. An instance that holds a runtime, or one of whose runtimes has a start of unknown
    outcome, is among them, because LIF-024 keeps its shutdown from being confirmed. Like any
    change, the request names the object's current revision.
  vectors: []

- id: LIF-018
  layer: convention
  level: must
  when: >-
    The shutdown of a retired instance can never be confirmed by its implementation.
  then: >-
    It stays unknown until an actor reconciles, under OPS-014, the invocation of `retire.v1`
    whose outcome is unknown, or a further retirement under LIF-026 succeeds. Where it is
    unknown because the outcome of a start of one of the instance's runtimes is unknown, under
    LIF-024, it stays unknown until that start is reconciled. The reconciliation is authorized
    against the target that authorized the retirement, as ACC-033 states.
  observable: >-
    After a reconciliation that records the retirement as having occurred, the status reports
    confirmed and the instance can be unregistered, as LIF-028 states. Where the instance still
    holds a runtime, as after a stop whose outcome is unknown, that reconciliation is not
    dispatched and reports conflict under LIF-024: the stop is reconciled first, under TPL-015,
    or a further retirement stops the runtime. Nothing confirms it by the passing of time. An
    instance whose location was declared lost may have no such invocation to reconcile, and is
    unregistered under LIF-017 while its shutdown is still unknown. A Conduit's shutdown is
    confirmed when it is closed, under LIF-024, and waits for no reconciliation.
  vectors: []

- id: LIF-019
  layer: convention
  level: must not
  when: >-
    An object is unregistered.
  then: >-
    Records, backing files or service data are erased, or any object that refers to it is
    changed, retired or unregistered.
  observable: >-
    The records about the object can still be read. A request for `inspect.v1` no longer names
    the object, under OPS-029, and returns those records only where it names another object that
    they name, under LIF-013. How the records that name no object that still exists are read is
    DL8 of the implementation-defined list. Objects that referred to it hold the same ID as
    before and report it as missing.
  vectors: []

- id: LIF-020
  layer: convention
  level: must
  when: >-
    An actor asks to retire a Pool that owns a Resource whose shutdown is not confirmed, or to
    unregister a Pool that owns a Resource that still exists.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    The Pool and its Resources are as they were, and a diagnostic in the result names each
    Resource in the way, as IFC-025 states for what a request that is not dispatched says beyond
    its reason. A Resource that is registered or ready, or that is retired with its shutdown
    pending or unknown, is in the way of retiring the Pool.
  vectors: []

- id: LIF-021
  layer: convention
  level: must
  when: >-
    An actor asks, in one explicit operation, to retire a Pool together with the Resources it
    owns.
  then: >-
    The Resources are retired in the reverse of the order of setup: the retirement of a Resource
    has ended before that of any Resource that it refers to, or to which it is the consumer of a
    Conduit, is dispatched, among the Resources the Pool owns. Among Resources that depend on
    each other in a cycle, the order is the engine's. The request dispatches a retirement for
    each Resource that the Pool owns and whose shutdown is not confirmed. For one that is
    already retired it is a further retirement, decided as LIF-026 decides one. It dispatches
    none for a Resource whose shutdown is confirmed. Once a retirement that the request
    dispatched has ended without the shutdown of its Resource confirmed, the request dispatches
    no further retirement. The request to retire the Pool is dispatched only once the shutdown
    of every one of those Resources is confirmed.
  observable: >-
    If the shutdown of any Resource is not confirmed, no request to retire the Pool has been
    dispatched, so its state is as it was under LIF-005. The outcome of the request is then
    failed, and its result lists what remains, in diagnostics that name every Resource whose
    shutdown is not confirmed, those whose retirement the request did not dispatch among them:
    the effect of the operation is the Pool's retirement, which has not occurred, and a result
    whose outcome is failed holds no outputs, under IFC-025. Where the shutdown of every
    Resource is confirmed, the Pool's retirement is dispatched as an invocation of `retire.v1`
    of its own, to which LIF-024 applies, and the outcome of the request is the outcome of that
    retirement. Retirements that did succeed are not undone. A Resource that an earlier request
    left retired with its shutdown pending or unknown is retired again by this one, as a further
    invocation of `retire.v1` under LIF-026, so a request made again after the cause was removed
    can finish what the first could not. What stops the request is a retirement that it
    dispatched itself: one that ended before the request was made, with its shutdown not
    confirmed, does not. A Resource whose shutdown is confirmed gets no invocation of
    `retire.v1`, where a request that named it would get one that changes nothing under LIF-030.
    The order is the reverse of the one POOL-013 gives a Pool's setup, and it holds for every
    Resource the Pool owns, whether or not an entry made it: a step of a Resource's `retire`
    graph that names a declared Conduit to another Resource of the Pool finds that Conduit open,
    because CON-008 closes it only when its target is retired. Two Resources can each be the
    consumer of a Conduit to the other, or refer to each other in their configuration, and no
    order then satisfies the rule: the order among them, like the order among Resources that
    neither relation joins, is DL1 of the implementation-defined list. The retirement of each
    Resource is an invocation of `retire.v1` of its own, with its own outcome, and one whose
    outcome is unknown is reconciled as that invocation, under OPS-014. The operation is
    `retire-with-resources.v1`, requested of the Pool, and the retirements it dispatches are
    part of it: the actor's Conduit to the Pool need list only `retire-with-resources.v1`, and
    need not list `retire.v1` as well.
  vectors: []

- id: LIF-022
  layer: convention
  level: must not
  when: >-
    An actor asks to retire, to unregister or to rename a first-start object, which is the Pool
    `system`, the location `local`, the Resource `management`, the Resource `access` or the
    Interface `root`, or asks to declare the location `local` lost, or asks to rename one of the
    two Conduits of `root` that FST-002 lists.
  then: >-
    The object is retired, unregistered or renamed.
  observable: >-
    The request reports refused under LIF-034, whoever makes it, and the object is as it was.
    The two Conduits of `root` are not first-start objects, and a request to rename one of them
    is refused as a request to rename a first-start object is. Closing a Conduit of `root` is
    refused under ACC-024.
  vectors: []

- id: LIF-023
  layer: convention
  level: must not
  when: >-
    No actor has asked for it.
  then: >-
    An instance is retired or unregistered.
  observable: >-
    The only retirements without a request naming the instance are those of a Conduit whose
    consumer or target is retired or declared lost, of the instances on a location that is
    declared lost, and of the Resources that a Pool owns when it is retired together with them
    under LIF-021. Nothing is collected for being unused, unreferenced or old.
  vectors: []

# --- Split from LIF-014 by consolidation pass 1 (plan-audit ruling 32, decision G12).

- id: LIF-024
  layer: convention
  level: must
  when: >-
    The shutdown of a retired instance is reported.
  then: >-
    A Conduit's shutdown is confirmed when it is closed, however it was closed: it holds nothing
    to shut down. The shutdown of any other instance is never confirmed while the instance holds
    a runtime, or while the outcome of a start of one of its runtimes is unknown, whatever its
    retirements reported. Otherwise it is confirmed once an invocation of `retire.v1` for it has
    succeeded, and at once for an instance for which no setup was ever dispatched, under
    LIF-025. A shutdown that is not confirmed is unknown where the outcome of a start of one of
    the instance's runtimes is unknown, where the outcome of the latest invocation of
    `retire.v1` for the instance is unknown, and for an instance for which a setup was
    dispatched and whose location was declared lost, under PLC-017. It is pending otherwise. A
    reconciliation that would record as having occurred the retirement of an instance that holds
    a runtime is not dispatched, and reports conflict: the runtime is first stopped by a further
    retirement under LIF-026, or its stop is reconciled under TPL-015.
  observable: >-
    The status reports pending while the latest invocation of `retire.v1` has not ended and
    after it failed. An instance may be retired more than once, under LIF-026, and it is the
    latest invocation that counts, unless an earlier one succeeded. A runtime that the instance
    holds, and a start of unknown outcome, keep the shutdown from being confirmed whichever
    invocation succeeded. An instance that was retired by a request, with its shutdown pending
    or unknown, and whose location is then declared lost reports unknown, as PLC-017 states for
    every instance placed on the location. What an invocation of `retire.v1` does is TPL-009. A
    Conduit that CON-008 closed without a request, and one whose `close.v1` ended with whatever
    outcome, report confirmed, and each can be unregistered under LIF-017. A Conduit whose
    consumer is retired is closed by that once the consumer's shutdown is confirmed, or at once
    where the consumer is declared lost, under CON-008: until then it is not retired, so it
    reports no shutdown, and from the moment it is closed it reports confirmed. A start whose
    outcome is unknown may have left a runtime running that the instance does not hold, and that
    no retirement stops. So a retired instance with such a start reports unknown even after an
    invocation of `retire.v1` for it succeeded: it is not unregistered under LIF-017, and the
    Conduits of which it is the consumer are not closed under CON-008, until the start is
    reconciled or its location is declared lost. Reconciled as not having occurred, the start no
    longer counts, and the shutdown is as the instance's retirements give it. Reconciled as
    having occurred, with its handle under TPL-015, it leaves the instance holding the runtime:
    the shutdown is not confirmed, it reports unknown where the outcome of the latest invocation
    of `retire.v1` is unknown and pending otherwise, and a further retirement under LIF-026
    stops the runtime and can confirm it. An invocation of `retire.v1` that succeeds has stopped
    every runtime the instance held, under TPL-009, so an instance with a retirement that
    succeeded comes to hold a runtime only by such a reconciliation. An instance also still
    holds a runtime after a retirement in which the stop of it failed or ended unknown, under
    TPL-007. Where the outcome of that retirement is unknown, a reconciliation that would record
    it as having occurred reports conflict while the runtime is held, and the invocation's
    outcome stays unknown: the actor first reconciles the stop as having occurred, which ends
    the holding under TPL-015, or reconciles the retirement as not having occurred and retires
    the instance again. So in whatever order a start, a stop and a retirement are reconciled,
    the status never reports confirmed for an instance that holds a runtime, no such instance is
    unregistered under LIF-017 unless its location was declared lost, and LIF-030 never finds a
    runtime to stop. What a reconciliation of a setup or a retirement changes is LIF-028.
  vectors: []

- id: LIF-025
  layer: convention
  level: must
  when: >-
    An instance for which no setup was ever dispatched is retired.
  then: >-
    Its `retire` graph does not run, and its shutdown is confirmed at once.
  observable: >-
    No implementation receives a call because of the retirement. The status reports the state
    retired and the shutdown confirmed.
  vectors: []

- id: LIF-026
  layer: convention
  level: must
  when: >-
    An actor asks to retire an instance that is retired and whose shutdown is not confirmed.
  then: >-
    The request is decided like any other request to retire the instance. LIF-015 does not stop
    it.
  observable: >-
    A request to retire an instance whose shutdown is pending or unknown can be dispatched, as a
    further invocation of `retire.v1`. OPS-021 and DL1 of the implementation-defined list decide
    which of its steps are dispatched again, and the status then reports the shutdown under
    LIF-024. It is the way from a shutdown that is pending, after a retirement that failed, to
    one that is confirmed. The Conduits of which the instance is the consumer are not closed by
    its retirement while its shutdown is not confirmed, under CON-008, so a step of the further
    retirement that names one of them under `conduit` is permitted as in the first, under
    ACC-039. Where the instance was declared lost, or an actor closed the Conduit, the Conduit
    is closed, and such a step reports refused under ACC-011. A request to retire an instance
    whose shutdown is confirmed is LIF-030.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; row GP18 of
# --- docs/proposals/docs-audit/GAPS.md).

- id: LIF-027
  layer: convention
  level: must not
  when: >-
    An instance's setup does not succeed: it fails, has an unknown outcome or is not dispatched.
  then: >-
    A Conduit that the setup opened is closed, or an instance that it set up is retired, because
    of it.
  observable: >-
    After a setup that did not succeed, each declared Conduit it opened is still open, and each
    Resource of an entry that it set up is still ready. The instance's own state is unchanged
    under LIF-004. A later setup leaves what is already open or ready as it is, under CON-004
    and POOL-013. What the consumer of only some of its Conduits may do meanwhile is DL11 of the
    implementation-defined list.
  vectors: []

# --- Added by the second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md;
# --- findings R3-7, R1-2.2 and R2-C2).

- id: LIF-028
  layer: convention
  level: must
  when: >-
    An actor reconciles, under OPS-014, an invocation of `set-up.v1`, `open.v1`, `retire.v1` or
    `close.v1` whose outcome is unknown.
  then: >-
    Recording that a setup or an open occurred makes the instance ready or the Conduit open.
    Recording that a retirement or a close occurred confirms the shutdown, unless the outcome of
    a start of one of the instance's runtimes is still unknown, under LIF-024. A reconciliation
    that would record as having occurred the retirement of an instance that holds a runtime is
    not dispatched, and reports conflict, as LIF-024 states. Recording that it did not occur
    gives the outcome failed, and changes nothing else.
  observable: >-
    After a reconciliation that records a setup as having occurred, inspecting the instance
    reports the state ready, as after a setup that succeeded under LIF-003; an instance that was
    retired in the meantime stays retired, under LIF-006. After one that records a retirement as
    having occurred, the status reports the shutdown confirmed, and the instance can be
    unregistered under LIF-017, unless a start of unknown outcome keeps the shutdown unknown.
    The retirement of an instance that holds a runtime is not recorded so: the request reports
    conflict, the invocation's outcome is still unknown, and the actor first reconciles the stop
    of the runtime under TPL-015 or retires the instance again under LIF-026. After one that
    records that a setup did not occur, the state is as LIF-004 leaves it. After one that
    records that a retirement did not occur, the shutdown is as LIF-024 gives it after a
    retirement that failed, which is pending unless a start of unknown outcome keeps it unknown,
    and LIF-026 lets the instance be retired again. A Conduit's shutdown is confirmed already,
    under LIF-024. Once a reconciliation confirms the shutdown of an instance, the Conduits of
    which it is the consumer are closed, under CON-008, as they are when a retirement succeeds.
    What the reconciliation of the start or the stop of a runtime changes is TPL-015. Each of
    the four is a management verb, so the reconciliation is authorized against the target that
    authorized the request being reconciled, as ACC-033 states. An invocation of `open.v1` is of
    one Conduit: where the step of a composite declared Conduit made a request for each of its
    component Conduits, under CON-004, each of those invocations is reconciled by itself, and
    changes the state of its own Conduit alone.
  vectors: []

- id: LIF-029
  layer: convention
  level: must
  when: >-
    An actor asks under LIF-009 for a new instance for a nested instantiation while the instance
    made for it is not retired.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    The nested instantiation has one instance before and after the request. This holds for a
    declared Conduit and for a component as it does for a Pool's entry, which is POOL-003.
  vectors: []

# --- Added by the last pass of the second round of the re-audit
# --- (docs/proposals/reaudit/round-2/log-tail.md; decision 3 of "The closing pass, and what it
# --- left" in DECISIONS.md).

- id: LIF-030
  layer: convention
  level: must
  when: >-
    An actor asks to retire an instance that is retired and whose shutdown is confirmed.
  then: >-
    The request is decided like any other request to retire the instance, changes nothing and
    has the outcome succeeded. No step of the instance's `retire` graph is dispatched, and no
    runtime is stopped.
  observable: >-
    No implementation receives a call because of the request, and the instance's status is the
    same before and after it. An instance whose shutdown is confirmed holds no runtime, under
    LIF-024, so there is none to stop. The effect that `retire.v1` describes has occurred, as it
    has for a request to close a Conduit that is already closed, under ACC-012, and for a
    request to open one that is already open, under ACC-006. An actor that is not permitted
    reports refused under ACC-033. Being decided like any other, the request is not dispatched
    where another promise has a request to retire that instance not dispatched: it reports
    refused under LIF-022, and conflict under LIF-020 or PLC-011. A request to retire an
    instance whose shutdown is pending or unknown is LIF-026.
  vectors: []

# --- Added by the fix pass of the third round of the re-audit
# --- (docs/proposals/reaudit/round-3/log-fixes.md; findings 3A-14 and 3B-2). Each took a rule
# --- that stood in an observable: LIF-031 from LIF-007, with the reason and the exceptions that
# --- decision 3B-2 gives, and LIF-032 from LIF-012.

- id: LIF-031
  layer: convention
  level: must
  when: >-
    A request that an actor makes on its own behalf holds, in an input that a reference schema
    governs, the resolved form of a reference, `{kind: <Kind>, id: <ID>}`.
  then: >-
    The request is not dispatched, and reports invalid. A request that an actor makes on its own
    behalf names an object by a reference, and never by its ID.
  observable: >-
    The implementation receives no call, whether or not an object of that kind has that ID.
    Every reference schema accepts the resolved form, under OBJ-009, so no schema makes this
    check: the engine does. The rule is for a request that an actor makes on its own behalf, and
    for no other. A step of a graph, and an onward request, may hold the resolved form, because
    the engine handed it to them: a value reference with the source `config` yields a reference
    in that form, under OBJ-021, and an argument or a restriction that an implementation is sent
    holds it under IFC-018. So a step whose argument reads a reference from the configuration is
    dispatched, and so is an onward request that passes on a reference its instance was sent,
    and the engine takes the object by its ID. A call to `retrieve-result.v1` that names a
    served invocation, under IFC-024, is made for that invocation's caller and not on the
    instance's own behalf, so it may hold the resolved form in `target`: an implementation holds
    only that form of the target it called. An invocation and a policy are not objects:
    `reconcile.v1` and `remove-policy.v1` name each by the ID the engine gave it. A request that
    names an object by a reference that resolves to nothing reports invalid too, under OPS-029.
    Where the actor is not permitted, OPS-023 gives refused first.
  vectors: []

- id: LIF-032
  layer: convention
  level: must
  when: >-
    An actor asks for `set-up.v1` or for `retire.v1`, and the request names a template or a
    Conduit.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    A template has no lifecycle state, under LIF-012, and is neither set up nor retired. A
    Conduit is opened with `open.v1` and closed with `close.v1`, which are operations of
    `access`. The thing that the request names exists and is not one the operation addresses, so
    the reason is invalid, as OPS-029 gives it for a request that names nothing. Where the actor
    is not permitted, OPS-023 gives refused first.
  vectors: []

# --- Added by the fix pass of the fourth round of the re-audit
# --- (docs/proposals/reaudit/round-4/log-fixes.md; finding 4A-10). Each took a reason that
# --- stood in an observable: LIF-033 from LIF-009, and LIF-034 from LIF-022.

- id: LIF-033
  layer: convention
  level: must
  when: >-
    An actor asks, with `register-replacement.v1`, for a new instance, and the instance that the
    request names was made by no nested instantiation that an instance holds: a document of its
    own made it, as one made a component Conduit of a composite template that was instantiated
    by an instance document, or it is a first-start object.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    No instance holds a nested instantiation from which a new one could be made. This holds
    whatever the state of the instance that is named: a retired Agent that a document of its own
    made is followed by registering a new document, and so is a component Conduit that an
    instance document of a composite template made, which belongs to no instance. A request that
    names a template reports invalid in the same way: the thing exists, and is not one the
    operation addresses, as LIF-032 has it for `set-up.v1`. LIF-009 covers the instances that a
    declared Conduit, a component of a composite that a declared Conduit names, or a Pool's
    entry made, and LIF-029 a request for one of those that is not retired. A request that names
    nothing reports invalid under OPS-029. Where the actor is not permitted, OPS-023 gives
    refused first.
  vectors: []

- id: LIF-034
  layer: convention
  level: must
  when: >-
    An actor asks to retire, to unregister or to rename a first-start object, to declare the
    location `local` lost, or to rename one of the two Conduits of `root` that FST-002 lists.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    It reports refused whoever makes it, the root Interface included, although an open Conduit
    of the actor lists the operation: refused means that the request is not permitted, whoever
    asks. LIF-022 is why. It reports refused even where the object's state, or what it owns or
    has placed on it, would make the request report conflict under LIF-017, LIF-020 or PLC-011,
    as OPS-023 orders the reasons. A request to close one of the two Conduits of `root` reports
    refused under ACC-012.
  vectors: []
