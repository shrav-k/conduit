# Ownership and lifecycle: the one set of states every instance has, what inspecting returns,
# and how an instance is retired and removed.
# Owner rulings of 2026-11-05 (plan-audit rulings 28, 29, 30, 32 and 33). The states only move
# forward, as a Kubernetes Pod's phases do; a replacement is a new object. Whether an instance
# is running, paused or idle is a matter for its type contract. Retirement takes effect at once
# and removal waits for shutdown to be confirmed, as a Kubernetes object is marked for deletion
# at once and removed when its finalizers finish. Which Conduit permits each of these operations
# is ACC-033. Consolidation pass 1 folded in CON-010, CON-015, POOL-010 and PLC-010, and split
# LIF-014 into LIF-014, LIF-024, LIF-025 and LIF-026. The ruling on the core package and the
# schemas (ruling 37) changed LIF-007, LIF-009, LIF-013 and LIF-015. The conversion of the older
# text (decision DA3 of the docs audit, docs/proposals/docs-audit/GAPS.md) added LIF-027. The
# second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed LIF-003,
# LIF-005, LIF-006, LIF-008 to LIF-010, LIF-013, LIF-018, LIF-020, LIF-022 to LIF-024 and
# LIF-026, which became a `must`, and added LIF-028 and LIF-029. Its closing pass
# (docs/proposals/reaudit/round-2/log-closing.md) changed LIF-001, LIF-015, LIF-017, LIF-018,
# LIF-021, LIF-022, LIF-024 and LIF-028. Its last pass
# (docs/proposals/reaudit/round-2/log-tail.md) changed LIF-008, LIF-012, LIF-015, LIF-016,
# LIF-020, LIF-021, LIF-024, LIF-026 and LIF-028, and added LIF-030, on retiring an instance
# whose shutdown is confirmed. The follow-up to that pass changed LIF-009. No promise of this
# file has been removed. Draft: no vector exists yet.
