- id: LIF-001
  layer: convention
  level: must
  when: >-
    An instance of any family is inspected.
  then: >-
    It reports exactly one lifecycle state: registered, ready or retired.
  observable: >-
    The status of an Interface, Agent, Resource, Pool or Conduit instance holds one of those
    three values and never any other, including unknown. No instance, a Conduit included, has a
    suspended state: to narrow access, its Conduit is closed and a narrower one opened, under
    ACC-011.
  vectors: []

- id: LIF-002
  layer: language
  level: must
  when: >-
    An instance is instantiated.
  then: >-
    Its state is registered.
  observable: >-
    Inspecting the new instance reports the state registered.
  vectors: []

- id: LIF-003
  layer: convention
  level: must
  when: >-
    An instance's setup succeeds: the invocation of `set-up.v1` that names it or, for a Conduit,
    of `open.v1`.
  then: >-
    Its state is ready.
  observable: >-
    Inspecting the instance after the setup reports the state ready. For a Conduit, setup is
    being opened. A setup whose outcome was unknown, and that is reconciled as having occurred,
    makes the instance ready in the same way, under LIF-028.
  vectors: []

- id: LIF-004
  layer: convention
  level: must
  when: >-
    An instance's setup fails, or has an unknown outcome, or is not dispatched.
  then: >-
    Its state is unchanged, and its status reports how that setup ended.
  observable: >-
    An instance that was registered is still registered, and one that was ready is still ready.
    The status names the setup and its outcome, or the reason it was not dispatched.
  vectors: []

- id: LIF-005
  layer: convention
  level: must
  when: >-
    A request to retire an instance is dispatched.
  then: >-
    Its state is retired from that moment, whatever the outcome of the invocation of `retire.v1`
    or, for a Conduit, of `close.v1`.
  observable: >-
    Inspecting the instance reports the state retired and what retired it, even while its
    shutdown is not confirmed. For a Conduit, retiring is being closed.
  vectors: []

- id: LIF-006
  layer: convention
  level: must not
  when: >-
    An instance is ready or retired.
  then: >-
    Any operation returns it to an earlier state.
  observable: >-
    No operation moves a ready instance to registered, or a retired instance to ready or
    registered. What a request to set up a retired instance reports is LIF-015.
  vectors: []

- id: LIF-007
  layer: language
  level: must
  when: >-
    An instance is retired.
  then: >-
    It still exists, in the state retired, until it is removed: under LIF-035 once its shutdown
    is confirmed, or under LIF-017 by a request to unregister it.
  observable: >-
    The retired instance can still be inspected, and its name cannot be given to another object
    of its kind, until it is removed. A reference to the retired instance by its name still
    resolves until then, so a request can still name it; a request that names it afterwards
    reports invalid under OPS-029. That a request names an object by a reference is LIF-031.
  vectors: []

- id: LIF-008
  layer: convention
  level: must not
  when: >-
    An instance made by a nested instantiation, such as a declared Conduit or the Resource of a
    Pool's entry, is retired.
  then: >-
    Setup, anything else that happens to the instance it belongs to, or anything other than an
    explicit request under LIF-009, makes another instance in its place.
  observable: >-
    However often setup runs afterwards, the nested instantiation has no instance that is not
    retired until a replacement is registered under LIF-009. Until then the part of a setup for
    it reports conflict, under CON-004 or POOL-013, a diagnostic names the retired instance, and
    the consumer of a closed declared Conduit has no access through it.
  vectors: []

- id: LIF-009
  layer: convention
  level: must
  when: >-
    An actor explicitly asks for a new instance for a nested instantiation whose instance is
    retired or has been removed.
  then: >-
    A new instance is instantiated from the nested instantiation as the instance it belongs to
    holds it in its resolved definition, with a new ID, in the state registered. It is made from
    the template that the `from` of the nested instantiation names, as that template stands when
    the request is made. The retired instance is not changed. The request is a registration: it
    is authorized under ACC-033 as registering that instance would be, and it sets nothing up
    and opens nothing. It is the operation `register-replacement.v1`, which names, in
    `instance`, the instance that holds the nested instantiation and, in `nested`, the name of
    the declared Conduit or the entry. Where a rule on instantiation does not make the new
    instance, as where that template no longer exists, the request is not dispatched, and
    reports invalid, as the registration of a document that the same rule rejects does under
    OBJ-023.
  observable: >-
    Inspection shows a later instance for the nested instantiation, with a different ID, and the
    earlier one, retired with its original ID, until that one is removed. Instances that held
    the retired one's ID still hold it and, once it is removed, report it missing under LIF-019.
    The nested instantiation is a declared Conduit or a Pool's entry, and the consumer or the
    Pool holds it. The new instance is named as OBJ-003 names a nested instance, with a newly
    generated name, because the retired instance keeps its own until it is removed. The local
    name of a declared Conduit does not change, so the tool name of each operation that the new
    Conduit still lists is the one it had, under IFC-012. A replacement for the Resource of an
    entry is owned by the same Pool. A replacement for a declared Conduit is opened by a
    separate request to `access`, or by a later setup of its consumer under CON-004. The
    instance holds the nested instantiation in its own resolved definition, so replacing or
    unregistering the template from which that instance was made changes none of this, under
    INS-020. The template that the `from` of the nested instantiation names is another matter:
    the instance holds a reference to it, in the resolved form where the template is one that
    exists, and not a copy of it. So the new instance is made from that template as it now
    stands. Where `replace.v1` changed it since the retired instance was made, the new instance
    has what the template now declares, as an instance document that named it would under
    SUB-009. Where it has been unregistered, the request reports invalid, as INS-002 rejects an
    instance document whose `from` names it. A `from` that names a template of a package names
    it in the version of that package that the instance holds, under PKG-005, and where that
    version is no longer installed the request reports invalid, as PKG-007 rejects the document.
    The rules on instantiation are applied to the nested instantiation as the instance holds it,
    with its references already resolved, and as the objects stand when the request is made. So
    a request for a new declared Conduit whose target is retired, under CON-025, or no longer
    exists, under OBJ-009, reports invalid, and so does one for a new Resource for an entry
    whose stored placement is a retired node, under PLC-018, for which no node matches,
    under PRV-015, or whose stored `runtime` names a retired runtime provider, under PRV-006.
    One for which the machine provider cannot place the Resource now, as where the provider is
    not ready, or names no machine while the machine of a matching node is reported
    unreachable or omitted, reports unavailable, under PRV-015, and can be made again. The
    result carries the diagnostic that resolving returned, as IFC-025 states. A request made
    while the instance is not retired is LIF-029 for a declared Conduit and POOL-003 for an
    entry, and a request for a new Resource for an entry of a retired Pool is POOL-017.
  vectors: []

- id: LIF-010
  layer: convention
  level: must
  when: >-
    What an instance is doing cannot be observed, for example because the machine provider
    reports its machine unreachable, under PLC-023.
  then: >-
    Its lifecycle state is unchanged.
  observable: >-
    Inspection shows the same lifecycle state and the same placement as before, with what could
    not be observed reported as unknown under OBS-003. Instances on other nodes report as
    before. What a request to such an instance reports is PLC-023.
  vectors: []

- id: LIF-011
  layer: convention
  level: must
  when: >-
    A type contract defines further conditions of its instances, such as running, paused or
    idle.
  then: >-
    They are reported in `conditions` in the instance's status, beside its lifecycle state, each
    in the shape of Kubernetes `metav1.Condition` (`type`, `status`, `reason`, `message`,
    `lastTransitionTime`) with `lastHeartbeatTime` and `source`, which are Conduit's additions,
    as the core schema `condition.v1` gives it. They never change the lifecycle state.
  observable: >-
    An Agent whose type reports it paused, or whose run is reported stopped, under PRV-009, is
    still ready. Only setup and retirement change the lifecycle state.
  vectors: []

- id: LIF-012
  layer: convention
  level: must
  when: >-
    A template is registered.
  then: >-
    It exists until it is unregistered, and has no lifecycle state.
  observable: >-
    Inspecting a template returns no lifecycle state, and no operation gives it one. What a
    request to set up or to retire a template reports is LIF-032.
  vectors: []

- id: LIF-013
  layer: convention
  level: must
  when: >-
    An instance is inspected.
  then: >-
    The result has three parts: what was declared, the instance's status, and the records
    about it.
  observable: >-
    The declared part is the resolved definition and configuration, in which a reference is
    shown in the resolved form of OBJ-009. The status holds the lifecycle state and what has
    been observed, with its conditions in `conditions`, under LIF-011. It also lists, in
    `unreconciled`, the engine's ID for each invocation whose outcome is unknown, that was
    dispatched to the instance, its setup hook and its retire hook among them, or that
    names it in an input or as its target, its setups and retirements among them. The list is
    read from the state that OPS-008 keeps, so a purge under REC-004 does not shorten it, and an
    actor finds there an invocation to reconcile under OPS-014 whose ID it never held or has
    lost. The records are those that name the instance. In the result of `inspect.v1` the three
    parts are the outputs `declared`, `status` and `records`, `records` being a list in the form
    `record.v1`, under REC-002, and they stand beside the object's `id`, its `revision` and
    `packages`, the list of the packages it holds in the form NAM-009 gives.
  vectors: []

# --- Retirement and unregistration (plan-audit rulings 30 and 32).

- id: LIF-014
  layer: convention
  level: must
  when: >-
    An instance is retired.
  then: >-
    Its status reports its shutdown as exactly one of confirmed, pending or unknown.
  observable: >-
    Inspecting a retired instance shows pending or unknown against its shutdown, and never any
    other value: a confirmed shutdown removes the instance, under LIF-035, so confirmed is seen
    only in the result and the record of what confirmed it. Which of them it is follows LIF-024.
  vectors: []

- id: LIF-015
  layer: convention
  level: must
  when: >-
    A retired instance is addressed by a request to set it up or to change it.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    The instance is as it was. The only requests that address a retired instance and can be
    dispatched are to inspect it, to retire it again under LIF-026, to reconcile its setup or
    its retirement under LIF-028, to reconcile any other invocation that was dispatched to it,
    to unregister it under LIF-017, to ask under LIF-009 for a new instance in its place where a
    nested instantiation made it, and to declare it lost under PLC-017 where it is a node. A
    reconciliation of a control dispatched to it stores nothing in it, whichever way it records
    the effect, under REV-010. Requests through the Conduits of which it was the target are
    requests through closed Conduits, which ACC-011 covers. The Conduits of which it is the
    consumer are closed once its shutdown is confirmed, or once a request to unregister it
    removes it, under CON-008 and LIF-017, and ACC-039 says what they permit until then.
  vectors: []

- id: LIF-016
  layer: convention
  level: must not
  when: >-
    An instance is retired.
  then: >-
    Anything is stopped or released other than what the instance itself holds, as its type
    contract defines, and its own run, which its retirement stops under PRV-008.
  observable: >-
    An external service, a shared Resource and every other instance are as they were, apart from
    the Conduits of which the retired instance is an end. CON-008 closes those of which it is
    the target at once, and those of which it is the consumer once its shutdown is confirmed.
  vectors: []

- id: LIF-017
  layer: convention
  level: must
  when: >-
    An actor asks to unregister an instance.
  then: >-
    The request is dispatched only where the instance is retired, and it removes the instance.
    Otherwise it is not dispatched, and reports conflict.
  observable: >-
    After a request to unregister a registered or ready instance, the instance still exists. A
    retired instance that still exists is one whose shutdown is pending or unknown, under
    LIF-035: a retirement of it failed or ended unknown, or its node was declared lost, under
    PLC-017, as the engine declares lost a node whose machine the machine provider reported
    gone, under PLC-024. The request asserts that the shutdown is settled in another way, as
    removing a finalizer by hand does, under PLC-027: no retire hook is dispatched, and before
    the instance is removed the engine asks its runtime provider once more to stop its run,
    under LIF-036. Once it is removed, the Conduits of which it was the consumer are closed,
    under CON-008. A request made while a retirement of the instance has not ended reports
    conflict, under REV-014. An instance whose shutdown is confirmed has been removed already,
    under LIF-035, so a request that names it reports invalid under OPS-029. Like any change,
    the request names the object's current revision. A request for `unregister.v1` that names a
    template is LIF-012.
  vectors: []

- id: LIF-018
  layer: convention
  level: must
  when: >-
    The shutdown of a retired instance can never be confirmed by its implementation.
  then: >-
    It stays unknown until an actor reconciles, under OPS-014, the invocation of `retire.v1`
    whose outcome is unknown, or a further retirement under LIF-026 succeeds. The reconciliation
    is authorized against the target that authorized the retirement, as ACC-033 states.
  observable: >-
    After a reconciliation that records the retirement as having occurred, the shutdown is
    confirmed and the instance is removed, under LIF-035, as LIF-028 states. Whether the run
    was stopped, the actor can tell from the condition `Running`, under PRV-009. Nothing
    confirms the shutdown by the passing of time. An instance whose node was declared lost may
    have no such invocation to reconcile; it, like any retired instance, may be removed by a
    request to unregister it, under LIF-017, while its shutdown is still unknown. A Conduit's
    shutdown is confirmed when it is closed, under LIF-024, and waits for no reconciliation.
  vectors: []

- id: LIF-019
  layer: convention
  level: must not
  when: >-
    An object is unregistered or removed.
  then: >-
    Records, backing files or service data are erased, or any object that refers to it is
    changed, retired or unregistered.
  observable: >-
    The records about the object can still be read. A request for `inspect.v1` no longer names
    the object, under OPS-029, and returns those records only where it names another object that
    they name, under LIF-013. How the records that name no object that still exists are read is
    DL8 of the implementation-defined list. Objects that referred to it hold the same ID as
    before and report it as missing.
  vectors: []

- id: LIF-020
  layer: convention
  level: must
  when: >-
    An actor asks to retire a Pool that owns a Resource whose shutdown is not confirmed.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    The Pool and its Resources are as they were, and a diagnostic in the result names each
    Resource in the way, as IFC-025 states for what a request that is not dispatched says beyond
    its reason. A Resource that is registered or ready, or that is retired with its shutdown
    pending or unknown, is in the way of retiring the Pool.
  vectors: []

- id: LIF-021
  layer: convention
  level: must
  when: >-
    An actor asks, in one explicit operation, to retire a Pool together with the Resources it
    owns.
  then: >-
    The Resources are retired in the reverse of the order of setup: the retirement of a Resource
    is dispatched only once the shutdown of every Resource that the order puts before it is
    confirmed. The order puts a Resource before each Resource that it refers to, names in
    `runtime`, or to which it is the consumer of a Conduit, among the Resources the Pool owns,
    and so before every Resource that those are before in turn. Among Resources that depend on
    each other in a cycle, the order is the engine's. The request dispatches a retirement for
    each Resource that the Pool owns and whose shutdown is not confirmed. For one that is
    already retired it is a further retirement, decided as LIF-026 decides one. It dispatches
    none for a Resource whose shutdown is confirmed. A retirement that ends without the shutdown
    of its Resource confirmed, or that reports a reason in place of being dispatched, holds back
    only the Resources that the order puts after that Resource: the retirement of every other
    Resource is dispatched. The request to retire the Pool is dispatched only once the shutdown
    of every one of those Resources is confirmed.
  observable: >-
    If the shutdown of any Resource is not confirmed, no request to retire the Pool has been
    dispatched, so its state is as it was under LIF-005. The outcome of the request is then
    failed, and its result lists what remains, in diagnostics that name every Resource whose
    shutdown is not confirmed, those whose retirement the request did not dispatch among them:
    the effect of the operation is the Pool's retirement, which has not occurred, and a result
    whose outcome is failed holds no outputs, under IFC-025. Where the shutdown of every
    Resource is confirmed, the Pool's retirement is dispatched as an invocation of `retire.v1`
    of its own, to which LIF-024 applies, and the outcome of the request is the outcome of that
    retirement. Retirements that did succeed are not undone. A Resource that cannot be retired,
    as where its machine is reported unreachable, keeps back only the Resources that the order
    puts after it, which it may still be using: every other Resource is retired. A Resource that
    an earlier request left retired with its shutdown pending or unknown is retired again by
    this one, as a further invocation of `retire.v1` under LIF-026, so a request made again
    after the cause was removed finishes what the first could not. What holds back a Resource is
    a retirement that this request dispatched or would dispatch: one that ended before the
    request was made, with its shutdown not confirmed, does not, since the request retires that
    Resource again. A Resource whose shutdown is confirmed has been removed, under LIF-035, and
    gets no invocation of `retire.v1`. Where a setup, retirement or change of a Resource has
    been dispatched and has not ended, the retirement of it that the request would dispatch is
    not dispatched and reports conflict, under REV-014: it has not ended, so it holds back the
    Resources that the order puts after that Resource, and the Pool is not retired by the
    request. The retirement of a runtime provider that an instance which exists still names,
    inside the Pool or outside it, is not dispatched and reports conflict in the same way, under
    PRV-020. The order extends the reverse of the one POOL-013 gives a Pool's setup, which comes
    from the references among the entries alone, and it holds for every Resource the Pool owns,
    whether or not an entry made it: an onward request of a Resource's retire hook through a
    Conduit to another Resource of the Pool finds that Conduit open, because CON-008 closes it
    only when its target is retired. Two Resources can each be the consumer of a Conduit to the
    other, or refer to each other in their configuration, and no order then satisfies the rule:
    the order among them, like the sequence in which Resources that neither relation joins are
    retired, is DL1 of the implementation-defined list. A Resource that neither relation joins
    to another holds back none. The retirement of each Resource is an invocation of `retire.v1`
    of its own, with its own outcome, and one whose outcome is unknown is reconciled as that
    invocation, under OPS-014. A cancellation of the request under OPS-027 is passed on to the
    retirements in progress, and no further retirement is dispatched; each retirement in
    progress still asks for its stop, under TPL-009. The operation is
    `retire-with-resources.v1`, requested of the Pool, and the retirements it dispatches are
    part of it: the actor's Conduit to the Pool need list only `retire-with-resources.v1`, and
    need not list `retire.v1` as well.
  vectors: []

- id: LIF-022
  layer: convention
  level: must not
  when: >-
    An actor asks to retire or to unregister a first-start object, which is the Pool `system`,
    the node `local`, the Resource `management`, the Resource `access` or the Interface
    `root`, or asks to declare the node `local` lost.
  then: >-
    The object is retired or unregistered.
  observable: >-
    The request reports refused under LIF-034, whoever makes it, and the object is as it was.
    Closing a Conduit of `root` is refused under ACC-024.
  vectors: []

- id: LIF-023
  layer: convention
  level: must not
  when: >-
    No actor has asked for the retirement of an instance, and the instance is none of these: a
    Conduit whose consumer or target is retired or declared lost, under CON-008; a node declared
    lost, or an instance placed on one, under PLC-017 or PLC-024; a Resource that a Pool owns,
    retired with the Pool under LIF-021.
  then: >-
    The instance is retired.
  observable: >-
    Those are the only retirements without a request naming the instance: the engine declares a
    node lost, with no request, where the machine provider reports its machine gone, under
    PLC-024. Nothing is collected for being unused, unreferenced or old. The removal of an
    instance whose shutdown is confirmed is LIF-035, and is not a retirement.
  vectors: []

# --- Split from LIF-014 by consolidation pass 1 (plan-audit ruling 32, decision G12).

- id: LIF-024
  layer: convention
  level: must
  when: >-
    The shutdown of a retired instance is reported.
  then: >-
    A Conduit's shutdown is confirmed when it is closed, however it was closed: it holds nothing
    to shut down. The shutdown of any other instance is confirmed once an invocation of
    `retire.v1` for it has succeeded, and at once for an instance for which no setup was ever
    dispatched, under LIF-025. A shutdown that is not confirmed is unknown where the outcome of
    the latest invocation of `retire.v1` for the instance is unknown, and for an instance for
    which a setup was dispatched and whose node was declared lost, under PLC-017, or whose
    machine the machine provider reported gone, under PLC-024. It is pending otherwise.
  observable: >-
    The status reports pending while the latest invocation of `retire.v1` has not ended and
    after it failed. An instance may be retired more than once, under LIF-026, and it is the
    latest invocation that counts for a shutdown that is not confirmed: any invocation of
    `retire.v1` that succeeded, or that a reconciliation records as having occurred, under
    LIF-028, confirms the shutdown, whatever a later one ended with. An instance that was
    retired by a request, with its shutdown pending or unknown, and whose node is then declared
    lost reports unknown, as PLC-017 states for every instance placed on the node. What an
    invocation of `retire.v1` does is TPL-009: it stops the instance's run, under PRV-008,
    whether or not the run is reported running, so one that succeeds leaves no run of the
    instance running. The shutdown of a Conduit that CON-008 closed without a request, and of
    one whose `close.v1` ended with whatever outcome, is confirmed when it is closed, and the
    Conduit is then removed, under LIF-035, so no inspection shows it. A Conduit whose consumer
    is retired is closed by that once the consumer's shutdown is confirmed, at once where the
    consumer is declared lost, or once a request to unregister the consumer removes it, under
    CON-008 and LIF-017: until then it is not retired, so it reports no
    shutdown, and from the moment it is closed its shutdown is confirmed. A confirmed shutdown
    removes the instance, under LIF-035. What a reconciliation of a setup or a retirement
    changes is LIF-028.
  vectors: []

- id: LIF-025
  layer: convention
  level: must
  when: >-
    An instance for which no setup was ever dispatched is retired.
  then: >-
    Its retire hook is not dispatched, no stop of a run is asked for, and its shutdown is
    confirmed at once.
  observable: >-
    No implementation receives a call because of the retirement, and no runtime provider is
    asked to stop a run. The status reports the state retired and the shutdown confirmed, and
    the instance is then removed, under LIF-035.
  vectors: []

- id: LIF-026
  layer: convention
  level: must
  when: >-
    An actor asks to retire an instance that is retired and whose shutdown is not confirmed.
  then: >-
    The request is decided like any other request to retire the instance. LIF-015 does not stop
    it.
  observable: >-
    A request to retire an instance whose shutdown is pending or unknown can be dispatched, as a
    further invocation of `retire.v1`. Its retire hook is dispatched again only as OPS-021 and
    OPS-028 allow, and the stop of its run is asked for again, which succeeds where nothing
    runs, under PRV-008; the status then reports the shutdown under LIF-024. It is the way from
    a shutdown that is pending, after a retirement that failed, to one that is confirmed. The
    Conduits of which the instance is the consumer are not closed by its retirement while its
    shutdown is not confirmed, under CON-008, so an onward request of the retire hook through
    one of them is permitted as in the first, under ACC-039. Where the instance was declared
    lost, or an actor closed the Conduit, the Conduit is closed, and such a request reports
    refused under ACC-011; where its node was declared lost, the retire hook is not
    dispatched at all, and no run is asked for, under PLC-027. A request that names an instance
    whose shutdown is confirmed reports invalid under OPS-029, because that instance has been
    removed, under LIF-035.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; row GP18 of
# --- docs/proposals/docs-audit/GAPS.md).

- id: LIF-027
  layer: convention
  level: must not
  when: >-
    An instance's setup does not succeed: it fails, has an unknown outcome or is not dispatched.
  then: >-
    A Conduit that the setup opened is closed, an instance that it set up is retired, or a run
    that it asked for is stopped, because of it.
  observable: >-
    After a setup that did not succeed, each declared Conduit it opened is still open, each
    Resource of an entry that it set up is still ready, and a run that it asked for is not
    stopped. The instance's own state is unchanged under LIF-004. A later setup leaves what is
    already open, ready or running as it is, under CON-004, POOL-013 and PRV-007. Meanwhile the
    consumer may make the requests that its open Conduits permit, under ACC-003, and no other.
  vectors: []

# --- Added by the second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md;
# --- findings R3-7, R1-2.2 and R2-C2).

- id: LIF-028
  layer: convention
  level: must
  when: >-
    An actor reconciles, under OPS-014, an invocation of `set-up.v1`, `open.v1`, `retire.v1` or
    `close.v1` whose outcome is unknown.
  then: >-
    Recording that a setup or an open occurred makes the instance ready or the Conduit open,
    unless the instance, or the Conduit's consumer, has been retired. Recording that a
    retirement or a close occurred confirms the shutdown. Recording that it did not occur gives
    the outcome failed, and changes nothing else.
  observable: >-
    After a reconciliation that records a setup as having occurred, inspecting the instance
    reports the state ready, as after a setup that succeeded under LIF-003; an instance that was
    retired in the meantime stays retired, under LIF-006. After one that records an open as
    having occurred, a Conduit whose consumer was retired in the meantime stays registered,
    under CON-031, until CON-008 closes it. After one that records a retirement as having
    occurred, the shutdown is confirmed, and the instance is removed under LIF-035. After
    one that records that a setup did not occur, the state is as LIF-004 leaves it. After one
    that records that a retirement did not occur, the shutdown is as LIF-024 gives it after a
    retirement that failed, and LIF-026 lets the instance be retired again. A Conduit's shutdown
    is confirmed already, under LIF-024. Once a reconciliation confirms the shutdown of an
    instance, the Conduits of which it is the consumer are closed, under CON-008, as they are
    when a retirement succeeds. Each of the four is a management verb, so the reconciliation is
    authorized against the target that authorized the request being reconciled, as ACC-033
    states.
  vectors: []

- id: LIF-029
  layer: convention
  level: must
  when: >-
    An actor asks under LIF-009 for a new Conduit for a declared Conduit while the Conduit made
    for it is not retired.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    The declared Conduit has one Conduit before and after the request. A request for a new
    Resource for a Pool's entry whose Resource is not retired is POOL-003.
  vectors: []

# --- Added by the fix pass of the third round of the re-audit
# --- (docs/proposals/reaudit/round-3/log-fixes.md; findings 3A-14 and 3B-2). Each took a rule
# --- that stood in an observable: LIF-031 from LIF-007, with the reason and the exceptions that
# --- decision 3B-2 gives, and LIF-032 from LIF-012.

- id: LIF-031
  layer: convention
  level: must
  when: >-
    A request that an actor makes on its own behalf holds, in an input that a reference schema
    governs, the resolved form of a reference, `{kind: <Kind>, id: <ID>}`.
  then: >-
    The request is not dispatched, and reports invalid. A request that an actor makes on its own
    behalf names an object by a reference, and never by its ID.
  observable: >-
    The implementation receives no call, whether or not an object of that kind has that ID.
    Every reference schema accepts the resolved form, under OBJ-009, so no schema makes this
    check: the engine does. The rule is for a request that an actor makes on its own behalf, and
    for no other. An onward request may hold the resolved form, because the engine handed it to
    the instance: the configuration that an implementation receives in `_meta` under IFC-006
    holds each reference in that form, under OBJ-021, and an argument or a filter that an
    implementation is sent holds it under IFC-018. So an onward request that passes on a
    reference from its instance's configuration, or one its instance was sent, is dispatched,
    and the engine takes the object by its ID. An invocation is not an object: `reconcile.v1`
    names it by the ID the engine gave it. A request that names an object by a reference that
    resolves to nothing reports invalid too, under OPS-029. Where the actor is not permitted,
    OPS-023 gives refused first.
  vectors: []

- id: LIF-032
  layer: convention
  level: must
  when: >-
    An actor asks for `set-up.v1` or for `retire.v1`, and the request names a template or a
    Conduit.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    A template has no lifecycle state, under LIF-012, and is neither set up nor retired. A
    Conduit is opened with `open.v1` and closed with `close.v1`, which are operations of
    `access`. The thing that the request names exists and is not one the operation addresses, so
    the reason is invalid, as OPS-029 gives it for a request that names nothing. Where the actor
    is not permitted, OPS-023 gives refused first.
  vectors: []

# --- Added by the fix pass of the fourth round of the re-audit
# --- (docs/proposals/reaudit/round-4/log-fixes.md; finding 4A-10). Each took a reason that
# --- stood in an observable: LIF-033 from LIF-009, and LIF-034 from LIF-022.

- id: LIF-033
  layer: convention
  level: must
  when: >-
    An actor asks, with `register-replacement.v1`, for a new instance, and the request names, in
    `instance` and `nested`, a nested instantiation that the named instance does not hold, or
    names a first-start object in `instance`.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    No instance holds a nested instantiation from which a new one could be made. An instance
    that a document of its own made, such as a retired Agent, is followed by registering a new
    document: no instance holds a nested instantiation that made it. A request that names a
    template reports invalid in the same way: the thing exists, and is not one the operation
    addresses, as LIF-032 has it for `set-up.v1`. LIF-009 covers the instances that a declared
    Conduit or a Pool's entry made, and LIF-029 and POOL-003 a request for one of those that is
    not retired. A request that names nothing reports invalid under OPS-029. Where the actor is
    not permitted, OPS-023 gives refused first.
  vectors: []

- id: LIF-034
  layer: convention
  level: must
  when: >-
    An actor asks to retire or to unregister a first-start object, or to declare the node
    `local` lost.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    It reports refused whoever makes it, the root Interface included, although an open Conduit
    of the actor lists the operation: refused means that the request is not permitted, whoever
    asks. LIF-022 is why. It reports refused even where the object's state, or what it owns or
    has placed on it, would make the request report conflict under LIF-017, LIF-020 or PLC-011,
    as OPS-023 orders the reasons. A request to close one of the two Conduits of `root` reports
    refused under ACC-012.
  vectors: []

# --- Added by ruling 41 (docs/proposals/ruling-41/README.md; decision 17 of the principles
# --- review). It is of the layer `convention`.

- id: LIF-035
  layer: convention
  level: must
  when: >-
    The shutdown of a retired instance is confirmed, under LIF-024.
  then: >-
    The instance is removed: it no longer exists, and its records are kept as LIF-019 states. A
    Conduit is so removed when it is closed.
  observable: >-
    No request is needed to remove it, and its removal is not a retirement, under LIF-023. The
    removal is recorded, under REC-001. Afterwards a request that names the instance reports
    invalid under OPS-029, its name can be given to another object of its kind, under OBJ-002,
    and the objects that held its ID report it missing, under LIF-019. An instance whose
    shutdown is pending or unknown is not removed: it stays, retired, until its shutdown is
    confirmed or a request to unregister it removes it, under LIF-017.
  vectors: []

# --- Added by ruling 42 (docs/proposals/ruling-42/README.md; the owner's answer to D11 in
# --- docs/proposals/ruling-41/open-decisions.md, "One more stop, and the provider's
# --- contract").

- id: LIF-036
  layer: convention
  level: must
  when: >-
    A request to unregister an instance is dispatched, under LIF-017, and an implementation item
    that is run is selected for the instance.
  then: >-
    Before it removes the instance, the engine asks the instance's runtime provider once more to
    stop its run, with `stop.v1` naming the instance's ID and giving, in `machine`, the machine
    of the instance's node as the node's status holds it, under PRV-027, as PRV-008 asks it in a
    retirement.
  observable: >-
    The stop is asked for whether or not the run is reported running, so a run left on a machine
    that was cut off, and that has come back or may come back, is asked to stop. PLC-023 does
    not hold this stop back, whatever the machine provider reports: a node declared lost is
    retired and represents no machine, under PLC-026, and for an instance on any other node the
    request is the last time the stop is asked for, so it is asked for even while the machine is
    reported unreachable or omitted. The stop is a provider call, under PRV-005, made within the
    invocation of `unregister.v1` and for its caller, and its record names the instance in its
    `subject`, under REC-002. Where the node was declared lost, it is retired, but its status
    still holds the labels last reported for its machine, so the stop names the machine as
    `run.v1` did, and a runtime provider that keeps no state of its runs can still find it. What
    a runtime provider that cannot carry out the stop now, as where the machine is cut off, does
    with it is what its contract states, such as carry it out once it can, under PRV-021. The
    instance is removed once the stop has ended, or has not been dispatched because the runtime
    provider is not ready or its result of `server/discover` lacks Conduit's extension, under
    PRV-005, whatever came of it: the request to unregister asserts that the instance's shutdown
    is settled in another way, and the outcome of the request is that of the removal. The engine
    asks for no further stop once the instance is removed, and keeps no state of the run, so a
    stop that the provider never received, as where its server was not running, is not asked for
    again. A runtime provider that an instance names is not retired while the instance exists,
    under PRV-020, so the engine has one to ask, and a stop that the provider owes outlives the
    engine's restart, on its machine or on another, and the provider's own retirement, kept
    where its contract states, under PRV-021. No retire hook is dispatched, no run of the
    instance is asked for and no secret is read for it, as under PLC-027; after the engine
    restarts, the runtime provider may first be run again, with reads of its own, under PRV-026.
    An instance with no item that is run, such as one reached only by `remote`, has no run to
    stop, and nothing is asked for.
  vectors: []
