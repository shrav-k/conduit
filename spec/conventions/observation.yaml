# Declared against observed state: what is declared and what is seen are kept apart, and a
# difference between them is reported, never repaired.
# Reporting follows Kubernetes conditions, which keep the time of the last successful observation
# beside an unknown status. Acting only on an explicit request follows Compose and Terraform.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# Removed: OBS-005 → PRV-010 (the runtime provider's restart policy) (ruling 41).
# OBS-007: nothing replaces it (ruling 41).
# Removed: PLC-010 → OBS-003 and LIF-010 (ruling 32).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: OBS-001
  layer: convention
  level: must not
  when: >-
    Something is observed about an instance.
  then: >-
    The instance's declared definition, configuration or revision changes because of it.
  observable: >-
    The declared part of an inspection result is the same before and after any observation. It
    changes only by an operation that an actor requested and that changes it, as the convention
    on revisions states.
  vectors: []

- id: OBS-002
  layer: convention
  level: must
  when: >-
    An observation is reported.
  then: >-
    It carries the time it was made and its source, the context in which it was made.
  observable: >-
    Every observation in an inspection result has both. An observation is reported as a
    condition of LIF-011, its time in `lastHeartbeatTime` and its source in `source`, a
    URI-reference that the engine names, as it names the `source` of a record under REC-005.
  vectors: []

- id: OBS-003
  layer: convention
  level: must
  when: >-
    Something about an instance cannot be observed now, for example because the machine
    provider reports its machine unreachable, under PLC-023.
  then: >-
    It is reported as unknown, as a condition whose `status` is `Unknown`, with the time of the
    last successful observation of it in `lastHeartbeatTime`.
  observable: >-
    The earlier value is not shown as current. Where it was never observed, the inspection
    result says unknown with no time. When a machine is reported unreachable, this holds for
    every instance placed on its node, and instances on other nodes report as before.
  vectors: []

- id: OBS-004
  layer: convention
  level: must not
  when: >-
    What is observed of an instance differs from what is declared for it.
  then: >-
    Anything acts to remove the difference without an explicit request.
  observable: >-
    The difference appears in the instance's status and stays until an actor asks for an
    operation that removes it. No setup, control, open or retire is dispatched because of it. A
    runtime provider that restarts a run does so under its own restart policy, under
    PRV-010, and the engine dispatches nothing because of it. Once the engine has restarted, it
    runs a provider whose run ended with it again only when it must make a provider call to
    that provider, under PRV-026, and not because the run is seen to have stopped.
  vectors: []

- id: OBS-006
  layer: convention
  level: must not
  when: >-
    An instance is inspected or observed.
  then: >-
    An effect occurs, or the actor that inspects it gains access to anything.
  observable: >-
    Inspecting leaves every instance's status and every Conduit as it was, and that actor's
    requests are permitted or refused exactly as before. That it starts no model work is
    IMP-002.
  vectors: []
