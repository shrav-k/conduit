# Operations: the shared convention on idempotency keys and outcomes.
# Owner rulings of 2026-11-05 (plan-audit rulings 20, 28, 32 and 33). Draft: no vector exists
# yet.
# The at-most-once promises were explored by model checking in
# experiments/004-stateright-evaluation.
# A record is kept and never altered (conventions/records.yaml). What is kept for an idempotency
# key is the invocation's state, which is in progress or its outcome; since ruling 41 the
# engine keeps it as its own state, apart from the records (OPS-008). ACC-020 and ACC-021 were
# folded into OPS-005 and REC-001. The
# ruling on the core package and the schemas (ruling 37) changed OPS-007, OPS-009, OPS-014,
# OPS-016 and OPS-019, and added OPS-025. The conversion of the older text (decision DA3 of the
# docs audit, docs/proposals/docs-audit/GAPS.md) changed OPS-016 and added OPS-026 and OPS-027.
# The second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed
# OPS-005, OPS-006, OPS-008 to OPS-010, OPS-012, OPS-014 to OPS-019, OPS-021 to OPS-023, OPS-025
# and OPS-026, made OPS-015 the rule for an identity under which the sending instance has no
# invocation, and added OPS-028. Its closing pass
# (docs/proposals/reaudit/round-2/log-closing.md) changed
# OPS-007, OPS-009, OPS-012, OPS-014, OPS-016, OPS-017, OPS-022 and OPS-024. Its last pass
# (docs/proposals/reaudit/round-2/log-tail.md) changed OPS-005, OPS-007, OPS-009 and OPS-014,
# and added OPS-029, on a request that names what does not exist. The follow-up to that pass
# changed OPS-007. No promise of this file has been removed.
# The fix pass of the third round of the re-audit (docs/proposals/reaudit/round-3/log-fixes.md),
# on the coordinator's decisions in docs/proposals/reaudit/round-3/DECISIONS.md, which ruling 39
# accepted, changed OPS-014, OPS-016, OPS-021, OPS-023, OPS-028 and OPS-029, and added
# OPS-030, on reconciling an invocation whose outcome is not unknown. It removed none.
# Its follow-up, on the decisions of the section "The fix pass, and what it left" of the same
# file, which are the coordinator's too, changed OPS-014 and added OPS-031, on an input of
# `reconcile.v1` that does not belong to the invocation it names.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which ruling 39 accepted, changed
# OPS-005, OPS-006, OPS-009, OPS-010, OPS-012, OPS-015 to OPS-017, OPS-022, OPS-024, OPS-026 and
# OPS-031: an invocation counts as dispatched through the Conduit of its latest attempt, a step
# that a further run does not dispatch counts with the outcome it has, and the default of a
# property is filled before a request is validated or compared. It added none and removed none.
# The follow-up to that pass, on the decisions of the section "The fix pass, and what it left"
# of the same file, which are the coordinator's too, changed OPS-005 and OPS-022.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 38 of the owner (docs/proposals/ruling-38/README.md, 2026-11-06) changed this file;
# what changed is in docs/proposals/ruling-38/log-spec.md.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40
# (docs/proposals/ruling-40/README.md) and the principles review
# (docs/proposals/principles-review/README.md), removed OPS-015 and OPS-016 (decision 6c: the
# retrieval of a result goes, and a caller that lost a result repeats its request, under OPS-009
# and OPS-032) and OPS-017 (decision 6a: nothing is withheld, and nothing replaces it). They are
# the first promises removed from this file, and their IDs are not reused. It changed OPS-005,
# OPS-007 to OPS-009, OPS-014, OPS-019, OPS-021 to OPS-024, OPS-026 to OPS-029 and OPS-031,
# and added OPS-032, on a repeat of an invocation that has not ended or whose outputs are no
# longer kept. What changed is in docs/proposals/ruling-41/log-G4.md. The integration of the
# rewrite (docs/proposals/ruling-41/log-integration.md) changed OPS-007, so that the error of
# IFC-008 gives failed and not unknown. Its coverage check (the same log, "Coverage check")
# changed OPS-008, whose state is kept for every invocation that is dispatched, as alignment
# C33 has it, and added OPS-033, on arguments that do not satisfy an operation's
# `inputSchema`, so that IFC-025 has a promise to name for the commonest invalid request.
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06), on the coordinator's decisions
# in docs/proposals/ruling-41/open-decisions.md, changed OPS-005, OPS-008, OPS-009, OPS-014,
# OPS-024, OPS-027, OPS-028 and OPS-032, and added OPS-034: OPS-032 is split, and keeps a
# repeat of an invocation that has not ended, while OPS-034 takes a repeat of one that
# succeeded and whose outputs are no longer kept; a cancellation is passed on to the parts of a
# setup or a retirement; a new attempt of a hook is made for the caller of the setup or the
# retirement that dispatches it; and an invocation of unknown outcome is found in the status of
# its instance. It removed none. What changed is in docs/proposals/ruling-42/log-conventions.md.
# The names of ruling 42 (the vocabulary audit's N15; log
# docs/proposals/ruling-42/log-rename-b.md) renamed operation identity to idempotency key, and
# `operationIdentity` to `idempotencyKey`, in OPS-008 to OPS-012, OPS-018, OPS-019, OPS-021,
# OPS-024, OPS-025 and OPS-028, and the convention to that of idempotency keys and outcomes, in
# the first line of this comment. It removed none and added none.
# Ruling 43 (docs/proposals/ruling-43/README.md, 2026-11-06), which accepted the proposal on
# work across machines (docs/proposals/multi-machine/README.md), changed OPS-027, whose
# observable says that a connection the engine sees drop cancels the invocation for the
# engine, and that whether and when the implementation learns of it is its transport's and its
# gate's, under PRV-025. It added none and removed none. What changed is in
# docs/proposals/ruling-43/log-secrets.md. The verification of ruling 43
# (docs/proposals/ruling-43/log-integration.md, "Verification") changed the observables of
# OPS-014, on what an actor can check of an invocation dispatched to a machine that is cut off,
# and of OPS-027, on the gate's bound.
# The fix pass of the fifth round of the re-audit
# (docs/proposals/reaudit/round-5/log-fix-F3.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-5/DECISIONS.md, changed OPS-007, which tells the error -32021 of
# IFC-008 apart by `data.requiredCapabilities` (M60); OPS-008, OPS-009 and OPS-034, under which
# a repeat is answered from the stored outputs only where every filter that applies to it was
# sent with the latest attempt, and no outputs are kept of an invocation whose outcome a
# reconciliation set (M32, M39); OPS-021 and OPS-028, since no hook declares
# `deduplicates: true` (M42); OPS-022, which counts the connection to a `remote` item as a part
# with no effect (M40); OPS-030, under which a reconciliation settles the latest attempt (M34);
# and OPS-031, on a control whose instance is retired (M35). It added none and removed none.
# The verification of the fixes of round 5 (docs/proposals/reaudit/round-5/log-fixes.md,
# "Verification") changed OPS-005, on a repeat to which a filter applies that the latest attempt
# was not sent (V4), and OPS-007, which excepts -32021 for a capability that the call did not
# declare and an error after which the call is sent once more under IFC-046 (V2, V2-15). It
# added none and removed none.
# Ruling 44 (docs/proposals/ruling-44/README.md, 2026-11-07), on round 6 of the re-audit
# (docs/proposals/reaudit/round-6/), changed OPS-007, which excepts -32021 for a capability
# that the call did not declare only from an implementation that carries Conduit's keys, under
# IFC-047, so that IFC-010 reads a plain server's as any other error, reversing V2-15 (6-1-01);
# and OPS-005, OPS-008, OPS-009, OPS-024, OPS-032 and OPS-034, under which a repeat to which a
# filter applies, of an invocation that succeeded, is dispatched again where the operation has
# no effect, reports conflict where it has one and declares outputs, and is answered from its
# outcome where it has one and declares none, and the filters of the latest attempt are no
# longer kept (6-1-02). It added none and removed none. What changed is in
# docs/proposals/reaudit/round-6/log-conventions.md. Its integration
# (docs/proposals/reaudit/round-6/log-integration.md) changed the observable of OPS-005 again:
# a call to the tool that a Conduit would give a control its target does not have reports
# invalid under TPL-013, as IFC-012 now states, and every other call to a tool that is not
# presented reports refused. The verification of round 6
# (docs/proposals/reaudit/round-6/log-integration.md, "Verification") changed OPS-007, whose
# first case is a missing result from an implementation that carries Conduit's keys, so that a
# plain server's errors are read by IFC-010 alone (R-03), and whose observable uses IFC-033's
# test (C-01); OPS-005, whose invalid case holds where the target holds the control's contract
# (R-07); OPS-008, under which a repeat that OPS-024 dispatches does not report conflict once
# outputs are not kept (R-06); and OPS-025, which no longer reaches a request that matches a
# repeat that ended with a reason (R-13). It added none and removed none.

- id: OPS-001
  layer: convention
  level: must
  when: >-
    An invocation that was dispatched has ended, and its implementation did not answer with a
    reason in place of an outcome under IFC-026.
  then: >-
    It has exactly one outcome: succeeded, failed or unknown.
  observable: >-
    The record of the invocation's end states one of those three values and no other.
  vectors: []

- id: OPS-002
  layer: convention
  level: must
  when: >-
    An implementation reports the outcome succeeded.
  then: >-
    The effect the operation's contract describes has occurred.
  observable: >-
    Inspecting what the effect changes shows the effect present.
  vectors: []

- id: OPS-003
  layer: convention
  level: must
  when: >-
    An implementation reports the outcome failed.
  then: >-
    The effect the operation's contract describes has not occurred, in whole or in part.
  observable: >-
    Inspecting what the effect changes shows no trace of the effect. Invoking the operation
    again cannot apply the effect a second time.
  vectors: []

- id: OPS-004
  layer: convention
  level: must
  when: >-
    An implementation cannot confirm that the effect occurred, cannot confirm that it did not,
    or knows that it occurred only in part.
  then: >-
    It reports the outcome unknown.
  observable: >-
    The record of the invocation's end states unknown in each of those three cases.
  vectors: []

- id: OPS-005
  layer: convention
  level: must
  when: >-
    A request is not dispatched, and it is not a repeat that OPS-009 or OPS-012 answers with the
    invocation's outcome; or the implementation answers a request with a reason in place of an
    outcome, under IFC-026.
  then: >-
    It has no outcome. It reports why, as exactly one of: refused, invalid, conflict or
    unavailable.
  observable: >-
    The result that is returned and the record of the request carry the same one of those four
    reasons and no outcome. Where the request was not dispatched, the implementation received no
    call. Where the implementation gave the reason, which is refused or unavailable, it
    performed nothing. Where more than one reason applies, OPS-023 says which is reported. What
    a request that is not dispatched says beyond its reason, it says in diagnostics, as IFC-025
    states: a result that reports invalid or conflict carries among them an error diagnostic
    whose `ruleId` is the ID of the promise that decided it. A repeat of an invocation that has
    not ended is not dispatched and reports conflict, under OPS-032, and so does a repeat of one
    that succeeded, of an operation that declares outputs, that OPS-009 does not answer and
    OPS-024 does not dispatch, under OPS-034. A call that names a tool the engine does not
    present is answered with no result: its reason is in the protocol's error, as IFC-012
    states, and is refused, or invalid under TPL-013 where the call names the tool that an open
    Conduit would give a control that its target does not have, where the target holds the
    control's contract. So is a request that the protocol has the engine reject with an error of
    its own: where the engine could establish the instance that sent it, its reason is invalid
    and is in that error, under IFC-036.
  vectors: []

- id: OPS-006
  layer: convention
  level: must
  when: >-
    An implementation that carries Conduit's keys returns a result.
  then: >-
    The result states its outcome, or a reason in place of one where IFC-026 has it give one.
  observable: >-
    Every result such an implementation returns across the implementation interface carries one
    of the three outcome values, in the key IFC-009 names, or the reason refused or unavailable,
    in the key IFC-026 names. An implementation marked `plain` states neither, and the outcome
    of its result is the one IFC-010 gives.
  vectors: []

- id: OPS-007
  layer: convention
  level: must
  when: >-
    No result arrives from an implementation that carries Conduit's keys, other than the
    protocol's error -32021 whose `data.requiredCapabilities` names Conduit's extension, with
    which IFC-008 has such an implementation say that it performed nothing, or names a
    capability that the call did not declare, which IFC-047 has such an implementation answer
    only where it has performed nothing for the call, and other than an error after which the
    engine sends the call once more under IFC-046; the implementation stops before returning
    one; a result from an implementation that carries Conduit's keys states neither an outcome
    nor a reason under IFC-026, or states both; such a result states an outcome with which its
    `isError` disagrees; or a declared output fails validation in a result that would otherwise
    have the outcome succeeded, whether or not the implementation is marked `plain`.
  then: >-
    The invocation's outcome is unknown.
  observable: >-
    In each of those five cases the record of the invocation's end states unknown. A result's
    `isError` disagrees with its outcome where it is true beside succeeded, or not true beside
    failed or unknown, as IFC-009 states. It states succeeded or failed only when the
    implementation's result stated it, when an implementation that carries Conduit's keys
    answered with the error of IFC-008, or with -32021 for a capability that the call did not
    declare, under IFC-047, which each give failed, or, for an implementation marked `plain`,
    when IFC-010 gives it. An error of a plain implementation is read by IFC-010 and not by the
    first case here, and its -32021 is read as any other: the protocol does not say that a
    server that answers so has not acted, and nothing in this specification binds a plain
    server, so IFC-010 gives failed for an operation whose contract states no `effect`, that is
    not a control and whose contract is not marked `startsModelWork: true`, and otherwise
    unknown, and a repeat of an invocation so left unknown is not dispatched to it, under
    OPS-012. A plain server that returns no result at all leaves the outcome unknown under
    IFC-010, as this promise leaves that of any other. After an error on which the call is sent
    once more under IFC-046, the outcome is read from the response to the call sent again. An
    output that the contract's `outputSchema` lists under `required` and that the result does
    not hold fails validation in this sense: a plain server that returns a complete result that
    is not an error, and no `structuredContent`, for an operation with such an output has the
    outcome unknown. A result that states failed or unknown, and an error of a plain server,
    hold no outputs to validate, under IFC-009 and IFC-010.
  vectors: []

- id: OPS-008
  layer: convention
  level: must
  when: >-
    An invocation is dispatched, whether or not its request carries an idempotency key; or a
    caller makes a request of a target that carries an idempotency key.
  then: >-
    An idempotency key that a request carries is scoped to that caller, that target and the
    instance that sent the request. At most one invocation exists for one caller, one sending
    instance, one target and one idempotency key. The engine keeps, as its own state and apart
    from the records, what repeats and reconciliations need, for every invocation: its
    idempotency key where it carries one, the engine's ID for it, its state, a digest of its
    contents, its operation, its caller, the instance it was dispatched to, the Conduit it was
    dispatched through where it went through one, the target that authorized it and, for a
    control, the values it was sent. No purge touches that state.
  observable: >-
    A repeat of the request, from the instance that sent it, for that caller and to that target,
    is answered from that one invocation however many times the request was sent, under OPS-009,
    OPS-012, OPS-024, OPS-032 and OPS-034. The same idempotency key sent by another caller, by
    another instance for the same caller, or to another target, belongs to another invocation.
    The instance that sends a request an actor makes on its own behalf is that actor, and the
    instance that sends an onward request is the one that makes it: a request an Agent sends
    itself and an onward request that a Resource sends for that Agent, with one idempotency key
    and one target, are two invocations. The idempotency key that the engine gives a setup hook
    or a retire hook is the one exception to this scope: it is scoped to the instance alone,
    under OPS-028, and the caller kept for such a hook's invocation is that of its latest
    attempt. A purge under REC-004 does not change what a repeat or a reconciliation finds. How
    the digest is computed is DL2 of the implementation-defined list, and the outputs of an
    invocation that succeeded are kept for a repeat for as long as DL10 says, under OPS-009,
    after which a repeat reports conflict, under OPS-034, unless OPS-024 dispatches it.
  vectors: []

- id: OPS-009
  layer: convention
  level: must
  when: >-
    A request arrives from the instance that sent an earlier request, with the same caller,
    target, idempotency key and contents as that request; the invocation that request began
    succeeded; and either no filter applies to the request, and (the operation declares no
    outputs and is not implemented by a plain server, or the engine still keeps the
    invocation's outputs and any plain content), or a filter applies to it, and
    the operation declares no outputs and is not one that OPS-024 dispatches again: its contract
    states an `effect`, it is a control, or its contract is marked `startsModelWork: true`.
  then: >-
    The request is a repeat, not a new request. Nothing is dispatched, and the result is that
    invocation's: the outcome succeeded, its outputs and any plain content.
  observable: >-
    For this promise and OPS-034, the content of a succeeded plain invocation counts as outputs that
    must be kept, whether or not the operation declares outputs. The engine keeps and gives that
    content again unchanged, together with any declared outputs, for as long as DL10 keeps them.
    After it no longer keeps the content, a repeat reports conflict under OPS-034, and is never
    dispatched to recover it. A reconciliation supplies no content. The implementation receives no
    further call for the invocation, and the result holds the outputs that the invocation returned
    and the engine's ID for it, under IFC-025. Two requests have the same contents when they name
    the same operation and their arguments are equal under SCH-007, judged after the defaults are
    filled in under OPS-026: that of an input that was left out, and that of a property that is
    absent from a map that was supplied. A request that supplies `{}` for an input whose schema
    gives a property a `default`, and one that supplies the map with that default written out, have
    the same contents. The engine keeps the outputs of an invocation that succeeded for as long as
    DL10 of the implementation-defined list says, and keeps none of one whose outcome a
    reconciliation set, since `reconcile.v1` takes none. An operation that declares no outputs and
    is not implemented by a plain server has none to lose: a repeat of an invocation of it that
    succeeded is answered so, with no `structuredContent`, unless OPS-024 dispatches it again.
    IFC-033 omits `outputSchema` for such an operation: the protocol makes it optional, a client
    that sees one may prefer the structured result, and an empty map would hide the content. Where a
    filter applies to the repeat, that answer gives only the outcome already recorded, and no filter
    judges it, under ACC-008. A repeat of an invocation that has not ended reports conflict under
    OPS-032, and so, under OPS-034, does one of an invocation that succeeded, of an operation that
    declares outputs, where no filter applies to the repeat and the engine does not keep them, or
    where a filter applies to it and OPS-024 does not dispatch it. A repeat of an invocation that
    succeeded, of an operation whose contract states no `effect`, that is not a control and whose
    contract is not marked `startsModelWork: true`, to which a filter applies, is dispatched as a
    new attempt under OPS-024, so that its filters decide afresh; a repeat of one whose outcome is
    unknown is OPS-012, and of one that failed OPS-024. A repeat is a request through a Conduit, and
    the access decision is made for it like any other, under ACC-036: a repeat sent through a
    Conduit that has been closed reports refused under ACC-011.
  vectors: []

- id: OPS-010
  layer: convention
  level: must
  when: >-
    A request arrives from the instance that sent the request of an existing invocation, with
    that invocation's caller, target and idempotency key and with different contents: another
    operation, or arguments that are not equal under SCH-007 once the defaults are filled in, as
    OPS-009 states.
  then: >-
    It is not dispatched, and reports conflict.
  observable: >-
    The implementation receives no call for the second request. The invocation's state is
    unchanged.
  vectors: []

- id: OPS-011
  layer: convention
  level: must
  when: >-
    A request arrives carrying no idempotency key.
  then: >-
    It is a new invocation. It is not treated as a repeat of an earlier request because its
    contents match.
  observable: >-
    Two requests with identical contents and no idempotency key are two invocations, each with
    its own ID under IFC-006 and its own records, and the implementation receives two calls.
  vectors: []

- id: OPS-012
  layer: convention
  level: must
  when: >-
    A request arrives that matches the request of an invocation whose outcome is unknown, as
    OPS-009 describes a match: from the same instance, with the same caller, target, idempotency
    key and contents. It is a repeat.
  then: >-
    The repeat is dispatched as a new attempt only if the operation's contract declares
    `deduplicates: true` and the implementation is not marked `plain`. Otherwise nothing is
    dispatched, and the result gives the state unknown.
  observable: >-
    Where the contract does not declare it, or the implementation is plain and so never receives
    the idempotency key, the implementation receives no further call for the invocation. A new
    attempt carries the same idempotency key as the first and, like any dispatch, needs
    the request to be permitted under ACC-001.
    Where the new attempt goes through another Conduit than the attempt before it, the
    invocation counts as dispatched through that Conduit, as OPS-024 states.
  vectors: []

- id: OPS-013
  layer: convention
  level: must
  when: >-
    An invocation's outcome is unknown, and no new attempt at it is dispatched under OPS-012.
  then: >-
    The outcome stays unknown until it is reconciled.
  observable: >-
    Asking for the invocation's state at any later time reports unknown, until a reconciliation
    of it under OPS-014 is recorded.
  vectors: []

- id: OPS-014
  layer: convention
  level: must
  when: >-
    An actor records, with what it checked, that the effect of an invocation whose outcome is
    unknown occurred or that it did not. The actor is the consumer of an open Conduit that lists
    `reconcile.v1`, to the target that ACC-033 names for reconciling that invocation.
  then: >-
    The invocation's outcome becomes succeeded or failed accordingly.
  observable: >-
    A record states the new outcome, the actor that reconciled it and what the actor checked.
    The earlier record that the outcome was unknown is kept. An actor with no such Conduit
    reports refused. The request is the operation `reconcile.v1`, which names the invocation by
    the ID the engine gave it. The instance that sent the invocation's request learns that ID
    from the `_meta` of the request's result, or of the result of a repeat of it, under IFC-025,
    or from the records, under REC-002, or from the status of the instance that the invocation
    was dispatched to or names, under LIF-013, which lists it until it is reconciled: so an
    actor finds there a hook, which no actor sends, and an invocation whose result was lost and
    whose records were purged. The target is the one that authorized the request being
    reconciled where the invocation is of a management verb, and otherwise the Pool that owns
    the instance the invocation was dispatched to, or `management` where that instance is not a
    Resource or the Pool that owns it is retired, as ACC-033 states. Where the instance that the
    invocation was dispatched to, or that an invocation of a management verb named, no longer
    exists, the target is `management`, and the reconciliation records the outcome and stores
    nothing, as ACC-033 states. A request that names an invocation whose outcome is not unknown
    reports conflict, under OPS-030. One that names an ID which the engine gave to no invocation
    reports invalid, under OPS-029. What the reconciliation of a setup, an open, a retirement or
    a close changes beside the outcome is LIF-028, and what that of a control changes is
    REV-010. Where a setup or a retirement of unknown outcome asked for a run or for its stop,
    what the actor checks includes the state of the run, which inspecting the instance reports
    under PRV-009. An actor may reconcile a retirement whose retire hook ended unknown, which
    confirms the shutdown under LIF-028 although the hook's outcome is still unknown; otherwise
    every further retirement ends unknown until the hook itself is reconciled, under OPS-021 and
    OPS-022, and so does every further setup while a setup hook is unknown. What an actor checks
    of an invocation dispatched to an instance on a machine that is cut off may be out of date
    until the machine is back and the run is inspected, under PRV-009: the work may still run to
    its end there, under OPS-027, and a gate closes a server's stream only where the server
    answers with one, under PRV-025, so an effect may land after the actor has recorded that it
    did not occur. OPS-031 says which input of `reconcile.v1` makes a request invalid where it
    does not belong.
  vectors: []

- id: OPS-018
  layer: convention
  level: must not
  when: >-
    Requests that one instance sends for one caller to one target, and that carry one
    idempotency key, are lost, delayed, reordered or repeated, or the engine or the
    implementation handling them stops and restarts.
  then: >-
    The effect is applied more than once.
  observable: >-
    Inspecting what the effect changes shows it applied at most once for that idempotency key,
    in every ordering of those events.
  vectors: []

# --- Added by the consolidation rulings (plan-audit ruling 28).

- id: OPS-019
  layer: convention
  level: must
  when: >-
    An actor asks for a management verb, such as register, replace, set up, retire, open, close,
    reconcile, declare lost, unregister or install a package.
  then: >-
    The request is an operation of a capability that `management`, `access` or a Pool offers,
    and every promise about operations and about access applies to it as to any other.
  observable: >-
    Such a request needs an open Conduit that lists it, may carry an idempotency key, ends in
    one of the ways the definitions list, and leaves a record. Without an idempotency key it
    is a new invocation each time, under OPS-011. The capabilities are those of the core
    package: `object-management.v1`, which `management` offers, `access-control.v1`, which
    `access` offers, and `pool-management.v1`, which every Pool offers, under CTR-004. Each verb
    is an Operation contract of the core package, such as `register.v1`, `set-up.v1`, `open.v1`
    and `install.v1`.
  vectors: []

- id: OPS-020
  layer: convention
  level: must
  when: >-
    An actor requests a control.
  then: >-
    The control is an operation, defined by an Operation contract that also states the settings
    it changes. A Conduit lists it like any other operation, and the request is authorized by an
    open Conduit to the instance whose configuration it changes. The promises about operations
    and about access apply to it, with the further rules for controls in the convention on
    revisions.
  observable: >-
    A control needs an open Conduit, whose target is the instance itself, that lists it. It has
    an outcome, and is not dispatched for the same reasons as any other operation.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32; decisions U5, Q3, Q5 and Q1 of the
# --- re-audit).

- id: OPS-021
  layer: convention
  level: must
  when: >-
    An instance is set up or retired again, and the invocation of its setup hook or its retire
    hook from an earlier setup or retirement has the outcome unknown.
  then: >-
    That hook is not dispatched again, except as a new attempt of the same invocation where
    OPS-012 dispatches one, with the idempotency key that OPS-028 gave it.
  observable: >-
    A hook whose outcome is unknown receives no further call however often the instance is set
    up or retired, until it is reconciled under OPS-014: neither `setup-hook.v1` nor
    `retire-hook.v1` declares `deduplicates: true`, so OPS-012 dispatches no new attempt of it.
    A hook that succeeded is not dispatched again, and one that failed is dispatched as a new
    attempt under OPS-024, as OPS-028 states. The other parts of a further setup leave what is
    done already as it is: an open Conduit, a ready Resource and a running run are left as they
    are, under CON-004, POOL-013 and PRV-007.
  vectors: []

- id: OPS-022
  layer: convention
  level: must
  when: >-
    An invocation of `set-up.v1` or of `retire.v1` has ended.
  then: >-
    Its outcome is succeeded only if every part not marked optional succeeded, failed only if no
    part had an effect, and otherwise unknown. In a further setup or retirement, a part that is
    not dispatched counts with the outcome it has from before or from its reconciliation.
  observable: >-
    The parts of a setup are those of TPL-012, and those of a retirement those of TPL-009 and
    TPL-018. Only a declared Conduit or an entry can be marked optional, and the stop of a run
    is a part that is not. Where a part not marked optional did not succeed, the outcome is
    failed if every part that was dispatched either failed, was answered with a reason in place
    of an outcome under IFC-026, or is of an operation whose contract states no `effect`, and is
    unknown if any part succeeded with an effect or ended unknown on an operation that has one.
    The connection to a `remote` item counts as a part of an operation whose contract states no
    `effect`: it is the engine's own holding of the values of the item's `headers`, under
    IFC-041, and changes nothing outside the engine. A further retirement under LIF-026, or a
    further setup, in which a hook is left with the outcome unknown under OPS-021 has the
    outcome unknown, even where it dispatched nothing: for a retirement the shutdown then
    reports unknown under LIF-024, until the hook is reconciled under OPS-014. A part that
    succeeded before, that CON-004 or POOL-013 counts as succeeded because what it does is done
    already, or that was reconciled as having occurred counts as succeeded, so a further setup
    or retirement can succeed without dispatching it again, and one that failed and is not
    dispatched again counts as failed.
  vectors: []

- id: OPS-023
  layer: convention
  level: must
  when: >-
    A request is not dispatched, and more than one of the four reasons applies to it.
  then: >-
    It reports one reason, chosen in this order: invalid if the request cannot be read;
    otherwise refused, or unavailable where the access decision cannot be made under ACC-037;
    then invalid; then conflict; then unavailable for any other cause. Where the access decision
    cannot be made, nothing else about the request is examined or reported.
  observable: >-
    A request that is not permitted reports refused whatever else is wrong with it, and its
    result says nothing else about the objects it names. A request whose access decision cannot
    be made, because the state of the Conduits cannot be established, reports unavailable
    whatever else is wrong with it, provided it can be read, and its result carries no
    diagnostic and says nothing else about the objects it names either: the actor has not been
    found to be permitted. A request to register a document under a name that is taken, made
    while that state cannot be established, reports unavailable, and not conflict with a
    diagnostic that names the object. A permitted request that fails a schema and also names a
    revision that is not current reports invalid. Unavailable for any other cause, such as a
    restriction that cannot be evaluated under ACC-014 or a target that is not ready under
    CON-024, is reported only where no other reason applies.
  vectors: []

- id: OPS-024
  layer: convention
  level: must
  when: >-
    A request arrives that matches the request of an invocation, as OPS-009 describes a match:
    from the same instance, with the same caller, target, idempotency key and contents. The
    invocation's outcome is failed; or it is succeeded, a filter applies to the request, and the
    operation's contract states no `effect`, the operation is not a control and its contract is
    not marked `startsModelWork: true`, as IFC-033 tests for `readOnlyHint`. It is a repeat.
  then: >-
    The repeat is dispatched as a new attempt. An invocation counts as dispatched through the
    Conduit of its latest attempt.
  observable: >-
    The implementation receives a further call. The invocation's state is then in progress, and
    afterwards the outcome of the new attempt. The records of the earlier attempt are kept. Like
    any dispatch, the new attempt needs the request to be permitted under ACC-001. Where the
    invocation succeeded, the new attempt is made so that the filters that apply to the repeat
    decide afresh, under IFC-019, what it may do and return now, as they would for a new
    request: only an implementation applies a filter, and one may forbid now what it permitted
    when the earlier attempt was made, as one that permits a read only before a time that has
    since passed does. Its operation states no `effect`, so it changes nothing outside itself,
    under CTR-002, and the new attempt applies no effect a second time. Where it succeeds, the
    outputs that the engine keeps for a repeat under OPS-009 are its own. Where the
    implementation answers a new attempt with a reason in place of an outcome, under IFC-026,
    having performed nothing, the repeat reports that reason and no outcome, and the
    invocation's outcome, and the outputs that the engine keeps for it, are as they were before
    that attempt. A repeat may arrive through another Conduit than the earlier request did:
    through the replacement of a closed declared Conduit, which keeps its local name and so its
    tool names under LIF-009, or through another Conduit of the same consumer to the same target
    that lists the operation. OPS-008 does not put the Conduit in the scope of an idempotency
    key, so the request is a repeat all the same. From the new attempt on, the Conduit of that
    attempt is the one the invocation was dispatched through, and a close of it while the
    invocation runs has the effect that ACC-034 states. The same holds for a new attempt that
    OPS-012 dispatches. A repeat that is not dispatched, under OPS-009, OPS-032 or OPS-034,
    changes none of this.
  vectors: []

# --- Added with the core package (plan-audit ruling 37; point P10 of the ruling on the core
# --- package and the schemas).

- id: OPS-025
  layer: convention
  level: must
  when: >-
    A request arrives from the instance that sent an earlier request, with the same caller,
    target, idempotency key and contents as that request, which ended with a reason and no
    outcome, and which neither began nor repeated an invocation that OPS-008 keeps.
  then: >-
    It is a new request, and is decided afresh. It is not answered with the earlier reason.
  observable: >-
    The earlier request has no outcome and began no invocation that OPS-008 keeps, whether the
    engine did not dispatch it or the implementation answered with a reason under IFC-026,
    having performed nothing. A request that matches a repeat that ended with a reason, such as
    one that OPS-034 answered with conflict, or one that OPS-024 dispatched and that a filter
    then forbade, also matches the request that began the invocation, and is a repeat of that
    invocation under OPS-009, OPS-012, OPS-024, OPS-032 or OPS-034. The later request is checked
    as if the earlier one had not been made: it may be dispatched, or may end with a reason
    again, and each has its own record. Nothing is applied twice, because the earlier request
    performed nothing.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; rows GP7 and
# --- GP19 of docs/proposals/docs-audit/GAPS.md).

- id: OPS-026
  layer: convention
  level: must
  when: >-
    An operation is requested, and either no value is given for an input whose property in the
    contract's `inputSchema` states a `default`, and the operation is not a control, or a value
    that is given holds a map from which a property that has a `default` in the input's schema
    is absent.
  then: >-
    The engine fills in the default before the request is validated against the operation's
    `inputSchema`, before it is compared with another request under OPS-009, and before it is
    dispatched. The value so filled is what is sent.
  observable: >-
    The implementation receives the default as the value of that input: the `arguments` of the
    call hold it. An input whose property states a `default` may be left out whether or not the
    `inputSchema` lists it under `required`, because the default is filled before the request is
    validated. The default of a property is filled as SCH-009 fills it in every value that a
    schema governs: `options: {}` for an input whose schema is `{type: object, properties:
    {depth: {type: integer, default: 1}}, required: [depth]}` satisfies that schema, and the
    implementation receives `{depth: 1}`. A control applies no default to an input that is not
    supplied: such an input leaves its setting as stored, as REV-006 states. A value that is
    supplied to a control is filled as any supplied value is.
  vectors: []

- id: OPS-027
  layer: convention
  level: must
  when: >-
    An invocation is cancelled while it is in progress: the request that dispatched it is
    cancelled by the protocol's own means, which are `notifications/cancelled` on stdio, the
    close of the response stream on Streamable HTTP, and `tasks/cancel` for a task.
  then: >-
    The engine passes the cancellation on to the implementation by the protocol's means. The
    invocation's outcome is unknown, unless its implementation confirms that nothing was done.
  observable: >-
    The record of the invocation's end states unknown, or failed where the implementation's
    result states that outcome, which under OPS-003 says that the effect has not occurred in
    whole or in part. Asking for a cancellation never makes an outcome failed by itself. No
    other form of confirmation is defined, and the protocol has a receiver that stops send no
    response to the request, so a cancelled invocation is usually unknown until it is reconciled
    under OPS-014, as OPS-013 states. A connection over Streamable HTTP that the engine sees
    drop while the request is in progress closes its stream, and so cancels the invocation,
    whose outcome is then unknown for the engine. Whether and when the implementation learns of
    the cancellation is its transport's and, behind a gate, the gate's, whose provider's
    contract states how soon it closes a server's stream once the connection from the
    enforcement point has gone silent, under PRV-025: a cut in which packets are dropped closes
    nothing that either side sees at once, so it may reach the implementation late or never, and
    the work may run to its end meanwhile. A `tasks/cancel` is decided under the Conduit the
    invocation was dispatched through, as IFC-016 states. Where the engine itself implements the
    invocation in parts, as it does `set-up.v1`, `retire.v1` and `retire-with-resources.v1`, it
    passes the cancellation on to each part in progress: by the protocol's means for a call that
    it sent, such as a hook, a read of a secret or a provider call other than a stop, and, for a
    part whose implementation is `engine`, such as an `open.v1` under CON-004, an entry's setup
    under POOL-013 or a Resource's retirement under LIF-021, by cancelling that invocation as
    this promise cancels one. A cancelled part has not succeeded, so no later part begins, under
    TPL-012, and `retire-with-resources.v1` dispatches no further retirement, under LIF-021.
    Every retirement still asks for its stop, under TPL-009, and a stop in progress is not
    cancelled: the instance is retired from the moment its retirement was dispatched, under
    LIF-005, so leaving out the stop gains nothing, and the protocol lets a receiver ignore what
    it cannot cancel. Parts that have ended are not undone. The outcome of a setup or a
    retirement is then OPS-022's, and that of `retire-with-resources.v1` LIF-021's. A cancelled
    part's invocation ends when the cancellation is sent, with the outcome that this promise
    gives it, so an onward request that names it is refused from then on, under ACC-019. How
    long the engine waits for a result is DL3 and DL10 of the implementation-defined list.
  vectors: []

# --- Added by the second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md;
# --- finding R3-2).

- id: OPS-028
  layer: convention
  level: must
  when: >-
    The engine dispatches a setup hook or a retire hook, under TPL-017 or TPL-018.
  then: >-
    It gives the invocation an idempotency key, derived from the instance's ID and from the
    hook's operation, and sends it. The idempotency key is the same in every setup of that
    instance, or in every retirement of it, and is scoped to the instance alone, not to a
    caller, a sending instance or a target: a later dispatch of the hook matches the earlier
    invocation as a repeat does under OPS-009, whoever is the caller of the setup or the
    retirement it belongs to. So a further setup or retirement dispatches the hook again only as
    a new attempt, where OPS-012 or OPS-024 would dispatch one for a repeat, and a hook that
    succeeded is not dispatched again, as OPS-009 dispatches nothing for a repeat. A new attempt
    is made for the caller of the setup or the retirement within which it is dispatched, as
    TPL-017 and TPL-018 state, and from then on that is the caller of the hook's invocation, as
    an invocation counts as dispatched through the Conduit of its latest attempt under OPS-024.
  observable: >-
    The hook's implementation receives the idempotency key in
    `io.github.shrav-k.conduit/idempotencyKey` under IFC-006, whether or not the caller of
    the setup or the retirement supplied one of its own. An implementation therefore recognizes
    the new attempt of a hook that failed, which a further setup or retirement dispatches under
    OPS-021 and OPS-024. Neither hook's contract declares `deduplicates: true`, so a hook whose
    outcome is unknown is not dispatched again until it is reconciled, under OPS-021. The setup
    hook and the retire hook of one instance have different idempotency keys, because their
    operations differ. A further setup that another actor sends finds the hook's earlier
    invocation all the same, and does not run a hook that succeeded a second time. An
    implementation marked `plain` receives no idempotency key, under IFC-007, and is never sent
    a new attempt, under OPS-012. The record of each attempt names its own caller, under
    REC-002, and the records of earlier attempts keep theirs. An onward request that names the
    invocation, made by an earlier attempt still running on a machine that was cut off, is
    decided for the latest caller: a limit of this version.
  vectors: []

# --- Added by the last pass of the second round of the re-audit
# --- (docs/proposals/reaudit/round-2/log-tail.md; decision 4 of "The closing pass, and what it
# --- left" in DECISIONS.md).

- id: OPS-029
  layer: convention
  level: must
  when: >-
    A request is made through an open Conduit that lists its operation, and it names, in an
    input of that operation, an object or an invocation that does not exist: a reference that
    resolves to nothing, or an ID that the engine gave to no invocation.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    This holds for every operation of the core package that names something: `inspect.v1`,
    `set-up.v1`, `retire.v1`, `unregister.v1`, `declare-lost.v1`, `open.v1` and `close.v1` for
    an object; `register-replacement.v1` for the instance that it names in `instance`, which
    holds the nested instantiation; `replace.v1` for the template that its document names; and
    `reconcile.v1` for an invocation. An object that has been unregistered or removed no longer
    exists. Refused means that no open Conduit permits the request. For a thing that exists,
    ACC-033 fixes the target whose Conduit permits it; a thing that does not exist has no owning
    Pool, so only a Conduit to `management` can reach it. So a request for `inspect.v1` that
    names nothing reports invalid when it is made through a Conduit to `management`, and refused
    when it is made through a Conduit to a Pool alone, under OPS-023, so that a caller with only
    a Pool's authority learns nothing of whether a name exists outside that Pool; and one that
    names a Resource through a Conduit to `management` reports refused while the Pool that owns
    the Resource is not retired. A bound
    is judged against what exists, and does not make such a request report refused: a request
    for `open.v1` that names no Conduit reports invalid whatever the bound of the actor's
    Conduit to `access`. A request from an actor with no open Conduit that lists the operation
    reports refused under ACC-001, and says nothing of whether the thing exists, as OPS-023
    states. A request for `set-up.v1` or for `retire.v1` that names a template or a Conduit
    reports invalid too, under LIF-032: the thing exists, and is not one the operation
    addresses. So does a request for `register-replacement.v1` whose `nested` names no nested
    instantiation that the instance holds, under LIF-033. A request that an actor makes on its
    own behalf names an object by a reference, and one that holds the resolved form `{kind, id}`
    in its place reports invalid under LIF-031, whether or not an object has that ID. What the
    result says of the thing that was named, it says in a diagnostic, as IFC-025 states.
  vectors: []

# --- Added by the fix pass of the third round of the re-audit
# --- (docs/proposals/reaudit/round-3/log-fixes.md; finding 3A-14): the rule stood in the
# --- observable of OPS-014.

- id: OPS-030
  layer: convention
  level: must
  when: >-
    An actor asks to reconcile an invocation whose outcome is not unknown: it is in progress, or
    it has ended with the outcome succeeded or failed.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    The invocation's state is as it was, and no record of a reconciliation is added. A second
    reconciliation of one invocation reports conflict in this way, whichever way the first
    recorded the effect, unless a new attempt dispatched since, under OPS-024, has ended
    unknown: a reconciliation settles the outcome of the invocation's latest attempt, and a
    later attempt whose outcome is unknown is reconciled in its turn, under OPS-014. One that
    names an ID which the engine gave to no invocation reports invalid, under OPS-029. Where the
    actor is not permitted under OPS-014, OPS-023 gives refused first.
  vectors: []

- id: OPS-031
  layer: convention
  level: must
  when: >-
    An actor asks to reconcile an invocation, and the request states `revision` where it does
    not belong: where the invocation is not of a control, where the instance of the control is
    retired or no longer exists, or where the request records the control as not having taken
    effect.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    The invocation's outcome is still unknown, and nothing is stored. `revision` belongs to the
    reconciliation that records a control as having taken effect on an instance that exists and
    is not retired, and so stores the values the control was sent, under REV-010: stated for a
    setup, a retirement, a hook or any other invocation that is not of a control, it makes the
    request invalid. A reconciliation that stores nothing states no revision: one that records
    that the effect did not occur, one of a control whose instance is retired, which records the
    outcome alone under REV-010, and one of an invocation whose instance no longer exists, which
    records the outcome alone under ACC-033. What a reconciliation that records a control
    as having taken effect reports where it names no revision is REV-011, where the revision it
    names is not current REV-002, and where the values the control was sent would make the
    configuration fail the type's schema REV-013. Where the actor is not permitted, OPS-023
    gives refused first.
  vectors: []

# --- Added by ruling 41 (docs/proposals/ruling-41/README.md; decision 6b of the principles
# --- review and choice P8 of docs/proposals/ruling-41/PLAN.md).

- id: OPS-032
  layer: convention
  level: must
  when: >-
    A request arrives that matches, as OPS-009 describes a match, the request of an invocation
    that has not ended.
  then: >-
    It is a repeat. Nothing is dispatched, and it reports conflict. Its result's `_meta` holds
    the engine's ID for that invocation.
  observable: >-
    The implementation receives no further call for the invocation, and the invocation's state
    is unchanged. The result carries the reason conflict and no outcome, holds
    `io.github.shrav-k.conduit/invocation` and no outputs, and its `isError` is true, under
    IFC-025. The error diagnostic that IFC-025 requires has the `ruleId` OPS-032, so the caller
    knows that a later repeat is answered once the invocation has ended. The ID is the one by
    which `reconcile.v1` names the invocation, under OPS-014, so a caller that lost the result
    of its request learns the ID by repeating it. Once the invocation has ended, a later repeat
    is answered under OPS-009, OPS-012 or OPS-024, or reports conflict under OPS-034 where it
    succeeded and neither OPS-009 nor OPS-024 answers it. A repeat is decided like any other
    request, under ACC-036: one sent through a Conduit that has been closed reports refused
    under ACC-011, which OPS-023 puts first.
  vectors: []

# --- Added by the coverage check of ruling 41 (docs/proposals/ruling-41/log-integration.md,
# --- "Coverage check"), for decision 24a of the principles review: the promise that decides
# --- the commonest request that reports invalid.

- id: OPS-033
  layer: convention
  level: must
  when: >-
    An operation is requested, and its arguments, once the defaults are filled in under
    OPS-026, do not satisfy the `inputSchema` of the operation's contract as the target holds
    it. For a control, an input other than `revision` that is not supplied does not count
    against it, under REV-006.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    No implementation receives a call, and the result carries an error diagnostic that names
    this promise, under IFC-025. Which version of the contract governs is NAM-023. A literal at
    a place that `secret-reference.v1` governs is one such case, under SEC-001, and the result
    holds no part of it, under SEC-003. A value given to a control is checked against the
    type's schema too, under REV-015. Where the actor is not permitted, OPS-023 gives refused
    first.
  vectors: []

# --- Added by ruling 42 (docs/proposals/ruling-42/README.md; row 31 of
# --- docs/proposals/ruling-41/open-decisions.md, on R22): split from OPS-032, which keeps
# --- a repeat of an invocation that has not ended.

- id: OPS-034
  layer: convention
  level: must
  when: >-
    A request arrives that matches, as OPS-009 describes a match, the request of an invocation
    that succeeded, of an operation that declares outputs, where no filter applies to the
    request and the engine does not keep those outputs, or where a filter applies to it and the
    operation is not one that OPS-024 dispatches again: its contract states an `effect`, it is a
    control, or its contract is marked `startsModelWork: true`.
  then: >-
    It is a repeat. Nothing is dispatched, and it reports conflict. Its result's `_meta` holds
    the engine's ID for that invocation.
  observable: >-
    The implementation receives no further call for the invocation, and the invocation's state
    is unchanged. The result carries the reason conflict and no outcome, holds
    `io.github.shrav-k.conduit/invocation` and no outputs, and its `isError` is true, under
    IFC-025. The error diagnostic that IFC-025 requires has the `ruleId` OPS-034, which tells
    this case from OPS-032: the effect has occurred, and the outcome succeeded is in the records
    of the invocation, under REC-002. How long the engine keeps the outputs is DL10 of the
    implementation-defined list, and it keeps none of an invocation whose outcome a
    reconciliation set, under OPS-014, since `reconcile.v1` takes none; once they are not kept,
    every later repeat reports conflict too, unless OPS-024 dispatches it. Where a filter
    applies to the repeat, the outputs are not given, even where the engine keeps them and the
    earlier attempt was sent the same filter with the same arguments: only an implementation
    applies a filter, under IFC-019, and a filter may forbid now what it permitted when the
    outputs were made, as one that permits a read only before a time that has since passed does,
    so the engine cannot tell that it permits them now. Nor is the operation dispatched again
    for the filter to decide, since a new attempt could apply its effect a second time, under
    OPS-018. Only an operation that declares outputs reaches this promise: a repeat of an
    invocation of one that declares none, and that succeeded, is answered from its outcome under
    OPS-009, or dispatched as a new attempt under OPS-024. A repeat is decided like any other
    request, under ACC-036: one sent through a Conduit that has been closed reports refused
    under ACC-011, which OPS-023 puts first.
  vectors: []
