# Records: what is always recorded, what a record holds and how long it is kept.
# The list of events and the fields follow Kubernetes audit events and AWS CloudTrail, which
# record who, what, when and how it ended, and cannot be deleted through the interface they record.
# A record is added and never altered.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# Removed: ACC-020 → REC-001 and OPS-005 (ruling 32).
# Removed: ACC-021 → REC-001 and OPS-005 (ruling 32).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: REC-001
  layer: convention
  level: must
  when: >-
    Any of these happens: an access decision; a request ends without being dispatched; an
    invocation is dispatched; an invocation ends; a provider call is made, or ends; an
    instance's lifecycle state changes; an object is registered, unregistered or removed; an
    object's revision changes.
  then: >-
    A record of it is kept.
  observable: >-
    Each such occurrence can be found by inspecting the objects it names. Every request can be
    found with how it ended: its outcome, or its reason where it has no outcome under OPS-005.
    The record of an access decision states that the request was permitted, or that it was not
    dispatched and the reason. A provider call is not a request, under PRV-005, and is recorded
    all the same, with how it ended. A read of a secret is a request, under SEC-010, and is
    recorded as one, without its value, under SEC-015. One request is not recorded: one that
    cannot be read and from which no instance can be established, under IFC-036. Nothing else is
    required to be recorded.
  vectors: []

- id: REC-002
  layer: convention
  level: must
  when: >-
    A record is kept.
  then: >-
    It holds the caller, the Conduit used and its consumer if a Conduit was used, the target,
    the operation, the engine's ID for the invocation, the engine's ID for the
    invocation that it serves where it serves one, the idempotency key if the caller supplied
    one or the engine gave one under OPS-028, the time, and how it ended.
  observable: >-
    Each of those is present in every record to which it applies. The inputs and outputs of the
    operation need not be; what content is kept is stated by each type's contract, under
    `records` as CTR-004 gives it: the inputs where `inputs` is true, and the outputs where
    `outputs` is true. A record has the form of the core schema `record.v1`: a CloudEvent whose
    `data` holds these fields, the consumer of the Conduit used in `consumer` and the invocation
    served in `serving`. `inspect.v1` returns records in that form, under LIF-013, and an engine
    may also export them in it, as DL8 of the implementation-defined list says. The invocation
    is the one whose ID the recorded call carried in `io.github.shrav-k.conduit/invocation`: the
    request's, the hook's or the read's own, and for a provider call the invocation it was made
    within, under PRV-005. The invocation served is the one that an onward request names in
    `io.github.shrav-k.conduit/serving`, under IFC-020; for a hook, a read of a secret or a part
    that is an invocation of its own, such as an `open.v1` under CON-004, an entry's setup under
    POOL-013 or a Resource's retirement under LIF-021, it is the setup or the retirement that it
    belongs to; for a read made again under SEC-023 it is the setup that made the connection;
    and for a read for a provider's run that PRV-026 asks for again, it is the setup that last
    asked for that run. A provider call's record names none. The records of an invocation's
    parts are those whose invocation or invocation served is that invocation, whatever their
    source, under REC-005. A record of `run.v1`, `stop.v1` or `inspect-run.v1` names in the
    CloudEvent's `subject` the instance whose run it is, so inspecting that instance finds it,
    under LIF-013. The record of a change that no request asked for itself, such as a Conduit
    closed under CON-008 or an instance removed under LIF-035, holds as its invocation the
    invocation within which the change happened, and that invocation's caller; where it happened
    within none, as under PLC-024, it states the cause, as PLC-024 has it. The record of a
    request from which the engine could establish no instance, under IFC-032, holds no caller,
    and says that none could be established. The record of a request that ACC-037 decides
    because whether the instance that its credential names still exists cannot be read, under
    IFC-022 and IFC-032, holds no caller either, and says that this could not be read. Every
    other request has a caller: a read of a
    secret has the caller of the setup or the retirement it belongs to, under SEC-011, a read
    made again under SEC-023 that of the setup that made the connection, and a read for a run
    under PRV-026 that of the setup that last asked for the run. A provider call is not a
    request, and its record holds a caller only where the call is made for a request, the caller
    of that request, under PRV-005. The record of a read holds no part of the value it read,
    under SEC-015; the record of a call of `run.v1` holds no value of its `secrets`, as `run.v1`
    states, and no part of its `identity`, under PRV-024; and a record holds a value at a place
    that `secret-reference.v1` governs only in the resolved form, under SEC-004.
  vectors: []

- id: REC-003
  layer: convention
  level: must not
  when: >-
    A record exists.
  then: >-
    It is removed or altered by anything other than a purge.
  observable: >-
    The record can still be read after the engine has restarted and after the objects it names
    are unregistered or removed. A reconciliation adds a record and alters none. Inspecting an
    object lists the records that name it, under LIF-013, and an object that has been
    unregistered or removed is no longer inspected. How the records that name no object that
    still exists are read is DL8 of the implementation-defined list.
  vectors: []

- id: REC-004
  layer: convention
  level: must
  when: >-
    An actor asks to purge records.
  then: >-
    The request is dispatched only if the actor is the root Interface. A purge removes the
    records made before a time that the request names, and a record is kept stating which
    records were purged and when.
  observable: >-
    A request from any other actor is not dispatched and reports refused. Records made at or
    after the time the request names are not removed. The record of the purge can be read, and
    no later purge removes it. The operation is `purge.v1`, and the time is its input `before`.
    A purge removes records and nothing else. What repeats and reconciliations need is the
    engine's own state under OPS-008, which no purge touches: after a purge, a request that
    repeats the idempotency key of an invocation whose records were purged is still answered
    under OPS-009 to OPS-012, OPS-024, OPS-032 and OPS-034, no effect is applied a second time,
    and an invocation whose outcome is unknown can still be found in the status of the instance
    that it was dispatched to or names, under LIF-013, while that instance exists, and
    reconciled under OPS-014. Two requests with the same contents, as OPS-009 defines them, give
    the same digest, so a request with that idempotency key and different contents still reports
    conflict under OPS-010. How the digest is computed is DL2 of the implementation-defined
    list. The outputs that the engine keeps for repeats under OPS-009 are not records either,
    and a purge does not touch them.
  vectors: []

- id: REC-005
  layer: convention
  level: must
  when: >-
    Records made at one source are read.
  then: >-
    They are in the order in which they were made at that source. No order is promised between
    records from different sources.
  observable: >-
    Reading one source's records twice gives the same order. An actor that reads records from
    several sources is not told which of two records from different sources came first, unless
    one names the other. A record's source is its CloudEvent's `source`, a URI-reference that
    the engine names for the context in which the record was made, such as one node; the
    sequence extension of CloudEvents orders events within one `source` in the same way. An
    engine that names one `source` for every record keeps all its records in one order.
  vectors: []

- id: REC-006
  layer: convention
  level: must
  when: >-
    Records that should exist cannot be read, or were lost.
  then: >-
    The result of reading them says that there is a gap, and where.
  observable: >-
    A result that omits records says so. It is never presented as complete.
  vectors: []
