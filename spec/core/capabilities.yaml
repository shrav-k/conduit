# Part of the core package. Accepted by the owner on 2026-11-05 (plan-audit ruling 37); the
# record is docs/proposals/core-and-schemas/README.md. See README.md in this directory.
#
# The Capability contracts of the core package: what `management`, `access`, a Pool, the
# `system` Pool and a location offer through a Conduit (OPS-019, CTR-003). The operations
# are in operations.yaml.
#
# Promises encoded:
#   object-management.v1  ACC-033 (what is authorized against `management`), OPS-019,
#                         ACC-032 and CTR-003 (it lists the two operations reserved to the
#                         root Interface, which only a capability of the core package may)
#   access-control.v1     ACC-006, ACC-012, ACC-031 (the operations of `access`), ACC-033 and
#                         OPS-014 (reconciling an open or a close is authorized against
#                         `access`, the target that authorized it, so the capability includes
#                         `reconcile.v1`)
#   pool-management.v1    ACC-033 (what is authorized against a Pool), ACC-028 (a Pool's own
#                         operations), LIF-021, LIF-009, CTR-004 (a Type of the family Pool
#                         that does not offer it is rejected, so every Pool offers it)
#   system-settings.v1    PLC-016, OPS-020 and CON-017 (a Conduit lists a control like any
#                         operation, so a capability includes it)
#   location-settings.v1  PLC-021 (a location's facts are changed only by a control), OPS-020
#                         and CON-017; ACC-033 (a control is reconciled through a Conduit to
#                         the instance itself, so the capability includes `reconcile.v1`)
#
# Reconciling is authorized against the target that authorized the request being reconciled,
# by an open Conduit to that target that lists `reconcile.v1` (ACC-033, OPS-014). Every
# target of a core operation therefore offers a capability that includes it: `management`,
# `access`, every Pool, the `system` Pool among them, and a location. A control of the
# `system` Pool is reconciled through a Conduit to `system` that carries
# `pool-management.v1`.
#
# `retrieve-result.v1` is in no capability: IFC-024 presents it to every consumer, and a call
# to it needs no Conduit.

apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: object-management.v1
  description: >-
    What the `management` Resource offers: registering, replacing, renaming and unregistering
    objects; inspecting, setting up and retiring what is not a Resource; installing packages;
    and the operations reserved to the root Interface.
spec:
  operations:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#replace.v1
    - github.com/shrav-k/conduit/core#rename.v1
    - github.com/shrav-k/conduit/core#unregister.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#install.v1
    - github.com/shrav-k/conduit/core#declare-lost.v1
    - github.com/shrav-k/conduit/core#purge.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: access-control.v1
  description: >-
    What the `access` Resource offers: opening and closing Conduits, applying and removing
    policies, and reconciling an invocation of one of those operations whose outcome is
    unknown. An open Conduit to `access` that lists `open.v1` is a right to open.
spec:
  operations:
    - github.com/shrav-k/conduit/core#open.v1
    - github.com/shrav-k/conduit/core#close.v1
    - github.com/shrav-k/conduit/core#apply-policy.v1
    - github.com/shrav-k/conduit/core#remove-policy.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: pool-management.v1
  description: >-
    What every Pool offers: registering a Resource into it; inspecting, setting up and
    retiring the Resources it owns; reconciling an invocation that it authorized; and
    retiring it together with those Resources. A Type of the family Pool that does not list
    this capability under `offers` is rejected when its package is installed or its project
    is submitted.
spec:
  operations:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#retire-with-resources.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: system-settings.v1
  description: >-
    What the `system` Pool offers beyond what every Pool offers: the control that designates
    the default location.
spec:
  operations:
    - github.com/shrav-k/conduit/core#set-default-location.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: location-settings.v1
  description: >-
    What a location offers: the control that changes its stored facts, and reconciling an
    invocation of that control whose outcome is unknown.
spec:
  operations:
    - github.com/shrav-k/conduit/core#set-facts.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
