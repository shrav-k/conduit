# Part of the core package, first accepted by plan-audit ruling 37 (2026-11-05); the record is
# docs/proposals/core-and-schemas/README.md. What the docs audit and rounds 2 to 4 of the
# re-audit changed since is logged in the records that README.md in this directory names.
# Ruling 38 (2026-11-06) changed no contract of this file; the tool `start-later-work.v1`,
# which was in no capability, is gone from the package.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, removed `system-settings.v1` and `location-settings.v1` (decision 8),
# took `rename.v1` out of `object-management.v1` (decision 10) and the policy operations out
# of `access-control.v1` (decision 3a), and added the four provider capabilities,
# `runtime-provider.v1`, `machine-provider.v1` and `package-source.v1` (decisions 2, 8, 21 and
# 31a) and `secret-reveal.v1` (decision 19). The log is docs/proposals/ruling-41/log-core.md.
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06), on the owner's answer D10,
# changed the description of `secret-reveal.v1`: a Type that offers it offers no other
# capability, and is rejected when its package is installed, or its project submitted, if it
# does (SEC-022). The log is docs/proposals/ruling-42/log-core.md.
# The names of ruling 42 (the vocabulary audit's N2; log
# docs/proposals/ruling-42/log-rename-a.md) renamed the machines provider to the machine
# provider, and the engine's own machine to the engine's own machine provider, in the
# description of `machine-provider.v1`.
# The names of ruling 42 (the vocabulary audit's N1 and N12; log
# docs/proposals/ruling-42/log-rename-b.md) renamed `secret-reveal.v1` to `secret-provider.v1`
# and its operation `reveal-secret.v1` to `get-secret.v1`, and the description says that the
# engine reads a secret for an instance through that instance's own Conduit, where it named the
# reading instance.
# The editorial fixes of ruling 42 (the vocabulary audit's E17; log
# docs/proposals/ruling-42/log-editorial.md) say secret Resource, or the type of a secret
# Resource, in the description of `secret-provider.v1` and below, where it said secret store.
# The verification of ruling 42 (docs/proposals/ruling-42/log-integration.md, "Verification")
# says in that description that each kind of store is its own Type, as SEC-005 does, where it
# said each store, which a store, the system outside the engine, is not.
#
# The Capability contracts of the core package: what `management`, `access` and a Pool offer
# through a Conduit (OPS-019, CTR-003), and the provider capabilities (PRV-001). The
# operations are in operations.yaml.
#
# Promises encoded:
#   object-management.v1  ACC-033 (what is authorized against `management`, reconciling an
#                         invocation of an operation of an Agent, an Interface or a Pool
#                         among it), OPS-019, ACC-032 and CTR-003 (it lists the two
#                         operations reserved to the root Interface, which only a capability
#                         of the core package may)
#   access-control.v1     ACC-006, ACC-012 (the operations of `access`), ACC-033 and OPS-014
#                         (reconciling an open or a close is authorized against `access`, the
#                         target that authorized it, so the capability includes
#                         `reconcile.v1`)
#   pool-management.v1    ACC-033 (what is authorized against a Pool, reconciling an
#                         invocation of an operation of a Resource it owns among it),
#                         ACC-028 (a Pool's own operations), LIF-021, LIF-009, CTR-004 (a
#                         Type of the family Pool that does not offer it is rejected, so
#                         every Pool offers it)
#   runtime-provider.v1   PRV-001, PRV-006 to PRV-012 (run, stop and the state of a run)
#   machine-provider.v1   PRV-001, PRV-013 to PRV-015 (the machines, their labels and their
#                         states, and placing an instance)
#   package-source.v1     PRV-001, PRV-013, PRV-016, PRV-017 (fetching an archive for the
#                         schemes the provider claims)
#   secret-provider.v1    SEC-002, SEC-005 (the shared contract of every secret Resource; a
#                         Resource whose type offers it is a secret Resource), SEC-022 (a
#                         Type that offers it offers no other capability), PRV-001
#
# Reconciling an invocation of a management verb is authorized against the target that
# authorized the request being reconciled, so the three capabilities that hold management
# verbs include `reconcile.v1`. Any other invocation, of a control, of a hook or of any other
# operation, is reconciled through the target that manages the instance it was dispatched to:
# the Pool that owns a Resource, and `management` for an Agent, an Interface or a Pool
# (ACC-033, OPS-014). No other capability has to include `reconcile.v1`.
#
# A provider is a Resource whose type offers one of the four provider capabilities, and no
# other of them (PRV-001); the type of a secret Resource offers no other capability at all
# (SEC-022). No Conduit lists an operation of `runtime-provider.v1`,
# `machine-provider.v1` or `package-source.v1`: the engine alone invokes them, by provider
# calls (PRV-004, PRV-005). A Conduit may list `get-secret.v1`, and only the root
# Interface opens one, for a Resource or an Agent (SEC-008, SEC-009); no actor's request
# through it is dispatched, and the engine's reads go through it (SEC-007, SEC-010).
# `setup-hook.v1` and `retire-hook.v1` are in no capability: a template selects them, and the
# engine dispatches them (TPL-017, TPL-018).
#
# Where a Pool is retired, two of the requests that ACC-033 authorizes against that Pool are
# authorized against `management` in its place: inspecting a Resource the Pool owns, and
# reconciling an invocation. `inspect.v1` or `reconcile.v1` is then requested through a
# Conduit to `management` that lists it. No other request is authorized against a retired
# Pool: `retire-with-resources.v1`, which is in `pool-management.v1` alone and has no input,
# is not asked of one, and a retired Pool whose shutdown is not confirmed is retired again
# with `retire.v1` through `management` (LIF-026). No Resource is registered into a retired
# Pool, and none for one of its entries: the document is rejected (POOL-004), and either
# request reports invalid (OBJ-023, POOL-017).

apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: object-management.v1
  description: >-
    What the `management` Resource offers: registering, replacing and unregistering objects;
    asking for a new instance for a nested instantiation whose instance is retired or has
    been removed; inspecting what is not a Resource, or is a Resource whose Pool is retired;
    setting up and retiring what is not a Resource; reconciling an invocation that it
    authorized, an invocation of an operation of an Agent, an Interface or a Pool, an
    invocation of a Resource whose Pool is retired, or an invocation whose instance no longer
    exists; installing packages; and the operations reserved to the root Interface.
spec:
  operations:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#replace.v1
    - github.com/shrav-k/conduit/core#unregister.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#install.v1
    - github.com/shrav-k/conduit/core#declare-lost.v1
    - github.com/shrav-k/conduit/core#purge.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: access-control.v1
  description: >-
    What the `access` Resource offers: opening and closing Conduits, and reconciling an
    invocation of one of those operations whose outcome is unknown. An open Conduit to
    `access` that lists `open.v1` is a right to open.
spec:
  operations:
    - github.com/shrav-k/conduit/core#open.v1
    - github.com/shrav-k/conduit/core#close.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: pool-management.v1
  description: >-
    What every Pool offers: registering a Resource into it, and asking for a new Resource for
    one of its entries; inspecting, setting up and
    retiring the Resources it owns; reconciling an invocation that it authorized, or an
    invocation of an operation of a Resource it owns, a control among them; and retiring it
    together with those Resources. A Type of the family Pool that does not list
    this capability under `offers` is rejected when its package is installed or its project
    is submitted.
spec:
  operations:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#retire-with-resources.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: runtime-provider.v1
  description: >-
    What a runtime provider offers: running an instance's implementation item, as a run named
    by the instance's ID, stopping that run and reporting its state. An Agent or a Resource
    names the runtime provider that runs it by its standard argument `runtime`; with none, the
    engine's own runner runs it. No Conduit lists these operations: the engine alone invokes
    them.
spec:
  operations:
    - github.com/shrav-k/conduit/core#run.v1
    - github.com/shrav-k/conduit/core#stop.v1
    - github.com/shrav-k/conduit/core#inspect-run.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: machine-provider.v1
  description: >-
    What the machine provider offers: reporting the machines, their labels and whether each
    is reachable, unreachable or gone, and placing an instance on one of them. At most one
    machine provider, owned by `system`, is not retired; with none, the engine's own machine
    provider reports one machine, the one the engine runs on. No Conduit lists these
    operations: the engine alone invokes them.
spec:
  operations:
    - github.com/shrav-k/conduit/core#list-machines.v1
    - github.com/shrav-k/conduit/core#place.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: package-source.v1
  description: >-
    What a package-source provider offers: fetching the archive of a package from a URL whose
    scheme it claims, as its configuration lists under `schemes`. Each provider is owned by
    `system`, and at most one that is not retired claims a scheme; the engine itself fetches
    `https` and `file` URLs that no provider claims. No Conduit lists this operation: the
    engine alone invokes it.
spec:
  operations:
    - github.com/shrav-k/conduit/core#fetch-package.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: secret-provider.v1
  description: >-
    The shared contract of every secret Resource: giving the value of the secret that the
    locator in the secret Resource's configuration names. A Resource whose type offers it is a
    secret Resource, and each kind of store is its own Type, whose schema states the form of
    its locator, which lists no control and which offers no other capability: one that offers
    another is rejected when its package is installed or its project is submitted. A store
    package that lists or writes secrets does so through another Type, whose Resources are not
    secret Resources. The engine reads a secret for an instance through that instance's own
    open Conduit that lists `get-secret.v1`, and no actor's request for it is dispatched.
spec:
  operations:
    - github.com/shrav-k/conduit/core#get-secret.v1
