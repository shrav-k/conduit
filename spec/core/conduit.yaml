# The manifest of the core package. Accepted by the owner on 2026-11-05 (plan-audit ruling
# 37); the record is docs/proposals/core-and-schemas/README.md. See README.md in this
# directory.
#
# The core package is built into every engine (NAM-020) and is never installed, listed or
# fetched (NAM-021), so it has no archive and no digest. Its documents are the files of this
# directory and the Schema contracts under spec/schemas/. Its one implementation, `engine`,
# is the engine itself: it states none of `command`, `url` and `graph` (MAN-012).
# `supports` lists `bound.v1`, because a bound is a filter on a Conduit to `access` and
# CON-022 asks the implementation behind `access` to state the filters it can apply:
# `bound.v1` states no `obliges`, so it is the target's implementation that must.
#
# The version is the version of the package, not of any contract: each contract carries its
# own compatibility version in its name (NAM-015). A template or an instance that uses the
# core package holds this address and this version, and no digest.

apiVersion: github.com/shrav-k/conduit/v0
address: github.com/shrav-k/conduit/core
version: 0.1.0

