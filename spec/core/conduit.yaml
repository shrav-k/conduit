# The core package is built into every engine (NAM-020) and is never installed, listed or
# fetched (NAM-021), so it has no archive and no digest. Its documents are the files of this
# directory and the Schema contracts under spec/schemas/. Its one implementation, `engine`,
# is the engine itself: it states none of `command`, `package` and `remote` and no `supports`
# (MAN-012). It implements the management verbs (OPS-019, CON-024), each with no selection in
# any template or type and no default in its contract (TPL-004, CTR-002), and neither the
# hooks, nor an operation of a provider capability, nor `get-secret.v1` (MAN-012, SEC-020): the
# engine's own runner, machine provider and fetching serve where no provider does, without being
# selected as an implementation (PRV-003).
#
# The version is the version of the package, not of any contract: each contract carries its
# own compatibility version in its name (NAM-015). A template or an instance that uses the
# core package holds this address and this version, and no digest.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

