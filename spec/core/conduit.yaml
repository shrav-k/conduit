# The manifest of the core package, first accepted by plan-audit ruling 37 (2026-11-05); the
# record is docs/proposals/core-and-schemas/README.md. What the docs audit and rounds 2 to 4
# of the re-audit changed since is logged in the records that README.md in this directory
# names. Ruling 38 (2026-11-06) took the export `start-later-work.v1` out, here and from what
# `engine` implements: later work is not part of this version.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, removed 16 exports and added 20, as the log lists; made `engine`
# implement every operation of `object-management.v1`, `access-control.v1` and
# `pool-management.v1` and no other; and took away its `supports` and its `placement`, since
# the engine applies the core package's requirements itself (alignment C20, MAN-012). The log
# is docs/proposals/ruling-41/log-core.md.
# The names of ruling 42 (the vocabulary audit's N8 and N10; log
# docs/proposals/ruling-42/log-rename-a.md) renamed the exports `location`, `location.v1` and
# `label-selector.v1` to `node`, `node.v1` and `labels.v1`.
# The names of ruling 42 (the vocabulary audit's N1; log
# docs/proposals/ruling-42/log-rename-b.md) renamed the exports `secret-reveal.v1` and
# `reveal-secret.v1` to `secret-provider.v1` and `get-secret.v1`.
#
# The core package is built into every engine (NAM-020) and is never installed, listed or
# fetched (NAM-021), so it has no archive and no digest. Its documents are the files of this
# directory and the Schema contracts under spec/schemas/. Its one implementation, `engine`,
# is the engine itself: it states none of `command`, `package` and `remote` and no `supports`
# (MAN-012). It implements the management verbs (OPS-019, CON-024), and neither the hooks, nor
# an operation of a provider capability, nor `get-secret.v1` (MAN-012, SEC-020): the
# engine's own runner, machine provider and fetching serve where no provider does, without being
# selected as an implementation (PRV-003).
#
# The version is the version of the package, not of any contract: each contract carries its
# own compatibility version in its name (NAM-015). A template or an instance that uses the
# core package holds this address and this version, and no digest.

