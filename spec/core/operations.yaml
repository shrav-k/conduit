# The Operation contracts of the core package: every management verb (OPS-019, CON-024); the
# two hooks that a template may select (TPL-017, TPL-018); the operations of the provider
# capabilities (PRV-001), which the engine invokes by provider calls (PRV-005); and the one
# operation of a secret Resource (SEC-005). Which capability includes each is in
# capabilities.yaml, and which open Conduit authorizes each management verb is ACC-033.
#
# Read with these rules:
#   - Each contract is written as the Model Context Protocol writes a tool (CTR-002): the
#     properties of `inputSchema` are its inputs and those of `outputSchema` its outputs, and
#     one that `required` does not list is optional (OBJ-015). The root of each holds
#     `type: object`, `properties` and, where something is required, `required`, and no other
#     keyword. CTR-012 lets the root of an operation that is not a control hold any keyword of
#     the profile beside `type: object`, and that of a control `properties`, `required` and
#     `additionalProperties` alone. An operation with no inputs or no outputs states no
#     `inputSchema` or no `outputSchema`.
#   - One contract for one verb. `register.v1`, `register-replacement.v1`, `inspect.v1`,
#     `set-up.v1`, `retire.v1` and `reconcile.v1` are included both in the capability of
#     `management` and in the capability of a Pool; ACC-033 says which of the two targets
#     authorizes a request, from the object the request names. `reconcile.v1` is also
#     included in the capability of `access`, because reconciling an invocation of a
#     management verb is authorized against the target that authorized the request being
#     reconciled (ACC-033).
#   - An instance is set up by one invocation of `set-up.v1` and retired by one of
#     `retire.v1`, requested of the target ACC-033 names, with the instance as an input. The
#     engine implements both (TPL-008). What a setup does is TPL-012, and what a retirement
#     does is TPL-009: neither is selected in an `implementation` map. A setup hook and a
#     retire hook are selected there like any operation, and the engine dispatches them
#     within those invocations (TPL-017, TPL-018).
#   - An operation that changes a stored object takes the object's current `revision` as an
#     input (REV-002, REV-011), because a request's `arguments` are exactly the operation's
#     inputs (IFC-001). `replace.v1` returns the revision after the request in the output
#     `revision` (SUB-009). Setting up, retiring, retiring a Pool with its Resources, opening
#     and closing name no revision and advance none (REV-012). The core package has no
#     control: a control's `changes` and its `revision` are CTR-006.
#   - No input of a core operation states a `default` (CTR-002, OPS-026): each is supplied or
#     is optional.
#   - `reservedToRoot: true` marks an operation reserved to the root Interface (ACC-032).
#     Only an Operation contract of the core package carries the mark (CTR-009).
#   - `deduplicates: true` is declared where the whole effect is a change to what the engine
#     itself stores, which the engine can recognize by the idempotency key. It is not
#     declared where the engine dispatches other work, as it does for `set-up.v1`, `retire.v1`
#     and `retire-with-resources.v1`, nor for an operation that the engine does not implement.
#     `unregister.v1` declares it although it asks once more for the stop of a run (LIF-036):
#     the instance is removed whatever comes of that stop, which is not part of the effect, and
#     a new attempt only asks for it again, which succeeds where nothing runs (PRV-008).
#   - No core operation starts model work (IMP-002), so none carries `startsModelWork`. No
#     operation, of this package or of any other, arranges through the engine work that
#     outlasts its invocation, and no contract carries a mark for it (ACC-019, CTR-002).
#   - Every management verb is implemented by the engine itself: the core package's
#     implementation `engine` lists it under `implements` in conduit.yaml, and no template or
#     type selects it (TPL-003, TPL-004). No Operation contract states a default implementation
#     (CTR-002). A template selects each of the two hooks, the operations of the provider
#     capabilities and `get-secret.v1`, or its type's default does (TPL-004), and the engine
#     implements none of them (MAN-012, SEC-020). No plain implementation implements an
#     operation of `runtime-provider.v1`, `machine-provider.v1` or `package-source.v1`, because
#     a provider call carries Conduit's keys and declares its extension (PKG-020, PRV-005,
#     IFC-037).
#   - A request that an actor makes on its own behalf names an object by a reference and
#     never by an ID: one that holds the resolved form `{kind, id}` in its place reports
#     invalid (LIF-031). An onward request may hold that form, because the engine handed it
#     to the instance that sends it. An invocation is not an object, and is named by the ID
#     the engine gave it. A request made through a Conduit that lists the operation, and that
#     names an object or an invocation that does not exist, reports invalid (OPS-029): an
#     instance that has been unregistered or removed no longer exists (LIF-035).
#   - `set-up.v1`, `retire.v1`, `inspect.v1`, `unregister.v1`, `open.v1` and `close.v1`
#     may carry `expectedId`, the ID
#     that the actor expects the object it names to have, as Kubernetes's `preconditions.uid`
#     is: it names nothing and grants nothing, and where the reference resolves to an object
#     with another ID, as when a name was given to another object after the first was removed,
#     the request reports conflict and changes nothing (LIF-037).
#   - What a request that is not dispatched says beyond its reason, it says in `diagnostics`
#     in its result's `structuredContent`, whether or not the operation declares an output
#     of that name, and one that reports invalid or conflict carries there an error
#     diagnostic that names the promise that decided it (IFC-025). A request that is not
#     permitted reports refused with ACC-056's tiered explanation (OPS-023, IFC-050).
#   - A result has `isError` true where the request ended with a reason or its outcome is
#     failed or unknown, and in no other case; any other result holds the outputs in its
#     `structuredContent` where it declares outputs, and omits that member where it declares
#     none (IFC-025). A repeat
#     of an invocation that has not ended reports conflict with the engine's ID for it
#     (OPS-032). A repeat of one that succeeded is answered from what the engine keeps, and
#     nothing is dispatched (OPS-009), unless the operation declares outputs that the engine
#     no longer keeps, when it reports conflict (OPS-034), or a filter applies to the repeat.
#     Then an operation that states no `effect`, is not a control and starts no model work, as
#     IFC-033 tells them, is dispatched again as a new attempt, so that its filters decide
#     afresh; any other reports conflict in place of giving the outputs kept, where it declares
#     outputs (OPS-034), and is answered from its outcome, where it declares none (OPS-009).
#     A repeat that is not dispatched is judged by no filter, so where one applies the repeat
#     gives only an outcome already recorded. A Conduit applies no filter where the engine
#     implements an operation it lists (CON-022), and a request for an operation of
#     the core package that carries a filter reports unavailable (MAN-012, ACC-015).
#   - The operations of `runtime-provider.v1`, `machine-provider.v1` and `package-source.v1`
#     are invoked by the engine alone, by provider calls, which are not requests (PRV-005):
#     no Conduit lists one (PRV-004). `get-secret.v1` is invoked by the engine's reads,
#     which are requests (SEC-010, SEC-011, SEC-023, PRV-026), and no actor's request for it
#     is dispatched (SEC-007).
#
# --- Operations of `management`, some of them also operations of a Pool.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: register.v1
  description: >-
    Register the documents of one submission. The `documents` and the `manifest` of one request are
    one project: the documents and the one manifest handed over together. Templates and instances
    are added to the objects that exist, registering an instance document instantiates its template,
    and contracts and implementations are made available to the project. No submitted instance is
    set up and no submitted Conduit is opened; the engine opens only the root defaults required by
    FLEET-005. Authorized against `management`; registering a Resource into a Pool that already exists
    also needs an open Conduit to that Pool that lists this operation. `objects` lists every template
    and instance the request added, nested instances among them, and says of each nested instance
    which nested instantiation made it. A registration that is rejected is not dispatched, reports
    invalid, and its result still carries `diagnostics`. A registration fetches and installs no package:
    one whose manifest lists a package that is not installed at the version and digest the manifest
    gives is rejected, and a diagnostic names each such package. A project that holds a contract or
    lists an implementation, and whose manifest states no `address`, is rejected, and so is one whose
    `address` is that of an installed package. The request hands the manifest over as a value, with
    no directory, so an item of `packages` whose `fetch` is a relative reference, and an implementation
    item whose program is a relative path, are rejected. A Resource whose owner is a retired Pool,
    or an Agent whose owner is a retired Fleet, is rejected, and so is an instance document whose
    `runtime` names a retired runtime provider. Where the machine provider is to place an instance
    that the request would make and cannot place it now, as when it is not ready or a node that matches
    represents a machine reported unreachable or omitted, the registration is not dispatched and reports
    unavailable; for want of a machine it is rejected where no node matches, and where the provider
    names none, unless a node other than `local` that is not retired and matches represents a machine
    reported unreachable or omitted. A template is rejected where an item selected for it binds, in
    its `environment`, a variable that `identity` carries in `run.v1`; and where an item reached by
    `remote` that is selected for it carries a secret, in a header or as the value of `get-secret.v1`,
    to an `http` URL whose host is not `localhost`, an IPv4 address in `127.0.0.0/8` or the IPv6 address
    `::1`, or stands at one of those hosts, whatever its scheme and headers, on an engine that, as
    configured, can restart on another machine or run as several parts (SEC-024).

    ACC-033 authorizes registration through management and each live owning Pool or Fleet not registered
    in this submission. An Agent requires its Fleet owner and only root may submit an Agent on its
    own behalf (ACC-057). Only root registers root-consumed Conduits (ACC-054). Registering a Pool
    or Fleet also makes and opens root's default Conduit (FLEET-005), reported among objects. A matching
    tombstone reports conflict after access and invalid checks (LIF-041).
spec:
  inputSchema:
    type: object
    properties:
      documents:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#document.v1
      manifest:
        $ref: github.com/shrav-k/conduit/core#manifest.v1
    required:
    - documents
  outputSchema:
    type: object
    properties:
      objects:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#object.v1
      diagnostics:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#diagnostic.v1
    required:
    - objects
    - diagnostics
  effect: >-
    Adds the templates and instances that the documents make, and the nested instances of those instances,
    to the objects that exist.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: replace.v1
  description: >-
    Replace a template with the document given in `template`, which has the same kind and
    name. Instances made before keep what they resolved. The template, the contract documents
    given in `contracts` and the manifest given in `manifest` are one project, as the documents
    and the manifest of one registration are, and the template is resolved against that project
    as `register.v1` resolves a template: a reference written `#name` in it reaches a contract
    or an implementation of that project, and its references to packages resolve through the
    manifest's `packages`. Nothing of the project that the template held before is reached. The
    request replaces that one template and registers nothing: `contracts` holds contract
    documents alone, which are made available to the template as a submission's are, identified
    by the digest of that submission, which the template as replaced keeps with the address
    that the manifest states. A project that holds a contract or lists an implementation, and
    whose manifest states no `address`, is rejected, and so is one whose `address` is that of
    an installed package, one whose manifest lists a package that is not installed at the
    version and digest it gives, and one whose template refers to a package other than the core
    package where no manifest is handed over. The request hands the manifest over as a value,
    with no directory, so an item of `packages` whose `fetch` is a relative reference, and an
    implementation item whose program is a relative path, are rejected. A request whose
    template, contracts or manifest is rejected, or whose template is of another kind or name,
    reports invalid. A request whose template is equal to the template as stored, and through
    which every package and submitted project that the template refers to has the address, the
    version and the digest that the template keeps, changes nothing and succeeds, and the
    revision does not advance. `revision` among the outputs is the template's revision after
    the request, which is the one it had where nothing changed. Authorized against
    `management`.
spec:
  inputSchema:
    type: object
    properties:
      template: {$ref: github.com/shrav-k/conduit/core#template.v1}
      revision: {$ref: github.com/shrav-k/conduit/core#revision.v1}
      contracts:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#contract.v1}
      manifest: {$ref: github.com/shrav-k/conduit/core#manifest.v1}
    required: [template, revision]
  outputSchema:
    type: object
    properties:
      revision: {$ref: github.com/shrav-k/conduit/core#revision.v1}
      diagnostics:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
    required: [revision, diagnostics]
  effect: >-
    Changes the stored definition of the template and, where it changed, advances its
    revision.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: unregister.v1
  description: >-
    Remove a template, or a retired instance, from the objects that exist. Its name and its ID
    no longer resolve, and its records are kept. Where an item that is run is selected for the
    instance, the engine asks its runtime provider once more to stop the run, and removes the
    instance whatever comes of that stop; a provider that cannot stop it now does with the stop
    what its contract states, such as carry it out once the machine comes back. A request that
    names an instance that is not retired reports conflict. An instance whose shutdown is
    confirmed has been removed already, without a request, so a request that names it, like one
    that names any object that does not exist, reports invalid. Where `expectedId` is given and
    the object named has another ID, as when its name was given to another object after the
    first was removed, the request reports conflict and changes nothing. Authorized against
    `management`.
spec:
  inputSchema:
    type: object
    properties:
      object: {$ref: github.com/shrav-k/conduit/core#reference.v1}
      revision: {$ref: github.com/shrav-k/conduit/core#revision.v1}
      expectedId: {$ref: github.com/shrav-k/conduit/core#id.v1}
    required: [object, revision]
  effect: >-
    Removes the template, or the retired instance, from the objects that exist, and closes the
    Conduits of which that instance is the consumer.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: inspect.v1
  description: >-
    Read a template or an instance: what was declared, its status and the records about it. Inspecting
    a Resource is authorized against the Pool that owns it, or against `management` where that Pool
    is retired; inspecting an Agent uses its owning Fleet, or `management` where that Fleet is retired;
    inspecting anything else uses `management`. A request that names an object that does not exist
    is authorized against `management` alone: it has no owning Pool. With that authority it reports
    invalid; a caller with only a Pool's authority reports refused, before any diagnostic, and learns
    nothing of whether it existed, under OPS-023. `packages` lists the packages the object holds:
    a package's item has `address`, `version` and `digest`; the core package's item has no `digest`;
    and the item of the submitted project whose contracts the object holds has `address`, the digest
    that identifies that submission's contracts, and `version` where its manifest states one. `declared`
    shows each reference in its resolved form, `{kind, id}`. Inspecting an open Conduit shows, under
    each requirement it applies, the implementation that applies it, named by its qualified reference.
    The status holds the lifecycle state, the shutdown of a retired instance and, in `conditions`,
    the further conditions of the instance and what was observed of it, the state of its run among
    them, and, in `unreconciled`, the engine's ID for each invocation whose outcome is unknown and
    that was dispatched to the instance or names it in an input or as its target, which no purge shortens;
    the status of a node also holds the labels last reported for its machine. `records` holds the
    records that name the object, each as a CloudEvent. Where `expectedId` is given and the object
    named has another ID, the request reports conflict.

    An Agent is inspected through its owning Fleet, or management where that Fleet is retired. An
    object that does not exist has no owning Pool or Fleet. Every other object follows ACC-033. inventory
    is present for instances other than Conduits and shows their consumed and targeting Conduits and
    their tombstones in full (LIF-013). provenance is present for a Conduit that was opened (ACC-044).
    inventory.scope is present for Interfaces and Agents: the targets of open Conduits listing inspect.v1
    to Pools and Fleets other than system, with those Conduits; an Agent includes only its own Fleet.
    inventory.administrators is present for a Pool: every consumer of an open Conduit listing an operation
    that administers its Resources, with those Conduits. system status holds trustDomain (FST-007).
    These lists carry no counts of hidden items.
spec:
  inputSchema:
    type: object
    properties:
      object:
        $ref: github.com/shrav-k/conduit/core#reference.v1
      expectedId:
        $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - object
  outputSchema:
    type: object
    properties:
      id:
        $ref: github.com/shrav-k/conduit/core#id.v1
      revision:
        $ref: github.com/shrav-k/conduit/core#revision.v1
      packages:
        type: array
        items:
          anyOf:
          - type: object
            properties:
              address:
                $ref: github.com/shrav-k/conduit/core#address.v1
              version:
                $ref: github.com/shrav-k/conduit/core#version.v1
              digest:
                $ref: github.com/shrav-k/conduit/core#digest.v1
            required:
            - address
            - digest
            additionalProperties: false
          - type: object
            properties:
              address:
                const: github.com/shrav-k/conduit/core
              version:
                $ref: github.com/shrav-k/conduit/core#version.v1
            required:
            - address
            - version
            additionalProperties: false
      declared:
        type: object
      status:
        type: object
        properties:
          state:
            enum:
            - registered
            - ready
            - retired
          shutdown:
            enum:
            - confirmed
            - pending
            - unknown
          conditions:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#condition.v1
          unreconciled:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#id.v1
          pending:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#pending-action.v1
          trustDomain:
            $ref: github.com/shrav-k/conduit/core#trust-domain.v1
        required:
        - state
      records:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#record.v1
      inventory:
        $ref: github.com/shrav-k/conduit/core#inventory.v1
      provenance:
        $ref: github.com/shrav-k/conduit/core#provenance.v1
    required:
    - id
    - revision
    - packages
    - declared
    - records
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: set-up.v1
  description: >-
    Set up an instance. One invocation of this operation is the setup of the instance it names. The
    engine implements it, in parts, each begun only once every part before it that is not marked optional
    has succeeded: it opens the instance's declared Conduits, or for a Pool sets up the Resources
    of its entries; then it asks the instance's runtime provider for its run, where an item that is
    run is selected for it and its runtime provider reports the run `stopped`, reading first each
    secret that the item binds, and connects to each `remote` item; then it dispatches the instance's
    setup hook, where its template selects one. A part that opens a declared Conduit or sets up the
    Resource of an entry is authorized exactly as this request was, by the Conduits of the instance
    that sent it, which for an onward request is the sending instance and not the caller it serves.
    A further setup leaves an open Conduit, a ready Resource and a running run as they are, and dispatches
    the hook again only as its idempotency key allows. No part begins once the instance is retired,
    or once the setup is cancelled, a cancellation that the engine passes on to each part in progress.
    Setting up a Resource is authorized against its owning Pool, an Agent against its owning Fleet,
    and an Interface, Pool or Fleet against `management` (ACC-033). A Conduit is set up with `open.v1`:
    a request that names a Conduit or a template reports invalid, and so does one that names an object
    that does not exist. Where `expectedId` is given and the instance named has another ID, the request
    reports conflict and nothing is set up.

    A Fleet setup has no parts (FLEET-001). A tombstone matching a setup part prevents dispatch of
    that part with conflict (LIF-041).
spec:
  inputSchema:
    type: object
    properties:
      instance:
        $ref: github.com/shrav-k/conduit/core#reference.v1
      expectedId:
        $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - instance
  effect: >-
    Runs the setup of the instance: opens its declared Conduits or sets up its entries' Resources,
    asks for its run or connects to its remote server, and dispatches its setup hook. When it succeeds
    the instance's state is ready.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: retire.v1
  description: >-
    Retire an instance. One invocation of this operation is the retirement of the instance it names.
    The instance's state is retired from the moment the request is dispatched. Where a setup of the
    instance was ever dispatched, the engine dispatches its retire hook, where its template selects
    one, asking first for its run where its runtime provider reports it `stopped`, or connecting first
    to the `remote` item that serves the hook where no connection to it lasts whose values the engine
    holds, and then, whatever came of the hook, asks its runtime provider to stop the run, where an
    item that is run is selected for it; stopping a run that is not running succeeds. A cancelled
    retirement still asks for the stop. An instance for which no setup was ever dispatched gets neither,
    and its shutdown is confirmed at once. Once the shutdown is confirmed the instance is removed,
    without a further request. Retiring a Resource is authorized against the Pool that owns it, and
    retiring an Agent against its owning Fleet, and an Interface, Pool or Fleet against `management`.
    A retired Pool or Fleet whose shutdown is not confirmed is retired again with this operation,
    through `management`. A request to retire an instance whose shutdown is not confirmed is a further
    retirement. A Conduit is retired with `close.v1`: a request that names a Conduit or a template
    reports invalid, and so does one that names an object that does not exist, a removed instance
    among them. A request to retire a Pool that owns a Resource whose shutdown is not confirmed reports
    conflict, and a diagnostic names each Resource in the way. Where `expectedId` is given and the
    instance named has another ID, the request reports conflict and nothing is retired.

    An Agent is retired through its owning Fleet; an Interface, Pool or Fleet through management (ACC-033).
    A Pool or Fleet with members whose shutdown is unconfirmed reports conflict (LIF-020). Retirement
    leaves a tombstone unless the object was engine-made (LIF-040).
spec:
  inputSchema:
    type: object
    properties:
      instance:
        $ref: github.com/shrav-k/conduit/core#reference.v1
      expectedId:
        $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - instance
  effect: >-
    Ends the instance for good: dispatches its retire hook and stops its run. The Conduits of which
    it is the target are closed at once, and those of which it is the consumer once its shutdown is
    confirmed, when the instance is removed.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: reconcile.v1
  description: >-
    Record, with what was checked, whether the effect of an invocation whose outcome is unknown occurred.
    The invocation is named by the ID the engine gave it, which a consumer learns from the result
    of its request, or of a repeat of it. An invocation of a management verb is reconciled through
    the target that authorized the request being reconciled, by an open Conduit to that target that
    lists this operation: `management` or a Pool for a setup or a retirement, and `access` for an
    open or a close. Any other invocation, of a control, of a hook or of any other operation, is reconciled
    through the target that manages the instance it was dispatched to: the Pool that owns a Resource,
    and the owning Fleet for an Agent, and `management` for an Interface, a Pool or a Fleet. Where the Pool that owns a Resource is
    retired, `management` authorizes in its place, and so it does where the instance of the invocation
    no longer exists: the reconciliation then records the outcome and stores nothing, and names no
    `revision`. A request that names an invocation whose outcome is not unknown reports conflict,
    and one whose ID names no invocation reports invalid. Recording that a setup or an open occurred
    gives it the outcome succeeded and makes the instance ready or the Conduit open, unless the instance
    or the Conduit's consumer has been retired. Recording that a retirement or a close occurred confirms
    the shutdown, and the instance is removed. An actor tells whether a run is running from the instance's
    condition `Running`. Recording that the effect did not occur gives the outcome failed and changes
    nothing else. Where a control of an instance that exists and is not retired took effect, `revision`
    is required, and the values that the control was sent are stored at the pointers of its `changes`.
    A reconciliation that stores nothing names no `revision`: one that does reports invalid.

    ACC-033 and OPS-014 determine authority: an Agent uses its owning Fleet, or management where that
    owner is retired or the instance removed. ACC-055 limits bounded access reconciliation by the
    authority the original request required. Through a Pool, a holder other than root may reconcile
    only invocations it sent. Through a Fleet, it may reconcile invocations it sent or that the
    Fleet or an Agent the Fleet owns sent; a Fleet is never a sender in this version (FLEET-004).
    Root is exempt only as the consumer of the authorizing Conduit. A reconciled opening keeps that invocation's
    provenance (ACC-044); confirmed closings and retirements preserve their tombstones (LIF-040).
spec:
  inputSchema:
    type: object
    properties:
      invocation:
        $ref: github.com/shrav-k/conduit/core#id.v1
      occurred:
        type: boolean
      checked:
        type: string
        minLength: 1
      revision:
        $ref: github.com/shrav-k/conduit/core#revision.v1
    required:
    - invocation
    - occurred
    - checked
  effect: >-
    Changes the invocation's outcome from unknown to succeeded or failed. Where a setup or an open
    is recorded as having occurred, sets the state of the instance or the Conduit to ready, unless
    the instance or the Conduit's consumer is retired. Where a retirement or a close is, confirms
    the shutdown, which removes the instance. For a control that took effect on an instance that exists
    and is not retired, stores the values it was sent.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: register-replacement.v1
  description: >-
    Ask for a new instance for a nested instantiation whose instance is retired or has been removed:
    a declared Conduit, or the Resource of a Pool's entry. The request names, in `instance`, the instance
    that holds the nested instantiation, the consumer of the declared Conduit or the Pool, and, in
    `nested`, the name of the declared Conduit or of the entry. The new instance has a new ID, a newly
    generated name and the state registered, and a retired instance keeps its own name until it is
    removed; nothing is set up or opened. It is made from the template that the `from` of the nested
    instantiation names, as that template stands when the request is made: where that template no
    longer exists, the request reports invalid. A request for a nested instantiation whose instance
    is not retired is not dispatched and reports conflict. A request whose `nested` names no nested
    instantiation that the instance holds, or whose `instance` is a first-start object, is not dispatched
    and reports invalid. Authorized as registering the new instance would be, with this operation
    in the place of `register.v1`: against `management`, and for the Resource of a Pool's entry also
    by an open Conduit to that Pool that lists this operation. The request is a registration, so one
    that is rejected still carries `diagnostics`. A request for a new instance that a rule on instantiation
    does not make reports invalid, as the registration of a document that the rule rejects does: one
    for a declared Conduit whose target is retired, for example, for a new Resource whose `runtime`
    names a retired runtime provider, or for one for which no node matches. Where the machine provider
    cannot place the new Resource now, as when it is not ready or a node that matches represents a
    machine reported unreachable or omitted, the request reports unavailable.

    Only root on its own behalf may submit an Agent or register a root-consumed Conduit (ACC-057,
    ACC-054). Replacement lifts no tombstone: a matching tombstone reports conflict under LIF-041.
spec:
  inputSchema:
    type: object
    properties:
      instance:
        $ref: github.com/shrav-k/conduit/core#reference.v1
      nested:
        $ref: github.com/shrav-k/conduit/core#name.v1
    required:
    - instance
    - nested
  outputSchema:
    type: object
    properties:
      object:
        $ref: github.com/shrav-k/conduit/core#object.v1
      diagnostics:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#diagnostic.v1
    required:
    - object
    - diagnostics
  effect: Adds one instance to the objects that exist.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: install.v1
  description: >-
    Make one version of a package available. Nothing is registered. Authorized against
    `management`. An installation that is rejected is not dispatched and reports invalid: an
    archive whose digest is not `digest`, a manifest that states another address or version, and
    a manifest that lists a package that is not installed at the version and digest it gives are
    among the causes. `fetch` is a URI reference with no user information, and a relative one is
    rejected, because a request has no directory to resolve it against. Where a package-source
    provider claims the scheme of `fetch`, the archive is fetched by that provider; otherwise
    the engine fetches `https` and `file` URLs itself, and a scheme that neither accepts reports
    invalid, as does a request that gives no `fetch` for a package that is not installed. The
    request reports unavailable where the archive cannot be fetched now, and conflict where that
    address and version is already installed with another digest, or where the address is the
    one that the manifest of a submitted project states while a template or an instance holds
    that submission. Where it is already installed with the same digest the request is decided
    like any other, changes nothing and succeeds; nothing is fetched for an address and version
    that is already installed. A package is installed only by this operation: registering a
    project installs none of the packages its manifest lists, and `fetch` in an item of
    `packages` is the value an installation of that item gives here.
spec:
  inputSchema:
    type: object
    properties:
      address: {$ref: github.com/shrav-k/conduit/core#address.v1}
      version: {$ref: github.com/shrav-k/conduit/core#version.v1}
      digest: {$ref: github.com/shrav-k/conduit/core#digest.v1}
      fetch: {type: string, format: uri-reference, minLength: 1}
    required: [address, version, digest]
  outputSchema:
    type: object
    properties:
      diagnostics:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
    required: [diagnostics]
  effect: Adds the package, at that version and digest, to the packages that are installed.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: declare-lost.v1
  description: >-
    Retire a node and every instance placed on it, without their shutdown being confirmed. A
    node that a request has already retired is declared lost in the same way, and a request for
    a node that was already declared lost changes nothing and succeeds. The engine declares a
    node lost in the same way, with no request, when the machine provider reports its machine
    gone. Reserved to the root Interface, and authorized against `management`.
spec:
  inputSchema:
    type: object
    properties:
      node: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
    required: [node]
  effect: >-
    Retires the node and every instance placed on it, and closes the Conduits of which any
    of them is an end.
  deduplicates: true
  reservedToRoot: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: purge.v1
  description: >-
    Remove the records made before a given time. Records are removed and nothing else: what repeats
    and reconciliations need is the engine's own state, which no purge touches, so a repeat after
    a purge is answered as before and an invocation of unknown outcome can still be reconciled. A
    record of the purge is kept. Reserved to the root Interface, and authorized against `management`.

    A purge touches no opening provenance or tombstone (ACC-044, LIF-040).
spec:
  inputSchema:
    type: object
    properties:
      before:
        type: string
        format: date-time
    required:
    - before
  effect: Removes records.
  deduplicates: true
  reservedToRoot: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: retire-with-resources.v1
  description: >-
    Retire the Pool that is the target of the request together with the Resources it owns. Each
    Resource whose shutdown is not confirmed is retired, in the reverse of the order of setup: a
    Resource before any Resource that it refers to, names in `runtime`, or to which it is the
    consumer of a Conduit, among those the Pool owns. Among Resources that depend on each other
    in a cycle the order is the engine's. A Resource that is already retired, with its shutdown
    not confirmed, is retired again, by a further retirement; a Resource whose shutdown is
    confirmed has been removed, and none is dispatched for it. A retirement of a Resource whose
    setup, retirement or change is in progress reports conflict in place of being dispatched.
    Where a retirement that this request dispatched has ended without the shutdown of its
    Resource confirmed, or one reported a reason in place of being dispatched, no retirement is
    dispatched for a Resource that the order puts after that Resource, and every other Resource
    is retired. The Pool is retired only if the shutdown of every one of them is confirmed, so a
    request made again finishes what this one could not. A cancelled request dispatches no
    further retirement, and each retirement in progress still asks for its stop. Authorized
    against that Pool, by a Conduit that need list only this operation: the retirements of the
    Resources are part of it, so the Conduit need not list `retire.v1`. Each of those
    retirements is an invocation of `retire.v1` of its own, with its own outcome, and so is the
    Pool's. Where Resources remain whose shutdown is not confirmed, the Pool's retirement is not
    dispatched, the outcome of this request is failed, and the diagnostics of its result name
    each of them, those whose retirement was not dispatched among them: a result whose outcome
    is failed holds no outputs, so the operation declares none.
spec:
  effect: >-
    Retires the Pool, once the shutdown of every Resource it owns is confirmed. The retirement
    of each Resource is an invocation of `retire.v1` of its own, with its own effects.

# --- Operations of `access`.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: open.v1
  description: >-
    Open a Conduit whose state is registered. Dispatched only if the bound of the actor's own Conduit
    to `access` covers the Conduit's target and names every operation it lists. A Conduit to `access`
    that applies no bound is unlimited, and is opened only by an actor whose own Conduit to `access`
    applies no bound. Where the Conduit to be opened is itself one to `access`, the condition is that
    its bound is within the actor's own, and the actor's bound need not cover `access` as a target.
    A Conduit that lists an operation reserved to the root Interface is opened only for the root Interface,
    and one that lists `get-secret.v1` only where the root Interface asks on its own behalf and the
    consumer is a Resource or an Agent; any other such request reports refused. A request to open
    a Conduit that is already open changes nothing and succeeds. A closed Conduit has been removed,
    so a request that names one, like one that names a Conduit that does not exist, reports invalid,
    whatever the bound. One to open a Conduit that is not open and whose consumer is retired reports
    conflict; a Conduit that was open when its consumer was retired is still open, and a request to
    open it succeeds like any other.

    Only root acting on its own behalf opens a root-consumed Conduit (ACC-054). A matching tombstone
    prevents dispatch with conflict (LIF-041); engine-made defaults are exempt. An already open Conduit
    preserves its original provenance (ACC-044).

    Where expectedId is given and the resolved Conduit has another ID, the request reports conflict
    and changes nothing, after the access decision (LIF-037).
spec:
  inputSchema:
    type: object
    properties:
      conduit:
        $ref: github.com/shrav-k/conduit/core#conduit-reference.v1
      expectedId:
        $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - conduit
  effect: Sets the Conduit's state to ready, so that its consumer may request the operations it lists
    on its target.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: close.v1
  description: >-
    Close a Conduit. All the access it carried ends, so a request through it from then on reports
    refused, and it is removed when it is closed, however it was closed: its shutdown is confirmed
    then, because a Conduit holds nothing to shut down. Dispatched only if the bound of the actor's
    own Conduit to `access` covers the Conduit's target and names every operation it lists. A Conduit
    to `access` that applies no bound is closed only by an actor whose own Conduit to `access` applies
    no bound. Where the Conduit to be closed is itself one to `access`, its bound must be within the
    actor's own. A root-consumed Conduit is closed only where root asks on its own behalf and it is
    neither a first-start nor a default Conduit (ACC-024); otherwise the request reports refused.
    A closed Conduit no longer exists, so a request that names one, like one that names a Conduit
    that does not exist, reports invalid, whatever the bound. A Conduit whose consumer is retired
    is closed without a request once the consumer's shutdown is confirmed, and until then permits
    only the requests of the consumer's retirement.

    Closing leaves a tombstone unless the object was engine-made (LIF-040), retaining the opening
    provenance (ACC-044).

    Where expectedId is given and the resolved Conduit has another ID, the request reports conflict
    and changes nothing, after the access decision (LIF-037).
spec:
  inputSchema:
    type: object
    properties:
      conduit:
        $ref: github.com/shrav-k/conduit/core#conduit-reference.v1
      expectedId:
        $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - conduit
  effect: Closes the Conduit, which ends the access it carried and removes it.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: setup-hook.v1
  description: >-
    An instance's own work at setup, such as making the directory it is to serve. The engine
    dispatches it within each setup of an instance whose template selects an implementation for
    it, in its `implementation` map or by the default of a type that lists it under `requires`,
    as the last part of the setup, once the declared Conduits are open, or the entries set up,
    and the run asked for or the remote server connected. A type's default for a hook that the
    type does not require is not used. It is dispatched to the instance's own implementation,
    through no Conduit, for the caller of the setup, with an idempotency key scoped to the
    instance alone, so a hook that succeeded is not dispatched again by a further setup. It is
    in no capability, so no Conduit lists it. It has no inputs: the implementation learns its
    instance's configuration from its call, under IFC-006.
spec:
  effect: >-
    The instance's own setup work, as the implementation that the template selects defines
    it.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: retire-hook.v1
  description: >-
    An instance's own work at retirement, before its run is stopped. The engine dispatches it
    within a retirement of an instance whose template selects an implementation for it, in its
    `implementation` map or by the default of a type that lists it under `requires`, and for
    which a setup was ever dispatched, asking first for the run where its runtime provider
    reports it `stopped`, or connecting first to a `remote` item where no connection to it lasts
    whose values the engine holds. It is dispatched to the instance's own implementation,
    through no Conduit, for the caller of the retirement, with an idempotency key scoped to the
    instance alone. Its onward requests go through the Conduits of which the instance is the
    consumer, which stay open until its shutdown is confirmed. The stop is asked for whatever
    came of the hook. A hook that did not succeed keeps the shutdown pending, and a further
    retirement dispatches it again, against a new run, so it must not depend on the run that was
    stopped. It is in no capability, so no Conduit lists it. It has no inputs: the
    implementation learns its instance's configuration from its call, under IFC-006.
spec:
  effect: >-
    The instance's own retirement work, as the implementation that the template selects
    defines it.

# --- The operations of a runtime provider.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: run.v1
  description: >-
    Run an instance's implementation item: the run is named by the instance's ID, so one run
    serves one instance. A provider starts no run for an instance's ID while a run that it
    started for that ID may still be running. `item` is the implementation item, reached by
    `command` or `package`, and never a `command` item whose program is a relative path, which
    only the engine's own runner runs. `packageArguments` and `environment` hold, under the
    names the item gives, the values that its `packageArguments` and `environment` take from the
    instance's configuration, each as a string: a string as it is, a number in the form RFC 8785
    gives it, and a boolean as `true` or `false`; a place that holds null gives no variable and
    no argument. `secrets` holds apart from them, under `environment` and `packageArguments` and
    by the same names, the value of each secret the engine read for the run, which the provider
    delivers as the variable or the argument of that name, puts nowhere else, and keeps where
    its contract says; a name is in `environment` or in `secrets.environment`, never both, and
    neither holds a variable of `identity`, which no item that a template selects binds.
    `identity` holds what the engine's mechanism for the identity of a run gives it, to reach
    the engine and to prove which instance it is, under names fixed for every engine and no
    other: in `environment`, `CONDUIT_URL`, the engine's address, and `CONDUIT_IDENTITY_DIR`, a
    directory, whose values the provider may give as the run sees them; and in `files`, keyed
    by their paths in that directory, which are their names, `ca.crt` and `jwks.json`, the
    trust bundle: the root certificates by which the run checks who answers at the engine's
    address and a gate checks the engine's certificate, and the JWK Set of the keys that check
    a token that the mechanism signs; `engine-id`, the ID by which a credential names the
    engine, which a gate admits; `token`, a token in the form of a JWT-SVID, which the run
    sends as the protocol's authorization at the engine's address; and, where the mechanism
    uses mutual TLS for the run or its server stands behind a gate, `tls.crt` and `tls.key`, a
    certificate in the form of an X509-SVID and its private key, which the run's gate also
    serves. The credential names the instance by its ID and lasts as long as the instance, and
    so does the certificate that its gate serves: nothing renews either in this version. The
    provider carries `secrets` and `identity` to the run's machine only over a channel that
    authenticates that machine and keeps them confidential, which its contract names; it
    delivers and keeps `identity` as it does the values of `secrets`, and its gate may use what
    `identity` holds for its means and for nothing else. `machine` is the hostname and the
    labels of the machine the instance's node represents, on which the provider runs the item,
    and on no other. `url` is the Streamable HTTP URL at which the engine then reaches the
    server, behind the provider's gate, which admits only the proof of an enforcement point, and
    every runtime provider returns it; the engine sends nothing there until what answers has
    proved by TLS, with the run's certificate, that it serves the instance. The engine's own
    runner, which no provider call reaches, gives none, and reaches its process over stdio. A
    provider that cannot run the item on that machine, as the engine's own runner cannot on any
    machine but its own, or that is asked to run a `package` whose `registryType`, or the `type`
    of whose `transport`, its contract does not list, ends the run failed and runs nothing: it
    runs a `package` whose transport is `stdio` only by bridging it behind its gate. The engine
    invokes it by a provider call, which is not a request, and no Conduit lists it. The record
    of the call holds no value of `secrets` and nothing of `identity`.
spec:
  inputSchema:
    type: object
    properties:
      instance: {$ref: github.com/shrav-k/conduit/core#id.v1}
      item: {$ref: github.com/shrav-k/conduit/core#implementation-item.v1}
      packageArguments:
        type: object
        additionalProperties: {type: string}
      environment:
        type: object
        additionalProperties: {type: string}
      secrets:
        type: object
        properties:
          environment:
            type: object
            additionalProperties: {type: string}
          packageArguments:
            type: object
            additionalProperties: {type: string}
      identity:
        type: object
        properties:
          environment:
            type: object
            properties:
              CONDUIT_URL: {type: string, format: uri}
              CONDUIT_IDENTITY_DIR: {type: string, minLength: 1}
            required: [CONDUIT_URL, CONDUIT_IDENTITY_DIR]
            additionalProperties: false
          files:
            type: object
            properties:
              ca.crt: {type: string, minLength: 1}
              jwks.json: {type: string, minLength: 1}
              engine-id: {type: string, minLength: 1}
              token: {type: string, minLength: 1}
              tls.crt: {type: string, minLength: 1}
              tls.key: {type: string, minLength: 1}
            required: [ca.crt, jwks.json, engine-id, token]
            additionalProperties: false
        required: [environment, files]
        additionalProperties: false
      machine:
        type: object
        properties:
          hostname: {type: string, minLength: 1}
          labels: {$ref: github.com/shrav-k/conduit/core#labels.v1}
        required: [hostname, labels]
    required: [instance, item, identity, machine]
  outputSchema:
    type: object
    properties:
      url: {type: string, format: uri}
    required: [url]
  effect: >-
    Starts the run of the item for the instance on the machine given in `machine`, under its
    runtime provider's own means.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: stop.v1
  description: >-
    Stop the run that the instance's ID names, on the machine given in `machine`: the hostname
    and the labels of the machine that the instance's node represents, as `run.v1` gives them,
    those last reported where the node is retired, so that a provider that keeps no state of
    its own finds the run. Stopping a run that is not running succeeds. Where the provider
    cannot tell whether the run stopped, the outcome is unknown. What the provider does with a
    stop that it cannot carry out now, as on a machine it cannot reach, its contract states,
    such as carry it out once it can, and where it keeps that stop meanwhile, in a place that
    neither a restart of the engine, on its machine or on another, nor the provider's own
    retirement loses. The engine invokes it by a provider call, within a retirement, and once
    more when an actor unregisters a retired instance; no Conduit lists it.
spec:
  inputSchema:
    type: object
    properties:
      instance: {$ref: github.com/shrav-k/conduit/core#id.v1}
      machine:
        type: object
        properties:
          hostname: {type: string, minLength: 1}
          labels: {$ref: github.com/shrav-k/conduit/core#labels.v1}
        required: [hostname, labels]
    required: [instance, machine]
  effect: Stops the run, where one is running.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: inspect-run.v1
  description: >-
    Report the state of the run that the instance's ID names, on the machine given in
    `machine`, as `stop.v1` gives it: `running`, `stopped` or `unknown`. It reports `stopped`
    only where it knows that no run that it started for the ID is running, and `unknown` where
    it cannot tell, as where it cannot reach the run's machine; the engine asks for a run only
    where the state is `stopped`. The engine reports the latest answer as the instance's
    condition `Running`. `url`, which a provider may give, is the Streamable HTTP URL at which
    the run's server is reached now, where it has moved since `run.v1` returned one, as after
    the provider restarted the run; the engine reaches the server at the latest URL that the
    provider reported, once the server's side there has proved that it serves the instance. The
    engine invokes it by a provider call, and no Conduit lists it.
spec:
  inputSchema:
    type: object
    properties:
      instance: {$ref: github.com/shrav-k/conduit/core#id.v1}
      machine:
        type: object
        properties:
          hostname: {type: string, minLength: 1}
          labels: {$ref: github.com/shrav-k/conduit/core#labels.v1}
        required: [hostname, labels]
    required: [instance, machine]
  outputSchema:
    type: object
    properties:
      state: {enum: [running, stopped, unknown]}
      url: {type: string, format: uri}
    required: [state]

# --- The operations of the machine provider.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: list-machines.v1
  description: >-
    Report the machines: for each, its `hostname`, in canonical form, trimmed and lowercased, of
    at most 63 characters, and at most once, the provider's contract stating which name of a
    machine it reports; its `labels`, which hold `kubernetes.io/hostname`, whose value is the
    hostname, and `kubernetes.io/os` and `kubernetes.io/arch`, whose values are those that Go
    gives `GOOS` and `GOARCH`; and its `state`, `reachable`, `unreachable` or `gone`, which is
    only for a machine that the provider knows no longer exists. A report that names one
    hostname twice is not used, and a machine that a report omits counts as unreachable until a
    report gives it a state. Labels are reported status and never configuration. The engine
    invokes it by a provider call, and no Conduit lists it.
spec:
  outputSchema:
    type: object
    properties:
      machines:
        type: array
        items:
          type: object
          properties:
            hostname: {type: string, minLength: 1, maxLength: 63}
            labels: {$ref: github.com/shrav-k/conduit/core#labels.v1}
            state: {enum: [reachable, unreachable, gone]}
          required: [hostname, labels, state]
    required: [machines]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: place.v1
  description: >-
    Choose the machine on which an instance is placed: one that the provider reports reachable
    and whose labels match `nodeSelector`, the label selector of the instance's type and of
    the items selected for it, which for an instance that has an item that is run and names no
    `runtime` also holds the hostname of the machine the engine runs on. `hostname` names the
    machine, and is absent where the provider places the instance on none. The engine invokes
    it by a provider call, while it decides a request that would instantiate the instance, and
    no Conduit lists it.
spec:
  inputSchema:
    type: object
    properties:
      instance: {$ref: github.com/shrav-k/conduit/core#id.v1}
      nodeSelector: {$ref: github.com/shrav-k/conduit/core#labels.v1}
    required: [instance, nodeSelector]
  outputSchema:
    type: object
    properties:
      hostname: {type: string, minLength: 1, maxLength: 63}

# --- The operation of a package-source provider.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: fetch-package.v1
  description: >-
    Fetch the archive of one version of a package from `fetch`, whose scheme the provider
    claims, and return it in `archive`, encoded in base64 as RFC 4648 gives it. The engine
    checks the archive against `digest`. `fetch` carries no credential: the provider takes one
    by its scheme's own mechanism. The engine invokes it by a provider call, before a request
    to install is dispatched, and no Conduit lists it.
spec:
  inputSchema:
    type: object
    properties:
      address: {$ref: github.com/shrav-k/conduit/core#address.v1}
      version: {$ref: github.com/shrav-k/conduit/core#version.v1}
      digest: {$ref: github.com/shrav-k/conduit/core#digest.v1}
      fetch: {type: string, format: uri-reference, minLength: 1}
    required: [address, version, digest, fetch]
  outputSchema:
    type: object
    properties:
      archive:
        type: string
        pattern: '^[A-Za-z0-9+/]*={0,2}$'
    required: [archive]

# --- The operation of a secret Resource.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: get-secret.v1
  description: >-
    Give the value of the secret that the locator in the secret Resource's configuration
    names, read only from the store that the locator names, never from the configuration and
    never from another store. Where the store cannot be read, the outcome is failed and there
    is no value. No actor's request for this operation is dispatched, whatever Conduit lists
    it, and no tool is presented for it: the only requests for it that are dispatched are the
    engine's reads before a run, or before a connection to a remote server; where the engine
    has lost the values of such a connection, as when it restarts, its read again, for the
    caller of the setup that made the connection, of each secret Resource that setup read; and,
    once the engine has restarted or the part of it that held the run has stopped, its reads
    before it runs again a provider whose run ended with it, for the caller of the setup that
    last asked for that run. Each is made for an instance and through that instance's own open
    Conduit to the secret Resource, as it stands when the read is made. The server that gives
    the value, where a runtime provider other than the engine's own runner runs it, or where it
    is reached by `remote` and is not `plain`, is reached only with the engine's proof: the run
    stands behind that provider's gate, and such an item checks that proof itself. An item
    reached by `remote` that is `plain` stands behind no gate and is reached with no proof, and
    the engine's own runner reaches the process it runs over stdio.
spec:
  outputSchema:
    type: object
    properties:
      value: {type: string}
    required: [value]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: list.v1
  description: >-
    List through management, a Pool or a Fleet (OPS-036, ACC-033 row 15). management lists objects
    of every kind, templates included, installed packages and tombstones; a Pool lists its Resources
    and a Fleet its Agents. Only items the actor may inspect through any open Conduit it holds are
    shown. Installed packages require inspection authority on management; tombstones follow LIF-040
    and are shown in full. kind optionally narrows object kinds. Templates have no lifecycle state.
    No count, total, cursor or position discloses omitted items. This operation grants no inspection
    authority.
spec:
  inputSchema:
    type: object
    properties:
      kind:
        enum:
        - Interface
        - Agent
        - Resource
        - Pool
        - Fleet
        - Conduit
        - Type
        - Capability
        - Operation
        - Requirement
        - Schema
  outputSchema:
    type: object
    properties:
      pending:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#pending-action.v1
      objects:
        type: array
        items:
          type: object
          properties:
            kind:
              enum:
              - Interface
              - Agent
              - Resource
              - Pool
              - Fleet
              - Conduit
              - Type
              - Capability
              - Operation
              - Requirement
              - Schema
            name:
              type: string
              minLength: 1
            id:
              $ref: github.com/shrav-k/conduit/core#id.v1
            template:
              type: boolean
            state:
              enum:
              - registered
              - ready
              - retired
          required:
          - kind
          - name
          - id
          - template
          if:
            properties:
              template:
                const: false
              kind:
                enum:
                - Interface
                - Agent
                - Resource
                - Pool
                - Fleet
                - Conduit
          then:
            required:
            - state
          else:
            not:
              required:
              - state
      packages:
        type: array
        items:
          type: object
          properties:
            address:
              $ref: github.com/shrav-k/conduit/core#address.v1
            version:
              $ref: github.com/shrav-k/conduit/core#version.v1
            digest:
              $ref: github.com/shrav-k/conduit/core#digest.v1
          required:
          - address
          - version
          - digest
      tombstones:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#tombstone.v1
    required:
    - objects
    - packages
    - tombstones
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: lift.v1
  description: >-
    Lift the tombstone named by id through access (ACC-053). The caller must hold an open Conduit
    listing lift.v1 whose bound covers the kept IDs and operations as ACC-053 requires. Remove a tombstone
    caused by the named tombstone only where this same authority would lift it independently; the
    remainder stay and are listed in remaining, disclosed under the same visibility as LIF-040. Lifting
    registers nothing, opens nothing, names no revision and grants nothing. A nonexistent id reports
    invalid for an unbounded holder and refused for a bounded one. No root-only reservation applies
    to lifting.
spec:
  inputSchema:
    type: object
    properties:
      id:
        $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - id
  outputSchema:
    type: object
    properties:
      remaining:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#tombstone.v1
    required:
    - remaining
  effect: >-
    Removes the named tombstone and each tombstone it caused that the caller is independently authorized
    to lift. Other caused tombstones remain.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: retire-with-agents.v1
  description: >-
    Retire the Fleet that is the target of the request together with its Agents (LIF-021). Retire
    each Agent whose shutdown is unconfirmed before any Agent of that Fleet that it refers to or is
    the consumer of a Conduit to. The engine orders cycles and unrelated members. Retire an already
    retired Agent again where its shutdown is unconfirmed. A setup, retirement or change in progress
    reports conflict. If a retirement ends without shutdown confirmed or is not dispatched, dispatch
    none ordered after it and retire the other Agents. Retire the Fleet only once every Agent shutdown
    is confirmed. Each Agent retirement and the Fleet retirement is its own invocation of retire.v1.
    Cancellation dispatches no further retirement, and retirements in progress still ask for stop.
    Authority is against that Fleet and need list only this cascade. If any Agent shutdown is unconfirmed,
    the cascade outcome is failed and its diagnostics name each Agent in the way, including those
    not dispatched. A failed result holds no outputs, so none are declared.
spec:
  effect: >-
    Retires the Fleet once the shutdown of every Agent it owns is confirmed. Each Agent retirement
    has its own invocation and effects.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: answer.v1
  description: Answer a setup with dismissed or a notice with acknowledged (PND-009). Only an Interface
    on its own behalf, through the target authorizing inspection of the subject (ACC-033). No hook
    or model work runs. Other kinds name their own answering operation; answered, expired or void
    actions conflict.
spec:
  inputSchema:
    type: object
    properties:
      action:
        $ref: github.com/shrav-k/conduit/core#id.v1
      answer:
        type: string
    required:
    - action
    - answer
  effect: Record the answer to the pending action.
  deduplicates: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: sign-in.v1
  description: Sign in an instance for the configured expected account (PND-010, PND-011, IFC-049).
    Only an Interface on its own behalf, through the owning Fleet for an Agent or owning Pool for
    a Resource; Resources are root-only, and other Interfaces sign in Agents of scoped Fleets only.
    account-hook runs first; the expected account succeeds; no account or another account proceeds
    to sign-in-hook, which relays a URL action. Retries poll for the account; a wrong account found
    then is undone and the invocation fails with the action still pending. Failed undo holds model
    work. Missing URL capability returns
    -32021. No held request resumes and no later hook runs after DL18.
spec:
  inputSchema:
    type: object
    properties:
      instance:
        anyOf:
        - {$ref: github.com/shrav-k/conduit/core#agent-reference.v1}
        - {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      expectedId:
        $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - instance
  outputSchema:
    type: object
    properties:
      account:
        type: string
    required:
    - account
  effect: Sign in the instance and answer its sign-in action when the expected account is verified.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: sign-in-hook.v1
  description: Begin the client login and return URL-mode elicitation to the engine inside sign-in.v1
    or setup (CTR-013, PND-011). No consumer calls it and no model work starts. Codes go only to
    the engine panel (PND-004). It does not prove completion; account-hook checks that.
spec:
  effect: Begin the instance client login.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: account-hook.v1
  description: Report the account the instance client is signed in to, or null when none, without
    reading it through the engine (CTR-013, PND-011). A part of sign-in.v1 or setup only, dispatched
    through no Conduit, starting no model work and changing nothing outside itself.
spec:
  outputSchema:
    type: object
    properties:
      account:
        type:
        - string
        - 'null'
    required:
    - account
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: sign-out-hook.v1
  description: Remove the instance client login from where its client keeps it (CTR-013, PND-011).
    Only a part of sign-in.v1 or setup through no Conduit; no consumer calls it and no model work
    starts.
spec:
  effect: Remove the instance client sign-in.
