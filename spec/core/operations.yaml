# Part of the core package. Accepted by the owner on 2026-11-05 (plan-audit ruling 37); the
# record is docs/proposals/core-and-schemas/README.md. See README.md in this directory.
#
# The Operation contracts of the core package: every management verb the promises mention
# (OPS-019), the tool that retrieves one's own results (IFC-024), the tool that asks for a
# start of later work (IFC-035, ACC-040), the control that designates the default location
# (PLC-016) and the control that changes a location's facts (PLC-021).
# Which capability includes each is in capabilities.yaml, and which open Conduit authorizes
# each is ACC-033.
#
# Read with these rules, each of which the record lists as a choice the owner accepted:
#   - One contract for one verb. `register.v1`, `register-replacement.v1`, `inspect.v1`,
#     `set-up.v1`, `retire.v1` and `reconcile.v1` are included both in the capability of
#     `management` and in the capability of a Pool; ACC-033 says which of the two targets
#     authorizes a request, from the object the request names. `reconcile.v1` is also
#     included in the capability of `access`, because reconciling an invocation of a
#     management verb is authorized against the target that authorized the request being
#     reconciled. Any other invocation, of a control or of any other operation, is
#     reconciled through the target that manages the instance it was dispatched to: the
#     Pool that owns a Resource, and `management` otherwise (ACC-033). So no other
#     capability, of the core package or of any other, has to include `reconcile.v1`. Where
#     the Pool that owns a Resource is retired, `management` authorizes in its place every
#     request that the Pool would have authorized (ACC-033).
#   - An instance is set up by one invocation of `set-up.v1` and retired by one of
#     `retire.v1`, requested of the target ACC-033 names, with the instance as an input. The
#     engine implements both. The `setup` and `retire` graphs of the instance's template are
#     the steps the engine then runs for that instance: they are not implementations selected
#     in an `implementation` map, and they have no inputs of their own. "The setup operation"
#     and "the retire operation" of an instance mean these invocations.
#   - An operation that changes a stored object takes the object's current `revision` as an
#     input (REV-002, REV-011), because a request's `arguments` are exactly the operation's
#     inputs (IFC-001). Setting up, retiring, retiring a Pool with its Resources, opening and
#     closing name no revision and advance none (REV-012); nor do applying and removing a
#     policy, because a policy is not configuration (ACC-031).
#   - A control declares the input `revision` and the output `settings`, and its `changes`
#     is a map from the name of an input to the pointer, into the configuration, of the
#     setting that input sets (CTR-006). `revision` is the one input that must always be
#     supplied (REV-006). `settings` states the settings the control confirmed: a map
#     keyed by those pointers, with one member for each place confirmed, holding the value
#     now stored there (REV-007). Its other inputs are optional, and one that is not supplied
#     leaves its setting as stored: the settings a control addressed are those of the inputs
#     it was sent. The input `settings` of `reconcile.v1` has the same shape.
#   - No input of a core operation states a `default` (CTR-002, OPS-026): each is supplied or
#     is optional.
#   - `reservedToRoot: true` marks an operation reserved to the root Interface (ACC-032).
#     Only an Operation contract of the core package carries the mark (CTR-009).
#   - `deduplicates: true` is declared where the whole effect is a change to what the engine
#     itself stores, which the engine can recognize by the operation identity. It is not
#     declared where the engine runs the steps of a template's graph or invokes other
#     implementations, as it does for `set-up.v1`, `retire.v1`,
#     `retire-with-resources.v1` and `start-later-work.v1`.
#   - No core operation starts model work (IMP-002), so none carries `startsModelWork`, and
#     none arranges later work, so none carries `arrangesLaterWork` (CTR-002, ACC-019).
#     `start-later-work.v1` starts work that another operation arranged, and whether that
#     start is dispatched follows the marks of the two operations it names (ACC-040).
#   - Every core operation is implemented by the engine itself, written as the default
#     implementation `github.com/shrav-k/conduit/core#engine`.
#   - An object is named in a request by a reference and never by an ID. The engine resolves
#     the reference when it decides the request, and a retired instance's name still resolves
#     until the instance is unregistered (LIF-007). An invocation and a policy are not
#     objects, and each is named by the ID the engine gave it. An instance stores each of
#     its references in the resolved form `{kind, id}`, which only the engine writes
#     (OBJ-009), and `inspect.v1` and a control's `settings` show it so. A request made
#     through a Conduit that lists the operation, and that names an object, a policy or an
#     invocation that does not exist, reports invalid (OPS-029).
#   - What a request that is not dispatched says beyond its reason, it says in `diagnostics`
#     in its result's `structuredContent`, whether or not the operation declares an output
#     of that name (IFC-025). A rejected registration carries them so (OBJ-023), and so does
#     a request to retire or to unregister a Pool whose Resources are in the way (LIF-020),
#     though `retire.v1` and `unregister.v1` declare no output. A request that is not
#     permitted reports refused and says nothing else about the objects it names (OPS-023).
#   - A result that carries none of an operation's outputs has `isError` true: one that
#     ended with a reason, one whose outcome is failed or unknown, one whose content is
#     withheld, and a repeat of an invocation that has not ended, or of one that succeeded
#     and whose outputs the engine no longer keeps (IFC-025). An operation that declares no
#     outputs has no content to withhold.

# --- Operations of `management`, some of them also operations of a Pool.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: register.v1
  description: >-
    Register the documents of one submission. The `documents` and the `manifest` of one
    request are one project: the documents and the one manifest handed over together.
    Templates and instances are added to the objects that exist, registering an instance
    document instantiates its template, and contracts are made available to the project.
    Nothing is set up or opened. Authorized against `management`; registering a Resource into
    a Pool that already exists also needs an open Conduit to that Pool that lists this
    operation. `objects` lists every template and instance the request added, nested instances
    among them, and says of each nested instance which nested instantiation made it. A
    registration that is rejected is not dispatched, and its result still carries
    `diagnostics`. The request hands the manifest over as a value, with no directory, so an
    item of `packages` whose `fetch` is a relative reference, and an implementation item whose
    program is a relative path, are rejected. A registration fetches and installs no package:
    one that the manifest lists and that is not installed is reported in `diagnostics`, and
    `fetch` in an item is the place an installation of that item fetches from.
spec:
  inputs:
    documents:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#document.v1}
    manifest:
      schema: {$ref: github.com/shrav-k/conduit/core#manifest.v1}
      optional: true
  outputs:
    objects:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#object.v1}
    diagnostics:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
  effect: >-
    Adds the templates and instances that the documents make, and the nested instances of
    those instances, to the objects that exist.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: replace.v1
  description: >-
    Replace a template with the document given, which has the same kind and name. Instances
    made before keep what they resolved. The document is handed over with no contracts: a
    reference written `#name` in it reaches a contract of the unpublished package that the
    template being replaced holds. A manifest may be handed over with the document, and the
    document's references to packages then resolve through it. A replacing document that is
    rejected, or that is of another kind or name, reports invalid. Authorized against
    `management`.
spec:
  inputs:
    template:
      schema: {$ref: github.com/shrav-k/conduit/core#template.v1}
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
    manifest:
      schema: {$ref: github.com/shrav-k/conduit/core#manifest.v1}
      optional: true
  outputs:
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
    diagnostics:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
  effect: Changes the stored definition of the template and advances its revision.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: rename.v1
  description: >-
    Give a template or an instance a new name. Its ID and its definition are unchanged, and
    its revision advances, as for any stored change. Authorized against `management`. A rename
    of a Conduit that would make one of its tool names equal to another tool's name, or longer
    than 128 characters, reports conflict. A first-start object is not renamed, and nor is
    either of the two Conduits of `root` that exist from first start: the request reports
    refused. A request that names an object that does not exist reports invalid.
spec:
  inputs:
    object:
      schema: {$ref: github.com/shrav-k/conduit/core#reference.v1}
    name:
      schema: {$ref: github.com/shrav-k/conduit/core#name.v1}
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
  effect: Changes the name of the object and advances its revision.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: unregister.v1
  description: >-
    Remove a template, or a retired instance, from the objects that exist. An instance is
    removed only if its shutdown is confirmed or its location was declared lost; otherwise the
    request reports conflict. Its name and its ID no longer
    resolve. Records are kept. Authorized against `management`. A request to unregister a Pool
    that owns a Resource that still exists reports conflict, and a diagnostic names each
    Resource in the way. A request that names an object that does not exist reports invalid.
spec:
  inputs:
    object:
      schema: {$ref: github.com/shrav-k/conduit/core#reference.v1}
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
  effect: Removes the object from the objects that exist.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: inspect.v1
  description: >-
    Read a template or an instance: what was declared, its status and the records about it.
    Inspecting a Resource is authorized against the Pool that owns it, or against `management`
    where that Pool is retired; inspecting anything else is authorized against `management`.
    A request that names an object that does not exist reports invalid, whichever of the two
    it is made of. `packages` lists the packages the object holds.
    Each item has `address`, `version` and `digest`; the core package's item has no `digest`,
    and an unpublished package's has `digest` alone. `declared` shows each reference in its
    resolved form, `{kind, id}`. Inspecting an open Conduit shows, under each requirement it
    applies, the implementation that applies it, named by its qualified reference or, for an
    implementation of a project that is not published, as `<digest>#<name>`. The status of
    `access` also lists the policies in force, each with the ID `apply-policy.v1` returned
    for it and with the actors and targets it names.
spec:
  inputs:
    object:
      schema: {$ref: github.com/shrav-k/conduit/core#reference.v1}
  outputs:
    id:
      schema: {$ref: github.com/shrav-k/conduit/core#id.v1}
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
    packages:
      schema:
        type: array
        items:
          anyOf:
            - type: object
              properties:
                address: {$ref: github.com/shrav-k/conduit/core#address.v1}
                version: {$ref: github.com/shrav-k/conduit/core#version.v1}
                digest: {$ref: github.com/shrav-k/conduit/core#digest.v1}
              required: [address, version, digest]
              additionalProperties: false
            - type: object
              properties:
                address: {const: github.com/shrav-k/conduit/core}
                version: {$ref: github.com/shrav-k/conduit/core#version.v1}
              required: [address, version]
              additionalProperties: false
            - type: object
              properties:
                digest: {$ref: github.com/shrav-k/conduit/core#digest.v1}
              required: [digest]
              additionalProperties: false
    declared:
      schema: {type: object}
    status:
      schema:
        type: object
        properties:
          state: {enum: [registered, ready, retired]}
          shutdown: {enum: [confirmed, pending, unknown]}
          policies:
            type: array
            items:
              type: object
              properties:
                id: {$ref: github.com/shrav-k/conduit/core#id.v1}
              required: [id]
        required: [state]
      optional: true
    records:
      schema:
        type: array
        items: {type: object}
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: set-up.v1
  description: >-
    Set up an instance. One invocation of this operation is the setup of the instance it
    names, which the promises call the instance's setup operation. The engine implements it:
    it opens the instance's declared Conduits, sets up the Resources of a Pool's entries, and
    runs the steps of the `setup` graph of the instance's template. That graph is not an
    implementation selected in an `implementation` map, and it has no inputs of its own. A
    step that opens a declared Conduit or sets up the Resource of an entry is authorized
    exactly as this request was, by the Conduits of the instance that sent it, which for an
    onward request is the sending instance and not the caller it serves. Setting up a Resource
    is authorized against the Pool that owns it, or against `management` where that Pool is
    retired; setting up an Agent, an Interface or a Pool against `management`. A Conduit is
    set up with `open.v1`: a request that names a Conduit or a template reports invalid, and
    so does one that names an object that does not exist.
spec:
  inputs:
    instance:
      schema: {$ref: github.com/shrav-k/conduit/core#reference.v1}
  effect: >-
    Runs the setup of the instance, with the effects of its steps. When it succeeds the
    instance's state is ready.
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: retire.v1
  description: >-
    Retire an instance. One invocation of this operation is the retirement of the instance it
    names, which the promises call the instance's retire operation. The instance's state is
    retired from the moment the request is dispatched. The engine implements the operation: it
    runs the steps of the `retire` graph of the instance's template, where the template has
    one and a setup of the instance was ever dispatched, and then stops each runtime the
    instance still holds. That graph is not an implementation selected in an `implementation`
    map, and it has no inputs of its own. Retiring a Resource is authorized against the Pool
    that owns it, or against `management` where that Pool is retired; retiring an Agent, an
    Interface or a Pool against `management`. A Conduit is retired with `close.v1`: a request
    that names a Conduit or a template reports invalid, and so does one that names an object
    that does not exist. A request to retire an instance whose shutdown is not confirmed is
    a further retirement, and one to retire an instance whose shutdown is confirmed changes
    nothing and succeeds. A request to retire a Pool that owns a Resource whose shutdown is
    not confirmed reports conflict, and a diagnostic names each Resource in the way.
spec:
  inputs:
    instance:
      schema: {$ref: github.com/shrav-k/conduit/core#reference.v1}
  effect: >-
    Ends the instance for good, with the effects of the steps of its `retire` graph and of the
    stops of its runtimes. The Conduits of which it is the target are closed at once, and
    those of which it is the consumer once its shutdown is confirmed.
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: reconcile.v1
  description: >-
    Record, with what was checked, whether the effect of an invocation whose outcome is unknown
    occurred. The invocation is named by the ID the engine gave it, which a consumer learns
    from the result of its request or from `retrieve-result.v1`. An invocation of a
    management verb is reconciled through the target that authorized the request being
    reconciled, by an open Conduit to that target that lists this operation: `management` or
    a Pool for a setup or a retirement, and `access` for an open or a close. Any other
    invocation, of a control or of any other operation, is reconciled through the target that
    manages the instance it was dispatched to: the Pool that owns a Resource, and
    `management` for an Agent, an Interface or a Pool. Where the Pool that owns a Resource is
    retired, `management` authorizes in its place. A request that names an invocation
    whose outcome is not unknown reports conflict, and one whose ID names no invocation
    reports invalid. Recording that a setup or an open
    occurred gives it the outcome succeeded and makes the instance ready or the Conduit open.
    Recording that a retirement or a close occurred confirms the shutdown. Recording that the
    effect did not occur gives the outcome failed and changes nothing else: the instance or
    the Conduit is as a failed setup, open, retirement or close leaves it. For a control,
    `revision` is required. Where the control took effect, `settings` states the settings
    that took effect, in the shape of the control's output `settings`, a map keyed by the
    pointers of the control's `changes`, and they are stored in the instance's current
    configuration. Where it did not, nothing is stored.
spec:
  inputs:
    invocation:
      schema: {$ref: github.com/shrav-k/conduit/core#id.v1}
    occurred:
      schema: {type: boolean}
    checked:
      schema: {type: string, minLength: 1}
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
      optional: true
    settings:
      schema: {type: object}
      optional: true
  effect: >-
    Changes the invocation's outcome from unknown to succeeded or failed. Where a setup or an
    open is recorded as having occurred, sets the state of the instance or the Conduit to
    ready. Where a retirement or a close is, confirms the shutdown. For a control that took
    effect, stores the settings stated.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: register-replacement.v1
  description: >-
    Ask for a new instance for a nested instantiation whose instance is retired: a declared
    Conduit, a component Conduit made for a declared Conduit whose template is a composite, or
    the Resource of a Pool's entry. The request names the retired instance. The new instance
    has a new ID, a newly generated name and the state registered, and the retired instance
    keeps its own name; nothing is set up or opened. A request that names
    an instance that is not retired is not dispatched and reports conflict, for a declared
    Conduit and a component as for the Resource of an entry. A component of a composite
    Conduit that was instantiated by its own document is not covered, because no instance
    holds its nested instantiation: a request that names it is not dispatched and reports
    invalid, and a new Conduit is instantiated by a new document.
    Authorized as registering that instance would be, with this operation in the place of
    `register.v1`: against `management`, and for the Resource of a Pool's entry also by an
    open Conduit to that Pool that lists this operation. The request is a registration, so
    one that is rejected still carries `diagnostics`.
spec:
  inputs:
    instance:
      schema: {$ref: github.com/shrav-k/conduit/core#reference.v1}
  outputs:
    object:
      schema: {$ref: github.com/shrav-k/conduit/core#object.v1}
    diagnostics:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
  effect: Adds one instance to the objects that exist.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: install.v1
  description: >-
    Make one version of a package available. Nothing is registered. Authorized against
    `management`. An installation that is rejected is not dispatched and reports invalid: an
    archive whose digest is not `digest`, and a manifest that states another address or
    version, are among the causes. It reports unavailable where the archive cannot be fetched
    now, and conflict where that address and version is already installed with another
    digest. Where it is already installed with the same digest the request changes nothing
    and succeeds. A package whose manifest lists a package that is not installed is
    installed, and `diagnostics` reports the missing one. `fetch` is a URI reference, and a
    relative one is rejected, because a request has no directory to resolve it against. A
    package is installed only by this operation: registering a project installs none of the
    packages its manifest lists, and `fetch` in an item of `packages` is the value an
    installation of that item gives here.
spec:
  inputs:
    address:
      schema: {$ref: github.com/shrav-k/conduit/core#address.v1}
    version:
      schema: {$ref: github.com/shrav-k/conduit/core#version.v1}
    digest:
      schema: {$ref: github.com/shrav-k/conduit/core#digest.v1}
    fetch:
      schema: {type: string, minLength: 1}
      optional: true
  outputs:
    diagnostics:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
  effect: Adds the package, at that version and digest, to the packages that are installed.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: declare-lost.v1
  description: >-
    Record that a location, and the instances placed on it, can never confirm shutdown. The
    location and every instance on it are retired. Reserved to the root Interface, and
    authorized against `management`.
spec:
  inputs:
    location:
      schema: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
  effect: >-
    Retires the location and every instance placed on it, and closes the Conduits of which any
    of them is an end.
  deduplicates: true
  reservedToRoot: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: purge.v1
  description: >-
    Remove the records made before a given time. For every invocation its operation identity,
    the engine's ID for it, its outcome and a digest of its contents are kept, and a record of
    the purge is kept.
    Reserved to the root Interface, and authorized against `management`.
spec:
  inputs:
    before:
      schema: {type: string, format: date-time}
  effect: Removes records.
  deduplicates: true
  reservedToRoot: true
  implementation: github.com/shrav-k/conduit/core#engine

# --- Operations of a Pool alone.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: retire-with-resources.v1
  description: >-
    Retire the Pool that is the target of the request together with the Resources it owns. Each
    Resource is retired, and the Pool is retired only if the shutdown of every one of them is
    confirmed. Authorized against that Pool, by a Conduit that need list only this operation:
    the retirements of the Resources are part of it, so the Conduit need not list `retire.v1`.
    Each of those retirements is an invocation of `retire.v1` of its own, with its own
    outcome, and so is the Pool's. Where Resources remain whose shutdown is not confirmed, the
    Pool's retirement is not dispatched, the outcome of this request is failed, and the
    diagnostics of its result name each of them: a result whose outcome is failed holds no
    outputs, so the operation declares none.
spec:
  effect: >-
    Retires the Pool, once the shutdown of every Resource it owns is confirmed. The retirement
    of each Resource is an invocation of `retire.v1` of its own, with its own effects.
  implementation: github.com/shrav-k/conduit/core#engine

# --- Operations of `access`.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: open.v1
  description: >-
    Open a Conduit whose state is registered. Dispatched only if the bound of the actor's own
    Conduit to `access` covers the Conduit's target and names every operation it lists. A
    Conduit to `access` that applies no bound is unlimited, and is opened only by an actor
    whose own Conduit to `access` applies no bound. Where the Conduit to be opened is itself
    one to `access`, ACC-030 states the condition in place of this one: its bound is within
    the actor's own, and the actor's bound need not cover `access` as a target. A request to
    open a Conduit that is already open changes nothing and succeeds, and one to open a
    closed Conduit reports conflict. A request that names a Conduit that does not exist
    reports invalid, whatever the bound.
spec:
  inputs:
    conduit:
      schema: {$ref: github.com/shrav-k/conduit/core#conduit-reference.v1}
  effect: >-
    Sets the Conduit's state to ready, so that its consumer may request the operations it
    lists on its target.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: close.v1
  description: >-
    Close a Conduit. All the access it carried ends, and it is never opened again. Its
    shutdown is confirmed when it is closed, however it was closed, because a Conduit holds
    nothing to shut down. Dispatched only if the bound of the actor's own Conduit to `access`
    covers the Conduit's target and names every operation it lists. A Conduit to `access`
    that applies no bound is closed only by an actor whose own Conduit to `access` applies
    no bound. Where the Conduit to be closed is itself one to `access`, ACC-030 states the
    condition in place of this one. A request to close a Conduit that is already closed
    changes nothing and succeeds, and one that names a Conduit that does not exist reports
    invalid, whatever the bound. A Conduit whose consumer is retired is closed without a
    request once the consumer's shutdown is confirmed, and until then permits only the
    requests of the consumer's retirement.
spec:
  inputs:
    conduit:
      schema: {$ref: github.com/shrav-k/conduit/core#conduit-reference.v1}
  effect: Sets the Conduit's state to retired, which ends the access it carried.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: apply-policy.v1
  description: >-
    Apply a requirement, as a policy. The request gives `actors`, `targets` or both, and one
    that gives neither reports invalid. The policy applies to each request whose caller is
    one of `actors`, where that list is given, and whose target is one of `targets`, where
    that list is given. No policy applies to a request whose caller is the root Interface,
    and a request whose `actors` names it reports refused. The policy is stored by `access`,
    which returns an ID for it. A policy is not configuration, so the request names no
    revision. `requirement` is a qualified reference: a policy names a Requirement contract
    of a published package only. Dispatched only if every actor and target named is covered
    by the bound of the actor's own Conduit to `access`. A requirement that does not narrow
    requests, or that does not apply as a policy, reports invalid, and so does a request that
    names an actor or a target that does not exist.
spec:
  inputs:
    requirement:
      schema: {$ref: github.com/shrav-k/conduit/core#qualified-reference.v1}
    arguments:
      schema: {type: object}
      optional: true
    actors:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#actor-reference.v1}
      optional: true
    targets:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#target-reference.v1}
      optional: true
  outputs:
    policy:
      schema: {$ref: github.com/shrav-k/conduit/core#id.v1}
  effect: Adds a policy to the policies in force.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: remove-policy.v1
  description: >-
    Remove a policy, named by the ID `apply-policy.v1` returned. The request names no
    revision. Dispatched only if every actor and target the policy names is covered by the
    bound of the actor's own Conduit to `access`. An ID that names no policy in force reports
    invalid.
spec:
  inputs:
    policy:
      schema: {$ref: github.com/shrav-k/conduit/core#id.v1}
  effect: Removes a policy from the policies in force.
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine

# --- The two tools every instance is presented, whether or not a Conduit of it is open.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: retrieve-result.v1
  description: >-
    Retrieve the result of an invocation that began with a request the instance sent itself,
    named by the operation identity the request carried and the target it was sent to, for the
    same caller. An operation identity, and the retrieval
    of a result, are scoped to the caller, the target and the instance that sent the request:
    an instance retrieves only the result of an invocation that it sent the request for. An
    identity under which the sender has no invocation reports refused. Needs no Conduit.
    `state` is the invocation's state, and `invocation` is the engine's ID for the
    invocation, which is the ID `reconcile.v1` takes. A retained result belongs to the
    Conduit its invocation was dispatched through: its content is delivered only while that
    Conduit is open, and never under another one. `withheld` is true where content exists
    and is not delivered; `outputs` holds the operation's outputs where they are delivered,
    and is absent, with `withheld` not true, where the engine no longer keeps them. Once the
    target is unregistered it can no longer be named, and the request reports refused, as for
    any identity under which the sender can reach no invocation; the records of the invocation
    remain.
spec:
  inputs:
    operationIdentity:
      schema: {type: string, minLength: 1}
    target:
      schema: {$ref: github.com/shrav-k/conduit/core#target-reference.v1}
  outputs:
    state:
      schema: {enum: [inProgress, succeeded, failed, unknown]}
    invocation:
      schema: {$ref: github.com/shrav-k/conduit/core#id.v1}
    withheld:
      schema: {type: boolean}
      optional: true
    outputs:
      schema: {type: object}
      optional: true
  implementation: github.com/shrav-k/conduit/core#engine
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: start-later-work.v1
  description: >-
    Ask for a start of later work. The implementation that holds work which an operation
    marked `arrangesLaterWork` arranged asks with this tool for each start. `invocation` is
    the engine's ID for the invocation that arranged the work. `operation` names the
    operation to start, by its qualified reference or, for an operation of an unpublished
    package, as `<digest>#<name>`, and `arguments` holds that operation's inputs. The engine
    dispatches an invocation of that operation to the instance that asks, for the caller of
    the arranging invocation and through the Conduit that invocation was dispatched through,
    with the restrictions as they then stand. It does so only if the arranging invocation was
    dispatched to the instance that asks and is of an operation marked `arrangesLaterWork`,
    that Conduit is open and lists the operation to start, and, where that operation starts
    model work, the arranging operation is marked `startsModelWork` too. Where one of these
    does not hold, the request reports refused. Needs no Conduit of the instance that asks,
    and names no invocation that
    it serves. The result is that of the started invocation: its outcome is the outcome of
    the request, the engine's ID for it is in the result's `_meta`, and `outputs` holds the
    outputs of the operation that was started, where it succeeded and they are delivered. A
    repeat under one operation identity is the same start.
spec:
  inputs:
    invocation:
      schema: {$ref: github.com/shrav-k/conduit/core#id.v1}
    operation:
      schema: {type: string, minLength: 1}
    arguments:
      schema: {type: object}
      optional: true
  outputs:
    outputs:
      schema: {type: object}
      optional: true
  effect: Starts one invocation of the operation named, with the effects of that operation.
  implementation: github.com/shrav-k/conduit/core#engine

# --- The control of the `system` Pool.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: set-default-location.v1
  description: >-
    Designate the default location, or clear it by giving null. A control of the `system` Pool,
    authorized by an open Conduit to `system` that lists it. A value that is not the name of a
    location that exists reports invalid. `settings` holds the member `/defaultLocation`, with
    the value now stored there, where the control confirmed it: the location in its resolved
    form, `{kind: Resource, id}`, or null.
spec:
  inputs:
    location:
      schema:
        anyOf:
          - $ref: github.com/shrav-k/conduit/core#resource-reference.v1
          - type: 'null'
      optional: true
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
  outputs:
    settings:
      schema: {type: object}
  effect: Changes the default-location setting of the `system` Pool.
  changes:
    location: /defaultLocation
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine

# --- The control of a location.
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: set-facts.v1
  description: >-
    Change the stored facts of a location. A control of a location, authorized by an open
    Conduit to that location that lists it. `facts` is the whole of what the location is to
    state about itself; where it is not supplied, the facts are left as stored. A location's
    facts are changed in no other way. `settings` holds the member `/facts`, with the facts
    now stored, where the control confirmed them.
spec:
  inputs:
    facts:
      schema:
        type: object
        properties:
          host: {type: string, minLength: 1}
          localPaths: {type: boolean}
      optional: true
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
  outputs:
    settings:
      schema: {type: object}
  effect: Changes the stored facts of the location.
  changes:
    facts: /facts
  deduplicates: true
  implementation: github.com/shrav-k/conduit/core#engine
