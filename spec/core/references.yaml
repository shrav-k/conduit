        kind: {const: Interface}
        name: {$ref: github.com/shrav-k/conduit/core#name.v1}
      required: [kind, name]
      additionalProperties: false
    - type: object
      properties:
        kind: {const: Interface}
        id: {$ref: github.com/shrav-k/conduit/core#id.v1}
      required: [kind, id]
      additionalProperties: false
---
