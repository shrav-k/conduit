apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: consumer-reference.v1
  description: >-
    A reference to an instance that may be the consumer of a Conduit: an Interface, an Agent or
    a Resource, written with its kind. The engine stores `{kind, id}` in its place, the
    resolved form, which only the engine writes.
spec:
  anyOf:
    - type: object
      properties:
        kind: {enum: [Interface, Agent, Resource]}
        name: {$ref: github.com/shrav-k/conduit/core#name.v1}
      required: [kind, name]
      additionalProperties: false
    - $ref: github.com/shrav-k/conduit/core#pool-entry-reference.v1
    - $ref: github.com/shrav-k/conduit/core#entry-reference.v1
    - type: object
      properties:
        kind: {enum: [Interface, Agent, Resource]}
        id: {$ref: github.com/shrav-k/conduit/core#id.v1}
      required: [kind, id]
      additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: target-reference.v1
  description: >-
    A reference to an instance that may be the target of a Conduit: an Interface, an Agent, a
    Resource or a Pool, written with its kind. The engine stores `{kind, id}` in its place,
    the resolved form, which only the engine writes.
spec:
  anyOf:
    - type: object
      properties:
        kind: {enum: [Interface, Agent, Resource, Pool]}
        name: {$ref: github.com/shrav-k/conduit/core#name.v1}
      required: [kind, name]
      additionalProperties: false
    - $ref: github.com/shrav-k/conduit/core#pool-entry-reference.v1
    - $ref: github.com/shrav-k/conduit/core#entry-reference.v1
    - type: object
      properties:
        kind: {enum: [Interface, Agent, Resource, Pool]}
        id: {$ref: github.com/shrav-k/conduit/core#id.v1}
      required: [kind, id]
      additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: secret-reference.v1
  description: >-
    A secret reference: a reference to a secret Resource, a Resource whose type offers
    `secret-provider.v1`, written with its kind or as one of the two forms that name the
    Resource of a Pool's entry, and never as a bare name. A place that this schema governs
    holds the reference and never the secret itself. The engine stores
    `{kind: Resource, id}` in its place, the resolved form, which only the engine writes.
spec:
  anyOf:
    - type: object
      properties:
        kind: {const: Resource}
        name: {$ref: github.com/shrav-k/conduit/core#name.v1}
      required: [kind, name]
      additionalProperties: false
    - $ref: github.com/shrav-k/conduit/core#pool-entry-reference.v1
    - $ref: github.com/shrav-k/conduit/core#entry-reference.v1
    - type: object
      properties:
        kind: {const: Resource}
        id: {$ref: github.com/shrav-k/conduit/core#id.v1}
      required: [kind, id]
      additionalProperties: false
