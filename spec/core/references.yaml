apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: resource-reference.v1
  description: >-
    A reference to a Resource. The name alone, the kind and the name, or one of the two forms
    that name the Resource of a Pool's entry. A node is a Resource and is referred to in
    this way. The engine stores `{kind: Resource, id}` in its place, the resolved form, which
    only the engine writes.
spec:
  anyOf:
    - $ref: github.com/shrav-k/conduit/core#name.v1
    - type: object
      properties:
        kind: {const: Resource}
        name: {$ref: github.com/shrav-k/conduit/core#name.v1}
      required: [kind, name]
      additionalProperties: false
    - $ref: github.com/shrav-k/conduit/core#pool-entry-reference.v1
    - $ref: github.com/shrav-k/conduit/core#entry-reference.v1
    - type: object
      properties:
        kind: {const: Resource}
        id: {$ref: github.com/shrav-k/conduit/core#id.v1}
      required: [kind, id]
      additionalProperties: false
---
