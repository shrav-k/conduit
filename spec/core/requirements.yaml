# Part of the core package, first accepted by plan-audit ruling 37 (2026-11-05); the record is
# docs/proposals/core-and-schemas/README.md. What the docs audit and rounds 2 to 4 of the
# re-audit changed since is logged in the records that README.md in this directory names.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, took `appliesTo` and `narrows` out of both contracts (alignment C20 and
# decisions 3a and 7), made `bound.v1` a restriction that the engine applies itself, which
# names the operations of a submitted project as `address#name` too (decisions 11 and 28),
# and made `shared-host.v1` compare the `kubernetes.io/hostname` labels of the two ends'
# locations, once, when the Conduit is instantiated (decision 8b). The log is
# docs/proposals/ruling-41/log-core.md. The coverage check of the rewrite
# (docs/proposals/ruling-41/log-integration.md, "Coverage check") changed the description of
# `bound.v1`, whose `operations` are compared as names (ACC-029).
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06), applying rows 6, 10 and 36 of
# the coordinator's decisions in docs/proposals/ruling-41/open-decisions.md, said in the
# description of `bound.v1` that an item of `operations` covers the operation of that name in
# every submission at its address, and in a package installed there later. The log is
# docs/proposals/ruling-42/log-core.md.
# The names of ruling 42 (the vocabulary audit's N10; log
# docs/proposals/ruling-42/log-rename-a.md) renamed location to node in this comment and in the
# description of `shared-host.v1`.
# The verification of the fixes of round 5 (docs/proposals/reaudit/round-5/log-fixes.md,
# "Verification") said in the description of `shared-host.v1` that a Conduit an end of which
# runs nothing is not instantiated, under CON-006 (V2-01).
#
# The two Requirement contracts of the core package.
#
# Promises encoded:
#   bound.v1        ACC-029 (a bound names Pools, individual targets and operations, and is a
#                   restriction that the engine applies itself), ACC-006, ACC-012, ACC-030
#                   (what a bound must cover), ACC-022 (the root Interface's Conduit to
#                   `access` applies no bound), CTR-005, CON-028
#   shared-host.v1  PLC-013, CON-006 (the two ends' nodes have one hostname, decided when
#                   the Conduit is instantiated)
#
# A requirement of the core package is applied by the engine itself and is never sent to an
# implementation (CTR-005, CON-018), so no implementation states either in `supports`, and
# `engine` states no `supports` (MAN-012).
#
# A bound is written in the `requirements` map of a Conduit template whose capability is
# `access-control.v1`, like any requirement:
#
#   requirements:
#     bound:
#       requirement: github.com/shrav-k/conduit/core#bound.v1
#       arguments:
#         pools: [shared]
#         targets: [{kind: Agent, name: reviewer-1}]
#         operations: [example.org/files#directory.read.v1]
#
# Each value in `pools` and `targets` is an item of a list whose `items` is a reference
# schema, and so is resolved when the Conduit is instantiated and stored as `{kind, id}`
# (OBJ-021). Each item of `operations` is a qualified reference that names an operation of an
# installed package or of a submitted project whose manifest states that address (ACC-029,
# SUB-008, MAN-015). It is data, compared as a name and never resolved, so a project's own
# template may name the project's operations there by its address (ACC-029, NAM-022), and an
# item covers the operation of that name in every submission at that address and in a
# package installed there once no template or instance holds a submission at it (PKG-029). A
# Conduit to `access` with no bound requirement has no bound and is unlimited, and only an
# actor whose own Conduit to `access` applies no bound may open or close one (ACC-030); a
# Conduit whose bound names nothing covers nothing. A Conduit
# template that applies `bound.v1` more than once is rejected when it is registered, and a
# Conduit that applies it and whose target is not `access` is not instantiated (CON-028).
# Each input of `bound.v1` states `default: []`, so each may be left out without being
# marked optional (OBJ-015), and each default satisfies its input's schema (SCH-019).

apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: bound.v1
  description: >-
    The bound of a right to open: the Pools, the individual targets and the operations of the
    Conduits that the consumer of a Conduit to `access` may open and close. Naming a Pool
    covers the Pool itself and every Resource it owns. The engine applies the bound itself,
    and never sends it. `operations` names operations by qualified reference: of an installed
    package, or of a submitted project, as `address#name` with the address its manifest
    states, even in that project's own documents; each is compared as a name and never
    resolved, so it covers the operation of that name in every submission at that address,
    and in a package installed there later. A Conduit template applies it at most once, and
    only a Conduit to `access` carries it.
spec:
  inputs:
    pools:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#pool-reference.v1}
      default: []
    targets:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#target-reference.v1}
      default: []
    operations:
      schema:
        type: array
        items: {$ref: github.com/shrav-k/conduit/core#qualified-reference.v1}
      default: []
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: shared-host.v1
  description: >-
    The consumer and the target of the Conduit run on one machine: the
    `kubernetes.io/hostname` labels reported for their two nodes are equal. Decided once,
    when the Conduit is instantiated: a Conduit for which they differ, or either is absent, is
    not instantiated, and neither is one an end of which has no placement or is one for which
    no item that is run is selected, since such an end runs on no machine.
spec: {}
