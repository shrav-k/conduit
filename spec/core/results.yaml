# The Schema contracts that the inputs and outputs of the core operations share, and those
# that a status, a diagnostic and a record take their shape from. Each follows an existing
# standard where one gives the shape: SARIF for a diagnostic, Kubernetes `metav1.Condition`
# for a condition and CloudEvents for a record.
#
# Promises relied on:
#   evidence-item.v1  PND-004, ENR-005 (all fields required; fingerprint is 6 to 8 characters)
#   pending-action.v1 PND-008 (enrollment subjects and root-only machine evidence)
#   object.v1      OBJ-003 (a generated name is learned from the result), INS-016 (the nested
#                  instances are made with the instance), LIF-009 (`nested` names the
#                  nested instantiation that made a nested instance, by the instance that
#                  holds it and its name, which `register-replacement.v1` takes)
#   diagnostic.v1  IFC-025 (a result that reports invalid or conflict carries an error
#                  diagnostic whose `ruleId` is the ID of the promise that decided it), OBJ-008,
#                  OBJ-023, PKG-006, LIF-020, SEC-003 (a diagnostic names the place by its JSON
#                  Pointer and holds no part of a secret)
#   handle.v1      CTR-002, IFC-011, IFC-033 (a handle is a property whose schema is this
#                  contract; on the wire it is an opaque string the implementation issued)
#   condition.v1   LIF-011, OBS-002, OBS-003, PRV-009
#   record.v1      REC-002, LIF-013, SEC-015, SEC-018, PRV-024 (no record holds what the
#                  `secrets` or the `identity` of `run.v1` hold)
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: object.v1
  description: >-
    How a result names an object, by its kind, its name and its ID. For an instance that a nested
    instantiation made, `nested` names that nested instantiation: `instance` is the ID of the instance
    that holds it, the consumer of a declared Conduit or the Pool of an entry, and `name` is the name
    of the declared Conduit or of the entry.
spec:
  type: object
  properties:
    kind:
      enum:
      - Interface
      - Agent
      - Resource
      - Pool
      - Fleet
      - Conduit
    name:
      $ref: github.com/shrav-k/conduit/core#name.v1
    id:
      $ref: github.com/shrav-k/conduit/core#id.v1
    nested:
      type: object
      properties:
        instance:
          $ref: github.com/shrav-k/conduit/core#id.v1
        name:
          $ref: github.com/shrav-k/conduit/core#name.v1
      required:
      - instance
      - name
  required:
  - kind
  - name
  - id
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: diagnostic.v1
  description: >-
    One diagnostic, in the shape of a `result` of SARIF 2.1.0 reduced to four members.
    `ruleId` is the ID of the promise the diagnostic is about; `level` is SARIF's, and a
    diagnostic that is why a request reported any reason has the level `error`;
    `message.text` says what is wrong; and each logical location of `locations` gives in
    `fullyQualifiedName` the JSON Pointer of the place it is about. An engine may add what
    else SARIF's `result` holds. For a rejection by a schema, `properties` carries
    `keywordLocation`, and `absoluteKeywordLocation` where known, as JSON Schema 2020-12's
    output format names them (SUB-005). A refusal carries properties.refusal in the form
    refusal.v1 (ACC-056); every reason names its deciding rule (IFC-050).
    For a translated document, `properties.translation` identifies the SCT rule and generated
    document name; SCT-014 maps its location into the authored text.
spec:
  type: object
  properties:
    ruleId:
      type: string
      pattern: '^[A-Z]+-[0-9]{3}$'
    level: {enum: [none, note, warning, error]}
    message:
      type: object
      properties:
        text: {type: string, minLength: 1}
      required: [text]
    locations:
      type: array
      items:
        type: object
        properties:
          logicalLocations:
            type: array
            items:
              type: object
              properties:
                fullyQualifiedName: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
  required: [message]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: handle.v1
  description: >-
    A handle: an opaque string that an implementation issued, which the engine passes back
    unchanged and never interprets. An input or an output of an Operation contract is a handle
    where its property's schema is this contract. A handle permits nothing, and no instance
    holds one.
spec:
  type: string
  minLength: 1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: condition.v1
  description: >-
    One condition of an instance's status, in the shape of Kubernetes `metav1.Condition`:
    `type`, `status`, `reason`, `message` and `lastTransitionTime`, without the optional
    `observedGeneration`, since no object of Conduit has a generation. `lastHeartbeatTime`, the
    time of the last successful observation, as Kubernetes's `NodeCondition` has it, and
    `source`, the context in which the observation was made, a URI-reference that the engine
    names, as it names a record's `source`, are Conduit's additions. A condition never changes
    the lifecycle state.
spec:
  type: object
  properties:
    type:
      type: string
      maxLength: 316
      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?\
        (([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
    status: {enum: ['True', 'False', Unknown]}
    reason:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
    message: {type: string, maxLength: 32768}
    lastTransitionTime: {type: string, format: date-time}
    lastHeartbeatTime: {type: string, format: date-time}
    source: {type: string, format: uri-reference, minLength: 1}
  required: [type, status, reason, message, lastTransitionTime]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: record.v1
  description: >-
    One record, as a CloudEvent of CloudEvents 1.0 whose `data` holds the fields of a record:
    the IDs of the caller, of the Conduit used and of its consumer, where a Conduit was used,
    and of the target; the operation, by its qualified reference; the engine's ID for the
    invocation; the engine's ID for the invocation it serves, where it serves one, such as the
    setup or the retirement that a hook, a read of a secret or a part belongs to, or the
    invocation that an onward request names; the idempotency key, where the caller
    supplied one or the engine gave one to a hook; and how the request ended, by its outcome
    or its reason. A record with no ID of its own, such as that of a provider call or of a
    change that no request asked for itself, holds in `invocation` the invocation within which
    it happened, and no `serving`. A record of `run.v1`, `stop.v1` or `inspect-run.v1` names in
    `subject` the instance whose run it is. The time of the record is the CloudEvent's `time`.
    Each field is present where it applies, and the inputs and outputs of the operation are
    present where the type's `records` keeps them, apart from what the `secrets` and the
    `identity` of `run.v1` hold, which no record holds. An engine names the event's `source`
    and `type`, and may add members. A reason records ruleId; a refusal records refusalTier
    without its tier-2 list (ACC-056). pendingAction holds action IDs, and answer holds the
    recorded action and its full evidence (PND-012). Wire reads withhold code and fingerprint
    values even from answer records (PND-004).
spec:
  type: object
  properties:
    specversion: {const: '1.0'}
    id: {type: string, minLength: 1}
    source: {type: string, format: uri-reference, minLength: 1}
    type: {type: string, minLength: 1}
    time: {type: string, format: date-time}
    subject: {type: string, minLength: 1}
    datacontenttype: {type: string, minLength: 1}
    data:
      type: object
      properties:
        caller: {$ref: github.com/shrav-k/conduit/core#id.v1}
        consumer: {$ref: github.com/shrav-k/conduit/core#id.v1}
        conduit: {$ref: github.com/shrav-k/conduit/core#id.v1}
        target: {$ref: github.com/shrav-k/conduit/core#id.v1}
        operation: {$ref: github.com/shrav-k/conduit/core#qualified-reference.v1}
        invocation: {$ref: github.com/shrav-k/conduit/core#id.v1}
        serving: {$ref: github.com/shrav-k/conduit/core#id.v1}
        idempotencyKey: {type: string, minLength: 1}
        outcome: {enum: [succeeded, failed, unknown]}
        reason: {enum: [refused, invalid, conflict, unavailable]}
        ruleId: {type: string, pattern: '^[A-Z]+-[0-9]{3}$'}
        refusalTier: {enum: [1, 2]}
        pendingAction:
          type: array
          items: {$ref: github.com/shrav-k/conduit/core#id.v1}
        answer:
          $ref: github.com/shrav-k/conduit/core#pending-action.v1
        inputs: {type: object}
        outputs: {type: object}
  required: [specversion, id, source, type, time, data]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: provenance.v1
  description: >-
    The immutable provenance of a Conduit opening (ACC-044). A requested opening keeps the caller,
    sending instance and invocation, and openedThrough lists the authorizing Conduit IDs. A direct
    open lists its authorizing Conduit; a setup part lists every independently sufficient Conduit
    to access in ID order. An engine-made opening states only its cause. Repeats and reconciliation
    preserve the original provenance; a purge never removes it.
spec:
  oneOf:
  - type: object
    properties:
      actor:
        $ref: github.com/shrav-k/conduit/core#id.v1
      sentBy:
        $ref: github.com/shrav-k/conduit/core#id.v1
      invocation:
        $ref: github.com/shrav-k/conduit/core#id.v1
      openedThrough:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - actor
    - sentBy
    - invocation
    - openedThrough
    additionalProperties: false
  - type: object
    properties:
      cause:
        enum:
        - first-start
        - default
    required:
    - cause
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: tombstone.v1
  description: >-
    State retained apart from records until lift.v1 removes it (LIF-040, LIF-041, ACC-053). object
    and both ends of a Conduit keep kind, name and ID. owner, where applicable, is the owning Pool
    or Fleet at closing or retirement, also by kind, name and ID. by is the actor that closed or retired
    it where one exists; provenance retains the opening provenance of a Conduit that was opened. cause
    names the closing or retiring invocation, the end tombstone that caused a closing, or the node
    whose loss closed it under PLC-024. Engine-made objects get no tombstone. within is absent in
    this version, meaning the engine. Visibility and lift coverage use the kept IDs, while matching
    uses names. Every permitted viewer sees the full tombstone, including by and provenance; there
    are no hidden counts. Resource and Agent tombstones require owner of kind Pool and Fleet,
    respectively.
spec:
  type: object
  properties:
    id:
      $ref: github.com/shrav-k/conduit/core#id.v1
    object:
      $ref: github.com/shrav-k/conduit/core#object.v1
    cause:
      type: object
      properties:
        invocation:
          $ref: github.com/shrav-k/conduit/core#id.v1
        tombstone:
          $ref: github.com/shrav-k/conduit/core#id.v1
        node:
          $ref: github.com/shrav-k/conduit/core#object.v1
      oneOf:
      - required:
        - invocation
      - required:
        - tombstone
      - required:
        - node
    time:
      type: string
      format: date-time
    by:
      $ref: github.com/shrav-k/conduit/core#id.v1
    provenance:
      $ref: github.com/shrav-k/conduit/core#provenance.v1
    owner:
      allOf:
      - $ref: github.com/shrav-k/conduit/core#object.v1
      - properties:
          kind:
            enum:
            - Pool
            - Fleet
    within:
      $ref: github.com/shrav-k/conduit/core#id.v1
    consumer:
      $ref: github.com/shrav-k/conduit/core#object.v1
    target:
      $ref: github.com/shrav-k/conduit/core#object.v1
    localName:
      $ref: github.com/shrav-k/conduit/core#name.v1
    capability:
      $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
    operations:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
  required:
  - id
  - object
  - cause
  - time
  allOf:
  - if:
      properties:
        object:
          properties:
            kind:
              const: Resource
    then:
      required:
      - owner
      properties:
        owner:
          properties:
            kind:
              const: Pool
  - if:
      properties:
        object:
          properties:
            kind:
              const: Agent
    then:
      required:
      - owner
      properties:
        owner:
          properties:
            kind:
              const: Fleet
  - if:
      properties:
        object:
          properties:
            kind:
              const: Conduit
    then:
      required:
      - consumer
      - target
      - localName
      - capability
      - operations
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: inventory.v1
  description: >-
    The inventory of an instance other than a Conduit (LIF-013). consumes and targetOf show its Conduits
    in full, with opening provenance wherever one was opened. tombstones holds the Conduit tombstones
    at either end. Whoever may inspect the instance sees this inventory without separate authority
    to inspect each Conduit. No count or position discloses anything omitted. Additional members may
    extend this shape.

    scope is present for Interfaces and Agents and lists each scope target with the consumed Conduits
    that establish it. An Agent lists only its owning Fleet. administrators is present for a Pool
    and lists each administrator with its Conduits. Membership is computed from open Conduits under
    LIF-013, never stored separately.
spec:
  type: object
  properties:
    consumes:
      type: array
      items:
        type: object
        properties:
          conduit:
            $ref: github.com/shrav-k/conduit/core#object.v1
          consumer:
            $ref: github.com/shrav-k/conduit/core#object.v1
          target:
            $ref: github.com/shrav-k/conduit/core#object.v1
          localName:
            $ref: github.com/shrav-k/conduit/core#name.v1
          capability:
            $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          operations:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          state:
            enum:
            - registered
            - ready
            - retired
          provenance:
            $ref: github.com/shrav-k/conduit/core#provenance.v1
        required:
        - conduit
        - consumer
        - target
        - localName
        - capability
        - operations
        - state
    targetOf:
      type: array
      items:
        type: object
        properties:
          conduit:
            $ref: github.com/shrav-k/conduit/core#object.v1
          consumer:
            $ref: github.com/shrav-k/conduit/core#object.v1
          target:
            $ref: github.com/shrav-k/conduit/core#object.v1
          localName:
            $ref: github.com/shrav-k/conduit/core#name.v1
          capability:
            $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          operations:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          state:
            enum:
            - registered
            - ready
            - retired
          provenance:
            $ref: github.com/shrav-k/conduit/core#provenance.v1
        required:
        - conduit
        - consumer
        - target
        - localName
        - capability
        - operations
        - state
    tombstones:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#tombstone.v1
    scope:
      type: array
      items:
        type: object
        properties:
          target:
            $ref: github.com/shrav-k/conduit/core#object.v1
          conduits:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#object.v1
        required:
        - target
        - conduits
    administrators:
      type: array
      items:
        type: object
        properties:
          consumer:
            $ref: github.com/shrav-k/conduit/core#object.v1
          conduits:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#object.v1
        required:
        - consumer
        - conduits
  required:
  - consumes
  - targetOf
  - tombstones
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: trust-domain.v1
  description: >-
    The unique SPIFFE trust domain named at first start, fixed for this engine and recorded as trustDomain
    in the status of system (FST-007). It is the authority of a SPIFFE ID without the spiffe scheme
    or a path: one through 255 lowercase letters, digits, dots, hyphens or underscores. It carries
    no user information, port, query or fragment.
spec:
  type: string
  minLength: 1
  maxLength: 255
  pattern: ^[a-z0-9._-]+$
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: evidence-item.v1
  description: 'Engine evidence (PND-004): all fields required. Codes and fingerprints appear only
    in its own panel and recorded answer, never a wire message, result, notification or request
    record.'
spec:
  type: object
  properties:
    kind:
      enum: [code, fingerprint, attestation, fact]
    value: {}
    where:
      type: string
    proves:
      type: string
  required:
  - kind
  - value
  - where
  - proves
  additionalProperties: false
  oneOf:
  - properties:
      kind: {const: fingerprint}
      value: {type: string, minLength: 6, maxLength: 8}
  - properties:
      kind: {enum: [code, attestation, fact]}

---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: pending-action.v1
  description: An action waiting on a person (PND-001 to PND-004). Answer values and kind are extensible
    strings. Wire views remove code and fingerprint evidence, and disclose no omitted count; complete
    evidence is retained for the panel and answer. Enrollment machine evidence is withheld
    entirely from wire views, even at root (PND-008).
spec:
  type: object
  properties:
    id:
      $ref: github.com/shrav-k/conduit/core#id.v1
    kind:
      type: string
    subject:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#object.v1
      minItems: 1
    evidence:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#evidence-item.v1
    expiry:
      type: string
      format: date-time
    answer:
      type: object
      properties:
        value:
          type: string
        actor:
          $ref: github.com/shrav-k/conduit/core#id.v1
        invocation:
          $ref: github.com/shrav-k/conduit/core#id.v1
        at:
          type: string
          format: date-time
      required:
      - value
      - at
      additionalProperties: false
  required:
  - id
  - kind
  - subject
  - evidence
  - expiry
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: refusal.v1
  description: The two tiers of ACC-056. named echoes only the request, cause states the refusing
    rule. target, exists and conduits are tier-2-only. An unknown tool need not be decomposable
    into an operation; its spelling is preserved in named.tool.
spec:
  type: object
  properties:
    tier:
      enum:
      - 1
      - 2
    operation:
      type: string
    named:
      type: object
      properties:
        tool:
          type: string
        conduit:
          type: string
        objects:
          type: array
          items: {}
      additionalProperties: false
    cause:
      type: string
    target:
      $ref: github.com/shrav-k/conduit/core#object.v1
    exists:
      type: boolean
    conduits:
      type: array
      items:
        type: object
        properties:
          name:
            $ref: github.com/shrav-k/conduit/core#name.v1
          as:
            $ref: github.com/shrav-k/conduit/core#name.v1
          state:
            enum:
            - open
            - registered
            - closed
          operations:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
        required:
        - name
        - as
        - state
        - operations
        additionalProperties: false
  required:
  - tier
  - operation
  - named
  - cause
  additionalProperties: false
  allOf:
  - if:
      properties:
        tier:
          const: 1
    then:
      not:
        anyOf:
        - required:
          - target
        - required:
          - exists
        - required:
          - conduits
