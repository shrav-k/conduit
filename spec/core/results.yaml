# Part of the core package. Accepted by the owner on 2026-11-05 (plan-audit ruling 37); the
# record is docs/proposals/core-and-schemas/README.md. See README.md in this directory.
#
# Two small Schema contracts that the outputs of the core operations share. No promise gives
# either shape; both are choices the record lists (C16), kept as small as the promises
# allow. The full format of a diagnostic and of an inspection result is not settled.
#
# Promises relied on:
#   object.v1      OBJ-003 (a generated name is learned from the result), OBJ-005 (the ID),
#                  INS-016 (the nested instances are made with the instance). `nested` says
#                  which nested instantiation made a nested instance, so that a generated
#                  name can be matched to the declared Conduit, the entry or the component it
#                  belongs to; the member was added for finding 26 of the third reader of
#                  docs/proposals/reaudit/round-2/
#   diagnostic.v1  OBJ-008, NAM-008, PKG-006 (a result lists the diagnostics that did not
#                  prevent it)

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: object.v1
  description: >-
    How a result names an object, by its kind, its name and its ID. For a nested instance,
    and for a component Conduit, `nested` names the nested instantiation that made it.
spec:
  type: object
  properties:
    kind: {enum: [Interface, Agent, Resource, Pool, Conduit]}
    name: {$ref: github.com/shrav-k/conduit/core#name.v1}
    id: {$ref: github.com/shrav-k/conduit/core#id.v1}
    nested:
      type: object
      description: >-
        Present for an instance that a nested instantiation made. `instance` is the ID of the
        instance whose template holds the nested instantiation: the consumer of a declared
        Conduit, or the Pool of an entry. It is absent for a component of a composite that
        was instantiated by its own document. `path` holds the name of the declared Conduit
        or of the entry, and then the name of each component on the way, outermost first.
      properties:
        instance: {$ref: github.com/shrav-k/conduit/core#id.v1}
        path:
          type: array
          items: {$ref: github.com/shrav-k/conduit/core#name.v1}
          minItems: 1
      required: [path]
  required: [kind, name, id]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: diagnostic.v1
  description: >-
    One diagnostic. Only `message` is fixed here; an engine may add what it names, such as the
    document, the key or the promise.
spec:
  type: object
  properties:
    message: {type: string, minLength: 1}
  required: [message]
