# The Schema contracts that the inputs and outputs of the core operations share, and those
# that a status, a diagnostic and a record take their shape from. Each follows an existing
# standard where one gives the shape: SARIF for a diagnostic, Kubernetes `metav1.Condition`
# for a condition and CloudEvents for a record.
#
# Promises relied on:
#   evidence-item.v1  PND-004, ENR-005 (all fields required; fingerprint is 6 to 8 characters)
#   pending-action.v1 PND-008 (enrollment subjects and root-only machine evidence)
#   object.v1      OBJ-003 (a generated name is learned from the result), INS-016 (the nested
#                  instances are made with the instance), LIF-009 (`nested` names the
#                  nested instantiation that made a nested instance, by the instance that
#                  holds it and its name, which `register-replacement.v1` takes)
#   diagnostic.v1  IFC-025 (a result that reports invalid or conflict carries an error
#                  diagnostic whose `ruleId` is the ID of the promise that decided it), OBJ-008,
#                  OBJ-023, PKG-006, LIF-020, SEC-003 (a diagnostic names the place by its JSON
#                  Pointer and holds no part of a secret)
#                  PND-016 (a hold on a report or for want of one carries
#                  `properties.admission`)
#                  IFC-054 (the warning of a warned call carries `properties.admission`)
#   condition.v1   LIF-011, OBS-002, OBS-003, PRV-009
#   record.v1      REC-002, LIF-013, SEC-015, SEC-018, PRV-024 (no record holds what the
#                  `secrets` or the `identity` of `run.v1` hold)
#                  IFC-054 (the end record of a login's admission hook holds its report)
#                  PND-016 (an admission ask names its triggering request in `causedBy`)
#                  IFC-054 (the dispatch record of a warned call holds its warning in
#                  `admissionWarning`)
#   usage.v1       IFC-051 (what one call's model work used, by client and model)
#   limit-report.v1 IFC-052 (the usage limits one call's client reported)
#   limit-status.v1 IFC-053 (the newest usage limits an instance shows)
#   admission-report.v1 IFC-054 (a login's answer to whether model work may start on it now)
#   admission-hold.v1 PND-016, IFC-054 (why a call that starts model work on a guarded
#                  login was held, or what warned it)
#   admission-status.v1 IFC-054 (a login's admission state in a status, or that its calls
#                  are not checked)
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: object.v1
  description: >-
    How a result names an object, by its kind, its name and its ID. For an instance that a nested
    instantiation made, `nested` names that nested instantiation: `instance` is the ID of the instance
    that holds it, the consumer of a declared Conduit or the Pool of an entry, and `name` is the name
    of the declared Conduit or of the entry.
spec:
  type: object
  properties:
    kind:
      enum:
      - Interface
      - Agent
      - Resource
      - Pool
      - Fleet
      - Conduit
    name:
      $ref: github.com/shrav-k/conduit/core#name.v1
    id:
      $ref: github.com/shrav-k/conduit/core#id.v1
    nested:
      type: object
      properties:
        instance:
          $ref: github.com/shrav-k/conduit/core#id.v1
        name:
          $ref: github.com/shrav-k/conduit/core#name.v1
      required:
      - instance
      - name
  required:
  - kind
  - name
  - id
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: diagnostic.v1
  description: >-
    One diagnostic, in the shape of a `result` of SARIF 2.1.0 reduced to four members.
    `ruleId` is the ID of the promise the diagnostic is about; `level` is SARIF's, and a
    diagnostic that is why a request reported any reason has the level `error`;
    `message.text` says what is wrong; and each logical location of `locations` gives in
    `fullyQualifiedName` the JSON Pointer of the place it is about. An engine may add what
    else SARIF's `result` holds. For a rejection by a schema, `properties` carries
    `keywordLocation`, and `absoluteKeywordLocation` where known, as JSON Schema 2020-12's
    output format names them (SUB-005). A refusal carries properties.refusal in the form
    refusal.v1 (ACC-056); every reason names its deciding rule (IFC-050).
    A hold under PND-016 on a report or for want of one carries `properties.admission` in the
    form `admission-hold.v1`. So does the warning of IFC-054, of an attempt dispatched on a
    report that warns, whose `level` is `warning` and whose `properties.admission` has
    `dispatched` true. A request held by its dispatch check or cancelled while waiting
    under PND-016 carries no `properties.admission`.
    For a translated document, `properties.translation` identifies the SCT rule and generated
    document name; SCT-014 maps its location into the authored text.
spec:
  type: object
  properties:
    ruleId:
      type: string
      pattern: '^[A-Z]+-[0-9]{3}$'
    level: {enum: [none, note, warning, error]}
    message:
      type: object
      properties:
        text: {type: string, minLength: 1}
      required: [text]
    locations:
      type: array
      items:
        type: object
        properties:
          logicalLocations:
            type: array
            items:
              type: object
              properties:
                fullyQualifiedName: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
  required: [message]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: condition.v1
  description: >-
    One condition of an instance's status, in the shape of Kubernetes `metav1.Condition`:
    `type`, `status`, `reason`, `message` and `lastTransitionTime`, without the optional
    `observedGeneration`, since no object of Conduit has a generation. `lastHeartbeatTime`, the
    time of the last successful observation, as Kubernetes's `NodeCondition` has it, and
    `source`, the context in which the observation was made, a URI-reference that the engine
    names, as it names a record's `source`, are Conduit's additions. A condition never changes
    the lifecycle state.
spec:
  type: object
  properties:
    type:
      type: string
      maxLength: 316
      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?\
        (([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
    status: {enum: ['True', 'False', Unknown]}
    reason:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
    message: {type: string, maxLength: 32768}
    lastTransitionTime: {type: string, format: date-time}
    lastHeartbeatTime: {type: string, format: date-time}
    source: {type: string, format: uri-reference, minLength: 1}
  required: [type, status, reason, message, lastTransitionTime]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: record.v1
  description: >-
    One record, as a CloudEvent of CloudEvents 1.0 whose `data` holds the fields of a record:
    the IDs of the caller, of the Conduit used and of its consumer, where a Conduit was used,
    and of the target; the operation, by its qualified reference; the engine's ID for the
    invocation; the engine's ID for the invocation it serves, where it serves one, such as the
    setup or the retirement that a hook, a read of a secret or a part belongs to, or the
    invocation that an onward request names; the idempotency key, where the caller supplied one
    or the engine gave one to a hook; and how the request ended, by its outcome or its reason.
    A record with no ID of its own, such as that of a provider call or of a change that no
    request asked for itself, holds in `invocation` the invocation within which it happened,
    and no `serving`. A record of `run.v1`, `stop.v1` or `inspect-run.v1` names in `subject`
    the instance whose run it is. The time of the record is the CloudEvent's `time`. Each field
    is present where it applies, and the inputs and outputs of the operation are present where
    the type's `records` keeps them, apart from what the `secrets` and the `identity` of
    `run.v1` hold, which no record holds. An engine names the event's `source` and `type`, and
    may add members. A reason records ruleId; a refusal records refusalTier without its tier-2
    list (ACC-056). pendingAction holds action IDs, and answer holds the recorded action and
    its full evidence (PND-012). Wire reads withhold code and fingerprint values even from
    answer records (PND-004). An invocation's end record holds in usage its result's member,
    and in usageDropped the warning that dropped one (IFC-051). It also holds its result's
    limits member in `limits`, or the warning that dropped it in `limitsDropped` (IFC-052). The
    end record of a call of an operation marked `startsModelWork: true` whose target is an
    Agent names in `fleet` the Agent's owning Fleet and, where the Agent's Type states
    `loginResource`, in `loginResource` the login Resource its login place referred to when the
    call was made (REC-002). The end record of a login's `admission-hook.v1` call that
    succeeded holds its report in `admission` (IFC-054). Each record of an admission ask also
    names in `causedBy` the engine's ID for the request whose wait started it (PND-016). This
    optional member applies to the ask's records even if that request is cancelled before
    dispatch; it is distinct from `serving`. The record of each dispatch that PND-016 decided
    on a report that warns holds its warning in `admissionWarning` (IFC-054).
spec:
  type: object
  properties:
    specversion: {const: '1.0'}
    id: {type: string, minLength: 1}
    source: {type: string, format: uri-reference, minLength: 1}
    type: {type: string, minLength: 1}
    time: {type: string, format: date-time}
    subject: {type: string, minLength: 1}
    datacontenttype: {type: string, minLength: 1}
    data:
      type: object
      properties:
        caller: {$ref: github.com/shrav-k/conduit/core#id.v1}
        causedBy: {$ref: github.com/shrav-k/conduit/core#id.v1}
        consumer: {$ref: github.com/shrav-k/conduit/core#id.v1}
        conduit: {$ref: github.com/shrav-k/conduit/core#id.v1}
        target: {$ref: github.com/shrav-k/conduit/core#id.v1}
        fleet: {$ref: github.com/shrav-k/conduit/core#id.v1}
        loginResource: {$ref: github.com/shrav-k/conduit/core#id.v1}
        operation: {$ref: github.com/shrav-k/conduit/core#qualified-reference.v1}
        invocation: {$ref: github.com/shrav-k/conduit/core#id.v1}
        serving: {$ref: github.com/shrav-k/conduit/core#id.v1}
        idempotencyKey: {type: string, minLength: 1}
        outcome: {enum: [succeeded, failed, unknown]}
        reason: {enum: [refused, invalid, conflict, unavailable]}
        ruleId: {type: string, pattern: '^[A-Z]+-[0-9]{3}$'}
        refusalTier: {enum: [1, 2]}
        pendingAction:
          type: array
          items: {$ref: github.com/shrav-k/conduit/core#id.v1}
        answer:
          $ref: github.com/shrav-k/conduit/core#pending-action.v1
        inputs: {type: object}
        outputs: {type: object}
        usage: {$ref: github.com/shrav-k/conduit/core#usage.v1}
        usageDropped: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
        limits: {$ref: github.com/shrav-k/conduit/core#limit-report.v1}
        limitsDropped: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
        admission: {$ref: github.com/shrav-k/conduit/core#admission-report.v1}
        admissionWarning: {$ref: github.com/shrav-k/conduit/core#diagnostic.v1}
  required: [specversion, id, source, type, time, data]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: usage.v1
  description: >-
    What one call's model work used, as a result reports it under
    `io.github.shrav-k.conduit/usage` and the record of its end keeps it (IFC-051): the
    client and its version, and, keyed by each model's name as the client gives it, or as
    the implementation asked for it where the client names none, its tokens: `input`, every
    input token, cached ones among them; `cachedInput`, those of `input` read from the
    client's cache; `output`, every output token, reasoning among them; and `reasoning`,
    those of `output` spent on reasoning; `cachedInput` and `reasoning` where the client
    reports them. A reader adds neither part to its whole.
spec:
  type: object
  properties:
    client:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        version: {type: string, minLength: 1, maxLength: 256}
      required: [name, version]
      additionalProperties: false
    models:
      type: object
      minProperties: 1
      maxProperties: 16
      propertyNames: {minLength: 1, maxLength: 256}
      additionalProperties:
        type: object
        properties:
          input: {type: integer, minimum: 0}
          cachedInput: {type: integer, minimum: 0}
          output: {type: integer, minimum: 0}
          reasoning: {type: integer, minimum: 0}
        required: [input, output]
        additionalProperties: false
  required: [client, models]
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: limit-report.v1
  description: >-
    The usage limits one call's client reported, as a result carries them under
    `io.github.shrav-k.conduit/limits` and the record of its end keeps them (IFC-052).
    `client` gives the client and its version, `method` gives the client's call or
    event, and `observedAt` gives the time of the report. `usageAllowed` says whether
    the vendor allows included usage, or is null where the report says neither.
    `paidUsage` describes usage beyond the included usage; it holds no amount.
    `possible` says whether the client reports that usage beyond the included usage
    would be billed rather than refused. `inUse` says whether the client reports that
    usage beyond the included usage is being billed now. Each is true, false or null.
    `resetsAt` gives the client's reported time for the next change to the paid-usage
    state described by `possible` and `inUse`, or null. Each value maps only a client
    field with that meaning, and one that no field gives is null, never inferred.
    A package whose client gives none of these fields leaves `paidUsage` out; if the
    client gives at least one, the package includes all three members. An explicitly
    null client field maps to null and counts as a field given.
    Each window gives its package's fixed ID, its length in minutes
    or null, its used percentage or null, its reset time or null, its state and the
    model it limits or null. `windowsOmitted` counts the windows the client gave that
    the package has no fixed ID for, which `windows` leaves out. A report with no
    windows gives the reason in `noWindows` or, where it left out every window the
    client gave, `windowsOmitted`, never both.
spec:
  type: object
  properties:
    client:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        version: {type: string, minLength: 1, maxLength: 256}
      required: [name, version]
      additionalProperties: false
    method: {type: string, minLength: 1, maxLength: 128}
    observedAt: {type: string, format: date-time}
    usageAllowed: {type: [boolean, 'null']}
    paidUsage:
      type: object
      properties:
        possible: {type: [boolean, 'null']}
        inUse: {type: [boolean, 'null']}
        resetsAt: {type: [string, 'null'], format: date-time}
      required: [possible, inUse, resetsAt]
      additionalProperties: false
    noWindows: {enum: [no-event, read-failed, read-timed-out]}
    windowsOmitted: {type: integer, minimum: 1, maximum: 64}
    windows:
      type: array
      maxItems: 16
      items:
        type: object
        properties:
          id: {type: string, pattern: '^[a-z]{1,64}/[a-z0-9][a-z0-9-]{0,63}(/[a-z0-9][a-z0-9-]{0,63})?$'}
          windowMinutes: {type: [number, 'null'], minimum: 1}
          usedPercent: {type: [number, 'null'], minimum: 0}
          resetsAt: {type: [string, 'null'], format: date-time}
          state: {enum: [allowed, warning, reached]}
          scope: {type: [string, 'null'], minLength: 1}
        required: [id, windowMinutes, usedPercent, resetsAt, state, scope]
        additionalProperties: false
  required: [client, method, observedAt, usageAllowed, windows]
  additionalProperties: false
  oneOf:
  - properties:
      windows: {maxItems: 0}
    oneOf:
    - required: [noWindows]
    - required: [windowsOmitted]
  - properties:
      windows: {minItems: 1}
    not: {required: [noWindows]}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: limit-status.v1
  description: >-
    The limits in an Agent's or a login Resource's status (IFC-053). An observed status
    gives the newest report in `newest`, with its time, record source, instance,
    invocation, whether the vendor allows included usage, and any paid usage, reason it
    named no windows and count of windows left out that it gave. Each window gives its
    newest reported values, time, record source, instance and invocation. The windows
    are listed by `id`, in ascending order of Unicode code points. A window's state
    reads `unknown` at or after its reset time. `signals` gives, for `usageAllowed` and
    paid usage's `possible` and `inUse`, the newest value other than null a report gave,
    with its time, record source, instance and invocation, and for paid usage that
    report's reset time; a signal no report gave other than null is absent, and so is
    `signals` where none was given. A window keeps the newest member's values whole,
    so a null `usedPercent` there replaces an earlier percentage; only `signals` keep
    their last value other than null. A status with no report is `unknown`, with no
    windows, no `newest` and no `signals`.
spec:
  $defs:
    instance:
      $ref: github.com/shrav-k/conduit/core#object.v1
      properties:
        kind: true
        name: true
        id: true
        nested:
          properties:
            instance: true
            name: true
          additionalProperties: false
      additionalProperties: false
    signal:
      type: object
      properties:
        value: {type: boolean}
        observedAt: {type: string, format: date-time}
        source: {type: string, format: uri-reference, minLength: 1}
        instance: {$ref: '#/$defs/instance'}
        invocation: {$ref: github.com/shrav-k/conduit/core#id.v1}
      required: [value, observedAt, source, instance, invocation]
      additionalProperties: false
    paidSignal:
      type: object
      properties:
        value: {type: boolean}
        resetsAt: {type: [string, 'null'], format: date-time}
        observedAt: {type: string, format: date-time}
        source: {type: string, format: uri-reference, minLength: 1}
        instance: {$ref: '#/$defs/instance'}
        invocation: {$ref: github.com/shrav-k/conduit/core#id.v1}
      required: [value, resetsAt, observedAt, source, instance, invocation]
      additionalProperties: false
  type: object
  properties:
    state: {enum: [observed, unknown]}
    newest:
      type: object
      properties:
        observedAt: {type: string, format: date-time}
        source: {type: string, format: uri-reference, minLength: 1}
        instance: {$ref: '#/$defs/instance'}
        invocation: {$ref: github.com/shrav-k/conduit/core#id.v1}
        usageAllowed: {type: [boolean, 'null']}
        paidUsage:
          type: object
          properties:
            possible: {type: [boolean, 'null']}
            inUse: {type: [boolean, 'null']}
            resetsAt: {type: [string, 'null'], format: date-time}
          required: [possible, inUse, resetsAt]
          additionalProperties: false
        noWindows: {enum: [no-event, read-failed, read-timed-out]}
        windowsOmitted: {type: integer, minimum: 1, maximum: 64}
      required: [observedAt, source, instance, invocation, usageAllowed]
      additionalProperties: false
    signals:
      type: object
      properties:
        usageAllowed: {$ref: '#/$defs/signal'}
        paidUsage:
          type: object
          properties:
            possible: {$ref: '#/$defs/paidSignal'}
            inUse: {$ref: '#/$defs/paidSignal'}
          minProperties: 1
          additionalProperties: false
      minProperties: 1
      additionalProperties: false
    windows:
      type: array
      items:
        type: object
        properties:
          id: {type: string, pattern: '^[a-z]{1,64}/[a-z0-9][a-z0-9-]{0,63}(/[a-z0-9][a-z0-9-]{0,63})?$'}
          windowMinutes: {type: [number, 'null'], minimum: 1}
          usedPercent: {type: [number, 'null'], minimum: 0}
          resetsAt: {type: [string, 'null'], format: date-time}
          state: {enum: [allowed, warning, reached, unknown]}
          scope: {type: [string, 'null'], minLength: 1}
          observedAt: {type: string, format: date-time}
          source: {type: string, format: uri-reference, minLength: 1}
          instance: {$ref: '#/$defs/instance'}
          invocation: {$ref: github.com/shrav-k/conduit/core#id.v1}
        required: [id, windowMinutes, usedPercent, resetsAt, state, scope, observedAt, source,
                   instance, invocation]
        additionalProperties: false
  required: [state, windows]
  additionalProperties: false
  if:
    properties:
      state: {const: observed}
  then:
    required: [newest]
  else:
    properties:
      windows: {maxItems: 0}
    not:
      anyOf:
      - required: [newest]
      - required: [signals]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: admission-report.v1
  description: >-
    A login's answer to whether model work may start on it now, which its
    `admission-hook.v1` gives and the engine keeps (IFC-054). `admit` gives the answer
    and `reason` why. The reasons mean: `within-levers`, admitted within all applicable
    levers; `warning`, admitted with a window near a package lever's percentage
    threshold; `cannot-tell`, the observation cannot decide, so `whenUnknown` decides;
    `included-spent`, included usage is not allowed and `paidUsage` refuses;
    `paid-in-use`, paid usage is in use and `paidUsage` is `refuse`; `paid-possible`,
    paid usage is possible and `paidUsage` is `refuse-if-possible`;
    `paid-from-first-token`, `billing` declares that kind of login and `paidUsage`
    refuses; `threshold`, refused at a package lever's window-percentage threshold.
    Here `paidUsage` refuses means `refuse` or `refuse-if-possible`. `lever` names
    `paidUsage` for `included-spent`, `paid-in-use` and `paid-possible`, `billing` for
    `paid-from-first-token`, and `whenUnknown` for `cannot-tell`. For `warning` and
    `threshold`, `window` and `lever` name the window and the package's own lever.
    The `cannotTell` words mean: `never-observed`, `limits` is `unknown`;
    `not-reported`, the client gave no signal needed to decide; `stale`, the needed
    observation is no longer current; `read-failed`, the client's read failed;
    `read-timed-out`, the client's read timed out.
    `lever` names the lever that decided, by its pointer at or under
    the Type's levers place and its value, and is null for `within-levers`; `window` the
    window that decided, by its package's fixed ID, used percentage and reset;
    `paidUsage` the paid usage read, each value null where no field gave it;
    `cannotTell` why it cannot tell, for `cannot-tell` alone. `lifts` says how a refusal
    ends: `at-time`, when its validity ends; `newer-report`, once a newer observation
    says otherwise; `lever-change`, only once the levers change. `observedAt` and
    `source` give the observation decided on and the client's call or event read.
    `validForSeconds` says how long the engine trusts it from the time it keeps it, and
    `singleUse` that it admits one call alone. It holds no amount.
spec:
  $defs:
    when: {type: [string, 'null'], format: date-time}
  type: object
  properties:
    admit: {type: boolean}
    reason: {enum: [within-levers, warning, cannot-tell, included-spent, paid-in-use,
                    paid-possible, paid-from-first-token, threshold]}
    lever:
      type: [object, 'null']
      properties:
        pointer: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
        value: {type: [string, number, boolean]}
      required: [pointer, value]
      additionalProperties: false
    window:
      type: [object, 'null']
      properties:
        id: {type: string, pattern: '^[a-z]{1,64}/[a-z0-9][a-z0-9-]{0,63}(/[a-z0-9][a-z0-9-]{0,63})?$'}
        usedPercent: {type: [number, 'null'], minimum: 0}
        resetsAt: {$ref: '#/$defs/when'}
      required: [id, usedPercent, resetsAt]
      additionalProperties: false
    paidUsage:
      type: object
      properties:
        possible: {type: [boolean, 'null']}
        inUse: {type: [boolean, 'null']}
        resetsAt: {type: [string, 'null'], format: date-time}
      required: [possible, inUse, resetsAt]
      additionalProperties: false
    cannotTell: {enum: [never-observed, not-reported, stale, read-failed, read-timed-out, null]}
    lifts: {enum: [at-time, newer-report, lever-change, null]}
    observedAt: {$ref: '#/$defs/when'}
    source:
      type: object
      properties:
        client:
          type: [object, 'null']
          properties:
            name: {type: string, minLength: 1, maxLength: 256}
            version: {type: string, minLength: 1, maxLength: 256}
          required: [name, version]
          additionalProperties: false
        method: {type: string, minLength: 1, maxLength: 128}
      required: [client, method]
      additionalProperties: false
    validForSeconds: {type: integer, minimum: 0, maximum: 604800}
    singleUse: {type: boolean}
  required: [admit, reason, lever, window, paidUsage, cannotTell, lifts, observedAt, source,
             validForSeconds, singleUse]
  additionalProperties: false
  allOf:
  - if:
      properties:
        admit: {const: true}
    then:
      properties:
        reason: {enum: [within-levers, warning, cannot-tell]}
        lifts: {type: 'null'}
    else:
      properties:
        reason: {not: {enum: [within-levers, warning]}}
        lifts: {type: string}
  - if:
      properties:
        reason: {const: within-levers}
    then:
      properties:
        lever: {type: 'null'}
    else:
      properties:
        lever: {type: object}
  - if:
      properties:
        reason: {enum: [threshold, warning]}
    then:
      properties:
        window: {type: object}
  - if:
      properties:
        reason: {const: cannot-tell}
    then:
      properties:
        cannotTell: {type: string}
    else:
      properties:
        cannotTell: {type: 'null'}
  - if:
      properties:
        singleUse: {const: true}
    then:
      properties:
        admit: {const: true}
        validForSeconds: {const: 0}
    else:
      properties:
        validForSeconds: {minimum: 1}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: admission-hold.v1
  description: >-
    Why a call that starts model work on an Agent of a guarded login was held (PND-016),
    or what warned a call that was dispatched (IFC-054).
    With `dispatched` true, as the warning of IFC-054 carries it, it describes the
    report that admitted such a call with `warning` or `cannot-tell`. `login` names the
    login. `report` is the report that decided, null where no report of the ask decided
    and where a single-use report admitted another call. `reportInvocation` is the ask
    that gave the report, or that gave none, null where the caller may not inspect the
    login or no ask was dispatched. `noReport` says why no report of the ask decided: it
    `failed`, ended `unknown`, passed DL21 (`deadline`) or was `not-dispatched`.
    `singleUse` is the call a single-use report admitted, null where the caller may not
    inspect its Agent. `lifts` describes the hold's cause and how to try again: as the
    report's, `at-time` where no report of the ask decided, or `after-call` where
    another call took a single-use report and spent it at once; it is null where the
    call was dispatched. For `after-call`, a request sent again need not wait for the
    admitted call to end: PND-016 decides it afresh, and where no report is current and
    no other hold applies, it waits for the login's ask. The next ask receives the spent
    report as `previous`, unless the engine has kept a newer report (IFC-054). For other
    holds, `retryAt` is when the hold's cause lapses of itself: as the report's validity
    ends, or as 60 seconds pass after an ask that gave no report. For `after-call`,
    `retryAt` is the ask's end plus 60 seconds: a retry time, not an earliest permitted
    retry or a guarantee that the admitted call has ended. It is null for `lever-change`
    and where the call was dispatched. `levers` gives the login's Type, its levers place
    and its control (CTR-015). It holds no amount.
spec:
  type: object
  properties:
    login:
      $ref: github.com/shrav-k/conduit/core#object.v1
      properties:
        kind: {const: Resource}
    dispatched: {type: boolean}
    report:
      anyOf:
      - {$ref: github.com/shrav-k/conduit/core#admission-report.v1}
      - {type: 'null'}
    reportInvocation:
      anyOf:
      - {$ref: github.com/shrav-k/conduit/core#id.v1}
      - {type: 'null'}
    noReport: {enum: [failed, unknown, deadline, not-dispatched, null]}
    singleUse:
      anyOf:
      - {$ref: github.com/shrav-k/conduit/core#id.v1}
      - {type: 'null'}
    lifts: {enum: [at-time, newer-report, lever-change, after-call, null]}
    retryAt: {type: [string, 'null'], format: date-time}
    levers:
      type: object
      properties:
        type: {$ref: github.com/shrav-k/conduit/core#qualified-reference.v1}
        control: {$ref: github.com/shrav-k/conduit/core#qualified-reference.v1}
        pointer: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
      required:
      - type
      - control
      - pointer
      additionalProperties: false
  required:
  - login
  - dispatched
  - report
  - reportInvocation
  - noReport
  - singleUse
  - lifts
  - retryAt
  - levers
  additionalProperties: false
  allOf:
  - if:
      properties:
        dispatched: {const: true}
    then:
      properties:
        report:
          type: object
          properties:
            admit: {const: true}
            reason: {enum: [warning, cannot-tell]}
        noReport: {type: 'null'}
        singleUse: {type: 'null'}
        lifts: {type: 'null'}
        retryAt: {type: 'null'}
    else:
      properties:
        lifts: {type: string}
  - if:
      properties:
        noReport: {type: string}
    then:
      properties:
        report: {type: 'null'}
        singleUse: {type: 'null'}
        lifts: {const: at-time}
  - if:
      properties:
        lifts: {const: after-call}
    then:
      properties:
        report: {type: 'null'}
        noReport: {type: 'null'}
  - if:
      properties:
        singleUse: {type: string}
    then:
      properties:
        lifts: {const: after-call}
  - if:
      properties:
        lifts: {const: lever-change}
    then:
      properties:
        retryAt: {type: 'null'}
    else:
      if:
        properties:
          lifts: {enum: [at-time, newer-report, after-call]}
      then:
        properties:
          retryAt: {type: string}
  - if:
      properties:
        dispatched: {const: false}
        noReport: {type: 'null'}
        lifts:
          not: {const: after-call}
    then:
      properties:
        report:
          type: object
          properties:
            admit: {const: false}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: admission-status.v1
  description: >-
    A login's admission state, as the status of a Resource whose Type states `signIn`
    shows it, and as that of an Agent whose login place refers to one shows its login's
    (IFC-054). `checked` false says that the login's Type states no `admission`, so
    calls on it are not checked, and nothing else is given. `checked` true says that the
    Type states `admission`, so PND-016 checks its calls. Then `report` is the newest
    report the engine kept, spent or ended ones included, or null where it kept none;
    `invocation` the call that gave it; `keptAt` its keep time; `validUntil` the end of
    its validity, null for a single-use report; `state` is `current` when the report may
    decide a call, `ended` when it may no longer decide one, or `none` when no report
    was kept. `ended` is null unless `state` is `ended`; otherwise it names the end:
    `valid-for-ended`, its `validForSeconds` passed; `single-use`, it admitted its one
    call; `newer-limits`, a newer limits member was kept (IFC-052); or `levers-changed`,
    a control stored a value at or under the Type's levers place. `asking` is the ask in
    progress (PND-016), or null where none is in progress. `noReport` is null unless
    PND-016 holds every call after an ask that gave no report; otherwise it gives that
    ask's `invocation`, null where it was not dispatched, its `cause`, and `until`, when
    that hold ends. The `cause` is `failed` when the ask failed, `unknown` when it ended
    with no known outcome, `deadline` when it passed DL21, or `not-dispatched` when it
    could not be dispatched. In an Agent's status each invocation is null where the
    inspecting actor may not inspect the login. It holds no amount.
spec:
  type: object
  properties:
    checked: {type: boolean}
    report:
      anyOf:
      - {$ref: github.com/shrav-k/conduit/core#admission-report.v1}
      - {type: 'null'}
    invocation:
      anyOf:
      - {$ref: github.com/shrav-k/conduit/core#id.v1}
      - {type: 'null'}
    keptAt: {type: [string, 'null'], format: date-time}
    validUntil: {type: [string, 'null'], format: date-time}
    state: {enum: [current, ended, none]}
    ended: {enum: [valid-for-ended, single-use, newer-limits, levers-changed, null]}
    asking:
      anyOf:
      - {$ref: github.com/shrav-k/conduit/core#id.v1}
      - {type: 'null'}
    noReport:
      type:
      - object
      - 'null'
      properties:
        invocation:
          anyOf:
          - {$ref: github.com/shrav-k/conduit/core#id.v1}
          - {type: 'null'}
        cause: {enum: [failed, unknown, deadline, not-dispatched]}
        until: {type: string, format: date-time}
      required:
      - invocation
      - cause
      - until
      additionalProperties: false
  required:
  - checked
  additionalProperties: false
  if:
    properties:
      checked: {const: true}
  then:
    required:
    - report
    - invocation
    - keptAt
    - validUntil
    - state
    - ended
    - asking
    - noReport
    allOf:
    - if:
        properties:
          state: {const: none}
      then:
        properties:
          report: {type: 'null'}
          invocation: {type: 'null'}
          keptAt: {type: 'null'}
          validUntil: {type: 'null'}
          ended: {type: 'null'}
    - if:
        properties:
          state: {enum: [current, ended]}
      then:
        properties:
          report: {type: object}
          keptAt: {type: string}
    - if:
        properties:
          state: {const: ended}
      then:
        properties:
          ended: {type: string}
      else:
        properties:
          ended: {type: 'null'}
  else:
    maxProperties: 1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: provenance.v1
  description: >-
    The immutable provenance of a Conduit opening (ACC-044). A requested opening keeps the caller,
    sending instance and invocation, and openedThrough lists the authorizing Conduit IDs. A direct
    open lists its authorizing Conduit; a setup part lists every independently sufficient Conduit
    to access in ID order. An engine-made opening states only its cause. Repeats preserve the
    original provenance, and a reconciliation of an open gives none, since it opens nothing
    (ACC-044); a purge never removes it.
spec:
  oneOf:
  - type: object
    properties:
      actor:
        $ref: github.com/shrav-k/conduit/core#id.v1
      sentBy:
        $ref: github.com/shrav-k/conduit/core#id.v1
      invocation:
        $ref: github.com/shrav-k/conduit/core#id.v1
      openedThrough:
        type: array
        items:
          $ref: github.com/shrav-k/conduit/core#id.v1
    required:
    - actor
    - sentBy
    - invocation
    - openedThrough
    additionalProperties: false
  - type: object
    properties:
      cause:
        enum:
        - first-start
        - default
    required:
    - cause
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: tombstone.v1
  description: >-
    State retained apart from records until lift.v1 removes it (LIF-040, LIF-041, ACC-053). object
    and both ends of a Conduit keep kind, name and ID. owner, where applicable, is the owning Pool
    or Fleet at closing or retirement, also by kind, name and ID. by is the actor that closed or retired
    it where one exists; provenance retains the opening provenance of a Conduit that was opened. cause
    names the closing or retiring invocation, the end tombstone that caused a closing, or the node
    whose loss closed it under PLC-024. Engine-made objects get no tombstone. within is absent in
    this version, meaning the engine. Visibility and lift coverage use the kept IDs, while matching
    uses names. Every permitted viewer sees the full tombstone, including by and provenance; there
    are no hidden counts. Resource and Agent tombstones require owner of kind Pool and Fleet,
    respectively.
spec:
  type: object
  properties:
    id:
      $ref: github.com/shrav-k/conduit/core#id.v1
    object:
      $ref: github.com/shrav-k/conduit/core#object.v1
    cause:
      type: object
      properties:
        invocation:
          $ref: github.com/shrav-k/conduit/core#id.v1
        tombstone:
          $ref: github.com/shrav-k/conduit/core#id.v1
        node:
          $ref: github.com/shrav-k/conduit/core#object.v1
      oneOf:
      - required:
        - invocation
      - required:
        - tombstone
      - required:
        - node
    time:
      type: string
      format: date-time
    by:
      $ref: github.com/shrav-k/conduit/core#id.v1
    provenance:
      $ref: github.com/shrav-k/conduit/core#provenance.v1
    owner:
      allOf:
      - $ref: github.com/shrav-k/conduit/core#object.v1
      - properties:
          kind:
            enum:
            - Pool
            - Fleet
    within:
      $ref: github.com/shrav-k/conduit/core#id.v1
    consumer:
      $ref: github.com/shrav-k/conduit/core#object.v1
    target:
      $ref: github.com/shrav-k/conduit/core#object.v1
    localName:
      $ref: github.com/shrav-k/conduit/core#name.v1
    capability:
      $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
    operations:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
  required:
  - id
  - object
  - cause
  - time
  allOf:
  - if:
      properties:
        object:
          properties:
            kind:
              const: Resource
    then:
      required:
      - owner
      properties:
        owner:
          properties:
            kind:
              const: Pool
  - if:
      properties:
        object:
          properties:
            kind:
              const: Agent
    then:
      required:
      - owner
      properties:
        owner:
          properties:
            kind:
              const: Fleet
  - if:
      properties:
        object:
          properties:
            kind:
              const: Conduit
    then:
      required:
      - consumer
      - target
      - localName
      - capability
      - operations
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: inventory.v1
  description: >-
    The inventory of an instance other than a Conduit (LIF-013). consumes and targetOf show its Conduits
    in full, with opening provenance wherever one was opened. tombstones holds the Conduit tombstones
    at either end. Whoever may inspect the instance sees this inventory without separate authority
    to inspect each Conduit. No count or position discloses anything omitted. Additional members may
    extend this shape.

    scope is present for Interfaces and Agents and lists each scope target with the consumed Conduits
    that establish it. An Agent lists only its owning Fleet. administrators is present for a Pool
    and lists each administrator with its Conduits. Membership is computed from open Conduits under
    LIF-013, never stored separately. ownTools is present for every Agent and no other instance:
    stated says whether its Type states toolsDirectory; pointer and directoryNamed are present
    exactly when stated is true. directoryNamed says whether the resolved value is a string;
    directory and enforcement are present exactly when directoryNamed is true, with enforcement
    equal to neither: the reach is neither enforced nor mediated in this version, whatever the
    runtime provider. A null value gives none of the own tools a string turns on; what remains
    belongs to the Type's contract and is not listed. An open consumed Conduit targeting an Agent
    and listing an operation marked startsModelWork: true carries targetOwnTools, the target's
    ownTools, for every consumer including root. It shows one hop of own tools reach only and
    discloses the pointer and that value of the target's configuration, no other part (CTR-014,
    LIF-013).
spec:
  type: object
  $defs:
    ownTools:
      type: object
      properties:
        stated:
          type: boolean
        pointer:
          $ref: github.com/shrav-k/conduit/core#pointer.v1
        directoryNamed:
          type: boolean
        directory:
          type: string
        enforcement:
          const: neither
      required:
      - stated
  properties:
    ownTools:
      $ref: '#/$defs/ownTools'
    consumes:
      type: array
      items:
        type: object
        properties:
          conduit:
            $ref: github.com/shrav-k/conduit/core#object.v1
          consumer:
            $ref: github.com/shrav-k/conduit/core#object.v1
          target:
            $ref: github.com/shrav-k/conduit/core#object.v1
          localName:
            $ref: github.com/shrav-k/conduit/core#name.v1
          capability:
            $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          operations:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          state:
            enum:
            - registered
            - ready
            - retired
          targetOwnTools:
            $ref: '#/$defs/ownTools'
          provenance:
            $ref: github.com/shrav-k/conduit/core#provenance.v1
        required:
        - conduit
        - consumer
        - target
        - localName
        - capability
        - operations
        - state
    targetOf:
      type: array
      items:
        type: object
        properties:
          conduit:
            $ref: github.com/shrav-k/conduit/core#object.v1
          consumer:
            $ref: github.com/shrav-k/conduit/core#object.v1
          target:
            $ref: github.com/shrav-k/conduit/core#object.v1
          localName:
            $ref: github.com/shrav-k/conduit/core#name.v1
          capability:
            $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          operations:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
          state:
            enum:
            - registered
            - ready
            - retired
          provenance:
            $ref: github.com/shrav-k/conduit/core#provenance.v1
        required:
        - conduit
        - consumer
        - target
        - localName
        - capability
        - operations
        - state
    tombstones:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#tombstone.v1
    scope:
      type: array
      items:
        type: object
        properties:
          target:
            $ref: github.com/shrav-k/conduit/core#object.v1
          conduits:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#object.v1
        required:
        - target
        - conduits
    administrators:
      type: array
      items:
        type: object
        properties:
          consumer:
            $ref: github.com/shrav-k/conduit/core#object.v1
          conduits:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#object.v1
        required:
        - consumer
        - conduits
  required:
  - consumes
  - targetOf
  - tombstones
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: trust-domain.v1
  description: >-
    The unique SPIFFE trust domain named at first start, fixed for this engine and recorded as trustDomain
    in the status of system (FST-007). It is the authority of a SPIFFE ID without the spiffe scheme
    or a path: one through 255 lowercase letters, digits, dots, hyphens or underscores. It carries
    no user information, port, query or fragment.
spec:
  type: string
  minLength: 1
  maxLength: 255
  pattern: ^[a-z0-9._-]+$
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: evidence-item.v1
  description: 'Engine evidence (PND-004): all fields required. Codes and fingerprints appear only
    in its own panel and recorded answer, never a wire message, result, notification or request
    record.'
spec:
  type: object
  properties:
    kind:
      enum: [code, fingerprint, attestation, fact]
    value: {}
    where:
      type: string
    proves:
      type: string
  required:
  - kind
  - value
  - where
  - proves
  additionalProperties: false
  oneOf:
  - properties:
      kind: {const: fingerprint}
      value: {type: string, minLength: 6, maxLength: 8}
  - properties:
      kind: {enum: [code, attestation, fact]}

---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: pending-action.v1
  description: An action waiting on a person (PND-001 to PND-004). Answer values and kind are extensible
    strings. Wire views remove code and fingerprint evidence, and disclose no omitted count; complete
    evidence is retained for the panel and answer. Enrollment machine evidence is withheld
    entirely from wire views, even at root (PND-008).
spec:
  type: object
  properties:
    id:
      $ref: github.com/shrav-k/conduit/core#id.v1
    kind:
      type: string
    subject:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#object.v1
      minItems: 1
    evidence:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#evidence-item.v1
    expiry:
      type: string
      format: date-time
    answer:
      type: object
      properties:
        value:
          type: string
        actor:
          $ref: github.com/shrav-k/conduit/core#id.v1
        invocation:
          $ref: github.com/shrav-k/conduit/core#id.v1
        at:
          type: string
          format: date-time
      required:
      - value
      - at
      additionalProperties: false
  required:
  - id
  - kind
  - subject
  - evidence
  - expiry
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: refusal.v1
  description: The two tiers of ACC-056. named echoes only the request; cause is a non-empty
    sentence, in the engine's own words, that conveys the refusing rule's row of ACC-056.
    target, exists and conduits are tier-2-only. An unknown tool need not be decomposable into
    an operation; its spelling is preserved in named.tool.
spec:
  type: object
  properties:
    tier:
      enum:
      - 1
      - 2
    operation:
      type: string
    named:
      type: object
      properties:
        tool:
          type: string
        conduit:
          type: string
        objects:
          type: array
          items: {}
      additionalProperties: false
    cause:
      type: string
      minLength: 1
    target:
      $ref: github.com/shrav-k/conduit/core#object.v1
    exists:
      type: boolean
    conduits:
      type: array
      items:
        type: object
        properties:
          name:
            $ref: github.com/shrav-k/conduit/core#name.v1
          as:
            $ref: github.com/shrav-k/conduit/core#name.v1
          state:
            enum:
            - open
            - registered
            - closed
          operations:
            type: array
            items:
              $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
        required:
        - name
        - as
        - state
        - operations
        additionalProperties: false
  required:
  - tier
  - operation
  - named
  - cause
  additionalProperties: false
  allOf:
  - if:
      properties:
        tier:
          const: 1
    then:
      not:
        anyOf:
        - required:
          - target
        - required:
          - exists
        - required:
          - conduits
