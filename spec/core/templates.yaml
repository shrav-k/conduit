# Part of the core package. Accepted by the owner on 2026-11-05 (plan-audit ruling 37); the
# record is docs/proposals/core-and-schemas/README.md. See README.md in this directory.
#
# The templates of the first-start objects (FST-005). At first start the engine instantiates
# them under the names FST-001 gives: the Pool `system` from `system`; the location `local`
# from `location`; the Resources `management` and `access`, owned by `system`, from the
# templates of those names; and the Interface `root` from `root`, whose two declared Conduits
# are made from `root-management` and `root-access`. The instance documents are written out,
# as an example, in spec/schemas/examples/valid/first-start/: they show what first start
# makes, and a submission that held them would be rejected (FST-006, OBJ-002).
#
# Promises encoded:
#   system           FST-001, FST-005, PLC-003 (it holds the default-location setting, which
#                    names nothing until the control sets it)
#   location         FST-001, FST-005, PLC-008, NAM-020. The
#                    argument `facts` sets a location's facts when it is instantiated; after
#                    that only the control `set-facts.v1` changes them. The template has no
#                    `controls` map, so every control of its type is available (TPL-010)
#   management       FST-001, FST-005
#   access           FST-001, FST-005
#   root             FST-001, FST-002 (one Conduit to `management` and one to `access`),
#                    FST-005, CON-002 (they are its declared Conduits)
#   root-management  FST-002, ACC-032 (it lists the operations reserved to the root Interface)
#   root-access      FST-002, ACC-022 (it applies no bound)
#
# Each of `system`, `management`, `access` and `root` is instantiated once, at first start:
# the first-start objects are identified by their IDs, and an instance document whose `from`
# names one of those four templates is rejected (FST-006). `location` is instantiated for
# every location.
#
# A package's templates are not registered (NAM-013), so the template `system` and the Pool
# `system` do not clash under OBJ-002. The declared Conduits of `root` have the local names
# `management` and `access`, which gives the root Interface the tools `management.register.v1`,
# `access.open.v1` and so on under IFC-012. Neither of those two Conduits is renamed
# (LIF-022).

apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: system
  description: >-
    The template of the `system` Pool, which owns locations and the `management` and `access`
    Resources.
spec:
  type: github.com/shrav-k/conduit/core#system-pool.v1
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: location
  description: >-
    The template of a location. `facts` is what the location states about itself, such as its
    host and whether it gives access to local paths.
spec:
  type: github.com/shrav-k/conduit/core#location.v1
  inputs:
    facts:
      schema:
        type: object
        properties:
          host: {type: string, minLength: 1}
          localPaths: {type: boolean}
      to: [/config/facts]
      optional: true
  config:
    facts: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: management
  description: The template of the `management` Resource.
spec:
  type: github.com/shrav-k/conduit/core#management.v1
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: access
  description: The template of the `access` Resource.
spec:
  type: github.com/shrav-k/conduit/core#access.v1
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: root
  description: >-
    The template of the root Interface, the only Interface with access at first start. It
    declares one Conduit to `management` and one to `access`.
spec:
  type: github.com/shrav-k/conduit/core#interface.v1
  config: {}
  conduits:
    management:
      from: github.com/shrav-k/conduit/core#root-management
      target: {kind: Resource, name: management}
    access:
      from: github.com/shrav-k/conduit/core#root-access
      target: {kind: Resource, name: access}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: root-management
  description: >-
    The root Interface's Conduit to `management`. It lists every operation of
    `object-management.v1`, the two reserved to the root Interface among them.
spec:
  capability: github.com/shrav-k/conduit/core#object-management.v1
  operations:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#replace.v1
    - github.com/shrav-k/conduit/core#rename.v1
    - github.com/shrav-k/conduit/core#unregister.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#install.v1
    - github.com/shrav-k/conduit/core#declare-lost.v1
    - github.com/shrav-k/conduit/core#purge.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: root-access
  description: >-
    The root Interface's Conduit to `access`. It lists every operation of `access-control.v1`
    and applies no bound, so it is a right to open with no bound, which is unlimited.
spec:
  capability: github.com/shrav-k/conduit/core#access-control.v1
  operations:
    - github.com/shrav-k/conduit/core#open.v1
    - github.com/shrav-k/conduit/core#close.v1
    - github.com/shrav-k/conduit/core#apply-policy.v1
    - github.com/shrav-k/conduit/core#remove-policy.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
