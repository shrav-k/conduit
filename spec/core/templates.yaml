# Part of the core package, first accepted by plan-audit ruling 37 (2026-11-05); the record is
# docs/proposals/core-and-schemas/README.md. What the docs audit and rounds 2 to 4 of the
# re-audit changed since is logged in the records that README.md in this directory names.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, changed the template `system`, which selects `pool.v1`, and `location`,
# which has no input and no `config` (decision 8), and took `rename.v1` out of
# `root-management` (decision 10) and the policy operations out of `root-access` (decision
# 3a). The log is docs/proposals/ruling-41/log-core.md.
#
# The templates that first start instantiates (FST-005): those of the five first-start objects
# and of the two Conduits of `root`, which are not first-start objects (FST-002). At first start
# the engine instantiates them under the names FST-001 gives: the Pool `system` from
# `system`; the location `local` from `location`; the Resources `management` and `access`,
# owned by `system`, from the templates of those names; and the Interface `root` from `root`,
# whose two declared Conduits are made from `root-management` and `root-access`. The instance
# documents are written out, as an example, in spec/schemas/examples/valid/first-start/: they
# show what first start makes, and a submission that held them would be rejected (FST-006,
# OBJ-002).
#
# Promises encoded:
#   system           FST-001, FST-005 (the Pool that owns the locations, `management` and
#                    `access`, and every machines provider and package-source provider,
#                    PRV-013)
#   location         FST-001, FST-005, PLC-008, PLC-026, NAM-020. The engine instantiates it
#                    for `local` at first start and for every other machine that the machines
#                    provider reports, and nothing else does (FST-006)
#   management       FST-001, FST-005
#   access           FST-001, FST-005
#   root             FST-001, FST-002 (one Conduit to `management` and one to `access`),
#                    FST-005, CON-002 (they are its declared Conduits)
#   root-management  FST-002, ACC-032 (it lists the operations reserved to the root Interface)
#   root-access      FST-002, ACC-022 (it applies no bound)
#
# No instance document is made from any of these five templates: `system`, `location`,
# `management`, `access` and `root` (FST-006). The first-start objects are identified by their
# IDs, and a name is fixed once its object is made (OBJ-011).
#
# A package's templates are not registered (NAM-013), so the template `system` and the Pool
# `system` do not clash under OBJ-002. The declared Conduits of `root` have the local names
# `management` and `access`, which gives the root Interface the tools `management.register.v1`,
# `access.open.v1` and so on under IFC-012.

apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: system
  description: >-
    The template of the `system` Pool, which owns locations, the `management` and `access`
    Resources, and the machines provider and the package-source providers.
spec:
  type: github.com/shrav-k/conduit/core#pool.v1
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: location
  description: >-
    The template of a location. The engine instantiates it for each machine that the machines
    provider reports and that no location stands for. It has no input and no configuration:
    a location's labels are reported status.
spec:
  type: github.com/shrav-k/conduit/core#location.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: management
  description: The template of the `management` Resource.
spec:
  type: github.com/shrav-k/conduit/core#management.v1
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: access
  description: The template of the `access` Resource.
spec:
  type: github.com/shrav-k/conduit/core#access.v1
  config: {}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: root
  description: >-
    The template of the root Interface, the only Interface with access at first start. It
    declares one Conduit to `management` and one to `access`.
spec:
  type: github.com/shrav-k/conduit/core#interface.v1
  config: {}
  conduits:
    management:
      from: github.com/shrav-k/conduit/core#root-management
      target: {kind: Resource, name: management}
    access:
      from: github.com/shrav-k/conduit/core#root-access
      target: {kind: Resource, name: access}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: root-management
  description: >-
    The root Interface's Conduit to `management`. It lists every operation of
    `object-management.v1`, the two reserved to the root Interface among them.
spec:
  capability: github.com/shrav-k/conduit/core#object-management.v1
  operations:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#replace.v1
    - github.com/shrav-k/conduit/core#unregister.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#install.v1
    - github.com/shrav-k/conduit/core#declare-lost.v1
    - github.com/shrav-k/conduit/core#purge.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: root-access
  description: >-
    The root Interface's Conduit to `access`. It lists every operation of `access-control.v1`
    and applies no bound, so it is a right to open with no bound, which is unlimited.
spec:
  capability: github.com/shrav-k/conduit/core#access-control.v1
  operations:
    - github.com/shrav-k/conduit/core#open.v1
    - github.com/shrav-k/conduit/core#close.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
