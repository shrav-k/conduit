# Part of the core package, first accepted by plan-audit ruling 37 (2026-11-05); the record is
# docs/proposals/core-and-schemas/README.md. What the docs audit and rounds 2 to 4 of the
# re-audit changed since is logged in the records that README.md in this directory names.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, removed `system-pool.v1` and changed `location.v1`, which has no
# configuration, offers no capability and lists no control (decision 8); took `rename.v1` and
# the policy operations out of the `requires` of `management.v1` and `access.v1` (decisions 10
# and 3a); and dropped `placement: {}` from every type, since `placement` is now an optional
# label selector (decision 8a). The log is docs/proposals/ruling-41/log-core.md.
#
# The Type contracts of the core package.
#
# Promises encoded:
#   interface.v1    the basic Interface type (TPL-002: every Interface template has a type);
#                   the type of `root` (FST-001)
#   pool.v1         the basic Pool type (TPL-002), and the type of `system` (FST-001);
#                   ACC-028, ACC-033 (a Pool's own operations); CTR-004 (a Type of the family
#                   Pool offers `pool-management.v1`)
#   location.v1     the location type (PLC-008): a location has an empty configuration, offers
#                   no capability and lists no control; its labels are reported status
#                   (PLC-026), and the engine alone makes one (FST-006)
#   management.v1   the type of `management` (FST-001, ACC-033, OPS-019)
#   access.v1       the type of `access` (FST-001, ACC-006, ACC-012); it requires
#                   `reconcile.v1`, which its capability includes (ACC-033)
#
# No type states `placement`, so none puts a rule on where its instances are placed
# (CTR-004). Each lists under `requires` the operations of the capabilities it offers, and
# each of those operations states the engine as its default implementation (TPL-004). No core
# type states `records`, so the records about its instances keep neither inputs nor outputs
# (CTR-004, REC-002). No core type offers a provider capability: the engine's own runner,
# machine and fetching serve where no provider does (PRV-003), and the engine serves no
# secret store (SEC-020).

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: interface.v1
  description: The basic Interface type. It has no settings and offers nothing.
spec:
  family: Interface
  schema:
    type: object
    additionalProperties: false
  offers: []
  requires: []
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: pool.v1
  description: >-
    The basic Pool type. It has no settings and offers a Pool's own operations. The `system`
    Pool is of this type.
spec:
  family: Pool
  schema:
    type: object
    additionalProperties: false
  offers:
    - github.com/shrav-k/conduit/core#pool-management.v1
  requires:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#retire-with-resources.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: location.v1
  description: >-
    The location type. A location is where an Agent or a Resource runs, and stands for one
    machine that the machines provider reports. It is a Resource owned by the `system` Pool,
    it is its own placement, and its configuration is empty: its labels are what the provider
    last reported for its machine, held in its status. It offers no capability and lists no
    control, and the engine alone makes one.
spec:
  family: Resource
  schema:
    type: object
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: management.v1
  description: The type of the `management` Resource.
spec:
  family: Resource
  schema:
    type: object
    additionalProperties: false
  offers:
    - github.com/shrav-k/conduit/core#object-management.v1
  requires:
    - github.com/shrav-k/conduit/core#register.v1
    - github.com/shrav-k/conduit/core#replace.v1
    - github.com/shrav-k/conduit/core#unregister.v1
    - github.com/shrav-k/conduit/core#inspect.v1
    - github.com/shrav-k/conduit/core#set-up.v1
    - github.com/shrav-k/conduit/core#retire.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
    - github.com/shrav-k/conduit/core#register-replacement.v1
    - github.com/shrav-k/conduit/core#install.v1
    - github.com/shrav-k/conduit/core#declare-lost.v1
    - github.com/shrav-k/conduit/core#purge.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: access.v1
  description: The type of the `access` Resource, which opens and closes Conduits.
spec:
  family: Resource
  schema:
    type: object
    additionalProperties: false
  offers:
    - github.com/shrav-k/conduit/core#access-control.v1
  requires:
    - github.com/shrav-k/conduit/core#open.v1
    - github.com/shrav-k/conduit/core#close.v1
    - github.com/shrav-k/conduit/core#reconcile.v1
