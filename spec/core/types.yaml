# The Type contracts of the core package.
#
# Promises encoded:
#   interface.v1    the basic Interface type (TPL-002: every Interface template has a type);
#                   the type of `root` (FST-001)
#   pool.v1         the basic Pool type (TPL-002), and the type of `system` (FST-001);
#                   ACC-028, ACC-033 (a Pool's own operations); CTR-004 (a Type of the family
#                   Pool offers `pool-management.v1`)
#   node.v1         the type of every node (PLC-008): a node has an empty configuration,
#                   offers no capability and lists no control; its labels are reported status
#                   (PLC-026), and the engine alone makes one (FST-006)
#   management.v1   the type of `management` (FST-001, ACC-033, OPS-019)
#   access.v1       the type of `access` (FST-001, ACC-006, ACC-012); it requires
#                   `reconcile.v1`, which its capability includes (ACC-033)
#
# No type states `nodeSelector`, so none puts a rule on where its instances are placed
# (CTR-004). Each lists under `requires` the operations of the capabilities it offers, and
# the engine implements each of those operations, with no selection (TPL-004). No core
# type states `records`, so the records about its instances keep neither inputs nor outputs
# (CTR-004, REC-002). No core type offers a provider capability: the engine's own runner,
# machine provider and fetching serve where no provider does (PRV-003), and the engine
# implements no `get-secret.v1` (SEC-020).
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: interface.v1
  description: The basic Interface type. It has no settings and offers nothing.
spec:
  family: Interface
  schema:
    type: object
    additionalProperties: false
  offers: []
  requires: []
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: pool.v1
  description: The basic Pool type. It has no settings and offers a Pool's own operations. The `system`
    Pool is of this type.
spec:
  family: Pool
  schema:
    type: object
    additionalProperties: false
  offers:
  - github.com/shrav-k/conduit/core#pool-management.v1
  requires:
  - github.com/shrav-k/conduit/core#register.v1
  - github.com/shrav-k/conduit/core#register-replacement.v1
  - github.com/shrav-k/conduit/core#inspect.v1
  - github.com/shrav-k/conduit/core#set-up.v1
  - github.com/shrav-k/conduit/core#retire.v1
  - github.com/shrav-k/conduit/core#retire-with-resources.v1
  - github.com/shrav-k/conduit/core#reconcile.v1
  - github.com/shrav-k/conduit/core#list.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: node.v1
  description: >-
    The type of every node. A node is where an Agent or a Resource runs, and represents one
    machine that the machine provider reports: for its hostname, trimmed and lowercased,
    whichever machine provider reports it, so retiring or replacing that provider retires no
    node. It is a Resource owned by the `system` Pool, it is its own placement, and its
    configuration is empty: its labels are what the provider last reported for its machine, held
    in its status. It offers no capability and lists no control, and the engine alone makes one.
spec:
  family: Resource
  schema:
    type: object
    additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: management.v1
  description: The type of the `management` Resource.
spec:
  family: Resource
  schema:
    type: object
    additionalProperties: false
  offers:
  - github.com/shrav-k/conduit/core#object-management.v1
  requires:
  - github.com/shrav-k/conduit/core#register.v1
  - github.com/shrav-k/conduit/core#replace.v1
  - github.com/shrav-k/conduit/core#unregister.v1
  - github.com/shrav-k/conduit/core#inspect.v1
  - github.com/shrav-k/conduit/core#set-up.v1
  - github.com/shrav-k/conduit/core#retire.v1
  - github.com/shrav-k/conduit/core#reconcile.v1
  - github.com/shrav-k/conduit/core#register-replacement.v1
  - github.com/shrav-k/conduit/core#install.v1
  - github.com/shrav-k/conduit/core#declare-lost.v1
  - github.com/shrav-k/conduit/core#purge.v1
  - github.com/shrav-k/conduit/core#list.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: access.v1
  description: The type of the `access` Resource, which opens and closes Conduits.
spec:
  family: Resource
  schema:
    type: object
    additionalProperties: false
  offers:
  - github.com/shrav-k/conduit/core#access-control.v1
  requires:
  - github.com/shrav-k/conduit/core#open.v1
  - github.com/shrav-k/conduit/core#close.v1
  - github.com/shrav-k/conduit/core#reconcile.v1
  - github.com/shrav-k/conduit/core#lift.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: fleet.v1
  description: >-
    The sole Fleet Type (FLEET-001). It owns Agents and offers fleet-management.v1, implemented by
    the engine. It has no configuration, placement, run, hooks, entries or declared Conduits; ownership
    permits no use of its Agents.
spec:
  family: Fleet
  schema:
    type: object
    additionalProperties: false
  offers:
  - github.com/shrav-k/conduit/core#fleet-management.v1
  requires:
  - github.com/shrav-k/conduit/core#register.v1
  - github.com/shrav-k/conduit/core#inspect.v1
  - github.com/shrav-k/conduit/core#list.v1
  - github.com/shrav-k/conduit/core#set-up.v1
  - github.com/shrav-k/conduit/core#retire.v1
  - github.com/shrav-k/conduit/core#retire-with-agents.v1
  - github.com/shrav-k/conduit/core#reconcile.v1
