# Implementation-defined behavior: what this specification deliberately leaves to each engine.
# An engine documents its choice for every item, and that document is its conformance document.
# A choice must keep every promise.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# DL11: nothing replaces it (ruling 58).
# DL14: nothing replaces it (ruling 41).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: DL1
  subject: Order of a Pool's Resources or a Fleet's Agents
  document: >-
    The order in which `retire-with-resources.v1` retires a Pool's Resources, or
    `retire-with-agents.v1` a Fleet's Agents, that depend on each other in a cycle, or not at all,
    under LIF-021.
- id: DL2
  subject: Dispatch records
  document: >-
    Where the record is written before an implementation is called; how attempts are numbered;
    what is done with a result that arrives late; and how the digest of an invocation's contents
    is computed, which the engine keeps under OPS-008. The SHA-256 of the RFC 8785 form of the
    operation and its arguments is one way that gives equal contents the same digest.
- id: DL3
  subject: An invocation that does not end until an actor replies
  document: >-
    How long the engine waits for the reply, and what happens to a reply given twice or given
    while the engine cannot receive it. No promise limits how long an invocation is in progress:
    until it ends, a repeat of its request reports conflict under OPS-032, and one for which the
    engine stops waiting has the outcome OPS-007 gives where no result arrives.
- id: DL4
  subject: Access decisions that cannot be made
  document: >-
    Whether a request whose access decision cannot be made, under ACC-037, is not dispatched at
    once, reporting unavailable, or waits, and for how long.
- id: DL5
  subject: Reports of providers
  document: >-
    How often the engine asks the machine provider for its report under PRV-014, and how long it
    waits for one before every machine but the one that `local` represents counts as omitted,
    under PLC-023; how it learns its own hostname, which is the operating system's unless the
    engine is configured with another, as the kubelet takes `--hostname-override`, under
    PLC-026, and which it keeps across a move to another machine, under DL17; and how often it
    asks a runtime provider for the state of a run with `inspect-run.v1` of its own accord,
    under PRV-009. What a request reports meanwhile, to an instance placed on a machine reported
    unreachable or omitted, is PLC-023. The longest an enrollment may last (ENR-001), beside
    how reports are timed; every enrollment has an expiry, and exceeding that maximum is
    invalid. Expiry dispatches nothing (ENR-009).
- id: DL6
  subject: First start
  document: >-
    What triggers it, what an interrupted or repeated one does, and how repair works. How the
    unique SPIFFE trust domain is configured or generated and kept under FST-007, including
    across restarts and moves; its value is fixed after first start.
- id: DL7
  subject: Packages
  document: >-
    Where packages are stored, how they are removed, whether the engine keeps a cache of the
    archives it fetches, and how the user names a mirror, each of which gives the same bytes
    under PKG-026; and which of the tar formats and extensions an engine reads in an archive
    under PKG-022. Also how the engine is handed a directory under SUB-010, such as by a
    command or a call, and for which actor it then registers.
- id: DL8
  subject: Delivery of observations and records
  document: >-
    Feeds, positions within them, and snapshots, and whether records are exported in the form
    of `record.v1`, under REC-002. Also how the records that name no object that still exists
    are read, once every object they name has been unregistered or removed and no request for
    `inspect.v1` returns them, under LIF-019 and REC-003.
- id: DL9
  subject: Order of failed checks
  document: >-
    The order in which several failed checks that give the same reason are reported.
- id: DL10
  subject: Limits
  document: >-
    Sizes and counts: a document's nesting, with a floor of 64 levels; a file's size; the
    number of documents or files in a submission; and the size of a package's archive.
    Exceeding a stated limit is rejected under SUB-011, and at installation the request
    reports invalid under PKG-023 with that diagnostic; the `ttlMs` of a tool list that the
    engine serves, under IFC-038; the time allowed for a call, a retire hook's among them,
    after which its part ends unknown and the stop is asked for under TPL-009; how long the
    outputs of a succeeded invocation, other than one whose outcome a reconciliation set, are
    kept for a repeat under OPS-009, including the content of a succeeded plain invocation
    whether or not its operation declares outputs, after which a repeat reports conflict under
    OPS-034, unless OPS-024 dispatches it; and behavior when storage is exhausted.
- id: DL12
  subject: Protocol revisions, `content`, `Origin` and the schemas of tools
  document: >-
    Which revisions of the Model Context Protocol are supported beyond the baseline, and what
    the engine puts in the `content` member of a result it returns to a consumer beyond what
    IFC-025 fixes: among it, whether a result that holds `structuredContent`, and whose outcome
    did not come from a plain implementation, also carries it serialized there, as the protocol
    recommends. Also which values of the `Origin` header the engine's server accepts, under
    IFC-036; and, in the definition of a tool that it presents, which `$ref` to a Schema
    contract whose schema holds no `$ref` it replaces by that schema rather than point to the
    contract's copy, where IFC-033 lets it.
- id: DL13
  subject: Proof of who is who
  document: >-
    The mechanism by which the engine establishes, under IFC-022, which instance a request comes
    from, and by which it proves itself, as an enforcement point, to a gate, under PRV-025 and
    IFC-017: in this version one root of trust that issues every credential, for both
    directions. What a request presents, and how the engine establishes from it exactly one
    instance or none, or neither where whether that instance still exists cannot be read, under
    ACC-037, by a cryptographic proof of the instance that sent it wherever the request crosses
    machines. Its two forms of proof: a signed token in the form of a JWT-SVID, whose `sub`
    names the sender and whose `aud` names the receiver, which the engine's address always
    accepts, over TLS at an `https` URL and, without TLS, at an `http` URL on loopback that it
    gives a run, under IFC-042, and which toward a run names as its audience the instance's ID
    exactly as the `sub` of that run's own `token` names it, so that a gate finds in `identity`
    the audience to admit; and mutual TLS, with X.509 certificates that name their holder in
    exactly one URI and serve both as client and as server, as an X509-SVID does, which the
    engine's address may accept beside the token. To a run's gate the engine presents both: its
    certificate, to a gate that asks for one in the TLS handshake, and its token, in the
    `Authorization` header, so that a gate written once to check either works under every
    engine, under PRV-025. Which of the two, one or both, it presents to an item reached by
    `remote`, under IFC-041, and which a run presents to the engine beside the token that
    IFC-042 has it accept. Every credential names its holder by the SPIFFE IDs fixed by FST-007
    in the engine's unique trust domain: `spiffe://<trust-domain>/conduit/engine` and
    `spiffe://<trust-domain>/conduit/instance/<id>`. How an instance's ID fits the characters
    that the SPIFFE path allows. `/conduit/node/<id>` is reserved. A gate admits the engine's ID
    in `engine-id`, under PRV-025. The mechanism issues a credential that names the engine's
    credential ID, a certificate that names the host of the engine's address, and a token whose
    audience is anything but the engine's address, to the engine alone. Where the signing keys
    are held, such as with an issuer outside the engine, in a key management service or in the
    store of the engine's own state, each of which, with its backups and operators, is then
    inside the domain of trust; where the keys that check a credential are published, so that a
    credential can be checked without the engine; the authorization server that the protected
    resource metadata at the engine's address names, under IFC-042, the grants of the protocol's
    authorization that it supports for a consumer, and how it decides which instance a token
    that it issues names; and how the user configures, for the URL of an item reached by
    `remote`, an authorization server that the user runs, and the key and the client identifier
    of the JWT assertion under RFC 7523 with which the engine authenticates to it with its own
    credential, under IFC-041. The issuer that the `iss` of every token that the mechanism signs
    names is an authorization server that the protected resource metadata at the engine's
    address lists, and is the one that an item reached by `remote` names where the engine sends
    it such a token, under IFC-041, since the protocol has a client send a server only tokens
    that the server's authorization server issued. The roots from which the certificate at the
    engine's address is issued: the mechanism's own, or others, such as those of a public
    certification authority. The roots against which the engine checks the certificate of an
    item reached by `remote`, under IFC-017, such as the operating system's store or roots that
    the user configures. What the mechanism puts in the input `identity` of `run.v1`, under
    PRV-007, for every run, on the engine's own runner as under any runtime provider, under the
    names and in the files that PRV-022 fixes: the content of each; the engine's address that it
    gives a run, which is an `https` URL, or an `http` URL on loopback only for a run on the
    engine's own runner whose process ends when the engine stops, on an engine that, as
    configured, can neither restart on another machine nor run as several parts, under DL17,
    since a run that sends its `token` to that address while the engine does not hold it, as
    during a restart, gives the token to whatever program has taken it; and where it gives
    `tls.crt` and `tls.key`, which it gives for every run whose server stands behind a gate. A
    run's credential, and the certificate that its gate serves, last as long as its instance:
    none is renewed during a run in this version, the time at which it lapses, its `exp` or its
    `notAfter`, is set so far ahead that it does not lapse while the instance exists, and the
    engine's check on every request that the instance still exists is the only revocation. Each
    root, and each key in `jwks.json`, is kept for as long as a run that holds it lasts. On an
    engine of several parts, under DL17, the engine's own credential is short-lived, and the
    conformance document states its lifetime; on any other engine it may be.

- id: DL15
  subject: Generated names
  document: >-
    The length of the suffix that OBJ-003 has the engine generate, the characters it uses, and
    how far the template's part of a generated name is shortened. Whatever is chosen, the name
    satisfies OBJ-001 and OBJ-002. The generator of the Kubernetes API server, which appends
    five lowercase alphanumeric characters, is one choice that meets it.
- id: DL16
  subject: The engine's own runner
  document: >-
    What a process that the engine's own runner starts receives beyond what its item binds, what
    `identity` holds under PRV-022, and the variables of the engine's environment that PRV-023
    passes: its working directory, and the operating-system user and the login session it runs
    in. Also how the list of further variables that PRV-023 passes is set on the runner, as
    systemd's `PassEnvironment=` is set on a unit; on an operating system on which a process
    needs other variables in place of `HOME`, `LOGNAME`, `PATH`, `SHELL`, `TERM` and `USER`,
    such as Windows, which it passes in their place, as the stdio clients of the Model Context
    Protocol's SDKs pass `SYSTEMROOT`, `TEMP` and `USERPROFILE` there; which registry types of a
    `package` item it runs, such as `npm` or `pypi`, as a runtime provider's contract states
    them under PRV-012; it runs one only where its `transport` is of the `type` `stdio`, and
    ends the run of any other failed, under PRV-003; the runner's restart policy, under PRV-010;
    and what becomes of the processes it started when the engine stops and when it starts again,
    apart from the servers of the runtime, machine and package-source providers, and the
    processes of the secret Resources that it runs, which PRV-026 has the engine run again when
    it first needs each. A process that runs as the engine's own operating-system user can read
    the engine's keys and what every run under that user presents, so it is inside the domain of
    trust and can get past every gate, under IFC-022. The engine's own runner is the runtime
    provider here, so this item is the contract that PRV-011 and SEC-020 leave to a runtime
    provider.
    Where each instance's private state directory lives in the store, under PRV-029, and how
    the platform supplies its private permissions. Its stable identity and removal are fixed
    by PRV-029; processes sharing the engine's user can still read it.
- id: DL17
  subject: An engine that restarts on another machine or runs as several parts
  document: >-
    Whether the engine, as configured, can restart on another machine than the one it ran on, or
    run as several parts at once, and how it is so configured; and, where it can, the machines
    that may run it and the mechanism, its own, by which it meets these outcomes. Every decision
    that a promise has the engine make reads the state as it stands, as a linearizable read of
    etcd does. At most one part of the engine acts on any one invocation, and the store of the
    engine's own state enforces it, as a compare-and-set on the invocation's state does, and
    never a part's timing alone; several parts may then serve at once, as several Kubernetes API
    servers do, or one may lead under a lease, as its controller manager does. A decision that
    admits one of several competing changes, such as a name under OBJ-002, an idempotency key
    under OPS-008, a change of an instance under REV-014 or a provider under PRV-013, is
    committed against the state that it read, as an etcd transaction compares a key's revision
    before it writes, so that two parts that read the same state do not both commit. An
    invocation in progress on a part that stops ends unknown, as under IMP-007, although the
    engine as a whole goes on. A part that stops so counts as a restart for the runs that it
    held of providers and of secret Resources on the engine's own runner: they end with it, and
    PRV-026 runs each again before the engine next needs it. A part that pauses after it has
    acted and sends later may still land an effect late, as a request on a connection that was
    cut may, under OPS-027; the engine's own credential, which DL13 makes short-lived on an
    engine of several parts, bounds how late only where what receives the request checks that
    credential on the request itself, as a gate checks the `exp` of a token; a request on a
    connection that mutual TLS checked before the credential lapsed, or one that carries a token
    that an authorization server issued under IFC-041, is bounded by that connection or by that
    token instead. What the promises say of the engine's own runner, of the servers of providers
    and of connections holds of the whole: the processes of that runner run on one machine at a
    time; each server of a provider, and each connection to an item reached by `remote`, is held
    by one part at a time; and one run serves one instance, under PRV-007, so the runs of the
    instances on `local`, whichever runtime provider made them, the processes of its own runner
    among them, are on one machine at a time: before the engine asks for the run of any such
    instance on another machine, or stops, inspects or reaches one there, every run on the
    machine that held them has ended, as Kubernetes has a node that stopped answering shut down
    before it is marked out of service and its Pods are made again elsewhere. The engine's own
    fetching of a `file:` URL, under PRV-003, reads one file whichever part makes it: every
    machine that may run the engine holds each file that an install names, or one part alone
    fetches them. The engine's address in `identity` keeps reaching an engine after a move, as a
    Pod reaches the Kubernetes API server at `kubernetes.default.svc`. The signing keys of DL13
    survive the move, and so do the stops that a runtime provider owes, under PRV-021. `local`
    keeps representing one hostname, under PLC-026: the engine moves only to a machine that
    takes its hostname, under DL5, and that holds what the instances on `local` need of their
    machine, such as the providers' own configuration and every file that such an instance
    names, under PLC-020; no other node represents those machines. Such an engine rejects a
    template whose item would send a header that carries a secret to an `http` URL, or is
    reached by `remote` at a loopback host, under SEC-024, and, for one registered before it was
    so configured, sends no such header and connects to no such item, whose part reports
    unavailable, under SEC-013 and IFC-041, until the template is replaced and each instance
    made from it before then has been replaced by one made from it since, because an instance
    keeps the item it resolved, under INS-020; no document but such a template needs to change.

- id: DL18
  subject: A URL action's wait
  document: >-
    How long sign-in.v1 and other URL actions wait for a person's completion within their
    invocation, including polling across retries or task updates (IFC-049) and the return
    (PND-013). Accept does not
    complete a sign-in. The wait is finite; on its end the invocation ends unknown and no
    later hook runs. The wait is distinct from the pending action's expiry (DL19).
- id: DL19
  subject: Pending-action expiry
  document: >-
    The duration of each pending-action kind, and how its expiry is computed and shown. Every
    action has an expiry (PND-003); on expiry it reads expired with no actor and dispatches
    nothing. Vectors supply clock input rather than relying on elapsed wall time.
