# Implementation-defined behavior: what this specification deliberately leaves to each engine.
# Owner rulings of 2026-11-05 (plan-audit rulings 31, 32, 33 and 37). An engine documents its
# choice for every item, and that document is its conformance document. A choice must keep every
# promise. The conversion of the older text (decision DA3 of the docs audit,
# docs/proposals/docs-audit/GAPS.md) added to DL1 when a graph's outputs become available, and
# added DL14. The second round of the re-audit (docs/proposals/reaudit/round-2/) named the key
# that states what an item is about `subject`, added to DL5 and DL6, reworded DL7 and added
# DL15. Its closing pass added to DL7 which tar formats an engine reads, to DL10 how long the
# content of a retained result is kept, and to DL12 what the `content` of a result holds. Its
# last pass (docs/proposals/reaudit/round-2/log-tail.md) reworded DL3 in the terms of an
# invocation, took from DL7 the use of a package from files that are still being edited, which
# PKG-022, PKG-004 and NAM-006 decide, and from DL11 the later opening of an optional Conduit,
# which CON-004 and ACC-006 decide, and added to DL7 how an engine is handed a directory. The
# follow-up to the fix pass of the third round (docs/proposals/reaudit/round-3/log-fixes.md),
# on a decision of the coordinator that ruling 39 accepted, added to DL1 the order in
# which a Pool's Resources are retired where LIF-021 fixes none. The fix pass of the fourth
# round (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, added to DL8 how the records of objects that
# no longer exist are read, and to DL12 the serialized copy of a result's structured content.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 38 (2026-11-06) took out of DL7 whether an engine that is handed a directory installs
# the packages its manifest lists: it installs none (SUB-010).
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review (docs/proposals/principles-review/README.md), removed DL14, on
# cancellation, which is the protocol's own under OPS-027 (decision 22): nothing replaces the
# item. It changed DL1, now only the order of a Pool's Resources, since graphs go (decision 1);
# DL2 and DL3 (C33, 6b); DL5, now the machines provider's report, what a request reports
# meanwhile being PLC-023 (8e); DL6 (8); DL7, since `https:` and `file:` are fetched by every
# engine and other schemes by a package-source provider (21); DL8 (24c, 17); DL9, since a busy
# instance reports conflict under REV-014 (23); DL10 (6c); DL12, since a runtime provider runs
# an implementation and one run serves one instance (2a); DL13 (26a); and DL15 (30, 5). It
# added none. What changed is in docs/proposals/ruling-41/log-G5.md. DL14 is not reused.
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06) accepted the coordinator's
# decisions in docs/proposals/ruling-41/open-decisions.md and the owner's answers to D8 and
# D17. Applying them, it changed DL5, now the reports of providers: how long the engine waits
# for the machines provider's report, how it learns its own hostname, and how often it asks
# `inspect-run.v1` (rows 13 and 16); DL10: the time a retire hook is allowed, and that a repeat
# reports conflict under OPS-034 once outputs are no longer kept (rows 3 and 31); and DL13:
# what the mechanism puts in the input `identity` of `run.v1` (D17). It added DL16, the
# engine's own runner: what a process it starts receives beside what PRV-023 passes (row 7,
# with D8). DL14 is not reused. The integration of ruling 42
# (docs/proposals/ruling-42/log-integration.md) changed DL13, which gives `identity` to a run on
# the engine's own runner as to any other in place of a sentence of its own on stdio, and DL16,
# which names what `identity` holds among what a process receives.
# The names of ruling 42 (the vocabulary audit's N2 and N10; log
# docs/proposals/ruling-42/log-rename-a.md) renamed the machines provider to the machine
# provider, and "for which `local` stands" to "that `local` represents", in DL5. It removed none
# and added none.
# The names of ruling 42 (the vocabulary audit's N18; log
# docs/proposals/ruling-42/log-rename-b.md) renamed the runtime profile to the conformance
# document in the first lines of this comment. It changed no item.
# The verification of ruling 42 (docs/proposals/ruling-42/log-integration.md, "Verification")
# changed DL13, which also states how a runtime provider gets a refreshed credential, since no
# provider call carries one, and DL16, which names an operating system such as Windows, on
# which a process needs other variables in place of the six of PRV-023, as the case where the
# engine states which it passes, and adds the runner's restart policy and what becomes of the
# processes it started when the engine stops and starts again. It removed none and added none.
# Ruling 43 (docs/proposals/ruling-43/README.md, 2026-11-06) accepted the proposal on work
# across machines (docs/proposals/multi-machine/README.md), with D5's second part as option b
# and Q1 tightened. Applying it, it changed DL13, now the proof of who is who in both
# directions: one root of trust, the two forms of proof, IDs in SPIFFE's form recommended, where
# the keys are held and published, what it puts in `identity` under the names that PRV-022
# fixes, and credentials that last as long as their instance (Q1); DL5, under which the engine
# keeps its hostname across a move (Q2); and DL16, which points to PRV-026 for the servers of
# providers and states that a process of the engine's own user is inside the domain of trust
# (Q3, Q5). It added DL17, the outcomes that an engine meets where it can restart on another
# machine or run as several parts (Q2). DL14 is not reused. What changed is in
# docs/proposals/ruling-43/log-interface.md. The integration of ruling 43 then made DL13 accept
# the token form at the engine's address from a consumer on another machine, as IFC-042 does;
# had DL16 name the three kinds of provider that PRV-026 runs again; and had DL17 say that no
# document but one that SEC-024 rejects needs to change when the engine is made able to move
# (docs/proposals/ruling-43/log-integration.md). The verification of ruling 43
# (docs/proposals/ruling-43/log-integration.md, "Verification") then had DL13 always accept the
# token form at the engine's address at an `https` URL, with mutual TLS beside it; give
# `jwks.json` and `engine-id` in `identity`; issue what names the engine to the engine alone;
# state the grants of its authorization server, the roots of the certificate at the engine's
# address and how the engine authenticates to an authorization server that the user runs; and
# set the time at which a run's credential lapses beyond its instance's life. It had DL16 name
# the secret Resources that PRV-026 runs again, and DL17 read "can" as configured, keep a
# header that carries a secret off `http` for a template registered before, end unknown the
# invocations of a part that stops, keep one run for each instance and fence the machine the
# engine left.

- id: DL1
  subject: Order of a Pool's Resources
  document: >-
    The order in which `retire-with-resources.v1` retires Resources that depend on each other
    in a cycle, or not at all, under LIF-021.
- id: DL2
  subject: Dispatch records
  document: >-
    Where the record is written before an implementation is called; how attempts are numbered;
    what is done with a result that arrives late; and how the digest of an invocation's contents
    is computed, which the engine keeps under OPS-008. The SHA-256 of the RFC 8785 form of the
    operation and its arguments is one way that gives equal contents the same digest.
- id: DL3
  subject: An invocation that does not end until an actor replies
  document: >-
    How long the engine waits for the reply, and what happens to a reply given twice or given
    while the engine cannot receive it. No promise limits how long an invocation is in progress:
    until it ends, a repeat of its request reports conflict under OPS-032, and one for which the
    engine stops waiting has the outcome OPS-007 gives where no result arrives.
- id: DL4
  subject: Unreachable `access` or `management`
  document: >-
    Whether a request is not dispatched at once, reporting unavailable, or waits, and for how
    long.
- id: DL5
  subject: Reports of providers
  document: >-
    How often the engine asks the machine provider for its report under PRV-014, and how long it
    waits for one before every machine but the one that `local` represents counts as omitted,
    under PLC-023; how it learns its own hostname, which is the operating system's unless the
    engine is configured with another, as the kubelet takes `--hostname-override`, under
    PLC-026, and which it keeps across a move to another machine, under DL17; and how often it
    asks a runtime provider for the state of a run with `inspect-run.v1` of its own accord,
    under PRV-009. What a request reports meanwhile, to an instance placed on a machine reported
    unreachable or omitted, is PLC-023.
- id: DL6
  subject: First start
  document: >-
    What triggers it, what an interrupted or repeated one does, and how repair works.
- id: DL7
  subject: Packages
  document: >-
    Where packages are stored, how they are removed, whether the engine keeps a cache of the
    archives it fetches, and how the user names a mirror, each of which gives the same bytes
    under PKG-026; and which of the tar formats and extensions an engine reads in an archive
    under PKG-022. Also how the engine is handed a directory under SUB-010, such as by a
    command or a call, and for which actor it then registers.
- id: DL8
  subject: Delivery of observations and records
  document: >-
    Feeds, positions within them, and snapshots, and whether records are exported in the form
    of `record.v1`, under REC-002. Also how the records that name no object that still exists
    are read, once every object they name has been unregistered or removed and no request for
    `inspect.v1` returns them, under LIF-019 and REC-003.
- id: DL9
  subject: Order of failed checks
  document: >-
    The order in which several failed checks that give the same reason are reported.
- id: DL10
  subject: Limits
  document: >-
    Sizes, counts, the time allowed for a call, a retire hook's among them, after which its part
    ends unknown and the stop is asked for under TPL-009; how long the outputs of a succeeded
    invocation are kept for a repeat under OPS-009, after which a repeat reports conflict under
    OPS-034; and behavior when storage is exhausted.
- id: DL11
  subject: Conduits during setup
  document: >-
    What a consumer with only some of its Conduits open may do.
- id: DL12
  subject: Protocol revisions and `content`
  document: >-
    Which revisions of the Model Context Protocol are supported beyond the baseline, and what
    the engine puts in the `content` member of a result it returns to a consumer: among it,
    whether a result that holds `structuredContent` also carries it serialized there, as the
    protocol recommends.
- id: DL13
  subject: Proof of who is who
  document: >-
    The mechanism by which the engine establishes, under IFC-022, which instance a request comes
    from, and by which it proves itself, as an enforcement point, to a gate, under PRV-025 and
    IFC-017: one root of trust that issues every credential, for both directions. What a request
    presents, and how the engine establishes from it exactly one instance or none, by a
    cryptographic proof of the instance that sent it wherever the request crosses machines. Its
    two forms of proof: a signed token over TLS in the form of a JWT-SVID, whose `sub` names the
    sender and whose `aud` names the receiver, which the engine's address at an `https` URL
    always accepts, under IFC-042, and which toward a run names the instance's ID as its
    audience; and mutual TLS, with X.509 certificates that name their holder in exactly one URI
    and serve both as client and as server, as an X509-SVID does, which the engine's address may
    accept beside the token. Which of the two, one or both, the engine presents to a gate and to
    an item reached by `remote`, and which a run presents to it. The ID by which a credential
    names the engine's role, and that by which it names each instance, which is by the
    instance's ID, and how an ID fits the characters that its form allows. SPIFFE's form is
    recommended and not required: `spiffe://<trust domain>/conduit/engine` for the engine's
    role, and `spiffe://<trust domain>/conduit/instance/<id>` for an instance. The mechanism
    issues a credential that names the engine's ID, a certificate that names the host of the
    engine's address, and a token whose audience is anything but the engine's address, to the
    engine alone. Where the signing keys are held, such as with an issuer outside the engine, in
    a key management service or in the store of the engine's own state, each of which, with its
    backups and operators, is then inside the domain of trust; where the keys that check a
    credential are published, so that a credential can be checked without the engine; the
    authorization server that the protected resource metadata at the engine's address names,
    under IFC-042, the grants of the protocol's authorization that it supports for a consumer,
    and how it decides which instance a token that it issues names; and how the engine
    authenticates, with its own credential, to an authorization server that the user runs and
    that an item reached by `remote` names, under IFC-041. The roots from which the certificate
    at the engine's address is issued: the mechanism's own, or others, such as those of a public
    certification authority. What the mechanism puts in the input `identity` of `run.v1`, under
    PRV-007, for every run, on the engine's own runner as under any runtime provider, under the
    names and in the files that PRV-022 fixes: the content of each; the engine's address that it
    gives a run, which on the engine's own machine may be an `http` URL on loopback; and where
    it gives `tls.crt` and `tls.key`, which it gives for every run whose server stands behind a
    gate. A run's credential, and the certificate that its gate serves, last as long as its
    instance: none is renewed during a run in this version, the time at which it lapses, its
    `exp` or its `notAfter`, is set so far ahead that it does not lapse while the instance
    exists, and the engine's check on every request that the instance still exists is the only
    revocation. Each root, and each key in `jwks.json`, is kept for as long as a run that holds
    it lasts. On an engine of several parts, under DL17, the engine's own credential is
    short-lived, and the conformance document states its lifetime; on any other engine it may
    be.
- id: DL15
  subject: Generated names
  document: >-
    The length of the suffix that OBJ-003 has the engine generate, the characters it uses, and
    how far the template's part of a generated name is shortened. Whatever is chosen, the name
    satisfies OBJ-001 and OBJ-002. The generator of the Kubernetes API server, which appends
    five lowercase alphanumeric characters, is one choice that meets it.
- id: DL16
  subject: The engine's own runner
  document: >-
    What a process that the engine's own runner starts receives beyond what its item binds, what
    `identity` holds under PRV-022, and the variables of the engine's environment that PRV-023
    passes: its working directory, and the operating-system user and the login session it runs
    in. Also how the list of further variables that PRV-023 passes is set on the runner, as
    systemd's `PassEnvironment=` is set on a unit; on an operating system on which a process
    needs other variables in place of `HOME`, `LOGNAME`, `PATH`, `SHELL`, `TERM` and `USER`,
    such as Windows, which it passes in their place, as the stdio clients of the Model Context
    Protocol's SDKs pass `SYSTEMROOT`, `TEMP` and `USERPROFILE` there; the runner's restart
    policy, under PRV-010; and what becomes of the processes it started when the engine stops
    and when it starts again, apart from the servers of the runtime, machine and package-source
    providers, and the processes of the secret Resources that it runs, which PRV-026 has the
    engine run again when it first needs each. A process that
    runs as the engine's own operating-system user can read the engine's keys and what every run
    under that user presents, so it is inside the domain of trust and can get past every gate,
    under IFC-022. The engine's own runner is the runtime provider here, so this item is the
    contract that PRV-011 and SEC-020 leave to a runtime provider.
- id: DL17
  subject: An engine that restarts on another machine or runs as several parts
  document: >-
    Whether the engine, as configured, can restart on another machine than the one it ran on, or
    run as several parts at once, and how it is so configured; and, where it can, the machines
    that may run it and the mechanism, its own, by which it meets these outcomes. Every decision
    that a promise has the engine make reads the state as it stands, as a linearizable read of
    etcd does. At most one part of the engine acts on any one invocation, and the store of the
    engine's own state enforces it, as a compare-and-set on the invocation's state does, and
    never a part's timing alone; several parts may then serve at once, as several Kubernetes API
    servers do, or one may lead under a lease, as its controller manager does. An invocation in
    progress on a part that stops ends unknown, as under IMP-007, although the engine as a whole
    goes on. A part that pauses after it has acted and sends later may still land an effect
    late, as a request on a connection that was cut may, under OPS-027; the engine's own
    credential, which DL13 makes short-lived on an engine of several parts, bounds how late.
    What the promises say of the engine's own runner, of the servers of providers and of
    connections holds of the whole: the processes of that runner run on one machine at a time;
    each server of a provider, and each connection to an item reached by `remote`, is held by
    one part at a time; and one run serves one instance, under TPL-019, so before the runner
    runs anything on another machine, every process that it started on the machine the engine
    left has ended, as Kubernetes has a node that stopped answering shut down before it is
    marked out of service and its Pods are made again elsewhere. The engine's address in
    `identity` keeps reaching an engine after a move, as a Pod reaches the Kubernetes API server
    at `kubernetes.default.svc`. The signing keys of DL13 survive the move, and so do the stops
    that a runtime provider owes, under PRV-021. `local` keeps representing one hostname, under
    PLC-026: the engine moves only to a machine that takes its hostname, under DL5, and that
    holds what the instances on `local` need of their machine, such as the providers' own
    configuration and every file that such an instance names, under PLC-020; no other node
    represents those machines. Such an engine rejects a template whose item would send a header
    that carries a secret to an `http` URL, under SEC-024, and sends no such header for one
    registered before it was so configured, whose part reports unavailable, under SEC-013, until
    the template is replaced; no other document needs to change.
