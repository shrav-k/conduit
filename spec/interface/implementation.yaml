# The implementation interface: the shared wire between an engine and an implementation, and
# between an engine and a consumer.
# The wire is the Model Context Protocol. One baseline revision is required of everyone; either
# side may support others, and the protocol's own per-request negotiation picks one. Handles
# follow the protocol's guidance for stateful tools. The protocol's own fields are named as its
# revision 2026-07-28 names them. Promises here have the layer `interface`, but IFC-014, IFC-043
# and IFC-044, rules on documents, have the layer `language`.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# Removed: IFC-024 → OPS-009 (repeat a lost request); no replacement tool (ruling 41).
# IFC-034: nothing replaces it (ruling 41).
# IFC-035: nothing replaces it (ruling 38).
# OBS-007: nothing replaces it (ruling 41).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: IFC-001
  layer: interface
  level: must
  when: >-
    An engine invokes an operation of an implementation that is reached by `command`, `package`
    or `remote`.
  then: >-
    The implementation is a Model Context Protocol server and the engine is its client. The
    operation is one tool, called with `tools/call`. The tool's `name` is the operation's export
    name or, for an implementation marked `plain`, the name its `tools` map gives under PKG-020.
    Its `arguments` are the operation's inputs, and the result's `structuredContent` is the
    operation's outputs, keyed by name. The engine and the implementation each keep every
    requirement of the protocol at the revision in use, and this specification repeats none of
    them.
  observable: >-
    A `tools/call` request for the operation carries exactly the operation's inputs as its
    `arguments`. Operations of two packages may share an export name. An implementation that
    implements two such operations has one tool of that name, and tells the two apart by
    `io.github.shrav-k.conduit/operation`, which IFC-006 sends with every request. A plain
    implementation is sent no such key, and its `tools` map names a tool for each operation. The
    interface is the protocol with Conduit's keys added. What the protocol requires of a client
    and of a server, such as the keys it requires in the `_meta` of every request, what a server
    must implement beside its tools, and what a tool list must carry, binds the engine and an
    implementation as the protocol states it. The same holds for the server that the engine
    presents to a consumer under IFC-012. Over Streamable HTTP the engine mirrors into
    `Mcp-Param` headers the arguments that the implementation's own tool definition marks with
    `x-mcp-header`, as the protocol requires of every client, so it reads the implementation's
    `tools/list` before its first call to each run and to an item reached by `remote` at each
    connection, as it reads `server/discover` under IFC-037. Where that list cannot be read, or
    does not hold the tool that a call names, the engine cannot keep that requirement, so
    nothing is sent: the request, the hook or the part that needed the call is not dispatched
    and reports unavailable, and its record says why, as under IFC-037. A call that the
    implementation rejects with the protocol's error -32020, because its headers disagree with
    its body, is sent once more under IFC-046.
  vectors: []

- id: IFC-002
  layer: interface
  level: must
  when: >-
    An engine or an implementation that carries Conduit's keys is built for this version of the
    specification.
  then: >-
    It supports the baseline revision of the Model Context Protocol, which for this version is
    2026-07-28.
  observable: >-
    Any such engine and any such implementation can complete a request with each other at the
    baseline revision.
  vectors: []

- id: IFC-003
  layer: interface
  level: may
  when: >-
    An engine and an implementation both support a revision other than the baseline.
  then: >-
    They use it. The revision is chosen by the protocol's own negotiation, which at the baseline
    revision names it for each request in `io.modelcontextprotocol/protocolVersion` in the
    request's `_meta`. The meaning of Conduit's keys and of an outcome is the same at every
    revision.
  observable: >-
    A request that the implementation rejects for its revision, with the protocol's JSON-RPC
    error for an unsupported version, is sent again at a revision both support, under IFC-046,
    and is one invocation, not two.
  vectors: []

- id: IFC-004
  layer: interface
  level: must
  when: >-
    A revision of the protocol is used under IFC-003.
  then: >-
    It provides what this interface relies on. For a call that carries Conduit's keys, that is
    `tools/call` with a `name` and `arguments`; `_meta` on the request, on the result and on a
    tool's definition; `structuredContent`; `isError`, the flag that marks a result as an error;
    a tool's `annotations`; and the negotiation of extensions, by which a server lists the
    extensions it supports in its result of `server/discover`, a client declares an extension on
    each request in `io.modelcontextprotocol/clientCapabilities` with `revision` in the
    extension's settings object, and a server answers with the error -32021 a request that does
    not declare a capability it requires. For a call to an implementation marked `plain`, it is
    `tools/call` with a `name` and `arguments`, `isError`, and `structuredContent` where the
    operation declares outputs.
  observable: >-
    A revision that lacks any of what a call relies on is not used for that call, whatever both
    sides support. A plain implementation is declared no extension, under IFC-007, so a revision
    that has no negotiation of extensions, such as 2025-11-25 and those before it, may serve a
    call to one where both sides support it, under IFC-003 and DL12; a result whose `resultType`
    is absent, under IFC-010, is a result at such a revision.
  vectors: []

- id: IFC-005
  layer: interface
  level: must
  when: >-
    The baseline revision is changed.
  then: >-
    It is changed only by a new version of this specification, which may name a later revision
    as its baseline.
  observable: >-
    An engine states which version of this specification it implements, and that version fixes
    the baseline it must support.
  vectors: []

- id: IFC-006
  layer: interface
  level: must
  when: >-
    An engine sends a call for a request or a hook to an implementation that carries Conduit's
    keys.
  then: >-
    The call declares Conduit's extension, under IFC-037, and its `_meta` holds
    `io.github.shrav-k.conduit/instance`, `io.github.shrav-k.conduit/operation`,
    `io.github.shrav-k.conduit/invocation`, `io.github.shrav-k.conduit/caller`,
    `io.github.shrav-k.conduit/filters`, `io.github.shrav-k.conduit/config`, which is the
    instance's configuration, and `io.github.shrav-k.conduit/revision`, which is the instance's
    revision. It also holds `io.github.shrav-k.conduit/idempotencyKey` when the caller
    supplied an idempotency key, or when the call is for a setup hook or a retire hook, to
    which the engine gives one under OPS-028, and `io.github.shrav-k.conduit/conduit` when the
    request came through a Conduit. None of them appears in the `arguments`. Every call that
    the engine sends for a request or a hook has a caller, so each holds
    `io.github.shrav-k.conduit/caller`.
  observable: >-
    The instance is given by its ID, the operation by its qualified reference, the invocation by
    the ID the engine gives every invocation, the caller by its ID, the Conduit by its ID, and
    the revision as REV-001 gives it. The configuration is the instance's as it is stored, its
    references in the resolved form of OBJ-009, and a place that `secret-reference.v1` governs
    holds only the reference, never a secret. So an implementation learns its instance's
    configuration, such as the directory it is to serve, from every request. The key
    `io.github.shrav-k.conduit/conduit` is absent for a setup hook and a retire hook, which are
    dispatched to the instance's own implementation through no Conduit, under TPL-017 and
    TPL-018; such a hook still carries the filters of the invocation of `set-up.v1` or
    `retire.v1` it belongs to, under ACC-018. The read of a secret is a request through the
    instance's own Conduit, and its caller is the one SEC-011 names. What
    `io.github.shrav-k.conduit/filters` holds is IFC-018. A contract of a submitted
    project is named by its qualified reference, `address#name`, with the address its manifest
    states, under SUB-008. A provider call is not a request, and the keys it carries are those
    PRV-005 names.
  vectors: []

- id: IFC-007
  layer: interface
  level: must not
  when: >-
    An engine sends a call for a request or a hook to an implementation marked `plain`.
  then: >-
    The call carries Conduit's keys.
  observable: >-
    The call's `_meta` holds only keys that the protocol itself defines, such as
    `io.modelcontextprotocol/protocolVersion`. Its `io.modelcontextprotocol/clientCapabilities`
    declares no extension of Conduit's, and what it declares is IFC-045's, so a server that
    needs a capability that the call does not declare, such as elicitation, answers with the
    protocol's error -32021, which IFC-010 reads as it reads any other error: failed for an
    operation whose contract states no `effect`, that is not a control and whose contract is not
    marked `startsModelWork: true`, and unknown for any other.
  vectors: []

- id: IFC-008
  layer: interface
  level: must
  when: >-
    An implementation receives a call that declares Conduit's extension at a `revision` that it
    does not support.
  then: >-
    It performs nothing and answers with the protocol's error -32021, and with no tool result.
  observable: >-
    The engine reads the implementation's result of `server/discover` before it sends a call
    under IFC-037, so this arises only where that result and the implementation disagree. The
    error says that the implementation performed nothing, so the invocation's outcome is failed,
    as for a result that states failed under IFC-009, and the record names the revision of
    Conduit's extension that the call declared.
  vectors: []

- id: IFC-009
  layer: interface
  level: must
  when: >-
    An implementation that carries Conduit's keys returns a result.
  then: >-
    The result's `_meta` holds `io.github.shrav-k.conduit/outcome`, with the value succeeded,
    failed or unknown, unless it holds `io.github.shrav-k.conduit/reason` in place of an outcome
    under IFC-026.
  observable: >-
    A result that holds neither key, or that holds both, or that holds for either key a value
    other than those named for it, has the outcome unknown, as OPS-007 states. A result that
    carries both an outcome and a reason is recorded as unknown, and its reason is not reported:
    the implementation has contradicted itself, so its statement that it performed nothing is
    not relied on. An implementation sets `isError` to true on a result that states failed or
    unknown, as the protocol has a tool report its own errors, and as IFC-026 states for a
    result that gives a reason. That result need not hold the operation's outputs: OPS-007
    checks the declared outputs of a result that states succeeded. A result whose `isError`
    disagrees with the outcome it states, which is one that states succeeded with `isError` true
    or one that states failed or unknown with `isError` not true, has the outcome unknown, as
    one that holds both an outcome and a reason has: a result that contradicts itself is trusted
    in neither part. The `isError` of the result that the engine gives a consumer is the
    engine's own, as IFC-025 states.
  vectors: []

- id: IFC-010
  layer: interface
  level: must
  when: >-
    An implementation marked `plain` answers a `tools/call` request.
  then: >-
    A complete result that is not an error is the outcome succeeded. An error on an operation whose
    contract states no `effect`, that is not a control and whose contract is not marked
    `startsModelWork: true`, as IFC-033 tests for `readOnlyHint`, is failed, including a JSON-RPC
    error for invalid parameters. A result whose `resultType` is `input_required` or is a value the
    engine does not recognize, any other error but one after which the engine sends the call once
    more under IFC-046, and no result at all, is unknown.
  observable: >-
    A result is complete when its `resultType` is `complete` or absent, and is an error when its
    `isError` is true. A protocol error is a JSON-RPC error. The protocol's code for invalid
    parameters is -32602, and an unknown tool is one case of it; arguments that the tool does not
    accept, and a request whose parameters are malformed, are others. That code gives no guarantee
    that a plain server has not acted: it is read as any other error, failed for the operation just
    described and unknown otherwise. An engine rejection before sending the call has its reason and
    no outcome under OPS-005. An error is failed only where the operation does nothing that the
    error could leave half done: one that states no `effect` changes nothing outside itself, under
    CTR-002, but a control applies values to its instance's settings, under CTR-006, and model work
    is the effect of an operation marked `startsModelWork: true`, under IMP-001, whether or not
    either states an `effect`. The protocol has a server answer -32021, naming in
    `data.requiredCapabilities` what it needs, where processing the request needs a capability that
    the request does not declare, and does not say that the server answers so before it acts: a
    plain server may have begun the effect by then. So that error is read as any other: failed for
    an operation that the table reads so, and unknown for any other, whose repeat is then not
    dispatched to the plain implementation, under OPS-012. The engine declares only what IFC-045
    lets it. An error after which the call is sent once more under IFC-046 ends nothing: the outcome
    is read from the response to the call sent again. The outcome the engine records for a plain
    server follows that table and nothing else, except that a result in which a declared output
    fails validation is unknown under OPS-007. Where the protocol's tasks extension is used, under
    IFC-016, the table applies to what the task ended with: the result of a task that completed, or
    the error of one that failed, such as -32021 where the task came to need a capability that the
    call did not declare. A task that was cancelled, and one that the server no longer holds, is no
    result at all.
  vectors: []

- id: IFC-011
  layer: interface
  level: must
  when: >-
    An operation's input or output is a handle: a top-level property of the operation's
    `inputSchema` or `outputSchema` whose schema is a `$ref` to
    `github.com/shrav-k/conduit/core#handle.v1`.
  then: >-
    On the wire it is an opaque string that the implementation issued. The engine passes it back
    unchanged and never interprets it. A handle permits nothing, and the implementation checks
    it on every call.
  observable: >-
    A call that carries a handle the implementation does not recognize has the outcome failed
    and performs nothing.
  vectors: []

- id: IFC-012
  layer: interface
  level: must
  when: >-
    An instance is the consumer of an open Conduit.
  then: >-
    The engine presents to that instance a Model Context Protocol server whose tools are exactly
    the operations that its open Conduits list and for which IFC-033 gives a definition, other
    than a control that the Conduit's target does not have, under TPL-013, and other than
    `get-secret.v1`, under SEC-007: for those no tool is presented. A tool for an operation is
    named by the Conduit's local name and the operation's export name, joined by a dot. The
    local name of a declared Conduit is the name its consumer's template gives it, and that of
    a Conduit instantiated on its own is the Conduit's own name.
  observable: >-
    The instance's tool list holds one tool for each operation of each of its open Conduits,
    apart from an operation whose contract the Conduit's target does not hold, under IFC-033, a
    control that the target does not have, because its type does not list it or its template's
    `controls` map leaves it out, under TPL-010 and TPL-013, and `get-secret.v1`, and nothing
    else: the engine presents no tool that belongs to no Conduit. A Conduit may list such a
    control, because its capability includes it under CON-017, and the instance is shown no tool
    for it all the same, so its tools show only the controls that its targets have, as IFC-033
    shows the narrowing of their inputs. A Conduit that lists `get-secret.v1` gives its consumer
    no tool for it; the engine's own read of a secret goes through that Conduit, under SEC-010.
    The list that the
    engine serves for a request depends only on the instance established for that request under
    IFC-022 and on which of that instance's Conduits are open when it is served. It depends
    neither on the connection nor on what was sent on it before: once a Conduit is opened or
    closed, every request of that instance is served the same list, on whatever connection it
    arrives. This specification takes the opening or the closing of a Conduit to be a change
    over time in what the instance is permitted, which the protocol allows of a tool list, and
    not a side effect of a request on a connection, which it forbids. That holds also where the
    consumer itself sent the request that opened or closed the Conduit. A call to a Conduit's
    tool is a request through that Conduit and is decided under the access convention. A tool
    name ends in the operation's version segment, because that segment is part of the export
    name under CTR-001. The declared Conduit `checkout` that lists an operation exported as
    `directory.read.v1` gives the tool `checkout.directory.read.v1`. Such a name uses only the
    characters that the protocol recommends for a tool name, which are ASCII letters, digits,
    `_`, `-` and `.`. A Conduit one of whose tool names would equal another tool's name is not
    instantiated, under IFC-014. What the definition of each tool holds is IFC-033. How the
    engine tells a consumer that its list has changed is IFC-038. A call that names a tool the
    engine does not present to the instance is a request that no open Conduit permits: it
    reports refused under ACC-001, whether the name was never presented or its Conduit has been
    closed. A call that names the tool that an open Conduit would give a control that its target
    does not have, where the target holds the control's contract, is the one exception: it is a
    request through that Conduit, and reports invalid under TPL-013, unless OPS-023 gives
    another reason first. The engine answers such a
    call as the protocol prescribes for an unknown tool at the revision in use, which at the
    baseline revision is the JSON-RPC error for invalid parameters, code -32602, with no tool
    result: the error's `message` says that no tool of that name is presented to the instance,
    and its `data` holds `io.github.shrav-k.conduit/reason` with the request's reason, which is
    refused but for that exception. At a revision that has a tool result answer such a call,
    that result holds the reason as IFC-025 states. The request is recorded with that reason,
    under REC-001.
  vectors: []

- id: IFC-013
  layer: interface
  level: must
  when: >-
    A Conduit is closed.
  then: >-
    Its tools are no longer presented to its consumer.
  observable: >-
    The next tool list that the engine serves to the consumer omits them. A consumer may hold a
    tool list for as long as the protocol lets it. A call to a tool that is no longer presented
    reports refused under ACC-011, and is answered as IFC-012 states.
  vectors: []

- id: IFC-014
  layer: language
  level: must
  when: >-
    A Conduit would be instantiated, and one of the tool names it would have under IFC-012
    equals the name of another tool that the engine presents, or would present once its Conduit
    is opened, to the same consumer.
  then: >-
    The Conduit is not instantiated.
  observable: >-
    Resolving returns a diagnostic naming the tool name and the Conduit that has the other. The
    other tools are those of the consumer's other Conduits that are not closed, whether or not
    they are open yet. A Conduit instantiated on its own under the local name of one of its
    consumer's declared Conduits is not instantiated where the two would have a tool name in
    common. No two tools presented to one consumer share a name, and none is longer than the 128
    characters that the protocol recommends: a local name is at most 63 characters under
    OBJ-001 and OBJ-022, and an export name at most 63 under NAM-004.
  vectors: []

- id: IFC-015
  layer: interface
  level: must
  when: >-
    An implementation makes an onward request on behalf of the instance it serves.
  then: >-
    It makes it as a client of the server the engine presents for that instance.
  observable: >-
    An implementation has no other way to reach another instance through the engine. Its onward
    requests name the invocation they serve under IFC-020, and are decided under ACC-016 and
    ACC-017. The engine gives an implementation reached by `remote` no `identity` and no
    credential that names an instance, under IFC-041, so in this version the engine gives it no
    means to make an onward request: its server may serve several instances, and a credential
    that named each of them would let it present as any. The onward requests that this
    specification provides for, a hook's under TPL-017 among them, come from an implementation
    that is run, with the `token` of its run, under PRV-022.
  vectors: []

- id: IFC-016
  layer: interface
  level: must
  when: >-
    One invocation outlasts its call: the operation's work finishes after its call returns.
  then: >-
    The protocol's tasks extension, `io.modelcontextprotocol/tasks`, which is an official
    extension outside the baseline revision, may be used where both sides of a call declare it,
    and the engine declares it on a call to an implementation only where the request that the
    call serves declared it. A `tasks/get`, `tasks/update` or `tasks/cancel` for the
    invocation's task, and a `subscriptions/listen` that names the task in `taskIds`, is decided
    anew, as a request of the instance whose request began the invocation through the Conduit
    through which the invocation was dispatched, and from any other instance reports refused.
    The extension never stands in for the idempotency key.
  observable: >-
    A caller that has no task, or that lost its result, learns the result by repeating its
    request with the same idempotency key through an open Conduit: the repeat reports
    conflict under OPS-032 while the invocation has not ended. Once it has succeeded, a repeat
    to which no filter applies is answered with the invocation's outputs under OPS-009 while
    the engine keeps them, and reports conflict under OPS-034 once it does not. Where a filter
    applies to the repeat, it is dispatched as a new attempt under OPS-024 where the operation
    states no `effect`, is not a control and does not start model work, and otherwise reports
    conflict under OPS-034, or, for an operation that declares no outputs, is answered with
    the outcome alone under OPS-009. A `tasks/get` through a Conduit that
    is no longer open reports refused, as any request through it does: a result that the
    response to the call did not carry is then not delivered, and the caller learns the outcome
    from the records, under ACC-034. This is one invocation, whose result is its own. Until it
    ends it is in progress: the instance that serves it may make onward requests that name it,
    under IFC-020, and they are decided like any other. Once it has ended no request is
    dispatched on its behalf, under ACC-019: no operation arranges, through the engine, work
    that outlasts its invocation. A task's ID establishes nothing: the protocol lets a server
    treat one as a bearer token, and the engine decides each such request for the instance that
    sent it, under IFC-022. A request of the extension for the task, or a `subscriptions/listen`
    that names it, that does not proceed, as a `tasks/get` through a Conduit that is no longer
    open, is answered with the JSON-RPC error for invalid parameters, code -32602, which the
    extension gives for a task that a server does not hold, and with no result, and the error's
    `data` holds `io.github.shrav-k.conduit/reason`, as IFC-012 answers a call to a tool that is
    not presented. The engine sends no `notifications/tasks` for the task to an instance whose
    `tasks/get` for it would be refused, as once that Conduit is no longer open, so a result
    that the response to the call did not carry reaches the caller in no notification either,
    under ACC-034. The engine answers none of the protocol's input requests of an
    implementation, such as an elicitation in a result whose `resultType` is `input_required` or
    in a task's `inputRequests`, and passes none on to a consumer: it declares no capability
    that one needs, under IFC-045, and such a result is read as IFC-009 and IFC-010 read it.
  vectors: []

- id: IFC-017
  layer: interface
  level: must
  when: >-
    The engine connects to an implementation item, one reached by `command`, `package` or
    `remote`, to send it requests for an instance.
  then: >-
    An item reached by `command` or `package` is run for the instance under PRV-007, and the
    engine reaches it over Streamable HTTP at the `url` that its runtime provider last reported
    for the run, in the result of `run.v1` or of `inspect-run.v1`; only the engine's own runner
    returns none, and the engine reaches the process it starts over stdio. An item reached by
    `remote` is reached over Streamable HTTP at the URL of its Remote, under IFC-041. To a run's
    `url`, and to an item reached by `remote` that is not `plain`, the engine sends nothing,
    `server/discover` among it, until the server's side has proved who it is, under PRV-028 for
    a run and by TLS for the host of its URL for such an item, it follows no HTTP redirect from
    either, and it presents on every HTTP request the proof of an enforcement point, by the
    mechanism of DL13, over a connection that keeps the request and its result confidential and
    unaltered as far as the side that checks the proof.
  observable: >-
    Toward a run, the server's side proves that it serves that instance by TLS, with the
    certificate that names the instance's ID, under PRV-028, whether the run's gate or the
    runtime provider's own end of its channel to the process that it started serves it, and a
    token in the form of a JWT-SVID names the instance's ID as its audience, never the `url`,
    which may change. Toward an item reached by `remote`, TLS proves the host of its URL,
    against the roots that DL13 states for it, and the form of the proof is IFC-041's. TLS, or
    the runtime provider's own channel, which PRV-025 has keep what crosses it confidential and
    unaltered, carries the request, so a value that a secret Resource's server on another
    machine returns reaches the engine unread and unaltered. In this version the engine is the
    only enforcement point, and the proof it presents is its own, never a consumer's, under
    IFC-030. Where the engine cannot verify who answers, nothing is dispatched: the part of the
    setup or of the retirement, or the request, that needed the item reports unavailable, and
    its record says why. A redirect leads to a server that has proved nothing for the instance,
    so the engine reads a response that redirects as no result: before anything is dispatched
    the server cannot be verified, and to a call it is the case of OPS-007 in which no result
    arrives. A plain item reached by `remote` is sent no proof and none of Conduit's
    keys, under IFC-007, and is reached as IFC-041 says. Who starts a process, and how, is the
    runtime provider's, which starts it on the machine of the instance's node, under PRV-019,
    and one run serves one instance, under PRV-007, so no two instances share a process.
    `run.v1` requires `url` of every runtime provider, and what a result that holds none gives
    is PRV-007. Where the engine's own runner runs the item, how it starts the process is the
    engine's own, and it runs only on the machine that `local` represents, under PRV-003; stdio
    reaches only the process it started, so no gate stands before it; which variables of the
    engine's environment the process receives is PRV-023, how it receives what `identity` holds
    is PRV-022, and what else it receives is DL16 of the implementation-defined list. Where that
    runner has no process for the instance's run, as once the process has ended, the engine has
    restarted or the part of the engine that held it has stopped, under DL17, nothing is sent: a
    request or a hook that needs it is not dispatched and reports unavailable, or its part does,
    as where the engine cannot verify who answers, until a further setup asks for the run again,
    under PRV-007. Two runs are asked for again before that: the run of a secret Resource that
    PRV-026 makes again before a read, and the run that a retirement asks for to serve its
    retire hook, under TPL-018. The promises of this file hold
    whatever runtime provider runs the item.
  vectors: []



- id: IFC-018
  layer: interface
  level: must
  when: >-
    An engine sends `io.github.shrav-k.conduit/filters` to an implementation under IFC-006.
  then: >-
    It is a list. Each item holds `requirement`, the qualified reference of a filter's
    requirement, and `arguments`, the arguments the filter is applied with. For a requirement of
    a submitted project the reference is `address#name`, with the address its manifest states,
    under SUB-008. The list holds every filter that applies to the request: the filters of the
    request's own Conduit, and those carried from the served invocation under ACC-017 or, for a
    setup hook or a retire hook, from the invocation of `set-up.v1` or `retire.v1` it belongs
    to, under ACC-018. A requirement of the core package is applied by the engine and is never
    sent. The list is empty when no filter applies.
  observable: >-
    Each filter on the Conduit named in `io.github.shrav-k.conduit/conduit`, and each filter
    carried from the invocation that an onward request or a hook serves, appears as one item. A
    requirement of the core package, `bound.v1` or `shared-host.v1`, does not appear: the engine
    applies it itself. An argument that is a reference is sent in the resolved form of OBJ-009,
    and the `arguments` of an item are the arguments as they are stored, with the defaults that
    NAM-019 and SCH-009 fill in. The implementation that the target has selected for the
    operation is sent every filter: CON-022 has it state each one in `supports`, matched by the
    same address and export name. Two filters that have the same requirement and equal
    arguments, as a filter of the request's own Conduit and one carried from a served
    invocation may, are two equal items, and nothing in an item says which it is. The read of a
    secret is sent only the filters of the instance's own Conduit through which it is made,
    under SEC-011.
  vectors: []

- id: IFC-019
  layer: interface
  level: must
  when: >-
    An implementation receives a call for a request or a hook whose
    `io.github.shrav-k.conduit/filters` is not empty.
  then: >-
    It applies every filter in the list to what the call asks it to do and to what it returns.
    If one of them forbids the call, or it cannot apply one of them, which it cannot where the
    filter's `arguments` hold an argument for an input that the version of the requirement that
    it supports does not declare, it performs nothing and answers with a reason in place of an
    outcome, as IFC-026 states.
  observable: >-
    Nothing that a call asks is performed with a filter it was sent left unapplied. A later
    release may add an optional input to a requirement, which states no `default` and so is sent
    only where a document writes it, under NAM-024, and CON-022 and ACC-015
    match a requirement without the version of its package, so an implementation built for an
    earlier release may be sent an argument that it does not know and that may narrow what the
    filter permits: it answers unavailable, and never ignores the argument. This holds
    for the call of a setup hook or a retire hook as for that of any request: the filters a hook
    is sent are those of the invocation of `set-up.v1` or `retire.v1` it belongs to, under
    ACC-018. The result gives the reason refused where a filter forbids the call, and
    unavailable where the implementation cannot apply one, and it names the filter in
    `io.github.shrav-k.conduit/restriction`, as IFC-026 states. Which requirements an
    implementation can apply is stated by `supports` in its manifest under PKG-019, and an
    implementation marked `plain` states none under PKG-020.
  vectors: []

- id: IFC-020
  layer: interface
  level: must
  when: >-
    An instance makes an onward request in order to serve an invocation it received.
  then: >-
    The request's `_meta` names that invocation in `io.github.shrav-k.conduit/serving`, by the
    ID the engine sent as `io.github.shrav-k.conduit/invocation`. The engine takes the onward
    request's caller, and the filters carried under ACC-017, from the served invocation.
  observable: >-
    The request that the onward target's implementation receives carries the served invocation's
    caller in `io.github.shrav-k.conduit/caller` and its filters in
    `io.github.shrav-k.conduit/filters`, whatever else the onward request states. An
    idempotency key that the onward request carries is scoped to the instance that sends it,
    as well as to that caller and to the onward target, under OPS-008. The engine reads
    `io.github.shrav-k.conduit/serving` and does not send it on: the request that the onward
    target's implementation receives holds the keys of IFC-006 and no other of Conduit's keys,
    and the record of the onward request holds it as the invocation it serves, under REC-002.
    The request carries Conduit's keys, so it declares Conduit's extension, under IFC-036: the
    protocol's extensions are disabled by default, and a client enables one only where its
    developer opts in.
  vectors: []

- id: IFC-021
  layer: interface
  level: must
  when: >-
    An instance that is not an actor, which is to say neither an Interface nor an Agent, makes a
    request that names no invocation in `io.github.shrav-k.conduit/serving`.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    A Resource's implementation that calls onward without naming the invocation it serves
    reports refused, whatever open Conduits the Resource is the consumer of. An Interface or an
    Agent that names none makes the request on its own behalf and is its caller. What a request
    reports that names an invocation which the sending instance does not serve is IFC-028.
  vectors: []

- id: IFC-022
  layer: interface
  level: must
  when: >-
    The engine receives a request on a server it presents to a consumer under IFC-012.
  then: >-
    The engine establishes which instance the consumer is for that request, from what that
    request presents and not from the address, machine, network, runtime provider or run it came
    from. The mechanism by which it does so establishes, from what the request presents, exactly
    one instance or none: the instance whose ID it names, while that instance exists, and none
    once it is removed, even where another instance has since taken its name. Where only whether
    that instance still exists cannot be read, the request establishes neither, and is decided
    under ACC-037. Wherever the request crosses machines it does so by a cryptographic proof of
    the instance that sent it. No consumer can present as another, except a program that can
    read the credential of another instance's run, as root and every program of the
    operating-system user that the run runs as can. What a request presents says who is asking
    and nothing more: the Conduits still decide what the request may do.
  observable: >-
    Every request the engine accepts is attributed to exactly one instance, established for that
    request alone and not from an earlier request: under mutual TLS, the certificate with which
    the request's TLS connection was made is part of what that request presents. Nothing that
    one consumer is able to present attributes a request to another instance, apart from the
    exception that the `then` states. The two forms of proof of DL13 each count as the
    cryptographic proof: mutual TLS, with certificates in the form of an X509-SVID, and a signed
    token in the form of a JWT-SVID, whose audience names the engine's address, which is the
    protocol's own authorization and which the engine's address always accepts, over TLS at an
    `https` URL, and without TLS at an `http` URL on loopback that DL13 gives a run, under
    IFC-042. What a request presents, and how the engine establishes the instance from it, is
    DL13 of the implementation-defined list. A run is given the engine's address and what it
    presents in the input `identity` of `run.v1`, under PRV-007, under the names that PRV-022
    fixes, and its
    runtime provider delivers them under PRV-022, on another machine as on the machine the
    engine runs on. Which runtime provider ran an instance, or on which machine, establishes
    nothing, under PRV-018. A run on the engine's own runner runs as the engine's own
    operating-system user unless DL16 states otherwise, and a program of that user can read the
    engine's keys and what every such run presents: it is inside the domain of trust, can
    present as any instance whose run is under that user, and can make the engine's proof to
    every gate, under PRV-025. An instance that is not to be trusted that far is given a runtime
    provider that runs it apart, such as in a container, under PRV-006. What a request reports
    from which no instance can be established is IFC-032, and what the engine does not pass on
    is IFC-030.
  vectors: []

- id: IFC-023
  layer: interface
  level: may
  when: >-
    A consumer makes a request through the server the engine presents to it.
  then: >-
    It supplies an idempotency key, which is a non-empty string, as
    `io.github.shrav-k.conduit/idempotencyKey` in the request's `_meta`.
  observable: >-
    The engine treats that value as the request's idempotency key under OPS-008 and sends it to
    the implementation under IFC-006. A request without the key carries no idempotency key
    and is a new invocation under OPS-011. The key does not appear in the `arguments`.
    A request that carries it declares Conduit's extension, under IFC-036.
  vectors: []

- id: IFC-025
  layer: interface
  level: must
  when: >-
    The engine answers a consumer's request.
  then: >-
    When the request has an outcome, the result's `_meta` holds
    `io.github.shrav-k.conduit/outcome`, with the value succeeded, failed or unknown. When it
    ended with a reason, whether the engine did not dispatch it or the implementation gave the
    reason under IFC-026, the result's `_meta` holds `io.github.shrav-k.conduit/reason`, with
    the value refused, invalid, conflict or unavailable. Where a restriction is why the request
    ended with a reason, the result's `_meta` also holds
    `io.github.shrav-k.conduit/restriction`, which names that restriction by its `requirement`
    and its `arguments`: the engine's own result carries it under the same key that an
    implementation uses under IFC-026. When the request has an outcome, or is a repeat that
    reports conflict under OPS-032 or OPS-034, the result's `_meta` also holds
    `io.github.shrav-k.conduit/invocation`, the engine's ID for the invocation that the request
    began or repeats. The result's `isError` is true where the request ended with a reason or
    its outcome is failed or unknown, and in no other case, and such a result carries none of
    the operation's outputs, `diagnostics` apart. A result whose `isError` is not true holds the
    operation's outputs in its `structuredContent` where the operation declares outputs.
    Where it declares no outputs, the result carries no `structuredContent`, except for
    error diagnostics as stated below. Where its `isError` is true, its
    `content` holds first one text block that states its reason or its outcome and says nothing
    that the rest of the result does not say. Where its outcome came from a result of an
    implementation marked `plain`, its `content` holds that result's `content`, unchanged, after
    that block where there is one.
  observable: >-
    A result for a request that has an outcome never carries `io.github.shrav-k.conduit/reason`, and
    a result for one that ended with a reason never carries `io.github.shrav-k.conduit/outcome`. The
    values are those of OPS-001 and OPS-005. `isError` keeps the protocol's meaning, the mark of a
    call that ended in an error, and the keys beside it say why: `io.github.shrav-k.conduit/reason`,
    or an outcome that is failed or unknown. A result whose `isError` is not true has the outcome
    succeeded. Where the operation declares outputs, its `structuredContent` conforms to the
    `outputSchema` of IFC-033, as the protocol requires of a tool that declares one. The protocol
    makes `outputSchema` optional. A client that sees one may prefer `structuredContent`; an empty
    map for an operation that declares no outputs would hide its `content`. Such a tool has no
    `outputSchema` and its successful result no `structuredContent`, preserving a plain result's
    content unchanged. The protocol's revision 2026-07-28 does not say whether a result whose
    `isError` is true must conform to `outputSchema`. This specification takes it that it need not:
    such a result carries no outputs, and may carry `diagnostics`. A result whose outcome is
    succeeded holds its outputs even where the Conduit through which its invocation was dispatched
    was closed before it ended, under ACC-034: the result of `retire-with-resources.v1`, whose
    Conduit CON-008 closes before it ends, is one. A repeat of an invocation that has not ended
    reports conflict under OPS-032, and one of an invocation that succeeded, of an operation that
    declares outputs, where no filter applies and the engine no longer keeps its outputs, or where a
    filter applies to the repeat and OPS-024 does not dispatch it, reports conflict under OPS-034;
    the `ruleId` of its error diagnostic tells the two apart, and its `isError` is true. What a
    request that is not dispatched says beyond its reason, and beyond the restriction it names, it
    says there: `diagnostics` in the `structuredContent` of its result is a list of diagnostics in
    the form of `diagnostic.v1`, whether or not the operation's contract declares an output of that
    name, as that of `register.v1` does. A result that reports invalid or conflict carries there an
    error diagnostic: one whose `level` is `error` and whose `ruleId` is the ID of the promise that
    decided the reason. A result that reports refused carries none, and says nothing there of the
    objects its request names, under OPS-023. The result of a rejected registration carries its
    diagnostics under OBJ-023, and that of a request to retire a Pool whose Resources are in the way
    names those Resources there, under LIF-020. A request that the engine does not dispatch because
    a restriction forbids it, or cannot be evaluated or applied, names that restriction in
    `io.github.shrav-k.conduit/restriction`, as ACC-008, ACC-014 and ACC-015 require. The ID in
    `io.github.shrav-k.conduit/invocation` is the one by which `reconcile.v1` names the invocation,
    under OPS-014, so a consumer learns it from the result, and a caller that lost a result repeats
    its request under OPS-009. A call that names a tool the engine does not present is answered as
    IFC-012 states: at the baseline revision with no tool result, its reason being in the `data` of
    the protocol's error. IFC-032 names another, and IFC-036 the requests that the protocol has a
    server reject with an error of its own. The `content` member is always present in a tool result,
    as the protocol requires, and may be an empty list where the result is not an error and its
    outcome did not come from a plain implementation. The text block of an error is there because
    the protocol has a client give its model a tool result that is an error, and lets it keep
    `_meta`, and a protocol error, from the model. The protocol recommends that a result with
    `structuredContent` also carry it serialized in `content`; whether the engine does so, and what
    else it puts there, is DL12 of the implementation-defined list. A plain implementation's
    `content` is passed on because an existing server answers in text, which no contract can
    describe, under CTR-012. The content of a succeeded plain invocation is kept and returned
    unchanged on a repeat under OPS-009 for as long as DL10 keeps outputs, whether or not the
    operation declares outputs; after its expiry a repeat reports conflict under OPS-034. It is
    never dispatched again to recover that content. This specification gives `content` no other
    meaning: an operation's outputs are in `structuredContent`.
  vectors: []



- id: IFC-026
  layer: interface
  level: must
  when: >-
    An implementation that carries Conduit's keys receives a call for a request or a hook, and
    a filter it was sent forbids the call, or it cannot apply a filter it was sent.
  then: >-
    It performs nothing of what the call asks and answers, in place of an outcome, with
    `io.github.shrav-k.conduit/reason` in the result's `_meta`. The value is refused where a
    filter forbids the call, and unavailable where the implementation cannot apply one. The
    result's `_meta` also holds `io.github.shrav-k.conduit/restriction`, whose value is the item
    of the list it was sent in `io.github.shrav-k.conduit/filters` that forbade the call or
    could not be applied, with its `requirement` and its `arguments`, and the result's `isError`
    is true.
  observable: >-
    A result that holds `io.github.shrav-k.conduit/reason` holds no
    `io.github.shrav-k.conduit/outcome`; one that holds both has the outcome unknown under
    IFC-009. An implementation gives a reason only in those two cases and only with those two
    values, and never after it has performed any part of what the call asks. IFC-019 states the
    obligation to apply every filter, and this promise the form of the result where one cannot
    be kept.
  vectors: []

- id: IFC-027
  layer: interface
  level: must
  when: >-
    The result of an implementation holds `io.github.shrav-k.conduit/reason`, with the value
    refused or unavailable, and no `io.github.shrav-k.conduit/outcome`, as IFC-026 states.
  then: >-
    The request ends with that reason and has no outcome.
  observable: >-
    The caller is told the reason, which a consumer receives as IFC-025 states, and the record
    of the request states it. The engine's own access decision was made before the call and
    permitted the request, as ACC-002 requires.
  vectors: []

- id: IFC-028
  layer: interface
  level: must
  when: >-
    A request names, in `io.github.shrav-k.conduit/serving`, an invocation that was not
    dispatched to the instance that sends the request, or one that is no longer in progress.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    Only the instance an invocation was dispatched to can name it, and only while it is in
    progress. This holds for an Interface and an Agent as for any other instance: a request from
    one of them that names such an invocation reports refused, and is not taken as made on its
    own behalf. A setup hook or a retire hook is an invocation dispatched to the instance, and
    its onward requests name it.
  vectors: []

# --- The names a version assigns.

- id: IFC-029
  layer: interface
  level: must
  when: >-
    A new version of this specification changes the prefix of Conduit's keys.
  then: >-
    A request or a result carries the keys of one version only. A request that the engine sends
    to an implementation declares Conduit's extension of that version at that version's
    `revision`, under IFC-037. A result is read by the prefix of its keys, which says which
    version it is written for, and an engine or an implementation that supports both versions
    reads each result by its own prefix. A request that a consumer or an instance sends to the
    engine with Conduit's keys is read at the revision of Conduit's extension that it declares,
    under IFC-036. A request that the engine receives from a consumer or an instance with keys
    under two prefixes cannot be read: it is not dispatched, and reports invalid.
  observable: >-
    A request that an implementation receives with keys under two prefixes is answered as
    IFC-008 answers a revision of Conduit's extension that it does not support. One that the
    engine receives from a consumer or an instance with keys under two prefixes reports invalid
    whatever else is wrong with it, because OPS-023 puts a request that cannot be read first.
    The prefix for this version is the one `names.yaml` states, and the name of Conduit's
    extension is that prefix followed by `implementation-interface`.
  vectors: []



- id: IFC-030
  layer: interface
  level: must not
  when: >-
    An engine sends a request to an implementation.
  then: >-
    The request carries what a consumer presented to the engine to identify itself.
  observable: >-
    The implementation is told who asks only by the IDs that IFC-006 names, the caller in
    `io.github.shrav-k.conduit/caller` and the Conduit in `io.github.shrav-k.conduit/conduit`,
    and an implementation marked `plain` is told nothing of it. Nothing that a request presents
    under IFC-022, whatever DL13 of the implementation-defined list makes it, appears in the
    `arguments`, in the `_meta` or in what the transport carries to the implementation.
    The proof that the engine presents to an implementation's gate, under IFC-017 and IFC-041,
    is the engine's own as an enforcement point, and never what a consumer presented.
    A provider call is not a request, under PRV-005: the input `identity` of `run.v1` carries
    what a run is to present, and its runtime provider keeps it under PRV-022.
  vectors: []

- id: IFC-031
  layer: interface
  level: must not
  when: >-
    An implementation that carries Conduit's keys calls a service outside, which is one that it
    does not reach through the server the engine presents under IFC-012.
  then: >-
    It forwards Conduit's keys to that service.
  observable: >-
    A request that the implementation makes of such a service holds no key that begins
    `io.github.shrav-k.conduit/`, in its `_meta` or anywhere else. An onward request through
    the engine is not such a call: it names the invocation it serves under IFC-020.
  vectors: []

- id: IFC-032
  layer: interface
  level: must
  when: >-
    The engine receives a request on a server it presents under IFC-012, other than one that the
    protocol has a server reject with an error or an HTTP status of its own under IFC-036, and
    what the request presents establishes no instance, under IFC-022.
  then: >-
    The request is not dispatched, and reports refused.
  observable: >-
    A client of the Model Context Protocol that is not an instance, or that presents nothing
    from which the engine establishes one under IFC-022, can use no tool: each of its calls
    reports refused, and no implementation receives a call. The engine presents no tool to such
    a client, so it answers each call as IFC-012 states for a tool that is not presented. The
    record of such a request holds no caller, and says that none could be established, under
    REC-002. A credential that names an instance that has been removed establishes none, under
    IFC-022, so a run left on a machine after its instance was removed reaches nothing through
    the engine. Where what a request presents is a credential of the protocol's own
    authorization on an HTTP transport, a request whose credential is missing or invalid is
    answered as the protocol requires, with the HTTP status it prescribes, which is 401 for a
    credential that is missing or invalid, and with no tool result. It is recorded as refused
    all the same. A
    request that the protocol has a server reject with an error of its own, because it cannot be
    read as a request for a tool, is IFC-036, whoever sent it. Where what a request presents is
    a credential that is valid in every other way, and only whether the instance it names still
    exists cannot be read, as where the part of the engine that receives it is cut off from the
    store of the engine's state, under DL17, it has established neither that instance nor none:
    the request is decided under ACC-037, reports unavailable, and is answered with no 401, so
    that a client does not discard a credential that is good. Its record holds no caller, under
    REC-002.
  vectors: []



- id: IFC-033
  layer: interface
  level: must
  when: >-
    The engine presents a tool for an operation to a consumer, under IFC-012.
  then: >-
    The tool's definition is derived from the Operation contract as the target holds it. Its
    `inputSchema` and `outputSchema` are the contract's own, except that, for a control, the
    `required` of its `inputSchema` lists `revision` alone, under REV-006, and an input that
    the target's definition narrows under TPL-010 has the schema `{allOf: [a, b]}`, where `a`
    is the contract's schema for the input and `b` the schema that the template added. They
    are made to hold every schema they refer to. Each Schema contract that a `$ref` in them
    names, directly or through another such contract, has one copy of its schema under the
    `$defs` of the root, keyed by the contract's qualified reference, with `@` and the version
    of the package or the project that holds it put after the address where a version is
    stated. Each `$ref` is rewritten to refer to what it referred to where it was written, as
    SCH-015 resolves it there: a JSON Pointer to the same place, and a reference to a contract
    to that contract's copy. Every keyword written beside a `$ref` is kept. A `$ref` to a
    contract whose schema holds no `$ref`, and beside which no keyword is written, may instead
    be replaced by that schema, and a copy to which no `$ref` then refers may be left out. Its
    `description` is the contract's `metadata.description` where the contract states one. Its
    `annotations` hold `readOnlyHint` true exactly where the contract states no `effect`, is not
    a control and does not start model work, and hold `idempotentHint`, `destructiveHint` and
    `openWorldHint` as the contract states them. Where the version of the operation's package
    that the target holds has no contract of the operation, no definition can be derived, and no
    tool is presented for the operation.
  observable: >-
    A handle, whose schema is `github.com/shrav-k/conduit/core#handle.v1`, is so given the schema of
    a string, in place or as a copy, which is what IFC-011 makes it on the wire. JSON Schema
    resolves a `$ref` that is a JSON Pointer against the root of the schema that holds it, so a
    contract's schema written in the place of a `$ref` would send its own pointers, such as
    `#/$defs/name`, to the tool's root, and a contract that refers to itself, directly or through
    others, has no finite form written in place. With one copy of each contract and every `$ref`
    rewritten, a value is valid against the definition exactly when it is valid against the
    contract's own schemas under SCH-001 and SCH-015, and, for a control, against the template's
    too, under TPL-011. The definition can be read with no package at hand, and every `$ref` in it
    is local, as the protocol lets no implementation dereference on its own a `$ref` that resolves
    to a network URI. Two contracts of one name, reached through two versions of one package under
    NAM-014, have two copies, since the key holds the version. A key is not a reference, and no
    document writes one. A `$ref` to a copy is `#/$defs/` and the key, with `~` written `~0` and `/`
    written `~1`, as RFC 6901 escapes a reference token, and `#` written `%23`, as a URI fragment
    needs: the copy of `example.org/acme/files#path.v1` from version 0.3.0 is under the key
    `example.org/acme/files@0.3.0#path.v1`, and a `$ref` to it is
    `#/$defs/example.org~1acme~1files@0.3.0%23path.v1`. Where the contract's own schema states
    `$defs` at its root, as CTR-012 lets an operation that is not a control, its members keep their
    keys beside the copies. A key of the form given above for a contract's copy, a qualified
    reference with `@` and the version after the address where a version is stated, is reserved in
    the root `$defs` of every schema an author writes. A document that uses one there is rejected
    under IFC-033 when its package is installed or when it is submitted, with a diagnostic naming
    the reserved key and its position in the document. This applies whether or not publication would
    reach a contract with that key. The definition is the engine's, made for the wire: CTR-012 and
    the profile govern the contract's schemas and not the definition, and the engine checks a
    request and a result against the contract and the template, under NAM-023 and TPL-011, so the
    definition changes nothing that the engine accepts. Which `$ref` the engine replaces where it
    may is DL12. Where a control's contract gives the input `limit` the schema `{type: integer,
    maximum: 100}` and the target's template adds `{maximum: 50}`, the tool gives `limit` the schema
    `{allOf: [{type: integer, maximum: 100}, {maximum: 50}]}`, so a caller that follows it does not
    send 75, which TPL-011 would report invalid. A control that the target does not have has no
    tool, under IFC-012. Where the consumer, the Conduit and the target hold different versions of
    the contract's package, the definition is that of the version the target holds, as NAM-023
    states. A result of the tool that is not an error conforms to `outputSchema` where the operation
    declares outputs, and IFC-025 says which results are errors. Where `readOnlyHint` is not true,
    and where the contract does not state one of the other three hints, that hint is left out of
    `annotations`, and the protocol's default for it holds. A Conduit may list an operation that a
    later release of a package added to a capability, under NAM-024, while its target holds an
    earlier version that has no contract of that name. No tool is presented for that operation, and
    a call that names it is answered as IFC-012 answers a call to a tool that is not presented: it
    reports refused. The tool of an operation that declares no outputs has no `outputSchema`, and a
    result of it that is not an error has no `structuredContent`, under IFC-025. The protocol makes
    the schema optional; a client that sees one may prefer the structured result, and an empty map
    would hide the content, including a plain read's text. The tool of an operation whose contract
    states no `inputSchema`, and so declares no inputs, has the `inputSchema` `{type: object}`,
    since the protocol requires one of every tool, and its call carries no arguments, under IFC-001.
  vectors: []



- id: IFC-036
  layer: interface
  level: must
  when: >-
    The engine receives, on a server it presents under IFC-012, a request that the protocol has
    a server reject with an error or an HTTP status of its own: one whose `Origin` header is
    present and is not one that the engine accepts, which the protocol has a server answer with
    HTTP 403, one that lacks a key the protocol requires in its `_meta`, one whose parameters do
    not have the form of a `tools/call` request, one whose headers on an HTTP transport are
    missing or disagree with its body, or one that carries any of Conduit's keys and does not
    declare Conduit's extension, in `io.modelcontextprotocol/clientCapabilities`, at a revision
    that the engine lists, which the protocol has a server answer with the error -32021, whose
    `data.requiredCapabilities` names the extension at `v0`.
  then: >-
    The engine answers it as the protocol states, with that error or that status and with no
    tool result, whoever sent it. Where the engine could establish, under IFC-022, the instance
    that sent the request, the request is not dispatched, and reports invalid: it is recorded
    so, and the error, where the response carries one, holds in its `data`
    `io.github.shrav-k.conduit/reason` with the value invalid. Where it could establish none,
    the request is not recorded.
  observable: >-
    No implementation receives a call. Such a request cannot be read as a request for an
    operation, which is the first case in the order of OPS-023. The error, its code and, on an
    HTTP transport, the status are the protocol's, and this specification repeats none of them,
    under IFC-001. An error's `data` may hold what the server defines, as it holds the reason
    in the error of IFC-012. IFC-032 is about a request that can be read as the protocol
    requires: one that cannot is answered here, whether or not an instance can be established
    from it. Where none can, the error holds no reason of Conduit's, and no record is kept,
    which REC-001 excepts. A request at a revision of the protocol that the engine does not
    support is answered with the protocol's error for an unsupported version, and with no tool
    result either. That error is part of the negotiation of IFC-003: the consumer's client sends
    the request again at a revision both sides support, so the first is not a request that
    ended, and nothing is recorded as invalid for it. A request that carries none of Conduit's
    keys needs no declaration, so a consumer that knows nothing of Conduit is not answered so.
    The declaration counts for the request that makes it alone, as the protocol's tasks
    extension has a server act on an extension only as each request declares it, whatever
    earlier requests declared. IFC-025 says what the result of every
    other request holds.
  vectors: []



- id: IFC-037
  layer: interface
  level: must
  when: >-
    The engine is to send a call that carries Conduit's keys to an implementation, for a request
    or a hook, or to make a provider call under PRV-005 to a provider's implementation item.
  then: >-
    Before its first call to each run of the implementation, and to an item reached by `remote`
    at each connection that a setup or a retirement makes to it under IFC-041, the engine reads
    the implementation's result of `server/discover`, and it may read it again at any time. It
    declares Conduit's extension, `io.github.shrav-k.conduit/implementation-interface`, with
    `revision` at `v0` in its settings object, on each call, in
    `io.modelcontextprotocol/clientCapabilities`. Where that discovery result does not list the
    extension at the revision `v0`, the request, the hook or the provider call is not dispatched
    and reports unavailable, its record names the missing extension, and it is never sent
    without Conduit's keys.
  observable: >-
    The revision `v0` is that of this version of the specification. The engine never falls back
    to sending such a call as it would to a plain implementation: only an implementation
    marked `plain` is sent none of Conduit's keys, under IFC-007, and the engine declares no
    extension of Conduit's to it. What else a call declares beside the extension is IFC-045's.
    No plain implementation implements an operation of
    `runtime-provider.v1`, `machine-provider.v1` or `package-source.v1`, under PKG-020, so every
    provider call declares the extension. A provider whose discovery result lacks the extension
    serves no provider call, as the kubelet registers no Node whose container runtime lacks the
    v1 CRI API; what the part, the request or the call that needed it then reports is PRV-005's.
    The engine's own implementations of PRV-003 are reached by no server of the protocol, and
    this promise does not cover them. The engine reads it for each run and at each connection,
    whatever caching hints it carries, so a discovery result read for one run or one connection
    is not taken for another. What an implementation answers to a request that declares a
    revision it does not support is IFC-008.
  vectors: []

- id: IFC-038
  layer: interface
  level: must
  when: >-
    The engine presents its server to an instance, under IFC-012.
  then: >-
    The server declares the `tools` capability with `listChanged`, and its result of
    `server/discover` lists Conduit's extension,
    `io.github.shrav-k.conduit/implementation-interface`, with `revision` at `v0` in its
    settings object, under `capabilities.extensions`. When the tool list that IFC-012 gives the
    instance changes, the engine notifies each stream on which a request of that instance asked
    to be told, with the protocol's notification that the tool list changed. Every tool list
    that the server serves carries `cacheScope: private`.
  observable: >-
    A consumer that asked learns that one of its Conduits was opened or closed without asking
    for the list again. The list depends on the instance for which it is served, so it is
    private in the protocol's sense, and the protocol forbids a cache to share it across
    authorization contexts. The next list that the engine serves is the one IFC-012 gives,
    whether or not a notification was sent or received. A consumer learns from the discovery
    result at which revision to declare Conduit's extension on a request that carries Conduit's
    keys, under IFC-036.
  vectors: []

- id: IFC-039
  layer: interface
  level: must
  when: >-
    The engine, a consumer or an implementation carries trace context on a request.
  then: >-
    It carries it only in the keys of the request's `_meta` that the protocol reserves for trace
    context, as OpenTelemetry's semantic conventions for the protocol give them.
  observable: >-
    Conduit defines no key of its own for trace context, and no key under the prefix of
    Conduit's keys holds any. What trace context a request carries changes nothing that the
    engine decides, under IFC-040.
  vectors: []

- id: IFC-040
  layer: interface
  level: must not
  when: >-
    A request that the engine receives carries trace context.
  then: >-
    The engine takes from it the request's caller, a restriction, or any part of an access
    decision.
  observable: >-
    A request is decided, and its caller and its filters are given under IFC-006, IFC-018
    and IFC-020, as they would be without trace context or with any other value of it. The
    instance that sent a request is part of every access decision, so the mechanism of IFC-022
    does not establish it from trace context either.
  vectors: []

- id: IFC-041
  layer: interface
  level: must
  when: >-
    The engine connects to an implementation item reached by `remote` to serve an instance, as
    a part of the instance's setup under TPL-012, or of its retirement to serve its retire hook
    under TPL-018.
  then: >-
    On every HTTP request of that connection, it sends each header that the item's `headers`
    names, with the value at the place that `headers` gives for it in the instance's
    configuration as it stood when the connection was made, converted as PRV-007 converts a
    value; where that place holds null, the header is not sent. Where that place is one that
    `secret-reference.v1` governs, the value sent is the secret read under SEC-013, or again
    under SEC-023, and not the reference. It connects to an item whose Remote's URL has a
    loopback host, as SEC-024 names them, and sends on a connection to one, only on an engine
    that, as configured then, can neither restart on another machine nor run as several parts;
    otherwise it makes no connection and sends nothing, and the part, or the request that was to
    be sent on the connection, is not dispatched and reports unavailable. To an item that is not
    `plain`, it connects only at an `https` URL, and every HTTP request of the connection also
    carries the proof of an enforcement point: by mutual TLS, or as the protocol's own
    authorization, a token whose audience is the item's canonical URI, either in the form of a
    JWT-SVID that the mechanism of DL13 signs, or issued to the engine, under the protocol's
    extension for client credentials, by an authorization server that the item's protected
    resource metadata names and that is the one DL13 states or one that the user has configured
    for the item's URL, under DL13, to which the engine authenticates with its own credential of
    DL13.
  observable: >-
    The connection serves that one instance, so no header's value reaches a request for
    another instance. The connection is the engine's holding of the header values, as SEC-013
    states, and a failed HTTP request does not end it. A secret's value is sent only to that
    item's URL and held only for that connection, under SEC-013, and only where SEC-024 lets
    it go on the engine as it is configured when the value is sent: to an `https` URL, or to
    an `http` URL whose host is a loopback address on an engine that, as configured, can
    neither restart on another machine nor run as several parts, under DL17. Where the read
    does not succeed no connection is made, under SEC-012. Where the engine has lost the
    values that a connection held, as after it restarts, on its machine or on another, it
    reads the secrets again under SEC-023 before it sends them, by the references that the
    setup which made the connection read, and sends every other header with the value that the
    setup took, which it keeps with the connection: a restart changes nothing that a
    connection carries. An item that is not `plain` takes Conduit's keys, so its server is its
    own gate under PRV-025: it checks the engine's proof itself, its operator having
    configured it to admit only a credential that names the engine's credential ID, which the
    engine's conformance document states under DL13, so that no instance's credential passes.
    Under the protocol's authorization, its protected resource metadata names as its
    authorization server the one that DL13 states, or one that the user runs, has configured
    for the item's URL and that issues tokens to the engine as a client registered in advance,
    under the protocol's extension for client credentials, whose flow leaves to the client
    which server it uses. The engine asks no other server for a token: one that only the
    metadata names, and that serves another item, could ignore the `resource` that RFC 8707
    has the engine send, and issue a token that the other item admits and that the item which
    received it could present there. The engine authenticates to that server with its own
    credential, as a JWT assertion under RFC 7523, so it holds no client secret outside every
    Conduit, and the server admits only a token that names the engine as that client. A server
    that cannot be so configured is used as `plain`, and is sent no proof and none of
    Conduit's keys. An item that is not `plain` at an `http` URL is rejected by
    `implementation-item.v1`, under SUB-005, as IFC-044 requires. The names that `headers` may
    give are those the item's Remote declares, under MAN-010, and an item that is not `plain`
    names no `Authorization`, under IFC-043. A `remote` item that names no headers is sent
    none. Beside these headers the engine sends what the protocol and its transport require,
    and never what a consumer presented to identify itself, under IFC-030.
  vectors: []



- id: IFC-042
  layer: interface
  level: must
  when: >-
    A consumer sends a request to the engine's address at an `https` URL, or at an `http` URL on
    loopback that DL13 gives a run in `CONDUIT_URL`.
  then: >-
    The engine accepts, as what the request presents under IFC-022, a signed token in the form
    of a JWT-SVID, sent as the protocol's own authorization in the `Authorization` header, whose
    `sub` names the instance and whose audience is the engine's address as its canonical
    `https` URI, whatever other form of proof DL13 offers beside it. At such an `http` URL it
    accepts in the same way the token that the run was given in `token`.
  observable: >-
    So any client of the protocol that supports its authorization, or that can be configured to
    send an `Authorization` header, can connect as an Agent from another machine, with no client
    certificate, which many clients cannot present. A run finds its token in the file of
    `identity` that PRV-022 names for it, which every run is given, under PRV-007. A consumer
    that follows the protocol's authorization gets its token from the authorization server that
    DL13 states, by a grant that DL13 states, which names the instance that DL13 decides and has
    the engine's address as its audience, and no consumer is issued one for another receiver,
    under DL13. The engine's address, as a consumer on another machine reaches it, is an `https`
    URL, and the server there publishes the protected resource metadata of RFC 9728 that the
    protocol's authorization requires, naming that authorization server. A token whose audience
    is another receiver, or that names an instance that has been removed, establishes no
    instance, and the request is answered with the HTTP status 401, under IFC-032. Mutual TLS
    may be accepted beside it, under DL13. The engine establishes nothing from the machine that
    a request came from, under PRV-018, so it accepts the token at its `https` address whichever
    machine a request comes from. Where DL13 gives a run an `http` URL on loopback, under the
    condition that it states, the engine accepts the run's `token` there too, beside any other
    means that DL13 offers there, so that a harness that sends `token` to `CONDUIT_URL` works
    under every engine, under PRV-022.
  vectors: []

- id: IFC-043
  layer: language
  level: must
  when: >-
    An implementation item reached by `remote` and not marked `plain` names `Authorization`, in
    any case of its letters, in its `headers`.
  then: >-
    The item is rejected.
  observable: >-
    The item is rejected by `implementation-item.v1`, under SUB-005, with a diagnostic naming
    the item and the header, wherever it is read, whichever engine reads it. The engine
    presents its own proof to such an item under IFC-041, and in the form of a token that
    proof is the protocol's own authorization, which the `Authorization` header carries; a
    value from configuration there would be the same for every request, and proves nothing of
    who sent it. A plain item may name the header, since the engine presents it no proof, and
    a header that carries a secret goes only where SEC-024 lets it go.
  vectors: []



- id: IFC-044
  layer: language
  level: must
  when: >-
    An implementation item reached by `remote` and not marked `plain` has a Remote whose `url`
    is not an `https` URL.
  then: >-
    The item is rejected.
  observable: >-
    The item is rejected by `implementation-item.v1`, under SUB-005, with a diagnostic naming
    the item and the URL, wherever it is read, whichever engine reads it. The engine connects
    to such an item only at an `https` URL, once TLS has proved the host of its URL, under
    IFC-041 and IFC-017, which unencrypted `http` cannot prove, so no engine could connect to
    it, and an engine rejects a document that it cannot honor rather than accept it and ignore
    a part of it. A local server that takes Conduit's keys runs as a `command` or `package`
    item on the engine's own runner, over stdio, which needs neither TLS nor a gate. A plain
    item may stand at an `http` URL, where SEC-024 lets it: not at one whose host is not a
    loopback address where it carries a secret, in a header or as the value of
    `get-secret.v1`, and at no loopback host on an engine that, as configured, can restart on
    another machine or run as several parts. So an `http` URL on loopback serves a plain
    server alone, on an engine that can do neither.
  vectors: []



- id: IFC-045
  layer: interface
  level: must
  when: >-
    The engine sends a call to an implementation, for a request or a hook, whether or not the
    call carries Conduit's keys, or makes a provider call under PRV-005.
  then: >-
    In the call's `io.modelcontextprotocol/clientCapabilities` it declares no capability but
    Conduit's extension, where IFC-037 has it declare it, and the tasks extension, where IFC-016
    lets it.
  observable: >-
    A call to an implementation marked `plain` declares no extension of Conduit's, under IFC-007
    and IFC-037, so it declares at most the tasks extension. The engine answers none of the
    protocol's input requests, under IFC-016, so it declares no capability that one needs, such
    as elicitation. The protocol has a server rely on no capability that a request does not
    declare, and answer with the error -32021, whose `data.requiredCapabilities` names what it
    needs, where processing the request needs one. It does not say that a server answers so
    before it acts, so the error shows nothing of an effect by itself: from a plain
    implementation it is read as IFC-010 reads any other error, failed for an operation whose
    contract states no `effect`, that is not a control and whose contract is not marked
    `startsModelWork: true`, and unknown for any other. An implementation that carries Conduit's
    keys answers so only where it has performed nothing, under IFC-047, so the outcome is then
    failed under OPS-007, as for the error of IFC-008 that names Conduit's extension.
  vectors: []

- id: IFC-046
  layer: interface
  level: must
  when: >-
    An implementation rejects a call that the engine sent it with the protocol's error -32020,
    because the call's `Mcp-Param` headers are missing or disagree with its body, or with the
    protocol's error for a revision that it does not support, and the engine has not sent that
    call once more already.
  then: >-
    After -32020 the engine sends the call once more only for an operation whose contract
    states no `effect`, that is not a control and starts no model work; it first reads the
    implementation's `tools/list` again. Otherwise it ends the invocation
    unknown and sends nothing more. After an error for the revision it sends the call once
    more at a revision that both support, where there is one. The two are one call, and what
    it ends with is read from the response to the second.
  observable: >-
    The protocol's -32020 gives no guarantee that a plain server has not acted, so an effectful
    call is never repeated after that code. A deduplicates mark does not authorize a resend,
    and neither does an annotation's idempotentHint. A plain call receives no idempotency
    key under IFC-007. The protocol has a client
    read the tool list again after -32020, and send a call again at another revision after a
    version error, under IFC-001 and IFC-003; the safety condition above governs the resend
    after -32020. A call for a request or a hook sent so is
    one dispatch of one attempt, under IMP-007, and one invocation, not two: its first error is
    read neither as an outcome, under IFC-010 and OPS-007, nor as a reason. Where no revision
    is supported by both, or the second call is rejected again, nothing more is sent, and that
    error is read as IFC-010 and OPS-007 read any other. A provider call sent so is one
    provider call, under PRV-005.
  vectors: []



- id: IFC-047
  layer: interface
  level: must
  when: >-
    An implementation that carries Conduit's keys answers a call that the engine sent it with
    the protocol's error -32021, because processing the call needs a client capability that the
    call does not declare.
  then: >-
    It answers so only where it has performed nothing for the call: it does not begin to perform
    a call whose processing may come to need a client capability that the call does not declare.
  observable: >-
    The protocol has a server answer -32021 where processing a request needs a capability that
    the request does not declare, and does not say that the server answers so before it acts, so
    this is Conduit's own obligation on an implementation written for it, as IFC-008's is for
    the error that names Conduit's extension. The protocol also has a server rely on no
    capability that a request does not declare, so an implementation keeps both rules, and this
    promise, only by finding before it acts whether processing the call needs one. It can: the
    call states what it declares in `io.modelcontextprotocol/clientCapabilities`, which is
    little under IFC-045, so an implementation written for Conduit relies on nothing beyond it
    and never comes to need an undeclared capability once it has begun, inside a task or not.
    One that came to need one after it had begun would break this promise, since the protocol
    then has it answer -32021. Where it answers so, the outcome of a call for a request or a
    hook is failed under OPS-007, and a repeat of the request is dispatched as a new attempt
    under OPS-024. A plain implementation, which carries none of Conduit's keys, is bound by no
    such promise: IFC-010 reads its -32021 as any other error.
  vectors: []
