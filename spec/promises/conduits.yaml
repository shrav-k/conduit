# Conduits: what a Conduit is, when it exists, and when it is open.
# Owner rulings of 2026-11-05 (plan-audit rulings 17 to 20, 28, 29, 32 and 33). A Conduit has
# the lifecycle every instance has (conventions/lifecycle.yaml): to open one is to set it up,
# and to close one is to retire it. CON-005 was removed as a duplicate of PLC-006, and CON-009
# was folded into LIF-007. Removed by consolidation pass 1: CON-010 was folded into LIF-008, and
# CON-015 into LIF-001, LIF-003, LIF-005 and LIF-006. The follow-up rulings removed nothing.
# The ruling on the core package and the schemas (ruling 37) changed CON-003, CON-016 to
# CON-018 and CON-026, and added CON-028. The conversion of the older text (decision DA3 of the
# docs audit, docs/proposals/docs-audit/GAPS.md) changed CON-003 and added CON-029. The second
# round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed CON-004, CON-008,
# CON-020, CON-022, CON-024 and CON-028, and removed none. Its closing pass
# (docs/proposals/reaudit/round-2/log-closing.md) changed CON-022: the implementation of the
# target always states a filter's requirement. It also wrote "composite" where CON-003,
# CON-016, CON-019 and CON-020 said "composition" of a Conduit template, a word that is kept
# for a composed requirement. Its last pass (docs/proposals/reaudit/round-2/log-tail.md)
# changed CON-008, CON-018 and CON-022, and added CON-030: a Conduit whose consumer is retired
# is closed once the consumer's shutdown is confirmed, and a requirement that does not narrow
# requests is applied to a Conduit only where it is the core package's. The follow-up to that
# pass changed CON-018, CON-022, CON-023 and CON-030, which judges a composition by its
# constituents alone, and added CON-031, of the layer `convention`: a Conduit either of whose
# ends is retired is not opened. Draft: no vector exists yet.
# The fix pass of the third round of the re-audit (docs/proposals/reaudit/round-3/log-fixes.md),
# on the coordinator's decisions in docs/proposals/reaudit/round-3/DECISIONS.md, which ruling 39
# accepted, changed CON-008, CON-022, CON-028, CON-030 and CON-031: a graph written in
# place supports a requirement where the implementations of its steps do, and CON-031 is about a
# Conduit that is not open. It removed none.
# Its follow-up, on the decisions of the section "The fix pass, and what it left" of the same
# file, which are the coordinator's too, changed CON-008 and CON-022: no graph states
# `supports`, wherever it is written.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which ruling 39 accepted, changed
# CON-004, CON-008 and CON-024: a declared Conduit that is made from a composite template is
# opened as a whole or not at all. It added none and removed none.
# The follow-up to that pass, on the decisions of the section "The fix pass, and what it left"
# of the same file, which are the coordinator's too, changed CON-004, CON-008 and CON-022: the
# opening of a composite declared Conduit is decided for every component before any is opened,
# and nothing is closed where one cannot be.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 38 of the owner (docs/proposals/ruling-38/README.md, 2026-11-06) changed this file;
# what changed is in docs/proposals/ruling-38/log-spec.md.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review (docs/proposals/principles-review/README.md), removed CON-003, CON-019 and
# CON-029, on composite Conduit templates (decision 5): a template that needs two capabilities
# of one target declares two Conduits, and nothing else replaces them; CON-026, on renaming a
# Conduit (decision 10): a name is fixed once the object is made, under OBJ-011; and CON-030, on
# a requirement that does not narrow (C20): a requirement of the core package is applied by the
# engine and any other is a filter, under CON-018. It changed CON-001, CON-002, CON-004,
# CON-007, CON-008, CON-016, CON-018, CON-020, CON-022, CON-024, CON-028 and CON-031: CON-004
# now carries what GRA-022 and GRA-003 said of declared Conduits, and a closed Conduit is
# removed. It added none. What changed is in docs/proposals/ruling-41/log-G3.md. The removed
# IDs are not reused.

- id: CON-001
  layer: language
  level: must
  when: >-
    A Conduit template is instantiated.
  then: >-
    Each resulting Conduit has exactly one consumer, exactly one target and exactly one
    capability.
  observable: >-
    Resolving yields one Conduit, with one consumer reference, one target reference and one
    capability. A document that supplies more or fewer of any of them is rejected with a
    diagnostic, and no Conduit is produced.
  vectors: []

- id: CON-002
  layer: language
  level: must
  when: >-
    A template that declares Conduits is instantiated.
  then: >-
    One Conduit is instantiated for each declared Conduit, with the new instance as its
    consumer.
  observable: >-
    The resolved objects contain the new instance and those Conduits, each naming the new
    instance as consumer.
  vectors: []

- id: CON-004
  layer: convention
  level: must
  when: >-
    An instance that declares Conduits is set up.
  then: >-
    The opening of each declared Conduit is a part of the setup, under the declared Conduit's
    name. Where the Conduit made for it is in the state registered, the part is a request for
    `open.v1` that names that Conduit, made by the instance that sent the request to set up,
    under ACC-005. Where that Conduit is open, nothing is dispatched and the part counts as
    succeeded. Where the nested instantiation has no Conduit that is not retired, the part
    reports conflict. Setup instantiates no Conduit.
  observable: >-
    After setup runs a second time, inspection shows the same Conduit IDs and the same number of
    Conduits as before. A declared Conduit whose Conduit was closed has none that is not
    retired, since a closed Conduit is removed under LIF-035, so its part reports conflict until
    a replacement is registered under LIF-009, as LIF-008 states. That replacement is in the
    state registered, so the next setup opens it. Whose Conduit to `access` authorizes the part
    is ACC-005. A part that reports a reason, or whose request has the outcome failed or
    unknown, has not succeeded. Where the declared Conduit is not marked optional, the setup
    then does not succeed, under OPS-022. A declared Conduit marked optional that is not opened
    does not keep the setup from succeeding, and the setup reports it as not opened. These parts
    come first in a setup: the run is asked for, and the setup hook dispatched, only once each
    of them that is not marked optional has succeeded, under TPL-012.
  vectors: []

- id: CON-006
  layer: language
  level: must
  when: >-
    A Conduit carries a shared-host requirement and its consumer or its target is an instance
    that has no placement.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the Conduit, the requirement and the end that has no
    placement, and produces no objects.
  vectors: []

- id: CON-007
  layer: convention
  level: must
  when: >-
    Anything happens to the consumer of an open Conduit other than its being retired or declared
    lost, including a crash, a condition its type defines such as paused, or the machine of its
    location being reported unreachable, under PLC-023.
  then: >-
    The Conduit stays open.
  observable: >-
    Inspecting the Conduit after the event reports the state ready and the same operations as
    before.
  vectors: []

- id: CON-008
  layer: convention
  level: must
  when: >-
    An actor permitted under ACC-012 closes a Conduit, or its consumer or its target is retired
    or declared lost.
  then: >-
    The Conduit is closed. A Conduit whose target is retired, or either of whose ends is
    declared lost or is placed on a machine that is reported gone, under PLC-024, is closed at
    once. A Conduit whose consumer is retired is closed once the consumer's shutdown is
    confirmed. From the moment the retirement of a target is dispatched, a request to that
    target is a request through a closed Conduit: it is not dispatched, and reports refused. A
    closed Conduit is removed, under LIF-035.
  observable: >-
    A Conduit's shutdown is confirmed when it is closed, however it was closed, under LIF-024,
    so it is removed at once: a request that names it afterwards, to inspect it among others,
    reports invalid under OPS-029, and its records are kept as LIF-019 states. A request to a
    retired target has no open Conduit to be made through, which is the case ACC-001 and ACC-011
    state. A consumer's shutdown is confirmed as LIF-024 states: when an invocation of
    `retire.v1` for it succeeds, at once where no setup of it was ever dispatched, or when a
    reconciliation records that its retirement occurred, under LIF-028. From the moment the
    consumer is retired until then, the Conduit's state is as it was, and the Conduit permits
    only the requests of the consumer's retirement, as ACC-039 states: the consumer's retire
    hook can make an onward request through the consumer's own Conduit, and the engine can read
    a secret through it for a run that the retirement asks for, in a further retirement under
    LIF-026 as in the first. Where the consumer's shutdown stays pending or unknown, the Conduit
    stays so until the shutdown is confirmed, the consumer is declared lost, or an actor closes
    the Conduit under ACC-012.
  vectors: []

- id: CON-011
  layer: convention
  level: must
  when: >-
    A Conduit is closed while its consumer is ready.
  then: >-
    Its consumer remains ready, and its status reports that the Conduit is closed.
  observable: >-
    Inspecting the consumer reports the state ready, and names the closed Conduit and the
    capability it carried as no longer reachable through it.
  vectors: []

# --- Conduits to live instances. The owner ruled on 2026-11-05 that this is a core part of the
# --- language (plan-audit rulings 19 and 20).

- id: CON-012
  layer: language
  level: must
  when: >-
    A Conduit template is instantiated on its own, naming an existing instance as its consumer
    and an existing instance as its target.
  then: >-
    The Conduit is instantiated. The consumer need not have declared it, and the consumer's
    definition is not changed.
  observable: >-
    The resolved objects contain the new Conduit, naming both instances. The consumer's
    definition and revision are the same as before.
  vectors: []

- id: CON-013
  layer: convention
  level: must
  when: >-
    A Conduit whose consumer is ready is opened.
  then: >-
    It is opened without setting up the consumer again or interrupting it, and the consumer's
    next request through it is permitted.
  observable: >-
    The consumer's status is unchanged across the open. A request through the new Conduit made
    after the open is permitted.
  vectors: []

- id: CON-014
  layer: convention
  level: must
  when: >-
    A Conduit whose consumer is ready is closed.
  then: >-
    The consumer is not retired or interrupted.
  observable: >-
    The consumer's lifecycle state is unchanged across the close. What its later requests
    through the closed Conduit report is ACC-011.
  vectors: []

# --- The Conduit template (plan-audit ruling 31).

- id: CON-016
  layer: language
  level: must
  when: >-
    The `spec` of a Conduit template is read.
  then: >-
    It may hold `inputs`, `capability`, `operations` and `requirements`, and no other key. It
    requires `capability`. It requires `operations` unless one of its inputs has `operations` as
    a destination, and it may leave out `requirements`, and then applies none.
  observable: >-
    A Conduit template with no `capability` is rejected. So is one that has no `operations` and
    no input whose destination is `/operations`. What is required of an `operations` that an
    input fills is INS-023.
  vectors: []

- id: CON-017
  layer: language
  level: must
  when: >-
    A Conduit template is registered.
  then: >-
    Its `capability` is the selection of one Capability contract, and its `operations` is a list
    of selections, each of an operation that capability includes. The list may be empty.
  observable: >-
    An operation the capability does not include is rejected with a diagnostic naming it. A list
    that an input supplies is checked in the same way when the Conduit is instantiated, under
    INS-023.
  vectors: []

- id: CON-018
  layer: language
  level: must
  when: >-
    A Conduit template applies requirements.
  then: >-
    They are a map under `requirements`. Each item has a name and holds `requirement`, which is
    the selection of a Requirement contract, and may hold `arguments`. A filter, the shared-host
    requirement and a bound are all written there. A requirement of the core package is applied
    by the engine itself and never sent; every other requirement is a filter, which the target's
    implementations apply.
  observable: >-
    An item with no `requirement` is rejected with a diagnostic naming the item. An item with no
    `arguments` supplies none, as NAM-019 states. A requirement is applied only to a Conduit,
    under CTR-005. The shared-host requirement is
    `github.com/shrav-k/conduit/core#shared-host.v1`, which the engine decides when the Conduit
    is instantiated, under PLC-013, and the bound of a Conduit to `access` is
    `github.com/shrav-k/conduit/core#bound.v1`, which the engine applies to each request through
    that Conduit, under ACC-029. A filter is sent to the target's implementations under IFC-018,
    and they apply it under IFC-019; CON-022 says which of them must support it.
  vectors: []

- id: CON-020
  layer: language
  level: must
  when: >-
    A Conduit template names a consumer or a target.
  then: >-
    The template is rejected. A consumer and a target are supplied only when a Conduit is
    instantiated.
  observable: >-
    Resolving returns a diagnostic naming the key. A declared Conduit that names a consumer is
    rejected under OBJ-014: the consumer of a declared Conduit is always the instance being
    instantiated.
  vectors: []

- id: CON-021
  layer: language
  level: must
  when: >-
    A Conduit is instantiated whose target's type does not offer the Conduit's capability.
  then: >-
    The Conduit is not instantiated.
  observable: >-
    Resolving returns a diagnostic naming the capability and the target's type.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32, decisions G9 and G6).

- id: CON-022
  layer: language
  level: must
  when: >-
    A Conduit is instantiated that applies a filter, and an implementation that the target has
    selected for an operation the Conduit lists does not state the filter's requirement in
    `supports`.
  then: >-
    The Conduit is not instantiated. An implementation that is reached by `command`, `package`
    or `remote` supports a requirement where it states the requirement in `supports`, which
    matches the requirement by its address and its export name.
  observable: >-
    Resolving returns a diagnostic naming the filter, the operation and the implementation. It
    is decided from the manifest under PKG-019, without starting anything. The implementations
    that the target has selected for the operations the Conduit lists are sent every filter on
    the Conduit under IFC-018, and apply it under IFC-019, so each of them must support it. An
    implementation marked `plain` states no `supports` under PKG-020, so no Conduit is
    instantiated with a filter that an instance it serves must apply. Nor does `engine`, the
    implementation of the core package, under MAN-012, so no Conduit is instantiated that
    applies a filter and lists an operation for which its target has selected `engine`. A
    requirement is matched by that address and that export name alone: the contract's own
    version is the last segment of that name, and the version of the package does not count,
    because a later release may only add optional inputs under NAM-024. A filter that an onward
    request or a hook carries is not counted here: ACC-015 checks it against the implementation
    that the request or the hook would be dispatched to.
  vectors: []

- id: CON-023
  layer: convention
  level: must
  when: >-
    An actor asks to open a Conduit whose target is in the state registered.
  then: >-
    The Conduit is opened as it would be to a target that is ready. A Conduit may be opened to
    any target that is not retired.
  observable: >-
    After the open the Conduit is ready while its target is still registered, so setup does not
    depend on the order in which objects are set up. A Conduit whose target is retired is
    already closed under CON-008, and is never opened. Nor is one whose consumer is retired,
    under CON-031.
  vectors: []

- id: CON-024
  layer: convention
  level: must
  when: >-
    A request is made through an open Conduit whose target is not ready, for an operation other
    than a management verb.
  then: >-
    The request is not dispatched, and reports unavailable.
  observable: >-
    The target's implementation receives no call for such a request while the target's state is
    registered. A request made once the target is ready is decided as any other. A management
    verb is an operation of `object-management.v1`, `access-control.v1` or `pool-management.v1`,
    `inspect.v1` and `purge.v1` among them, under OPS-019. The ones that ACC-033 authorizes
    against a Pool, such as setting up a Resource the Pool owns, are dispatched while the Pool's
    state is registered, so that a Pool's own setup can set up its entries. A control is not a
    management verb.
  vectors: []

- id: CON-025
  layer: language
  level: must
  when: >-
    A Conduit is instantiated whose consumer or target is retired.
  then: >-
    The Conduit is not instantiated.
  observable: >-
    Resolving returns a diagnostic naming the retired instance.
  vectors: []

# --- Added by the follow-up rulings (plan-audit ruling 33; decisions F5 and F20 of the
# --- re-audit).

- id: CON-027
  layer: language
  level: must
  when: >-
    A Conduit instance document gives a `consumer`, or a Conduit instance document or a declared
    Conduit gives a `target`, that is an instance of a kind OBJ-013 does not accept for that
    end.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the end and the kind that was given. A Pool given as a
    consumer, and a Conduit given as either end, are each rejected in this way.
  vectors: []

# --- Added with the core package (plan-audit ruling 37; change X3 of the ruling on the core
# --- package and the schemas).

- id: CON-028
  layer: language
  level: must
  when: >-
    A Conduit template applies the core package's requirement `bound.v1` more than once, or a
    Conduit is instantiated that applies `bound.v1` and whose target is not the `access`
    Resource.
  then: >-
    A template that applies it more than once is rejected when it is registered. A Conduit that
    applies it and whose target is not `access` is not instantiated.
  observable: >-
    Resolving returns a diagnostic naming the template or the Conduit, and each item of its
    `requirements` that applies `github.com/shrav-k/conduit/core#bound.v1`. A bound is carried
    only by a Conduit to `access`, and such a Conduit carries at most one.
  vectors: []

# --- Added by the follow-up to the last pass (docs/proposals/reaudit/round-2/log-tail.md;
# --- decision 8 of "The last pass, and what it left" in DECISIONS.md). It is of the layer
# --- `convention`.

- id: CON-031
  layer: convention
  level: must
  when: >-
    An actor asks to open a Conduit that is not open and whose consumer or whose target is
    retired.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    This holds whatever the shutdown of the retired end reports. A Conduit whose target is
    retired is closed already, under CON-008, and so removed, under LIF-035: a request to open
    it names a Conduit that no longer exists, and reports invalid under OPS-029. A Conduit in
    the state registered whose consumer is retired stays registered until CON-008 closes it,
    once the consumer's shutdown is confirmed, and is never opened: CON-025 does not instantiate
    a Conduit for a retired end, and this is the same rule for opening one. This promise is
    about a Conduit that is not open. A Conduit that was open when its consumer was retired is
    still open, as ACC-039 states, and a request to open it changes nothing and has the outcome
    succeeded, as for any open Conduit under ACC-006. The part of a setup that would open a
    declared Conduit of a retired consumer does not arise, because a request to set up a retired
    instance reports conflict under LIF-015. Where the actor is not permitted, OPS-023 gives
    refused first.
  vectors: []
