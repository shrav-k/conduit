# Contracts: the five kinds of contract and what each holds.
# A contract is a document with the same envelope as any other, as a Kubernetes resource
# definition is itself a resource. Every field below is one that an existing promise already
# relies on. The JSON Schemas of these documents are in spec/schemas/contracts.yaml.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# CTR-010: nothing replaces it (ruling 41).
# CTR-011: nothing replaces it (ruling 41).
# Removed: PKG-011 → TPL-004 and CTR-004 (ruling 32).
# Removed: PLC-014 → CTR-004 (ruling 32).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: CTR-001
  layer: language
  level: must
  when: >-
    A contract document is read.
  then: >-
    It has `apiVersion`, a `kind` that is one of `Type`, `Capability`, `Operation`,
    `Requirement` and `Schema`, `metadata` and `spec`. Its name is its export name, which
    follows NAM-004. The last segment of the name is its compatibility version, written `v` and
    a whole number from 1, and at least one segment comes before it.
  observable: >-
    A contract whose name has no version segment, such as `directory-access`, or is its version
    segment alone, such as `v1`, or that has any other top-level key, is rejected when its
    package is installed or its project is submitted. `directory-access.v1` is accepted.

- id: CTR-002
  layer: language
  level: must
  when: >-
    An Operation contract is read.
  then: >-
    Its `spec` may hold `inputSchema` and `outputSchema`, each a schema written as the Model
    Context Protocol's tool definition writes it, with the root that CTR-012 allows: the
    properties of `inputSchema` are the operation's inputs and those of `outputSchema` its
    outputs. An implementation's own ID is an ordinary string input or output. The `spec`
    may further hold `effect`, a statement of what it changes outside itself; `startsModelWork`;
    `deduplicates`, the mark of an operation whose implementation recognizes an invocation that
    it has already been sent, by the engine's ID for it, which every attempt of it carries in
    `io.github.shrav-k.conduit/invocation` under IFC-006, and applies the effect at most once
    for it; `reservedToRoot`,
    the mark of an operation reserved to the root Interface; for a control, `changes`, as
    CTR-006 states; and the booleans `idempotentHint`, `destructiveHint` and `openWorldHint`.
  observable: >-
    An operation with no `effect` changes nothing outside itself. `startsModelWork`,
    `deduplicates` and `reservedToRoot` are booleans, and one that is absent is false; IMP-003
    and ACC-032 state what the first and the last of them mean, OPS-012 and OPS-021 say what
    the engine does with a repeat where `deduplicates` is declared, and CTR-009 says where
    `reservedToRoot` may be written. `idempotentHint`, `destructiveHint` and `openWorldHint`
    may each be left out, and IFC-033 says what they become in the definition of a tool. An
    Operation contract states no default implementation, so one whose `spec` holds
    `implementation` is rejected: what runs for an operation is a template's selection or its
    type's default, under TPL-004, and the engine implements, with no selection, each
    operation that the core package's implementation `engine` lists under MAN-012.
    `deduplicates` is not the Model Context Protocol's `idempotentHint`, which hints that
    calling the tool again with the same arguments has no further effect: the engine passes
    that hint into the tool's `annotations`, under IFC-033, and never decides a new attempt by
    it, under OPS-012. No key marks an operation as arranging work that is to start or to run
    after its own invocation has ended, because no operation arranges such work through the
    engine, under ACC-019: a contract whose `spec` holds a key that this promise does not
    name, such as `inputs` or `outputs`, is rejected by `operation-spec.v1`, under SUB-005, as
    OBJ-019 requires for an undefined key. A property name such as `maxResults` or
    `max_results` is accepted, as is any other non-empty string: the rule OBJ-022 gives for
    other names a document chooses does not apply to these. A property whose name is the empty
    string or a property of `outputSchema` that states a `default` is rejected when the
    contract's package is installed or its project is submitted. An input is optional where `inputSchema` does not list it under `required`,
    under OBJ-015; what the `default` of an input then does is OPS-026, and SCH-019 rejects
    one that fails the schema of its property.

- id: CTR-003
  layer: language
  level: must
  when: >-
    A Capability contract is read.
  then: >-
    Its `spec` holds `operations`, a list of selections of the operations it includes. A
    capability that is not a contract of the core package and that lists an operation reserved
    to the root Interface is rejected when its package is installed or its project is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the capability and the operation. An
    operation is reserved to the root Interface where its contract is marked `reservedToRoot:
    true`, and only an Operation contract of the core package carries the mark, under CTR-009:
    `object-management.v1` lists the two that do. What a capability may not list twice is
    CTR-007.

- id: CTR-004
  layer: language
  level: must
  when: >-
    A Type contract is read.
  then: >-
    Its `spec` holds `family`. It may also hold `schema`, the schema of an instance's `config`;
    `offers`, the capabilities its instances offer; `requires`, the operations its instances
    must have implemented; `implementation`, its default implementations, a map in the form
    TPL-003 gives for a template; `controls`, a list of selections of its controls;
    `conditions`, the names of the further conditions it reports; `records`, which holds
    `inputs` and `outputs`, each true or false, and says whether the records about its instances
    keep the inputs and the outputs of their operations; and `nodeSelector`, a label selector
    that the labels of an instance's node must match, under PLC-007.
  observable: >-
    A Type contract with no `family` is rejected when its package is installed or its project is
    submitted. A type whose default implementation cannot be resolved through its own package's
    manifest is rejected in the same way. So is a Type of the family Pool whose `offers` does
    not list the core package's capability `pool-management.v1`: every Pool offers it, and the
    schema `type-spec.v1` states that rule too. A type that states no `schema` puts no rule on
    the configuration of its instances, and so can list no control under CTR-006. One that
    states no `offers` offers no capability, one that states no `requires` requires no
    operation, and one that states no `implementation`, `controls` or `conditions` has none. A
    default that `implementation` states for `setup-hook.v1` or `retire-hook.v1`, where
    `requires` does not list that hook, is used by no template, under TPL-004: the type is not
    rejected, and installation or resolving returns a diagnostic, which does not reject, naming
    the type and the hook. One that states no `nodeSelector`, or an empty one, puts no rule on
    where its instances are placed. `records` and each of its two members may be left out, and
    one that is left out is false. What a record holds is REC-002, and what a Type that offers a
    provider capability must be is PRV-001. The only Type of family Fleet is the core
    `fleet.v1`, which offers `fleet-management.v1` (FLEET-001); a Type of that family outside
    the core package is rejected.
    A Type may also state `signIn`, its account pointer, logins and three required hooks
    under CTR-013, `toolsDirectory`, the own tools declaration of CTR-014, and
    `admission`, a login's levers and control or an Agent's login Types, under CTR-015.
    Records follow
    REC-002.

- id: CTR-005
  layer: language
  level: must
  when: >-
    A Requirement contract is read.
  then: >-
    Its `spec` may hold `inputs`, a map from a name to a member that holds `schema` and may hold
    `default` and `optional: true`. A requirement is applied only to a Conduit, as an item of
    the `requirements` of a Conduit template. A requirement of the core package is applied by
    the engine itself and is never sent to an implementation. Any other is a filter: the
    implementations that the target has selected for the operations the Conduit lists apply it
    to each call that they receive for a request through the Conduit, under IFC-019.
  observable: >-
    A Requirement contract whose `spec` holds a key that this promise does not name, such as
    `appliesTo`, `narrows`, `obliges`, `constituents` or `schema`, is rejected when its
    package is installed or its project is submitted, by `requirement-spec.v1`, under SUB-005,
    as OBJ-019 requires for an undefined key. The requirements of the core package are
    `bound.v1`, under ACC-029, and `shared-host.v1`, under PLC-013. The implementations that
    the target of a Conduit has selected for the operations the Conduit lists must state a
    filter's requirement in `supports`, as CON-022 states, and they are sent it under IFC-018.
    Where several requirements apply to one Conduit, each is an item of its template's
    `requirements` and each applies, and none permits what the Conduit does not, under
    ACC-008: a bundle of limits is written as several items side by side. Which implementation
    applies a requirement on an open Conduit is reported under ACC-038. A repeat that is not
    dispatched reaches no implementation, so no filter judges it, under ACC-008.

- id: CTR-006
  layer: language
  level: must
  when: >-
    A control is defined.
  then: >-
    It is an Operation contract whose `spec` also holds `changes`, a map from the name of one of
    its inputs to a JSON Pointer into the configuration, which is the setting that input sets.
    Its `inputSchema` lists `revision` under `required`, and it declares no output `settings`. A
    Type contract lists it under `controls`, and each pointer in its `changes` addresses a place
    in the configuration that the type's `schema` describes. No two pointers of its `changes`
    are equal, and none lies inside another.
  observable: >-
    A type that lists a control whose `changes` addresses a place its schema does not describe,
    or that lists under `controls` an operation with no `changes`, one whose `inputSchema` does
    not require `revision`, or one that declares an output `settings`, is rejected when the
    package is installed or the project is submitted. So is a control in which a key of
    `changes` is not the name of one of its inputs, and so is one in which two pointers are
    equal or one lies inside another, with a diagnostic naming both inputs and both pointers, as
    INS-010 names two destinations that overlap: `{a: /limit, b: /limit}` and `{o: /options, a:
    /options/limit}` are each rejected. So each setting is set by one input alone, and what
    REV-006 leaves as stored never differs from what REV-007 stores. Two pointers are compared
    by their reference tokens, as RFC 6901 splits a pointer, each with `~1` and `~0` unescaped:
    `/limit` and `/limits` do not overlap, `/a~1b` is the one member `a/b` and does not lie
    inside `/a`, and the empty pointer, the whole configuration, lies over every other pointer.
    An instance has only the controls its type lists. `changes: {limit: /readLimit}` says that
    the input `limit` sets the setting at `/readLimit`. `revision` is the input that REV-006 and
    REV-011 require of a control. A control applies exactly the values it is sent, or fails, and
    what is then stored is REV-007; the engine checks those values against the type's schema
    before it dispatches, under REV-015.



- id: CTR-007
  layer: language
  level: must
  when: >-
    A Capability contract lists two operations that have the same export name, as operations of
    two packages may.
  then: >-
    The contract is rejected.
  observable: >-
    Installation or resolving returns a diagnostic naming the two operations: the contract is
    rejected when its package is installed or its project is submitted. No capability gives two
    of its operations one name.



- id: CTR-008
  layer: language
  level: must
  when: >-
    A Schema contract is read.
  then: >-
    Its `spec` is a schema under the schema profile. The schema is the whole of `spec`, not a
    member of it.
  observable: >-
    A `spec` that uses a keyword or a format outside the profile is rejected by `schema.v1`,
    under SUB-005, as SCH-002 and SCH-003 require. A `$ref` that is a qualified reference
    resolves to a Schema contract that a package exports, and one that is `#name` to a Schema
    contract of the same project or package, as SCH-015 states. The core package's reference
    schemas are Schema contracts, and so are the schemas of documents under spec/schemas/.



- id: CTR-009
  layer: language
  level: must
  when: >-
    An Operation contract that does not belong to the core package is marked
    `reservedToRoot: true`.
  then: >-
    The contract is rejected: a package that holds it is rejected when it is installed, and a
    project that holds it is rejected when it is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the contract. Only an Operation
    contract of the core package carries the mark: declare-lost.v1, purge.v1,
    enroll-machine.v1, admit-machine.v1 and refuse-machine.v1. ACC-032 says what it means.



- id: CTR-012
  layer: language
  level: must
  when: >-
    An Operation contract's `inputSchema` or `outputSchema` holds no `type` at its root, or
    a `type` other than `object`; or the contract is a control's, whose `spec` holds
    `changes`, and either root holds a keyword other than `type`, `properties`, `required`
    and `additionalProperties`.
  then: >-
    The contract is rejected: a package that holds it is rejected when it is installed, and
    a project that holds it is rejected when it is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the contract and the keyword. An
    `inputSchema` with `type: array` is rejected; `{type: object, properties: {path: {type:
    string}}, required: [path]}` is accepted. `type: object` is required at both roots: the
    protocol requires it of a tool's `inputSchema`, and IFC-001 makes the outputs the
    members of `structuredContent`, keyed by name, so without it the root's `properties`
    would admit a result that is not a map, although the protocol lets an `outputSchema` be
    any schema. Beside `type: object`, the root of an Operation contract that is not a
    control's may hold any keyword of the profile, under SCH-002, as the protocol's tool
    definition lets an `inputSchema` hold any keyword of JSON Schema 2020-12 beside `type`
    and an `outputSchema` be any schema: `{type: object, properties: {path: {type: string},
    uri: {type: string}}, oneOf: [{required: [path]}, {required: [uri]}]}` is accepted, and
    takes a path or a URI and not both. The inputs and the outputs are still the members of
    the root's `properties`, under CTR-002, as the protocol advises a schema that uses
    composition to declare `properties` at its root and to keep its branches to presence
    assertions such as `required`: a keyword beside them, `$ref` and `oneOf` among them,
    constrains the arguments or the outputs as a whole and adds no input and no output. A
    `default` stands on a property, where SCH-008 accepts it, and never inside `oneOf`, `if`
    or another of the keywords that SCH-008 names, at the root or below it. A `default` that
    the root reaches only through a keyword beside its `properties`, such as one on a
    property of the schema that a `$ref` written at the root refers to, fills no argument,
    under SCH-009 and OPS-026, and no output, under SCH-009, as that keyword adds no input
    and no output. A control's root is held to the four keywords, so `oneOf` or `$ref` at
    the root of its `inputSchema` is rejected: every input of a control but `revision` may
    be left out, under REV-006, and a keyword at the root such as `oneOf: [{required: [a]},
    {required: [b]}]` would make one of them required all the same. Inside a property every
    keyword of the profile may be used, under SCH-002.

- id: CTR-013
  layer: language
  level: must
  when: >-
    A Type contract states signIn or loginResource.
  then: >-
    signIn holds exactly account, a pointer into configuration, and logins, a non-empty list of
    sign-in-login.v1. Every login value is literal, never a configuration pointer. A login
    states name, return, authorization and clientId. Names differ within the Type. Return is
    device, redirect, page or service: device states the verification page, redirect the
    loopback host, ports and a path that holds neither ? nor #, and page and service the HTTPS
    page used as redirect_uri, which holds no user information.
    Only redirect and page state carried, required for both; only redirect may state issuer.
    No other member is allowed. The account place and every member on its path are required,
    and the place is confined to string or null by MAN-017's test. The Type lists no control
    whose changes holds the account pointer, a pointer inside it or a pointer over it, compared
    as CTR-006 compares pointers. A Type stating signIn requires the three core operations
    sign-in-hook.v1, account-hook.v1 and sign-out-hook.v1. No URL may pass
    IFC-049's checks for two of its logins, including overlapping fixed ports and ports: any
    on the same host and path. A contract failing these rules is rejected at install or
    submission. The logins are part of the Type contract: PKG-004's package digest and
    SUB-008's digest of a submitted project's contracts cover them.
    loginResource is allowed only for the family Agent, never beside signIn, and holds
    exactly place: a pointer into configuration, the Agent's login place, required, of
    schema resource-reference.v1, that no control's changes holds, compared as for the
    account pointer. Such a Type need not require the three hooks. A contract breaking these
    rules is rejected at install or submission. A submission whose login place refers to a
    Resource whose Type does not state signIn, that holds no string at its account place, or
    that is retired, is rejected, with a diagnostic naming CTR-013, the place and that
    Resource.
  observable: >-
    A string at the account place is the expected account. Null disables both sign-in
    actions and the account check, as for API-key configuration. A Type states signIn
    only where account-hook.v1 reports an account attested by the service: returned at
    login, such as in an ID token or profile, or reported when asked, such as by
    userinfo or the service's own call. An account supplied by configuration or a person
    does not count. A Type unable to learn it states no signIn and gets no sign-in or
    relayed URL (IFC-016). The engine reads only what account-hook reports, never the
    instance's state directory. Hooks are selected under requires and TPL-004, invoked
    only as parts of sign-in.v1 or setup for their caller and filters (PND-011), and
    exposed through no consumer tool. `admission-hook.v1`, which CTR-015 requires of a
    Type stating `signIn` and `admission`, is the one sign-in Type's hook invoked
    otherwise: the engine invokes it as its own invocation of the login Resource,
    through no Conduit and with no filter, never as a part (IFC-054), and it too is
    exposed through no consumer tool. The engine starts no login and holds no token it
    yields (PRV-029 and the limits in spec/README.md). A Resource needing browser login
    is implemented by a package that completes it and keeps its token in its own state
    directory (PRV-029). An Agent whose Type states loginResource keeps its own state
    directory and context, and is an Agent of its login Resource: the Pool-owned
    Resource its login place refers to, whose state directory holds one account's login
    on one machine (PRV-029). What an Agent's client writes in that Resource's directory
    is
    shared with every Agent of that login, as DEC-042 accepted.
    The account check, sign-in.v1 and the sign-in action are that Resource's, never the
    Agent's (PND-005, PND-010). A login Resource serves whatever
    subscription plan its vendor's own sign-in serves; no Type states a plan.
    The engine carries no return for carried: false (PND-013). The engine compares the client IDs
    of a Type's logins with every Type it holds at another address: every installed package's
    Types and every submission's Types held by a template or instance (SUB-008, PKG-029).
    Types at one address share freely, including sibling Types, package versions and
    submissions at one address. Installing a package whose Type shares such a client ID
    reports conflict unless the request confirms it in install.v1's optional
    confirmClientIds list. Only root may give that input; another caller giving it reports
    refused. A confirmation naming a client ID shared with no such Type reports invalid.
    Registering a project or replacing a template with one (SUB-009) reports conflict for
    such sharing, with no confirmation. OPS-023's access, validity, conflict and
    availability order governs these decisions before dispatch. Each diagnostic names
    CTR-013, its cause, the client ID and both Types where shared, and reveals no URL
    value. A confirming install record keeps only those input client IDs under REC-002.
    install.v1 optionally outputs logins, each item's qualified Type reference and logins
    for each package Type stating signIn. inspect.v1 optionally outputs its object's
    Type's logins, present where that Type states signIn.


- id: CTR-014
  layer: language
  level: must
  when: >-
    A Type contract states `toolsDirectory`.
  then: >-
    It holds exactly `{directory: <JSON Pointer into configuration>}`, and the Type is of
    family Agent. The place and every member on its path are required by the Type's `schema`,
    and the place is confined to string or null by MAN-017's test. The Type lists no control
    whose `changes` holds the pointer, a pointer inside it or a pointer over it, compared by
    reference tokens as CTR-006 compares pointers. The place is fixed for the Agent's life.
    A Type that breaks any of these rules is rejected when its package is installed or its
    project is submitted, with a diagnostic naming the Type and the cause, and the control
    where one is the cause.
  observable: >-
    Where the value at the place is a string, the Agent has its client's own tools, as the
    Type's contract states them, working in the directory that string names. Their reach does
    not pass through Conduit: no Conduit grants it, no restriction limits it, and no record
    shows its use. This version reports that reach as neither enforced nor mediated, whatever
    the Agent's runtime provider (ACC-027, PRV-006). On the engine's own runner nothing
    confines it. Every string counts, the empty string among them: what an implementation does
    with a directory it cannot use belongs to the Type's contract, and inspection shows reach
    even in that case. The member declares no limit on the reach; confinement and its limits
    belong to the runtime provider under PRV-006.
    Where the value is null, the Agent has none of the own tools that a string turns on, and
    has only what its Type's contract states for that case. A template that writes nothing at
    the place gets null where the Type's schema gives that default, under SCH-009.
    The engine reads the value only to report it under LIF-013. It checks neither statement
    about the tools, nor that the directory exists. The implementation receives the value as
    any other configuration value, through its item's binding under MAN-017; a null gives it
    no variable and no argument under PRV-007. The Type's description states what the tools
    are and what they reach when they are on. IFC-033 carries that description into the
    description of every tool whose target is the Agent. This wording is the package's duty;
    the engine does not check it. A Type that states no `toolsDirectory` declares nothing
    about such reach, and inspection says so under LIF-013.

- id: CTR-015
  layer: language
  level: must
  when: >-
    A Type contract states `admission`.
  then: >-
    On a Resource Type stating `signIn`, it holds exactly `levers`, a pointer into
    configuration, the levers place, and `control`, a selection of a control the Type
    lists under `controls`, and the Type requires the core operation
    `admission-hook.v1`. The levers place and every member on its path are required by
    the Type's `schema`, no `default` stands at or under the place, and its schema is an
    object that requires `billing`, `paidUsage` and `whenUnknown`, each confined by
    `enum` to some of its words: `included` and `paid-from-first-token`; `allow`,
    `refuse` and `refuse-if-possible`; `refuse`, `one-trial` and `admit`. The control's
    `changes` is exactly `{levers: <the levers pointer>}`, and no other control the Type
    lists has a pointer in its `changes` equal to it, inside it or over it, compared as
    CTR-006 compares pointers. On an Agent Type stating `loginResource`, it holds
    exactly `loginTypes`, a non-empty list of selections of Types that each state
    `signIn` and `admission`. No other Type states it. A contract breaking these rules
    is rejected at install or submission, with a diagnostic naming CTR-015, the Type and
    the cause. Registering or replacing an Agent whose login place refers to a Resource
    whose Type states `admission` reports invalid where the Agent's Type does not list
    that Type under `admission.loginTypes`, and so does replacing such a Resource with
    one whose Type a current Agent of it does not list, each with a diagnostic naming
    CTR-015, the Agent's Type and the login's Type. A levers value holding `whenUnknown`
    `admit` beside `paidUsage` `refuse` or `refuse-if-possible` reports invalid at
    registration and at replacement, and a control that would store one is not
    dispatched and reports invalid, each with a diagnostic naming CTR-015 and both
    pointers.
    A Conduit whose consumer is an Agent and that lists an operation that its target's
    Type names as `admission.control`, compared as qualified references, is not opened:
    a request to open it, whoever sends it, root among them, whether on its own or as a
    part of a setup (CON-004), is not dispatched and reports refused under this promise.
  observable: >-
    The engine decides each call that starts model work on an Agent of the login on the
    login's report, under PND-016; the following lever meanings describe that report
    (IFC-054). `billing` declares whether model work is included or paid from the first
    token. A login declaring `paid-from-first-token` whose `paidUsage` is `refuse` or
    `refuse-if-possible` admits nothing. `paidUsage` `allow` allows paid usage, `refuse`
    refuses usage being billed beyond included usage, and `refuse-if-possible` refuses
    whenever such billing is possible. `whenUnknown` chooses what happens where the
    login cannot tell: `refuse` refuses, `one-trial` admits one call by a single-use
    report, and `admit` admits. A package may add its own levers beside these three. No
    lever is an amount of money or credits, a balance or a currency; percentages and
    minutes are not such amounts. A Type or README defining such a lever does not
    conform. The package's schema states the rule against `whenUnknown` `admit` beside
    `paidUsage` `refuse` or `refuse-if-possible` as `if` and `then`, so REV-015 rejects
    that value first. Listing a Type under `loginTypes` says that the Agent Type's
    results of calls that start model work carry the limits members (IFC-052) that the
    listed Type's package documents as its hook's input. The engine checks the listing,
    never the members. The levers are the login's configuration, which reaches only the
    login's own calls (IFC-006) and its `admission-hook.v1` as the input `levers`.
    Nothing of `admission` reaches a call dispatched to an Agent's implementation
    (IFC-006); a calling Agent learns a hold or a warning only from its own request's
    result (PND-016, IFC-054). No Agent tunes a login's levers: the control reaches a
    login only through a Conduit to it whose consumer is not an Agent, an Interface's
    among them, and is authorized there as any control is (ACC-033). A Conduit whose
    consumer is an Agent may still list the login's other operations. The refused open's
    diagnostic names the Conduit as the request named it and the operation by its
    qualified reference. It says that the operation is the admission control of the
    target's Type, named by its qualified reference, and changes the login's usage
    levers; that no Conduit whose consumer is an Agent may be opened listing it, whoever
    sends the open; that nothing was opened, not even the Conduit's other operations,
    and the Conduit stays as it was; that a Conduit whose consumer is an Agent may still
    list the login's other operations, so the Conduit can be replaced or registered
    again without the admission control and then opened; and that an Interface's client
    tunes the levers through a Conduit of its own to the login. All of this is in tier 1,
    as the bound of the caller's Conduit to `access` covers the target (ACC-056). The
    Agent's calls that start model work on the login are decided on its report as before
    (PND-016), whatever Conduits it holds.
