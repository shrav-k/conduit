# Contracts: the five kinds of contract and what each holds.
# A contract is a document with the same envelope as any other, as a Kubernetes resource
# definition is itself a resource. Every field below is one that an existing promise already
# relies on. The JSON Schemas of these documents are in spec/schemas/contracts.yaml.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# CTR-010: nothing replaces it (ruling 41).
# CTR-011: nothing replaces it (ruling 41).
# Removed: PKG-011 → TPL-004 and CTR-004 (ruling 32).
# Removed: PLC-014 → CTR-004 (ruling 32).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: CTR-001
  layer: language
  level: must
  when: >-
    A contract document is read.
  then: >-
    It has `apiVersion`, a `kind` that is one of `Type`, `Capability`, `Operation`,
    `Requirement` and `Schema`, `metadata` and `spec`. Its name is its export name, which
    follows NAM-004. The last segment of the name is its compatibility version, written `v` and
    a whole number from 1, and at least one segment comes before it.
  observable: >-
    A contract whose name has no version segment, such as `directory-access`, or is its version
    segment alone, such as `v1`, or that has any other top-level key, is rejected when its
    package is installed or its project is submitted. `directory-access.v1` is accepted.
  vectors: []

- id: CTR-002
  layer: language
  level: must
  when: >-
    An Operation contract is read.
  then: >-
    Its `spec` may hold `inputSchema` and `outputSchema`, each a schema written as the Model
    Context Protocol's tool definition writes it, with the root that CTR-012 allows: the
    properties of `inputSchema` are the operation's inputs and those of `outputSchema` its
    outputs. A handle is a top-level property whose schema is `{$ref:
    github.com/shrav-k/conduit/core#handle.v1}` and which states no `default`. The `spec` may
    further hold `effect`, a statement of what it changes outside itself; `startsModelWork`;
    `deduplicates`, the mark of an operation whose implementation recognizes an idempotency key
    that it has already been sent and applies the effect at most once for it; `reservedToRoot`,
    the mark of an operation reserved to the root Interface; for a control, `changes`, as
    CTR-006 states; and the booleans `idempotentHint`, `destructiveHint` and `openWorldHint`.
  observable: >-
    An operation with no `effect` changes nothing outside itself. `startsModelWork`,
    `deduplicates` and `reservedToRoot` are booleans, and one that is absent is false; IMP-003
    and ACC-032 state what the first and the last of them mean, OPS-012 and OPS-021 say what
    the engine does with a repeat where `deduplicates` is declared, and CTR-009 says where
    `reservedToRoot` may be written. `idempotentHint`, `destructiveHint` and `openWorldHint`
    may each be left out, and IFC-033 says what they become in the definition of a tool. An
    Operation contract states no default implementation, so one whose `spec` holds
    `implementation` is rejected: what runs for an operation is a template's selection or its
    type's default, under TPL-004, and the engine implements, with no selection, each
    operation that the core package's implementation `engine` lists under MAN-012.
    `deduplicates` is not the Model Context Protocol's `idempotentHint`, which hints that
    calling the tool again with the same arguments has no further effect: the engine passes
    that hint into the tool's `annotations`, under IFC-033, and never decides a new attempt by
    it, under OPS-012. No key marks an operation as arranging work that is to start or to run
    after its own invocation has ended, because no operation arranges such work through the
    engine, under ACC-019: a contract whose `spec` holds a key that this promise does not
    name, such as `inputs` or `outputs`, is rejected by `operation-spec.v1`, under SUB-005, as
    OBJ-019 requires for an undefined key. A property name such as `maxResults` or
    `max_results` is accepted, as is any other non-empty string: the rule OBJ-022 gives for
    other names a document chooses does not apply to these. A property whose name is the empty
    string, a property of `outputSchema` that states a `default`, and a handle that states
    one, are each rejected when the contract's package is installed or its project is
    submitted. An input is optional where `inputSchema` does not list it under `required`,
    under OBJ-015; what the `default` of an input then does is OPS-026, and SCH-019 rejects
    one that fails the schema of its property.
  vectors: []

- id: CTR-003
  layer: language
  level: must
  when: >-
    A Capability contract is read.
  then: >-
    Its `spec` holds `operations`, a list of selections of the operations it includes. A
    capability that is not a contract of the core package and that lists an operation reserved
    to the root Interface is rejected when its package is installed or its project is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the capability and the operation. An
    operation is reserved to the root Interface where its contract is marked `reservedToRoot:
    true`, and only an Operation contract of the core package carries the mark, under CTR-009:
    `object-management.v1` lists the two that do. What a capability may not list twice is
    CTR-007.
  vectors: []

- id: CTR-004
  layer: language
  level: must
  when: >-
    A Type contract is read.
  then: >-
    Its `spec` holds `family`. It may also hold `schema`, the schema of an instance's `config`;
    `offers`, the capabilities its instances offer; `requires`, the operations its instances
    must have implemented; `implementation`, its default implementations, a map in the form
    TPL-003 gives for a template; `controls`, a list of selections of its controls;
    `conditions`, the names of the further conditions it reports; `records`, which holds
    `inputs` and `outputs`, each true or false, and says whether the records about its instances
    keep the inputs and the outputs of their operations; and `nodeSelector`, a label selector
    that the labels of an instance's node must match, under PLC-007.
  observable: >-
    A Type contract with no `family` is rejected when its package is installed or its project is
    submitted. A type whose default implementation cannot be resolved through its own package's
    manifest is rejected in the same way. So is a Type of the family Pool whose `offers` does
    not list the core package's capability `pool-management.v1`: every Pool offers it, and the
    schema `type-spec.v1` states that rule too. A type that states no `schema` puts no rule on
    the configuration of its instances, and so can list no control under CTR-006. One that
    states no `offers` offers no capability, one that states no `requires` requires no
    operation, and one that states no `implementation`, `controls` or `conditions` has none. A
    default that `implementation` states for `setup-hook.v1` or `retire-hook.v1`, where
    `requires` does not list that hook, is used by no template, under TPL-004: the type is not
    rejected, and installation or resolving returns a diagnostic, which does not reject, naming
    the type and the hook. One that states no `nodeSelector`, or an empty one, puts no rule on
    where its instances are placed. `records` and each of its two members may be left out, and
    one that is left out is false. What a record holds is REC-002, and what a Type that offers a
    provider capability must be is PRV-001.
  vectors: []

- id: CTR-005
  layer: language
  level: must
  when: >-
    A Requirement contract is read.
  then: >-
    Its `spec` may hold `inputs`, a map from a name to a member that holds `schema` and may hold
    `default` and `optional: true`. A requirement is applied only to a Conduit, as an item of
    the `requirements` of a Conduit template. A requirement of the core package is applied by
    the engine itself and is never sent to an implementation. Any other is a filter: the
    implementations that the target has selected for the operations the Conduit lists apply it
    to each call that they receive for a request through the Conduit, under IFC-019.
  observable: >-
    A Requirement contract whose `spec` holds a key that this promise does not name, such as
    `appliesTo`, `narrows`, `obliges`, `constituents` or `schema`, is rejected when its
    package is installed or its project is submitted, by `requirement-spec.v1`, under SUB-005,
    as OBJ-019 requires for an undefined key. The requirements of the core package are
    `bound.v1`, under ACC-029, and `shared-host.v1`, under PLC-013. The implementations that
    the target of a Conduit has selected for the operations the Conduit lists must state a
    filter's requirement in `supports`, as CON-022 states, and they are sent it under IFC-018.
    Where several requirements apply to one Conduit, each is an item of its template's
    `requirements` and each applies, and none permits what the Conduit does not, under
    ACC-008: a bundle of limits is written as several items side by side. Which implementation
    applies a requirement on an open Conduit is reported under ACC-038. A repeat that is not
    dispatched reaches no implementation, so no filter judges it, under ACC-008.
  vectors: []

- id: CTR-006
  layer: language
  level: must
  when: >-
    A control is defined.
  then: >-
    It is an Operation contract whose `spec` also holds `changes`, a map from the name of one of
    its inputs to a JSON Pointer into the configuration, which is the setting that input sets.
    Its `inputSchema` lists `revision` under `required`, and it declares no output `settings`. A
    Type contract lists it under `controls`, and each pointer in its `changes` addresses a place
    in the configuration that the type's `schema` describes. No two pointers of its `changes`
    are equal, and none lies inside another.
  observable: >-
    A type that lists a control whose `changes` addresses a place its schema does not describe,
    or that lists under `controls` an operation with no `changes`, one whose `inputSchema` does
    not require `revision`, or one that declares an output `settings`, is rejected when the
    package is installed or the project is submitted. So is a control in which a key of
    `changes` is not the name of one of its inputs, and so is one in which two pointers are
    equal or one lies inside another, with a diagnostic naming both inputs and both pointers, as
    INS-010 names two destinations that overlap: `{a: /limit, b: /limit}` and `{o: /options, a:
    /options/limit}` are each rejected. So each setting is set by one input alone, and what
    REV-006 leaves as stored never differs from what REV-007 stores. Two pointers are compared
    by their reference tokens, as RFC 6901 splits a pointer, each with `~1` and `~0` unescaped:
    `/limit` and `/limits` do not overlap, `/a~1b` is the one member `a/b` and does not lie
    inside `/a`, and the empty pointer, the whole configuration, lies over every other pointer.
    An instance has only the controls its type lists. `changes: {limit: /readLimit}` says that
    the input `limit` sets the setting at `/readLimit`. `revision` is the input that REV-006 and
    REV-011 require of a control. A control applies exactly the values it is sent, or fails, and
    what is then stored is REV-007; the engine checks those values against the type's schema
    before it dispatches, under REV-015.
  vectors: []



- id: CTR-007
  layer: language
  level: must
  when: >-
    A Capability contract lists two operations that have the same export name, as operations of
    two packages may.
  then: >-
    The contract is rejected.
  observable: >-
    Installation or resolving returns a diagnostic naming the two operations: the contract is
    rejected when its package is installed or its project is submitted. No capability gives two
    of its operations one name.
  vectors: []



- id: CTR-008
  layer: language
  level: must
  when: >-
    A Schema contract is read.
  then: >-
    Its `spec` is a schema under the schema profile. The schema is the whole of `spec`, not a
    member of it.
  observable: >-
    A `spec` that uses a keyword or a format outside the profile is rejected by `schema.v1`,
    under SUB-005, as SCH-002 and SCH-003 require. A `$ref` that is a qualified reference
    resolves to a Schema contract that a package exports, and one that is `#name` to a Schema
    contract of the same project or package, as SCH-015 states. The core package's reference
    schemas are Schema contracts, and so are the schemas of documents under spec/schemas/.
  vectors: []



- id: CTR-009
  layer: language
  level: must
  when: >-
    An Operation contract that does not belong to the core package is marked
    `reservedToRoot: true`.
  then: >-
    The contract is rejected: a package that holds it is rejected when it is installed, and a
    project that holds it is rejected when it is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the contract. Only an Operation
    contract of the core package carries the mark, as `declare-lost.v1` and `purge.v1` do, and
    ACC-032 says what it means.
  vectors: []



- id: CTR-012
  layer: language
  level: must
  when: >-
    An Operation contract's `inputSchema` or `outputSchema` holds no `type` at its root, or a
    `type` other than `object`; or the contract is a control's, whose `spec` holds `changes`,
    and either root holds a keyword other than `type`, `properties`, `required` and
    `additionalProperties`.
  then: >-
    The contract is rejected: a package that holds it is rejected when it is installed, and a
    project that holds it is rejected when it is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the contract and the keyword. An
    `inputSchema` with `type: array` is rejected; `{type: object, properties: {path: {type:
    string}}, required: [path]}` is accepted. `type: object` is required at both roots: the
    protocol requires it of a tool's `inputSchema`, and IFC-001 makes the outputs the members of
    `structuredContent`, keyed by name, so without it the root's `properties` would admit a
    result that is not a map, although the protocol lets an `outputSchema` be any schema. Beside
    `type: object`, the root of an Operation contract that is not a control's may hold any
    keyword of the profile, under SCH-002, as the protocol's tool definition lets an
    `inputSchema` hold any keyword of JSON Schema 2020-12 beside `type` and an `outputSchema` be
    any schema: `{type: object, properties: {path: {type: string}, uri: {type: string}}, oneOf:
    [{required: [path]}, {required: [uri]}]}` is accepted, and takes a path or a URI and not
    both. The inputs and the outputs are still the members of the root's `properties`, under
    CTR-002, as the protocol advises a schema that uses composition to declare `properties` at
    its root and to keep its branches to presence assertions such as `required`: a keyword
    beside them, `$ref` and `oneOf` among them, constrains the arguments or the outputs as a
    whole and adds no input and no output. A `default` stands on a property, where SCH-008
    accepts it, and never inside `oneOf`, `if` or another of the keywords that SCH-008 names, at
    the root or below it. A `default` that the root reaches only through a keyword beside its
    `properties`, such as one on a property of the schema that a `$ref` written at the root
    refers to, fills no argument, under SCH-009 and OPS-026, and no output, under SCH-009, as
    that keyword adds no input and no output. A control's root is held to the four keywords, so
    `oneOf` or `$ref` at the root of its `inputSchema` is rejected: every input of a control but
    `revision` may be left out, under REV-006, and a keyword at the root such as `oneOf:
    [{required: [a]}, {required: [b]}]` would make one of them required all the same. Inside a
    property every keyword of the profile may be used, under SCH-002. What a property that is a
    handle holds is CTR-002.
  vectors: []
