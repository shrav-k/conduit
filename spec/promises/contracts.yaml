# Contracts: the five kinds of contract and what each holds.
# Owner rulings of 2026-11-05 (plan-audit rulings 31 to 33). A contract is a document with the
# same envelope as any other, as a Kubernetes resource definition is itself a resource. Every
# field below is one that an existing promise already relies on. The JSON Schemas of these
# documents are in spec/schemas/contracts.yaml. Consolidation pass 1 took PLC-014 and part of
# PKG-011 into CTR-004, and added CTR-007. The follow-up decisions (ruling 33) added CTR-008,
# the kind `Schema`. The ruling on the core package and the schemas (ruling 37) changed CTR-001
# to CTR-004 and CTR-008, and added CTR-009. The conversion of the older text (decision DA3 of
# the docs audit, docs/proposals/docs-audit/GAPS.md) changed CTR-002 and CTR-004 to CTR-006, and
# added CTR-010. The second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md)
# changed CTR-002 to CTR-007 and CTR-010: a contract that breaks one of them is rejected when
# its package is installed or its project is submitted, a control's `changes` is a map from an
# input's name to the pointer it sets, and a Type of the family Pool offers
# `pool-management.v1`. Its closing pass (docs/proposals/reaudit/round-2/log-closing.md)
# changed CTR-002, which gained the mark `arrangesLaterWork`, and CTR-005, on what `obliges`
# adds. Its last pass (docs/proposals/reaudit/round-2/log-tail.md) changed CTR-002 and CTR-005:
# a requirement that does not narrow requests states no `obliges`. The follow-up to that pass
# changed CTR-005: a composition obliges the consumer where any constituent that narrows does.
# No promise of this file has been removed. Draft: no vector exists yet.

- id: CTR-001
  layer: language
  level: must
  when: >-
    A contract document is read.
  then: >-
    It has `apiVersion`, a `kind` that is one of `Type`, `Capability`, `Operation`,
    `Requirement` and `Schema`, `metadata` and `spec`. Its name is its export name, which
    follows NAM-004. The last segment of the name is its compatibility version, written `v` and
    a whole number from 1, and at least one segment comes before it.
  observable: >-
    A contract whose name has no version segment, such as `directory-access`, or is its version
    segment alone, such as `v1`, or that has any other top-level key, is rejected when its
    package is installed or its project is submitted. `directory-access.v1` is accepted.
  vectors: []

- id: CTR-002
  layer: language
  level: must
  when: >-
    An Operation contract is read.
  then: >-
    Its `spec` may hold `inputs` and `outputs`, each a map from a name, which may be any
    non-empty string, to a member that holds either a `schema` or, for a handle, `handle: true`,
    and may hold `optional: true`. An input that holds a `schema` may also hold `default`. The
    `spec` may further hold `effect`, a statement of what it changes outside itself;
    `startsModelWork`; `arrangesLaterWork`, the mark of an operation that arranges work to start
    or to run after its own invocation has ended; `deduplicates`; `reservedToRoot`, the mark of
    an operation reserved to the root Interface; `implementation`, its default implementation,
    which is one selection; and, for a control, `changes`, as CTR-006 states.
  observable: >-
    An operation with no `effect` changes nothing outside itself. `startsModelWork`,
    `arrangesLaterWork`, `deduplicates` and `reservedToRoot` are booleans, and one that is
    absent is false; IMP-003, ACC-019, OPS-012 and ACC-032 state what each mark means, and
    CTR-009 says where `reservedToRoot` may be written. An operation whose contract does not
    state `arrangesLaterWork: true` arranges no later work, and one that arranges a later start
    of model work states `startsModelWork: true` as well, under IMP-006. What a graph, an onward
    request and a plain implementation may do with an operation that carries the mark is
    IMP-010, IMP-011 and TPL-014. An input or output with both `schema` and `handle`, or with
    neither, or whose name is the empty string, is rejected when the contract's package is
    installed or its project is submitted. A name such as `maxResults` or `max_results` is
    accepted: the rule OBJ-022 gives for other names a document chooses does not apply to these.
    An output that states a `default`, and an input that is a handle and states one, are
    rejected in the same way. An input that states a `default` may be left out of a request
    whether or not it is marked `optional: true`, under OBJ-015. What the `default` then does is
    OPS-026, and SCH-019 rejects one that fails the input's schema.
  vectors: []

- id: CTR-003
  layer: language
  level: must
  when: >-
    A Capability contract is read.
  then: >-
    Its `spec` holds `operations`, a list of selections of the operations it includes.
  observable: >-
    A capability outside the core package that lists an operation reserved to the root
    Interface, which is one whose contract is marked `reservedToRoot: true`, is rejected when
    its package is installed or its project is submitted.
  vectors: []

- id: CTR-004
  layer: language
  level: must
  when: >-
    A Type contract is read.
  then: >-
    Its `spec` holds `family` and `placement`, a map of applied requirements on placement. It
    may also hold `schema`, the schema of an instance's `config`; `offers`, the capabilities its
    instances offer; `requires`, the operations its instances must have implemented; `runtimes`;
    `implementation`, its default implementations, a map in the form TPL-003 gives for a
    template; `controls`, a list of selections of its controls; `conditions`, the names of the
    further conditions it reports; `restoresRuntimes`, which is true where its implementation
    may restore its own runtime; and `records`, which holds `inputs` and `outputs`, each true or
    false, and says whether the records about its instances keep the inputs and the outputs of
    their operations.
  observable: >-
    A Type contract with no `family`, or with no `placement` key, is rejected when its package
    is installed or its project is submitted. A type with no requirements on placement writes an
    empty map. A type whose default implementation cannot be resolved through its own package's
    manifest is rejected in the same way. So is a Type of the family Pool whose `offers` does
    not list the core package's capability `pool-management.v1`: every Pool offers it. A type
    that states no `schema` puts no rule on the configuration of its instances, and so can list
    no control under CTR-006. One that states no `offers` offers no capability, one that states
    no `requires` requires no operation, and one that states no `runtimes`, `implementation`,
    `controls` or `conditions` has none. `restoresRuntimes`, `records` and each of the two
    members of `records` may be left out, and one that is left out is false. What restoring a
    runtime is, is OBS-005, and what a record holds is REC-002.
  vectors: []

- id: CTR-005
  layer: language
  level: must
  when: >-
    A Requirement contract is read.
  then: >-
    Its `spec` holds `appliesTo`, a list drawn from `conduit`, `policy` and `placement`. It may
    also hold `inputs`, a map from a name to a member that holds `schema` and may hold `default`
    and `optional: true`; `narrows`, which is true for a requirement that limits requests and so
    can serve as a filter; `obliges`, a list drawn from `consumer` and `target`, which says
    whether the implementations selected for the consumer of a Conduit must state the
    requirement in `supports`, as those of its target always must for a filter; and, for a
    composition, `constituents`, a map of the constituents that CTR-010 gives. A requirement
    whose `appliesTo` includes `placement` states `schema`, a schema that a location's stored
    facts must satisfy, and declares no `inputs`.
  observable: >-
    Applying a requirement somewhere its `appliesTo` does not list is rejected, so one whose
    `appliesTo` is empty can be applied nowhere. A composition that reaches itself through its
    constituents, and a requirement that applies to placement and states no `schema` or declares
    `inputs`, are rejected when the package is installed or the project is submitted. `narrows`
    may be left out, and is then false. The implementations that the target of a Conduit has
    selected for the operations the Conduit lists must always state a filter's requirement in
    `supports`, as CON-022 states, and they are always sent it. `obliges` that names `consumer`
    adds that every implementation selected for the consumer must state it too, and IFC-034 says
    how the consumer's implementation is told of the filter. A composition obliges the consumer
    where its own contract, or the contract of any of its constituents that narrows requests,
    names `consumer`, as it narrows where any of its constituents does. `obliges` may be left
    out or be empty, and one that names `target` alone means the same as one that is left out.
    An item of `obliges` other than `consumer` or `target` is rejected. A composition narrows
    requests if any of its constituents does, whatever its own `narrows` states, and applying it
    somewhere that the `appliesTo` of one of its constituents does not list is rejected. A
    requirement that does not narrow requests and states `obliges`, whatever the list holds, is
    rejected when the package is installed or the project is submitted: only a filter is sent to
    an implementation, so `obliges` on any other requirement would oblige nothing. A requirement
    that is not a composition and does not narrow requests is applied to a Conduit, itself or as
    a constituent, only where it is a contract of the core package, under CON-030, and one that
    does not narrow requests is never applied as a policy, under ACC-031. Which implementation
    applies a requirement on an open Conduit is reported under ACC-038.
  vectors: []

- id: CTR-006
  layer: language
  level: must
  when: >-
    A control is defined.
  then: >-
    It is an Operation contract whose `spec` also holds `changes`, a map from the name of one of
    its inputs to a JSON Pointer into the configuration, which is the setting that input sets.
    It declares the input `revision` and the output `settings`. A Type contract lists it under
    `controls`, and each pointer in its `changes` addresses a place in the configuration that
    the type's `schema` describes.
  observable: >-
    A type that lists a control whose `changes` addresses a place its schema does not describe,
    or that lists under `controls` an operation with no `changes`, with no input `revision` or
    with no output `settings`, is rejected when the package is installed or the project is
    submitted. So is a control in which a key of `changes` is not the name of one of its inputs.
    An instance has only the controls its type lists. `changes: {limit: /readLimit}` says that
    the input `limit` sets the setting at `/readLimit`. `revision` is the input that REV-006 and
    REV-011 require of a control, and `settings` is a map keyed by the pointers of `changes`, as
    REV-007 states.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32).

- id: CTR-007
  layer: language
  level: must
  when: >-
    A Capability contract lists two operations that have the same export name, as operations of
    two packages may.
  then: >-
    The contract is rejected.
  observable: >-
    Installation or resolving returns a diagnostic naming the two operations: the contract is
    rejected when its package is installed or its project is submitted. No capability gives two
    of its operations one name.
  vectors: []

# --- Added by the follow-up decisions (plan-audit ruling 33; decision F21 of the re-audit).

- id: CTR-008
  layer: language
  level: must
  when: >-
    A Schema contract is read.
  then: >-
    Its `spec` is a schema under the schema profile. The schema is the whole of `spec`, not a
    member of it.
  observable: >-
    A `spec` that uses a keyword or a format outside the profile is rejected under SCH-002 and
    SCH-003. A `$ref` that is a qualified reference resolves to a Schema contract that a package
    exports, and one that is `#name` to a Schema contract of the same project or package, as
    SCH-015 states. The core package's reference schemas are Schema contracts, and so are the
    schemas of documents under spec/schemas/.
  vectors: []

# --- Added with the core package (plan-audit ruling 37; change X4 of the ruling on the core
# --- package and the schemas).

- id: CTR-009
  layer: language
  level: must
  when: >-
    An Operation contract that does not belong to the core package is marked
    `reservedToRoot: true`.
  then: >-
    The contract is rejected: a package that holds it is rejected when it is installed, and a
    project that holds it is rejected when it is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the contract. Only an Operation
    contract of the core package carries the mark, as `declare-lost.v1` and `purge.v1` do, and
    ACC-032 says what it means.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; row GP1 of
# --- docs/proposals/docs-audit/GAPS.md).

- id: CTR-010
  layer: language
  level: must
  when: >-
    A Requirement contract that is a composition states a constituent.
  then: >-
    The constituent holds `requirement`, the selection of a requirement, and may hold
    `arguments`, a map that gives a value binding, as GRA-019 gives one, for an input of that
    requirement, keyed by the input's name. A value reference in it has the source `input` and
    names an input that the composition itself declares. No other source is accepted.
  observable: >-
    `arguments: {limit: {source: input, name: max-results}}` forwards the composition's input
    `max-results` to the constituent's input `limit`, and `{literal: 20}` gives it a fixed
    value. A value reference with the source `input` may add a `pointer`, as GRA-020 allows. A
    value reference whose source is `config`, `step`, `runtime` or `instance`, one that names an
    input the composition does not declare, and a bare value in place of a binding, are each
    rejected when the package is installed or the project is submitted. When the composition is
    applied, each binding takes its value from the arguments given to the composition, and the
    values are checked against the constituent's inputs as NAM-019 checks the arguments of an
    applied requirement. A constituent that leaves out `arguments` supplies none. Where a
    composition is applied to a Conduit, CON-022 says what an implementation must state in
    `supports`, and IFC-018 how the composition is sent.
  vectors: []
