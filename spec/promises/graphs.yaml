# Graphs: their static meaning and two invariants. How an engine walks a graph, including
# scheduling, retry and cancellation, belongs to that engine's runtime profile.
# Owner rulings of 2026-11-05 (plan-audit rulings 14, 23, 24, 28, 32 and 33). Draft: no vector
# exists yet. Consolidation pass 1: GRA-013 was folded into GRA-019 and GRA-016 into GRA-020.
# GRA-002 and GRA-003, the two invariants, are of the layer `convention`. GRA-023 and GRA-024
# were added. The ruling on the core package and the schemas (ruling 37) changed GRA-017. The
# conversion of the older text (decision DA3 of the docs audit,
# docs/proposals/docs-audit/GAPS.md) changed GRA-007 and GRA-020 and added GRA-025 to GRA-027,
# which say what holds when a step is dispatched and are of the layer `convention`. The second
# round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed GRA-003, GRA-014,
# GRA-017, GRA-020, GRA-022 and GRA-025 to GRA-027: a template's `setup` and `retire` graphs
# implement no operation, and are the steps the engine runs within one invocation of
# `set-up.v1` or of `retire.v1`. Its closing pass
# (docs/proposals/reaudit/round-2/log-closing.md) changed GRA-021 and GRA-026: an optional
# output is one the graph may leave without a value.
# The fix pass of the third round of the re-audit (docs/proposals/reaudit/round-3/log-fixes.md),
# on the coordinator's decisions in docs/proposals/reaudit/round-3/DECISIONS.md, which the owner
# has not ruled on, changed GRA-005, GRA-020 and GRA-026, and added GRA-028: a value reference
# does not read an output of a step that names a runtime. It removed none.
# Its follow-up, on the decisions of the section "The fix pass, and what it left" of the same
# file, which are the coordinator's too, changed GRA-005, which now covers every selection of a
# graph.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which the owner has not ruled on, changed
# GRA-003, GRA-008, GRA-022 and GRA-024: the `conduit` of a step may name a component of a
# composite declared Conduit by a dotted path, and must where more than one component lists the
# operation. It added none and removed none.
# Standing: the owner accepted these promises as they stood at the rulings that this comment
# names by number. Every change listed above for the conversion of the older text (the docs
# audit) and for rounds 2 to 4 of the re-audit is a decision of the coordinator under ruling 37,
# logged in the records named, and the owner has not ruled on it.
# Ruling 38 (2026-11-06) accepted some of those decisions and made changes of its own;
# spec/README.md says which.

- id: GRA-001
  layer: language
  level: must
  when: >-
    A step's input takes its value from another step's output.
  then: >-
    The step depends on that other step, exactly as if the dependency had been stated.
  observable: >-
    The resolved graph lists the producing step among the step's dependencies, whether or not
    the dependency was also stated.
  vectors: []

- id: GRA-002
  layer: convention
  level: must not
  when: >-
    A step depends on another step that has not succeeded.
  then: >-
    The step runs.
  observable: >-
    No record shows a step invoked before every step it depends on has the outcome succeeded. A
    dependency that failed, or whose outcome is unknown, leaves the step not run.
  vectors: []

- id: GRA-003
  layer: convention
  level: must
  when: >-
    The steps that the engine runs to set up an instance have ended.
  then: >-
    The invocation of `set-up.v1` has succeeded only if every step not marked optional has the
    outcome succeeded. Otherwise its outcome is failed or unknown, as OPS-022 states.
  observable: >-
    If any such step failed, has an unknown outcome or did not run, the instance does not become
    ready by that run, as LIF-004 states. A declared Conduit that is not opened and an entry
    whose Resource is not set up are such steps under GRA-022: setup does not succeed if one of
    them is required, and reports it as not opened or not set up if it is optional. A declared
    Conduit that is made from a composite template is decided as a whole: no component
    Conduit is opened unless the opening of every one would be dispatched, and each one that is
    opened then has its own invocation and its own outcome, under CON-004. A step for
    something that is already done is left as succeeded: a declared Conduit that is open under
    CON-004, a Resource that is ready under POOL-013, and a runtime that is held under TPL-007.
  vectors: []

- id: GRA-004
  layer: language
  level: must
  when: >-
    A template is registered whose graph names, in a dependency or a value reference, a step
    that the graph does not contain.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the step that refers and the name it refers to.
  vectors: []

- id: GRA-005
  layer: language
  level: must
  when: >-
    A template is registered whose graph contains a cycle, counting both stated dependencies and
    uses of outputs; or in which a graph invokes the operation it implements, by a step with no
    `conduit` that names that operation, or does so through other graphs, among the graphs
    selected for the template's instances, however each selection was made: in the template's
    `implementation` map, as a default of its type, or as the default of an operation's own
    contract.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the steps in the cycle, or the graphs and the
    operations that lead back to one another. A step with no `conduit` invokes the
    implementation selected for its own instance, under GRA-024, so a graph that implements
    `directory.list.v1` and holds such a step for `directory.list.v1` would invoke itself
    without end, and so would two graphs of one template each of which names the other's
    operation. A step that names a Conduit is a request to another instance and is not counted.
    Every selection under TPL-003 and TPL-004 counts, whether it writes a graph in place or
    names an implementation item whose manifest gives a `graph`. Where the template was
    registered while its type's package was not installed, as PKG-006 allows, the check is made
    when the template is instantiated, under INS-022.
  vectors: []

- id: GRA-006
  layer: language
  level: must
  when: >-
    A template is registered whose graph refers to an output that the producing operation's
    contract does not declare.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the step, the output and the operation.
  vectors: []

- id: GRA-007
  layer: language
  level: must
  when: >-
    A template is registered whose graph gives a step no value for an input that the step's
    operation requires.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the step and the input. An input for which the
    operation's contract states a `default` need not be given a value: OPS-026 fills it in.
  vectors: []

- id: GRA-008
  layer: language
  level: must
  when: >-
    A template is registered whose graph gives a step a literal value that does not satisfy the
    schema of the input it is given to.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the step, the input and the part of the schema the
    literal fails.
    The literal is checked as a supplied value is: after the defaults of the properties of the
    input's schema are filled in, under SCH-009.
  vectors: []

- id: GRA-009
  layer: language
  level: must
  when: >-
    A step states the same dependency twice, or states a dependency on a step whose output it
    also uses.
  then: >-
    The template is accepted, and the repetition has no further meaning.
  observable: >-
    The resolved graph lists the dependency once.
  vectors: []

- id: GRA-010
  layer: language
  level: must
  when: >-
    A template is registered in which a value reference with the source `config` appears in a
    graph other than a setup or retire graph.
  then: >-
    The template is rejected. `config` is accepted only in a setup or retire graph.
  observable: >-
    Resolving returns a diagnostic naming the reference. The same reference in the
    template's `setup` or `retire` graph is accepted.
  vectors: []

- id: GRA-011
  layer: language
  level: must
  when: >-
    A template is registered in which a value reference adds a `pointer` to a step's output, or
    to an input, that is a handle.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the reference.
  vectors: []

- id: GRA-012
  layer: language
  level: must
  when: >-
    The steps of a graph are written in a different order.
  then: >-
    The graph means the same.
  observable: >-
    Resolving the two templates gives the same graph.
  vectors: []

# --- Added by the consolidation rulings (plan-audit ruling 28).

- id: GRA-014
  layer: language
  level: must
  when: >-
    A graph is written as an implementation: as a value of an `implementation` map, or as the
    `graph` of an implementation item in a manifest.
  then: >-
    It implements exactly one operation.
  observable: >-
    A graph that is attached to no operation, or to more than one, is rejected with a diagnostic
    naming it. The graphs that a template writes under `setup` and `retire` are not
    implementations and implement no operation: they are the steps that the engine runs within
    an invocation of `set-up.v1` or of `retire.v1`, as TPL-008 states.
  vectors: []

- id: GRA-015
  layer: language
  level: must
  when: >-
    A step supplies values for its operation's inputs.
  then: >-
    They are written under `arguments`, a map that gives one value binding for each input,
    keyed by the input's name.
  observable: >-
    A step that writes them under `inputs` is rejected with a diagnostic naming the step.
  vectors: []

# --- The shape of a step, a value binding and an output (plan-audit ruling 31).

- id: GRA-017
  layer: language
  level: must
  when: >-
    A step is read.
  then: >-
    It has exactly one of `operation`, the selection of an operation as NAM-018 gives one, and
    `runtime`, the name of a runtime that the template or its type declares, which invokes that
    runtime's start operation. It may also have `arguments`, `dependsOn` and `optional`, and a
    step that has `operation` may have `conduit`.
  observable: >-
    A step with both, with neither, or with a runtime name that neither the template nor its
    type declares, is rejected with a diagnostic naming the step. So is a step that has
    `runtime` and carries `conduit`. Which runtimes an instance has is TPL-006.
  vectors: []

- id: GRA-018
  layer: language
  level: must
  when: >-
    A step states its dependencies.
  then: >-
    They are a list of step names under `dependsOn`.
  observable: >-
    A dependency written under any other key is rejected under OBJ-019.
  vectors: []

- id: GRA-019
  layer: language
  level: must
  when: >-
    A value binding is written.
  then: >-
    It is exactly one of: `{literal: value}`; a reference, which is a map with `source`;
    `{object: {...}}`, whose members are value bindings; and `{list: [...]}`, whose items are
    value bindings. No part of a string is ever substituted.
  observable: >-
    A bare value, an empty binding and a binding with two forms are each rejected with a
    diagnostic naming where it is written. A string that contains `${...}` is passed on exactly
    as written.
  vectors: []

- id: GRA-020
  layer: language
  level: must
  when: >-
    A value reference is written.
  then: >-
    Its `source` is one of five: `input`, with the `name` of an input of the operation the graph
    implements; `config`; `step`, with the `step` and the `output`; `runtime`, with the `name`
    of a runtime, which yields its handle; and `instance`, with the `name` `id` or `name`. All
    but `runtime` and `instance` may add a `pointer`.
  observable: >-
    Any other source is rejected. So is a value reference written with `from` in place of
    `source`: `from` names only the template of an instance or of a nested instantiation.
    `input` is rejected in a `setup` or `retire` graph, which implements no operation and has no
    inputs of its own under TPL-008: the engine reads the input `instance` of `set-up.v1` and of
    `retire.v1`, and the graph reaches the instance through the source `instance`. `config` is
    rejected elsewhere, as GRA-010 states. `step`, `runtime` and `instance` are accepted in
    every graph, but a reference with the source `step` to a step that names a runtime is
    rejected under GRA-028: the handle is read with the source `runtime`. In a constituent of a
    composed requirement, which is not a graph, `input` is the only source, and it names an
    input of the composition, as CTR-010 states.
  vectors: []

- id: GRA-021
  layer: language
  level: must
  when: >-
    A graph implements an operation whose contract declares outputs.
  then: >-
    It has an `outputs` map that gives each declared output a `value`, a value binding, and may
    mark an output the contract makes optional as `optional: true`. An output so marked is one
    the graph may leave without a value.
  observable: >-
    A graph that gives no value for a required output, or names an output the contract does not
    declare, is rejected, and so is one that marks as optional an output the contract does not
    make optional. A setup or retire graph with `outputs` is rejected. Where the value binding
    of an output marked optional yields no value when the graph runs, the result holds no such
    output and the invocation's outcome is as its steps give it, under OPS-022. An output the
    contract makes optional may also be left out of the `outputs` map altogether.
  vectors: []

- id: GRA-022
  layer: language
  level: must
  when: >-
    A template declares Conduits or, for a Pool, entries.
  then: >-
    Each declared Conduit and each entry is a step of the setup of the template's instances,
    under its own name, whether or not the template writes a `setup` graph. A step written under
    the `steps` of `setup` may name it in `dependsOn`, and may not take the same name.
  observable: >-
    A step that depends on the declared Conduit `checkout` runs only after that Conduit is open.
    A step written under the name `checkout` is rejected.
    A declared Conduit that is made from a composite template is one step, under the declared
    Conduit's name, however many components it has: CON-004 says when that step has succeeded.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32).

- id: GRA-023
  layer: language
  level: must
  when: >-
    A graph is written.
  then: >-
    It is a map that holds `steps`, a map from each step's name to the step, and, where GRA-021
    requires them, `outputs`. A template's `setup` and its `retire` each hold `steps`.
  observable: >-
    Steps written as a list, or written directly under `setup` or `retire` without the key
    `steps`, are rejected with a diagnostic naming the graph.
  vectors: []

- id: GRA-024
  layer: language
  level: must
  when: >-
    A step names an `operation`.
  then: >-
    Without `conduit`, the step invokes the implementation selected for its own instance. With
    `conduit`, the step is a request through a declared Conduit of the template to its target,
    and it depends on the step that GRA-022 gives that declared Conduit, exactly as if the
    dependency had been stated. The value of `conduit` is the name of one of the template's
    declared Conduits or, for one that is made from a composite template, that name followed by
    the name of each component on the way to a component, outermost first, joined by dots, as
    IFC-012 writes them in a tool's name. The request goes through the one Conduit, among those
    that the value names, that lists the operation. A step whose `conduit` names a declared
    Conduit that is made from a composite template, or a component that is itself made from one,
    in which more than one component Conduit lists the operation, is rejected when the template
    is registered.
  observable: >-
    A step whose `conduit` names no declared Conduit of the template and no component of one, or
    whose operation is not one that a Conduit it names lists, is rejected with a diagnostic
    naming the step. With the declared Conduit `checkout` made from a composite whose components
    `read` and `audit` both list `directory.read.v1`, `conduit: checkout.read` names the
    component `read`, and `conduit: checkout` with that operation is rejected, because nothing
    would say through which of the two Conduits, and so with which filters, the request goes.
    Where only one of the components lists the operation, `conduit: checkout` is accepted and
    means that component's Conduit. The implementation that receives the request is sent the ID
    of that Conduit in `io.github.shrav-k.conduit/conduit`, under IFC-006. The resolved setup
    graph lists the declared Conduit's step among the dependencies of a step that carries
    `conduit`, whether or not `dependsOn` also names it, so that step runs only after the
    Conduit is open, which for a composite is after every one of its component Conduits is open,
    under CON-004. `dependsOn` names the declared Conduit by its name alone. Where the template
    of the declared Conduit could not be read when the template was registered, because it did
    not exist yet under OBJ-008 or its package was not installed under PKG-006, or where an
    input fills the `operations` of a component under INS-023, the check is made when the
    template is instantiated, under INS-022.
    Resolving fixes which Conduit a step goes through: the resolved graph that an instance
    holds, under INS-013, names the one component. A replacement that is made later under
    LIF-009, from a template that has changed since, does not change which component the step
    means, and where the Conduit of that component no longer lists the operation the step
    reports refused under ACC-001.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; rows GP8, GP9
# --- and GP10 of docs/proposals/docs-audit/GAPS.md). These three are of the layer `convention`.

- id: GRA-025
  layer: convention
  level: must
  when: >-
    A step is about to be dispatched, and the values that its value bindings yield do not
    satisfy the inputs of the step's operation.
  then: >-
    The step is not dispatched, and reports invalid.
  observable: >-
    No implementation receives a call for the step. The check is made on the values the bindings
    yield, with the defaults of OPS-026 filled in, whatever GRA-007 and GRA-008 found when the
    template was registered: a value that another step's output or the configuration supplies is
    checked here for the first time. A value that fails is not converted, as SCH-011 states. A
    step that reports invalid has not succeeded, so GRA-002 leaves the steps that depend on it
    not run, and the steps that ran before it keep their outcomes.
  vectors: []

- id: GRA-026
  layer: convention
  level: must
  when: >-
    A step is about to be dispatched, and a value reference among its arguments yields no value:
    its `pointer` selects nothing in the value its source names, or its source names something
    that is absent. An optional input that the request left out and that states no default is
    absent, and so are an output that the step it names did not return in this run and a runtime
    that the instance does not hold.
  then: >-
    The step is not dispatched, and reports invalid. A step that is not dispatched in a run,
    because it is left as succeeded or was reconciled, returned no outputs in that run.
  observable: >-
    No implementation receives a call for the step. No null and no default stands in for the
    missing value, even where the input is optional or states a default. The pointer
    `/connection/endpoint` selects nothing in an output whose `connection` has no `endpoint`. A
    pointer that selects a member whose value is null selects a value, and that null is checked
    against the input's schema like any other value. A step did not return an output in a run
    where the output is optional and its result left it out, and where the step was not
    dispatched in that run: it was left as succeeded for something already done, under GRA-003,
    an engine did not dispatch it again under DL1 of the implementation-defined list, or its
    invocation was reconciled as having occurred, which gives it no outputs. The outputs of an
    earlier run are not read in a later one. A step that reads the output of such a step
    therefore reports invalid in that run, and a graph whose later runs are to succeed takes
    what it needs from `config`, or from the source `runtime` for a handle, as GRA-028 requires.
    Where a value reference in a graph's `outputs` yields no value, OPS-022 gives the
    invocation's outcome, unless the output is marked optional under GRA-021.
  vectors: []

- id: GRA-027
  layer: convention
  level: must
  when: >-
    The steps of a `setup` or a `retire` graph run, and the graph reads the instance's
    configuration through a value reference with the source `config`.
  then: >-
    Every such reference in that run yields the configuration as it stood when the invocation of
    `set-up.v1` or of `retire.v1` that runs the steps was dispatched.
  observable: >-
    Two steps of one run that read the same setting receive the same value, whenever each of
    them runs. A change to the configuration that is stored while the graph runs does not reach
    that run, and a later run reads the configuration as changed. REV-012 already keeps another
    change of the same instance from being dispatched while its setup or retirement has not
    ended.
  vectors: []

# --- Added by the fix pass of the third round of the re-audit
# --- (docs/proposals/reaudit/round-3/log-fixes.md; finding 3C-9). It is a rule on documents and
# --- has the layer `language`.

- id: GRA-028
  layer: language
  level: must
  when: >-
    A template is registered in which a value reference with the source `step` names a step that
    names a runtime.
  then: >-
    The template is rejected. The handle of a runtime is read with the source `runtime`.
  observable: >-
    Resolving returns a diagnostic naming the reference and the step. A runtime's start
    operation declares its handle and may declare other outputs, under TPL-006, and none of them
    is read through the step: once the instance holds the runtime the step is left as succeeded
    with nothing dispatched, under TPL-007, and returns no outputs in that run, under GRA-026.
    `{source: runtime, name: watcher}` yields the handle in every run in which the instance
    holds the runtime. A step may still name such a step in `dependsOn`.
  vectors: []
