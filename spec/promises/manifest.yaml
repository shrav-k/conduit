# The manifest: its file, its keys and the layout of a package's archive.
# Owner ruling of 2026-11-05 (plan-audit ruling 37), which accepted these promises as one
# batch with spec/core/ and spec/schemas/. They were written for decision G1 of the re-audit
# (plan-audit ruling 32), and the record is docs/proposals/core-and-schemas/README.md.
# Each rule follows an existing practice: one project file with a fixed name, as Go's
# `go.mod` and Cargo's `Cargo.toml` are, read with the ending `.yml` too, as kubectl and
# kustomize read it; a format version inside the file, as a Helm chart's `Chart.yaml` carries
# `apiVersion`; the files of one directory and not of those below it, as Terraform reads a
# module; a program and its arguments as a list, as Kubernetes and Docker write `command`; a
# published server and a remote server as the Model Context Protocol Registry's server.json
# describes them; and an archive with the project file at its root, rejecting members that
# would be written outside it, as npm and Cargo do. What naming.yaml and packages.yaml
# promise is cited and not restated: what an item of `packages` must state is NAM-006 and
# NAM-012; a package's own address and version PKG-017; which documents are exports PKG-018;
# what an implementation states PKG-019 and PKG-020; what a template or an instance holds
# for a package NAM-009 and PKG-005; and which reason a rejected installation reports
# PKG-023. The JSON Schema of these shapes is spec/schemas/manifest.yaml. The conversion
# of the older text (decision DA3 of the docs audit, docs/proposals/docs-audit/GAPS.md)
# changed what MAN-003 and MAN-007 cite. The second round of the re-audit
# (docs/proposals/reaudit/round-2/DECISIONS.md) changed MAN-001 and MAN-006: a manifest holds
# one YAML document, a project is the documents and the one manifest handed over together,
# and what gives `fetch` is called an item of `packages`. Its closing pass
# (docs/proposals/reaudit/round-2/log-closing.md) changed MAN-006 and MAN-010: a relative
# `fetch` or program is resolved against the directory the manifest was read from, and is
# rejected where there is none. Its last pass (docs/proposals/reaudit/round-2/log-tail.md)
# changed MAN-006: reading a manifest installs nothing. No promise of this file has been
# removed. Draft: no vector exists yet.
# The fix pass of the third round of the re-audit (docs/proposals/reaudit/round-3/log-fixes.md),
# on the coordinator's decisions in docs/proposals/reaudit/round-3/DECISIONS.md, which ruling 39
# accepted, changed MAN-007 and MAN-009 to MAN-011: a package holds no instance
# document, and the keys of an implementation item's `placement` follow OBJ-022. It removed
# none.
# Its follow-up, on the decisions of the section "The fix pass, and what it left" of the same
# file, which are the coordinator's too, changed MAN-009.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which ruling 39 accepted, changed
# MAN-004: `address` and `version` change nothing in the manifest of a submitted project. It
# added none and removed none.
# The follow-up to that pass, on the decisions of the section "The fix pass, and what it left"
# of the same file, which are the coordinator's too, changed MAN-008.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40
# (docs/proposals/ruling-40/README.md) and the principles review
# (docs/proposals/principles-review/README.md), removed MAN-008 under the review's decision 9:
# a package exports only its own documents (MAN-007), and nothing replaces it. It changed
# MAN-001, MAN-002, MAN-004, MAN-006, MAN-007 and MAN-009 to MAN-012: the manifest may be named
# `conduit.yml` and documents may end in `.yml` (alignment C14), a submitted project with
# contracts states its `address` (decision 11), `fetch` follows decision 21, and an
# implementation item is reached by `command`, `package` or `remote`, with no `url` and no
# `graph` (decisions 1 and 25). It added MAN-015 to MAN-017. The log is
# docs/proposals/ruling-41/log-G6.md. The coverage check of the rewrite
# (docs/proposals/ruling-41/log-integration.md, "Coverage check") changed MAN-004, on the
# `operations` of a bound (ACC-029), and MAN-010, under which a Package's transport is `stdio`
# or `streamable-http`, since IFC-017 reaches a run over no other.
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06) accepted the coordinator's
# decisions in docs/proposals/ruling-41/open-decisions.md. Applying them, it changed MAN-010:
# a positional argument is keyed by its `valueHint`, and a relative program is run only by the
# engine's own runner (rows 17 and 35); MAN-015 and MAN-016: two submissions may state one
# address, and a package may be installed there once no template or instance holds one (rows
# 10 and 36); and MAN-017: a pointer to a place that admits an object or an array, or an input
# marked `isRequired: true` bound to a place that admits null, is rejected (rows 22 and 24). It
# added none and removed none.
# The names of ruling 42 (the vocabulary audit's N2 and N9; log
# docs/proposals/ruling-42/log-rename-a.md) renamed the key `placement` of an implementation
# item, and of an item of the core package's manifest, to `nodeSelector` in MAN-009, MAN-010 and
# MAN-012, and the engine's own machine to the engine's own machine provider in MAN-012. It
# removed none and added none.
# The names of ruling 42 (the vocabulary audit's N1, N6 and N7; log
# docs/proposals/ruling-42/log-rename-b.md) renamed the key `arguments` of an implementation
# item to `packageArguments`, which binds only an argument of the Package's own
# `packageArguments`, in MAN-009, MAN-010 and MAN-017; removed the item's `digest`, so that a
# Package is pinned by its own `fileSha256`, or an `oci` one by a digest in its `identifier`, in
# MAN-009 and MAN-010; and renamed `reveal-secret.v1` to `get-secret.v1` in MAN-012. It removed
# none and added none.
# Ruling 43 (docs/proposals/ruling-43/README.md, 2026-11-06), which accepted the proposal on
# work across machines (docs/proposals/multi-machine/README.md), added MAN-018, under which a
# template whose item binds a variable that `identity` carries is rejected, since Q1 fixes
# those names. It changed MAN-010, whose observable says that a server meant for another
# machine is published as a `package` item, since a relative program runs only on the engine's
# own runner (D20, A), and that another runtime provider runs a `stdio` package only by
# bridging it behind its gate (PRV-012, PRV-025). It removed none. What changed is in
# docs/proposals/ruling-43/log-secrets.md. The verification of ruling 43
# (docs/proposals/ruling-43/log-integration.md, "Verification") changed MAN-018, which compares
# a variable's name without regard to case, as Windows does.
# The fix pass of round 5 of the re-audit (docs/proposals/reaudit/round-5/log-fix-F2.md), on
# the coordinator's decisions in docs/proposals/reaudit/round-5/DECISIONS.md, changed MAN-010,
# under which a Remote's `url` that holds a variable is rejected (M23), and MAN-017, under
# which the schema of a bound place confines its value to a string, a number, a boolean or
# null (M17, M30). It added none and removed none.
# The coordinator's decision on finding 1-06 of increment 1 of the first build, under ruling
# 46, point 4 (docs/proposals/first-build/log-increment-1.md), changed MAN-011: a name that
# begins with a dot is not read, as Terraform skips one in a module; names and endings are
# compared exactly; a link to a file is followed and one to a directory is not entered; and an
# entry that cannot be read is rejected under SUB-010. It added none and removed none. The
# owner can strike it.

- id: MAN-001
  layer: language
  level: must
  when: >-
    A project's manifest is read.
  then: >-
    It is the one file named `conduit.yaml`, `conduit.yml` or `conduit.json`, the last for the
    JSON form that SCH-013 allows, that lies in the project's directory itself, and it holds
    exactly one YAML document.
  observable: >-
    A file of one of those names is read as the manifest and never as a template, an instance or
    a contract. A manifest file that holds two YAML documents, or a JSON manifest that holds an
    array, is rejected with a diagnostic naming the file. A project is the documents and the one
    manifest handed over together in one registration, and a directory is one way to hand them
    over. Where several files are submitted without a directory, the manifest is the one among
    them that has that name, and where a registration hands the manifest over as a value, as the
    input `manifest` of `register.v1` does, that value is the manifest.
  vectors: []

- id: MAN-002
  layer: language
  level: must
  when: >-
    A project's directory holds more than one of `conduit.yaml`, `conduit.yml` and
    `conduit.json`, or several files submitted without a directory include more than one file
    with any of those names.
  then: >-
    The submission is rejected.
  observable: >-
    Resolving returns a diagnostic naming the files, and nothing is registered. A project has at
    most one manifest.
  vectors: []

- id: MAN-003
  layer: language
  level: must
  when: >-
    A manifest is read.
  then: >-
    It carries `apiVersion`, as OBJ-017 requires of a document, and has no `kind`, no
    `metadata` and no `spec`.
  observable: >-
    A manifest with no `apiVersion`, or with one the engine does not know, is rejected with a
    diagnostic naming it, and so is a manifest that carries `kind`, `metadata` or `spec`. The
    `apiVersion` says which version's names apply to the manifest, as OBJ-024 states for a
    document. The rules on syntax and on numbers of SCH-012, SCH-017, SCH-006, SCH-020 and
    SCH-021 apply to a manifest as to any document.
  vectors: []

- id: MAN-004
  layer: language
  level: must
  when: >-
    A manifest is read.
  then: >-
    Beside `apiVersion` it may hold `packages`, `exports`, `implementations`, `address` and
    `version`, and it holds `version` only beside `address`. There are no other keys.
  observable: >-
    A manifest with any other top-level key, or with `version` and no `address`, is rejected
    with a diagnostic naming the key. The manifest of a package, which is read from the
    package's archive when it is installed, states both, as PKG-017 requires. The manifest of a
    submitted project, which is handed over for registration, states `address` where MAN-015
    requires it, and may state `address`, and `version` beside it, where it does not; a project
    that is handed over for registration is never published, whatever its manifest states. Its
    contracts are then named `address#name` outside its own documents, under SUB-008, a
    reference written `#name` in it means what NAM-022 gives it in any submitted project, and a
    qualified reference that uses the address its manifest states is rejected under NAM-007,
    because that address is not among its `packages`, the `operations` of a bound apart, which
    are compared as names under ACC-029. The address may not be the core package's, under
    NAM-021, nor one at which a package is installed, under MAN-016.
  vectors: []

- id: MAN-005
  layer: language
  level: must
  when: >-
    A manifest lists the packages its project uses.
  then: >-
    `packages` is a map keyed by each package's address. Each item states what NAM-006
    requires under the keys `version` and `digest`, and may hold `fetch`, the key of NAM-012.
    An item has no other keys.
  observable: >-
    `packages` written as a list, and an item with any other key, are each rejected with a
    diagnostic naming it. The form of an address is NAM-001, the form of a version is PKG-001
    and the form of a digest is PKG-004. An address written twice is a duplicate key, rejected
    under SCH-012.
  vectors: []

- id: MAN-006
  layer: language
  level: must
  when: >-
    An item of `packages` in a manifest gives `fetch`.
  then: >-
    Its value is a URI reference, as RFC 3986 gives one, to the package's archive file, checked
    by the format `uri-reference`. A relative reference is resolved against the directory the
    manifest was read from, to a `file:` URL. Where the manifest was handed over without a
    directory, a relative reference is rejected. It carries no user information, the part of a
    URI where RFC 3986 places a credential, and one that does is rejected.
  observable: >-
    `fetch: https://example.org/downloads/history-1.4.0.tar.gz` and `fetch:
    ../history/history-1.4.0.tar.gz` each name one archive file, and `fetch:
    https://user:token@example.org/history-1.4.0.tar.gz` is rejected: a credential comes from
    the scheme's own mechanism, under NAM-012. The package is still identified by its address,
    as NAM-012 states, and the digest decides whether what was fetched satisfies the item, under
    PKG-021. Which schemes are fetched, and by what, is NAM-012 and PRV-017. A manifest is
    handed over without a directory where several files are submitted without one, or where a
    registration hands it over as a value, as the input `manifest` of `register.v1` does:
    `fetch: ../history.tar.gz` in such a manifest is rejected with a diagnostic naming the item.
    It is rejected when the manifest is read, whether or not anything is ever fetched: reading a
    manifest installs nothing, under NAM-012. The input `fetch` of `install.v1` is a URI
    reference in the same way, and a request has no directory, so a relative one is rejected
    there too. An installation of an item whose `fetch` is relative gives `install.v1` the
    reference as resolved against the manifest's directory.
  vectors: []

- id: MAN-007
  layer: language
  level: must
  when: >-
    A manifest lists `exports`.
  then: >-
    `exports` is a list, and each item is the name of a document of the package, which PKG-018
    makes an export.
  observable: >-
    An item that is not a name, such as a qualified reference, and a name that no document of
    the package has, are each rejected with a diagnostic naming the item: a package exports only
    its own documents. A name is the name of one document, because no two documents of a package
    share a name under NAM-027. That document is a template or a contract: a package holds no
    instance document, under MAN-011, so no item names one. An implementation is not listed in
    `exports`: its item under `implementations` is what exports it, as PKG-019 states. A name
    written twice is rejected under PKG-012, and a name that an implementation also has under
    NAM-027.
  vectors: []

- id: MAN-009
  layer: language
  level: must
  when: >-
    A manifest lists `implementations`.
  then: >-
    `implementations` is a map keyed by each implementation's name. An item holds the keys that
    PKG-019 and PKG-020 name, and no other: `implements`; exactly one of `command`, `package`
    and `remote`; and, where they are given, `plain`, `tools`, `supports`, `nodeSelector`,
    `environment`, `packageArguments` and `headers`.
  observable: >-
    An item with two of `command`, `package` and `remote`, with none of them, or with any other
    key, such as `url` or `graph`, is rejected with a diagnostic naming the item. What leaving
    out `supports` or `nodeSelector` means is PKG-019, what `plain` and `tools` require of each
    other is PKG-020, which keys go with which way of reaching the implementation is MAN-010,
    and the name follows NAM-004. The one exception is the core package's own manifest, under
    MAN-012.
  vectors: []

- id: MAN-010
  layer: language
  level: must
  when: >-
    The keys of an implementation item are read.
  then: >-
    `implements` is a list of selections of operations, and `supports` a list of selections of
    requirements, each written as NAM-018 gives a selection. `command` is a list of one or more
    strings: a program, then its arguments. `package` is one Package as the schema of the Model
    Context Protocol Registry's server.json, version 2025-12-11, gives it, whose `transport` is
    of the `type` `stdio` or `streamable-http`, and which is pinned: by its own `fileSha256`,
    the SHA-256 of the package file in lowercase hexadecimal, or, where its `registryType` is
    `oci`, by a digest in its `identifier`, written after the repository as `@sha256:` and the
    hash in lowercase hexadecimal. `remote` is one Remote of that schema whose `type` is
    `streamable-http`. `environment` is a map from the name of a variable to a JSON Pointer into
    the instance's configuration, the name being, for a `package` item, one that the Package
    declares. `packageArguments` is a map from an argument that the Package declares in its own
    `packageArguments`, named by its `name`, with its dashes, where it is a named argument and
    by its `valueHint` where it is positional, and `headers` a map from the name of a header
    that the Remote declares, to such a pointer. `nodeSelector` is a label selector. `plain` is
    a boolean. `tools` is the map of PKG-020, and each of its values is a non-empty string.
  observable: >-
    A `command` written as one string, a `package` whose `transport` is `sse`, one of any
    `registryType` but `oci` that states no `fileSha256`, an `oci` one whose `identifier` holds
    no digest, a `remote` whose `url` is not a URI or whose `type` is another transport, and a
    name in `environment` or `headers` that the Package or the Remote does not declare, are each
    rejected with a diagnostic naming the item. So is a key of `packageArguments` that names no
    argument of the Package's `packageArguments`, that names more than one, or that names one
    that states a fixed `value`, which server.json says should not be configurable by end users,
    and so is an item that states `environment` beside `remote`, `packageArguments` beside
    anything but `package`, or `headers` beside anything but `remote`. A `url` that
    holds a variable, written in braces as server.json writes one, such as
    `https://{tenant}.example.com/mcp`, is not a URI and is so rejected: no key
    binds a variable of a Remote, so the item writes its URL whole, and a Remote's
    `variables` are never used. A key of `packageArguments` is the name by which
    server.json refers to an argument from a Package's transport URL, and a
    variable inside an argument's `value` is not bound by the map. No key binds the
    Package's `runtimeArguments`, which go to the runtime command, such as `npx` or
    `docker`, and so are the runtime provider's, under PRV-012. The item states its artifact's
    hash once, in the Package, as server.json writes it. `plain: false` means the same as
    leaving `plain` out. A key of `nodeSelector` is a label and not a name, under OBJ-022. A
    program given as a relative path is taken from the directory the manifest was read from,
    which for a package is the root of its archive, and only the engine's own runner runs it,
    under PRV-007, so a server meant to run on another machine is published as a `package` item,
    pinned as above; no shell reads the list. Where the manifest was handed over without a
    directory, as MAN-006 describes, an item whose program is a relative path is rejected. A
    program is a relative path where it holds a `/` and does not begin with one; one that holds
    no `/` is a name and not a path, and is found as the one who starts it finds programs. The
    runtime provider runs a `command` or `package` item, under PRV-007: one other than the
    engine's own runner is reached over Streamable HTTP, under IFC-017, so it runs a `package`
    whose transport is `stdio` only by bridging it behind its gate, under PRV-025, and
    otherwise ends the run failed, under PRV-012. Which places a pointer may name is MAN-017,
    and which names `environment` may not bind is MAN-018. What a pointer to a place that
    `secret-reference.v1` governs yields is SEC-010 and SEC-013, and to which URL a header that
    carries a secret may go is SEC-024.
  vectors: []

- id: MAN-011
  layer: language
  level: must
  when: >-
    A project's directory is read, whether it was submitted or is the content of a package's
    archive.
  then: >-
    Its documents are the files whose names end in `.yaml`, `.yml` or `.json`, do not begin with
    a dot, and lie in the directory itself, apart from the manifest. Nothing in a directory below
    it is read. A package holds templates and contracts only: a package whose archive holds an
    instance document is rejected when it is installed.
  observable: >-
    A project keeps the programs of its implementations, and any other file, in directories
    below its own. A file in the directory itself that has one of the three endings and holds
    something other than templates, instances or contracts is rejected under SUB-005. A
    submitted project may hold instance documents, which the registration instantiates. A
    package may not: installing registers nothing, under NAM-013, so an instance document in an
    archive could never be used, and installation returns a diagnostic naming it. The request to
    install reports invalid under PKG-023. A file with any other ending is not a document and is
    not read. Nor is a file whose name begins with a dot, such as `.notes.yaml`, or
    `._templates.yaml`, which `tar` on macOS stores beside `templates.yaml` for its extended
    attributes, as Terraform skips such a name when it reads a module. Names and endings are
    compared exactly: the manifest is named `conduit.yaml`, `conduit.yml` or `conduit.json`, and
    the endings are `.yaml`, `.yml` and `.json`, in lower case, so `Conduit.yaml` is a file of
    documents and `notes.YAML` is not read. A link to a file is read as that file, and a link to
    a directory is not entered. An entry whose name this promise reads and that cannot be read
    as a regular file, such as a link that leads nowhere, a file that the engine may not read or
    anything that is not a regular file, is rejected under SUB-010 and never skipped, so that a
    link named `conduit.yaml` that leads nowhere does not leave the project read as one with no
    manifest. Documents in a directory below are another project, with a manifest of its own if
    it uses packages.
  vectors: []

- id: MAN-012
  layer: language
  level: must
  when: >-
    The manifest of the core package, whose address is `github.com/shrav-k/conduit/core`, is
    read.
  then: >-
    Its implementations are the engine itself. Each item states `implements`, may state
    `nodeSelector`, and states none of `command`, `package` and `remote` and no `supports`.
  observable: >-
    An item of any other package that states none of the three is rejected under MAN-009. The
    core package is built into the engine under NAM-020, so it has no archive and no digest, and
    its manifest lists no `packages`. What a template or an instance that refers to it then
    holds is NAM-009 and PKG-005. The engine applies the requirements of the core package,
    `bound.v1` and `shared-host.v1`, itself and is sent none, under CTR-005, so a request for an
    operation of the core package that carries a filter reports unavailable under ACC-015. Its
    items list no operation of a provider capability: the engine's own runner, machine provider
    and fetching serve under PRV-003 without being selected as an implementation, and no engine
    serves `get-secret.v1`, under SEC-020.
  vectors: []

- id: MAN-013
  layer: language
  level: must
  when: >-
    A package's archive is read.
  then: >-
    The manifest lies at the root of the archive, with no directory around it, and the
    package's documents lie beside it, as MAN-011 states.
  observable: >-
    An archive whose root holds no manifest, or holds one only inside a directory, is rejected
    when the package is installed, with a diagnostic naming the archive. Unpacking the archive
    into an empty directory gives the project's directory as it was published. What the
    archive file itself must be is PKG-022, and which reason the installation reports is
    PKG-023.
  vectors: []

- id: MAN-014
  layer: language
  level: must
  when: >-
    A package's archive holds a member whose path is absolute or has a `..` segment, or a
    member that is a link to a place outside the archive.
  then: >-
    The package is rejected.
  observable: >-
    Installation returns a diagnostic naming the member, and nothing is written outside the
    place where the engine keeps the package. Which reason the installation reports is
    PKG-023.
  vectors: []

# --- Added by ruling 41 (docs/proposals/ruling-41/README.md; decisions 11 and 25d of the
# --- principles review, docs/proposals/principles-review/README.md).

- id: MAN-015
  layer: language
  level: must
  when: >-
    A submitted project holds a contract document, or its manifest lists an implementation, and
    it has no manifest or its manifest states no `address`.
  then: >-
    The submission is rejected.
  observable: >-
    Resolving returns a diagnostic naming the project's manifest, or saying that none was handed
    over, and nothing is registered; the registration reports invalid under OBJ-023. The address
    names the project's contracts and implementations outside its own documents, as
    `address#name` under SUB-008: in Conduit's keys on the wire, in the `operations` of a bound
    and where inspecting names an implementation. A project that holds only templates and
    instances needs no address. The address follows NAM-001, and may be neither the core
    package's, under NAM-021, nor that of an installed package, under MAN-016.
    Two submissions may state one address, under SUB-008.
  vectors: []

- id: MAN-016
  layer: language
  level: must
  when: >-
    A submitted project's manifest states, as its `address`, the address of a package that is
    installed, at any version.
  then: >-
    The submission is rejected.
  observable: >-
    Resolving returns a diagnostic naming the address, and the registration reports invalid
    under OBJ-023. A qualified reference at that address reaches the installed package's
    exports, so the project's contracts cannot be named by it as well. The other order,
    installing a package at the address of a submitted project, reports conflict under PKG-029
    while a template or an instance holds a submission at that address.
    The core package's address is ruled out in the same way, under NAM-021.
  vectors: []

- id: MAN-017
  layer: language
  level: must
  when: >-
    A template selects an implementation item, by its `implementation` map or by default, whose
    `environment`, `packageArguments` or `headers` gives a JSON Pointer to a place in the
    configuration that the schema of the template's type does not require, with every member on
    the way to it required, or that this schema does not confine, by `type`, `enum` or `const`,
    to a string, a number, a boolean or null, in itself or in each branch of its `anyOf` or
    `oneOf`, a `$ref` standing for the schema it leads to, unless `secret-reference.v1` governs
    the place under SEC-001; or the item binds an input that the Package or the Remote marks
    `isRequired: true` to a place whose schema admits null.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the item, the name and the pointer. With a type whose
    schema is `{type: object, properties: {root: {type: string}, depth: {type: integer}},
    required: [root]}`, the pointer `/root` is accepted and `/depth` is not, and neither is a
    pointer into a member that is not itself required, so every instance of the template has a
    value at each place the item reads. A type that states no `schema` requires nothing, so a
    template of it that selects an item with a pointer is rejected. A pointer to `/tags` where
    the schema gives `{type: array}` is rejected too, and so is one to a place whose schema is
    `{}`, or that `required` names and neither `properties` nor `additionalProperties`
    describes, since either admits a map or a list: a variable, an argument or a header holds
    a string, and the formats that server.json gives an input are string, number, boolean and
    filepath. How a number, a boolean or null is given is PRV-007. A place may hold null where
    its schema admits it, and the variable, the argument or the header is then left out, under
    PRV-007 and IFC-041, which is why an input marked `isRequired: true` is bound only to a
    place that cannot hold null. The value at the place is given to the run under PRV-007, or
    sent as a header under IFC-041, and a value at a place that `secret-reference.v1` governs is
    read under SEC-010 or SEC-013. The check is made when the template is registered, against
    the type's schema and the item as the template holds them under NAM-009.
  vectors: []

# --- Added by ruling 43 (docs/proposals/ruling-43/README.md): under Q1 the names of what
# --- `identity` carries are fixed, which settles item 2 of "Needs a decision", and X3 of the
# --- verification, in docs/proposals/ruling-42/log-integration.md.

- id: MAN-018
  layer: language
  level: must
  when: >-
    A template selects an implementation item, by its `implementation` map or by default, whose
    `environment` binds a variable that has the name of one that `identity` carries under
    PRV-022, `CONDUIT_URL` or `CONDUIT_IDENTITY_DIR`, compared without regard to case.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the item and the variable, as MAN-017 has one name the
    item, the name and the pointer. A run is so never given one name both in `identity` and in
    `environment` or under `environment` in `secrets`, and no configuration sets a variable of
    `identity`, the engine's address or the directory of its files: whoever writes an instance's
    configuration need not be who may act as the instance, and a value of its choosing could
    send the run's credential to an address of its own, against IFC-022. The names are fixed, as
    Kubernetes fixes the paths of the token and the root certificate that it mounts in a Pod, so
    the check needs no choice that an engine makes under DL13: it is made when the template is
    registered, against the item as the template holds it under NAM-009, as MAN-017's is. Names
    are compared without regard to case, since on an operating system such as Windows a
    variable's name is, and `conduit_url` there is the same variable. A name that the item does
    not bind is not covered, and neither is an argument or a header, which `identity` does not
    carry; a default that the item's Package declares for such a name is not given, since the
    runtime provider gives the value of `identity` in its place, under PRV-022. The engine's own
    runner passes no variable of the engine's environment by such a name either, under PRV-023.
  vectors: []
