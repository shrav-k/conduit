# Objects: names, IDs, references and the shape of a document.
# Owner rulings of 2026-11-05 (plan-audit rulings 18, 19, 21, 28, 32 and 33). Draft: no vector
# exists yet. Consolidation pass 1: OBJ-011 was reduced to the rename operation; the rejection
# it shared with SUB-007 is OBJ-002, which also took in FST-004. INS-015 was folded into
# OBJ-013. OBJ-020 to OBJ-022 were added. The follow-up decisions (ruling 33) added OBJ-023,
# which is of the layer `convention`. The ruling on the core package and the schemas (plan-audit
# ruling 37) changed OBJ-003, OBJ-006, OBJ-013, OBJ-014, OBJ-018, OBJ-019, OBJ-021 and OBJ-023
# and added none. The conversion of the older text (decision DA3 of the docs audit,
# docs/proposals/docs-audit/GAPS.md) changed OBJ-019. The second round of the re-audit
# (docs/proposals/reaudit/round-2/DECISIONS.md) reduced OBJ-002 and OBJ-011 to their rules on
# documents, changed OBJ-001, OBJ-003, OBJ-004, OBJ-009, OBJ-010, OBJ-013 to OBJ-016, OBJ-021
# to OBJ-023, and added OBJ-025 and OBJ-026, which are of the layer `convention`. No promise of
# this file has been removed.

- id: OBJ-001
  layer: language
  level: must
  when: >-
    A template or an instance of one of the five families gives a name that is not made only of
    lowercase letters, digits and hyphens, or does not start with a letter, or is longer than 63
    characters.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the document and the rule its name breaks, and
    produces no objects. A contract's name follows CTR-001 instead.
  vectors: []

- id: OBJ-002
  layer: language
  level: must
  when: >-
    A document would make an object whose kind and name match an object that already exists,
    whether that object is a template or an instance.
  then: >-
    The document is rejected. A submission only adds objects and never changes one.
  observable: >-
    Resolving returns a diagnostic naming both objects. The existing object, its definition and
    its revision are unchanged. The names of the first-start objects are taken in this way from
    first start. Which reason the registration reports is OBJ-025.
  vectors: []

- id: OBJ-003
  layer: language
  level: must
  when: >-
    An instance is made without a name: its document gives no `metadata.name`, or it is the
    nested instance of a declared Conduit or of a Pool's entry, which has no `metadata`.
  then: >-
    It is named with its template's name, followed by a hyphen and a generated suffix. The
    template's part is shortened where the whole name would otherwise be longer than 63
    characters, and the name is one no existing object of that kind has.
  observable: >-
    The resolved instance has a name of that shape, valid under OBJ-001 and unique under
    OBJ-002. A template's name follows OBJ-001 and so holds no dot, whether or not a package
    exports the template; the dots NAM-004 allows occur only in the names of exports that are
    not templates, such as a contract's. A component Conduit is not named in this way: its name
    is given by CON-003, which shortens the generated part further so that the whole name of the
    component Conduit is no longer than 63 characters. How long the generated suffix is, which
    characters it uses and how far the template's part is shortened are DL15 of the
    implementation-defined list. From outside its Pool, the Resource of an entry is reached by
    the reference to a Pool's entry that POOL-014 gives, whatever name was generated for it.
  vectors: []

- id: OBJ-004
  layer: language
  level: must
  when: >-
    A submitted document carries, as a top-level key, a field the engine owns: `id`, `revision`,
    `status`, or `packages`, the list of packages the engine keeps for a template or an instance
    under NAM-009 and PKG-005.
  then: >-
    The document is rejected, even if the value given is correct.
  observable: >-
    Resolving returns a diagnostic naming the field, and produces no objects. The rule is for
    the top-level keys of a document: inside `config` a key of one of those names is the
    author's, under OBJ-019. What the list `packages` holds is NAM-009.
  vectors: []

- id: OBJ-005
  layer: language
  level: must
  when: >-
    An object is renamed.
  then: >-
    Its ID is unchanged.
  observable: >-
    Inspecting the object before and after the rename returns the same ID.
  vectors: []

- id: OBJ-006
  layer: language
  level: must
  when: >-
    A reference to an object is written.
  then: >-
    It is a map that states the kind and the name, `{kind: <Kind>, name: <name>}`. Where the
    schema of the field fixes the kind, the name alone may be written and means that kind.
  observable: >-
    `{kind: Pool, name: shared}` refers to the Pool `shared`. A reference that gives only a name
    in a field that accepts more than one kind is rejected with a diagnostic naming the field.
    Where a bare name is the argument of an input whose schema fixes the kind, INS-006 says
    what the input's destination receives.
  vectors: []

- id: OBJ-007
  layer: language
  level: must
  when: >-
    A reference resolves to a template where the field expects an instance, or to an instance
    where the field expects a template.
  then: >-
    The document that holds the reference is rejected.
  observable: >-
    Resolving returns a diagnostic naming the field, the object found and which of the two was
    expected.
  vectors: []

- id: OBJ-008
  layer: language
  level: must
  when: >-
    A template is registered and one of its references names an object that does not exist.
  then: >-
    The template is registered, and the unresolved name is reported.
  observable: >-
    The template exists after registration. The result of registration lists the unresolved
    name as a diagnostic that did not prevent it.
  vectors: []

- id: OBJ-009
  layer: language
  level: must
  when: >-
    A template is instantiated.
  then: >-
    Every reference the instance holds, including those that came from its template, is resolved
    at that moment, and the instance stores the resolved form in its place:
    `{kind: <Kind>, id: <ID>}`, the kind and the ID of the object the reference resolved to.
  observable: >-
    The resolved instance holds the resolved form for each reference, however the reference was
    written: as a bare name, with its kind, as a reference to a Pool's entry or as an entry
    reference. If any reference names no existing object, the instance document is rejected and
    the diagnostic names the reference. Only the engine writes the resolved form. Every
    reference schema accepts it, so the stored configuration still satisfies the schema of the
    instance's type, and a submitted document that writes it is rejected with a diagnostic
    naming where it is written. LIF-007 says that a request names an object by a reference and
    never by an ID.
  vectors: []

- id: OBJ-010
  layer: language
  level: must not
  when: >-
    The object an instance's reference resolved to is renamed, or is unregistered and another
    object takes its name.
  then: >-
    The instance's reference comes to point at a different object.
  observable: >-
    After the rename the instance still holds the same resolved form, with the same ID. After
    the other object takes the name the instance still holds that ID, and its reference is not
    redirected to the object now bearing the name.
  vectors: []

- id: OBJ-011
  layer: language
  level: must
  when: >-
    A document is submitted.
  then: >-
    It never renames an instance, and never rewrites the definition of one.
  observable: >-
    A document submitted under the kind and name of an existing instance is rejected under
    OBJ-002, and that instance keeps its name, its ID and its definition. An object is renamed
    only by the operation that OBJ-026 names.
  vectors: []

# --- The shape of a document (plan-audit ruling 28). The JSON Schemas of these shapes are the
# --- Schema contracts under spec/schemas/.

- id: OBJ-012
  layer: language
  level: must
  when: >-
    A template document is read.
  then: >-
    It has `apiVersion`, `kind`, `metadata` and `spec`, and everything the template declares is
    under `spec`.
  observable: >-
    A template document with any other top-level key is rejected with a diagnostic naming the
    key.
  vectors: []

- id: OBJ-013
  layer: language
  level: must
  when: >-
    An instance document is read.
  then: >-
    It has `apiVersion`, `kind` and `from` as top-level keys and, beside them, the standard
    arguments of its family: `owner` for a Resource, `placement` for an Agent and a Resource,
    and `consumer` and `target` for a Conduit. `owner`, `consumer` and `target` are required.
    `placement` may be left out, and PLC-002 to PLC-004 then choose it; a location's document
    leaves it out, under PLC-008. The document may have `metadata` and, under `arguments`, the
    values for its template's inputs. A Conduit's `consumer` is a reference to an instance of
    the kind Interface, Agent or Resource, and its `target` is a reference to an instance of the
    kind Interface, Agent, Resource or Pool.
  observable: >-
    An instance document that leaves out `arguments` supplies no arguments, exactly as one that
    writes an empty map. One that leaves out `metadata` gives no name, and the instance is named
    under OBJ-003. A standard argument is accepted whatever inputs the template declares. An
    `owner`, a `placement`, a `consumer` or a `target` written under `arguments`, a standard
    argument of another family, a value for an input written at the top level, or values written
    under `inputs`, are each rejected with a diagnostic naming the key. `consumer` and `target`
    each accept more than one kind, so each is written with its kind, as OBJ-006 requires. What
    `from` may be is INS-025.
  vectors: []

- id: OBJ-014
  layer: language
  level: must
  when: >-
    A document holds a nested instantiation: a declared Conduit, a Pool's entry or a component
    of a composite Conduit.
  then: >-
    It has no `kind`, no `metadata` and no `spec`. A declared Conduit holds `from`, and may hold
    `arguments`, `target` and `optional: true`. A Pool's entry holds `from`, and may hold
    `arguments` and `optional: true`. A component holds `from`, and may hold `arguments`.
  observable: >-
    A nested instantiation that carries `kind`, `metadata` or `spec` is rejected with a
    diagnostic naming it, and so is one with no `from`. What `from` may be is INS-025. One that
    leaves out `arguments` supplies no arguments, exactly as one that writes an empty map: the
    map is present and empty, so an input may have a destination inside it under INS-011. A
    declared Conduit or a component that carries `consumer`, a component that carries `target`,
    and an entry that carries `owner` or `placement`, are each rejected. How an entry is placed
    is POOL-009 and POOL-016.
  vectors: []

- id: OBJ-015
  layer: language
  level: must
  when: >-
    An input, a step, a declared Conduit, a Pool's entry, a runtime or an output is to be
    optional.
  then: >-
    It is marked `optional: true`. Without that mark it is required, except that an input that
    states a `default` may be left out whether or not it is marked. That holds for an input of a
    template, of an Operation contract and of a Requirement contract alike.
  observable: >-
    A `required` key on any of them is rejected with a diagnostic naming it. `required` keeps
    its meaning inside a schema. An input that states `default: []` and no mark may be left out,
    and the default is then used: INS-007 says so for a template's input, OPS-026 for an
    Operation's and NAM-019 for a Requirement's.
  vectors: []

- id: OBJ-016
  layer: language
  level: must
  when: >-
    A document points at a place inside a value: an input's destination, the `pointer` of a
    value reference, or a value of a control's `changes`.
  then: >-
    The pointer is a JSON Pointer in its string form, with a fixed root. The root is the
    template's `spec` for a destination, the value its source names for a value reference, and
    the instance's configuration for a control.
  observable: >-
    A pointer in any other notation, such as a dotted path or the URI fragment form, is rejected
    with a diagnostic naming it, and so is a destination that uses the `-` token.
    `/config/model` as a destination means the `model` member of `config` in `spec`.
  vectors: []

# --- Spelling and the envelope (plan-audit ruling 31), following Kubernetes.

- id: OBJ-017
  layer: language
  level: must
  when: >-
    A document is read.
  then: >-
    It carries `apiVersion`, whose value names the version of this specification it is written
    for.
  observable: >-
    A document with no `apiVersion`, or with one the engine does not know, is rejected with a
    diagnostic naming it. For this version the value is `github.com/shrav-k/conduit/v0`.
  vectors: []

- id: OBJ-018
  layer: language
  level: must
  when: >-
    A document's `metadata` is read.
  then: >-
    It may hold `name`, `description`, a string, and `annotations`, a map of strings. `name` is
    required in a template and in a contract, and may be left out of an instance, which is then
    named under OBJ-003. Neither `description` nor `annotations` has any meaning to the
    language.
  observable: >-
    A template or a contract with no `name` is rejected. Two documents that differ only in
    `description` or `annotations` resolve to the same object. Any other key in `metadata` is
    rejected. An instance document may leave out `metadata` altogether, as OBJ-013 states.
  vectors: []

- id: OBJ-019
  layer: language
  level: must
  when: >-
    A document contains a key that this specification does not define, other than: a key inside
    `config`, `annotations` or a literal value, which is the value of `literal` in a value
    binding or the value of an input's `default`; inside a schema, a name the author gives a
    member of `properties` or of `$defs`, and a key inside a value the schema states under
    `const`, `enum`, `default` or `examples`; a key inside the `arguments` of an instance, a
    nested instantiation or an applied requirement; a name that keys a member of a map this
    specification says is keyed by name, such as `inputs`, `steps` or `outputs`, or a member of
    an `object` value binding; and a selection, which is a qualified reference or `#name` under
    NAM-018, that keys an `implementation`, `controls` or `tools` map.
  then: >-
    The document is rejected. Every key this specification defines is written in camelCase.
  observable: >-
    Resolving returns a diagnostic naming the key. `depends_on`, a policy written in a template,
    and a family-specific key on an Interface or an Agent are each rejected in this way. A
    step's `arguments`, and those of a constituent of a composed requirement under CTR-010, hold
    value bindings, and an undefined key in one of those is rejected. An input's `default` is a
    literal value whether a template, an Operation contract or a Requirement contract declares
    the input, so a key inside a `default` that is a map is the author's.
    Inside a schema only the names are the author's: its keywords are closed by the profile, and
    one outside it is rejected under SCH-002.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32).

- id: OBJ-020
  layer: language
  level: must
  when: >-
    A template, an instance or a contract document is read.
  then: >-
    It carries `kind`, which is one of ten: the five families `Interface`, `Agent`,
    `Resource`, `Pool` and `Conduit`, and the five kinds of contract `Type`, `Capability`,
    `Operation`, `Requirement` and `Schema`.
  observable: >-
    A document with no `kind`, or with one outside the ten, is rejected with a diagnostic
    naming it.
  vectors: []

- id: OBJ-021
  layer: language
  level: must
  when: >-
    A value is written inside `config` or `arguments`.
  then: >-
    It is a reference only where the schema that governs that place is one of the core package's
    reference schemas, which are Schema contracts that package exports. A reference schema
    governs a place where it is the schema of that place directly, where it is the `items` of a
    list that holds the value, or where it is a branch of `anyOf` or `oneOf` that the value
    satisfies. Any other value is data.
  observable: >-
    A value governed by a reference schema is resolved under OBJ-009, and the instance stores
    the resolved form, `{kind: <Kind>, id: <ID>}`, in its place. That stored form is the one an
    implementation receives, as in the `arguments` of a restriction under IFC-018, the one a
    value reference with the source `config` yields, the one a control returns in `settings`,
    and the one inspecting shows. Each item of a list whose `items` is
    `github.com/shrav-k/conduit/core#pool-reference.v1` is a reference, and under `anyOf` with a
    reference schema and the type null, a name is a reference and null is not. A map with the
    keys `kind` and `name` in a place governed by any other schema is kept exactly as written,
    and is never rewritten.
  vectors: []

- id: OBJ-022
  layer: language
  level: must
  when: >-
    A document declares named members: the `inputs`, `conduits`, `entries`, `runtimes`,
    `requirements` or `components` of a template, the `runtimes` or `placement` of a Type
    contract, the `inputs` or `constituents` of a Requirement contract, or the `steps` of a
    graph.
  then: >-
    Each is a map keyed by a name the document chooses. Such a name is made only of lowercase
    letters, digits and hyphens, starts with a letter and is no longer than 63 characters, the
    rule OBJ-001 gives for an object's name.
  observable: >-
    Any of them written as a list, and a member whose name breaks the rule, is rejected with a
    diagnostic naming it. The names of an Operation contract's inputs and outputs are outside
    this rule: CTR-002 lets each be any non-empty string, and the keys of a step's `arguments`,
    of a graph's `outputs`, of a control's `changes` and of the `inputs` a template gives a
    control are those names.
  vectors: []

# --- Added by the follow-up decisions (plan-audit ruling 33; decision W4 of the re-audit).

- id: OBJ-023
  layer: convention
  level: must
  when: >-
    A document submitted for registration is rejected, for any cause other than the clash with
    an existing name that OBJ-002 states.
  then: >-
    The registration is not dispatched, and reports invalid.
  observable: >-
    The result carries the diagnostics that resolving returned, in the `diagnostics` of its
    `structuredContent` as IFC-025 states, and nothing is registered, as SUB-003 states. A clash
    with an existing name reports conflict under OBJ-025. Where both causes are present, or the
    actor is not permitted, OPS-023 says which reason is reported.
  vectors: []

# --- The names a version assigns (plan-audit rulings 33 to 35). They are defined once, in
# --- spec/names.yaml.

- id: OBJ-024
  layer: language
  level: must
  when: >-
    A version of this specification is published.
  then: >-
    It states its names in `names.yaml`: the address of the core package, the value of
    `apiVersion`, and the prefix of the keys Conduit adds to `_meta`. Only a new version may
    change them, and a document's `apiVersion` says which version's names apply to it.
  observable: >-
    An engine that supports two versions loads a document written for either, and resolves the
    core package at the address the document's own version states. A document that uses one
    version's `apiVersion` with another version's core address is rejected.
  vectors: []

# --- Added by the second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md;
# --- findings R1-5.2, R1-5.1 and R1-1.2). These two are of the layer `convention`.

- id: OBJ-025
  layer: convention
  level: must
  when: >-
    A document submitted for registration is rejected under OBJ-002, because it would make an
    object whose kind and name an existing object has.
  then: >-
    The registration is not dispatched, and reports conflict.
  observable: >-
    The result carries the diagnostic that names both objects, in the `diagnostics` of its
    `structuredContent` as IFC-025 states, and nothing is registered, as SUB-003 states. Every
    other cause of rejection reports invalid under OBJ-023. Where both causes are present, or
    the actor is not permitted, OPS-023 says which reason is reported.
  vectors: []

- id: OBJ-026
  layer: convention
  level: must
  when: >-
    A template or an instance is renamed.
  then: >-
    It is done by the operation `rename.v1`, which names the object's current revision and
    changes only its name. The revision advances, as it does for any stored change.
  observable: >-
    After the rename the object has the new name, the ID, the definition and the configuration
    it had, and a later revision, under REV-003. A request that names a revision that is not
    current reports conflict under REV-002, and one that names none reports invalid under
    REV-011. The request is authorized against `management`, under ACC-033. What the rename of a
    Conduit must also satisfy is CON-026, and LIF-022 refuses the rename of a first-start
    object.
  vectors: []
