- id: OBJ-001
  layer: language
  level: must
  when: >-
    A template or an instance of one of the five families gives a name that is not made only of
    lowercase letters, digits and hyphens, or does not start with a letter, or is longer than 63
    characters.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the document and the rule its name breaks, and
    produces no objects. A contract's name follows CTR-001 instead.
  vectors: []

- id: OBJ-002
  layer: language
  level: must
  when: >-
    A document would make an object whose kind and name match an object that already exists,
    whether that object is a template or an instance.
  then: >-
    The document is rejected. A submission only adds objects and never changes one.
  observable: >-
    Resolving returns a diagnostic naming both objects. The existing object, its definition and
    its revision are unchanged. The names of the first-start objects are taken in this way from
    first start. Which reason the registration reports is OBJ-025.
  vectors: []

- id: OBJ-003
  layer: language
  level: must
  when: >-
    An instance is made without a name: its document gives no `metadata.name`, or it is the
    nested instance of a declared Conduit or of a Pool's entry, which has no `metadata`.
  then: >-
    It is named with its template's name, followed by a hyphen and a generated suffix. The
    template's part is shortened where the whole name would otherwise be longer than 63
    characters, and the name is one no existing object of that kind has.
  observable: >-
    The resolved instance has a name of that shape, valid under OBJ-001 and unique under
    OBJ-002. A template's name follows OBJ-001 and so holds no dot, whether or not a package
    exports the template; the dots NAM-004 allows occur only in the names of exports that are
    not templates, such as a contract's. How long the generated suffix is, which characters it
    uses and how far the template's part is shortened are DL15 of the implementation-defined
    list. From outside its Pool, the Resource of an entry is reached by the reference to a
    Pool's entry that POOL-014 gives, whatever name was generated for it. The result of
    `register.v1` lists each instance the request made, with its name and its ID, and says of a
    nested instance which nested instantiation made it, so a generated name is learned there.
  vectors: []

- id: OBJ-004
  layer: language
  level: must
  when: >-
    A submitted document carries, as a top-level key, a field the engine owns: `id`, `revision`,
    `status`, or `packages`, the list of packages the engine keeps for a template or an instance
    under NAM-009 and PKG-005.
  then: >-
    The document is rejected, even if the value given is correct.
  observable: >-
    Resolving returns a diagnostic naming the field, and produces no objects. The rule is for
    the top-level keys of a document: inside `config` a key of one of those names is the
    author's, under OBJ-019. What the list `packages` holds is NAM-009.
  vectors: []

- id: OBJ-006
  layer: language
  level: must
  when: >-
    A reference to an object is written.
  then: >-
    It is a map that states the kind and the name, `{kind: <Kind>, name: <name>}`. Where the
    schema of the field fixes the kind, the name alone may be written and means that kind.
  observable: >-
    `{kind: Pool, name: shared}` refers to the Pool `shared`. A reference that gives only a name
    in a field that accepts more than one kind is rejected with a diagnostic naming the field.
    Where a bare name is the argument of an input whose schema fixes the kind, INS-006 says
    what the input's destination receives.
  vectors: []

- id: OBJ-007
  layer: language
  level: must
  when: >-
    A reference resolves to a template where the field expects an instance, or to an instance
    where the field expects a template.
  then: >-
    The document that holds the reference is rejected.
  observable: >-
    Resolving returns a diagnostic naming the field, the object found and which of the two was
    expected.
  vectors: []

- id: OBJ-008
  layer: language
  level: must
  when: >-
    A template is registered and one of its references names an object that does not exist.
  then: >-
    The template is registered, and the unresolved name is reported.
  observable: >-
    The template exists after registration. The result of registration lists the unresolved
    name as a diagnostic that did not prevent it.
  vectors: []

- id: OBJ-009
  layer: language
  level: must
  when: >-
    A template is instantiated.
  then: >-
    Every reference the instance holds, including those that came from its template, is resolved
    at that moment, and the instance stores the resolved form in its place:
    `{kind: <Kind>, id: <ID>}`, the kind and the ID of the object the reference resolved to.
  observable: >-
    The resolved instance holds the resolved form for each reference, however the reference was
    written: as a bare name, with its kind, as a reference to a Pool's entry or as an entry
    reference. If any reference names no existing object, the instance document is rejected and
    the diagnostic names the reference. Only the engine writes the resolved form. Every
    reference schema accepts it, so the stored configuration still satisfies the schema of the
    instance's type, and a submitted document that writes it is rejected with a diagnostic
    naming where it is written. What a request that writes it reports is LIF-031.
  vectors: []

- id: OBJ-010
  layer: language
  level: must not
  when: >-
    An instance exists that holds the resolved form of a reference, and the name by which that
    reference was written now belongs to another object, or to none, because the object it
    resolved to no longer exists.
  then: >-
    The instance's reference comes to point at a different object.
  observable: >-
    A stored resolved form is not resolved again. Resolving a later document against the objects
    that exist reads the instance with the same resolved form, and the same ID, that it held
    when it was made: where another object has taken the name, a reference in the later document
    to the name resolves to that object, and the instance's own reference is not redirected to
    it. A nested instantiation that the instance holds, and from which a replacement is made
    under LIF-009, holds its references in the resolved form in the same way.
  vectors: []

- id: OBJ-011
  layer: language
  level: must
  when: >-
    An object exists.
  then: >-
    No document and no operation changes its name, which is fixed once the object is made, and
    no document rewrites the definition of an instance.
  observable: >-
    A document submitted under the kind and name of an existing instance is rejected under
    OBJ-002, and that instance keeps its name, its ID and its definition. No operation of the
    core package gives an object another name, as the Kubernetes API never updates
    `metadata.name`: an object is known by another name only where another object is made under
    it. A name becomes free once its object no longer exists, which is why an instance holds the
    resolved form of each reference, under OBJ-009 and OBJ-010.
  vectors: []

# --- The shape of a document (plan-audit ruling 28). The JSON Schemas of these shapes are the
# --- Schema contracts under spec/schemas/.

- id: OBJ-012
  layer: language
  level: must
  when: >-
    A template document is read.
  then: >-
    It has `apiVersion`, `kind`, `metadata` and `spec`, and everything the template declares is
    under `spec`.
  observable: >-
    A template document with any other top-level key is rejected with a diagnostic naming the
    key.
  vectors: []

- id: OBJ-013
  layer: language
  level: must
  when: >-
    An instance document is read.
  then: >-
    It has `apiVersion`, `kind` and `from` as top-level keys and, beside them, the standard
    arguments of its family: `owner` for a Resource, `placement` and `runtime` for an Agent and
    a Resource, and `consumer` and `target` for a Conduit. `owner`, `consumer` and `target` are
    required. `placement` may be left out, and PLC-002 then chooses it. `runtime` may be left
    out, and PRV-006 says what it names and what runs an instance that gives none. The document
    may have `metadata` and, under `arguments`, the values for its template's inputs. A
    Conduit's `consumer` is a reference to an instance of the kind Interface, Agent or Resource,
    and its `target` is a reference to an instance of the kind Interface, Agent, Resource or
    Pool.
  observable: >-
    An instance document that leaves out `arguments` supplies no arguments, exactly as one that
    writes an empty map. One that leaves out `metadata` gives no name, and the instance is named
    under OBJ-003. A standard argument is accepted whatever inputs the template declares. An
    `owner`, a `placement`, a `runtime`, a `consumer` or a `target` written under `arguments`, a
    standard argument of another family, such as `runtime` on a Pool, a value for an input
    written at the top level, or values written under `inputs`, are each rejected with a
    diagnostic naming the key. `consumer` and `target` each accept more than one kind, so each
    is written with its kind, as OBJ-006 requires. What `from` may be is INS-025.
  vectors: []

- id: OBJ-014
  layer: language
  level: must
  when: >-
    A document holds a nested instantiation: a declared Conduit or a Pool's entry.
  then: >-
    It has no `kind`, no `metadata` and no `spec`. A declared Conduit holds `from`, and may hold
    `arguments`, `target` and `optional: true`. A Pool's entry holds `from`, and may hold
    `arguments` and `optional: true`.
  observable: >-
    A nested instantiation that carries `kind`, `metadata` or `spec` is rejected with a
    diagnostic naming it, and so is one with no `from`. What `from` may be is INS-025. One that
    leaves out `arguments` supplies no arguments, exactly as one that writes an empty map: the
    map is present and empty, so an input may have a destination inside it under INS-011. A
    declared Conduit that carries `consumer`, and an entry that carries `owner`, `placement` or
    `runtime`, are each rejected. How an entry is placed, and what runs its Resource, is
    POOL-009 and POOL-016.
  vectors: []

- id: OBJ-015
  layer: language
  level: must
  when: >-
    A template's input, a Requirement contract's input, a declared Conduit or a Pool's entry is
    to be optional.
  then: >-
    It is marked `optional: true`. Without that mark it is required, except that an input that
    states a `default` may be left out whether or not it is marked. That holds for an input of a
    template and of a Requirement contract alike. An Operation contract's input or output is not
    marked: it is optional where the contract's `inputSchema` or `outputSchema` does not list it
    under `required`. An input of a control other than `revision` may also be left out, under
    REV-006.
  observable: >-
    A `required` key on any of the four is rejected with a diagnostic naming it. `required`
    keeps its meaning inside a schema, and an Operation contract's `inputSchema` and
    `outputSchema` are schemas: `optional: true` written as a keyword inside them is outside the
    profile, and rejected under SCH-002. An input that states `default: []` and no mark may be
    left out, and the default is then used: INS-007 says so for a template's input and NAM-019
    for a Requirement's. A property of an Operation contract's `inputSchema` that states a
    `default` takes it under OPS-026 when a request leaves it out, before the request is checked
    against `inputSchema`, so it may be left out even where `required` lists it. An output that
    `outputSchema` does not list under `required` is one that a result may leave out.
  vectors: []

- id: OBJ-016
  layer: language
  level: must
  when: >-
    A document points at a place inside a value: an input's destination, a value of a control's
    `changes`, or a value of an implementation item's `environment`, `packageArguments` or
    `headers`.
  then: >-
    The pointer is a JSON Pointer in its string form, with a fixed root. The root is the
    template's `spec` for a destination, and the instance's configuration for a control and for
    an implementation item.
  observable: >-
    A pointer in any other notation, such as a dotted path or the URI fragment form, is rejected
    with a diagnostic naming it, and so is a destination that uses the `-` token.
    `/config/model` as a destination means the `model` member of `config` in `spec`, and `/root`
    in an item's `environment` means the member `root` of the configuration. Which places an
    item's pointer may name is MAN-017.
  vectors: []

# --- Spelling and the envelope (plan-audit ruling 31), following Kubernetes.

- id: OBJ-017
  layer: language
  level: must
  when: >-
    A document is read.
  then: >-
    It carries `apiVersion`, whose value names the version of this specification it is written
    for.
  observable: >-
    A document with no `apiVersion`, or with one the engine does not know, is rejected with a
    diagnostic naming it. For this version the value is `github.com/shrav-k/conduit/v0`.
  vectors: []

- id: OBJ-018
  layer: language
  level: must
  when: >-
    A document's `metadata` is read.
  then: >-
    It may hold `name`, `description`, a string, and `annotations`, a map of strings. `name` is
    required in a template and in a contract, and may be left out of an instance, which is then
    named under OBJ-003. Neither `description` nor `annotations` has any meaning to the
    language.
  observable: >-
    A template or a contract with no `name` is rejected. Two documents that differ only in
    `description` or `annotations` resolve to the same object. Any other key in `metadata` is
    rejected. An instance document may leave out `metadata` altogether, as OBJ-013 states.
  vectors: []

- id: OBJ-019
  layer: language
  level: must
  when: >-
    A document contains a key that this specification does not define, other than: a key inside
    `config`, `annotations` or the value of an input's `default`; inside a schema, a name the
    author gives a member of `properties`, `dependentRequired`, `dependentSchemas` or `$defs`, a
    pattern that keys a member of `patternProperties`, and a key inside a value the schema
    states under `const`, `enum`, `default` or `examples`; a key inside the `arguments` of an
    instance, a nested instantiation or an applied requirement; a name that keys a member of a
    map this specification says is keyed by name, such as `inputs` or `conduits`; a label that
    keys a member of a label selector under `nodeSelector`; a selection, which is a qualified
    reference or `#name` under NAM-018, that keys an `implementation`, `controls` or `tools`
    map; a key inside an implementation item's `package` or `remote`, which the schema of
    server.json governs under MAN-010; and a key of an item's `environment`, `packageArguments`
    or `headers`.
  then: >-
    The document is rejected. Every key this specification defines is written in camelCase.
  observable: >-
    Resolving returns a diagnostic naming the key. `depends_on`, `runtimes`, `setup` or `retire`
    written in a template, and a family-specific key on an Interface or an Agent are each
    rejected in this way. An input's `default` is a literal value whether a template or a
    Requirement contract declares the input, and an Operation contract's input states its
    `default` inside its `inputSchema`, so a key inside a `default` that is a map is the
    author's. Inside a schema only the names and the patterns are the author's: its keywords are
    closed by the profile, and one outside it is rejected under SCH-002.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32).

- id: OBJ-020
  layer: language
  level: must
  when: >-
    A template, an instance or a contract document is read.
  then: >-
    It carries `kind`, which is one of ten: the five families `Interface`, `Agent`,
    `Resource`, `Pool` and `Conduit`, and the five kinds of contract `Type`, `Capability`,
    `Operation`, `Requirement` and `Schema`.
  observable: >-
    A document with no `kind`, or with one outside the ten, is rejected with a diagnostic
    naming it.
  vectors: []

- id: OBJ-021
  layer: language
  level: must
  when: >-
    A value is written inside `config` or `arguments`.
  then: >-
    It is a reference only where the schema that governs that place is one of the core package's
    reference schemas, which are Schema contracts that package exports. A reference schema
    governs a place where it is the schema of that place directly, where it is the `items` of a
    list that holds the value, or where it is a branch of `anyOf` or `oneOf` that the value
    satisfies, a `$ref` in each of these standing for the schema it leads to, through any number
    of `$ref`s. Any other value is data.
  observable: >-
    A value governed by a reference schema is resolved under OBJ-009, and the instance stores
    the resolved form, `{kind: <Kind>, id: <ID>}`, in its place. That stored form is the one an
    implementation receives, as in the `arguments` of a filter under IFC-018 and in the
    `config` of Conduit's keys under IFC-006, and the one inspecting shows. Each item of a list
    whose `items` is `github.com/shrav-k/conduit/core#pool-reference.v1` is a reference, and
    under `anyOf` with a reference schema and the type null, a name is a reference and null is
    not. Where a project's Schema contract `token.v1` has the `spec` `{$ref:
    github.com/shrav-k/conduit/core#secret-reference.v1}`, a place whose schema is `{$ref:
    '#token.v1'}` is governed by `secret-reference.v1`, as `$ref` means under SCH-001, and so is
    one whose schema is a `$ref` to a member of `$defs` that holds that `$ref`. A map with the
    keys `kind` and `name` in a place governed by any other schema is kept
    exactly as written, and is never rewritten. The core schema `secret-reference.v1` is a
    reference schema too, and a place it governs is under the narrower rule of SEC-001: it holds
    only a reference, never the secret itself.
  vectors: []

- id: OBJ-022
  layer: language
  level: must
  when: >-
    A document declares named members: the `inputs`, `conduits`, `entries` or `requirements` of
    a template, or the `inputs` of a Requirement contract.
  then: >-
    Each is a map keyed by a name the document chooses. Such a name is made only of lowercase
    letters, digits and hyphens, starts with a letter and is no longer than 63 characters, the
    rule OBJ-001 gives for an object's name.
  observable: >-
    Any of them written as a list, and a member whose name breaks the rule, is rejected with a
    diagnostic naming it. The schemas of documents state the rule with `propertyNames`. The
    names of an Operation contract's inputs and outputs, the properties of its `inputSchema` and
    `outputSchema`, are outside this rule: CTR-002 lets each be any non-empty string, and the
    keys of a control's `changes` and of the `inputs` a template gives a control are those
    names. The keys of a label selector under PLC-007 are labels and not names, and the schema
    `labels.v1` gives their form.
  vectors: []

# --- Added by the follow-up decisions (plan-audit ruling 33; decision W4 of the re-audit).

- id: OBJ-023
  layer: convention
  level: must
  when: >-
    A document, the manifest or the submission that is handed over for registration is rejected,
    for any cause other than the clash with an existing name that OBJ-002 states.
  then: >-
    The registration is not dispatched, and reports invalid.
  observable: >-
    The result carries the diagnostics that resolving returned, in the `diagnostics` of its
    `structuredContent` as IFC-025 states, and nothing is registered, as SUB-003 states. A clash
    with an existing name reports conflict under OBJ-025. Where both causes are present, or the
    actor is not permitted, OPS-023 says which reason is reported.
  vectors: []

# --- The names a version assigns (plan-audit rulings 33 to 35). They are defined once, in
# --- spec/names.yaml.

- id: OBJ-024
  layer: language
  level: must
  when: >-
    A version of this specification is published.
  then: >-
    It states its names in `names.yaml`: the address of the core package, the value of
    `apiVersion`, the prefix of the keys Conduit adds to `_meta`, and the names of what
    `identity` carries, under PRV-022. Only a new version may change them, and a document's
    `apiVersion` says which version's names apply to it.
  observable: >-
    An engine that supports two versions loads a document written for either, and resolves the
    core package at the address the document's own version states. A document that uses one
    version's `apiVersion` with another version's core address is rejected.
  vectors: []

# --- Added by the second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md;
# --- findings R1-5.2, R1-5.1 and R1-1.2). OBJ-025 is of the layer `convention`; OBJ-026,
# --- added with it, was removed by ruling 41.

- id: OBJ-025
  layer: convention
  level: must
  when: >-
    A document submitted for registration is rejected under OBJ-002, because it would make an
    object whose kind and name an existing object has.
  then: >-
    The registration is not dispatched, and reports conflict.
  observable: >-
    The result carries the diagnostic that names both objects, in the `diagnostics` of its
    `structuredContent` as IFC-025 states, and nothing is registered, as SUB-003 states. Every
    other cause of rejection reports invalid under OBJ-023. Where both causes are present, or
    the actor is not permitted, OPS-023 says which reason is reported.
  vectors: []
