# Packages: versions, digests and the selection of implementations.
# Each rule follows an existing practice: Semantic Versioning for versions, one exact version for
# each package a manifest lists, a digest of the distributed archive as OCI, npm and Cargo use,
# and a gzip-compressed tar file as the archive, as npm and Cargo distribute. How a package and
# its exports are named is in naming.yaml.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# Removed IDs (not reused):
# Removed: PKG-002 → NAM-006 (ruling 32).
# Removed: PKG-008 → NAM-011 (ruling 32).
# Removed: PKG-009 → TPL-004 (ruling 32).
# Removed: PKG-010 → TPL-003 (ruling 32).
# Removed: PKG-011 → TPL-004 and CTR-004 (ruling 32).
# PKG-013: nothing replaces it (ruling 41).
# PKG-014: nothing replaces it (ruling 41).
# Removed: PKG-015 → PLC-007 (ruling 32).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

- id: PKG-001
  layer: language
  level: must
  when: >-
    A package is installed whose version is not a valid Semantic Versioning 2.0.0 version.
  then: >-
    The package is rejected.
  observable: >-
    Installation returns a diagnostic naming the version, and the package is not available.
  vectors: []

- id: PKG-003
  layer: language
  level: must
  when: >-
    An item of a manifest's `packages` names a version of a package, and the installed package
    at that address has a different version.
  then: >-
    That package does not satisfy the item, however close the versions are. Two versions are
    the same when neither precedes the other under Semantic Versioning 2.0.0, which sets build
    metadata aside.
  observable: >-
    With only version 1.4.1 installed, an item that names 1.4.0 is unresolved. No newer or
    compatible version is substituted. `1.4.0+a` and `1.4.0` are the same version, and the
    digest decides whether they are the same package, under PKG-021.
  vectors: []

- id: PKG-004
  layer: language
  level: must
  when: >-
    A published package's digest is computed or written.
  then: >-
    It is the SHA-256 of the package's archive file exactly as distributed, written as `sha256:`
    followed by the hash in lowercase hexadecimal.
  observable: >-
    Hashing the archive with any SHA-256 tool gives the digest the package reports. A digest
    written in any other way, such as in uppercase or without `sha256:`, is rejected with a
    diagnostic naming it.
  vectors: []

- id: PKG-005
  layer: language
  level: must
  when: >-
    A template is instantiated.
  then: >-
    The instance holds, for each package its template uses, the version and digest that the
    template holds under NAM-009.
  observable: >-
    Inspecting the instance lists those packages under `packages`, in the form NAM-009 gives,
    with the versions and digests that inspecting its template listed when the instance was
    made. The submitted project whose contracts the template holds under NAM-009 is listed by
    its address, its version where its manifest states one, and the digest of SUB-008, and the
    core package by its address and version alone, since it has no digest.
  vectors: []

- id: PKG-006
  layer: language
  level: must
  when: >-
    A registration's manifest, or the manifest that a request to replace a template hands over
    under SUB-009, lists a package that is not installed at the version and digest that the
    manifest gives.
  then: >-
    The registration, or the replacement, is rejected, with a diagnostic naming each such
    package.
  observable: >-
    Nothing is registered or replaced, and the request is not dispatched and reports invalid
    under OBJ-023 or SUB-009. A registration fetches no package and installs none, whatever its
    manifest lists: a package is installed only by a request for `install.v1`, and `fetch` in an
    item of `packages` is the place such an installation fetches from, under NAM-012. Every
    package that a manifest lists is installed first, as Terraform's `init` and Helm's build of
    a chart's dependencies come first; the reference engine's command line may offer one command
    that installs them, which is no promise. So every check that needs a package is made when
    the document is resolved, and none is deferred to instantiation. An installed package can
    still be removed later, and an instance document whose template uses one that is not
    installed is then rejected under PKG-007.
  vectors: []

- id: PKG-007
  layer: language
  level: must
  when: >-
    An instance document's template uses a package that is not installed.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the package and the version required.
  vectors: []

- id: PKG-012
  layer: language
  level: must
  when: >-
    A package exports two things under one name.
  then: >-
    The package is rejected when it is installed.
  observable: >-
    Installation returns a diagnostic naming the repeated export name. An implementation is an
    export under PKG-019. One that has the name of a document of its package is rejected under
    NAM-027, whether or not the package exports that document.
  vectors: []

- id: PKG-016
  layer: interface
  level: must not
  when: >-
    An implementation that is not marked `plain` serves an instance.
  then: >-
    Its behavior for that instance depends on its having served another instance.
  observable: >-
    The results such an implementation returns for one instance are the same whether or not it
    has also served others, in one process or several.
  vectors: []

# --- The manifest of a package. Go's `module` line states a module's own
# --- address in the same way.

- id: PKG-017
  layer: language
  level: must
  when: >-
    A package's manifest is read.
  then: >-
    It states the package's own `address` and `version`, beside the `packages` it uses.
  observable: >-
    A package whose manifest states an address or a version other than the one it was listed,
    asked for or fetched under is rejected when it is installed. A submitted project needs
    `address` only where MAN-015 requires it, and MAN-004 says what the two keys mean in a
    manifest that is handed over for registration.
  vectors: []

- id: PKG-018
  layer: language
  level: must
  when: >-
    A package's manifest lists its `exports`.
  then: >-
    They are the names of the documents in the package that others may refer to. A document the
    package does not export can be referred to only from inside the package, in the form
    NAM-022 gives.
  observable: >-
    A qualified reference from outside to a document that exists in the package but is not
    exported is unresolved, with a diagnostic naming it, and the document that holds the
    reference is rejected under NAM-028. How the list is written is MAN-007. An exported
    template may be made by a sectioned document under SCT-005; the translated template is the
    export, in the same canonical form.
  vectors: []

- id: PKG-019
  layer: language
  level: must
  when: >-
    A package's manifest lists its `implementations`.
  then: >-
    Each has a name, which is an export, and states `implements`, the operations it implements,
    and how it is reached, which is exactly one of `command`, `package` and `remote`. It may
    state `nodeSelector`, a label selector, and `supports`, the requirements it can apply as
    filters. A `package` item's Package is pinned to one artifact, under MAN-010. A `command` or
    `package` item may state `environment`, a `package` item `packageArguments`, and a `remote`
    item `headers`, each giving the places in the instance's configuration that supply values.
    An item that leaves out `supports` supports no requirement, and one that leaves out
    `nodeSelector` puts no rule on where its instances are placed.
  observable: >-
    Whether an implementation implements an operation, supports a filter or can run on a node is
    answered from the manifest, without starting it: the last by matching its `nodeSelector`,
    with its type's, against the labels of the node, under PLC-007. The keys of an item and
    their values are MAN-009 and MAN-010, and which places a pointer may name is MAN-017. Which
    kinds of `package` a runtime provider can run is part of its contract, under PRV-012. The
    one implementation that is reached by none of the three is the engine itself, in the core
    package's own manifest, under MAN-012.
  vectors: []

- id: PKG-020
  layer: language
  level: must
  when: >-
    An implementation is an existing server that was not written for this specification.
  then: >-
    Its implementation item in the manifest is marked `plain: true` and gives `tools`, a map
    from the selection of each operation it implements to the name of the tool that serves it.
    It states no `supports`. A plain implementation is reached by `command`, `package` or
    `remote`, and implements no operation of `runtime-provider.v1`, `machine-provider.v1` or
    `package-source.v1`.
  observable: >-
    An operation in `implements` that is not a key of `tools`, a plain implementation that
    states `supports` or implements an operation of one of those three capabilities, and an item
    that is not marked `plain` and states `tools`, are each rejected when the package is
    installed or the project is submitted. The operations of those capabilities are reached only
    by provider calls, which carry Conduit's keys and declare Conduit's extension, under PRV-005
    and IFC-037, as a container runtime implements the CRI for the kubelet. A plain
    implementation of `get-secret.v1` is allowed, under SEC-006: a read is a request, and not
    a provider call. A plain implementation supports no requirement, and
    never counts as deduplicating under OPS-012, whatever the contracts of its operations
    declare. The `tools` map gives each tool's name and nothing else: the arguments of a call
    are the operation's inputs under their own names, as IFC-001 states. A plain server reads
    none of Conduit's keys, so it learns its instance's configuration only through the values
    that its item's `environment`, `packageArguments` or `headers` take from it, under MAN-010.
    For the same reason a plain server reached by `remote` stands behind no gate and is reached
    as before, under PRV-025, and a `remote` server that cannot check an enforcement point's
    proof is used as plain, under IFC-041.
  vectors: []



- id: PKG-021
  layer: language
  level: must
  when: >-
    An item of a manifest's `packages` gives a digest for a package, and the archive of the
    installed package at that address and version has a different digest.
  then: >-
    That package does not satisfy the item.
  observable: >-
    The item is unresolved, exactly as under PKG-003. The archive is not used, and its digest
    is not put in place of the one the manifest gives.
  vectors: []



- id: PKG-022
  layer: language
  level: must
  when: >-
    A package is installed whose archive is not a gzip-compressed tar file.
  then: >-
    The package is rejected.
  observable: >-
    Installation returns a diagnostic naming the archive. The digest of PKG-004 is taken over
    the gzip-compressed file exactly as distributed, not over the tar file inside it or over the
    files that tar file holds. What the archive holds, and where, is MAN-013 and MAN-014. Which
    of the tar formats and extensions an engine reads is DL7 of the implementation-defined list.
  vectors: []



- id: PKG-023
  layer: convention
  level: must
  when: >-
    An actor asks to install a package, and the package is rejected; or the request gives a
    `fetch` that is a relative reference or that holds user information; or it gives no `fetch`
    for a package that is not installed at that address and version; or its `fetch` has a scheme
    that neither the engine nor a package-source provider accepts.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    The result carries the diagnostics, and the package is not available. A package one of whose
    documents is rejected when the package is installed is itself rejected, and so is one whose
    manifest is. This holds for every cause for which a promise says that a package is rejected
    when it is installed, such as PKG-001, PKG-012, PKG-017, PKG-022, PKG-026, PKG-028, NAM-004,
    MAN-011 and MAN-014, and for a request to install a package at the core package's address,
    under NAM-021. An archive that cannot be fetched now is PKG-024, a package already installed
    with another digest is PKG-025, and one already installed with the same digest is PKG-027;
    nothing is fetched for those two, so a request for one needs no `fetch`. A request has no
    directory to resolve a relative `fetch` against, as MAN-006 states, and one that gives a
    relative `fetch`, or one with user information, reports invalid whether or not the package
    is already installed. Every engine accepts `https` and `file`, and other schemes are those
    that a package-source provider claims, under NAM-012 and PRV-017. Where the actor is not
    permitted, or another reason also applies, OPS-023 says which is reported.
  vectors: []

- id: PKG-024
  layer: convention
  level: must
  when: >-
    An actor asks to install a package, and its archive cannot be fetched now.
  then: >-
    The request is not dispatched, and reports unavailable.
  observable: >-
    Nothing is installed, and the packages that are installed are as they were. The same request
    made once the archive can be fetched is decided as any other. An archive is fetched under
    PRV-017. Nothing is fetched for an address and version that is already installed, under
    PKG-025 and PKG-027, so a request for one never reports unavailable for this cause.
    Requests to install one address and version are decided one at a time under PKG-032.
  vectors: []

- id: PKG-025
  layer: convention
  level: must
  when: >-
    An actor asks to install a package, and a package is already installed at that address and
    version with another digest.
  then: >-
    The request is not dispatched, and reports conflict. It is decided from what is installed:
    nothing is fetched for an address and version that is already installed.
  observable: >-
    The installed package and its digest are as they were, and nothing is put in its place. Two
    versions are the same as PKG-003 states. A request to install another version at that
    address is not such a request: that version is installed beside the first, under NAM-011.
    The request reports conflict whether or not the archive can be fetched now, and whatever
    digest the archive at the place of `fetch` has: PKG-024 and PKG-026 are about a package that
    is not yet installed at that address and version.
    Requests to install one address and version are decided one at a time under PKG-032,
    each from what is installed once the earlier requests have ended.
  vectors: []



- id: PKG-026
  layer: language
  level: must
  when: >-
    A package is installed, and the digest of the archive that was fetched for it is not the
    digest that the request to install it names.
  then: >-
    The package is rejected.
  observable: >-
    Installation returns a diagnostic naming the two digests. The archive is not used, and its
    digest is not put in place of the one the request names, as PKG-021 states for an item of a
    manifest. The request reports invalid under PKG-023, whether or not another version of the
    package is installed. No archive is fetched for an address and version that is already
    installed: such a request is PKG-025 or PKG-027.
  vectors: []

- id: PKG-027
  layer: convention
  level: must
  when: >-
    An actor asks to install a package that is already installed at that address and version
    with the same digest.
  then: >-
    The request is decided like any other, changes nothing and has the outcome succeeded. It is
    decided from what is installed: nothing is fetched for an address and version that is
    already installed.
  observable: >-
    The packages that are installed are the same before and after the request, and the effect
    that `install.v1` describes has occurred. Two versions are the same as PKG-003 states. The
    request succeeds whether or not the archive can be fetched now, so PKG-024 does not apply to
    it. A request that names another digest for that address and version is PKG-025.
    Being decided like any other, the request is not dispatched where another promise has a
    request to install not dispatched: one that is not permitted reports refused under ACC-033,
    and one whose `fetch` is a relative reference reports invalid under PKG-023, although
    nothing would have been fetched. The same holds for PKG-025, where OPS-023 puts invalid
    before conflict.
    Requests to install one address and version are decided one at a time under PKG-032,
    each from what is installed once the earlier requests have ended.
  vectors: []

- id: PKG-028
  layer: language
  level: must
  when: >-
    A package is installed whose manifest lists a package that is not installed at the version
    and digest that the manifest gives.
  then: >-
    The installation is rejected, with a diagnostic naming each package its manifest lists that
    is not installed.
  observable: >-
    The request reports invalid under PKG-023, and nothing is installed. No package is fetched
    or installed because another package lists it, as none is because the manifest of a
    registration lists it under PKG-006: each is installed first, by a request of its own. So
    every check on the package's documents that needs another package is made when the package
    is installed. An instance document whose template needs a package that is no longer
    installed is rejected under PKG-007.
  vectors: []



- id: PKG-029
  layer: convention
  level: must
  when: >-
    An actor asks to install a package at an address that the manifest of a submitted project,
    or of the project that a request to replace a template hands over under SUB-009, states as
    its own `address`, while a template or an instance that exists holds that project's
    contracts or implementations under NAM-009 or PKG-005.
  then: >-
    The request is not dispatched, and reports conflict.
  observable: >-
    Nothing is installed, and the contracts of the submitted project keep that address. A
    qualified reference at the address would otherwise name both the project's contracts, under
    SUB-008, and the package's exports; MAN-016 rules out the other order, a submitted project
    that states the address of an installed package. No object exists for a contract after its
    submission, under SUB-008, so once no template or instance holds a submission at the
    address, a package may be installed there: an item of a bound's `operations` that names
    `address#name` then covers the installed package's operation of that name, under ACC-029.
    Where the actor is not permitted, or another reason also applies, OPS-023 says which is
    reported.
  vectors: []



- id: PKG-030
  layer: language
  level: must
  when: >-
    An implementation item reached by `remote` implements an operation of `runtime-provider.v1`,
    `machine-provider.v1` or `package-source.v1`.
  then: >-
    The item is rejected when its package is installed or its project is submitted.
  observable: >-
    Installation or resolving returns a diagnostic naming the item and the operation, as for a
    plain item under PKG-020. The operations of those capabilities are reached only by provider
    calls, under PRV-005, to a provider whose server the engine's own runner runs on `local` and
    reaches over stdio, under PRV-002 and PRV-026, and an item reached by `remote` is connected
    to and never run, under PRV-007, so no such provider could be run. A provider that works
    through a service elsewhere, such as a cloud's API, is a `command` or `package` item whose
    server reaches that service by its own means, as a container runtime that the kubelet
    reaches at a local socket pulls images from registries itself.
  vectors: []

- id: PKG-031
  layer: language
  level: should
  when: >-
    A package exports a capability, or a Type offering one.
  then: >-
    It also exports standard Conduit templates for the capability's common uses, named for
    those uses, such as `read`, `read-write` and `turn`. Each lists its operations as
    selections under NAM-018 and NAM-022: `#name` for its own operations, qualified references
    for other packages' operations, with NAM-022's exception for the core package's own
    documents. A later release at the same address keeps each such template's operation list;
    wider use takes a new template.
  observable: >-
    Authors can write `from: <address>#read` without copying an operation list. INS-013
    resolves the template at the pinned version under NAM-010. Comparing releases shows
    whether a standard template's operation list changed. This is a recommendation, not a
    rejection rule; a plan prints and counts any widening of the resolved Conduit operations
    before apply, including widening through a pin change.
  vectors: []

- id: PKG-032
  layer: convention
  level: must
  when: >-
    A request to install an address and version arrives while the engine is deciding another
    request to install that address and version.
  then: >-
    The engine decides requests to install one address and version one at a time. It begins
    to decide a request only once every request to install that address and version that it
    began to decide before has ended, and decides it from what is installed then. A repeat
    answered without a dispatch under OPS-009, OPS-012, OPS-032 or OPS-034 is answered as those
    promises say, and waits for nothing.
  observable: >-
    No order is promised between requests that arrive together. Each request is answered as
    the same request would be if made once every request that the engine began to decide
    before it had ended: by the install promises and every other promise under which a request
    to install is not dispatched, in OPS-023's order. Where an earlier request installed the
    package with another digest, PKG-025 reports conflict and nothing is fetched; with the same
    digest, PKG-027 reports succeeded, changes nothing and fetches nothing. Where none installed
    it, the request is decided as one for a package not yet installed, under PKG-023, PKG-024
    and PKG-026; a request with no `fetch` then reports invalid under PKG-023. Of requests that
    name different digests, at most one installs its package, and nothing is put in the place
    of an installed package. Requests for another version at that address, under NAM-011, or
    for another address are not held back. Two versions are the same as PKG-003 states.
    Deciding includes fetching the archive, before dispatch, under PRV-005 and PRV-017. Each
    later request waits as part of its own decision, only for requests the engine began to
    decide before it; waiting leaves no state that outlives the request, and nothing wakes on
    its own. An install fetches and installs no other package, under PKG-028, so no two installs
    wait on each other.
    Cargo likewise waits for the lock on its package cache before proceeding.
  vectors: []
