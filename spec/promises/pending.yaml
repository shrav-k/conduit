# Pending actions: one mechanism for what waits on a person.
# Standing: draft specification; see spec/README.md for status and coverage.
# Enrollment kinds are PND-008; review and keep wait for batch 2.

- id: PND-001
  layer: convention
  level: must
  when: >-
    Something waits on a person.
  then: >-
    It is one pending action, with an ID, a kind, subjects in resolved form {kind, id,
    name}, evidence under PND-004 and an expiry. An answer holds its value, actor where
    there is one, invocation where there is one and time. Its form is pending-action.v1.
    Raising one permits nothing.
  observable: >-
    The documented kinds are sign-in, setup, notice, enrollment, machine and machine-removal
    (PND-008). kind and answer values are strings, so
    adding values needs no new schema version. An answer is never a request's outcome. An
    instance has at most one unanswered sign-in and one unanswered setup action. A setup
    action uses its setup invocation's ID; stored kinds receive an engine ID when raised,
    whether or not that happens within an invocation. Where there is a raising invocation,
    the action retains its attribution to that invocation.
  vectors: []

- id: PND-002
  layer: convention
  level: must
  when: >-
    An action is unanswered and has not expired.
  then: >-
    It is raised at root and every Interface whose scope contains a subject: the Pool or
    Fleet itself, the owner of an instance, or an owner of either end of a Conduit. Scope is
    computed from the Interface's open inspection Conduits (definitions.md). It is never
    raised at an Agent.
  observable: >-
    Raised means listed in list.v1's pending output and in inspect.v1's status.pending for the
    subject, for such an Interface. Each result of that Interface's own request carries
    io.github.shrav-k.conduit/unanswered, the number raised there, only when nonzero. Another
    Interface sees only subjects and evidence about objects it may inspect, with no count of
    the rest. Root sees all subject objects. Codes and fingerprints remain withheld under
    PND-004 even from root's tool results. Agents' list and inspect results carry no pending
    actions. Peer delivery is written in batch 2 with appointment, keep and withhold (ruling
    68, point 3).
  vectors: []

- id: PND-003
  layer: convention
  level: must
  when: >-
    An operation answers a pending action, or its expiry passes.
  then: >-
    The answer is decided under ordinary access using the Conduits the actor holds. Sign-in is
    answered signed-in by sign-in.v1; setup is answered retried, ready, retired or dismissed
    (PND-006); notice is answered acknowledged by answer.v1. Enrollment, machine and
    machine-removal are answered under PND-008 at root alone; anything touching a secret
    remains root's. A scoped Interface completes sign-ins only for Agents of its scoped
    Fleets. A retired sign-in subject answers void.
  observable: >-
    Every action has an expiry, whose duration is DL19; enrollment shares the expiry
    bounded by ENR-001 and DL5. Once it passes the answer is
    expired, with no actor, and nothing is dispatched. An operation answering an answered,
    expired or void action reports conflict after the access decision. Expiry starts no
    hook, setup or model work. Answers add no authority and do not resume any request that
    ended.
  vectors: []

- id: PND-004
  layer: interface
  level: must
  when: >-
    The engine presents or records evidence or a prompt for a pending action.
  then: >-
    Evidence is a list of evidence-item.v1 items {kind, value, where, proves}, all four
    required. Documented kinds are code, fingerprint, attestation and fact. It comes from
    what the engine observed or an implementation or provider reported through a call the
    engine made, never a model's turn. The engine alone renders evidence at its panel.
    Values of kind code or fingerprint appear in no elicitation message, tool result, _meta,
    notification or record of a request; they are shown only in the engine's own panel and
    recorded with the answer.
  observable: >-
    Other evidence is disclosed only to Interfaces at which the action is raised, limited by
    inspection under PND-002. A URL to open is a prompt, not evidence: only IFC-049 relays it,
    never tool content, structuredContent or records. It is held only until its expiry or the
    action's answer. An enrollment join action follows ENR-003: only a secret-free URL may be
    relayed under IFC-049, and every command and secret-bearing action appears only at root's
    panel. Pending machine evidence follows PND-008, including attestation and fact values.
    Evidence with an answer follows its disclosure; a record of that answer is distinct from a
    record of a request. Inspection or export of answer records through a tool also withholds
    code and fingerprint values; storing them with the answer never authorizes returning them
    on the wire. The panel can display the full recorded evidence to a person permitted to
    inspect the answer. A return is neither evidence nor a prompt. PND-013 alone governs it,
    and only signInReturn carries it.
  vectors: []

- id: PND-009
  layer: convention
  level: must
  when: >-
    An Interface asks answer.v1 with {action, answer}.
  then: >-
    It is dispatched only on the Interface's own behalf, through an open Conduit listing it
    to the target that authorizes inspection of the subject (ACC-033): the owning Pool for a
    Resource, the owning Fleet for an Agent or a notice's Fleet, and management otherwise,
    with the inspection fallback for a retired owner. A Conduit whose consumer is not an
    Interface cannot be opened listing answer.v1; that open reports refused.
  observable: >-
    An action not raised at the caller reports refused before invalid, revealing nothing of
    whether it exists. An answer not accepted by the kind reports invalid and names the
    answering operation: sign-in.v1 for sign-in, admit-machine.v1 and refuse-machine.v1
    for enrollment, and refuse-machine.v1 for machine. answer.v1 accepts
    dismissed for setup, acknowledged for notice and kept for machine-removal (PND-008). It
    has no outputs and dispatches no hook or model work. Already answered actions report
    conflict (PND-003). Where subjects have different inspection targets, authorization
    follows the subject the kind defines for answering: the notice's Fleet under PND-007. A
    setup action touches a secret only through its setup operation; dismissing it dispatches
    nothing. Root alone answers an action whose answer itself touches a secret. For an action
    already answered, the raised-at test uses its retained subjects and the Interface's
    current scope; it is no longer listed, but an authorized further answer reports conflict
    under PND-003.
  vectors: []

- id: PND-012
  layer: convention
  level: must
  when: >-
    A request raises or answers an action.
  then: >-
    Its record names the action's ID. The recorded answer holds the kind, the evidence shown
    and the answer with actor, invocation and time. No record holds a prompt or a return;
    a request record holds no code or fingerprint value (PND-004).
  observable: >-
    Raising adds no record type of its own. Computed setup actions add none. Pending state
    and answered state used to prevent repeated answers survive a purge of records under
    REC-004; expiry changes no request outcome.
  vectors: []

- id: PND-005
  layer: convention
  level: must
  when: >-
    An instance whose Type states signIn has a string at its account pointer, and setup's
    account-hook reports no account or a different account; or its implementation sends URL-
    mode elicitation outside sign-in.v1; or its contract reports a missing or lapsed login.
  then: >-
    A sign-in action is raised for the instance, with expiry. Evidence names the expected
    account, the login started by name and return, device user code where relevant, triggering
    request and attempts with their results, subject to PND-004. Each return attempt lists its
    via, time and result, never its value. Until answered, operations that start model work on
    that instance are not dispatched and report unavailable with the action ID in
    io.github.shrav-k.conduit/pendingAction.
  observable: >-
    Every held request is final. Nothing is queued, resumed or dispatched after it ends; the
    caller sends a new request. A mid-call URL elicitation ends that call unknown under
    IFC-016. No action is raised for a Type without signIn or with a null account setting;
    its call ends unknown with an explicit diagnostic. After expiry a new sign-in is raised
    on the next held request or setup, never by expiry alone.
  vectors: []

- id: PND-010
  layer: convention
  level: must
  when: >-
    An Interface calls sign-in.v1 {instance, expectedId?}.
  then: >-
    The engine implements it only for the Interface acting on its own behalf, authorized
    through the Agent's owning Fleet or the Resource's owning Pool (ACC-033). A caller other
    than root signs in only an Agent of a Fleet in its scope; Resources remain root's.
    expectedId follows LIF-037. The Type must state signIn with a string expected account,
    otherwise the permitted request reports invalid. A Conduit whose consumer is not an
    Interface cannot be opened listing sign-in.v1; the open reports refused.
    Before dispatching any part, a signInLogin naming no login the Type states reports invalid,
    with a diagnostic naming PND-010 and the stated login names. Before dispatching any part,
    the request reports unavailable where an in-progress sign-in.v1 invocation may start a
    login stating a fixed port that a login this request may start also states. The diagnostic
    names PND-010 and the port, and names the other invocation's pending action only where
    the caller may see it (PND-002). A request may start its asked-for login or, without one,
    any of its Type's logins. These decisions follow OPS-023's order.
  observable: >-
    The engine first dispatches account-hook.v1 as a part, before sign-in-hook.v1. If that
    check succeeds with the expected account, compared ignoring ASCII case, sign-in.v1
    succeeds with output account and answers any sign-in action signed-in. If that check
    succeeds with no account or another account, the engine invokes sign-in-hook.v1 as a
    part and relays its URL elicitation under IFC-049; that initial mismatch does not undo
    the account or end sign-in.v1. Each retry polls account-hook.v1 to check the account
    after the person's sign-in, under PND-011, until an account appears or DL18 ends; no
    account yet is not failed. The same invocation may answer another InputRequiredResult or
    block. Decline or cancel received on a retry ends failed. DL18 ending without completion
    ends unknown and no hook runs later. The operation starts no model work and resumes no
    held request. Missing URL capability uses -32021 with requiredCapabilities, not invalid.
    The engine passes the asked-for name to sign-in-hook.v1 (IFC-006), which starts that login
    or fails with a diagnostic naming PND-010 and why it could not. Without a name the hook
    chooses among the Type's logins. A plain hook gets no Conduit keys (IFC-007), hence no
    name; its URL for another login fails IFC-049's match. This includes asking for a device
    code where the account permits it. The return goes only through the Interface that
    received the sign-in: only its retry in the session and invocation bound by requestState
    (IFC-049) carries a return under PND-013. Polling continues under PND-011, and the account
    check alone decides completion.
  vectors: []

- id: PND-011
  layer: convention
  level: must
  when: >-
    An account-hook.v1 part checks the account during setup, before sign-in-hook.v1 in
    sign-in.v1, or while polling after that hook's URL elicitation.
  then: >-
    Only the expected account, compared ignoring ASCII case, completes sign-in. The check
    before sign-in-hook.v1 follows PND-010: no account or another account proceeds to that
    hook. During polling after its URL elicitation, the expected account succeeds with output
    account and answers the action signed-in; a different account is undone by a
    sign-out-hook.v1 part, sign-in.v1 ends failed naming both accounts, and the action stays
    pending with the attempt as evidence. A failed or unknown
    account hook does not complete sign-in, and its uncertainty is explained; no account yet
    during polling follows PND-010.
  observable: >-
    If sign-out does not succeed, the engine reports SignInUndone=False with its cause and
    holds back all model work. Only a later account-hook.v1 part within sign-in.v1 or setup
    that reports the expected account or none clears that condition; reconciliation never
    clears it. Hooks run only as parts of sign-in.v1 or setup, for that invocation's caller
    and filters, through no Conduit, never on an implementation notification. Setup checks
    the account after its run and connections and before its setup hook, in TPL-012's order;
    no account or a different account raises the action under PND-005, and a different
    account is undone by a sign-out-hook.v1 part before setup proceeds.
  vectors: []

- id: PND-013
  layer: convention
  level: must
  when: >-
    An Interface's retry of sign-in.v1 carries signInReturn.
  then: >-
    IFC-049's requestState checks come first: a retry they reject carries no return anywhere.
    A retry that declines or cancels ends failed under PND-010 and passes on no value.
    Otherwise the engine checks these in order, refusing the return with the named reason:
    first, the relayed login's return is redirect or page, it states carried: true, and its
    sign-in-hook.v1 implementation carries Conduit's keys (IFC-007), else not-accepted;
    second, no return has been passed on for this invocation, else already-returned;
    third, value is at most 8192 bytes and all printable ASCII, else malformed;
    fourth, for redirect, value parses once as an absolute URL with no user information,
    fragment or repeated parameter, else malformed; its scheme is http, its host is loopback
    (localhost, 127.0.0.1 and [::1] count as one), and its port and path are the relayed
    redirect_uri's, else address-mismatch; its state equals the relayed state, else
    state-mismatch; its iss equals the login's issuer where both are present, else
    issuer-mismatch. The issuer check applies only where both are present. A page return is
    the page's opaque code. Every refused return has a diagnostic naming PND-013, the failed
    check and its cause, with none of the value. Failure uses no return, and a later value
    still may pass. Once a value is passed to the hook it is used, whatever the hook reports;
    a return carrying error is passed on too.
  observable: >-
    The engine rebuilds a redirect value as the relayed redirect_uri with a query containing
    only code, state, iss and scope, and on an error error, error_description and error_uri
    (RFC 6749 section 4.1.2, RFC 9207). It retries the sign-in-hook.v1 call that started the
    login, carrying that call's own requestState, accept in inputResponses for its URL
    elicitation, and signInReturn {value}. This retry is a part of sign-in.v1 and recorded as
    that call is (PND-011), holding neither the value nor signInReturn in its record. Only
    the package and login that started it receive it. The implementation gives it only to
    the program waiting on that login: for redirect, as a request to the relayed
    redirect_uri's port and path at loopback on its own machine; for page, as program input.
    It contacts no other host, succeeds where the program took the value, and fails otherwise.
    The result answering the Interface retry, another InputRequiredResult or the final
    result, holds signInLogin with returned: delivered where the hook reports the program
    took the value; undelivered where it was passed on and the hook failed, with a diagnostic
    naming PND-013 and the hook's cause, the return used all the same; or refused with reason
    naming the failed check. A return carrying error adds error: its RFC 6749 registered
    error code, or other for an unregistered code, never error_description or error_uri.
    Polling continues under PND-011. Undelivered ends nothing; the person may decline or
    cancel (PND-010). No diagnostic holds a return, code, state, URL value, error_description
    or error_uri. The value appears in no result, structuredContent, response _meta,
    notification, diagnostic, log or record. It is none of the values REC-002 keeps. The
    engine holds it in memory only until the hook retry ends; restart loses it.
    signInReturn on a first sign-in.v1 request, any other operation's request, or a tasks/update
    is not a return: after access and before dispatch the request reports invalid in
    OPS-023's order, with a diagnostic naming PND-013 and the key, holding no value. For
    tasks/update this is IFC-016's error for a task request that does not proceed, with
    reason invalid. A return travels only on a tools/call retry whose requestState IFC-049
    accepts. After DL18 no return is passed on and no hook runs; IFC-049 rejects the expired
    requestState before these checks.
    State stops blind injection and cross-site request forgery. Iss, where the login states
    issuer, stops authorization-server mix-up (RFC 9207, RFC 9700 section 4.4); without it
    Conduit stops no mix-up and the program relies on its own defenses. PKCE with S256 stops
    anyone else redeeming a code. The stated login stops a look-alike page and, where the
    URL carries a client ID, a Type claiming another Type's client. A device URL names no
    client: only its stated verification page is checked, where the person types the code
    (RFC 8628 section 5.4). The account check stops a code minted for another account by
    someone who saw the URL (RFC 9700 section 4.5). It alone stops that attack, so no login
    returning anything is without it (CTR-013).
    An Interface carries a return only from a loopback listener it opened for that one login,
    or what the person typed, never model output. It opens a listener only where it knows it
    does not run on the machine of the node signInLogin names: on that machine the program's
    own listener takes the redirect, and a second could take its request or prevent its bind.
    Where it cannot tell, or cannot bind the port, it opens none and asks the person to paste.
    Its listener answers only a request matching path, Host and state and stops after that
    request or at DL18. The engine cannot tell where a return came from (spec/README.md).
  vectors: []

- id: PND-006
  layer: convention
  level: must
  when: >-
    An instance is not retired and its latest set-up.v1 invocation ended failed or unknown.
  then: >-
    One setup action is computed, with that invocation's ID, the instance as subject, and
    evidence naming the invocation, outcome, reason and diagnostics where present, parts
    that did not succeed and unreconciled IDs. It has an expiry under DL19.
  observable: >-
    Dispatch of a further set-up.v1 answers retried; reconciliation as having occurred
    answers ready; retirement answers retired; answer.v1 may answer dismissed. A dismissal
    or expiry for that invocation stays answered and is not recomputed as unanswered. A
    later unsuccessful setup makes a new action. Computation adds no record and dispatches
    nothing.
  vectors: []

- id: PND-007
  layer: convention
  level: must
  when: >-
    A Resource's retirement sent by an instance other than root closes under CON-008 a
    Conduit consumed by an Agent of a Fleet other than the sender's.
  then: >-
    One notice is raised per such Fleet. If the sender is not an Agent, every Fleet counts
    as other. Its subjects are the Resource and that Fleet's closed Conduits, retained by
    their resolved identities. Its evidence gives the Resource, owning Pool, sender, caller,
    invocation and closed Conduits. It is stored with an engine ID allocated within
    retirement and an expiry under DL19.
  observable: >-
    It is raised at root and Interfaces whose scope contains that Fleet. answer.v1 answers
    acknowledged. The retirement result names each notice in
    io.github.shrav-k.conduit/pendingAction. Raising a notice closes nothing beyond CON-008
    and confers no permission. Evidence is disclosed under PND-002 and PND-004.
  vectors: []

- id: PND-008
  layer: convention
  level: must
  when: >-
    An enrollment opens, a pending machine is reported without an open enrollment to attach
    to, or a retired node's machine remains reported (ENR-001, ENR-004, ENR-012).
  then: >-
    The kind is enrollment, machine or machine-removal respectively. The sole subject of
    enrollment and machine is the machine provider Resource, owned by system (PRV-013).
    The sole subject of machine-removal is the node, also owned by system (PLC-026). A
    pending machine is not an object and is no subject. These actions are raised at root
    alone: system belongs to no scope (PND-001, PND-002). Only root's own panel shows their
    machine evidence, code, fingerprint or join action (ENR-003, ENR-004, PND-004).
  observable: >-
    enrollment is answered admitted by admit-machine.v1, refused by refuse-machine.v1, or
    expired on expiry. machine is answered refused on removal by refuse-machine.v1, or
    expired. machine-removal is answered removed by refuse-machine.v1, kept by answer.v1
    without removal, or expired. A retired provider closes its open enrollments refused
    (PRV-013). DL19 governs the machine and machine-removal durations; an enrollment action
    shares ENR-001's expiry, bounded by DL5. Other answers report invalid under PND-009,
    naming the operation for that kind; already answered actions report conflict under
    PND-003, after access. Tools list only ID, kind, subject, expiry and state, never a
    pending machine's evidence, even at root: evidence is an empty list in these kinds'
    pending-action.v1 wire views. Answer records hold the evidence shown, the
    weaker-check flag and whether a fingerprint was compared or the weaker check accepted;
    tool inspection and export withhold this evidence as well (PND-004, ENR-007).
  vectors: []
