# Placement: where an Agent or Resource runs.
# Owner rulings of 2026-11-05 (plan-audit rulings 7, 8, 17, 28, 29, 32 and 33). What a type or
# an implementation needs of a location is a requirement on placement: a schema that the
# location's stored facts must satisfy. Removed by consolidation pass 1: PLC-010 was folded into
# OBS-003 and LIF-010, and PLC-014 into CTR-004. PLC-011 was split into PLC-011 and PLC-017.
# The follow-up rulings removed nothing. The ruling on the core package and the schemas (ruling
# 37) changed PLC-008 and PLC-016. The conversion of the older text (decision DA3 of the docs
# audit, docs/proposals/docs-audit/GAPS.md) added PLC-020. The second round of the re-audit
# (docs/proposals/reaudit/round-2/DECISIONS.md) changed PLC-001, PLC-005, PLC-008, PLC-016 and
# PLC-020, and added PLC-021, of the layer `convention`, which took from PLC-008 how a
# location's facts are changed. Its closing pass changed PLC-017 and PLC-021 and reworded one
# sentence of PLC-007. Draft: no vector exists yet.

- id: PLC-001
  layer: language
  level: must
  when: >-
    An Agent or a Resource is instantiated.
  then: >-
    It has exactly one placement, which is a location. The instance holds it in the resolved
    form of OBJ-009, with the location's ID.
  observable: >-
    Inspecting the instance shows one placement. A document that gives two, or a
    placement that is not a location, is rejected.
  vectors: []

- id: PLC-002
  layer: language
  level: must
  when: >-
    An Agent or Resource instance document, other than a location's, gives no placement, and
    exactly one location exists that is not retired.
  then: >-
    Its placement is that location.
  observable: >-
    The resolved instance holds that location's ID. A retired location is not counted.
  vectors: []

- id: PLC-003
  layer: language
  level: must
  when: >-
    An Agent or Resource instance document, other than a location's, gives no placement,
    several locations exist that are not retired, and the `system` Pool's default-location
    setting names one of them.
  then: >-
    Its placement is the designated default.
  observable: >-
    The resolved instance holds the default location's ID.
  vectors: []

- id: PLC-004
  layer: language
  level: must
  when: >-
    An Agent or Resource instance document, other than a location's, gives no placement,
    several locations exist that are not retired, and the `system` Pool's default-location
    setting names none of them.
  then: >-
    The instance is not instantiated. No location is chosen by the order in which locations
    were registered or found.
  observable: >-
    Resolving returns a diagnostic listing the locations that are not retired.
  vectors: []

- id: PLC-005
  layer: language
  level: must
  when: >-
    A template is registered that gives a placement: in an entry that writes `placement`, or as
    the `default` of an input whose destination is an entry's `placement`.
  then: >-
    The template is rejected. A placement is given only when an instance is instantiated.
  observable: >-
    Resolving returns a diagnostic naming the entry or the input. A template may refer to a
    location in any other way: as the `target` of a declared Conduit, among the `targets` of a
    bound, or in a place of `config` that a reference schema governs.
  vectors: []

- id: PLC-006
  layer: language
  level: must
  when: >-
    An instance document for an Interface, a Pool or a Conduit gives a placement.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the document and the placement field.
  vectors: []

- id: PLC-007
  layer: language
  level: must
  when: >-
    An instance's type, or an implementation selected for it, states a requirement on placement
    whose schema the stored facts of the instance's location do not satisfy.
  then: >-
    The instance is not instantiated.
  observable: >-
    Resolving returns a diagnostic naming the type or the implementation, the requirement and
    the location, before any effect. A fact that is absent from the location's stored facts
    fails the requirement. It is decided from the documents and the stored facts, without
    reaching the location.
  vectors: []

- id: PLC-008
  layer: language
  level: must
  when: >-
    A location is instantiated.
  then: >-
    It is a Resource instance of the location type, owned by the system Pool, and it is its own
    placement. Its facts, including its host, are stored configuration of the location, held
    under `facts` in its configuration.
  observable: >-
    Inspecting a location shows the kind Resource, the location type, the system Pool as owner,
    its own ID as placement, and its facts under `facts` in its configuration. A location's
    document states no placement: one that states a `placement` is rejected. It writes
    `owner: system`, as OBJ-013 requires an owner of every Resource document, and one that names
    another Pool is rejected. A document made from the core package's template `location`
    supplies the facts as the argument `facts`. How they are changed once the location is
    instantiated is PLC-021.
  vectors: []

- id: PLC-009
  layer: language
  level: must not
  when: >-
    An instance exists.
  then: >-
    Its placement is changed.
  observable: >-
    No operation changes the placement of an existing instance. Running it elsewhere means
    instantiating another instance.
  vectors: []

- id: PLC-011
  layer: convention
  level: must
  when: >-
    An actor asks to retire or to unregister a location that has other instances placed on it.
  then: >-
    The request is not dispatched and reports conflict. Only the declare-lost operation, which
    is reserved to the root Interface, retires a location that still has instances.
  observable: >-
    The location and its instances still exist, in the states they had.
  vectors: []

- id: PLC-012
  layer: convention
  level: must not
  when: >-
    Two instances share a location or a host.
  then: >-
    Either gains access to the other because of it.
  observable: >-
    A request between them reports refused unless an open Conduit lists the operation, exactly
    as for instances on different locations.
  vectors: []

- id: PLC-013
  layer: convention
  level: must
  when: >-
    A Conduit carries a shared-host requirement, and the stored facts of its consumer's and its
    target's locations do not give the same host, either when the Conduit is being opened or
    when a request is made through it.
  then: >-
    The request to open, or the request through the Conduit, is not dispatched and reports
    unavailable. No other way of reaching the target is substituted.
  observable: >-
    A Conduit that was not opened is still in the state registered. A Conduit that is already
    open stays open, and a request through it is dispatched only while the stored facts give
    the same host. A host that is absent from the stored facts of either location does not
    satisfy the requirement.
  vectors: []

- id: PLC-015
  layer: language
  level: must
  when: >-
    An instance is placed on a location.
  then: >-
    It depends on the location through its placement alone. No Conduit to the location is
    needed or instantiated for that.
  observable: >-
    Resolving the instance yields no Conduit whose target is its location. This is one of the
    three ways a location differs from other Resources; the others are PLC-008 and PLC-011.
  vectors: []

- id: PLC-016
  layer: convention
  level: must
  when: >-
    The default location is designated or cleared.
  then: >-
    It is done by a control of the `system` Pool, permitted and checked like any other control,
    which sets the setting to a location that exists or to nothing.
  observable: >-
    The control is `set-default-location.v1` of the core package, in the capability
    `system-settings.v1` that the type of the `system` Pool offers. It takes `location`, a
    reference to a Resource or null, and null clears the setting. A value other than null that
    does not refer to a location that exists reports invalid. The setting stores the location in
    the resolved form of OBJ-009. After the control succeeds, an instance instantiated without a
    placement takes the named location under PLC-003. Once the location that the setting names
    is unregistered, the setting still holds its ID and reports it as missing, under LIF-019: it
    then names none of the locations that exist, and PLC-004 applies until the control sets it
    again.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32, decision A2 and reader findings).

- id: PLC-017
  layer: convention
  level: must
  when: >-
    The root Interface declares a location lost.
  then: >-
    The location and every instance placed on it are retired. The status of each reports its
    shutdown as unknown, and states that it could not be confirmed because the location was
    declared lost. An instance for which no setup was ever dispatched reports confirmed, as
    LIF-025 states, and one whose shutdown was confirmed before stays confirmed, under LIF-024.
  observable: >-
    Each of them can then be unregistered under LIF-017 without a reconciliation. The Conduits
    of which any of them was an end are closed under CON-008.
  vectors: []

- id: PLC-018
  layer: language
  level: must
  when: >-
    An Agent or a Resource would be instantiated with a placement that is a retired location.
  then: >-
    The instance is not instantiated.
  observable: >-
    Resolving returns a diagnostic naming the location and stating that it is retired. A
    location that is registered and not yet ready is accepted as a placement, and PLC-019 says
    what a request to set up the instance then reports.
  vectors: []

# --- Added by the follow-up rulings (plan-audit ruling 33; decision F16 of the re-audit).

- id: PLC-019
  layer: convention
  level: must
  when: >-
    An actor asks to set up an instance, other than the location itself, whose location is in
    the state registered and so is not ready.
  then: >-
    The request is not dispatched, and reports unavailable.
  observable: >-
    The instance is in the state it had, and no implementation receives a call for its setup.
    Once the location is ready, a request to set up the instance is decided as any other.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; row GP12 of
# --- docs/proposals/docs-audit/GAPS.md).

- id: PLC-020
  layer: convention
  level: must not
  when: >-
    An instance holds a value that is tied to a location: one that has its meaning only at that
    location, such as an absolute path.
  then: >-
    The value is interpreted anywhere other than by the instance's implementation at the
    instance's placement.
  observable: >-
    The engine stores the value and passes it on as it was written, and never opens it, expands
    it or checks it against the machine the engine itself runs on or against any other location.
    An absolute path in the configuration of a Resource means that path on the host of the
    Resource's location. That the engine joins no base to a relative path is INS-018.
  vectors: []

# --- Added by the second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md;
# --- finding R1-5.3): the part of PLC-008 that is of the layer `convention`.

- id: PLC-021
  layer: convention
  level: must
  when: >-
    The stored facts of a location that has been instantiated are changed.
  then: >-
    They are changed only by the control `set-facts.v1` of the core package, permitted and
    checked like any other control.
  observable: >-
    The control is in the capability `location-settings.v1`, which the location type offers, so
    it is requested through an open Conduit to the location that lists it. It takes the
    location's current `revision` and `facts`, and its result states the settings it confirmed
    in `settings`. Nothing observed of the location changes a stored fact. A change of facts
    changes no instance that is placed on the location: PLC-007 tests a requirement on placement
    when an instance is instantiated and not again, and PLC-013 tests the shared-host
    requirement on each opening and each request.
  vectors: []
