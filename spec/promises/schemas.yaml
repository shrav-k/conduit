# Schemas and document syntax. See ../schema-profile.md for the standards these refer to.
# Owner rulings of 2026-11-05 (plan-audit rulings 23, 24, 32 and 33) and earlier accepted
# syntax rules. Consolidation pass 1 added SCH-015 to SCH-017. The follow-up decisions (ruling
# 33) added SCH-018. The ruling on the core package and the schemas (ruling 37) changed SCH-008
# and SCH-015. The conversion of the older text (decision DA3 of the docs audit,
# docs/proposals/docs-audit/GAPS.md) changed SCH-009 and added SCH-019 to SCH-021. The second
# round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md) changed SCH-001, SCH-008
# to SCH-010, SCH-014, SCH-016 and SCH-019, and its closing pass reworded one sentence of
# SCH-008. No promise of this file has been removed. Draft: no vector exists yet.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which ruling 39 accepted, changed
# SCH-009: the default of a property is filled in every value that a schema governs, before the
# value is validated or compared. It added none and removed none.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40
# (docs/proposals/ruling-40/README.md) and the principles review
# (docs/proposals/principles-review/README.md), changed SCH-008 and SCH-009, since the profile
# now holds JSON Schema's applicator vocabulary and a `default` is rejected under its
# conditional keywords too (decision 20), and SCH-019, since an Operation contract's input
# states its `default` in its `inputSchema` (decision 16a). It removed none and added none. The
# log is docs/proposals/ruling-41/log-G6.md.
# The editorial fixes of ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06; the
# vocabulary audit's E12, log docs/proposals/ruling-42/log-editorial.md) changed SCH-015, under
# which a qualified reference or a `#name` references the schema that is the contract's `spec`,
# as JSON Schema says of `$ref`, where it said that it stands for it. It removed none and added
# none.
# The verification of ruling 42 (docs/proposals/ruling-42/log-integration.md, "Verification")
# changed SCH-009, whose observable says the `arguments` of a filter that an implementation is
# sent, where it said a restriction, since only filters are sent (the vocabulary audit's N16).
# It removed none and added none.
# The verification of round 6 of the re-audit, under ruling 44
# (docs/proposals/ruling-44/README.md; docs/proposals/reaudit/round-6/log-integration.md,
# "Verification"), changed SCH-009, whose observable says that a `default` that the root of an
# Operation contract's `inputSchema` reaches only through a keyword beside its `properties`,
# which D14 now allows, is not applied (C-03, R-09). It removed none and added none.
# The coordinator's decisions on the findings of increment 1 of the first build, under ruling
# 46, point 4 (docs/proposals/first-build/log-increment-1.md), changed SCH-006 and SCH-020: a
# number written with a fraction whose binary64 value is whole is held to SCH-006's range
# (1-10); SCH-016: a key of `patternProperties` is a pattern too, and a schema whose pattern is
# not one of ECMA-262 is rejected as SCH-002 rejects a keyword outside the profile (1-03); and
# SCH-018: a JSON file whose value is not an array holds that value as one document, which the
# schemas judge (1-07). It removed none and added none. The owner can strike each.

- id: SCH-001
  layer: language
  level: must
  when: >-
    A schema uses a keyword the profile permits.
  then: >-
    The keyword means what JSON Schema 2020-12 defines it to mean.
  observable: >-
    A value is valid against the schema exactly when a conforming JSON Schema 2020-12 validator
    that asserts formats, as the format-assertion vocabulary of JSON Schema defines, says it is.
    For a format the profile lists, the grammar SCH-004 cites is the one that is checked.
  vectors: []

- id: SCH-002
  layer: language
  level: must
  when: >-
    A schema written in a contract or a template uses a keyword outside the profile's list.
  then: >-
    The document that holds the schema is rejected, when its package is installed or when it is
    submitted. The keyword is never ignored.
  observable: >-
    The document is rejected by `schema.v1`, under SUB-005. Installation or resolving returns
    a diagnostic naming the keyword and where it appears. A misspelled keyword is rejected in
    the same way.
  vectors: []

- id: SCH-003
  layer: language
  level: must
  when: >-
    A schema written in a contract or a template names a format outside the profile's list.
  then: >-
    The document that holds the schema is rejected, when its package is installed or when it is
    submitted.
  observable: >-
    The document is rejected by `schema.v1`, under SUB-005. Installation or resolving returns
    a diagnostic naming the format.
  vectors: []

- id: SCH-004
  layer: language
  level: must
  when: >-
    A value is checked against a schema that names a format in the profile's list.
  then: >-
    The value is valid only if it matches the grammar cited for that format.
  observable: >-
    A string that does not match the cited grammar fails validation. Checking a `uri` makes no
    request to it.
  vectors: []

- id: SCH-005
  layer: language
  level: must
  when: >-
    A number with no fractional part is checked against the type integer.
  then: >-
    It is an integer however it is written, as JSON Schema defines.
  observable: >-
    The values 15, 15.0 and 1.5e1 are each valid for the type integer. The value 15.5 is not.
  vectors: []

- id: SCH-006
  layer: language
  level: must
  when: >-
    A document contains a number outside the range from −9,007,199,254,740,991 to
    9,007,199,254,740,991 that has no fractional part, or that has one and is read under SCH-020
    as a binary64 value that has none.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the value. It is not rounded into the range. No
    integer outside the range is read, however the number is written: `9007199254740993.5` is
    read under SCH-020 as 9,007,199,254,740,994, which has no fractional part, and is rejected.
  vectors: []

- id: SCH-007
  layer: language
  level: must
  when: >-
    Two values are compared for equality.
  then: >-
    They are equal exactly when JSON Schema's definition of equality says so: numbers by value,
    strings character by character, lists in order, and maps by their keys and values
    regardless of key order.
  observable: >-
    1 equals 1.0. Two maps with the same keys and values in different orders are equal. Two
    lists with the same items in different orders are not.
  vectors: []

- id: SCH-008
  layer: language
  level: must
  when: >-
    A schema written in a contract or a template places `default` anywhere other than on a
    property reached through `properties`. The schema that holds the property may be written
    directly, reached through `$ref`, or be the schema that `items` gives.
  then: >-
    The document that holds the schema is rejected, when its package is installed or when it is
    submitted, and so is one whose `default` stands on such a property inside `allOf`, `anyOf`,
    `oneOf`, `not`, `if`, `then`, `else` or `dependentSchemas`. Whether a `default` is allowed
    is judged where it is written, in the schema that holds it.
  observable: >-
    A `default` is accepted where the schema that states it is written as a member of
    `properties` and is not inside any of those eight keywords. A `default` inside one of them,
    and a `default` on `items` itself, each produce a diagnostic naming its position. A
    `default` under a conditional keyword would apply only where its condition holds, so none is
    accepted there. A `default` on a property of a map inside `items` is accepted, as Kubernetes
    structural defaulting accepts it. A `default` that a member of `$defs` states on itself is
    rejected, even where the only `$ref` to that member is written as a property: what refers to
    a schema does not change whether its `default` is allowed.
  vectors: []

- id: SCH-009
  layer: language
  level: must
  when: >-
    A value is supplied where a schema governs it, and a property that has a `default` in that
    schema is absent from a map that is present in the value. The schema is that of a type, for
    the `config` of a template that is instantiated, or that of an input of a template, of an
    Operation contract or of a Requirement contract, for an argument.
  then: >-
    The property takes its default. It is filled before the value is validated against the
    schema and before the value is compared with another, and the filled value is what is stored
    or sent.
  observable: >-
    The resolved instance holds the default value there, and so does the request that an
    implementation receives and the `arguments` of a filter that it is sent. This is one rule
    for every schema that governs a supplied value: the configuration of an instance, the
    argument of a template's input under INS-006, the argument of an applied requirement under
    NAM-019, and the argument of an operation's input in a request, under OPS-026. With the
    schema `{type: object, properties: {depth: {type: integer, default: 1}}, required:
    [depth]}`, the supplied value `{}` is valid, is equal under SCH-007 to a supplied `{depth:
    1}`, and is stored or sent as `{depth: 1}`. An absent map is not made in order to hold its
    properties' defaults. A map that is an item of a list is present when the list holds it:
    each such item takes the defaults of its own properties, and no item is added to a list. The
    `config` of a template that writes none is present and empty, under INS-024, so the defaults
    of the type's schema apply to it. A `default` that is reached only through a `$ref` written
    inside `allOf`, `anyOf`, `oneOf`, `not`, `if`, `then`, `else` or `dependentSchemas` is not
    applied: SCH-008 accepts it where it is written, and none of those eight keywords gives a
    default. Nor is one that the root of an Operation contract's `inputSchema` reaches only
    through a keyword beside its `properties`, such as a `$ref` written at the root, which
    CTR-012 lets an operation that is not a control state: the arguments as a whole are no
    input's schema, so this promise does not reach them, and OPS-026 fills only the default that
    the root's own `properties` state for an input. The `default` of an input that is left out
    altogether is another rule: INS-007 for a template's input, OPS-026 for an operation's and
    NAM-019 for a requirement's, and SCH-010 says what then holds for a default that is a map.
    An output is not a supplied value, and no default is filled into a result. Independently
    of whether a supplied value needs a default, a document is rejected under SCH-009 when
    installed or submitted if schemas that apply to one place unconditionally, through a
    `$ref` and its siblings or through `allOf`, give different values of `default` there.
    The diagnostic names the place and the different defaults. Equal defaults are one default.
    This admission check does not make `allOf` supply defaults: the exclusions above still hold.
  vectors:
    - conformance/interface/schemas/schema-conflicting-defaults/case.yaml
    - conformance/interface/schemas/schema-equal-defaults/case.yaml

- id: SCH-010
  layer: language
  level: must
  when: >-
    A default supplies a map.
  then: >-
    The defaults of that map's own properties then apply to it, as they would to a map that a
    document supplied.
  observable: >-
    The resolved instance holds the default map with each of its absent defaulted properties
    filled. Whether such a default satisfies its schema is judged after they are filled in,
    under SCH-019.
  vectors: []

- id: SCH-011
  layer: language
  level: must not
  when: >-
    A value does not satisfy its schema.
  then: >-
    It is converted to a value that does.
  observable: >-
    The string "15" is invalid for the type integer, and the word yes is invalid for the type
    boolean. Neither is converted.
  vectors: []

- id: SCH-012
  layer: language
  level: must
  when: >-
    A document contains a duplicate key, an anchor, an alias, a merge key, a tag, or a key that
    is not a string.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the feature and its position.
  vectors: []

- id: SCH-013
  layer: language
  level: must
  when: >-
    A document is written in JSON.
  then: >-
    It means the same as the equivalent YAML document.
  observable: >-
    Resolving the JSON form and the YAML form of one document gives the same objects or the same
    diagnostics.
  vectors: []

- id: SCH-014
  layer: language
  level: must not
  when: >-
    A schema of an existing Model Context Protocol server, one that was not written for this
    specification, uses a keyword or format outside the profile.
  then: >-
    It is rejected for that reason.
  observable: >-
    The server's tools remain available, and its schema is checked by the rules of its own
    dialect.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32).

- id: SCH-015
  layer: language
  level: must
  when: >-
    A schema written in a contract or a template uses `$ref`.
  then: >-
    Its value is one of three: `#` followed by a JSON Pointer into the same schema, such as
    `#/$defs/name`; a qualified reference, which resolves to a Schema contract that a package
    exports; or `#` followed by a name, which resolves under NAM-022 to a Schema contract of the
    same project or package as the document that holds the schema. Each of the last two
    references the schema that is that contract's `spec`.
  observable: >-
    The three cannot be confused: a JSON Pointer is empty or starts with `/`, and a name
    starts with a letter. A `$ref` of any other form, such as an `https` address, is rejected
    like a keyword outside the profile, by `schema.v1`, under SUB-005. A qualified reference,
    or a `#name`, that resolves to something other than a Schema contract is rejected under
    SCH-015.
  vectors: []

- id: SCH-016
  layer: language
  level: must
  when: >-
    A schema uses `pattern`, or a key of `patternProperties`, which is a pattern too.
  then: >-
    The pattern is a regular expression of the ECMA-262 dialect, as JSON Schema recommends, in
    the edition that JSON Schema 2020-12 cites, and it is matched in Unicode mode, which is
    that dialect's `u` flag. It uses only JSON Schema 2020-12, core, section 6.4's
    interoperable tokens (https://json-schema.org/draft/2020-12/json-schema-core#section-6.4):
    individual Unicode characters; simple, range and complemented character classes; simple
    and range quantifiers and their lazy versions; the anchors; grouping and alternation. In
    the standard's notation these are "[abc]", "[a-z]", "[^abc]", "[^a-z]", "+", "*", "?",
    "+?", "*?", "??", "{x}", "{x,y}", "{x,}", "^", "$", "(...)" and "|"; range quantifiers
    also have lazy versions. A backslash before a character that has a meaning in a pattern is
    also allowed, to make that character stand for itself. No other token is allowed.
  observable: >-
    Whether a string matches is what an ECMA-262 regular expression with the `u` flag gives,
    whichever regular-expression library the engine is built with. A character outside the
    Basic Multilingual Plane is one character to a pattern, as it is to `maxLength`. A schema
    written in a contract or a template whose pattern is not such a regular expression or uses
    a token outside this list, such as `[z-a]`, `(?P<x>a)` or the ECMA-262 lookahead `(?=a)`,
    makes the document that holds it rejected under SCH-016, when its package is installed or
    when it is submitted, with a diagnostic naming the pattern and where it appears. The
    request to install reports invalid under PKG-023 with that diagnostic.
  vectors: []

- id: SCH-017
  layer: language
  level: must
  when: >-
    A YAML document contains a number that has no JSON form: an infinity or a not-a-number,
    such as `.inf` or `.nan`, or an integer written in hexadecimal or octal, such as `0x1F` or
    `0o17`.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the value. It is not turned into a decimal number or
    a string.
  vectors: []

# --- Added by the follow-up decisions (plan-audit ruling 33; decision F26 of the re-audit).

- id: SCH-018
  layer: language
  level: must
  when: >-
    Documents are written in a JSON file.
  then: >-
    A file whose value is an array holds the documents that are its items, and a file whose
    value is anything else holds one document, that value.
  observable: >-
    A JSON file that holds an array is read as the documents that are its items, and means the
    same as a YAML file that holds those documents. The order of the items has no meaning, as
    SUB-001 states. Each document is then judged by the schemas, so a value that is not a map,
    whether it is the file's value or an item of its array, is rejected under SUB-005, as a YAML
    document that is not a map is, and the JSON form and the YAML form give the same
    diagnostics, under SCH-013. A JSON manifest that holds an array is rejected under MAN-001.
  vectors: []

# --- Added by the conversion of the older text (decision DA3 of the docs audit; rows GP5 and
# --- GP6 of docs/proposals/docs-audit/GAPS.md).

- id: SCH-019
  layer: language
  level: must
  when: >-
    A schema written in a contract or a template states a `default` that does not satisfy the
    schema that states it, or an input states a `default` that does not satisfy the input's own
    `schema`.
  then: >-
    The document that holds it is rejected: a contract when its package is installed or its
    project is submitted, and a template when it is registered.
  observable: >-
    Installation or resolving returns a diagnostic naming the default and the part of the schema
    it fails. A property declared `{type: integer, minimum: 1, maximum: 100, default: 0}` is
    rejected. So is an input of a template or of a Requirement contract that states `schema:
    {type: integer, minimum: 1}` beside `default: 0`. The `default` of an Operation contract's
    input is the `default` of its property in the contract's `inputSchema`, and is checked as
    any `default` is, against the schema that states it, so a property written there as `{type:
    integer, minimum: 1, default: 0}` is rejected in the same way. Supplying a valid argument on
    every use does not make such a document acceptable. A `default` that is a map is checked
    after the defaults of its own properties are filled in, as SCH-010 fills them: `default: {}`
    is accepted for a schema that requires a property which states a `default` of its own.
  vectors: []

- id: SCH-020
  layer: language
  level: must
  when: >-
    A document contains a number that is not an integer, which is one that has a fractional
    part.
  then: >-
    It is read as an IEEE 754 binary64 value.
  observable: >-
    `0.7` has the value of the binary64 number nearest to it. That value is what a schema checks
    and what SCH-007 compares, so two numbers that are written differently and read as the same
    binary64 value are equal. A number with no fractional part is an integer under SCH-005, and
    SCH-006 gives its range. So is a value read that has no fractional part, and SCH-006 holds it
    to the same range: `0.99999999999999999999` is read as 1, and `1e-400` as 0, and
    `9007199254740993.5`, read as 9,007,199,254,740,994, is rejected under SCH-006.
  vectors: []

- id: SCH-021
  layer: language
  level: must
  when: >-
    A document contains a number that is not an integer and that is outside the range of IEEE
    754 binary64: its magnitude is greater than the largest finite binary64 value.
  then: >-
    The document is rejected.
  observable: >-
    Resolving returns a diagnostic naming the value. It is not read as an infinity and is not
    rounded into the range. An infinity or a not-a-number that is written out is rejected under
    SCH-017, and a number with no fractional part that is outside the range of SCH-006 is
    rejected under SCH-006.
  vectors: []
