# Secrets: how a document marks a secret, which Resources hold one, who may have one read, how
# the engine reads one before a run or a connection, and where the value may and may not go.
# Owner rulings of 2026-11-06: ruling 40 (docs/proposals/ruling-40/README.md), under which
# Conduit innovates only on connection and access, and a store of secrets is a provider behind
# a contract that the user swaps; and ruling 41 (docs/proposals/ruling-41/README.md), which
# accepted the principles review (docs/proposals/principles-review/README.md) as recommended.
# Section 4 of that review reduces the secret type to one shared contract that any store
# implements, and governs where it and the secrets proposal (docs/proposals/secrets/README.md)
# differ; the proposal is the reasoning and the record of the options. Written here: section 4,
# points 1 to 8, and decisions 4a to 4c, 13a, 13b, 19 and the secret side of 25c and 25d. The
# work order is docs/proposals/ruling-41/PLAN.md.
# Standards followed: Kubernetes `secretKeyRef` and Amazon ECS `valueFrom`, which read a secret
# when a workload starts and give it as a variable; External Secrets Operator and Dapr, which
# reach every store through one API, give each kind of store its own typed locator, and read a
# store's own credential from another secret; the MCP Registry's server.json, whose `isSecret`
# marks a value that the client supplies; and the Model Context Protocol's guidance that a
# server reached over stdio takes its credential from its environment.
# The IDs are new. The secrets proposal's drafts SEC-1 to SEC-22 are placeholders, and this
# file does not reuse them. Where each promise comes from: SEC-001 from SEC-1, SEC-002 from
# SEC-2, SEC-003 from SEC-3, SEC-004 from SEC-22, SEC-006 from SEC-12, SEC-008 from SEC-7,
# SEC-009 from SEC-6, SEC-010 to SEC-012 from SEC-16, SEC-015 from SEC-8, SEC-016 from SEC-19,
# SEC-017 and SEC-018 from SEC-10, SEC-019 from SEC-11. SEC-005, SEC-007, SEC-013, SEC-014 and
# SEC-020 come from the review alone: decisions 19, 4b, 25c, 2c and 13a.
# The names `secret-reveal.v1`, `reveal-secret.v1` and `secret-reference.v1` were the review's,
# and were not final until the vocabulary audit that ruling 41 ordered. Ruling 42 accepted its
# names: the capability is `secret-provider.v1` and its operation `get-secret.v1`, and
# `secret-reference.v1` stays.
# No store is built into the engine (decision 13a). A file store that reads `{path}` ships in
# the standard library beside the reference engine, as one implementation of the same
# contract; a store that reads the engine's own variables is not provided.
# The limit of the guarantee is stated in spec/README.md, under "What the guarantee for secrets
# covers", as a statement and not a promise: the machine that the engine runs on and its
# operating-system user, and the place where the chosen runtime provider keeps a run's
# environment, are inside the domain of trust of every secret the engine reads; a value in a
# process's environment is readable by that process, by what it starts, by root and by the
# user's other processes that the kernel admits, and serves every caller of that process
# alike; an Agent's model that can run commands can read its own credential, and only the root
# Interface's choice limits which secret reaches an Agent's process; a copy that a store's
# package keeps is outside the engine; a value that an implementation returns or sends is data
# from then on; and opening a Conduit that lists `get-secret.v1` also trusts the secret's
# locator, which any actor that may register writes. At ruling 41 that section also named
# what the text left open: who may reach a store's server, rotation into a running instance,
# other capabilities of a secret Resource's type, and a run left on a machine reported gone.
# Ruling 42 changed that list, as its line below says.
# What each store package's contract states, and this file does not: the form of its locator
# and the schema that checks it; versions or stages, one key of a structured secret and
# caching, each in the store's own form; how it reaches its store, which is its own credential,
# read under SEC-010, and what else it needs from where it runs, such as a home directory or
# the user's login session, with the limits of unattended use, such as a locked keychain;
# where it must run; and, for the file store, its encoding, a final newline and the largest
# value it reads.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, added SEC-001 to SEC-020. It removed and changed none: the file is new.
# The integration of the rewrite (docs/proposals/ruling-41/log-integration.md) reworded
# SEC-001's last sentence. Its coverage check (the same log, "Coverage check") changed
# SEC-010, SEC-012, SEC-014, SEC-018 and SEC-020, on the engine's own runner, a read that
# fails in a retirement and a value rotated in its store, and this comment, which now says
# "the machine that the engine runs on" where it said "host"; and it added SEC-021, under
# which a value that server.json marks `isSecret` is bound only to a place that
# `secret-reference.v1` governs. Draft: no vector exists yet.
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06) applied the coordinator's
# decisions in docs/proposals/ruling-41/open-decisions.md and the owner's answers D8, D10 and
# D12. It changed SEC-004, SEC-005, SEC-007, SEC-008, SEC-010 to SEC-015 and SEC-017 to
# SEC-020: the record of a reference that did not resolve, the names under which a run's
# `secrets` are given, a place that holds null, the invocation that a read serves, a
# connection made within a retirement and one that lasts until a later setup's connection or
# the end of a retirement, a rotated value, and the variables of the engine's environment that
# its own runner passes, under PRV-023. It added SEC-022, under which a Type that offers
# `secret-reveal.v1` offers no other capability (D10), and SEC-023, under which the engine
# reads again, for the caller of the setup that made a connection, where it no longer holds
# the connection's values, as after it restarts (D12). It removed none. Since then rotation
# into a running instance is a limit that the text states, a secret Resource's type offers no
# other capability, and the stop of a run left on a machine reported gone is asked for once
# more when its instance is unregistered (LIF-036, PRV-021); who may reach a store's server
# waits on the owner's D5. What changed is in docs/proposals/ruling-42/log-secrets.md.
# The names of ruling 42 (the vocabulary audit's N1, N6, N12, N16 and N19; log
# docs/proposals/ruling-42/log-rename-b.md) renamed `secret-reveal.v1` to `secret-provider.v1`,
# and `reveal-secret.v1` to `get-secret.v1`, in SEC-002, SEC-005 to SEC-010, SEC-015, SEC-020
# and SEC-022; the key `arguments` of an implementation item and of `run.v1` to
# `packageArguments` in SEC-006, SEC-010, SEC-020 and SEC-021; the instance that acted for the
# caller to the consumer of the Conduit used in SEC-015; the restrictions of an invocation to
# its filters in SEC-011; and, in this comment, the trust domain of a secret to its domain of
# trust. It removed none and added none.
# The editorial fixes of ruling 42 (the vocabulary audit's E18 and E21; log
# docs/proposals/ruling-42/log-editorial.md) changed SEC-010, SEC-017 and SEC-020, and SEC-022
# in the same way, whose observables say secret Resource, or its implementation, where they
# said store for one; and SEC-001, whose observable calls its rule narrower than OBJ-021, where
# it said stricter. It removed none and added none.
# The verification of ruling 42 (docs/proposals/ruling-42/log-integration.md, "Verification")
# changed SEC-006, whose observable says that no other store is tried, where it said source;
# SEC-013, under which a retirement connects anew where no connection lasts whose values the
# engine holds, and a connection also ends when the instance's node is declared lost; SEC-020,
# whose observable names what DL16 passes in place of the six variables and says that a process
# of the engine's user may still read the engine's environment; and SEC-023, whose observable
# says that a retire hook is not sent on a connection whose values were lost. It removed none
# and added none.
# Ruling 43 (docs/proposals/ruling-43/README.md, 2026-11-06) accepted the proposal on work
# across machines (docs/proposals/multi-machine/README.md), with D5's second part as option b.
# It added SEC-024, under which a header that carries a secret goes only to an `https` URL, or
# to an `http` URL on a loopback host where the engine cannot restart on another machine (D5,
# second part). It changed SEC-006, under which only an enforcement point reaches a secret
# Resource's server, behind the gate of PRV-025 (D5), so that who may reach a store's server no
# longer waits on D5; SEC-010, SEC-011, SEC-012, SEC-014 and SEC-017, under which a provider's
# run that ended with the engine is asked for again, with reads that belong to the setup that
# last asked for it, a second exception to SEC-011 beside SEC-023 (Q3, PRV-026), and SEC-010,
# under which a value reaches another machine only over a confidential channel (PRV-011);
# SEC-013, whose observable cites SEC-024; and SEC-023, which reads again the secret Resources
# that the setup read (X11 of docs/proposals/ruling-42/log-integration.md) and cites SEC-024.
# It removed none. The limit stated in spec/README.md changes with the ruling, as that file
# says. What changed is in docs/proposals/ruling-43/log-secrets.md. The verification of ruling
# 43 (docs/proposals/ruling-43/log-integration.md, "Verification") changed SEC-013, which sends
# a header that carries a secret only where SEC-024 lets it go on the engine as it is
# configured then, so a template registered before the engine was made able to move sends it
# nowhere; SEC-023, whose observable follows; and SEC-024, which reads "can" as configured and
# compares a URL as the Remote writes it.
# The fix pass of the fifth round of the re-audit
# (docs/proposals/reaudit/round-5/log-fix-F1.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-5/DECISIONS.md, which no ruling has accepted, changed SEC-024,
# which also rejects an item that a template selects for `get-secret.v1` at a URL that is
# neither `https` nor `http` on loopback, and any item at a loopback host on an engine that can
# move (M01, M02), is of the layer `convention` (M05), cites the protocol's rule on `http` as
# the protocol states it (M14), and no longer speaks of a host written as a variable (M23);
# SEC-006, under which an implementation of `get-secret.v1` used as plain stands behind no gate
# (M01, M18) and a store declines a read (M19); SEC-010 and SEC-011, under which a provider is
# run again when the part of the engine that held it stops (M09), SEC-010 also writing a
# sequence of credentials (M17); SEC-012, under which a store declines a read (M19); and SEC-013
# and SEC-023, under which the engine holds a connection's values for as long as it lasts, and
# loses them sooner only where it restarts or the part that holds the connection stops (M10). It
# removed none and added none.
# The integration of the fixes of round 5 (docs/proposals/reaudit/round-5/log-fixes.md), on the
# coordinator's decisions in docs/proposals/reaudit/round-5/DECISIONS.md, changed SEC-001, under
# which a `$ref` stands for the schema it leads to (M26). It removed none and added none.

- id: SEC-001
  layer: language
  level: must
  when: >-
    A schema uses the core package's reference schema `secret-reference.v1`, or a value is
    written inside `config` or `arguments` at a place that `secret-reference.v1` governs.
  then: >-
    `secret-reference.v1` governs a place only as the schema of the place itself, as the
    `items` of a list that holds the value, or as a branch of `anyOf` or `oneOf` whose every
    other branch is `{type: null}`, a `$ref` standing for the schema it leads to, under OBJ-021,
    and a schema that puts it under any other applicator, or beside any other branch, is
    rejected. A value at a place that it governs is a secret reference, a reference to a
    Resource, and any other value there, a literal or a bare name among them, makes the document
    that holds it rejected.
  observable: >-
    A string such as `ghp_0123` at such a place fails the schema, and resolving returns a
    diagnostic naming the place and produces no objects. `{kind: Resource, name:
    github-token}` is accepted, and so are a reference to a Pool's entry and, inside a Pool's
    template, an entry reference; the bare name `github-token` is not, as it would be at a
    place that `resource-reference.v1` governs. The resolved form is stored in its place
    under OBJ-009, and `secret-reference.v1` accepts it, as every reference schema does.
    Under `anyOf` with `secret-reference.v1` and `{type: string}`, `ghp_0123` would satisfy
    the second branch and be data under OBJ-021, so such a schema is rejected wherever it is
    read: in a Schema contract, a type's `schema`, a template's input, an Operation
    contract's `inputSchema` or a Requirement contract's input. So is a schema that puts
    `secret-reference.v1` under `allOf`, `not`, `if`, `then`, `else`, `dependentSchemas` or
    `contains`. Under `anyOf` with `{type: null}`, null is accepted and is not a reference.
    A request whose `arguments` hold a literal at such a place does not satisfy its
    operation's `inputSchema`, and reports invalid. This rule is narrower than OBJ-021, under
    which any other reference schema may be a branch beside any other.
  vectors: []

- id: SEC-002
  layer: language
  level: must
  when: >-
    A secret reference resolves to a Resource whose type does not offer the core package's
    capability `secret-provider.v1`.
  then: >-
    The document that holds the reference is rejected.
  observable: >-
    Resolving returns a diagnostic naming the place, the Resource found and the capability
    that was expected, as OBJ-007 names what was expected. A Resource whose type offers
    `secret-provider.v1` is a secret Resource, whatever store its type reads. A template whose
    reference names no object that exists is registered with a diagnostic under OBJ-008, and
    the check is made when it is instantiated, under OBJ-009.
  vectors: []

- id: SEC-003
  layer: language
  level: must not
  when: >-
    A diagnostic is returned about a value written at a place that `secret-reference.v1`
    governs.
  then: >-
    The diagnostic holds the value, or any part of it.
  observable: >-
    The diagnostic names the document, the place, by its JSON Pointer, and the rule broken,
    as IFC-025 gives a diagnostic. Registering a document that writes a known string at such
    a place returns a result in which that string appears nowhere, and no record of the
    registration holds it, under SEC-004.
  vectors: []

- id: SEC-004
  layer: convention
  level: must not
  when: >-
    A record is kept of a request, and what it keeps of the request's inputs holds a value
    at a place that `secret-reference.v1` governs.
  then: >-
    The record holds that value in any form other than the resolved form that OBJ-009
    stores, whatever the `records` of the target's type states.
  observable: >-
    A request that writes `ghp_0123` at such a place reports invalid, and its record names the
    place and the rule broken, as SEC-003 has a diagnostic do, and holds no part of the string,
    although the type's `records` keeps inputs. A reference that resolved is kept in its
    resolved form. Where a reference did not resolve, the record holds no part of it, names the
    place and says that the reference did not resolve. This is an exception to the content that
    REC-002 has a record keep where the type's `records` keeps inputs.
  vectors: []

- id: SEC-005
  layer: language
  level: must
  when: >-
    A Type contract offers the core package's capability `secret-provider.v1`.
  then: >-
    It lists no control. A Type contract that offers `secret-provider.v1` and lists one under
    `controls` is rejected when its package is installed or its project is submitted.
  observable: >-
    Resolving returns a diagnostic naming the type and the control. With no control, nothing
    changes a secret Resource's configuration once it is made, so the locator that a Conduit to
    it leads to is fixed, and only the root Interface's choice of which secret Resource that
    Conduit's target is decides what a reader receives, under SEC-008. A secret that is to be
    located elsewhere is a new secret Resource, read through a new Conduit; a value that the
    store changes at the same locator is read at the next run, under SEC-014. Each kind of store
    is its own Type, whose `schema` states the form of its locator, and under PRV-001 it is of
    the family Resource, and under SEC-022 it offers no other capability. The capability lists
    one operation, `get-secret.v1`, which has no inputs, gives its value in the output
    `value`, a string, and states no `effect`.
  vectors: []

- id: SEC-006
  layer: interface
  level: must
  when: >-
    An implementation of `get-secret.v1` serves a read for a secret Resource.
  then: >-
    It takes the value only from the store that the locator in that Resource's configuration
    names, never from the configuration itself and never from any other store, and where it
    cannot read that store it answers with the outcome failed and no value.
  observable: >-
    A secret Resource whose configuration holds a string in place of a locator yields no value.
    A missing file, a locked keychain or a store that declines the read gives the outcome
    failed, with a message that says the store could not be read and holds no value, and no
    other store is tried. A locator that names a version or a stage that the store does not have
    gives failed in the same way, and no other version is read. `get-secret.v1` has no inputs:
    the implementation learns the locator as any implementation learns its instance's
    configuration, in the configuration that IFC-006 sends with every request to an
    implementation that carries Conduit's keys, or, for a plain implementation, through the
    `environment`, `packageArguments` or `headers` of its item, under MAN-010. Under PRV-025
    nothing but an enforcement point, apart from what that promise excepts, reaches the server
    of a secret Resource that a runtime provider other than the engine's own runner runs, or one
    reached by `remote` that carries Conduit's keys, so nothing else on the network can send it
    a locator of its own choosing; an implementation of `get-secret.v1` reached by `remote` that
    cannot check an enforcement point's proof is used as plain, stands behind no gate, and can
    be sent a locator of its own choosing by whatever reaches its URL, which SEC-024 keeps to an
    `https` URL, or to loopback on an engine that can neither restart on another machine nor run
    as several parts. Whether it reads its store at each read or answers from a copy it keeps is
    its package's contract, and a value from such a copy is one that its store gave it. This
    binds the implementation at the Implementation level.
  vectors: []

- id: SEC-007
  layer: convention
  level: must
  when: >-
    An instance sends a request for `get-secret.v1`: an actor on its own behalf, or any
    instance as an onward request.
  then: >-
    The request is not dispatched, and reports refused, whatever Conduit lists the operation
    and whoever its caller is, the root Interface included.
  observable: >-
    The engine presents no tool for `get-secret.v1`, under IFC-012, so a call for it is answered
    as IFC-012 answers a call to a tool that the engine does not present, with the reason
    refused, and is recorded as refused under REC-001. The secret Resource's implementation
    receives no call. The refusal holds although an open Conduit lists the operation: it is the
    exception that ACC-003 states to what an open Conduit permits. The only requests for
    `get-secret.v1` that are dispatched are the engine's reads, under SEC-010,
    SEC-013 and SEC-023, which no instance sends.
  vectors: []

- id: SEC-008
  layer: convention
  level: must
  when: >-
    A request is made to open a Conduit that lists `get-secret.v1`.
  then: >-
    It is dispatched only where the root Interface sent it on its own behalf and the
    Conduit's consumer is a Resource or an Agent. Otherwise it is not dispatched, and reports
    refused.
  observable: >-
    A request from any other actor reports refused, whatever the bound of its Conduit to
    `access`, and so do an onward request that serves the root Interface and a request of the
    root Interface itself where the consumer is an Interface. The Conduit's state is still
    registered. The part of a setup that opens such a declared Conduit is a request of the
    instance that sent the setup, under ACC-005 and POOL-015, so the Conduit is opened at setup
    only where the root Interface sent the setup. ACC-032 refuses the opening of a Conduit that
    lists an operation reserved to the root Interface in the same way, and no bound passes this
    right on. The open Conduits that list `get-secret.v1` are the only list of the instances
    for which a secret is read: no other is kept. Such a Conduit permits no request that its
    consumer sends, under SEC-007; the engine's reads for its consumer go through it, under
    SEC-010, SEC-013 and SEC-023.
  vectors: []

- id: SEC-009
  layer: language
  level: must
  when: >-
    A Conduit is instantiated that lists `get-secret.v1` and whose consumer is an
    Interface.
  then: >-
    The Conduit is not instantiated.
  observable: >-
    Resolving returns a diagnostic naming the Conduit, its consumer and the operation, as
    CON-021 has one name what it checks. This holds for a Conduit instance document and for
    a Conduit that an Interface template declares. A Resource or an Agent may be the consumer
    of such a Conduit, which is opened only under SEC-008.
  vectors: []

- id: SEC-010
  layer: convention
  level: must
  when: >-
    The engine is to ask a runtime provider for a run, under PRV-007, or its own runner for a
    provider's run again, under PRV-026, of an item whose `environment` or `packageArguments`
    has a pointer that leads to a place that `secret-reference.v1` governs in the instance's
    configuration.
  then: >-
    Before it asks, it reads each secret Resource that such a place refers to, by a request for
    `get-secret.v1` through the instance's own open Conduit to that Resource that lists the
    operation, and it passes each value read in the run's `secrets`, under the name of each
    variable and of each argument whose pointer leads to that place, in place of the resolved
    form that the configuration holds at that place. Where the engine's own runner runs the
    item, that runner delivers each value itself, under PRV-003 and PRV-011.
  observable: >-
    Every run that the engine asks for, in a setup or, where the retire hook is to be
    dispatched, in a retirement under TPL-018, or again for a provider under PRV-026, is
    preceded by reads of its own, under SEC-017. A read is a request and not a provider call,
    under PRV-005: it is decided through that one Conduit and recorded under REC-001. Where the
    instance is the consumer of no open Conduit to that Resource that lists `get-secret.v1`, or
    of more than one, the read reports refused, and SEC-012 applies. Within a setup the run is
    asked for only once the declared Conduits are open, under TPL-012, so a declared Conduit to
    the secret Resource is open before the read. A place that holds null under a branch
    `{type: null}` refers to no secret Resource: nothing is read for it, and the variable or the
    argument for it is left out, under PRV-007. The runtime provider delivers each value as the
    variable or the argument under whose name it is given, and carries it to another machine
    only over a channel that authenticates that machine and keeps the value confidential, under
    PRV-011. A store's own credential, such as the token that a vault's client needs, is such a
    secret: the item of the secret Resource that reads that store points to it under
    `environment`, and it is read for that Resource's run through the Resource's own open
    Conduit to the Resource of that credential. A sequence of such credentials ends at a secret
    Resource whose item points to no secret, such as one that reads a file or a keychain.
  vectors: []

- id: SEC-011
  layer: convention
  level: must
  when: >-
    The engine makes a read under SEC-010, SEC-013 or SEC-023.
  then: >-
    The read belongs to the invocation within which the engine asks for the run or makes the
    connection: the setup of the instance, or its retirement where that asks for the run, or
    makes the connection, to serve its retire hook under TPL-018; a read under SEC-023 belongs
    to the setup that made the connection; and a read for a provider's run that the engine asks
    its own runner for again under PRV-026 belongs to the setup that last asked for that
    provider's run. It has that invocation's caller as its caller, is decided by the instance's
    own Conduit to the secret Resource and the filters on that Conduit alone, and carries none
    of the filters of that invocation or of its chain.
  observable: >-
    The record of the read names the invocation it belongs to, as the invocation it serves, and
    that invocation's caller, under REC-002 and SEC-015. Where the instance is set up as a part
    of a Pool's setup, under POOL-013, the read belongs to that setup in the same way. A filter
    on the Conduit through which the setup or the retirement was dispatched, or one that it
    carries under ACC-017, neither makes the read refused or unavailable nor is sent with it:
    the filters that the secret Resource's implementation receives under IFC-018 are those of
    the instance's own Conduit alone, so who set the instance up does not change what
    it reads. A read through a Conduit whose consumer is retired is permitted only where it
    belongs to that consumer's retirement, under ACC-039. Apart from the run of a provider that
    PRV-026 asks for again once the engine has restarted, or a part of it has stopped, the
    engine asks for a run, and connects to a `remote` item, only within such an invocation, and
    a restart that a runtime provider makes on its own makes no read, under PRV-010, so every
    read has a caller. A read under SEC-023, and one for a run under PRV-026, belongs to a setup
    that may have ended, and is decided by the Conduit and its filters as they stand when the
    read is made: these are the two reads that ACC-019 lets the engine make once the invocation
    they belong to has ended.
  vectors: []

- id: SEC-012
  layer: convention
  level: must
  when: >-
    A read that the engine makes under SEC-010, SEC-013 or SEC-023 does not succeed: it ends
    with a reason, or with the outcome failed or unknown.
  then: >-
    The engine asks for no run, makes no connection and sends no HTTP request on a connection,
    for which that read was made, and a request that was to be dispatched to the instance's
    implementation is not dispatched and reports unavailable.
  observable: >-
    In a setup, the part that would ask for the run or make the connection reports unavailable,
    as PRV-007 has it report where the runtime provider is not ready, and no later part is
    begun, under TPL-012; a connection that lasts from an earlier setup is kept, under SEC-013.
    In a retirement, the retire hook that the run or the connection was to serve is not
    dispatched and its part reports unavailable, and the stop is asked for all the same, under
    TPL-009 and TPL-018. Where the read was made under SEC-023, the request that was to be sent
    on the connection is not dispatched and reports unavailable, and the engine reads again
    before the next. Where it was made for a provider's run under PRV-026, the provider is not
    run, the provider call that needed it is not dispatched, as where the provider is not ready,
    and the engine reads again before the next such call. The values of the reads that did
    succeed for that run or that connection are passed nowhere, under SEC-018. The setup or the
    retirement ends as OPS-022 counts its parts, and a further one reads again. A read ends so
    where the instance's Conduit to the secret Resource has been closed, where a keychain is
    locked and where the store declines the read. The record of the read says how it ended,
    under REC-001.
  vectors: []

- id: SEC-013
  layer: convention
  level: must
  when: >-
    The engine connects to a `remote` item to serve an instance, within the instance's setup, or
    within its retirement where that is to dispatch its retire hook to the item and no
    connection to it lasts whose values the engine holds, under TPL-018, and the item's
    `headers` has a pointer that leads to a place that `secret-reference.v1` governs in the
    instance's configuration.
  then: >-
    Before it connects, it reads each secret Resource that such a place refers to, as SEC-010
    reads one for a run, and it sends each value only as the header whose pointer leads to its
    place, only to the item's URL, and only where SEC-024 lets a header that carries a secret go
    on the engine as it is configured then, and holds it for as long as the connection lasts and
    no longer: until a later setup's connection takes its place, the instance's retirement ends,
    or the instance's node is declared lost. It loses the value sooner only where the engine
    restarts, or the part of it that holds the connection stops, under DL17. Where SEC-024 does
    not let it go there, it reads nothing, makes no connection, and the part reports
    unavailable.
  observable: >-
    IFC-041 sends each header that `headers` names on every HTTP request of the connection, with
    the value read here in place of the reference. The baseline revision of the protocol keeps
    no session over Streamable HTTP and carries authorization in every HTTP request, so a
    connection is the engine's holding of these values, and an HTTP request that fails does not
    end it. The value goes in no request to any other URL, an HTTP redirect to another URL among
    them, and once the connection has ended the engine holds no copy of it, under SEC-017. A
    template whose item would send one to any other URL is rejected when it is registered,
    under SEC-024; where the engine has since been made able to restart on another machine or
    run as several parts, an `http` URL is no longer one to which it goes, so a template
    registered before then sends it nowhere, and the record of the part says why. A further
    setup connects again and reads again: where that read does not succeed, no connection is
    made and the part reports as SEC-012 says, the connection that lasts is kept, and closing
    the reading Conduit recalls nothing, as SEC-014 has it for a run. The engine reads nothing
    to connect outside a setup or a retirement, under SEC-011. Where it no longer holds the
    values of a connection that lasts, as after it restarts, it reads again under SEC-023 before
    an HTTP request on it, and a retirement that is to send its retire hook to the item connects
    anew instead, under TPL-018. A declaration that the instance's node is lost retires it at
    once and dispatches nothing to it, under PLC-017, PLC-024 and PLC-027, so the engine holds
    no value for a connection on which nothing can be sent again.
  vectors: []

- id: SEC-014
  layer: convention
  level: must
  when: >-
    The engine has passed a value that it read in the `secrets` of a run, under SEC-010.
  then: >-
    The value is fixed for the life of that run: the engine reads nothing more for it, a
    restart that its runtime provider makes under PRV-010 reuses the value that the provider
    holds, and closing the Conduit that it was read through recalls nothing.
  observable: >-
    A value changed in the store after the read reaches the instance's implementation only in a
    later run that the engine asks for, under PRV-007; the engine stops or restarts no run
    because a value changed. No operation ends the run of an instance that is ready, so through
    Conduit alone a rotated value reaches a running instance only in another instance made in
    its place, and retiring the one it replaces closes the Conduits of which that one is an end,
    under CON-008. Once the run has ended, a further setup asks for another, with reads of its
    own, under PRV-007 and OBS-004, and so does the engine for a provider's run that ended with
    the engine, under PRV-026. Closing the Conduit ends every later read through it, under
    ACC-011, and leaves the run with the value, as closing recalls no copy that a reader made.
    Where the runtime provider keeps the value is stated in its contract, under PRV-011.
  vectors: []

- id: SEC-015
  layer: convention
  level: must not
  when: >-
    A record is kept of a read, under REC-001.
  then: >-
    The record holds the value read, or any part of it, whatever the `records` of the
    secret Resource's type states.
  observable: >-
    Every read is recorded as a request, whether or not it succeeds. Its record holds what
    REC-002 lists: the caller that SEC-011 gives the read, the Conduit it went through and the
    consumer of that Conduit, which is the instance it was read for, the secret Resource as the
    target, `get-secret.v1` as the operation, the engine's ID for the read as its invocation
    and the setup or the retirement it belongs to as the invocation it serves, the time and how
    it ended. With a known value in the store, no record that the engine keeps or exports holds
    it.
  vectors: []

- id: SEC-016
  layer: convention
  level: must
  when: >-
    A read would be dispatched, and the record of its dispatch cannot be kept.
  then: >-
    It is not dispatched, and reports unavailable.
  observable: >-
    No value is read without a record of the read under REC-001, and the run or the
    connection that it was for is then not asked for or made, under SEC-012. How the engine
    behaves for other requests when its storage is exhausted is DL10.
  vectors: []

- id: SEC-017
  layer: convention
  level: must not
  when: >-
    The engine has read a value, under SEC-010, SEC-013 or SEC-023.
  then: >-
    It keeps the value, or a copy of it, to stand in for a later read.
  observable: >-
    Each run that the engine asks for, and each connection that it makes, is preceded by reads
    of its own, each a request with its own access decision and record, even where the same
    secret Resource was read a moment before. Nothing that the engine keeps across a restart
    holds the value: once it has restarted, it reads again under SEC-023 for a connection that
    lasts, and under PRV-026 before it runs a provider again. With a value changed in the store
    between two runs, and a secret Resource whose implementation keeps no copy, the second run
    is passed the new value, with no revision advanced, no control requested and nothing changed
    in the secret Resource. Whether a secret Resource's implementation reads its store at each
    read or answers from a copy that it keeps is that implementation's, as its package's
    contract states.
  vectors: []

- id: SEC-018
  layer: convention
  level: must not
  when: >-
    The engine has read a value, under SEC-010, SEC-013 or SEC-023.
  then: >-
    It puts the value, or any part of it, anywhere other than the `secrets` of the run it was
    read for, the variable or the argument that the engine's own runner gives the process it
    starts for that run, under PRV-003 and PRV-011, or the header that it sends on the
    connection it was read for, under SEC-013 and SEC-023: in an inspection result, an
    observation, a diagnostic, a record, any result, or the `_meta` of any request.
  observable: >-
    With a known value in the store, the value is found in the `secrets` of the one provider
    call to `run.v1` for that run, or, on the engine's own runner, in the process it starts, or
    in the header of the one connection, and in nothing that inspecting, reading records or any
    result returns, of the read, of the run or of the instance. The result of the read reaches
    the engine and no instance. The record of the provider call to `run.v1` holds no value of
    `secrets`, whatever the runtime provider's type states under `records`, and the
    configuration that IFC-006 sends holds only the secret reference. The engine's own runner is
    part of the engine, so this binds it too: the process it starts is the one place where it
    keeps the value, which is what PRV-011 has a runtime provider's contract state. This binds
    what the engine makes of the read: what a runtime provider does with the value is PRV-011,
    what an implementation does with it is SEC-019, and a value that an implementation later
    sends is data from then on, which the engine cannot tell from any other.
  vectors: []

- id: SEC-019
  layer: interface
  level: must not
  when: >-
    An implementation that carries Conduit's keys has been given a value read under SEC-010,
    SEC-013 or SEC-023, as a variable, an argument or a header.
  then: >-
    It puts the value, or any part of it, into a result, a diagnostic, or the `arguments` or
    `_meta` of a request that it sends to the engine.
  observable: >-
    With a known value in the store, no result that the implementation returns, and no
    request that it sends to the engine, holds the value. It may use the value toward the
    service outside that it is for. This binds the implementation at the Implementation
    level, as IFC-031 does: the engine cannot check what an implementation does with a value
    outside the engine.
  vectors: []

- id: SEC-020
  layer: convention
  level: must not
  when: >-
    A secret is read, or the engine asks a runtime provider for a run.
  then: >-
    The engine serves `get-secret.v1` itself, for any secret Resource, or passes to the
    run, in its `environment`, `packageArguments` or `secrets`, a value taken from a variable of
    the engine's own environment.
  observable: >-
    The core package's implementation `engine` implements no operation of `secret-provider.v1`,
    under MAN-012, and no store is built into the engine: each is reached by a package's
    implementation of the same contract, one that reads a file among them. The engine passes no
    token that the user has exported in the engine's environment to any run, in its
    `environment`, `packageArguments` or `secrets`, until it is kept in a store that a secret
    Resource locates. What else a run's process receives from where it runs, such as a home
    directory or the user's login session that a secret Resource's implementation needs, is not
    this promise's: for a runtime provider it is the provider's, as its contract states, and the
    engine's own runner passes the process it starts, of the engine's environment, only the
    variables `HOME`, `LOGNAME`, `PATH`, `SHELL`, `TERM` and `USER`, or those that DL16 names in
    their place, and those that a list set on the runner names, under PRV-023, and what the item
    binds wins over them. The runner so passes a token exported in the engine's environment to
    such a process only where that list names it, although a process that runs as the engine's
    operating-system user may read the engine's environment where the kernel admits it.
  vectors: []

# --- Added by the coverage check of ruling 41 (docs/proposals/ruling-41/log-integration.md,
# --- "Coverage check"): section 4, point 1 of the principles review, with decision 25d, under
# --- which a place that `secret-reference.v1` governs is what server.json marks `isSecret`.

- id: SEC-021
  layer: language
  level: must
  when: >-
    A template selects an implementation item, by its `implementation` map or by default,
    whose `environment`, `packageArguments` or `headers` binds a variable, an argument or a
    header that its Package or its Remote marks `isSecret: true` to a place in the configuration
    that `secret-reference.v1` does not govern.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the item, the name and the pointer. A value that the
    Package or the Remote declares a secret is so always read from a store, under SEC-010 or
    SEC-013, and never written in a document, under SEC-001: bound to a place whose schema is
    `{type: string}`, a token would be stored, shown on inspection and recorded as it was
    written. The check is made when the template is registered, against the type's schema and
    the item as the template holds them under NAM-009, as MAN-017's is. A name that is not so
    marked may be bound to a place that `secret-reference.v1` governs, and a `command` item,
    which declares no names, is not covered.
  vectors: []

# --- Added by ruling 42 (docs/proposals/ruling-42/README.md): SEC-022 is the owner's answer
# --- D10, and SEC-023 the owner's answer D12, of docs/proposals/ruling-41/open-decisions.md.

- id: SEC-022
  layer: language
  level: must
  when: >-
    A Type contract offers the core package's capability `secret-provider.v1`.
  then: >-
    It offers no other capability. A Type contract that offers `secret-provider.v1` and another
    capability is rejected when its package is installed or its project is submitted.
  observable: >-
    Installation or submission returns a diagnostic naming the type and the capabilities, as
    PRV-001 has one name them. A Conduit to a secret Resource therefore lists no operation but
    `get-secret.v1`, under CON-017 and CON-021, and an instance's request for that operation
    is refused, under SEC-007, so no request that an actor sends is dispatched to the secret
    Resource's implementation. A store package that lists or writes secrets does so through
    another Type, whose Resources are not secret Resources. The type may still require a setup
    hook or a retire hook and state its default, under TPL-004: a hook is an operation that the
    type requires, not a capability that it offers, and the engine dispatches it to the secret
    Resource's implementation through no Conduit, under TPL-017 and TPL-018. PRV-001 already
    excludes a second provider capability; this rule also excludes every capability that is not
    a provider's.
  vectors: []

- id: SEC-023
  layer: convention
  level: must
  when: >-
    A connection to a `remote` item lasts, under SEC-013, the item's `headers` has a pointer
    that leads to a place that `secret-reference.v1` governs, and the engine no longer holds the
    values read for the connection, as after the engine restarts, on its machine or on another,
    or the part of it that held the connection stops, under SEC-013.
  then: >-
    Before it sends an HTTP request on the connection, the engine reads again, as SEC-013 reads
    one, each secret Resource that the setup that made the connection read for one of its
    headers, for the caller of that setup, decided by the instance's own Conduit to that
    Resource and the filters on that Conduit as they stand when the read is made; and it sends
    and holds each value as SEC-013 does.
  observable: >-
    A connection made within a retirement ends with it, and an invocation in progress when the
    engine restarts has the outcome unknown, under IMP-007, so every connection that lasts
    across a restart was made by a setup. The read is a request with its own access decision and
    record, under SEC-011 and SEC-015: its record names that setup as the invocation it serves,
    and that setup's caller as its caller, although that setup may have ended. Nothing is kept
    across the restart to stand in for it, under SEC-017: the engine keeps, with the connection,
    which secret Resource the setup read for each header, as state that holds no value, so a
    restart changes nothing that the connection carries, and a place in the configuration that a
    control has changed since is read at the connection of a later setup, under SEC-013, as it
    is where the engine holds the values. SEC-013 sends a header that carries a secret to an
    `http` URL only on an engine that, as configured, can neither restart on another machine
    nor run as several parts, under SEC-024, so a read again after a restart on another machine
    never sends a secret over `http`: on an engine configured so after the template was
    registered, nothing is read, and the request that was to be sent is not dispatched and
    reports unavailable. Where the instance's Conduit to the secret Resource has been closed, or
    a filter on it now refuses the read, the read does not succeed, and the request that was to
    be sent is not dispatched and reports unavailable, under SEC-012. A further setup connects
    anew under SEC-013, and its reads take the place of these. A retire hook is not sent on such
    a connection: the retirement connects anew, with reads that belong to it, under TPL-018 and
    SEC-013, so no read under this promise is made for a retire hook. A connection whose
    `headers` points to no secret needs no read.
  vectors: []

# --- Added by ruling 43 (docs/proposals/ruling-43/README.md): SEC-024 is D5's second part of
# --- docs/proposals/multi-machine/README.md, as the ruling revised it to option b.

- id: SEC-024
  layer: convention
  level: must
  when: >-
    A template selects an implementation item reached by `remote`, by its `implementation` map
    or by default, and either the host of its Remote's URL is `localhost`, an IPv4 address in
    `127.0.0.0/8` or `[::1]`, the IPv6 address `::1`, on an engine that, as configured, can
    restart on another machine or run as several parts, as its conformance document states under
    DL17; or the item's `headers` binds a header to a place that `secret-reference.v1` governs,
    or the template selects the item for `get-secret.v1`, and its Remote's URL is neither an
    `https` URL nor an `http` URL whose host is one of those.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the item, the URL and, where the item binds one, the
    header that carries a secret. A header that carries a secret, under SEC-013 and SEC-023, and
    the value that an implementation of `get-secret.v1` reached by `remote` returns, under
    SEC-010, so cross only `https`, or `http` to the machine the engine runs on where the engine
    never runs on another: OAuth 2.1 has every URL of a resource server use `https`, and leaves
    `http` to loopback redirect URIs alone, and the Model Context Protocol has every endpoint of
    an authorization server served over `https`, and allows `http` only for a redirect URI on
    `localhost`. An engine that can restart on another machine, or run as several parts, rejects
    every item at a loopback host, whatever its headers: where it runs on another machine, it
    would send the item's requests, with the caller's arguments and a secret that SEC-023 reads
    again, to whatever listens there, and take what that answers as the item's results. On such
    an engine a local server runs as a `command` or `package` item on the engine's own runner,
    over stdio, which needs no header. The scheme and the host are compared without regard to
    case, as RFC 3986 has them, and no other host counts, `localhost.example.com` and a name
    that resolves to a loopback address among them. The URL is compared as the Remote writes it.
    Whether the engine can restart on another machine or run as several parts is how it is
    configured, as its conformance document states, so the same engine configured otherwise
    accepts the template, and the rule is of the layer `convention`: the Language level, which
    has no conformance document, does not apply it. An engine configured so after the template
    was registered connects to no item at a loopback host, under IFC-041, and sends a header
    that carries a secret to no `http` URL, under SEC-013. An item that is not plain stands only
    at an `https` URL, under IFC-044, so the `http` URL on loopback serves a plain item alone.
    The check is made when the template is registered, against the type's schema and the item as
    the template holds them under NAM-009, as SEC-021's is. What the engine presents to a
    `remote` item that is not plain, and over which scheme, is IFC-041's and PRV-025's.
  vectors: []
