- id: SUB-001
  layer: language
  level: must
  when: >-
    Several documents are submitted together.
  then: >-
    They are treated as a set. The order in which they appear, within a file or across files,
    has no meaning.
  observable: >-
    Submitting the same documents in any order gives the same result: the same objects, or the
    same diagnostics.
  vectors: []

- id: SUB-002
  layer: language
  level: must
  when: >-
    A document in a submission refers to an object that another document in the same
    submission makes.
  then: >-
    The reference resolves to that object, exactly as it would to an object that already
    exists.
  observable: >-
    An instance and the template it comes from can be submitted together, and so can a Conduit
    and the instances it names. The result is the same as submitting them one after another in
    a workable order.
  vectors: []

- id: SUB-003
  layer: language
  level: must
  when: >-
    Any document in a submission is rejected.
  then: >-
    Nothing in the submission is registered.
  observable: >-
    After a rejected submission the objects that exist are exactly those that existed before
    it. The diagnostics name each rejected document.
  vectors: []

- id: SUB-004
  layer: language
  level: must
  when: >-
    Two documents in a submission would make objects with the same kind and name.
  then: >-
    The submission is rejected.
  observable: >-
    The diagnostic names both documents, and nothing is registered.
  vectors: []

- id: SUB-005
  layer: language
  level: must
  when: >-
    A submission contains something that is not a template, an instance, a contract or the
    project's one manifest.
  then: >-
    The submission is rejected.
  observable: >-
    The diagnostic names the item, and nothing is registered. The documents and the one manifest
    that are handed over together in one registration are one project, and a directory is one
    way to hand them over. Where a directory is submitted, what is read is the files in the
    directory itself whose names end in `.yaml`, `.yml` or `.json`, the manifest among them, as
    MAN-001 and MAN-011 state. Nothing below the directory is read, and a file with any other
    ending is not read, so neither is part of the submission. Every engine takes a directory,
    under SUB-010. An engine that is handed files applies the rules on a file when it reads
    them: which files are read, under MAN-001, MAN-002 and MAN-011, and their syntax, under
    SCH-012, SCH-017 and SCH-018. Where a registration hands the documents over as values, as
    the input `documents` of `register.v1` does, no file is in front of the engine and those
    rules have nothing to check; every other rule applies to the values.
  vectors: []

- id: SUB-006
  layer: language
  level: must
  when: >-
    A submission is accepted.
  then: >-
    Its templates and instances are registered, and its contracts are made available under
    SUB-008. Nothing else happens.
  observable: >-
    After an accepted submission the new objects are those its documents make, and each new
    instance is as INS-016 leaves it.
  vectors: []

- id: SUB-007
  layer: language
  level: must
  when: >-
    A document is submitted.
  then: >-
    It never replaces a template.
  observable: >-
    A document submitted under the kind and name of an existing template is rejected under
    OBJ-002, and the template and its revision are unchanged. A template is replaced only by the
    operation that SUB-009 names.
  vectors: []

# --- Added by consolidation pass 1 (plan-audit ruling 32).

- id: SUB-008
  layer: language
  level: must
  when: >-
    A submission contains contract documents, or its manifest lists implementations.
  then: >-
    The contracts and the implementations are made available to the documents of that project,
    which are the documents handed over in the same registration, as `#name`, and are not
    registered. Elsewhere, on the wire and in a bound, each is named `address#name`, with the
    address that the project's manifest states under MAN-015. The engine identifies the
    contracts and implementations of each submission by a digest. The digest is the SHA-256,
    written as PKG-004 writes a digest, of the JSON Canonicalization Scheme form, RFC 8785, of
    one map with two members: `documents`, a list of the project's contract documents ordered by
    `kind` and then by `metadata.name`, each compared by the bytes of its UTF-8 string, and
    `manifest`, the project's manifest as it was handed over, before any relative `fetch` and
    any program given as a relative path is resolved.
  observable: >-
    A document of the same submitted project can refer to such a contract as `#name` under
    NAM-022. No object exists for the contract after the submission, and no document outside the
    project selects it: no package can be installed at its address while a template or an
    instance holds a submission at it, under PKG-029, and no project can be submitted at the
    address of an installed package, under MAN-016, so no manifest can list that address under
    NAM-007 and PKG-006 for the project's contracts. Two submissions may state one address,
    whether one project is submitted again or two projects state it: each is told apart by its
    digest, which every template that resolved against it keeps under NAM-009, so a template and
    its instances reach only their own submission; where two submissions share a digest, read
    from two directories, each template also keeps the items it selects as its own registration
    resolved them, under NAM-009. On the wire, in records and in the
    `operations` of a bound, an operation is `address#name` whichever submission holds it, as in
    every version of one package, so a record does not tell the submissions apart, an
    implementation tells requests apart by the instance that IFC-006 names, and a bound covers
    the operation in every submission at that address, under ACC-029. Outside the project's
    documents it is named `address#name`: in Conduit's keys under IFC-006 and IFC-018, in the
    `operations` of a bound under ACC-029, and where inspecting names an implementation under
    ACC-038. A template registered by the submission keeps the address and that digest under
    NAM-009, as it keeps the version and digest of any package, so the contracts it resolved
    against stay available to it and to its instances. Two submissions whose contract documents
    and manifest are equal under SCH-007 give the same digest, however their files are written
    and from whatever directory they are read: a relative `fetch` or program is hashed as the
    manifest writes it, and not as SUB-010 resolves it against the directory. The manifest is
    part of the digest because it fixes what the contracts' references to other packages mean.
    Ordered by the bytes of their UTF-8 strings, the kinds stand `Capability`, `Operation`,
    `Requirement`, `Schema`, `Type`, and the name `a.v10` stands before `a.v2`. A project whose
    manifest lists implementations and that has no contract document has a digest too, with an
    empty `documents` list. A contract that needs a package which is not installed, such as a
    Type that offers a capability of that package or a schema with a `$ref` into it, makes the
    registration rejected under PKG-006, since every package it needs is listed in the manifest
    under NAM-007; so every check on the contract, such as those of CTR-006 and SCH-015, is made
    when the project is submitted.
  vectors: []

# --- Added by the second round of the re-audit (docs/proposals/reaudit/round-2/DECISIONS.md;
# --- finding R1-5.1). It is of the layer `convention`.

- id: SUB-009
  layer: convention
  level: must
  when: >-
    A template is replaced.
  then: >-
    It is done by the operation `replace.v1`, which names the template's current revision and
    gives the document that takes its place, a template of the same kind and name, with the
    project that the document belongs to, handed over with it: the contract documents of that
    project, as the input `contracts`, and its manifest, as the input `manifest`. The engine
    resolves the document against that project as a registration resolves a template against its
    own: the project's contracts and implementations are made available to the document and to
    each other as SUB-008 states, identified by the digest that SUB-008 takes of them, the rules
    on the manifest of a submitted project apply to its manifest, and the template as replaced
    keeps what it resolved through as NAM-009 states for a template that is registered. A
    request whose document, contracts or manifest is rejected, or whose document is of another
    kind or name than the template, is not dispatched, and reports invalid. The output
    `revision` of the request is the template's revision after it. A request that leaves the
    template as it was, because its document is equal to the template as stored and the template
    would keep under NAM-009 exactly what it keeps, changes nothing, does not advance the
    revision and has the outcome succeeded: its `revision` is the one the template had.
  observable: >-
    After a replace that changed the template, its revision has advanced, under REV-003. One
    whose document is equal, under SCH-007, to the template as stored, through which every
    package that the document refers to, and the project handed over with it where the document
    refers to that project, has the address, the version and the digest that the template keeps
    for it under NAM-009, and through which each implementation item that the document selects
    is the one the template keeps, is decided like any other and stores no change, so REV-004
    keeps the revision as it was. An equal document handed over with a project whose digest
    differs, where the document refers to that project, or with a manifest that gives a package
    another version or digest, is a change: the template as replaced keeps the new ones, and the
    revision advances. A reference written `#name` in the replacing document reaches the
    contracts and the implementations of the project handed over with it, under NAM-022, and
    never those of the project that the template held before: a document whose `#name` names
    nothing handed over is rejected under NAM-028, and one that refers to a package other than
    the core package where no manifest is handed over is rejected under NAM-007. So a contract,
    an implementation item and a template edited together reach the instances made after the
    replace, which come from the template as replaced, and the instances made before it keep
    what they resolved, the contracts and the implementations of the project their template held
    among them, as INS-020 and PKG-005 state. The manifest is held to the rules of a
    registration's: one that lists a package that is not installed at the version and digest it
    gives is rejected under PKG-006, one whose project holds a contract or lists an
    implementation and that states no `address` under MAN-015, and one whose `address` is that
    of an installed package under MAN-016, and no package can be installed at that address while
    the template holds the project's contracts or implementations, under PKG-029. The manifest
    is handed over as a value, with no directory, so an item of `packages` whose `fetch` is
    relative, and an implementation item whose program is a relative path, are rejected under
    MAN-006 and MAN-010. The request replaces one template and registers nothing, and never
    replaces several together: `contracts` holds contract documents alone, so another template
    is replaced by a request of its own and an instance is registered by `register.v1`. A
    request that names a revision that is not current reports conflict under REV-002, and one
    that names none reports invalid under REV-011. The request is authorized against
    `management`, under ACC-033. What `#name` written as `from` reaches in a nested
    instantiation is NAM-022. The result of a request that reports invalid carries the
    diagnostics, as IFC-025 states.
  vectors: []

# --- Added by the last pass of the second round of the re-audit
# --- (docs/proposals/reaudit/round-2/log-tail.md; decision 13 of "The closing pass, and what it
# --- left" in DECISIONS.md).

- id: SUB-010
  layer: language
  level: must
  when: >-
    An engine is handed a directory to register.
  then: >-
    It takes the directory. It reads the directory as MAN-001 and MAN-011 state, and registers
    what it reads as one submission, with the same result as a request for `register.v1` that is
    given the values read, once each relative `fetch` and each program given as a relative path
    is resolved against the directory, save that a program so resolved is still, under PRV-007,
    one given as a relative path. It installs no package. The digest that identifies the
    project's contracts is taken as SUB-008 states, from the manifest as it was read.
  observable: >-
    The objects that exist afterwards, and the diagnostics, are those that `register.v1` gives
    for the same documents as its input `documents` and the same manifest as its input
    `manifest`. The manifest is the file named `conduit.yaml`, `conduit.yml` or `conduit.json`,
    under MAN-001. The rules on a file are applied as the files are read, under SUB-005. A
    relative `fetch` or program is resolved against the directory, under MAN-006 and MAN-010,
    before the values are compared with what `register.v1` takes: a registration that hands over
    values has no directory, and rejects a relative one. Two things do not follow the resolved
    values. One is the digest that identifies the project's contracts: SUB-008 hashes the
    manifest as the file writes it, so one directory gives one digest wherever it lies, and a
    conformance vector can state it. The other is PRV-007's guard: a program given as a relative
    path names a file on the machine the engine runs on, so once resolved it is still run by the
    engine's own runner alone. Every engine can be handed a directory, and not only values
    through `register.v1`, because the rules on files are promises of the language and a
    conformance vector is made of files. How a directory is handed to an engine, such as by a
    command or a call, is DL7 of the implementation-defined list. Being handed a directory
    installs nothing, whatever the manifest lists: a registration whose manifest lists a package
    that is not installed is rejected under PKG-006, and a package is installed only by a
    request for `install.v1`, which is always a request of its own, under NAM-012. In an engine
    that keeps the conventions the registration is a request like any other, made for an actor
    that DL7 has the engine name, and is authorized under ACC-033.
  vectors: []
