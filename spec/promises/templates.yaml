# Templates: what the `spec` of a template holds.
# Owner rulings of 2026-11-05 (plan-audit rulings 31 to 33). One `implementation` map follows
# Terraform, which picks a provider from a resource's type and lets one line override it. A
# setup hook and a retire hook follow Kubernetes's PostStart and PreStop hooks and Compose's
# `post_start` and `pre_stop`. A Conduit template's own keys are in conduits.yaml and a Pool's
# entries in pools.yaml. The JSON Schemas of these shapes are in spec/schemas/templates.yaml.
# Consolidation pass 1 took PKG-009, PKG-010 and PKG-011 into TPL-003, TPL-004 and CTR-004.
# The ruling on the core package and the schemas (plan-audit ruling 37) changed TPL-002,
# TPL-003, TPL-006 and TPL-010. The second round of the re-audit
# (docs/proposals/reaudit/round-2/DECISIONS.md) changed TPL-003, TPL-004, TPL-006 to TPL-009
# and TPL-012: an instance is set up by one invocation of `set-up.v1` and retired by one of
# `retire.v1`, and a template's `setup` and `retire` graphs are the steps the engine runs. Its
# closing pass (docs/proposals/reaudit/round-2/log-closing.md) changed TPL-006, where a runtime
# is no longer marked optional, and TPL-010, and added TPL-013, of the layer `convention`.
# Its last pass (docs/proposals/reaudit/round-2/log-tail.md) changed TPL-004, which now covers
# every operation of a capability the type offers and every control it lists, and TPL-009, and
# added TPL-014. No promise of this file was removed before ruling 38. Draft: no vector exists
# yet.
# The fix pass of the third round of the re-audit (docs/proposals/reaudit/round-3/log-fixes.md),
# on the coordinator's decisions in docs/proposals/reaudit/round-3/DECISIONS.md, which ruling 39
# accepted, changed TPL-003 and TPL-007, and added TPL-015, of the layer `convention`,
# on reconciling the start or the stop of a runtime. It removed none.
# Its follow-up, on the decisions of the section "The fix pass, and what it left" of the same
# file, which are the coordinator's too, changed TPL-007, TPL-009 and TPL-015: an instance holds
# a runtime until a stop of it has succeeded or has been reconciled as having occurred.
# The fix pass of the fourth round of the re-audit
# (docs/proposals/reaudit/round-4/log-fixes.md), on the coordinator's decisions in
# docs/proposals/reaudit/round-4/DECISIONS.md, which ruling 39 accepted, changed
# TPL-007, TPL-009, TPL-011 and TPL-015, and added TPL-016, of the layer `language`: no step
# invokes the start or the stop operation of a runtime of its own instance by naming it as its
# `operation`. It removed none.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 38 of the owner (docs/proposals/ruling-38/README.md, 2026-11-06) changed this file;
# what changed is in docs/proposals/ruling-38/log-spec.md. It removed TPL-014, on
# later work, which is not part of this version. Those IDs are not reused.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, removed TPL-006 and TPL-007 (decision 2: runtimes go, and the run that the
# instance's runtime provider makes replaces them, PRV-007), TPL-015 (decision 2a: a run of
# unknown outcome is settled by its status, PRV-009) and TPL-016 (decisions 1 and 2: nothing
# replaces it); changed TPL-001, TPL-003, TPL-004, TPL-008, TPL-009 and TPL-012, which is now of
# the layer `convention`; and added TPL-017 and TPL-018, the setup hook and the retire hook
# (decision 1a), and TPL-019, one item that is run for each instance (decision 2a). What
# changed is in docs/proposals/ruling-41/log-G1.md. Those IDs are not reused. The integration
# of the rewrite (docs/proposals/ruling-41/log-integration.md) changed TPL-009, whose parts
# include the run that TPL-018 asks for, as OPS-022 counts them. Its coverage check (the same
# log, "Coverage check") changed TPL-009, which asks for the stop whatever came of the retire
# hook, and TPL-018, which asks for a run only where the hook is to be dispatched.
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06), applying the coordinator's
# decisions in docs/proposals/ruling-41/open-decisions.md, changed TPL-009, TPL-012, TPL-017
# and TPL-018: a retirement connects to a `remote` item to serve its retire hook, and asks for
# the stop when it is cancelled; no part of a setup is begun once the instance is retired or
# the setup cancelled, and the run and the connections stand at one position in its order;
# and a type may require a hook and state its default. It added and removed none. What
# changed is in docs/proposals/ruling-42/log-secrets.md.
# The names of ruling 42 (the vocabulary audit's N10; log
# docs/proposals/ruling-42/log-rename-a.md) renamed location to node in TPL-018. It removed none
# and added none.
# The names of ruling 42 (the vocabulary audit's N15 and N16; log
# docs/proposals/ruling-42/log-rename-b.md) renamed operation identity to idempotency key in
# TPL-017 and TPL-018, and the restrictions that the setup hook carries to its filters in
# TPL-017. It removed none and added none.
# The editorial fixes of ruling 42 (the vocabulary audit's E8 and E11; log
# docs/proposals/ruling-42/log-editorial.md) changed TPL-008, whose observable no longer defines
# the setup operation and the retire operation of an instance, since `set-up.v1` and
# `retire.v1` are themselves those operations, and TPL-017, whose observable says that the hook
# carries the filters, where it said that its request does, since a hook is not a request. It
# removed none and added none.
# The verification of ruling 42 (docs/proposals/ruling-42/log-integration.md, "Verification")
# changed TPL-018: a retirement connects anew to the `remote` item that serves its retire hook
# where no connection to it lasts whose values the engine holds, as after the engine restarts,
# so the reads for the hook belong to the retirement, as row 9 of the open questions has it,
# and none is the read again of SEC-023 that ACC-039 would refuse. It removed none and added
# none.

- id: TPL-001
  layer: language
  level: must
  when: >-
    The `spec` of an Interface, Agent, Resource or Pool template is read.
  then: >-
    It may hold `type`, `inputs`, `config`, `implementation` and `controls`; for an Interface,
    Agent or Resource also `conduits`; and for a Pool `entries`. There are no other keys, and no
    family has keys of its own beyond these. `inputs`, `conduits` and `entries` are maps keyed
    by name, as OBJ-022 states.
  observable: >-
    An account, a model or a frontend is written inside `config`, where the type's schema checks
    it. A Pool template that declares Conduits is rejected, because a Pool is never the consumer
    of a Conduit. A template that writes `runtimes`, `setup` or `retire` is rejected under
    OBJ-019: an instance's run is PRV-007, and its own work at setup and at retirement is a
    hook, under TPL-017 and TPL-018.
  vectors: []

- id: TPL-002
  layer: language
  level: must
  when: >-
    An Interface, Agent, Resource or Pool template is registered.
  then: >-
    Its `type` is the selection of a Type contract of the same family, written as NAM-018 gives
    a selection. A Conduit template has no `type`.
  observable: >-
    A template with no `type`, with a type of another family, or a Conduit template that gives
    one, is rejected with a diagnostic.
  vectors: []

- id: TPL-003
  layer: language
  level: must
  when: >-
    A template selects an implementation.
  then: >-
    It does so in the one `implementation` map of its `spec`. Each key is the selection of an
    operation, written as NAM-018 gives one: a qualified reference, or `#name` for an operation
    of the same project or package. Each value is a string, which is the selection of an
    implementation.
  observable: >-
    A member of a template's `controls` map that carries its own `implementation` key is
    rejected with a diagnostic naming it. An Operation contract, a control's among them, may
    state `implementation`, its default implementation, under CTR-002. The map holds one
    selection for an operation; the same operation written twice is a duplicate key, rejected
    under SCH-012. `setup-hook.v1` and `retire-hook.v1` are selected here like any operation,
    under TPL-017 and TPL-018. `set-up.v1` and `retire.v1` are not: the engine implements them,
    as TPL-008 states.
  vectors: []

- id: TPL-004
  layer: language
  level: must
  when: >-
    An operation is not a key of a template's `implementation` map, and it is one that the
    template's type requires, that a capability the type offers includes, or that the type
    lists as a control.
  then: >-
    The implementation is the default the type states for that operation, or else the default
    the operation's own contract states. If there is neither, the template is rejected.
  observable: >-
    The resolved template shows one implementation for each such operation and where it came
    from: the template, the type or the operation's contract. A default is a selection, and it
    resolves in the project or package that holds the contract stating it: under NAM-022 where
    it is written `#name`, and through that package's own manifest, under NAM-014, where it
    names another package. A type's contract promises what its instances offer: a Conduit may
    list any operation of a capability that its target's type offers, under CON-017 and
    CON-021, a control among them, so each of those operations has an implementation when the
    template is registered, whether or not the type also lists it under `requires`. A template
    whose type offers a capability one of whose operations has no selection and no default is
    rejected, and so is one whose type lists such a control, even where the template's
    `controls` map leaves that control out.
  vectors: []

- id: TPL-005
  layer: language
  level: must
  when: >-
    A template is registered in which an implementation is selected for an operation that the
    implementation's package does not say it implements.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the operation and the implementation.
  vectors: []

- id: TPL-008
  layer: language
  level: must
  when: >-
    An instance is set up or retired.
  then: >-
    Each setup of it is one invocation of `set-up.v1` that names it, and each retirement one
    invocation of `retire.v1` that names it. The engine implements both operations, and neither
    is selected in the `implementation` map.
  observable: >-
    The request names the instance in the input `instance` of `set-up.v1` or of `retire.v1`, and
    is made of the target that ACC-033 names. What a setup does is TPL-012, and what a
    retirement does is TPL-009. A Conduit is set up by an invocation of `open.v1` and retired by
    one of `close.v1`, and a request for `set-up.v1` or `retire.v1` that names one is LIF-032.
  vectors: []

- id: TPL-009
  layer: convention
  level: must
  when: >-
    An instance is retired by an invocation of `retire.v1`.
  then: >-
    Within that invocation, where a setup of the instance was ever dispatched, the engine
    dispatches its retire hook, where its template selects one, under TPL-018, and then asks its
    runtime provider to stop its run, where an item that is run is selected for it, under
    PRV-008, whatever came of the hook: where it succeeded, failed or ended unknown, and where
    it was not dispatched. Nothing else is done, apart from the run or the connection that
    TPL-018 asks for to serve the hook, with the reads of secrets that it needs under SEC-010
    and SEC-013, and the closing of its Conduits under CON-008. Where the invocation is
    cancelled under OPS-027 before the hook is dispatched, the hook is not dispatched, and the
    stop is asked for all the same.
  observable: >-
    An instance for which no setup was ever dispatched gets neither: nothing is dispatched, no
    stop is asked for, and the invocation succeeds at once, as LIF-025 states. With no retire
    hook and no item that is run, the invocation dispatches nothing and succeeds at once. The
    hook, with the run or the connection that TPL-018 asks for to serve it, and the stop are the
    parts of the retirement, and the invocation succeeds only if each of them that it has
    succeeded, as OPS-022 counts them. The stop is asked for whether or not the run is reported
    running, and stopping a run that is not running succeeds, so a run that a setup of unknown
    outcome may have left running is stopped too. The stop does not wait on the hook, as
    Kubernetes kills a container whose PreStop hook failed: a hook that did not succeed keeps
    the shutdown from being confirmed, under OPS-022 and LIF-024, and a further retirement
    dispatches it again as OPS-021 and OPS-028 allow, against a run asked for anew under
    TPL-018, as Terraform runs a failed destroy-time provisioner again at the next apply. Each
    connection to a `remote` item for the instance ends when the retirement ends, under SEC-013.
    When the Conduits of which the instance is the consumer are closed, and what they permit
    meanwhile, is CON-008 and ACC-039.
  vectors: []

- id: TPL-010
  layer: language
  level: must
  when: >-
    A template's `controls` map is read.
  then: >-
    Each key is the selection of a control that the template's type lists, written as NAM-018
    gives one. Each value may hold `inputs`, a map from the name of one of that control's inputs
    to a member that holds `schema`, a schema that further narrows that input.
  observable: >-
    A key the type does not list, or an input name the control does not declare, is rejected. A
    control the map does not list is not available on the template's instances, and TPL-013 says
    what a request for it reports. A template with no `controls` map makes every control of its
    type available. `inputs: {limit: {schema: {maximum: 50}}}` narrows the input `limit`.
  vectors: []

- id: TPL-011
  layer: convention
  level: must
  when: >-
    A control is requested on an instance whose template narrowed one of its inputs.
  then: >-
    The value given for that input must satisfy both the schema the control's contract gives
    the input and the schema the template added.
    A request whose value fails either is not dispatched, and reports invalid.
  observable: >-
    A request whose value the contract would accept and the template's schema rejects leaves the
    configuration and the revision as they were, and no implementation receives a call. Where
    the actor is not permitted, OPS-023 gives refused first.
  vectors: []

- id: TPL-012
  layer: convention
  level: must
  when: >-
    An instance is set up by an invocation of `set-up.v1`.
  then: >-
    The setup is these parts, in this order: first opening its declared Conduits, under CON-004,
    or for a Pool setting up the Resources of its entries, under POOL-013; then asking for its
    run, under PRV-007, and connecting to each `remote` item among its selected implementations,
    under IFC-041; then dispatching its setup hook, under TPL-017. A part is begun only once
    every part that comes before it in that order, and is not marked optional, has succeeded. No
    part is begun once the instance is retired, or once the setup is cancelled under OPS-027.
    Nothing else is dispatched, apart from the reads of secrets that the run or a connection
    needs, under SEC-010 and SEC-013.
  observable: >-
    No record shows a part begun before every earlier part that is not marked optional has
    succeeded: one that failed, ended unknown, was cancelled or was not dispatched leaves every
    later part not begun, and the setup's outcome is as OPS-022 gives it. The run and the
    connections stand at one position in the order: none of them waits for another, and the hook
    waits for all of them. A run is asked for only once the declared Conduits are open, so the
    reads it needs go through Conduits that are open. Among the Resources of a Pool's entries,
    POOL-013 gives the order. Where the instance is retired during its setup, under PLC-017 or
    PLC-024, the parts already dispatched end as they end, the setup's outcome is OPS-022's and
    the instance stays retired, under LIF-006 and LIF-028, as the kubelet starts no new
    container of a Pod that is terminating; a run that such a part started is stopped by a
    further retirement, under LIF-026, or by the stop that LIF-036 asks for when the instance is
    unregistered. An instance whose selected implementations include no item that is run and no
    `remote` item that names `headers`, and whose template selects no setup hook, dispatches
    nothing in its setup beyond the first part. A further setup leaves an open Conduit, a ready
    Resource and a running run as they are, under CON-004, POOL-013 and PRV-007, connects to
    each `remote` item again and reads again, under SEC-013, and dispatches the hook again only
    as OPS-021 and OPS-028 allow.
  vectors: []

# --- Added by the closing pass of the second round of the re-audit
# --- (docs/proposals/reaudit/round-2/reader-3.md, finding 28). It is of the layer `convention`.

- id: TPL-013
  layer: convention
  level: must
  when: >-
    A control is requested on an instance that does not have it: the instance's type does not
    list it under CTR-006, or its template has a `controls` map that does not list it under
    TPL-010.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    The instance's configuration and revision are as they were, and no implementation receives a
    call. A Conduit may list the control, because its capability includes it under CON-017, and
    the request reports invalid all the same. Where the actor is not permitted, OPS-023 gives
    refused first.
  vectors: []

# --- Added by ruling 41 (docs/proposals/ruling-41/README.md; decisions 1a and 2a of the
# --- principles review). TPL-017 and TPL-018 are of the layer `convention`, and TPL-019, a
# --- rule on documents, of the layer `language`.

- id: TPL-017
  layer: convention
  level: must
  when: >-
    An instance is set up whose template selects an implementation for `setup-hook.v1`.
  then: >-
    Within each invocation of `set-up.v1` for the instance, as the last part of the setup under
    TPL-012, the engine dispatches `setup-hook.v1` to that implementation, through no Conduit,
    for the caller of the setup, with the idempotency key that OPS-028 gives it.
  observable: >-
    The hook is dispatched only once the declared Conduits are open, or the entries set up, and
    the run asked for or the `remote` item connected, under TPL-012, so its onward requests,
    which are onward requests under ACC-016, go through Conduits that are open. It carries the
    filters of the invocation of `set-up.v1` that it belongs to, under ACC-018, and no
    `conduit`. In a further setup the hook is dispatched again only as OPS-021 and OPS-028
    allow. Its outcome counts in the setup's as OPS-022 states. A template selects the hook in
    its `implementation` map or, where its type lists `setup-hook.v1` under `requires`, takes
    the default that the type states, under TPL-004. The hook's own contract states no default,
    so a type that requires the hook and states none makes every template of it select one. A
    type's default hook that is an item that is run counts with the template's other items under
    TPL-019. `setup-hook.v1` carries no mark of model work, so the hook starts none, under
    IMP-001, and neither does an onward request that serves it, under IMP-008.
  vectors: []

- id: TPL-018
  layer: convention
  level: must
  when: >-
    An instance for which a setup was ever dispatched is retired by an invocation of
    `retire.v1`, and its template selects an implementation for `retire-hook.v1`.
  then: >-
    Within that invocation, before the stop of TPL-009, the engine dispatches `retire-hook.v1`
    to that implementation, through no Conduit, for the caller of the retirement, with the
    idempotency key that OPS-028 gives it, where the hook is to be dispatched: where no
    earlier invocation of it exists for the instance, or where OPS-012 or OPS-024 would dispatch
    a new attempt of the earlier one, under OPS-021 and OPS-028. Where the hook is to be
    dispatched, an item that is run is selected for the instance and its runtime provider does
    not report the run running, the engine first asks for the run, under PRV-007. Where the hook
    is to be dispatched, its implementation is a `remote` item and no connection to it lasts
    whose values the engine holds, the engine first connects to it, under IFC-041 and SEC-013.
    Where the hook is not to be dispatched, no run is asked for, no connection is made, and the
    retirement goes on to the stop.
  observable: >-
    A run asked for, or a connection made, to serve the hook belongs to the retirement, and so
    does a read of a secret for it, under SEC-011. A connection that a setup made and that
    lasts, but whose values the engine no longer holds, as after it restarts, counts as none
    here: the retirement connects anew, with reads that belong to it, and sends the hook on no
    connection whose secrets would be read again under SEC-023 for that setup's caller, a read
    that ACC-039 refuses once the instance is retired. A run is never asked for, no connection
    made and no secret read, for a hook that is not dispatched again: one that succeeded, or one
    whose outcome is unknown and that OPS-012 does not dispatch as a new attempt. A hook
    dispatched again in a further retirement may run against a new run, asked for under PRV-007
    with reads of its own, since the earlier retirement asked for the stop whatever came of the
    hook, under TPL-009: the hook must not depend on the state of a run that an earlier
    retirement stopped. The hook's onward requests go through the Conduits of which the instance
    is the consumer, which stay open until its shutdown is confirmed, under CON-008, and which
    permit them under ACC-039. Where the run or the connection cannot be had, as where a read
    fails under SEC-012, the hook is not dispatched and reports unavailable, and the stop is
    asked for all the same, under TPL-009. Where the instance's node was declared lost, the
    hook is not dispatched, and no run is asked for and no connection made for it, under
    PLC-027. No hook is dispatched for an instance for which no setup was ever dispatched, under
    LIF-025. A template selects the hook in its `implementation` map or, where its type lists
    `retire-hook.v1` under `requires`, takes the default that the type states, under TPL-004.
    The hook's own contract states no default, so a type that requires the hook and states none
    makes every template of it select one. A type's default hook that is an item that is run
    counts with the template's other items under TPL-019. `retire-hook.v1` carries no mark of
    model work, so the hook starts none, under IMP-001, and neither does an onward request that
    serves it, under IMP-008.
  vectors: []

- id: TPL-019
  layer: language
  level: must
  when: >-
    A template is registered whose selected implementations, in its `implementation` map or by
    default under TPL-004, include two different implementation items that are reached by
    `command` or by `package`.
  then: >-
    The template is rejected: an instance has at most one item that is run.
  observable: >-
    Resolving returns a diagnostic naming the two items. An item reached by `command` or
    `package` is one that is run, and a run is named by the instance's ID, under PRV-007, so one
    run serves one instance. One item that implements several of the selected operations is one
    run, which serves them all. An item reached by `remote`, and one reached by none of the
    three, as `engine` is under MAN-012, is not run and does not count.
  vectors: []
