# Templates: what the `spec` of a template holds.
# Owner rulings of 2026-11-05 (plan-audit rulings 31 to 33). One `implementation` map follows
# Terraform, which picks a provider from a resource's type and lets one line override it. A
# runtime as a pair of operations that pass a handle follows the Model Context Protocol's
# guidance for stateful tools. A Conduit template's own keys are in conduits.yaml and a Pool's
# entries in pools.yaml. The JSON Schemas of these shapes are in spec/schemas/templates.yaml.
# Consolidation pass 1 took PKG-009, PKG-010 and PKG-011 into TPL-003, TPL-004 and CTR-004.
# The ruling on the core package and the schemas (plan-audit ruling 37) changed TPL-002,
# TPL-003, TPL-006 and TPL-010. The second round of the re-audit
# (docs/proposals/reaudit/round-2/DECISIONS.md) changed TPL-003, TPL-004, TPL-006 to TPL-009
# and TPL-012: an instance is set up by one invocation of `set-up.v1` and retired by one of
# `retire.v1`, and a template's `setup` and `retire` graphs are the steps the engine runs. Its
# closing pass (docs/proposals/reaudit/round-2/log-closing.md) changed TPL-006, where a runtime
# is no longer marked optional, and TPL-010, and added TPL-013, of the layer `convention`.
# Its last pass (docs/proposals/reaudit/round-2/log-tail.md) changed TPL-004, which now covers
# every operation of a capability the type offers and every control it lists, and TPL-009, and
# added TPL-014. No promise of this file has been removed. Draft: no vector exists yet.

- id: TPL-001
  layer: language
  level: must
  when: >-
    The `spec` of an Interface, Agent, Resource or Pool template is read.
  then: >-
    It may hold `type`, `inputs`, `config`, `implementation`, `runtimes`, `setup`, `retire` and
    `controls`; for an Interface, Agent or Resource also `conduits`; and for a Pool `entries`.
    There are no other keys, and no family has keys of its own beyond these. `inputs`,
    `conduits`, `runtimes` and `entries` are maps keyed by name, as OBJ-022 states.
  observable: >-
    An account, a model, a frontend or an isolation setting is written inside `config`, where
    the type's schema checks it. A Pool template that declares Conduits is rejected, because a
    Pool is never the consumer of a Conduit.
  vectors: []

- id: TPL-002
  layer: language
  level: must
  when: >-
    An Interface, Agent, Resource or Pool template is registered.
  then: >-
    Its `type` is the selection of a Type contract of the same family, written as NAM-018 gives
    a selection. A Conduit template has no `type`.
  observable: >-
    A template with no `type`, with a type of another family, or a Conduit template that gives
    one, is rejected with a diagnostic.
  vectors: []

- id: TPL-003
  layer: language
  level: must
  when: >-
    A template selects an implementation.
  then: >-
    It does so in the one `implementation` map of its `spec`. Each key is the selection of an
    operation, written as NAM-018 gives one: a qualified reference, or `#name` for an operation
    of the same project or package. Each value is either a string, which is the selection of an
    implementation, or a map, which is a graph written in place.
  observable: >-
    A step, a runtime or a control that carries its own `implementation` key is rejected with a
    diagnostic naming it. The map holds one selection for an operation; the same operation
    written twice is a duplicate key, rejected under SCH-012. `setup` and `retire` are not
    selected here: the engine implements `set-up.v1` and `retire.v1`, and the graphs a template
    writes under `setup` and `retire` are the steps it runs, as TPL-008 states.
  vectors: []

- id: TPL-004
  layer: language
  level: must
  when: >-
    An operation is not a key of a template's `implementation` map, and it is one that the
    template's type requires, that a capability the type offers includes, that the type lists as
    a control, or that a runtime of the template or of its type, or one of the template's steps
    without `conduit`, names.
  then: >-
    The implementation is the default the type states for that operation, or else the default
    the operation's own contract states. If there is neither, the template is rejected.
  observable: >-
    The resolved template shows one implementation for each such operation and where it came
    from: the template, the type or the operation's contract. A default is a selection, and it
    resolves in the project or package that holds the contract stating it: under NAM-022 where
    it is written `#name`, and through that package's own manifest, under NAM-014, where it
    names another package. A step that carries `conduit` is a request to another instance under
    GRA-024 and needs no implementation here. A type's contract promises what its instances
    offer: a Conduit may list any operation of a capability that its target's type offers, under
    CON-017 and CON-021, a control among them, so each of those operations has an implementation
    when the template is registered, whether or not the type also lists it under `requires`. A
    template whose type offers a capability one of whose operations has no selection and no
    default is rejected, and so is one whose type lists such a control, even where the
    template's `controls` map leaves that control out. Where the template was registered while
    the type's package was not installed, as PKG-006 allows, the check is made when the template
    is instantiated, under INS-022. Which implementation may be selected for an operation that
    arranges later work is TPL-014.
  vectors: []

- id: TPL-005
  layer: language
  level: must
  when: >-
    A template is registered in which an implementation is selected for an operation that the
    implementation's package does not say it implements.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the operation and the implementation.
  vectors: []

- id: TPL-006
  layer: language
  level: must
  when: >-
    A template or a Type contract declares a runtime.
  then: >-
    It is a member of a `runtimes` map, keyed by its name, that holds `start` and `stop`, each
    the selection of an operation, and nothing else. The start operation's contract declares
    exactly one output that is a handle, and the stop operation's contract takes exactly one
    required input that is a handle. An instance has the runtimes that its type declares as well
    as those that its template declares.
  observable: >-
    A runtime whose start or stop operation does not have that shape is rejected with a
    diagnostic naming the runtime and the operation. A template that declares a runtime under a
    name that its type declares is rejected with a diagnostic naming the runtime. A step may
    name a runtime that either of them declares, under GRA-017. A runtime is not marked
    optional, and one that carries `optional` is rejected: a runtime is started only by a step
    that names it, and that step may be marked `optional: true`.
  vectors: []

- id: TPL-007
  layer: convention
  level: must
  when: >-
    A step names a runtime.
  then: >-
    If the instance does not hold that runtime, the step invokes its start operation, and once
    that succeeds the instance holds the handle it returned, under the runtime's name, until the
    runtime is stopped. If the instance already holds it, the start operation is not invoked
    again and the step is left as succeeded.
  observable: >-
    Inspecting the instance lists the runtime as held. A value reference with the source
    `runtime` and that name yields the handle. Setting the instance up again starts no second
    runtime of that name, and the instance holds the same handle as before.
  vectors: []

- id: TPL-008
  layer: language
  level: must
  when: >-
    A template declares a `setup` graph or a `retire` graph.
  then: >-
    The graph is the steps that the engine runs for an instance of the template: those of
    `setup` within the one invocation of `set-up.v1` that sets the instance up, and those of
    `retire` within the one invocation of `retire.v1` that retires it. The engine implements
    both operations. Neither graph is an implementation, neither is selected in the
    `implementation` map, and neither has inputs of its own.
  observable: >-
    The request names the instance in the input `instance` of `set-up.v1` or of `retire.v1`, and
    is made of the target that ACC-033 names. The setup operation and the retire operation of an
    instance mean these two invocations, and its setup and its retirement are what they do. A
    `setup` or `retire` graph may refer to the instance's configuration and to the handles of
    its runtimes, as GRA-010 and GRA-020 state, and a value reference with the source `input` is
    rejected in one. A Conduit template has neither graph: a Conduit is set up by an invocation
    of `open.v1` and retired by one of `close.v1`.
  vectors: []

- id: TPL-009
  layer: convention
  level: must
  when: >-
    An instance is retired by an invocation of `retire.v1`.
  then: >-
    Within the invocation of `retire.v1` the engine runs the steps of the instance's `retire`
    graph, if it has one and a setup of the instance was ever dispatched, and then invokes the
    stop operation of each runtime the instance still holds. Nothing else is done, apart from
    the closing of its Conduits under CON-008.
  observable: >-
    An instance for which no setup was ever dispatched does not run its `retire` graph, as
    LIF-025 states. With no `retire` graph to run and no runtime held, the invocation succeeds
    at once. The stops are part of the invocation, which succeeds only if the steps of the graph
    did, as OPS-022 counts them, and every stop succeeded. A further invocation for an instance
    whose shutdown is confirmed runs no step and stops nothing, under LIF-030. When the Conduits
    of which the instance is the consumer are closed, and what they permit meanwhile, is CON-008
    and ACC-039.
  vectors: []

- id: TPL-010
  layer: language
  level: must
  when: >-
    A template's `controls` map is read.
  then: >-
    Each key is the selection of a control that the template's type lists, written as NAM-018
    gives one. Each value may hold `inputs`, a map from the name of one of that control's inputs
    to a member that holds `schema`, a schema that further narrows that input.
  observable: >-
    A key the type does not list, or an input name the control does not declare, is rejected. A
    control the map does not list is not available on the template's instances, and TPL-013 says
    what a request for it reports. A template with no `controls` map makes every control of its
    type available. `inputs: {limit: {schema: {maximum: 50}}}` narrows the input `limit`.
  vectors: []

- id: TPL-011
  layer: convention
  level: must
  when: >-
    A control is requested on an instance whose template narrowed one of its inputs.
  then: >-
    The value given for that input must satisfy both the schema the control's contract gives
    the input and the schema the template added.
  observable: >-
    A request whose value the contract would accept and the template's schema rejects is not
    dispatched and reports invalid.
  vectors: []

- id: TPL-012
  layer: language
  level: must
  when: >-
    A template has no `setup` graph.
  then: >-
    The steps that the engine runs to set up one of its instances are only the opening of the
    instance's declared Conduits and, for a Pool, the setting up of the Resources of its
    entries.
  observable: >-
    An invocation of `set-up.v1` for such an instance invokes no operation of any implementation
    beyond those.
  vectors: []

# --- Added by the closing pass of the second round of the re-audit
# --- (docs/proposals/reaudit/round-2/reader-3.md, finding 28). It is of the layer `convention`.

- id: TPL-013
  layer: convention
  level: must
  when: >-
    A control is requested on an instance that does not have it: the instance's type does not
    list it under CTR-006, or its template has a `controls` map that does not list it under
    TPL-010.
  then: >-
    The request is not dispatched, and reports invalid.
  observable: >-
    The instance's configuration and revision are as they were, and no implementation receives a
    call. A Conduit may list the control, because its capability includes it under CON-017, and
    the request reports invalid all the same. Where the actor is not permitted, OPS-023 gives
    refused first.
  vectors: []

# --- Added by the last pass of the second round of the re-audit
# --- (docs/proposals/reaudit/round-2/log-tail.md; decision 9 of "The closing pass, and what it
# --- left" in DECISIONS.md).

- id: TPL-014
  layer: language
  level: must
  when: >-
    A template is registered in which the implementation of an operation marked
    `arrangesLaterWork: true` is marked `plain`, whether the template selects that
    implementation or it is the default under TPL-004.
  then: >-
    The template is rejected.
  observable: >-
    Resolving returns a diagnostic naming the operation and the implementation. It is decided
    from the operation's contract and from the manifest, under PKG-020, without starting
    anything. A plain implementation is sent none of Conduit's keys, under IFC-007, so it never
    learns the engine's ID for the invocation that arranged the work, and cannot ask for a start
    with `start-later-work.v1` under ACC-040. Where the template was registered while a package
    it needs was not installed, as PKG-006 allows, the check is made when the template is
    instantiated, under INS-022.
  vectors: []
