# The five kinds of contract document, and an applied requirement.
# JSON Schema 2020-12, within spec/schema-profile.md.
#
# Promises encoded:
#   contract.v1             CTR-001 (the four top-level keys and no other; a name that has at
#                           least one segment and then a version segment), OBJ-018, OBJ-020,
#                           CTR-008 (the `spec` of a Schema contract is the schema itself)
#   type-spec.v1            CTR-004 (`family` is required; `nodeSelector` is a label selector
#                           under PLC-007; `records` may be given; a Type of the family Pool
#                           lists the core package's `pool-management.v1` under `offers`),
#                           TPL-002 (a type is of one of the five families that have one),
#                           CTR-013 (the closed signIn shape, account pointer and logins;
#                           the Type lists `sign-in-hook.v1`, `account-hook.v1` and
#                           `sign-out-hook.v1` under `requires`), CTR-014 (`toolsDirectory`
#                           holds exactly `directory`, a pointer; only family Agent states it)
#   sign-in-login.v1        CTR-013 (literal logins, their four return kinds and members)
#   capability-spec.v1      CTR-003
#   operation-spec.v1       CTR-002 (`inputSchema` and `outputSchema`, whose properties are
#                           the inputs and the outputs, a property name being any non-empty
#                           string; a handle states no `default`; no property of
#                           `outputSchema` states one; `idempotentHint`, `destructiveHint` and
#                           `openWorldHint`), CTR-012 (the root of each holds `type: object`;
#                           that of a control, whose `spec` holds `changes`, may hold besides
#                           only `properties`, `required` and `additionalProperties`), CTR-006
#                           (`changes` is a map from the name of an input to the pointer that
#                           input sets), IMP-003, OPS-012, OBJ-015
#                           (an input is optional where `required` does not list it),
#                           ACC-032 and CTR-009 (`reservedToRoot`)
#   requirement-spec.v1     CTR-005 (`inputs` and no other key), OBJ-015, OBJ-022
#   applied-requirement.v1  NAM-019, CON-018 (`requirement` is required)
#
# `reservedToRoot: true` on an Operation contract is the mark of an operation reserved to the
# root Interface (ACC-032). Only an Operation contract of the core package carries it: any
# other package that holds one is rejected when it is installed, and a project that holds
# one is rejected when it is submitted (CTR-009). A schema sees one document and not the
# package it belongs to, so `operation-spec.v1` accepts the key and the engine checks where
# it is written.
#
# Open, as OBJ-019 exempts: the `arguments` of an applied requirement, and the value of the
# `default` of a Requirement's input, which is a literal value. Inside `inputSchema` and
# `outputSchema` the names under `properties` are the author's, as in any schema, and the
# keywords are closed by `schema.v1` (SCH-002). The keys of a Requirement's `inputs` are
# names, stated with `propertyNames` (OBJ-022).
#
# Not expressed here, and checked by the engine: that every reference resolves to a contract of
# the right kind; that a capability lists no two operations with one export name (CTR-007) and,
# outside the core package, none that is reserved (CTR-003); that no Operation contract outside
# the core package is marked `reservedToRoot` (CTR-009); that each key of a control's `changes`
# is an input the control declares and each pointer a place its type's schema describes, that
# no two of its pointers are equal or lie one inside the other, that its `inputSchema` requires
# `revision` and that it declares no output `settings` (CTR-006); default implementations
# (CTR-004, TPL-004); that a Type that offers a provider capability is of the family Resource
# and offers no other (PRV-001), that one that offers `package-source.v1` requires `schemes` and
# lists no control whose `changes` reaches `/schemes` (PRV-016) and that one that offers
# `secret-provider.v1` lists no control (SEC-005) and offers no other capability (SEC-022);
# that the place each pointer of `signIn` and `toolsDirectory` names and every member on its
# path are required by the Type's `schema`, and the place is confined to string or null
# (CTR-013, CTR-014), which relate values in one document; that no control of a Type stating
# `toolsDirectory` has `changes` reaching its place (CTR-014), which needs the contracts of
# the controls; that a `default` satisfies its schema (SCH-019); compatibility between
# releases (NAM-024); and CTR-013's other rules: the three hooks, distinct login names, no
# URL matching two logins, and client IDs shared across addresses.
# tools/check_schemas.py also checks some of these, as far as the documents in front of it show:
# spec/schemas/README.md, "What a schema cannot express", says which.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: contract.v1
  description: A contract document of any of the five kinds.
spec:
  anyOf:
    - $ref: '#/$defs/type'
    - $ref: '#/$defs/capability'
    - $ref: '#/$defs/operation'
    - $ref: '#/$defs/requirement'
    - $ref: '#/$defs/schema'
  $defs:
    type:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Type}
        metadata: {$ref: github.com/shrav-k/conduit/core#contract-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#type-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    capability:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Capability}
        metadata: {$ref: github.com/shrav-k/conduit/core#contract-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#capability-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    operation:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Operation}
        metadata: {$ref: github.com/shrav-k/conduit/core#contract-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#operation-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    requirement:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Requirement}
        metadata: {$ref: github.com/shrav-k/conduit/core#contract-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#requirement-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    schema:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Schema}
        metadata: {$ref: github.com/shrav-k/conduit/core#contract-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#schema.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: type-spec.v1
  description: >-
    The `spec` of a Type contract. `family` is required. `schema`, `offers`, `requires`, `implementation`,
    `controls`, `conditions`, `records`, `signIn` and `nodeSelector` may each be left out, and one that is left
    out lists nothing. A type that states no `schema` puts no rule on the configuration of its instances,
    and so lists no control. `nodeSelector` is a label selector that the labels of an instance's node
    must match. A Type of the family Pool lists the core package's capability `pool-management.v1`
    under `offers`. A Type of family Fleet exists only in the core package and offers fleet-management.v1
    (FLEET-001). `signIn` holds exactly an `account` pointer and requires the three core hooks
    `sign-in-hook.v1`, `account-hook.v1` and `sign-out-hook.v1` under `requires` (CTR-013).
    `toolsDirectory` holds exactly a `directory` pointer and is allowed only for family Agent
    (CTR-014).
spec:
  type: object
  properties:
    family:
      enum:
      - Interface
      - Agent
      - Resource
      - Pool
      - Fleet
    schema:
      $ref: github.com/shrav-k/conduit/core#schema.v1
    offers:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#selection.v1
    requires:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#selection.v1
    implementation:
      $ref: github.com/shrav-k/conduit/core#implementation-map.v1
    controls:
      type: array
      items:
        $ref: github.com/shrav-k/conduit/core#selection.v1
    signIn:
      type: object
      properties:
        account: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
        logins:
          type: array
          minItems: 1
          items: {$ref: github.com/shrav-k/conduit/core#sign-in-login.v1}
      required: [account, logins]
      additionalProperties: false
    nodeSelector:
      $ref: github.com/shrav-k/conduit/core#labels.v1
    conditions:
      type: array
      items:
        type: string
        minLength: 1
      uniqueItems: true
    records:
      type: object
      description: >-
        What content the records about the type's instances keep: the inputs of their operations,
        the outputs, both or neither. A member that is absent means false.
      properties:
        inputs:
          type: boolean
        outputs:
          type: boolean
      additionalProperties: false
    toolsDirectory:
      type: object
      properties:
        directory: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
      required: [directory]
      additionalProperties: false
  required:
  - family
  additionalProperties: false
  dependentSchemas:
    toolsDirectory:
      properties:
        family:
          const: Agent
    signIn:
      required:
      - requires
      properties:
        requires:
          allOf:
          - contains:
              const: github.com/shrav-k/conduit/core#sign-in-hook.v1
          - contains:
              const: github.com/shrav-k/conduit/core#account-hook.v1
          - contains:
              const: github.com/shrav-k/conduit/core#sign-out-hook.v1
  if:
    properties:
      family:
        const: Pool
  then:
    required:
    - offers
    properties:
      offers:
        contains:
          const: github.com/shrav-k/conduit/core#pool-management.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: capability-spec.v1
  description: The `spec` of a Capability contract.
spec:
  type: object
  properties:
    operations:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#selection.v1}
  required: [operations]
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: operation-spec.v1
  description: >-
    The `spec` of an Operation contract, written as the Model Context Protocol writes a tool.
    The properties of `inputSchema` are the operation's inputs, and those of `outputSchema` its
    outputs; one that `required` does not list is optional, and an operation that states no
    `inputSchema` or no `outputSchema` has no inputs or no outputs. The root of each holds
    `type: object`, and may hold any other keyword of the profile, such as a `oneOf` whose
    branches say which inputs are present. A control also holds `changes`, a map from the name
    of an input to the pointer that input sets, and the root of each of its schemas may hold
    `properties`, `required` and `additionalProperties` beside `type`, and nothing else. A
    property of `inputSchema` may state a `default`, which the engine fills in where the input
    is not supplied; no property of `outputSchema` states one, and nor does a handle, a
    property whose schema is the core package's `handle.v1`. An operation reserved to the root
    Interface is marked `reservedToRoot: true`, which only an Operation contract of the core
    package may be. An Operation contract states no default implementation: a template's
    selection or its type's default chooses what runs, and the engine implements the
    operations that the core package's implementation `engine` lists.
spec:
  type: object
  properties:
    inputSchema:
      allOf:
        - $ref: github.com/shrav-k/conduit/core#schema.v1
        - $ref: '#/$defs/root'
    outputSchema:
      allOf:
        - $ref: github.com/shrav-k/conduit/core#schema.v1
        - $ref: '#/$defs/root'
        - properties:
            properties:
              additionalProperties:
                not: {type: object, required: [default]}
    effect: {type: string, minLength: 1}
    startsModelWork: {type: boolean}
    deduplicates: {type: boolean}
    reservedToRoot:
      type: boolean
      description: >-
        The reserved mark. True for an operation reserved to the root Interface, which is
        dispatched only when the actor is the root Interface. Absent means false. Only an
        Operation contract of the core package is marked.
    changes:
      type: object
      description: >-
        For a control. Each key is the name of one of the control's inputs, and its value is
        the JSON Pointer, into the instance's configuration, of the setting that input sets.
        The settings a control addressed are those of the inputs it was sent.
      propertyNames: {minLength: 1}
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
    idempotentHint: {type: boolean}
    destructiveHint: {type: boolean}
    openWorldHint: {type: boolean}
  additionalProperties: false
  if:
    required: [changes]
  then:
    properties:
      inputSchema: {$ref: '#/$defs/control-root'}
      outputSchema: {$ref: '#/$defs/control-root'}
  $defs:
    root:
      type: object
      properties:
        type: {const: object}
        properties:
          type: object
          propertyNames: {minLength: 1}
          additionalProperties: {$ref: '#/$defs/member'}
      required: [type]
    control-root:
      type: object
      properties:
        type: {}
        properties: {}
        required: {}
        additionalProperties: {}
      additionalProperties: false
    member:
      if:
        type: object
        properties:
          $ref: {const: github.com/shrav-k/conduit/core#handle.v1}
        required: [$ref]
      then:
        not: {required: [default]}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: requirement-spec.v1
  description: >-
    The `spec` of a Requirement contract: its `inputs`, and nothing else. An input that states
    a `default` may be left out, whether or not it is marked `optional: true`.
spec:
  type: object
  properties:
    inputs:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#name.v1}
      additionalProperties:
        type: object
        properties:
          schema: {$ref: github.com/shrav-k/conduit/core#schema.v1}
          default: {}
          optional: {type: boolean}
        required: [schema]
        additionalProperties: false
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: applied-requirement.v1
  description: >-
    A requirement applied to a Conduit, as an item of a Conduit template's `requirements`. Its
    `arguments` are literal values, checked against the inputs the requirement declares, and
    an `arguments` map that is left out is present and empty.
spec:
  type: object
  properties:
    requirement: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    arguments: {type: object}
  required: [requirement]
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: sign-in-login.v1
  description: >-
    One literal login a Type states under CTR-013, pinned with its contract. No value is a
    pointer into configuration. Device uses the service's verification page and the panel's
    code (RFC 8628); redirect uses loopback (RFC 8252); page returns an opaque code; service
    completes through its own HTTPS page. Nothing returns through Conduit for device or service.
spec:
  type: object
  properties:
    name: {$ref: github.com/shrav-k/conduit/core#name.v1}
    return: {enum: [device, redirect, page, service]}
    authorization:
      type: string
      format: uri
      pattern: '^https://(\[[^/?#@ \\]+\]|[^:/?#@\[\] \\]+)(:[0-9]*)?(/[^?# \\]*)?$'
    clientId:
      type: string
      minLength: 1
      description: >-
        The OAuth client ID. For device it is the ID the program presents at the device
        authorization endpoint (RFC 8628 section 3.1), absent from the verification URL.
    redirect:
      type: object
      properties:
        host: {enum: [localhost, 127.0.0.1, '[::1]']}
        ports:
          anyOf:
          - {const: any}
          - type: array
            minItems: 1
            uniqueItems: true
            items: {type: integer, minimum: 1024, maximum: 65535}
        path: {type: string, pattern: '^/'}
      required: [host, ports, path]
      additionalProperties: false
    page:
      type: string
      format: uri
      pattern: '^https://([^/?#@ \\]*@)?(\[[^/?#@ \\]+\]|[^:/?#@\[\] \\]+)(:[0-9]*)?([/?][^# \\]*)?$'
    carried:
      type: boolean
      description: >-
        Whether the engine may carry the return from the person's Interface to its program.
        False completes only with a browser on the program's machine (CTR-013, PND-013).
    issuer:
      type: string
      format: uri
      pattern: '^https://(\[[^/?#@ \\]+\]|[^:/?#@\[\] \\]+)(:[0-9]*)?(/[^?# \\]*)?$'
  required: [name, return, authorization, clientId]
  additionalProperties: false
  allOf:
  - if:
      properties:
        return: {const: redirect}
    then:
      required: [redirect]
      properties:
        page: false
    else:
      properties:
        redirect: false
        issuer: false
  - if:
      properties:
        return: {enum: [page, service]}
    then:
      required: [page]
    else:
      properties:
        page: false
  - if:
      properties:
        return: {enum: [redirect, page]}
    then:
      required: [carried]
    else:
      properties:
        carried: false
