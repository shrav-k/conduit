# Example. One set of documents. Each is valid alone, and together they must be rejected:
# a requirement that is not a composition and does not narrow requests is applied to a
# Conduit, itself or as a constituent, only where it is a contract of the core package, as
# `shared-host.v1` is (CON-030). The engine checks only the requirements it knows, and an
# implementation is sent only the requirements that narrow requests, so nothing would apply
# `same-team.v1`. The template `team-read` applies it as a constituent of the composition
# `team-on-one-host.v1`. The other constituent, `shared-host.v1`, is not what rejects the
# template: a composition made only of such requirements of the core package is accepted.
# Each `appliesTo` lists `conduit`, so CTR-005 rejects nothing here: only the contract of
# `same-team.v1` says that it does not narrow.

apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: same-team.v1
  description: The consumer and the target belong to one team. It states no `narrows`.
spec:
  appliesTo: [conduit]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: team-on-one-host.v1
  description: A composition of the shared-host requirement and `same-team.v1`.
spec:
  appliesTo: [conduit]
  constituents:
    host:
      requirement: github.com/shrav-k/conduit/core#shared-host.v1
    team:
      requirement: '#same-team.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: team-read
spec:
  capability: example.org/files#directory-access.v1
  operations:
    - example.org/files#directory.read.v1
  requirements:
    team:
      requirement: '#team-on-one-host.v1'
