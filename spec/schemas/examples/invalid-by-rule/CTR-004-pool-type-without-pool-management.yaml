# Example. One document, valid against the schemas, that must be rejected:
# a Type of the family Pool offers the core package's capability `pool-management.v1`, and
# this one does not. No Conduit that carries that capability could be instantiated to a Pool
# of this type, so nothing could be registered into it, set up, retired or inspected. A
# schema cannot tell: the profile has no keyword that says a list holds a value.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: archive-pool.v1
  description: A Pool of archived directories.
spec:
  family: Pool
  schema:
    type: object
    additionalProperties: false
  offers: []
  requires: []
  placement: {}
