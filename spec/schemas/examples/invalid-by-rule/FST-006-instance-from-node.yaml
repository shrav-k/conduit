# Example. One document, valid against the schemas, that must be rejected:
# no instance document is made from the core package's template `node`, nor from
# `system`, `management`, `access` or `root` (FST-006). The engine alone makes a node,
# for each machine that the machine provider reports (PLC-026). A schema cannot tell: only
# resolving `from` says which template it names.
# The names of ruling 42 (docs/proposals/ruling-42/log-rename-a.md) renamed this file from
# FST-006-instance-from-location.yaml, the template `location` to `node` and the machines
# provider to the machine provider.

apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: laptop
from: github.com/shrav-k/conduit/core#node
owner: system
