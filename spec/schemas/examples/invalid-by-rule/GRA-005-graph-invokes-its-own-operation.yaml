# Example. One document, valid against the schemas, that must be rejected:
# a graph invokes the operation it implements. A step with no `conduit` invokes the
# implementation selected for its own instance (GRA-024), which for `directory.list.v1` is
# this graph, so each request would invoke the graph again without end. A schema cannot
# tell: it needs the key of the `implementation` map beside the step's `operation`.

apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: project-directory
spec:
  type: example.org/files#local-directory.v1
  config:
    path: /srv/checkout
  implementation:
    example.org/files#directory.list.v1:
      steps:
        again:
          operation: example.org/files#directory.list.v1
          arguments:
            path: {source: input, name: path}
      outputs:
        entries:
          value: {source: step, step: again, output: entries}
