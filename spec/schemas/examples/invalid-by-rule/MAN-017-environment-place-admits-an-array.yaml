# Example. One set of documents. Each is valid alone, and together they must be rejected:
# an item's `environment` points at no place at which the type's schema admits an object or
# an array (MAN-017), because a variable holds a string. `files-server` in
# ../valid/files-package/, the default implementation of `example.org/files#directory.read.v1`
# that the type `tagged-directory.v1` states, gives its variable `FILES_ROOT` the place
# `/path`, and the type requires `path` but gives it `type: array`.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: tagged-directory.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      path:
        type: array
        items: {type: string, minLength: 1}
    required: [path]
  requires:
    - example.org/files#directory.read.v1
  implementation:
    example.org/files#directory.read.v1: example.org/files#files-server
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: tagged-folder
spec:
  type: '#tagged-directory.v1'
