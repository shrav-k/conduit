# Example. One set of documents. Each is valid alone, and together they must be rejected: an
# item's `environment` points only at a place whose schema confines its value, by `type`,
# `enum` or `const`, to a string, a number, a boolean or null (MAN-017), because a variable
# holds a string. `files-server` in ../valid/files-package/, the
# default implementation of `example.org/files#directory.read.v1` that the type
# `any-directory.v1` states, gives its variable `FILES_ROOT` the place `/path`, and the type
# requires `path` but gives it the schema `{}`, which admits a map or a list.
# Ruling 44 (D06, as revised after the ruling; log
# docs/proposals/reaudit/round-6/log-d06-d12.md): an Operation contract states no default
# implementation, so the type here states the one that the operation's contract stated.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: any-directory.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      path: {}
    required: [path]
  requires:
    - example.org/files#directory.read.v1
  implementation:
    example.org/files#directory.read.v1: example.org/files#files-server
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: any-folder
spec:
  type: '#any-directory.v1'
