# Example. One set of documents. Each is valid alone, and together they must be rejected:
# an item binds no input that its Package marks `isRequired: true` to a place at which the
# type's schema admits null (MAN-017), since a place that holds null gives no argument.
# `listing` in ../valid/files-package/, the default implementation of
# `example.org/files#directory.list.v1` that the type `optional-listing.v1` states, gives its
# required argument `--root` the place `/path`, and the type requires `path` but lets it be
# null.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: optional-listing.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      path: {type: [string, 'null'], minLength: 1}
    required: [path]
  requires:
    - example.org/files#directory.list.v1
  implementation:
    example.org/files#directory.list.v1: example.org/files#listing
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: nullable-listing
spec:
  type: '#optional-listing.v1'
