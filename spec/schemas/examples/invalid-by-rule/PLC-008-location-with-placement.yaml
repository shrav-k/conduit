# Example. One document, valid against the schemas, that must be rejected:
# a location is its own placement, so its document states none. A schema cannot tell: the
# document of any other Resource may state a placement, and only the type of the template
# says that this one is a location.

apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: build-host
from: github.com/shrav-k/conduit/core#location
owner: system
placement: local
arguments:
  facts:
    host: build-1
