# Example. One document, valid against the schemas, that must be rejected:
# `{entry: name}` is written only in an entry of a Pool template. From outside the Pool the
# Resource of an entry is written `{kind: Pool, name: <pool>, entry: <entry>}` (POOL-014).

apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: reviewer-cache
from: directory-read
consumer: {kind: Agent, name: reviewer-1}
target: {entry: cache}
