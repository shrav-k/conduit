# Example. One set of documents. Each is valid alone, and together they must be rejected:
# a `$ref` written `#name` names a Schema contract of the same project or package. Here
# `#directory.read.v1` names an Operation contract.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.read.v1
  description: Read the names of the entries of a directory.
spec:
  inputSchema:
    type: object
    properties:
      path: {type: string, minLength: 1}
    required: [path]
  outputSchema:
    type: object
    properties:
      entries:
        type: array
        items: {type: string}
    required: [entries]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: listing.v1
spec:
  type: object
  properties:
    entries: {$ref: '#directory.read.v1'}
