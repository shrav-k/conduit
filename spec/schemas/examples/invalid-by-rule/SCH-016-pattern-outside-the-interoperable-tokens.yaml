# Example. It passes the schemas, but its ECMA-262 lookahead is outside the interoperable
# tokens that SCH-016 permits, so the document is rejected under SCH-016.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: lookahead.v1
spec:
  type: string
  pattern: '^(?=a)a$'
