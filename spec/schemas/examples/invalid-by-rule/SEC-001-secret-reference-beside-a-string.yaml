# Example. One document, valid against the schemas, that must be rejected:
# `secret-reference.v1` governs a place only as the place's own schema, as `items`, or beside
# `{type: null}` under `anyOf` or `oneOf` (SEC-001). Beside `{type: string}`, a literal token
# would satisfy the second branch and be data, so the type is rejected. A schema cannot tell
# which branches stand beside a reference schema without knowing which schemas those are.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: git-remote.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      remote: {type: string, format: uri}
      token:
        anyOf:
          - $ref: github.com/shrav-k/conduit/core#secret-reference.v1
          - type: string
    required: [remote]
