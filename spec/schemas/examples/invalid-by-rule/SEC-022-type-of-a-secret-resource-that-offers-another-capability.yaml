# Example. One set of documents. Each is valid alone, and together they must be rejected:
# a Type that offers `secret-provider.v1` offers no other capability (SEC-022). The type
# `vault-secret.v1` also offers `vault-listing.v1`, whose operation would return what the
# store holds through any Conduit an actor may open. A store that lists or writes secrets
# does so through another Type, whose Resources are not secret Resources. A schema cannot
# tell without naming the core package's capability in `type-spec.v1`, which this tool's rule
# does instead.
# The names of ruling 42 (docs/proposals/ruling-42/log-rename-b.md) renamed `secret-reveal.v1`
# to `secret-provider.v1`. Its editorial fix E17 (docs/proposals/ruling-42/log-editorial.md)
# renamed this file, which was SEC-022-secret-store-type-that-offers-another-capability.yaml.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: vault.list.v1
  description: List the names of the secrets under the path that the configuration gives.
spec:
  outputSchema:
    type: object
    properties:
      names:
        type: array
        items: {type: string}
    required: [names]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: vault-listing.v1
  description: Listing the secrets of a store.
spec:
  operations:
    - '#vault.list.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: vault-secret.v1
  description: A secret kept in a vault, located by its path.
spec:
  family: Resource
  schema:
    type: object
    properties:
      path: {type: string, minLength: 1}
    required: [path]
  offers:
    - github.com/shrav-k/conduit/core#secret-provider.v1
    - '#vault-listing.v1'
