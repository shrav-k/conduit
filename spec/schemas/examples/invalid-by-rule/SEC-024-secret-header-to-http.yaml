# Example. One set of documents, with the manifest of their project. Each is valid alone, and
# together they must be rejected: a header that carries a secret is sent only to an `https`
# URL, or to an `http` URL whose host is a loopback address on an engine that can neither
# restart on another machine nor run as several parts (SEC-024). The item `status-board`, an
# existing server marked `plain`, is reached by `remote` at `http://board.example.org/mcp`, and
# its header `X-Board-Key` takes `/key`, a place that `secret-reference.v1` governs in the
# schema of the type `board.v1`, so every engine would send the secret across the network in
# clear. The same item at `http://127.0.0.1:8080/mcp` would be rejected only by an engine that
# can restart on another machine or run as several parts. An item that is not plain stands
# only at an `https` URL, which its schema states (IFC-044). A schema cannot tell this one:
# which place holds a secret is in the type, and the URL in the manifest.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
address: example.org/board
implementations:
  status-board:
    implements:
      - '#board.read.v1'
    remote:
      type: streamable-http
      url: http://board.example.org/mcp
      headers:
        - name: X-Board-Key
          isRequired: true
          isSecret: true
    headers:
      X-Board-Key: /key
    plain: true
    tools:
      '#board.read.v1': read_status
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: board.read.v1
  description: Read the status board.
spec:
  outputSchema:
    type: object
    properties:
      status: {type: string}
    required: [status]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: board.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      key: {$ref: github.com/shrav-k/conduit/core#secret-reference.v1}
    required: [key]
  requires:
    - '#board.read.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: status
spec:
  type: '#board.v1'
  implementation:
    '#board.read.v1': '#status-board'
