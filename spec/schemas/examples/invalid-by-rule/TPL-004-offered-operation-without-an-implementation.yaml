# Example. One set of documents. Each is valid alone, and together they must be rejected:
# a type's contract promises what its instances offer, so every operation of a capability
# that a template's type offers has an implementation when the template is registered
# (TPL-004). Here the type `notebook.v1` offers `notebook-access.v1`, which includes
# `notebook.read.v1`. The type does not list that operation under `requires` and states no
# default for it, no Operation contract states one (CTR-002), the engine does not implement it,
# and the template `notes` selects none. A schema cannot tell: it needs the type's contract,
# the capability's and the operation's.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: notebook.read.v1
  description: Read one page of a notebook.
spec:
  inputSchema:
    type: object
    properties:
      page: {type: integer, minimum: 1}
    required: [page]
  outputSchema:
    type: object
    properties:
      text: {type: string}
    required: [text]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: notebook-access.v1
spec:
  operations:
    - '#notebook.read.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: notebook.v1
spec:
  family: Resource
  schema:
    type: object
  offers:
    - '#notebook-access.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: notes
spec:
  type: '#notebook.v1'
