# Example. One document, valid against the schemas, that must be rejected:
# a step with no `conduit` names, as its `operation`, the stop operation of a runtime of its
# own instance. The type `local-directory.v1` declares the runtime `watcher`, whose `stop` is
# `watcher.stop.v1`. The engine stops each runtime that a retired instance still holds
# (TPL-009), and that stop is what ends the holding: a step that stopped the runtime itself
# would leave the instance holding a handle that its implementation no longer recognizes. A
# schema cannot tell: which operations are a runtime's is in the type's contract.

apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: project-directory
spec:
  type: example.org/files#local-directory.v1
  config:
    path: /srv/checkout
  retire:
    steps:
      stop-watching:
        operation: example.org/files#watcher.stop.v1
        arguments:
          watcher: {source: runtime, name: watcher}
