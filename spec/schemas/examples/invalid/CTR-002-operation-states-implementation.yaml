# Example. It must be rejected:
# an Operation contract of a package states no default implementation (CTR-002). A template's selection or its type's default chooses what runs
# (TPL-004), and the schema of an Operation's `spec` admits no key that CTR-002 does not name.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.list.v1
spec:
  inputSchema:
    type: object
    properties:
      path: {type: string, minLength: 1}
    required: [path]
  implementation: '#listing'
