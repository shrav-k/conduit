# Example. It must be rejected:
# only a property of an Operation contract's `inputSchema` may state a `default`, which the
# engine fills in where the input is not supplied (CTR-002, OPS-026). An output is not a
# supplied value, and no property of `outputSchema` states one.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.count.v1
spec:
  inputSchema:
    type: object
    properties:
      path: {type: string, minLength: 1}
    required: [path]
  outputSchema:
    type: object
    properties:
      count: {type: integer, minimum: 0, default: 0}
    required: [count]
