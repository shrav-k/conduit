# Example. Invalid: a constituent's `arguments` are value bindings (CTR-010, GRA-019), so a
# fixed value is written `{literal: 20}`. A bare value is not a binding.

apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: review-limit.v1
spec:
  appliesTo: [conduit]
  narrows: true
  constituents:
    rate:
      requirement: example.org/files#rate-limit.v1
      arguments:
        limit: 20
