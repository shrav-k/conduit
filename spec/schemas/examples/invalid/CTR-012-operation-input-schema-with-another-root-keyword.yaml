# Example. It must be rejected:
# the root of an Operation contract's `inputSchema` holds `type: object` and may hold
# `properties`, `required` and `additionalProperties`, and nothing else (CTR-012), so that each
# property is one input. This one says at its root, with `oneOf`, that exactly one of two
# inputs is given; the contract would say it in its description, or as two operations.

apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.find.v1
spec:
  inputSchema:
    type: object
    properties:
      name: {type: string, minLength: 1}
      pattern: {type: string, minLength: 1}
    oneOf:
      - required: [name]
      - required: [pattern]
  outputSchema:
    type: object
    properties:
      entries:
        type: array
        items: {type: string}
    required: [entries]
