# Example. Invalid: a page login's `page` holds user information, which no relayed URL may
# hold (CTR-013, IFC-049).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: signed-resource.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      account: {type: [string, 'null']}
    required: [account]
  requires:
  - github.com/shrav-k/conduit/core#sign-in-hook.v1
  - github.com/shrav-k/conduit/core#account-hook.v1
  - github.com/shrav-k/conduit/core#sign-out-hook.v1
  signIn:
    account: /account
    logins:
    - name: page
      return: page
      authorization: 'https://example.org/authorize'
      clientId: placeholder-resource-page
      page: 'https://user@example.org/code'
      carried: false
