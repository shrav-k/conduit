# Example. It must be rejected:
# the `conduit` of a step is the name of a declared Conduit or, for one made from a composite
# template, that name and the names of components, joined by single dots.

apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: mirror
spec:
  type: example.org/files#local-directory.v1
  conduits:
    checkout:
      from: directory-review
      target: {kind: Resource, name: scratch}
  setup:
    steps:
      read:
        operation: example.org/files#directory.read.v1
        conduit: checkout..read
        arguments:
          path: {literal: /srv/mirror}
