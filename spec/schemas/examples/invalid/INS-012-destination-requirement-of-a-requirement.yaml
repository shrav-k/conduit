# Example. It must be rejected:
# an input's destination is never the `requirement` of an applied requirement.

apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-read
spec:
  inputs:
    filter:
      schema: {$ref: github.com/shrav-k/conduit/core#qualified-reference.v1}
      to: [/requirements/rate/requirement]
  capability: example.org/files#directory-access.v1
  operations:
    - example.org/files#directory.read.v1
  requirements:
    rate:
      requirement: example.org/files#rate-limit.v1
      arguments:
        limit: 20
