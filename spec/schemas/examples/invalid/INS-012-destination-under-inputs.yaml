# Example. It must be rejected:
# an input's destination is never a place under `inputs`.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: console
spec:
  type: github.com/shrav-k/conduit/core#interface.v1
  inputs:
    title:
      schema: {type: string}
      to: [/config/title]
    fallback:
      schema: {type: string}
      to: [/inputs/title/default]
  config: {}
