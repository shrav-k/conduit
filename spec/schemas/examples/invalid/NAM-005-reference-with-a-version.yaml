# Example. It must be rejected:
# a qualified reference has no part that selects a release: the address names the package,
# and the manifest names its version. `@` is not a character of an address (NAM-001), so
# nothing written after the address can carry a version.

apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: project-directory
spec:
  type: example.org/files@0.3.0#local-directory.v1
