# Example. It must be rejected:
# a key that this specification does not define is rejected, and every key it defines is
# written in camelCase (OBJ-019). An entry of a Pool template holds `from`, `arguments` and
# `optional` (OBJ-014): the order of a Pool's entries comes from the entries they refer to
# (POOL-006, POOL-013), so an entry states no dependency of its own, as `depends_on` or
# otherwise.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: workspace
spec:
  type: github.com/shrav-k/conduit/core#pool.v1
  entries:
    cache:
      from: project-directory
      arguments:
        path: /var/cache/workspace
    checkout:
      from: project-directory
      arguments:
        path: /srv/checkout
      depends_on: [cache]
