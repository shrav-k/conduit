# Example. It must be rejected:
# no graph states `supports`, wherever it is written. A graph supports a requirement where
# the implementation selected for each of its steps that has no `conduit` does.

apiVersion: github.com/shrav-k/conduit/v0
address: example.org/files
version: 0.3.0
implementations:
  listing:
    implements: ['#directory.list.v1']
    graph:
      steps:
        read:
          operation: '#directory.read.v1'
          arguments:
            path: {source: input, name: path}
      outputs:
        entries:
          value: {source: step, step: read, output: entries}
    supports: ['#rate-limit.v1']
