# Example. It must be rejected:
# a plain implementation gives `tools` and states no `supports` (PKG-020), whether it is
# reached by `command`, `package` or `remote`.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
address: example.org/files
version: 0.3.0
implementations:
  legacy-reader:
    implements: ['#directory.read.v1']
    remote:
      type: streamable-http
      url: https://files.example.org/mcp
    plain: true
    tools:
      '#directory.read.v1': read_directory
    supports: ['#rate-limit.v1']
