# Example. It must be rejected:
# `multipleOf` is outside the profile: the profile holds JSON Schema 2020-12's validation
# vocabulary less that one keyword (SCH-002).

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: page-size.v1
spec:
  type: integer
  minimum: 10
  multipleOf: 10
