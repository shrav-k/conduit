# Example. The manifest of a package, in the form spec/promises/manifest.yaml gives. Every
# name under example.org is invented, and each digest is illustrative: it is not the digest
# of a real archive.
#
# It shows: the package's own `address` and `version` (PKG-017); a package it uses, with
# `fetch` (NAM-006, NAM-012); `exports`, with one re-export (PKG-018, MAN-008); and the three
# ways an implementation is reached (PKG-019), one of them a plain server (PKG-020).

apiVersion: github.com/shrav-k/conduit/v0
address: example.org/files
version: 0.3.0

packages:
  example.org/common:
    version: 2.0.1
    digest: sha256:9b1c0d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c
    fetch: https://example.org/downloads/common-2.0.1.tar.gz

exports:
  - local-directory.v1
  - directory-access.v1
  - directory.establish.v1
  - directory.read.v1
  - directory.list.v1
  - watcher.start.v1
  - watcher.stop.v1
  - set-read-limit.v1
  - local-paths.v1
  - rate-limit.v1
  - read-limit.v1
  # A re-export: `example.org/files#timestamp.v1` resolves to the export of that name of
  # `example.org/common`.
  - example.org/common#timestamp.v1

implementations:
  files-server:
    implements:
      - '#directory.establish.v1'
      - '#directory.read.v1'
      - '#watcher.start.v1'
      - '#watcher.stop.v1'
      - '#set-read-limit.v1'
    command: [bin/files-server, --stdio]
    supports:
      - '#rate-limit.v1'
    placement:
      local-paths:
        requirement: '#local-paths.v1'
  listing:
    implements:
      - '#directory.list.v1'
    graph:
      steps:
        read:
          operation: '#directory.read.v1'
          arguments:
            path: {source: input, name: path}
      outputs:
        entries:
          value: {source: step, step: read, output: entries}
  legacy-reader:
    implements:
      - '#directory.read.v1'
    url: https://files.example.org/mcp
    plain: true
    tools:
      '#directory.read.v1': read_directory
