# Example. The manifest of a package, in the form spec/promises/manifest.yaml gives. Every
# name under example.org is invented, and each digest and hash is illustrative: none is that
# of a real file.
#
# It shows: the package's own `address` and `version` (PKG-017); a package it uses, with
# `fetch` (NAM-006, NAM-012); `exports`, which names its own documents alone (PKG-018,
# MAN-007); and the three ways an implementation is reached (PKG-019, MAN-010): a `command`,
# a `package` of server.json pinned by its `fileSha256`, and a `remote`, which is a plain
# server (PKG-020). Each takes values from the instance's configuration: `environment` for the
# command, `packageArguments` for the package and `headers` for the remote, each a JSON Pointer
# into the configuration (OBJ-016), which the type's schema requires where a template selects
# the item (MAN-017).
#
# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06) gave `legacy-reader` a label
# selector, so that examples/invalid-by-rule/ can show two selected items that name one label
# with different values (PLC-025, row 26 of the coordinator's decisions).
# The names of ruling 42 (docs/proposals/ruling-42/log-rename-a.md) renamed the key `placement`
# of `files-server` and `legacy-reader` to `nodeSelector`.
# The names of ruling 42 (the vocabulary audit's N6 and N7; log
# docs/proposals/ruling-42/log-rename-b.md) renamed the key `arguments` of `listing` to
# `packageArguments`, and moved the hash of its artifact from the item's `digest`, which is
# gone, to its Package's `fileSha256`.
# Ruling 44 (docs/proposals/ruling-44/README.md, 2026-11-07), applied with round 6 of the
# re-audit (D14; log docs/proposals/reaudit/round-6/log-core.md), added `directory.find.v1` to
# `exports` and to what `files-server` implements.

apiVersion: github.com/shrav-k/conduit/v0
address: example.org/files
version: 0.3.0

packages:
  example.org/common:
    version: 2.0.1
    digest: sha256:9b1c0d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c
    fetch: https://example.org/downloads/common-2.0.1.tar.gz

exports:
  - local-directory.v1
  - directory-access.v1
  - directory.establish.v1
  - directory.read.v1
  - directory.list.v1
  - directory.find.v1
  - watcher.start.v1
  - watcher.stop.v1
  - set-read-limit.v1
  - rate-limit.v1
  - read-limit.v1

implementations:
  # A program of the package. It also implements the core package's setup hook, which a
  # template may select (TPL-017), and it is the one item that is run for an instance of
  # `local-directory.v1` (TPL-019). Its variable `FILES_ROOT` takes the instance's `/path`.
  files-server:
    implements:
      - '#directory.establish.v1'
      - '#directory.read.v1'
      - '#directory.list.v1'
      - '#directory.find.v1'
      - '#watcher.start.v1'
      - '#watcher.stop.v1'
      - '#set-read-limit.v1'
      - github.com/shrav-k/conduit/core#setup-hook.v1
    command: [bin/files-server, --stdio]
    environment:
      FILES_ROOT: /path
    supports:
      - '#rate-limit.v1'
    nodeSelector:
      kubernetes.io/os: linux
  # A server published to a registry, as one server.json Package, pinned by the SHA-256 of
  # its package file in `fileSha256`. Its named argument `--root` takes the instance's
  # `/path`. A runtime provider that runs `npm` packages runs it (PRV-012). The hash does not
  # pin what npm resolves for this artifact's dependencies, and the `command` of files-server
  # pins nothing (MAN-010; first build finding 1-18).
  listing:
    implements:
      - '#directory.list.v1'
    package:
      registryType: npm
      identifier: '@example/directory-listing'
      version: 1.2.0
      fileSha256: 4c2e8a1f0b9d7e6c5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
      transport:
        type: stdio
      packageArguments:
        - type: named
          name: --root
          isRequired: true
    packageArguments:
      --root: /path
  # A remote server that knows nothing of this specification, as one server.json Remote
  # reached over Streamable HTTP. Its header `X-Directory` takes the instance's `/path`. It
  # reads the directories of Windows machines alone, so its label selector asks for them
  # (PLC-007), and a template that selects it with `files-server` is rejected (PLC-025).
  legacy-reader:
    implements:
      - '#directory.read.v1'
    remote:
      type: streamable-http
      url: https://files.example.org/mcp
      headers:
        - name: X-Directory
          isRequired: true
    headers:
      X-Directory: /path
    nodeSelector:
      kubernetes.io/os: windows
    plain: true
    tools:
      '#directory.read.v1': read_directory
