# Example. One contract of each of the five kinds, and the further contracts the example
# project needs. Every name under example.org is invented.
#
# Inside the package, one document refers to another as `#name` (NAM-022). A `$ref` does the
# same for a Schema contract of the package (SCH-015): `directory.read.v1` and
# `set-read-limit.v1` each state an input with `#read-limit.v1`.
#
# It also shows: an Operation's input with a `default`, which the engine fills in where the
# input is not supplied (CTR-002, OPS-026); a control, whose `changes` maps its input to the
# setting that input sets (CTR-006); a Type that declares a runtime and states
# `restoresRuntimes` and `records` (CTR-004); a Requirement that states `obliges`
# (CTR-005); a composed Requirement, whose constituent takes its argument from an input
# of the composition (CTR-010); and an Operation that arranges later work, marked
# `arrangesLaterWork: true` (CTR-002, ACC-019).

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: read-limit.v1
  description: How many entries one read may return.
spec:
  type: integer
  minimum: 1
  maximum: 100
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.establish.v1
  description: Make sure the directory exists, and return its full path.
spec:
  inputs:
    path:
      schema: {type: string, minLength: 1}
  outputs:
    directory:
      schema: {type: string}
  effect: Creates the directory if it is absent.
  deduplicates: true
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.read.v1
  description: Read the names of the entries of a directory.
spec:
  inputs:
    path:
      schema: {type: string, minLength: 1}
    # An input with a `default` may be left out, although it is not marked optional: the
    # step `read` of the implementation `listing` gives it no value, and the engine fills in
    # 50 before it dispatches the step.
    maxEntries:
      schema: {$ref: '#read-limit.v1'}
      default: 50
  outputs:
    entries:
      schema:
        type: array
        items: {type: string}
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.list.v1
  description: List a directory. Implemented by a graph that calls `directory.read.v1`.
spec:
  inputs:
    path:
      schema: {type: string, minLength: 1}
  outputs:
    entries:
      schema:
        type: array
        items: {type: string}
  implementation: '#listing'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: watcher.start.v1
  description: Start watching a directory. The start operation of the runtime `watcher`.
spec:
  inputs:
    directory:
      schema: {type: string, minLength: 1}
  outputs:
    watcher:
      handle: true
  effect: Starts a process that watches the directory.
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: watcher.stop.v1
  description: Stop watching. The stop operation of the runtime `watcher`.
spec:
  inputs:
    watcher:
      handle: true
  effect: Stops the process that watches the directory.
  implementation: '#files-server'
---
# An operation that arranges later work: the sweep runs after this invocation has ended, so
# the contract carries the mark (CTR-002). The work is tied to the Conduit through which it
# was arranged, and is not started once that Conduit is closed (ACC-019). The output names
# the work (IFC-016).
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.sweep.v1
  description: Arrange for the stale entries of a directory to be removed after a delay.
spec:
  inputs:
    path:
      schema: {type: string, minLength: 1}
    after:
      schema: {type: string, format: duration}
  outputs:
    sweep:
      schema: {type: string, minLength: 1}
  effect: Arranges a sweep, which removes the stale entries of the directory when it runs.
  arrangesLaterWork: true
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: set-read-limit.v1
  description: >-
    A control. Change how many entries one read may return. Its result states `settings`,
    a map keyed by the pointer of `changes`: `{/readLimit: 15}` after it confirmed 15.
spec:
  inputs:
    limit:
      schema: {$ref: '#read-limit.v1'}
      optional: true
    revision:
      schema: {$ref: github.com/shrav-k/conduit/core#revision.v1}
  outputs:
    settings:
      schema: {type: object}
  effect: Changes the read limit of the directory.
  # The input `limit` sets the setting at `/readLimit` in the configuration.
  changes:
    limit: /readLimit
  deduplicates: true
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: directory-access.v1
  description: >-
    Reading a directory, arranging a sweep of it and changing its read limit. An invocation
    of one of these operations whose outcome is unknown is reconciled through a Conduit to
    the Pool that owns the directory (ACC-033), so this capability does not include
    `reconcile.v1`.
spec:
  operations:
    - '#directory.read.v1'
    - '#directory.list.v1'
    - '#directory.sweep.v1'
    - '#set-read-limit.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: local-directory.v1
  description: A directory on the host of its location.
spec:
  family: Resource
  schema:
    type: object
    properties:
      path: {type: string, minLength: 1}
      readLimit: {type: integer, minimum: 1, maximum: 100, default: 10}
      cache: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      # A default that is a map is checked after the defaults of its own properties are
      # filled in (SCH-010, SCH-019): `{}` satisfies `required: [depth]` once `depth` has
      # taken its default, 1.
      listing:
        type: object
        properties:
          depth: {type: integer, minimum: 1, default: 1}
        required: [depth]
        additionalProperties: false
        default: {}
    required: [path]
    additionalProperties: false
  offers:
    - '#directory-access.v1'
  requires:
    - '#directory.establish.v1'
    - '#directory.read.v1'
    - '#directory.list.v1'
    - '#directory.sweep.v1'
    - '#set-read-limit.v1'
  # Every instance of the type has this runtime, whatever its template declares. A runtime
  # is not marked optional: the step that starts it may be (TPL-006).
  runtimes:
    watcher:
      start: '#watcher.start.v1'
      stop: '#watcher.stop.v1'
  implementation:
    '#directory.list.v1': '#listing'
  controls:
    - '#set-read-limit.v1'
  placement:
    local-paths:
      requirement: '#local-paths.v1'
  conditions: [watching]
  # The implementation may keep the watcher alive itself (OBS-005), and the records about a
  # directory keep the inputs of its operations and not their outputs (REC-002).
  restoresRuntimes: true
  records:
    inputs: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: local-paths.v1
  description: A requirement on placement. The location gives access to local paths.
spec:
  appliesTo: [placement]
  schema:
    type: object
    properties:
      localPaths: {const: true}
    required: [localPaths]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: rate-limit.v1
  description: A filter or a policy. No more than `limit` requests in a minute.
spec:
  appliesTo: [conduit, policy]
  narrows: true
  # The implementation of the target must always state a requirement that narrows requests
  # in `supports`, as `files-server` does in the manifest. Naming `target` says so and adds
  # nothing; naming `consumer` would add the implementations selected for the consumer.
  obliges: [target]
  inputs:
    limit:
      schema: {type: integer, minimum: 1}
---
# A composition (CTR-005, CTR-010). Its one constituent is `rate-limit.v1`, whose input
# `limit` takes the value of the composition's own input `per-minute`. It narrows because
# its constituent does, and it is applied to a Conduit, where its constituent may be
# applied. An implementation that states `rate-limit.v1` in `supports` supports it.
apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: review-limit.v1
  description: A filter for a reviewer. It forwards its one input to `rate-limit.v1`.
spec:
  appliesTo: [conduit]
  narrows: true
  inputs:
    per-minute:
      schema: {type: integer, minimum: 1}
      default: 10
  constituents:
    rate:
      requirement: '#rate-limit.v1'
      arguments:
        limit: {source: input, name: per-minute}
