# Example. One contract of each of the five kinds, and the further contracts the example
# project needs. Every name under example.org is invented.
#
# Inside the package, one document refers to another as `#name` (NAM-022). A `$ref` does the
# same for a Schema contract of the package (SCH-015): `directory.read.v1` and
# `set-read-limit.v1` each state an input with `#read-limit.v1`.
#
# It also shows: Operation contracts written as the Model Context Protocol writes a tool,
# with `inputSchema` and `outputSchema` (CTR-002, CTR-012), one of them with a hint; an
# input with a `default`, which the engine fills in where the input is not supplied
# (OPS-026); an output and an input that are handles, whose schema is the core package's
# `handle.v1` (IFC-011); a control, whose `changes` maps its input to the setting that input
# sets and whose `inputSchema` requires `revision` alone (CTR-006); a Type with a label
# selector as its `placement`, a default implementation and `records` (CTR-004); and a
# Requirement, which a Conduit applies as a filter (CTR-005).

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: read-limit.v1
  description: How many entries one read may return.
spec:
  type: integer
  minimum: 1
  maximum: 100
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.establish.v1
  description: >-
    Make sure the directory exists, and return its full path and when it was made. The
    template `project-directory` of the example project selects the setup hook of
    `files-server`, which does this once its instance is set up.
spec:
  inputSchema:
    type: object
    properties:
      path: {type: string, minLength: 1}
    required: [path]
  outputSchema:
    type: object
    properties:
      directory: {type: string}
      created: {$ref: example.org/common#timestamp.v1}
    required: [directory]
  effect: Creates the directory if it is absent.
  deduplicates: true
  destructiveHint: false
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.read.v1
  description: Read the names of the entries of a directory.
spec:
  inputSchema:
    type: object
    properties:
      path: {type: string, minLength: 1}
      # An input with a `default` may be left out: the engine fills in 50 before it
      # dispatches the request (OPS-026).
      maxEntries: {$ref: '#read-limit.v1', default: 50}
    required: [path]
  outputSchema:
    type: object
    properties:
      entries:
        type: array
        items: {type: string}
    required: [entries]
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: directory.list.v1
  description: >-
    List a directory, recursively. Its default implementation is `listing`; the type
    `local-directory.v1` states `files-server` as its own default, which comes first
    (TPL-004).
spec:
  inputSchema:
    type: object
    properties:
      path: {type: string, minLength: 1}
    required: [path]
  outputSchema:
    type: object
    properties:
      entries:
        type: array
        items: {type: string}
    required: [entries]
  implementation: '#listing'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: watcher.start.v1
  description: >-
    Start watching a directory, and return a handle that names the watch. The handle permits
    nothing, and no instance holds it: the caller passes it back to stop the watch.
spec:
  inputSchema:
    type: object
    properties:
      directory: {type: string, minLength: 1}
    required: [directory]
  outputSchema:
    type: object
    properties:
      watcher: {$ref: github.com/shrav-k/conduit/core#handle.v1}
    required: [watcher]
  effect: Starts watching the directory.
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: watcher.stop.v1
  description: Stop the watch that the handle names.
spec:
  inputSchema:
    type: object
    properties:
      watcher: {$ref: github.com/shrav-k/conduit/core#handle.v1}
    required: [watcher]
  effect: Stops watching the directory.
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Operation
metadata:
  name: set-read-limit.v1
  description: >-
    A control. Change how many entries one read may return. It applies exactly the value it
    is sent, or fails, and the engine then stores that value at `/readLimit` (REV-007).
spec:
  inputSchema:
    type: object
    properties:
      limit: {$ref: '#read-limit.v1'}
      revision: {$ref: github.com/shrav-k/conduit/core#revision.v1}
    required: [revision]
  effect: Changes the read limit of the directory.
  # The input `limit` sets the setting at `/readLimit` in the configuration.
  changes:
    limit: /readLimit
  deduplicates: true
  idempotentHint: true
  implementation: '#files-server'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Capability
metadata:
  name: directory-access.v1
  description: >-
    Reading and listing a directory and changing its read limit. An
    invocation of one of these operations whose outcome is unknown is reconciled through a
    Conduit to the Pool that owns the directory (ACC-033), so this capability does not include
    `reconcile.v1`.
spec:
  operations:
    - '#directory.read.v1'
    - '#directory.list.v1'
    - '#set-read-limit.v1'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: local-directory.v1
  description: A directory on the machine of its location.
spec:
  family: Resource
  schema:
    type: object
    properties:
      path: {type: string, minLength: 1}
      readLimit: {type: integer, minimum: 1, maximum: 100, default: 10}
      cache: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      # A default that is a map is checked after the defaults of its own properties are
      # filled in (SCH-010, SCH-019): `{}` satisfies `required: [depth]` once `depth` has
      # taken its default, 1.
      listing:
        type: object
        properties:
          depth: {type: integer, minimum: 1, default: 1}
        required: [depth]
        additionalProperties: false
        default: {}
    required: [path]
    additionalProperties: false
  offers:
    - '#directory-access.v1'
  requires:
    - '#directory.establish.v1'
    - '#directory.read.v1'
    - '#directory.list.v1'
    - '#set-read-limit.v1'
  # The type's default comes before the one the operation's contract states (TPL-004), so an
  # instance has `files-server` alone as its item that is run (TPL-019).
  implementation:
    '#directory.list.v1': '#files-server'
  controls:
    - '#set-read-limit.v1'
  # A label selector (PLC-007): an instance is placed only on a location whose machine is
  # reported with this label and value, and `files-server` asks for the same (PLC-025).
  placement:
    kubernetes.io/os: linux
  conditions: [watching]
  # The records about a directory keep the inputs of its operations and not their outputs
  # (REC-002).
  records:
    inputs: true
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Requirement
metadata:
  name: rate-limit.v1
  description: >-
    A filter. No more than `limit` requests in a minute. The implementations of the target
    that a Conduit lists apply it, and so state it in `supports`, as `files-server` does
    (CON-022).
spec:
  inputs:
    limit:
      schema: {type: integer, minimum: 1}
