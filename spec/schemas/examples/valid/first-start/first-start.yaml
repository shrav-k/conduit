# Example. The instance documents of the five first-start objects (FST-001), written out to
# show what first start makes. An engine makes these objects itself at first start; it is not
# handed this file, and what triggers first start is DL6 of the implementation-defined list.
# Each document is valid against the schemas, and submitting them is rejected: an instance
# document made from the template `system`, `node`, `management`, `access` or `root` is
# rejected under FST-006, and the five names are taken from first start under OBJ-002. They
# refer only to the core package, so no manifest is needed (NAM-020).
#
# The three Conduits of FST-002 are not written here: they are the declared Conduits of the
# template `root`, and are instantiated with it (CON-002): management from root-management,
# access from root-access and system from root-pool, targeting Pool system. Their provenance
# cause is first-start. Root has no cascade tool (FLEET-005).
# The engine names a unique SPIFFE trust domain at first start and records trustDomain in
# system status (FST-007); this is engine state, never a field of an instance document.
#
# `local` is the node that represents the machine the engine runs on (PLC-026). A node has an
# empty configuration and is its own placement (PLC-008): its labels are what the machine
# provider reports for its machine, held in its status, and no document writes them.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: system
from: github.com/shrav-k/conduit/core#system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: local
from: github.com/shrav-k/conduit/core#node
owner: system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: management
from: github.com/shrav-k/conduit/core#management
owner: system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: access
from: github.com/shrav-k/conduit/core#access
owner: system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: root
from: github.com/shrav-k/conduit/core#root
