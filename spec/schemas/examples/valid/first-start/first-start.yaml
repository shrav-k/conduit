# Example. The instance documents of the five first-start objects (FST-001), written out to
# show what first start makes. An engine makes these objects itself at first start; it is not
# handed this file, and what triggers first start is DL6 of the implementation-defined list.
# Each document is valid against the schemas, and submitting them is rejected: an instance
# document made from the template `system`, `location`, `management`, `access` or `root` is
# rejected under FST-006, and the five names are taken from first start under OBJ-002. They
# refer only to the core package, so no manifest is needed (NAM-020).
#
# The two Conduits of FST-002 are not written here: they are the declared Conduits of the
# template `root`, and are instantiated with it (CON-002).
#
# `local` is the location of the machine the engine runs on (PLC-026). A location has an
# empty configuration and is its own placement (PLC-008): its labels are what the machines
# provider reports for its machine, held in its status, and no document writes them.

apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: system
from: github.com/shrav-k/conduit/core#system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: local
from: github.com/shrav-k/conduit/core#location
owner: system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: management
from: github.com/shrav-k/conduit/core#management
owner: system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: access
from: github.com/shrav-k/conduit/core#access
owner: system
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: root
from: github.com/shrav-k/conduit/core#root
