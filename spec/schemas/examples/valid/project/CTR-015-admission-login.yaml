# Example. Valid: the admission shape of a login Resource Type (CTR-015).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Type
metadata:
  name: login-holder.v1
spec:
  family: Resource
  schema:
    type: object
    properties:
      account:
        type:
        - string
        - 'null'
      admission:
        type: object
        properties:
          billing:
            enum:
            - included
            - paid-from-first-token
          paidUsage:
            enum:
            - allow
            - refuse
            - refuse-if-possible
          whenUnknown:
            enum:
            - refuse
            - one-trial
            - admit
        required:
        - billing
        - paidUsage
        - whenUnknown
        if:
          properties:
            whenUnknown:
              const: admit
          required:
          - whenUnknown
        then:
          properties:
            paidUsage:
              const: allow
    required:
    - account
    - admission
  signIn:
    account: /account
    logins:
    - name: browser
      return: redirect
      authorization: https://example.org/authorize
      clientId: placeholder-signed-agent
      redirect:
        host: 127.0.0.1
        ports:
        - 8400
        - 8401
        path: /callback
      carried: true
    - name: device
      return: device
      authorization: https://example.org/device
      clientId: placeholder-signed-agent
  requires:
  - github.com/shrav-k/conduit/core#account-hook.v1
  - github.com/shrav-k/conduit/core#sign-in-hook.v1
  - github.com/shrav-k/conduit/core#sign-out-hook.v1
  - github.com/shrav-k/conduit/core#admission-hook.v1
  implementation:
    github.com/shrav-k/conduit/core#account-hook.v1: example.org/acme/admission#resource
    github.com/shrav-k/conduit/core#sign-in-hook.v1: example.org/acme/admission#resource
    github.com/shrav-k/conduit/core#sign-out-hook.v1: example.org/acme/admission#resource
    github.com/shrav-k/conduit/core#admission-hook.v1: example.org/acme/admission#resource
    example.org/acme/admission#set-admission.v1: example.org/acme/admission#resource
  admission:
    levers: /admission
    control: example.org/acme/admission#set-admission.v1
  controls:
  - example.org/acme/admission#set-admission.v1
