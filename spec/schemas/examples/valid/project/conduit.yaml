# Example. The manifest of a submitted project. The project holds contracts and lists
# implementations, so it states `address`, under which they are named `address#name` outside
# its own documents (MAN-015, SUB-008); it states no `version`, which only a package's
# manifest must state (PKG-017, MAN-004). Every name under example.org is invented, and each
# digest is illustrative: it is not the digest of a real archive.
#
# The core package is not listed, and may not be (NAM-020, NAM-021). Every package listed is
# installed before the project is registered (PKG-006).
# The names of ruling 42 (docs/proposals/ruling-42/log-rename-b.md) renamed `reveal-secret.v1`
# to `get-secret.v1`. Its editorial fix E17 (docs/proposals/ruling-42/log-editorial.md) calls
# `keychain-store` an implementation of `get-secret.v1`, where it said a secret store's server.

apiVersion: github.com/shrav-k/conduit/v0
address: example.org/review-desk

packages:
  example.org/files:
    version: 0.3.0
    digest: sha256:0f3a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4
  example.org/harness:
    version: 1.4.0
    digest: sha256:5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f
    fetch: https://example.org/downloads/harness-1.4.0.tar.gz

implementations:
  # A runtime provider's server, which runs implementation items in Docker containers. The
  # engine's own runner runs it (PRV-002).
  docker-runner:
    implements:
      - github.com/shrav-k/conduit/core#run.v1
      - github.com/shrav-k/conduit/core#stop.v1
      - github.com/shrav-k/conduit/core#inspect-run.v1
    command: [bin/docker-runner]
  # An implementation of `get-secret.v1`, which reads the macOS keychain item that its
  # instance's configuration locates (SEC-006).
  keychain-store:
    implements:
      - github.com/shrav-k/conduit/core#get-secret.v1
    command: [bin/keychain-store]
  # An existing server, found by name, that mirrors a Git repository. Its variables take the
  # remote and the token from the configuration: `/token` is a place that
  # `secret-reference.v1` governs, so the engine reads the secret before each run and the
  # runtime provider sets `GIT_TOKEN` to its value (SEC-010, PRV-011).
  git-mirror-server:
    implements:
      - '#mirror.sync.v1'
    command: [git-mirror-mcp]
    environment:
      GIT_REMOTE: /remote
      GIT_TOKEN: /token
