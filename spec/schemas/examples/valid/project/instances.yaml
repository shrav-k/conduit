# Example. One instance document of each family, made from the templates in templates.yaml.
# The node `local` and the Resource `access` exist from first start (FST-001).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Fleet
metadata:
  name: reviewers
from: github.com/shrav-k/conduit/core#fleet
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: team
from: workspace
arguments:
  node: local
---
# A Resource states its owner (POOL-001). The kind of `owner` and of `placement` is fixed, so
# the name alone is written (OBJ-006).
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: scratch
  description: A directory outside the entries of the Pool `team`, and owned by it (POOL-004).
from: project-directory
owner: team
placement: local
arguments:
  path: /tmp/scratch
---
# A runtime provider runs on the engine's own runner, on `local` (PRV-002).
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: docker
from: docker-context
owner: team
placement: local
arguments:
  context: desktop-linux
---
# The reference to the Resource of a Pool's entry, from outside the Pool (POOL-014). The
# Agent names the runtime provider that runs it, for its whole life (PRV-006); one that names
# none runs on the engine's own runner.
apiVersion: github.com/shrav-k/conduit/v0
kind: Agent
metadata:
  name: reviewer-1
from: reviewer
owner: reviewers
placement: {kind: Resource, name: local}
runtime: docker
arguments:
  checkout: {kind: Pool, name: team, entry: checkout}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: operator
from: console
---
# A Conduit instantiated on its own (CON-012). `consumer` and `target` each accept more than
# one kind, so each is written with its kind (OBJ-013).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: reviewer-scratch
from: directory-read
consumer: {kind: Agent, name: reviewer-1}
target: {kind: Resource, name: scratch}
arguments:
  limit: 10
---
# A right to open with a bound: a Conduit to `access`, made from a template that applies
# `bound.v1` (ACC-029, CON-028).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: operator-access
from: team-access
consumer: {kind: Interface, name: operator}
target: {kind: Resource, name: access}
---
# A secret Resource (SEC-002). Its configuration locates the secret; the value stays in the
# keychain.
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: github-token
from: keychain-secret
owner: team
arguments:
  service: github.com
  account: review-desk
---
# A Resource that reads that secret. Its `token` is a secret reference, written with its kind
# (SEC-001). Its declared Conduit to `github-token` is opened when it is set up only where the
# root Interface sent the setup (SEC-008), and the engine reads the token through it before
# each run (SEC-010, SEC-011).
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: mirror
from: git-mirror
owner: team
arguments:
  remote: https://github.com/example/review-desk.git
  token: {kind: Resource, name: github-token}
---
# An instance with no name: the engine generates one (OBJ-003).
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
from: {kind: Resource, name: project-directory}
owner: {kind: Pool, name: team}
arguments:
  path: /tmp/unnamed
