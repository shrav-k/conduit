# Example. The templates of a small project. Every name under example.org is invented; the
# contracts of `example.org/files` are in ../files-package/, and `example.org/harness` is not
# in this repository. The project's own contracts are in contracts.yaml.
# `workspace` has no `runtime` input: its entries run `bin/files-server`, a program inside
# a package, which only the engine's own runner runs (PRV-007).
#
# A Resource template with an input and a narrowed control, which selects a setup hook. The
# hook's implementation is `files-server`, the item that its type's operations already
# select, so an instance has one item that is run (TPL-019). The engine dispatches the hook
# once the instance's run is asked for (TPL-012, TPL-017). The control `set-read-limit.v1`
# keeps the contract's `limit`, from 1 to 100, and narrows it to at most 50: the tool for it
# that a consumer of a Conduit to an instance of this template is presented gives `limit` the
# schema `allOf` of the contract's, `#read-limit.v1`, and `{maximum: 50}`, so the consumer sees
# the limit that the engine enforces (IFC-033). A control of the type that `controls` did not
# list would have no tool (IFC-012).
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: project-directory
  description: A directory that Agents share.
  annotations:
    example.org/team: platform
spec:
  type: example.org/files#local-directory.v1
  inputs:
    path:
      schema: {type: string, minLength: 1}
      to: [/config/path]
    cache:
      schema: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      to: [/config/cache]
      optional: true
  config:
    readLimit: 10
  implementation:
    github.com/shrav-k/conduit/core#setup-hook.v1: example.org/files#files-server
  controls:
    example.org/files#set-read-limit.v1:
      inputs:
        limit:
          schema: {maximum: 50}
---
# A Pool template with two entries, one of which refers to the other (POOL-005). The input
# `node` supplies the placement of both entries (POOL-009). No input supplies a runtime
# provider: the item of both entries is `bin/files-server`, a program inside the package
# `example.org/files`, which only the engine's own runner runs (PRV-007), so both run there. A
# server meant to run under another runtime provider is published as a `package` item, pinned
# by its digest (MAN-010).
apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: workspace
spec:
  type: github.com/shrav-k/conduit/core#pool.v1
  config: {}
  inputs:
    node:
      schema: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      to: [/entries/cache/placement, /entries/checkout/placement]
      optional: true
  entries:
    cache:
      from: project-directory
      arguments:
        path: /var/cache/workspace
    checkout:
      from: project-directory
      arguments:
        path: /srv/checkout
        cache: {entry: cache}
---
# A Conduit template with two requirements: the shared-host requirement, which the engine
# decides when the Conduit is instantiated (PLC-013), and a filter, which the target's
# implementations apply (CON-018). The input `limit` fills an argument of the filter
# (INS-012).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-read
spec:
  inputs:
    limit:
      schema: {type: integer, minimum: 1}
      to: [/requirements/rate/arguments/limit]
      default: 20
  capability: example.org/files#directory-access.v1
  operations:
    - example.org/files#directory.read.v1
  requirements:
    same-machine:
      requirement: github.com/shrav-k/conduit/core#shared-host.v1
    rate:
      requirement: example.org/files#rate-limit.v1
      arguments:
        limit: 20
---
# A Conduit template that lists a control, like any operation (OPS-020).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-settings
spec:
  capability: example.org/files#directory-access.v1
  operations:
    - example.org/files#set-read-limit.v1
---
# An Agent template that declares a required and an optional Conduit. The target of the first
# is supplied by an input, whose schema fixes the kind, so that an argument may give the name
# alone (OBJ-006); the second names its target. The input `model` is checked against a Schema
# contract of the project itself, referred to as `#name` (SCH-015). The second Conduit is
# made from `#directory-settings`, the `#name` form of `from`, which in a submitted project
# resolves as the bare name does, among the templates that exist (INS-025).
apiVersion: github.com/shrav-k/conduit/v0
kind: Agent
metadata:
  name: reviewer
spec:
  type: example.org/harness#coding-agent.v1
  inputs:
    checkout:
      schema: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      to: [/conduits/checkout/target]
    model:
      schema: {$ref: '#model-name.v1'}
      to: [/config/model]
      default: standard
    max-entries:
      schema: {$ref: example.org/files#read-limit.v1}
      to: [/config/maxEntries]
      optional: true
  config: {}
  conduits:
    checkout:
      from: directory-read
    notes:
      from: '#directory-settings'
      target: {kind: Resource, name: scratch}
      optional: true
---
# An Interface template. An Interface has no keys of its own: its settings are in `config`.
# This template writes no `config`, which means the same as `config: {}` (INS-024).
apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: console
spec:
  type: github.com/shrav-k/conduit/core#interface.v1
---
# A Conduit template for a right to open that carries a bound (ACC-029). The bound is written
# like any other requirement, and the engine applies it itself. A template applies it at most
# once, and a Conduit made from this template must have `access` as its target (CON-028). Its
# consumer may open and close Conduits to the Pool `team` and to the Resources that Pool
# owns, for the two operations the bound names: one of a package, and one of this project,
# named by the address its manifest states (SUB-008).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: team-access
spec:
  capability: github.com/shrav-k/conduit/core#access-control.v1
  operations:
    - github.com/shrav-k/conduit/core#open.v1
    - github.com/shrav-k/conduit/core#close.v1
  requirements:
    bound:
      requirement: github.com/shrav-k/conduit/core#bound.v1
      arguments:
        pools: [team]
        operations:
          - example.org/files#directory.read.v1
          - example.org/review-desk#mirror.sync.v1
---
# A runtime provider: a Resource of a type that offers `runtime-provider.v1`. An instance
# names it in its standard argument `runtime` (PRV-006).
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: docker-context
spec:
  type: '#docker-runtime.v1'
  inputs:
    context:
      schema: {type: string, minLength: 1}
      to: [/config/context]
      default: default
---
# A secret Resource's template: its configuration is the locator of one keychain item.
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: keychain-secret
spec:
  type: '#keychain-secret.v1'
  inputs:
    service:
      schema: {type: string, minLength: 1}
      to: [/config/service]
    account:
      schema: {type: string, minLength: 1}
      to: [/config/account]
---
# The Conduit through which the engine reads a secret for its consumer. It lists
# `get-secret.v1`, so only the root Interface opens one, for a Resource or an Agent
# (SEC-008), and no request that its consumer sends through it is dispatched (SEC-007).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: secret-read
spec:
  capability: github.com/shrav-k/conduit/core#secret-provider.v1
  operations:
    - github.com/shrav-k/conduit/core#get-secret.v1
---
# A Resource whose configuration holds a secret reference. The input `token` puts the
# reference at `/config/token` and makes the secret Resource the target of the declared
# Conduit `token`, through which the engine reads it before each run (SEC-010). Its schema
# is `secret-reference.v1`, so the argument is written with its kind and never as a literal
# (SEC-001).
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: git-mirror
spec:
  type: '#git-mirror.v1'
  inputs:
    remote:
      schema: {type: string, format: uri}
      to: [/config/remote]
    token:
      schema: {$ref: github.com/shrav-k/conduit/core#secret-reference.v1}
      to: [/config/token, /conduits/token/target]
  conduits:
    token:
      from: secret-read
