# Example. The templates of a small project. Every name under example.org is invented; the
# contracts of `example.org/files` are in ../files-package/, and `example.org/harness` is not
# in this repository. The project's own contract is in contracts.yaml.

# A Resource template with an input, a runtime of its own, a setup graph and a narrowed
# control. Its instances have two runtimes: `watcher`, which the type `local-directory.v1`
# declares, and `path-watcher`, which the template declares. A step may name either
# (GRA-017). A template that declared a runtime named `watcher` would be rejected, because
# its type declares one of that name (TPL-006). A runtime is not marked optional; the steps
# that start these two are.
apiVersion: github.com/shrav-k/conduit/v0
kind: Resource
metadata:
  name: project-directory
  description: A directory that Agents share.
  annotations:
    example.org/team: platform
spec:
  type: example.org/files#local-directory.v1
  inputs:
    path:
      schema: {type: string, minLength: 1}
      to: [/config/path]
    cache:
      schema: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      to: [/config/cache]
      optional: true
  config:
    readLimit: 10
  runtimes:
    path-watcher:
      start: example.org/files#watcher.start.v1
      stop: example.org/files#watcher.stop.v1
  setup:
    steps:
      establish:
        operation: example.org/files#directory.establish.v1
        arguments:
          path: {source: config, pointer: /path}
      # Names the runtime that the type declares.
      watch:
        runtime: watcher
        arguments:
          directory: {source: step, step: establish, output: directory}
        optional: true
      # Names the runtime that this template declares.
      watch-path:
        runtime: path-watcher
        arguments:
          directory: {source: config, pointer: /path}
        dependsOn: [establish]
        optional: true
  controls:
    example.org/files#set-read-limit.v1:
      inputs:
        limit:
          schema: {maximum: 50}
---
# A Pool template with two entries, one of which refers to the other (POOL-005). The input
# `location` supplies the placement of both entries (POOL-009).
apiVersion: github.com/shrav-k/conduit/v0
kind: Pool
metadata:
  name: workspace
spec:
  type: github.com/shrav-k/conduit/core#pool.v1
  config: {}
  inputs:
    location:
      schema: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      to: [/entries/cache/placement, /entries/checkout/placement]
      optional: true
  entries:
    cache:
      from: project-directory
      arguments:
        path: /var/cache/workspace
    checkout:
      from: project-directory
      arguments:
        path: /srv/checkout
        cache: {entry: cache}
---
# A Conduit template with two requirements: the shared-host requirement and a filter. The
# input `limit` fills an argument of the filter (INS-012).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-read
spec:
  inputs:
    limit:
      schema: {type: integer, minimum: 1}
      to: [/requirements/rate/arguments/limit]
      default: 20
  capability: example.org/files#directory-access.v1
  operations:
    - example.org/files#directory.read.v1
  requirements:
    same-machine:
      requirement: github.com/shrav-k/conduit/core#shared-host.v1
    rate:
      requirement: example.org/files#rate-limit.v1
      arguments:
        limit: 20
---
# A Conduit template that lists a control, like any operation (OPS-020).
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-settings
spec:
  capability: example.org/files#directory-access.v1
  operations:
    - example.org/files#set-read-limit.v1
---
# A composite Conduit template (CON-019). It has components and no capability of its own.
# The two components show two of the four forms of `from`: the name of a template that
# exists, and `#` and a name. In a project that is not published, as this one is, the second
# resolves as the first does, among the templates that exist, of which this project's own
# are part (INS-025); in a package it would name a template of the package.
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: directory-review
spec:
  components:
    read:
      from: directory-read
      arguments:
        limit: 5
    settings:
      from: '#directory-settings'
---
# An Agent template that declares a required and an optional Conduit. The target of the first
# is supplied by an input, whose schema fixes the kind, so that an argument may give the name
# alone (OBJ-006); the second names its target. The input `model` is checked against a Schema
# contract of the project itself, referred to as `#name` (SCH-015).
apiVersion: github.com/shrav-k/conduit/v0
kind: Agent
metadata:
  name: reviewer
spec:
  type: example.org/harness#coding-agent.v1
  inputs:
    checkout:
      schema: {$ref: github.com/shrav-k/conduit/core#resource-reference.v1}
      to: [/conduits/checkout/target]
    model:
      schema: {$ref: '#model-name.v1'}
      to: [/config/model]
      default: standard
    max-entries:
      schema: {$ref: example.org/files#read-limit.v1}
      to: [/config/maxEntries]
      optional: true
  config: {}
  conduits:
    checkout:
      from: directory-read
    notes:
      from: directory-read
      target: {kind: Resource, name: scratch}
      arguments:
        limit: 5
      optional: true
---
# An Interface template. An Interface has no keys of its own: its settings are in `config`.
# This template writes no `config`, which means the same as `config: {}` (INS-024).
apiVersion: github.com/shrav-k/conduit/v0
kind: Interface
metadata:
  name: console
spec:
  type: github.com/shrav-k/conduit/core#interface.v1
---
# A Conduit template for a right to open that carries a bound (ACC-029). The bound is a
# filter, written like any other requirement. A template applies it at most once, and a
# Conduit made from this template must have `access` as its target (CON-028). Its consumer
# may open and close Conduits to the Pool `team` and to the Resources that Pool owns, for
# the one operation the bound names, which is an operation of a published package: a bound
# names operations by qualified reference only.
apiVersion: github.com/shrav-k/conduit/v0
kind: Conduit
metadata:
  name: team-access
spec:
  capability: github.com/shrav-k/conduit/core#access-control.v1
  operations:
    - github.com/shrav-k/conduit/core#open.v1
    - github.com/shrav-k/conduit/core#close.v1
  requirements:
    bound:
      requirement: github.com/shrav-k/conduit/core#bound.v1
      arguments:
        pools: [team]
        operations:
          - example.org/files#directory.read.v1
