# An instance document of each family, and the two nested instantiations.
# JSON Schema 2020-12, within spec/schema-profile.md.
#
# Promises encoded:
#   instance.v1            OBJ-013 (`from`, the standard arguments of the family as top-level
#                          keys, and `arguments`; `owner`, `consumer` and `target` are
#                          required, and `placement` and `runtime` may be left out), INS-001
#                          (no `spec`), OBJ-018, OBJ-004, POOL-001 (a Resource states its
#                          `owner`), PLC-006 (no `placement` on an Interface, a Pool or a
#                          Conduit), PRV-006 (`runtime` on an Agent or a Resource alone),
#                          CON-001 (a Conduit states one `consumer` and one `target`),
#                          OBJ-006 (`consumer` and `target` are written with their kind),
#                          CON-027
#   template-reference.v1  INS-025 (the four forms of `from`, which is not a selection),
#                          INS-002, OBJ-006, NAM-002, NAM-003, NAM-022, FST-005
#   declared-conduit.v1    OBJ-014 (no `consumer`), OBJ-015
#   pool-entry.v1          OBJ-014 (no `owner`, no `placement` and no `runtime`), POOL-009,
#                          POOL-012, OBJ-015
#
# Open, as OBJ-019 exempts: everything inside `arguments`. Because of that, a standard
# argument written under `arguments` (OBJ-013) is not caught here.
#
# `metadata` and `arguments` may each be left out, and then mean an instance with no given
# name and with no arguments (OBJ-013, OBJ-014). An `arguments` map that a nested
# instantiation leaves out is present and empty, as a `config` that is not written is, so an
# input's destination may lie inside it (INS-011).
#
# `owner`, `placement`, `runtime`, `consumer` and `target` are governed by the core package's
# reference schemas, which also accept the resolved form `{kind, id}`. Only the engine writes
# that form: it stores it in the place of a reference when the instance is made, and a
# submitted document that writes it is rejected by the engine (OBJ-009). A request that an
# actor makes on its own behalf names an object by a reference and never by an ID, and one
# that holds the form reports invalid (LIF-031). The schemas do not catch either.
#
# Not expressed here, and checked by the engine: that `from` resolves to a template of the
# right kind (INS-002, OBJ-007), and not to a template that first start alone instantiates
# (FST-006); that the arguments fit the template's inputs (INS-003 to INS-005, INS-009) and the
# resulting configuration its type (INS-014); that a reference resolves (OBJ-009), and to an
# instance of an accepted kind (CON-027); that `runtime` names a runtime provider (PRV-006),
# and that a provider is given no other placement and no `runtime` (PRV-002); placement
# (PLC-001, PLC-002, PLC-007, PLC-018, PRV-015); that the target offers the capability
# (CON-021); the shared-host requirement and filters (PLC-013, CON-022); that a Conduit whose
# template applies the bound of a right to open has `access` as its target (CON-028); retired
# ends (CON-025); tool names (IFC-014); and that `{entry: name}` is written only in an entry
# of a Pool template, and is rejected anywhere else (POOL-005).
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: instance.v1
  description: An instance document of any of the five families.
spec:
  anyOf:
  - $ref: '#/$defs/interface'
  - $ref: '#/$defs/agent'
  - $ref: '#/$defs/resource'
  - $ref: '#/$defs/pool'
  - $ref: '#/$defs/conduit'
  $defs:
    interface:
      type: object
      properties:
        apiVersion:
          $ref: github.com/shrav-k/conduit/core#api-version.v1
        kind:
          const: Interface
        metadata:
          $ref: github.com/shrav-k/conduit/core#instance-metadata.v1
        from:
          $ref: github.com/shrav-k/conduit/core#template-reference.v1
        arguments:
          type: object
      required:
      - apiVersion
      - kind
      - from
      additionalProperties: false
    agent:
      type: object
      properties:
        apiVersion:
          $ref: github.com/shrav-k/conduit/core#api-version.v1
        kind:
          const: Agent
        metadata:
          $ref: github.com/shrav-k/conduit/core#instance-metadata.v1
        from:
          $ref: github.com/shrav-k/conduit/core#template-reference.v1
        placement:
          $ref: github.com/shrav-k/conduit/core#resource-reference.v1
        runtime:
          $ref: github.com/shrav-k/conduit/core#resource-reference.v1
        arguments:
          type: object
      required:
      - apiVersion
      - kind
      - from
      additionalProperties: false
    resource:
      type: object
      properties:
        apiVersion:
          $ref: github.com/shrav-k/conduit/core#api-version.v1
        kind:
          const: Resource
        metadata:
          $ref: github.com/shrav-k/conduit/core#instance-metadata.v1
        from:
          $ref: github.com/shrav-k/conduit/core#template-reference.v1
        owner:
          $ref: github.com/shrav-k/conduit/core#pool-reference.v1
        placement:
          $ref: github.com/shrav-k/conduit/core#resource-reference.v1
        runtime:
          $ref: github.com/shrav-k/conduit/core#resource-reference.v1
        arguments:
          type: object
      required:
      - apiVersion
      - kind
      - from
      - owner
      additionalProperties: false
    pool:
      type: object
      properties:
        apiVersion:
          $ref: github.com/shrav-k/conduit/core#api-version.v1
        kind:
          const: Pool
        metadata:
          $ref: github.com/shrav-k/conduit/core#instance-metadata.v1
        from:
          $ref: github.com/shrav-k/conduit/core#template-reference.v1
        arguments:
          type: object
      required:
      - apiVersion
      - kind
      - from
      additionalProperties: false
    conduit:
      type: object
      properties:
        apiVersion:
          $ref: github.com/shrav-k/conduit/core#api-version.v1
        kind:
          const: Conduit
        metadata:
          $ref: github.com/shrav-k/conduit/core#instance-metadata.v1
        from:
          $ref: github.com/shrav-k/conduit/core#template-reference.v1
        consumer:
          $ref: github.com/shrav-k/conduit/core#consumer-reference.v1
        target:
          $ref: github.com/shrav-k/conduit/core#target-reference.v1
        arguments:
          type: object
        as:
          $ref: github.com/shrav-k/conduit/core#name.v1
      required:
      - apiVersion
      - kind
      - from
      - consumer
      - target
      additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template-reference.v1
  description: >-
    The value of `from`: the template an instance or a nested instantiation is made from. It has
    four forms. The name alone, or `{kind, name}`, names a template that exists. A qualified
    reference names a template that a package exports. `#` and a name names, in a document of a
    package, a template of the same package: a bare name is never looked up in a package, so a
    document of a package writes `#name` for a template of its own package. In a submitted
    project, `#name` resolves as the bare name does, among the templates that exist, of
    which the templates that the same submission registers are part (INS-025). The value of
    `from` is not a selection.
spec:
  anyOf:
    - $ref: github.com/shrav-k/conduit/core#name.v1
    - type: object
      properties:
        kind: {enum: [Interface, Agent, Resource, Pool, Conduit]}
        name: {$ref: github.com/shrav-k/conduit/core#name.v1}
      required: [kind, name]
      additionalProperties: false
    - $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
    - type: string
      pattern: '^#[a-z][a-z0-9-]*$'
      maxLength: 64
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: declared-conduit.v1
  description: >-
    One member of the `conduits` of an Interface, an Agent or a Resource template. Its consumer
    is the instance being made. An `arguments` map that is left out is present and empty.
spec:
  type: object
  properties:
    from: {$ref: github.com/shrav-k/conduit/core#template-reference.v1}
    target: {$ref: github.com/shrav-k/conduit/core#target-reference.v1}
    arguments: {type: object}
    optional: {type: boolean}
  required: [from]
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: pool-entry.v1
  description: >-
    One member of the `entries` of a Pool template: a nested instantiation of a Resource
    template. Its owner is the Pool, and an input of the Pool's template supplies its
    placement and its runtime provider, where one does. An `arguments` map that is left out
    is present and empty.
spec:
  type: object
  properties:
    from: {$ref: github.com/shrav-k/conduit/core#template-reference.v1}
    arguments: {type: object}
    optional: {type: boolean}
  required: [from]
  additionalProperties: false
