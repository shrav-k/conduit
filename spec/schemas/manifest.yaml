# The manifest of a project or a package, one item of its `implementations`, and the two
# shapes of the Model Context Protocol Registry's server.json that an item may hold. The
# file's name, its keys and the layout of an archive are promised in
# spec/promises/manifest.yaml. JSON Schema 2020-12, within spec/schema-profile.md.
#
# Promises encoded:
#   manifest.v1             MAN-003 (`apiVersion`; no `kind`, `metadata` or `spec`), MAN-004
#                           (the keys; `version` only beside `address`), MAN-005 (`packages`
#                           is a map by address; each item holds `version`, `digest` and
#                           perhaps `fetch`), MAN-006 (`fetch` is a URI reference with no user
#                           information), MAN-007 (each item of `exports` is a name),
#                           MAN-009 (`implementations` is a map by name), MAN-012 (the core
#                           package's own items), NAM-001, NAM-004, NAM-006, PKG-001,
#                           PKG-004, PKG-012, PKG-017
#   implementation-item.v1  MAN-009 and MAN-010 (the keys and their values; exactly one of
#                           `command`, `package` and `remote`; a Package pinned by `fileSha256`,
#                           or an `oci` one by a digest in its `identifier`; `environment` with
#                           `command` or `package`, `packageArguments` with `package` and
#                           `headers` with `remote`), PKG-019, PKG-020 (a plain item gives
#                           `tools` and no `supports`, and an item that is not plain gives no
#                           `tools`), OBJ-016, TPL-003, IFC-043 (an item that is not plain
#                           names no `Authorization` in its `headers`), IFC-044 (an item that
#                           is not plain and is reached by `remote` stands at an `https` URL)
#   server-package.v1       MAN-010 (one Package of server.json, schema 2025-12-11, whose
#                           transport is `stdio` or `streamable-http`), IFC-017
#   server-remote.v1        MAN-010 (one Remote of that schema, whose `type` is
#                           `streamable-http`), IFC-041
#
# The first form below is the manifest of a project or a package. A package's manifest states
# both `address` and `version` (PKG-017), and a submitted project's states `address` where
# MAN-015 requires it, and may state `version` beside it (MAN-004). The second form is the
# core package's own manifest, whose implementations are the engine itself and so state none
# of `command`, `package` and `remote` and no `supports`, the exception that MAN-012 states.
# It is for that one manifest, which is built into the engine: a manifest that is handed
# over for registration and states the core package's address as its own is rejected, and so
# is a package installed at that address (NAM-021).
#
# Open, as OBJ-019 exempts: everything inside an item's `package` or `remote`, whose keys
# server.json defines. The two transcriptions below are as open as server.json's own schema
# is, and leave out its descriptions, its examples and its defaults: a `default` there would
# be applied under SCH-009, which server.json does not intend, and some stand inside `allOf`,
# where SCH-008 rejects one.
#
# Not expressed here, and checked by the engine: that a package holds no instance document
# (MAN-011); that a relative `fetch` or program has a directory to be resolved against, which a
# manifest handed over as a value has not (MAN-006, MAN-010); that the core package's address is
# not listed, and is not stated as its own by a manifest that is handed over (NAM-021); that a
# submitted project that holds a contract or lists an implementation states `address` (MAN-015),
# and not that of an installed package (MAN-016), which hold too of the manifest of the project
# that `replace.v1` hands over with a template (SUB-009); that the address a package states is
# the one it was listed or fetched under (PKG-017); that every export names a document of the
# package (PKG-018, MAN-007), though `uniqueItems` does reject a name that `exports` writes
# twice (PKG-012); that a plain item's `tools` has a key for each operation in `implements`,
# and that a plain item implements no operation of `runtime-provider.v1`, `machine-provider.v1`
# or `package-source.v1` (PKG-020), and that an item reached by `remote` implements none either
# (PKG-030), which tools/check_schemas.py also checks; that a name in `environment`,
# `packageArguments` or `headers` is one that the Package or the Remote declares, and that an
# argument named in `packageArguments` is declared once in the Package's `packageArguments` and
# states no fixed `value` (MAN-010); that no two documents of the project or package share a
# name (NAM-027); everything about digests and installed packages (PKG-003, PKG-021, PKG-022);
# and that there is one manifest, in the right place (MAN-001, MAN-002).
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: manifest.v1
  description: >-
    The manifest of a project or of a package. The form that the core package's address
    selects is for the core package's own manifest alone.
spec:
  anyOf:
    - $ref: '#/$defs/manifest'
    - $ref: '#/$defs/core'
  $defs:
    fetch:
      type: string
      format: uri-reference
      minLength: 1
      not:
        pattern: '^([A-Za-z][A-Za-z0-9+.-]*:)?//[^/?#]*@'
    packages:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#address.v1}
      additionalProperties:
        type: object
        properties:
          version: {$ref: github.com/shrav-k/conduit/core#version.v1}
          digest: {$ref: github.com/shrav-k/conduit/core#digest.v1}
          fetch: {$ref: '#/$defs/fetch'}
        required: [version, digest]
        additionalProperties: false
    exports:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#export-name.v1}
      uniqueItems: true
    manifest:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        address: {$ref: github.com/shrav-k/conduit/core#address.v1}
        version: {$ref: github.com/shrav-k/conduit/core#version.v1}
        packages: {$ref: '#/$defs/packages'}
        exports: {$ref: '#/$defs/exports'}
        implementations:
          type: object
          propertyNames: {$ref: github.com/shrav-k/conduit/core#export-name.v1}
          additionalProperties:
            $ref: github.com/shrav-k/conduit/core#implementation-item.v1
      required: [apiVersion]
      dependentRequired:
        version: [address]
      additionalProperties: false
    core:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        address: {const: github.com/shrav-k/conduit/core}
        version: {$ref: github.com/shrav-k/conduit/core#version.v1}
        exports: {$ref: '#/$defs/exports'}
        implementations:
          type: object
          propertyNames: {$ref: github.com/shrav-k/conduit/core#export-name.v1}
          additionalProperties:
            type: object
            properties:
              implements:
                type: array
                items: {$ref: github.com/shrav-k/conduit/core#selection.v1}
              nodeSelector: {$ref: github.com/shrav-k/conduit/core#labels.v1}
            required: [implements]
            additionalProperties: false
      required: [apiVersion, address, version]
      additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: implementation-item.v1
  description: >-
    One member of a manifest's `implementations`. It is reached by exactly one of `command`, a
    program and its arguments; `package`, one server.json Package, pinned by its `fileSha256`
    or, where its `registryType` is `oci`, by a digest in its `identifier`; and `remote`, one
    server.json Remote reached over Streamable HTTP. `environment`, for a `command` or `package`
    item, maps the name of a variable, `packageArguments`, for a `package` item, an argument
    that the Package declares in its own `packageArguments`, named by its `name` where it is a
    named argument and by its `valueHint` where it is positional, and never one that states a
    fixed `value`, and `headers`, for a `remote` item, the name of a header the Remote declares,
    each to a JSON Pointer into the instance's configuration that supplies the value; no key
    binds the Package's `runtimeArguments`. An existing server that knows nothing of this
    specification is marked `plain: true`, gives `tools` and states no `supports`; an item that
    is not plain gives no `tools`, and, where it is reached by `remote`, stands at an `https`
    URL, since the engine connects to no other, and names no `Authorization`, in any case of
    its letters, in `headers`, since the engine presents its own proof in that header.
    `supports` and `nodeSelector`, a label selector, may each be left out. A template is
    rejected where an item selected for it binds in `environment` a variable that `identity`
    carries in `run.v1`, or where a `remote` item selected for it carries a secret, in a header
    or as the value of `get-secret.v1`, to an `http` URL that the engine does not accept for
    one, or stands at a loopback host that the engine does not accept; none is in this schema,
    since each needs the template.
spec:
  type: object
  properties:
    implements: {$ref: '#/$defs/references'}
    command:
      type: array
      items: {type: string, minLength: 1}
      minItems: 1
    package: {$ref: github.com/shrav-k/conduit/core#server-package.v1}
    remote: {$ref: github.com/shrav-k/conduit/core#server-remote.v1}
    plain: {type: boolean}
    supports: {$ref: '#/$defs/references'}
    tools:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#selection.v1}
      additionalProperties: {type: string, minLength: 1}
    nodeSelector: {$ref: github.com/shrav-k/conduit/core#labels.v1}
    environment: {$ref: '#/$defs/bindings'}
    packageArguments: {$ref: '#/$defs/bindings'}
    headers: {$ref: '#/$defs/bindings'}
  required: [implements]
  additionalProperties: false
  oneOf:
    - required: [command]
    - required: [package]
    - required: [remote]
  dependentRequired:
    packageArguments: [package]
    headers: [remote]
  dependentSchemas:
    environment:
      not: {required: [remote]}
    package:
      properties:
        package:
          if:
            properties:
              registryType: {const: oci}
            required: [registryType]
          then:
            properties:
              identifier: {pattern: '@sha256:[a-f0-9]{64}$'}
          else:
            required: [fileSha256]
  if:
    properties:
      plain: {const: true}
    required: [plain]
  then:
    required: [tools]
    not: {required: [supports]}
  else:
    not: {required: [tools]}
    properties:
      remote:
        properties:
          url: {pattern: '^https://'}
      headers:
        propertyNames:
          not: {pattern: '^[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]$'}
  $defs:
    references:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    bindings:
      type: object
      propertyNames: {minLength: 1}
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#pointer.v1}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: server-package.v1
  description: >-
    One Package, as the schema of the Model Context Protocol Registry's server.json, version
    2025-12-11, gives it: the registry that holds the package, its identifier and version,
    the transport over which the server it starts is reached, the arguments it takes and the
    environment variables it reads. The transport is limited to `stdio` and `streamable-http`,
    over which alone the engine reaches a run. `isSecret` marks a value that is a secret, and
    the client supplies each value.
spec:
  type: object
  properties:
    registryType: {type: string}
    registryBaseUrl: {type: string, format: uri}
    identifier: {type: string}
    version:
      type: string
      minLength: 1
      not: {const: latest}
    fileSha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    runtimeHint: {type: string}
    transport:
      anyOf:
        - type: object
          properties:
            type: {const: stdio}
          required: [type]
        - type: object
          properties:
            type: {const: streamable-http}
            url: {type: string, pattern: "^https?://[^\u0009\u000A\u000B\u000C\u000D\u0020\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]+$"}
            headers:
              type: array
              items: {$ref: '#/$defs/keyValueInput'}
          required: [type, url]
    runtimeArguments:
      type: array
      items: {$ref: '#/$defs/argument'}
    packageArguments:
      type: array
      items: {$ref: '#/$defs/argument'}
    environmentVariables:
      type: array
      items: {$ref: '#/$defs/keyValueInput'}
  required: [registryType, identifier, transport]
  $defs:
    input:
      type: object
      properties:
        description: {type: string}
        isRequired: {type: boolean}
        format: {enum: [string, number, boolean, filepath]}
        value: {type: string}
        isSecret: {type: boolean}
        default: {type: string}
        placeholder: {type: string}
        choices:
          type: array
          items: {type: string}
    inputWithVariables:
      allOf:
        - $ref: '#/$defs/input'
        - type: object
          properties:
            variables:
              type: object
              additionalProperties: {$ref: '#/$defs/input'}
    keyValueInput:
      allOf:
        - $ref: '#/$defs/inputWithVariables'
        - type: object
          properties:
            name: {type: string}
          required: [name]
    argument:
      anyOf:
        - allOf:
            - $ref: '#/$defs/inputWithVariables'
            - type: object
              properties:
                type: {const: positional}
                valueHint: {type: string}
                isRepeated: {type: boolean}
              required: [type]
              anyOf:
                - required: [valueHint]
                - required: [value]
        - allOf:
            - $ref: '#/$defs/inputWithVariables'
            - type: object
              properties:
                type: {const: named}
                name: {type: string}
                isRepeated: {type: boolean}
              required: [type, name]
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: server-remote.v1
  description: >-
    One Remote, as the schema of the Model Context Protocol Registry's server.json, version
    2025-12-11, gives it, limited to the transport `streamable-http`: the URL of a server
    reached over the protocol's Streamable HTTP transport, the headers it takes and the
    variables of its URL, which no implementation item binds. `url` is also a URI as RFC 3986
    gives one, so one that holds a variable is rejected (MAN-010).
spec:
  type: object
  properties:
    type: {const: streamable-http}
    url:
      type: string
      format: uri
      pattern: "^https?://[^\u0009\u000A\u000B\u000C\u000D\u0020\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]+$"
    headers:
      type: array
      items: {$ref: '#/$defs/keyValueInput'}
    variables:
      type: object
      additionalProperties: {$ref: '#/$defs/input'}
  required: [type, url]
  $defs:
    input:
      type: object
      properties:
        description: {type: string}
        isRequired: {type: boolean}
        format: {enum: [string, number, boolean, filepath]}
        value: {type: string}
        isSecret: {type: boolean}
        default: {type: string}
        placeholder: {type: string}
        choices:
          type: array
          items: {type: string}
    keyValueInput:
      allOf:
        - $ref: '#/$defs/input'
        - type: object
          properties:
            name: {type: string}
            variables:
              type: object
              additionalProperties: {$ref: '#/$defs/input'}
          required: [name]
