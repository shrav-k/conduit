# Plan-audit ruling 37 (2026-11-05) first accepted this file, with the core package and the
# manifest's promises; the record is docs/proposals/core-and-schemas/README.md. What the docs
# audit, rounds 2 to 4 of the re-audit and ruling 38 changed since is logged in the records
# that README.md in this directory names.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
#
# The manifest of a project or a package, and one item of its `implementations`. The file's
# name, its keys and the layout of an archive are promised in spec/promises/manifest.yaml.
# JSON Schema 2020-12, within spec/schema-profile.md.
#
# Promises encoded:
#   manifest.v1             MAN-003 (`apiVersion`; no `kind`, `metadata` or `spec`), MAN-004
#                           (the keys; `address` and `version` together), MAN-005
#                           (`packages` is a map by address; each item holds `version`,
#                           `digest` and perhaps `fetch`), MAN-007 and MAN-008 (`exports`, and
#                           a re-export), MAN-009 (`implementations` is a map by name),
#                           MAN-012 (the core package's own items), NAM-006, PKG-001,
#                           PKG-004, PKG-017, PKG-018
#   implementation-item.v1  MAN-009 and MAN-010 (the keys and their values; exactly one of
#                           `command`, `url` and `graph`), PKG-019, PKG-020 (a plain item
#                           gives `tools` and no `supports`, an item that is not plain
#                           gives no `tools`, and an item that states `graph` is never
#                           plain and states no `supports`), TPL-003
#
# The first form below is a manifest that states neither `address` nor `version`, and the
# second one that states both. A package's manifest states both (PKG-017). The manifest of a
# submitted project may state both or neither, and the two keys change nothing there
# (MAN-004). The third form is the core package's own manifest, whose implementations are the
# engine itself and so state no `command`, `url` or `graph`, the exception to PKG-019 that
# MAN-012 states. It is for that one manifest, which is built into the engine: a manifest that
# is handed over for registration and states the core package's address as its own is
# rejected, and so is a package installed at that address (NAM-021).
#
# Not expressed here, and checked by the engine: the rule for a key of `packages` and of
# `implementations` (NAM-001, NAM-004), and for a key of an item's `placement` (MAN-010,
# OBJ-022), because the profile has no keyword that constrains the keys of a map; that a
# package holds no instance document (MAN-011); that `fetch` is a URI reference (MAN-006),
# because the profile has no format for one, so the schema accepts any string that is not
# empty; that a relative `fetch` or program has a directory to be resolved against, which a
# manifest handed over as a value has not (MAN-006, MAN-010); that the core package's address
# is not listed, and is not stated as its own by a manifest that is handed over (NAM-021); that
# a manifest handed to `replace.v1` holds `packages` alone (SUB-009); that the address a
# package states is the one it was listed or fetched under (PKG-017); that every export names a
# document of the package (PKG-018), though `uniqueItems` does reject a name that `exports`
# writes twice (PKG-012); that a re-export names something the other package exports
# (NAM-028); re-export cycles (PKG-014); that a plain item's `tools` has a key for
# each operation in `implements` (PKG-020); that a `graph` item implements exactly the one
# operation it lists (GRA-014); that no two documents of the project or package share a name
# (NAM-027); everything about digests and installed packages (PKG-003, PKG-021, PKG-022); and
# that there is one manifest, in the right place (MAN-001, MAN-002).

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: manifest.v1
  description: >-
    The manifest of a project or of a package. The form that the core package's address
    selects is for the core package's own manifest alone.
spec:
  anyOf:
    - $ref: '#/$defs/project'
    - $ref: '#/$defs/package'
    - $ref: '#/$defs/core'
  $defs:
    packages:
      type: object
      additionalProperties:
        type: object
        properties:
          version: {$ref: github.com/shrav-k/conduit/core#version.v1}
          digest: {$ref: github.com/shrav-k/conduit/core#digest.v1}
          fetch: {type: string, minLength: 1}
        required: [version, digest]
        additionalProperties: false
    exports:
      type: array
      items:
        anyOf:
          - $ref: github.com/shrav-k/conduit/core#export-name.v1
          - $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
      uniqueItems: true
    implementations:
      type: object
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#implementation-item.v1
    project:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        packages: {$ref: '#/$defs/packages'}
        exports: {$ref: '#/$defs/exports'}
        implementations: {$ref: '#/$defs/implementations'}
      required: [apiVersion]
      additionalProperties: false
    package:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        address: {$ref: github.com/shrav-k/conduit/core#address.v1}
        version: {$ref: github.com/shrav-k/conduit/core#version.v1}
        packages: {$ref: '#/$defs/packages'}
        exports: {$ref: '#/$defs/exports'}
        implementations: {$ref: '#/$defs/implementations'}
      required: [apiVersion, address, version]
      additionalProperties: false
    core:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        address: {const: github.com/shrav-k/conduit/core}
        version: {$ref: github.com/shrav-k/conduit/core#version.v1}
        exports: {$ref: '#/$defs/exports'}
        implementations:
          type: object
          additionalProperties:
            type: object
            properties:
              implements: {$ref: '#/$defs/references'}
              supports: {$ref: '#/$defs/references'}
              placement:
                type: object
                additionalProperties:
                  $ref: github.com/shrav-k/conduit/core#applied-requirement.v1
            required: [implements]
            additionalProperties: false
      required: [apiVersion, address, version]
      additionalProperties: false
    references:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#selection.v1}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: implementation-item.v1
  description: >-
    One member of a manifest's `implementations`. It is reached by exactly one of `command`,
    `url` and `graph`. An existing server that knows nothing of this specification is marked
    `plain: true`, gives `tools` and states no `supports`; it is reached by `command` or `url`,
    and an item that states `graph` is never plain, gives no `tools` and states no `supports`: a
    graph supports a requirement where the implementation selected for each of its steps that
    has no `conduit` does. `supports` and `placement` may each be left out. An implementation
    supports a composed requirement when its `supports` lists the composition or every one of
    its constituents.
spec:
  oneOf:
    - type: object
      properties:
        implements: {$ref: '#/$defs/references'}
        command: {$ref: '#/$defs/command'}
        plain: {const: false}
        supports: {$ref: '#/$defs/references'}
        placement: {$ref: '#/$defs/placement'}
      required: [implements, command]
      additionalProperties: false
    - type: object
      properties:
        implements: {$ref: '#/$defs/references'}
        url: {$ref: '#/$defs/url'}
        plain: {const: false}
        supports: {$ref: '#/$defs/references'}
        placement: {$ref: '#/$defs/placement'}
      required: [implements, url]
      additionalProperties: false
    - type: object
      properties:
        implements: {$ref: '#/$defs/references'}
        graph: {$ref: github.com/shrav-k/conduit/core#graph.v1}
        plain: {const: false}
        placement: {$ref: '#/$defs/placement'}
      required: [implements, graph]
      additionalProperties: false
    - type: object
      properties:
        implements: {$ref: '#/$defs/references'}
        command: {$ref: '#/$defs/command'}
        plain: {const: true}
        tools: {$ref: '#/$defs/tools'}
        placement: {$ref: '#/$defs/placement'}
      required: [implements, command, plain, tools]
      additionalProperties: false
    - type: object
      properties:
        implements: {$ref: '#/$defs/references'}
        url: {$ref: '#/$defs/url'}
        plain: {const: true}
        tools: {$ref: '#/$defs/tools'}
        placement: {$ref: '#/$defs/placement'}
      required: [implements, url, plain, tools]
      additionalProperties: false
  $defs:
    references:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    command:
      type: array
      items: {type: string, minLength: 1}
      minItems: 1
    url: {type: string, format: uri}
    tools:
      type: object
      additionalProperties: {type: string, minLength: 1}
    placement:
      type: object
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#applied-requirement.v1}
