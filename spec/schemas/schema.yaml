# Plan-audit ruling 37 (2026-11-05) first accepted this file, with the core package and the
# manifest's promises; the record is docs/proposals/core-and-schemas/README.md. What the docs
# audit, rounds 2 to 4 of the re-audit and ruling 38 changed since is logged in the records
# that README.md in this directory names.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
#
# The schema of a schema: what spec/schema-profile.md permits, written within that profile.
# Every place in a document that holds a schema refers to this contract. JSON Schema 2020-12.
#
# Promises encoded:
#   SCH-002  only the profile's keywords; a misspelled keyword is rejected
#   SCH-003  only the profile's formats
#   SCH-008  `default` only on a property reached through `properties`, never on `items`
#            itself and never anywhere inside `allOf`, `anyOf` or `oneOf`. Whether a `default`
#            is allowed is judged where it is written, in the schema that holds it
#   SCH-015  the three forms of `$ref`: `#` and a JSON Pointer into the same schema, a
#            qualified reference, and `#` and a name for a Schema contract of the same
#            project or package (NAM-022). The forms cannot be confused: a pointer is empty
#            or starts with `/`, and a name starts with a letter
#   CTR-008  the `spec` of a Schema contract is a schema under the profile
#   OBJ-019  the names under `properties` and `$defs`, and the values of `const`, `enum`,
#            `default` and `examples`, are the author's and are not checked
#
# Three definitions carry SCH-008. `schema` is a schema in a place where `default` is not
# accepted. `property` is a schema that is a member of `properties`, where it is. `combined`
# is a schema anywhere inside `allOf`, `anyOf` or `oneOf`, where it is accepted nowhere below.
# A schema is a map or a boolean, as JSON Schema 2020-12 defines.
#
# Not expressed here, and checked by the engine: that a `$ref` resolves, and to a Schema
# contract (SCH-015); that a `pattern` is a regular expression of ECMA-262 (SCH-016); and
# that a number is within the range of SCH-006.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: schema.v1
  description: A schema under the schema profile of this specification.
spec:
  $ref: '#/$defs/schema'
  $defs:
    typeName:
      enum: [object, array, string, number, integer, boolean, 'null']
    type:
      anyOf:
        - $ref: '#/$defs/typeName'
        - type: array
          items: {$ref: '#/$defs/typeName'}
          minItems: 1
          uniqueItems: true
    count: {type: integer, minimum: 0}
    names: {type: array, items: {type: string}, uniqueItems: true}
    format:
      enum: [date-time, date, duration, uri, uuid]
    ref:
      anyOf:
        - type: string
          pattern: '^#(/([^/~]|~[01])*)*$'
        - $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
        - type: string
          pattern: '^#[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*$'
          maxLength: 64
    schema:
      anyOf:
        - type: boolean
        - type: object
          properties:
            type: {$ref: '#/$defs/type'}
            enum: {type: array}
            const: {}
            properties:
              type: object
              additionalProperties: {$ref: '#/$defs/property'}
            required: {$ref: '#/$defs/names'}
            additionalProperties: {$ref: '#/$defs/schema'}
            items: {$ref: '#/$defs/schema'}
            minItems: {$ref: '#/$defs/count'}
            maxItems: {$ref: '#/$defs/count'}
            uniqueItems: {type: boolean}
            minimum: {type: number}
            maximum: {type: number}
            exclusiveMinimum: {type: number}
            exclusiveMaximum: {type: number}
            minLength: {$ref: '#/$defs/count'}
            maxLength: {$ref: '#/$defs/count'}
            pattern: {type: string}
            format: {$ref: '#/$defs/format'}
            title: {type: string}
            description: {type: string}
            examples: {type: array}
            $ref: {$ref: '#/$defs/ref'}
            $defs:
              type: object
              additionalProperties: {$ref: '#/$defs/schema'}
            allOf: {$ref: '#/$defs/branches'}
            anyOf: {$ref: '#/$defs/branches'}
            oneOf: {$ref: '#/$defs/branches'}
          additionalProperties: false
    property:
      anyOf:
        - type: boolean
        - type: object
          properties:
            type: {$ref: '#/$defs/type'}
            enum: {type: array}
            const: {}
            properties:
              type: object
              additionalProperties: {$ref: '#/$defs/property'}
            required: {$ref: '#/$defs/names'}
            additionalProperties: {$ref: '#/$defs/schema'}
            items: {$ref: '#/$defs/schema'}
            minItems: {$ref: '#/$defs/count'}
            maxItems: {$ref: '#/$defs/count'}
            uniqueItems: {type: boolean}
            minimum: {type: number}
            maximum: {type: number}
            exclusiveMinimum: {type: number}
            exclusiveMaximum: {type: number}
            minLength: {$ref: '#/$defs/count'}
            maxLength: {$ref: '#/$defs/count'}
            pattern: {type: string}
            format: {$ref: '#/$defs/format'}
            default: {}
            title: {type: string}
            description: {type: string}
            examples: {type: array}
            $ref: {$ref: '#/$defs/ref'}
            $defs:
              type: object
              additionalProperties: {$ref: '#/$defs/schema'}
            allOf: {$ref: '#/$defs/branches'}
            anyOf: {$ref: '#/$defs/branches'}
            oneOf: {$ref: '#/$defs/branches'}
          additionalProperties: false
    branches:
      type: array
      items: {$ref: '#/$defs/combined'}
      minItems: 1
    combined:
      anyOf:
        - type: boolean
        - type: object
          properties:
            type: {$ref: '#/$defs/type'}
            enum: {type: array}
            const: {}
            properties:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            required: {$ref: '#/$defs/names'}
            additionalProperties: {$ref: '#/$defs/combined'}
            items: {$ref: '#/$defs/combined'}
            minItems: {$ref: '#/$defs/count'}
            maxItems: {$ref: '#/$defs/count'}
            uniqueItems: {type: boolean}
            minimum: {type: number}
            maximum: {type: number}
            exclusiveMinimum: {type: number}
            exclusiveMaximum: {type: number}
            minLength: {$ref: '#/$defs/count'}
            maxLength: {$ref: '#/$defs/count'}
            pattern: {type: string}
            format: {$ref: '#/$defs/format'}
            title: {type: string}
            description: {type: string}
            examples: {type: array}
            $ref: {$ref: '#/$defs/ref'}
            $defs:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            allOf: {$ref: '#/$defs/branches'}
            anyOf: {$ref: '#/$defs/branches'}
            oneOf: {$ref: '#/$defs/branches'}
          additionalProperties: false
