# The schema of a schema: what spec/schema-profile.md permits, written within that profile.
# Every place in a document that holds a schema refers to this contract. JSON Schema 2020-12.
#
# Promises encoded:
#   SCH-002  only the profile's keywords; a misspelled keyword is rejected
#   SCH-003  only the profile's formats
#   SCH-008  `default` only on a property reached through `properties`, never on `items`
#            itself and never anywhere inside `allOf`, `anyOf`, `oneOf`, `not`, `if`,
#            `then`, `else` or `dependentSchemas`. Whether a `default` is allowed is judged
#            where it is written, in the schema that holds it
#   SCH-015  the three forms of `$ref`: `#` and a JSON Pointer into the same schema, a
#            qualified reference, and `#` and a name for a Schema contract of the same
#            project or package (NAM-022). The forms cannot be confused: a pointer is empty
#            or starts with `/`, and a name starts with a letter
#   CTR-008  the `spec` of a Schema contract is a schema under the profile
#   OBJ-019  the names under `properties`, `dependentRequired`, `dependentSchemas` and
#            `$defs`, the patterns under `patternProperties`, and the values of `const`,
#            `enum`, `default` and `examples`, are the author's and are not checked
#
# Three definitions carry SCH-008. `schema` is a schema in a place where `default` is not
# accepted. `property` is a schema that is a member of `properties`, where it is. `combined`
# is a schema anywhere inside one of the eight keywords above, where it is accepted nowhere
# below. Every other applicator, `items`, `prefixItems`, `contains`, `additionalProperties`,
# `patternProperties`, `propertyNames` and a member of `$defs`, holds a `schema`, whose own
# `properties` are again places where a `default` is accepted. A schema is a map or a
# boolean, as JSON Schema 2020-12 defines.
#
# Not expressed here, and checked by the engine: that a `$ref` resolves, and to a Schema
# contract (SCH-015); that a `pattern`, and a key of `patternProperties`, is a regular
# expression of ECMA-262 (SCH-016); that a number is within the range of SCH-006; and where
# `secret-reference.v1` may stand (SEC-001), which tools/check_schemas.py applies itself.
# Standing: draft specification; see spec/README.md for status and coverage.
#
# This file carries no change narrative; the reasons are in the records listed in spec/README.md, 'Where the reasons are'.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: schema.v1
  description: A schema under the schema profile of this specification.
spec:
  $ref: '#/$defs/schema'
  $defs:
    typeName:
      enum: [object, array, string, number, integer, boolean, 'null']
    type:
      anyOf:
        - $ref: '#/$defs/typeName'
        - type: array
          items: {$ref: '#/$defs/typeName'}
          minItems: 1
          uniqueItems: true
    count: {type: integer, minimum: 0}
    names: {type: array, items: {type: string}, uniqueItems: true}
    format:
      enum: [date-time, date, duration, uri, uri-reference, uuid]
    ref:
      anyOf:
        - type: string
          pattern: '^#(/([^/~]|~[01])*)*$'
        - $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
        - type: string
          pattern: '^#[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*$'
          maxLength: 64
    dependencies:
      type: object
      additionalProperties: {$ref: '#/$defs/names'}
    schema:
      anyOf:
        - type: boolean
        - type: object
          properties:
            type: {$ref: '#/$defs/type'}
            enum: {type: array}
            const: {}
            properties:
              type: object
              additionalProperties: {$ref: '#/$defs/property'}
            patternProperties:
              type: object
              additionalProperties: {$ref: '#/$defs/schema'}
            additionalProperties: {$ref: '#/$defs/schema'}
            propertyNames: {$ref: '#/$defs/schema'}
            required: {$ref: '#/$defs/names'}
            dependentRequired: {$ref: '#/$defs/dependencies'}
            dependentSchemas:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            minProperties: {$ref: '#/$defs/count'}
            maxProperties: {$ref: '#/$defs/count'}
            items: {$ref: '#/$defs/schema'}
            prefixItems: {$ref: '#/$defs/list'}
            contains: {$ref: '#/$defs/schema'}
            minContains: {$ref: '#/$defs/count'}
            maxContains: {$ref: '#/$defs/count'}
            minItems: {$ref: '#/$defs/count'}
            maxItems: {$ref: '#/$defs/count'}
            uniqueItems: {type: boolean}
            minimum: {type: number}
            maximum: {type: number}
            exclusiveMinimum: {type: number}
            exclusiveMaximum: {type: number}
            minLength: {$ref: '#/$defs/count'}
            maxLength: {$ref: '#/$defs/count'}
            pattern: {type: string}
            format: {$ref: '#/$defs/format'}
            title: {type: string}
            description: {type: string}
            examples: {type: array}
            $ref: {$ref: '#/$defs/ref'}
            $defs:
              type: object
              additionalProperties: {$ref: '#/$defs/schema'}
            allOf: {$ref: '#/$defs/branches'}
            anyOf: {$ref: '#/$defs/branches'}
            oneOf: {$ref: '#/$defs/branches'}
            not: {$ref: '#/$defs/combined'}
            if: {$ref: '#/$defs/combined'}
            then: {$ref: '#/$defs/combined'}
            else: {$ref: '#/$defs/combined'}
          additionalProperties: false
    property:
      anyOf:
        - type: boolean
        - type: object
          properties:
            type: {$ref: '#/$defs/type'}
            enum: {type: array}
            const: {}
            properties:
              type: object
              additionalProperties: {$ref: '#/$defs/property'}
            patternProperties:
              type: object
              additionalProperties: {$ref: '#/$defs/schema'}
            additionalProperties: {$ref: '#/$defs/schema'}
            propertyNames: {$ref: '#/$defs/schema'}
            required: {$ref: '#/$defs/names'}
            dependentRequired: {$ref: '#/$defs/dependencies'}
            dependentSchemas:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            minProperties: {$ref: '#/$defs/count'}
            maxProperties: {$ref: '#/$defs/count'}
            items: {$ref: '#/$defs/schema'}
            prefixItems: {$ref: '#/$defs/list'}
            contains: {$ref: '#/$defs/schema'}
            minContains: {$ref: '#/$defs/count'}
            maxContains: {$ref: '#/$defs/count'}
            minItems: {$ref: '#/$defs/count'}
            maxItems: {$ref: '#/$defs/count'}
            uniqueItems: {type: boolean}
            minimum: {type: number}
            maximum: {type: number}
            exclusiveMinimum: {type: number}
            exclusiveMaximum: {type: number}
            minLength: {$ref: '#/$defs/count'}
            maxLength: {$ref: '#/$defs/count'}
            pattern: {type: string}
            format: {$ref: '#/$defs/format'}
            default: {}
            title: {type: string}
            description: {type: string}
            examples: {type: array}
            $ref: {$ref: '#/$defs/ref'}
            $defs:
              type: object
              additionalProperties: {$ref: '#/$defs/schema'}
            allOf: {$ref: '#/$defs/branches'}
            anyOf: {$ref: '#/$defs/branches'}
            oneOf: {$ref: '#/$defs/branches'}
            not: {$ref: '#/$defs/combined'}
            if: {$ref: '#/$defs/combined'}
            then: {$ref: '#/$defs/combined'}
            else: {$ref: '#/$defs/combined'}
          additionalProperties: false
    list:
      type: array
      items: {$ref: '#/$defs/schema'}
      minItems: 1
    branches:
      type: array
      items: {$ref: '#/$defs/combined'}
      minItems: 1
    combined:
      anyOf:
        - type: boolean
        - type: object
          properties:
            type: {$ref: '#/$defs/type'}
            enum: {type: array}
            const: {}
            properties:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            patternProperties:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            additionalProperties: {$ref: '#/$defs/combined'}
            propertyNames: {$ref: '#/$defs/combined'}
            required: {$ref: '#/$defs/names'}
            dependentRequired: {$ref: '#/$defs/dependencies'}
            dependentSchemas:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            minProperties: {$ref: '#/$defs/count'}
            maxProperties: {$ref: '#/$defs/count'}
            items: {$ref: '#/$defs/combined'}
            prefixItems: {$ref: '#/$defs/branches'}
            contains: {$ref: '#/$defs/combined'}
            minContains: {$ref: '#/$defs/count'}
            maxContains: {$ref: '#/$defs/count'}
            minItems: {$ref: '#/$defs/count'}
            maxItems: {$ref: '#/$defs/count'}
            uniqueItems: {type: boolean}
            minimum: {type: number}
            maximum: {type: number}
            exclusiveMinimum: {type: number}
            exclusiveMaximum: {type: number}
            minLength: {$ref: '#/$defs/count'}
            maxLength: {$ref: '#/$defs/count'}
            pattern: {type: string}
            format: {$ref: '#/$defs/format'}
            title: {type: string}
            description: {type: string}
            examples: {type: array}
            $ref: {$ref: '#/$defs/ref'}
            $defs:
              type: object
              additionalProperties: {$ref: '#/$defs/combined'}
            allOf: {$ref: '#/$defs/branches'}
            anyOf: {$ref: '#/$defs/branches'}
            oneOf: {$ref: '#/$defs/branches'}
            not: {$ref: '#/$defs/combined'}
            if: {$ref: '#/$defs/combined'}
            then: {$ref: '#/$defs/combined'}
            else: {$ref: '#/$defs/combined'}
          additionalProperties: false
