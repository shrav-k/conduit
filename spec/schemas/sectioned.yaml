          description:
            type: string
          annotations:
            type: object
            additionalProperties:
              type: string
        required:
        - type
        additionalProperties: false
    pools:
      type: object
      propertyNames:
        type: string
        maxLength: 63
        pattern: ^[a-z]([a-z0-9]|-[a-z0-9])*-?$
        not:
