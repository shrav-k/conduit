  additionalProperties: false
  $defs:
    interfaces-reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            allOf:
            - pattern: ^/(conduits/[a-z][a-z0-9-]{0,62}/target|(config|conduits/[a-z][a-z0-9-]{0,62}/arguments)(/([^/~]|~[01])*)*)$
            - not:
                pattern: /-(/|$)
    agents-reaches:
      type: object
      properties:
