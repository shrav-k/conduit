# Sectioned documents, defined by translation into canonical framed documents.
# JSON Schema 2020-12, within spec/schema-profile.md.
# Promises encoded: SCT-001, SCT-002, SCT-005, SCT-006, SCT-007, SCT-009,
# SCT-012, SCT-013, SCT-016; OBJ-019, OBJ-022.
# Checked during translation: version inheritance, missing or conflicting Agent owners,
# at most one fleet per file, shared Fleet generation, SCT-008 targets, generated name
# lengths, cross-document name collisions and an Agent managing only its own Fleet.
# Package files accept only templates and apiVersion (MAN-011).
# The wire's document.v1 remains canonical and does not reference sectioned.v1.
# Standing: draft specification; see spec/README.md for status and coverage.
# The reasons are in the records listed in spec/README.md, Where the reasons are.

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: sectioned.v1
  description: A sectioned documents-file value. Version inheritance, per-file Fleet ownership,
    semantic checks and translation follow SCT-001 to SCT-016.
spec:
  type: object
  properties:
    apiVersion:
      $ref: github.com/shrav-k/conduit/core#api-version.v1
    fleet:
      type: string
      maxLength: 63
      pattern: ^[a-z]([a-z0-9]|-[a-z0-9])*-?$
      not:
        enum:
        - system
        - local
        - management
        - access
        - root
    templates:
      $ref: github.com/shrav-k/conduit/core#sectioned-templates.v1
    interfaces:
      type: object
      propertyNames:
        type: string
        maxLength: 63
        pattern: ^[a-z]([a-z0-9]|-[a-z0-9])*-?$
        not:
          enum:
          - system
          - local
          - management
          - access
          - root
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#sectioned-interface.v1
    agents:
      type: object
      propertyNames:
        type: string
        maxLength: 63
        pattern: ^[a-z]([a-z0-9]|-[a-z0-9])*-?$
        not:
          enum:
          - system
          - local
          - management
          - access
          - root
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#sectioned-agent.v1
    resources:
      type: object
      propertyNames:
        type: string
        maxLength: 63
        pattern: ^[a-z]([a-z0-9]|-[a-z0-9])*-?$
        not:
          enum:
          - system
          - local
          - management
          - access
          - root
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#sectioned-resource.v1
    pools:
      type: object
      propertyNames:
        type: string
        maxLength: 63
        pattern: ^[a-z]([a-z0-9]|-[a-z0-9])*-?$
        not:
          enum:
          - system
          - local
          - management
          - access
          - root
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#sectioned-pool.v1
    conduits:
      type: object
      propertyNames:
        type: string
        maxLength: 63
        pattern: ^[a-z]([a-z0-9]|-[a-z0-9])*-?$
        not:
          enum:
          - system
          - local
          - management
          - access
          - root
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#sectioned-conduit.v1
  additionalProperties: false
  anyOf:
  - required:
    - fleet
  - required:
    - templates
  - required:
    - interfaces
  - required:
    - agents
  - required:
    - resources
  - required:
    - pools
  - required:
    - conduits
---
