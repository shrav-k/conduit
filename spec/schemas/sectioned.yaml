    pools-reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            allOf:
            - pattern: ^/(entries/[a-z][a-z0-9-]{0,62}/(placement|runtime)|(config|entries/[a-z][a-z0-9-]{0,62}/arguments)(/([^/~]|~[01])*)*)$
            - not:
                pattern: /-(/|$)
    conduits-reaches:
      type: object
