# Ruling 42 (docs/proposals/ruling-42/README.md, 2026-11-06), applying rows 26 and 27 of the
# coordinator's decisions in docs/proposals/ruling-41/open-decisions.md, changed only the
# comment below on what the engine checks: a template gives no `runtime` as it gives no
# placement (PLC-005), the label selectors of two items that a template selects agree too
