#
# A template document, and the parts of a template's `spec`.
# JSON Schema 2020-12, within spec/schema-profile.md.
#
# Promises encoded:
#   template.v1               OBJ-012 (the four top-level keys and no other), INS-001 (no
#                             `from`), OBJ-020, OBJ-004
#   template-spec.v1          TPL-001, TPL-002 (`type` is required): the `spec` of an
#                             Interface, an Agent or a Resource template; INS-012, OBJ-022
#   pool-template-spec.v1     TPL-001 (`entries`, and no `conduits`), TPL-002, OBJ-014,
#                             INS-012, POOL-009, OBJ-022
#   conduit-template-spec.v1  CON-016 (`capability` is required, and `operations` unless an
#                             input fills it), CON-017, CON-018, CON-020 (no `consumer` or
#                             `target`), TPL-002 (no `type`), INS-012, OBJ-022
#   template-input.v1         INS-021 (`schema` and a non-empty `to` are required; `default`
#                             and `optional` may be given), OBJ-015 (no `required`; an input
#                             that states a `default` may be left out, marked optional or
#                             not), OBJ-016
#   implementation-map.v1     TPL-003 (each key selects an operation and each value an
#                             implementation), NAM-018
#   template-controls.v1      TPL-010 (each key selects a control; each value may hold
#                             `inputs`, each with a `schema`)
#
# A template that writes `runtimes`, `setup` or `retire` is rejected by these schemas, as any
# key this specification does not define is (TPL-001, OBJ-019): an instance's run is PRV-007,
# and its own work at setup and at retirement is a hook that its `implementation` map selects,
# under TPL-017 and TPL-018.
#
# The places a destination may reach are a closed list (INS-012), and each schema of a
# `spec` carries it as a pattern, under its `$defs`:
#   an Interface, Agent or Resource template   the whole of `config` or a place inside it; a
#                                              declared Conduit's `target`; the whole of a
#                                              declared Conduit's `arguments` or a place
#                                              inside it
#   a Pool template                            the whole of `config` or a place inside it; an
#                                              entry's `placement` or `runtime`; the whole of
#                                              an entry's `arguments` or a place inside it
#   a Conduit template                         `operations`; the whole of the `arguments` of
#                                              an applied requirement or a place inside it
# Every other destination is rejected: among them an item of `operations`, a whole nested
# instantiation, a requirement's `requirement`, and anything under `inputs`.
#
# Open, as OBJ-019 exempts: everything inside `config`, and the value of an input's
# `default`, which is a literal value. `config` may be left out, and a template that writes
# none means the same as one that writes `config: {}` (INS-024). The `arguments` of a nested
# instantiation and of an applied requirement may be left out in the same way, and are then
# present and empty, so that an input's destination may lie inside them. The keys of
# `inputs`, `conduits`, `entries` and `requirements` are names, and the keys of
# `implementation` and `controls` are selections of operations, each a qualified reference or
# `#` and a name (NAM-018, NAM-022): each schema states the form of the key with
# `propertyNames`.
#
# Not expressed here, and checked by the engine: that `type` is a Type contract of the
# template's own family (TPL-002); that destinations do not overlap and that a destination's
# parent is present (INS-010, INS-011); that, where a Conduit template writes no `operations`,
# the destination of one of its inputs is `/operations` (CON-016); that an implementation
# implements the operation it is selected for (TPL-005); default implementations (TPL-004); that
# the selected implementations include at most one item that is run (TPL-019), that their label
# selectors agree with the type's and with each other's (PLC-025) and that their pointers name
# places the type's schema requires, at which it admits no object or array (MAN-017); that no
# selected item binds in its `environment` a variable that `identity` carries (MAN-018), and
# that no selected `remote` item sends a header that carries a secret to an `http` URL whose
# host is not a loopback address, or, on an engine that can restart on another machine or run
# as several parts, to any `http` URL (SEC-024); that a control is one the type lists and an
# input one the control declares (TPL-010); that an operation is in the capability (CON-017);
# that a requirement's arguments fit its inputs (NAM-019); that a Conduit template applies the
# bound of a right to open at most once, which is checked when the template is registered
# (CON-028); that no Conduit lists an operation of a provider capability other than
# `secret-provider.v1` (PRV-004); cycles among entries (POOL-011); that a template gives no
# placement and no `runtime`, which leaves only the `default` of an input whose destination is
# an entry's `placement` or `runtime` (PLC-005); and that `config`, once filled, satisfies the
# type's schema (INS-014).

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template.v1
  description: A template document of any of the five families.
spec:
  anyOf:
    - $ref: '#/$defs/consumer'
    - $ref: '#/$defs/pool'
    - $ref: '#/$defs/conduit'
  $defs:
    consumer:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {enum: [Interface, Agent, Resource]}
        metadata: {$ref: github.com/shrav-k/conduit/core#template-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#template-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    pool:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Pool}
        metadata: {$ref: github.com/shrav-k/conduit/core#template-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#pool-template-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    conduit:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Conduit}
        metadata: {$ref: github.com/shrav-k/conduit/core#template-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#conduit-template-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template-spec.v1
  description: The `spec` of an Interface, an Agent or a Resource template.
spec:
  type: object
  properties:
    type: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    inputs:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#name.v1}
      additionalProperties:
        allOf:
          - $ref: github.com/shrav-k/conduit/core#template-input.v1
          - $ref: '#/$defs/reaches'
    config: {type: object}
    implementation: {$ref: github.com/shrav-k/conduit/core#implementation-map.v1}
    controls: {$ref: github.com/shrav-k/conduit/core#template-controls.v1}
    conduits:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#name.v1}
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#declared-conduit.v1}
  required: [type]
  additionalProperties: false
  $defs:
    reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            pattern: "^/(conduits/[a-z][a-z0-9-]{0,62}/target|\
              (config|conduits/[a-z][a-z0-9-]{0,62}/arguments)\
              (/(?!-(/|$))([^/~]|~[01])*)*)$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: pool-template-spec.v1
  description: The `spec` of a Pool template.
spec:
  type: object
  properties:
    type: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    inputs:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#name.v1}
      additionalProperties:
        allOf:
          - $ref: github.com/shrav-k/conduit/core#template-input.v1
          - $ref: '#/$defs/reaches'
    config: {type: object}
    implementation: {$ref: github.com/shrav-k/conduit/core#implementation-map.v1}
    controls: {$ref: github.com/shrav-k/conduit/core#template-controls.v1}
    entries:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#name.v1}
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#pool-entry.v1}
  required: [type]
  additionalProperties: false
  $defs:
    reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            pattern: "^/(entries/[a-z][a-z0-9-]{0,62}/(placement|runtime)|\
              (config|entries/[a-z][a-z0-9-]{0,62}/arguments)\
              (/(?!-(/|$))([^/~]|~[01])*)*)$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: conduit-template-spec.v1
  description: >-
    The `spec` of a Conduit template, with one capability. It writes `operations`, or else
    declares `inputs`, one of which fills `operations`. An input may fill `operations` or the
    `arguments` of an applied requirement.
spec:
  type: object
  properties:
    inputs:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#name.v1}
      additionalProperties:
        allOf:
          - $ref: github.com/shrav-k/conduit/core#template-input.v1
          - $ref: '#/$defs/reaches'
    capability: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    operations:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    requirements:
      type: object
      propertyNames: {$ref: github.com/shrav-k/conduit/core#name.v1}
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#applied-requirement.v1
  required: [capability]
  additionalProperties: false
  anyOf:
    - required: [operations]
    - required: [inputs]
  $defs:
    reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            pattern: "^/(operations|requirements/[a-z][a-z0-9-]{0,62}/arguments\
              (/(?!-(/|$))([^/~]|~[01])*)*)$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template-input.v1
  description: >-
    One member of a template's `inputs`. An input that states a `default` may be left out,
    whether or not it is marked `optional: true`.
spec:
  type: object
  properties:
    schema: {$ref: github.com/shrav-k/conduit/core#schema.v1}
    to:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#destination.v1}
      minItems: 1
    default: {}
    optional: {type: boolean}
  required: [schema, to]
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: implementation-map.v1
  description: >-
    The `implementation` map of a template or of a Type contract. Each key selects an
    operation, by a qualified reference or, for an operation of the same project or package,
    by `#` and its name, and each value selects an implementation in the same way. A setup
    hook and a retire hook are selected here like any operation.
spec:
  type: object
  propertyNames: {$ref: github.com/shrav-k/conduit/core#selection.v1}
  additionalProperties: {$ref: github.com/shrav-k/conduit/core#selection.v1}
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template-controls.v1
  description: >-
    The `controls` map of a template. Each key selects a control of the template's type, by a
    qualified reference or, for a control of the same project or package, by `#` and its name.
    Each value may narrow that control's inputs, each named as the control's `inputSchema`
    names it.
spec:
  type: object
  propertyNames: {$ref: github.com/shrav-k/conduit/core#selection.v1}
  additionalProperties:
    type: object
    properties:
      inputs:
        type: object
        propertyNames: {minLength: 1}
        additionalProperties:
          type: object
          properties:
            schema: {$ref: github.com/shrav-k/conduit/core#schema.v1}
          required: [schema]
          additionalProperties: false
    additionalProperties: false
