# Accepted by the owner on 2026-11-05 (plan-audit ruling 37), with the core package and the
# manifest's promises; the record is docs/proposals/core-and-schemas/README.md.
#
# A template document, and the parts of a template's `spec`.
# JSON Schema 2020-12, within spec/schema-profile.md.
#
# Promises encoded:
#   template.v1               OBJ-012 (the four top-level keys and no other), INS-001 (no
#                             `from`), OBJ-020, OBJ-004
#   template-spec.v1          TPL-001, TPL-002 (`type` is required): the `spec` of an
#                             Interface, an Agent or a Resource template; INS-012
#   pool-template-spec.v1     TPL-001 (`entries`, and no `conduits`), TPL-002, POOL-012,
#                             INS-012
#   conduit-template-spec.v1  CON-016 (either `capability`, `operations` and `requirements`,
#                             or `components`, never both; a template that is not composed
#                             requires `capability`, and `operations` unless an input fills
#                             it), CON-017, CON-018, CON-019, CON-020 (no `consumer` or
#                             `target`), TPL-002 (no `type`), INS-012
#   template-input.v1         INS-021 (`schema` and a non-empty `to` are required; `default`
#                             and `optional` may be given), OBJ-015 (no `required`), OBJ-016
#   implementation-map.v1     TPL-003 (each value is a string or a graph written in place)
#   runtime.v1                TPL-006 (`start`, `stop`, perhaps `optional`), TPL-003
#   template-controls.v1      TPL-010 (each value may hold `inputs`, each with a `schema`)
#
# The places a destination may reach are a closed list (INS-012), and each of the three
# schemas of a `spec` carries it as one pattern, under its `$defs` as `reaches`:
#   an Interface, Agent or Resource template   the whole of `config` or a place inside it; a
#                                              declared Conduit's `target`; the whole of a
#                                              declared Conduit's `arguments` or a place
#                                              inside it
#   a Pool template                            the whole of `config` or a place inside it; an
#                                              entry's `placement`; the whole of an entry's
#                                              `arguments` or a place inside it
#   a Conduit template                         `operations`; the whole of the `arguments` of
#                                              an applied requirement or of a component, or
#                                              a place inside it
# Every other destination is rejected: among them an item of `operations`, a whole nested
# instantiation, a requirement's `requirement`, and anything under `inputs`.
#
# Open, as OBJ-019 exempts: everything inside `config`, and the value of an input's
# `default`, which is a literal value. `config` may be left out, and a template that writes
# none means the same as one that writes `config: {}` (INS-024). The keys of `inputs`,
# `conduits`, `entries`, `runtimes`, `requirements` and `components` are names; the keys of
# `implementation` and `controls` are selections of operations, each a qualified reference
# or `#` and a name (NAM-018, NAM-022).
#
# Not expressed here, and checked by the engine: the rule for the name of a member of a named
# map, and the form of a key of `implementation` or `controls` (OBJ-022, TPL-003, TPL-010),
# because the profile has no keyword that constrains the keys of a map; that `type` is a Type
# contract of the template's own family (TPL-002); that destinations do not overlap and that
# a destination's parent is present (INS-010, INS-011); that, where a Conduit template that
# is not composed writes no `operations`, the destination of one of its inputs is
# `/operations` (CON-016); that an implementation implements the operation it is selected
# for (TPL-005); default implementations (TPL-004); the shape of a runtime's operations
# (TPL-006); that a control is one the type lists and an input one the control declares
# (TPL-010); that an operation is in the capability (CON-017); that a requirement may be
# applied to a Conduit and that its arguments fit its inputs (CTR-005, NAM-019); that a
# Conduit template applies the bound of a right to open at most once (CON-028); cycles among
# components (CON-019) and among entries (POOL-011); that a template names no location
# (PLC-005); and that `config`, once filled, satisfies the type's schema (INS-014).

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template.v1
  description: A template document of any of the five families.
spec:
  anyOf:
    - $ref: '#/$defs/consumer'
    - $ref: '#/$defs/pool'
    - $ref: '#/$defs/conduit'
  $defs:
    consumer:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {enum: [Interface, Agent, Resource]}
        metadata: {$ref: github.com/shrav-k/conduit/core#template-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#template-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    pool:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Pool}
        metadata: {$ref: github.com/shrav-k/conduit/core#template-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#pool-template-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
    conduit:
      type: object
      properties:
        apiVersion: {$ref: github.com/shrav-k/conduit/core#api-version.v1}
        kind: {const: Conduit}
        metadata: {$ref: github.com/shrav-k/conduit/core#template-metadata.v1}
        spec: {$ref: github.com/shrav-k/conduit/core#conduit-template-spec.v1}
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template-spec.v1
  description: The `spec` of an Interface, an Agent or a Resource template.
spec:
  type: object
  properties:
    type: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    inputs:
      type: object
      additionalProperties:
        allOf:
          - $ref: github.com/shrav-k/conduit/core#template-input.v1
          - $ref: '#/$defs/reaches'
    config: {type: object}
    implementation: {$ref: github.com/shrav-k/conduit/core#implementation-map.v1}
    runtimes:
      type: object
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#runtime.v1}
    setup: {$ref: github.com/shrav-k/conduit/core#lifecycle-graph.v1}
    retire: {$ref: github.com/shrav-k/conduit/core#lifecycle-graph.v1}
    controls: {$ref: github.com/shrav-k/conduit/core#template-controls.v1}
    conduits:
      type: object
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#declared-conduit.v1}
  required: [type]
  additionalProperties: false
  $defs:
    reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            pattern: "^/(conduits/[a-z][a-z0-9-]{0,62}/target|\
              (config|conduits/[a-z][a-z0-9-]{0,62}/arguments)\
              (/(?!-(/|$))([^/~]|~[01])*)*)$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: pool-template-spec.v1
  description: The `spec` of a Pool template.
spec:
  type: object
  properties:
    type: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    inputs:
      type: object
      additionalProperties:
        allOf:
          - $ref: github.com/shrav-k/conduit/core#template-input.v1
          - $ref: '#/$defs/reaches'
    config: {type: object}
    implementation: {$ref: github.com/shrav-k/conduit/core#implementation-map.v1}
    runtimes:
      type: object
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#runtime.v1}
    setup: {$ref: github.com/shrav-k/conduit/core#lifecycle-graph.v1}
    retire: {$ref: github.com/shrav-k/conduit/core#lifecycle-graph.v1}
    controls: {$ref: github.com/shrav-k/conduit/core#template-controls.v1}
    entries:
      type: object
      additionalProperties: {$ref: github.com/shrav-k/conduit/core#pool-entry.v1}
  required: [type]
  additionalProperties: false
  $defs:
    reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            pattern: "^/(entries/[a-z][a-z0-9-]{0,62}/placement|\
              (config|entries/[a-z][a-z0-9-]{0,62}/arguments)\
              (/(?!-(/|$))([^/~]|~[01])*)*)$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: conduit-template-spec.v1
  description: >-
    The `spec` of a Conduit template: a single Conduit, with one capability, or a composite,
    with components. A single Conduit template writes `operations`, or else declares `inputs`,
    one of which fills `operations`.
spec:
  oneOf:
    - type: object
      properties:
        inputs: {$ref: '#/$defs/inputs'}
        capability: {$ref: github.com/shrav-k/conduit/core#selection.v1}
        operations: {$ref: '#/$defs/operations'}
        requirements: {$ref: '#/$defs/requirements'}
      required: [capability, operations]
      additionalProperties: false
    - type: object
      properties:
        inputs: {$ref: '#/$defs/inputs'}
        capability: {$ref: github.com/shrav-k/conduit/core#selection.v1}
        requirements: {$ref: '#/$defs/requirements'}
      required: [capability, inputs]
      additionalProperties: false
    - type: object
      properties:
        inputs: {$ref: '#/$defs/inputs'}
        components:
          type: object
          additionalProperties:
            $ref: github.com/shrav-k/conduit/core#conduit-component.v1
      required: [components]
      additionalProperties: false
  $defs:
    inputs:
      type: object
      additionalProperties:
        allOf:
          - $ref: github.com/shrav-k/conduit/core#template-input.v1
          - $ref: '#/$defs/reaches'
    operations:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    requirements:
      type: object
      additionalProperties:
        $ref: github.com/shrav-k/conduit/core#applied-requirement.v1
    reaches:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
            pattern: "^/(operations|(requirements|components)/[a-z][a-z0-9-]{0,62}/arguments\
              (/(?!-(/|$))([^/~]|~[01])*)*)$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template-input.v1
  description: One member of a template's `inputs`.
spec:
  type: object
  properties:
    schema: {$ref: github.com/shrav-k/conduit/core#schema.v1}
    to:
      type: array
      items: {$ref: github.com/shrav-k/conduit/core#destination.v1}
      minItems: 1
    default: {}
    optional: {type: boolean}
  required: [schema, to]
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: implementation-map.v1
  description: >-
    The `implementation` map of a template or of a Type contract. Each key selects an
    operation, by a qualified reference or, for an operation of the same project or package,
    by `#` and its name. Each value selects an implementation, or is a graph written in place.
spec:
  type: object
  additionalProperties:
    anyOf:
      - $ref: github.com/shrav-k/conduit/core#selection.v1
      - $ref: github.com/shrav-k/conduit/core#graph.v1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: runtime.v1
  description: One member of the `runtimes` of a template or of a Type contract.
spec:
  type: object
  properties:
    start: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    stop: {$ref: github.com/shrav-k/conduit/core#selection.v1}
    optional: {type: boolean}
  required: [start, stop]
  additionalProperties: false
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: template-controls.v1
  description: >-
    The `controls` map of a template. Each key selects a control of the template's type, by a
    qualified reference or, for a control of the same project or package, by `#` and its name.
    Each value may narrow that control's inputs.
spec:
  type: object
  additionalProperties:
    type: object
    properties:
      inputs:
        type: object
        additionalProperties:
          type: object
          properties:
            schema: {$ref: github.com/shrav-k/conduit/core#schema.v1}
          required: [schema]
          additionalProperties: false
    additionalProperties: false
