# The names of ruling 42 (the vocabulary audit's N1; log
# docs/proposals/ruling-42/log-rename-b.md) renamed `secret-reveal.v1` to `secret-provider.v1`
# in the comment below.
# Ruling 43 (docs/proposals/ruling-43/README.md, 2026-11-06) changed only the comment below on
# what the engine checks: no selected item binds a variable of `identity` (MAN-018), and no
