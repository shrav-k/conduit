# Plan-audit ruling 37 (2026-11-05) first accepted this file, with the core package and the
# manifest's promises; the record is docs/proposals/core-and-schemas/README.md. What the docs
# audit, rounds 2 to 4 of the re-audit and ruling 38 changed since is logged in the records
# that README.md in this directory names.
# Standing: the owner accepted this file as it stands at ruling 39
# (docs/proposals/ruling-39/README.md), which accepted every logged decision of the coordinator
# and choice of an editor.
# Ruling 41 (docs/proposals/ruling-41/README.md, 2026-11-06), applying ruling 40 and the
# principles review, changed `revision.v1` to an opaque string (alignment C21) and `id.v1`'s
# description, which no longer names a policy (decision 3a), and added `label-selector.v1`
# (decision 8a). The log is docs/proposals/ruling-41/log-core.md.
# The names of ruling 42 (the vocabulary audit's N8 and N10; log
# docs/proposals/ruling-42/log-rename-a.md) renamed `label-selector.v1` to `labels.v1`, a map
# from a label to its value that holds both the labels reported for a machine and a label
# selector, and moved the rule that an empty selector selects every node out of its description,
# since CTR-004 and the row label selector state it.
#
# The small values that the other schemas share. Each document below is a Schema contract of
# the core package (CTR-008), so that another schema can refer to it with a `$ref` that is a
# qualified reference (SCH-015). JSON Schema 2020-12, within spec/schema-profile.md.
#
# Promises encoded:
#   name.v1                 OBJ-001, OBJ-022 (the schemas of documents state the rule for a
#                           member of a named map with `propertyNames` and this contract)
#   export-name.v1          NAM-004
#   contract-name.v1        CTR-001 (at least one segment, then the version segment), NAM-004
#                           (the pattern of a version segment is choice C5 of the record)
#   address.v1              NAM-001 (a label of the host is at most 63 characters; a path
#                           segment starts with a letter or a digit)
#   qualified-reference.v1  NAM-002, NAM-001, NAM-004, NAM-005
#   selection.v1            NAM-018, NAM-022
#   pointer.v1              OBJ-016
#   destination.v1          OBJ-016 (a destination does not use the `-` token), INS-021. It
#                           checks the form only: the places a destination may reach are a
#                           closed list (INS-012), carried by the schema of each kind of
#                           template `spec` in templates.yaml
#   version.v1              PKG-001
#   digest.v1               PKG-004
#   id.v1                   OBJ-009, IFC-006 (its type is a choice)
#   revision.v1             REV-001 (an opaque non-empty string, compared only for equality)
#   labels.v1               PLC-007, CTR-004, MAN-010, OBJ-022 (a key is a label in the
#                           syntax of a Kubernetes label key, and not a name), PRV-014
#
# Not expressed here, and checked by the engine: everything about what a reference resolves
# to, and whether the labels reported for a node match a selector (PLC-007, PLC-025).

apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: name.v1
  description: >-
    The name of a template or an instance of one of the five families, and a name a document
    chooses for a member of a named map.
spec:
  type: string
  pattern: '^[a-z][a-z0-9-]*$'
  maxLength: 63
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: export-name.v1
  description: The name of something a package exports.
spec:
  type: string
  pattern: '^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*$'
  maxLength: 63
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: contract-name.v1
  description: >-
    The name of a contract. It is an export name of two or more segments whose last segment
    is the contract's compatibility version, written `v` and a whole number from 1.
spec:
  type: string
  pattern: '^([a-z][a-z0-9-]*\.)+v[1-9][0-9]*$'
  maxLength: 63
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: address.v1
  description: >-
    The address of a package. A host name as RFC 1123 gives it, in lowercase, with at least one
    dot, no port and no trailing dot, whose labels are each at most 63 characters and whose
    last label is not a number; then path segments. A path segment starts with a lowercase
    letter or a digit and holds only lowercase letters, digits, `-`, `_` and `.`, so neither
    `.` nor `..` is one. An internationalized name is written with its `xn--` labels.
spec:
  type: string
  pattern: "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+(?![0-9]+(/|$))\
    [a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(/[a-z0-9][a-z0-9._-]*)*$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: qualified-reference.v1
  description: >-
    A package's address, as `address.v1` gives one, then `#`, then the name of one of its
    exports. It never carries a version.
spec:
  type: string
  pattern: "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+(?![0-9]+([/#]|$))\
    [a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(/[a-z0-9][a-z0-9._-]*)*\
    #(?=.{1,63}$)[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)*$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: selection.v1
  description: >-
    How a document selects a type, a capability, an operation, a requirement or an
    implementation. A qualified reference, or `#` and a name for something in the same project
    or package. The value of `from` is not a selection: its forms are `template-reference.v1`.
spec:
  anyOf:
    - $ref: github.com/shrav-k/conduit/core#qualified-reference.v1
    - type: string
      pattern: '^#[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)*$'
      maxLength: 64
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: pointer.v1
  description: A JSON Pointer in the string form of RFC 6901, section 3.
spec:
  type: string
  pattern: '^(/([^/~]|~[01])*)*$'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: destination.v1
  description: >-
    A destination of a template's input. A JSON Pointer whose root is the template's `spec`. It
    has at least one token, and no token is `-`. Which places it may reach depends on the kind
    of template and is stated by the schema of that template's `spec`.
spec:
  type: string
  pattern: '^(/(?!-(/|$))([^/~]|~[01])*)+$'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: version.v1
  description: A version of a package, as Semantic Versioning 2.0.0 gives it.
spec:
  type: string
  pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\
    (-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)\
    (\\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?\
    (\\+[0-9a-zA-Z-]+(\\.[0-9a-zA-Z-]+)*)?$"
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: digest.v1
  description: A SHA-256 digest, written `sha256:` and 64 lowercase hexadecimal digits.
spec:
  type: string
  pattern: '^sha256:[0-9a-f]{64}$'
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: id.v1
  description: >-
    An ID the engine gave: of an object or of an invocation. It is opaque to whoever receives
    it. An object's ID appears in the resolved form of a reference, `{kind, id}`, which only
    the engine writes.
spec:
  type: string
  minLength: 1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: revision.v1
  description: >-
    The revision of a template or an instance. It is opaque, as an HTTP entity tag is, and two
    revisions are compared only for equality: nothing is read from its form.
spec:
  type: string
  minLength: 1
---
apiVersion: github.com/shrav-k/conduit/v0
kind: Schema
metadata:
  name: labels.v1
  description: >-
    A map from a label to its value, the shape of Kubernetes labels and of a `nodeSelector`.
    It holds the labels reported for a machine, and a label selector, whose labels the labels
    reported for a node must hold with the values it gives. A key has the syntax of a
    Kubernetes label key, an optional prefix that is a DNS subdomain and a `/`, then a name of
    at most 63 characters; a value has the syntax of a Kubernetes label value.
spec:
  type: object
  propertyNames:
    type: string
    maxLength: 317
    pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?\
      [A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$"
  additionalProperties:
    type: string
    maxLength: 63
    pattern: '^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$'
